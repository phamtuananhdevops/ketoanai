nit\":\"Đơn vị chủ quản\",\"unitContent\":\"Bộ Tư pháp\",\"address\":\"Địa chỉ\",\"addressContent\":\"Số 60 Trần Phú - Ba Đình - Thành phố Hà Nội\",\"phoneNumber\":\"Điện thoại\",\"phoneNumberContent\":\"024.6273.9468\",\"fax\":\"Fax\",\"faxContent\":\"024.6273.9359\"},\"underConstruction\":{\"title\":\"Đang cập nhật\",\"message\":\"Chức năng này đang được phát triển.\"},\"gioiThieu\":{\"timeline\":{\"2005\":{\"description\":\"Năm 2005 đánh dấu sự khởi đầu của dự án xây dựng Cơ sở dữ liệu quốc gia về pháp luật, với mục tiêu số hóa và tập trung hóa các văn bản pháp luật của Việt Nam.\"},\"2012-2013\":{\"description\":\"Giai đoạn 2012-2013 là thời kỳ phát triển và mở rộng hệ thống, với việc tích hợp thêm nhiều tính năng và cải thiện giao diện người dùng.\"},\"2023-2025\":{\"description\":\"Giai đoạn 2023-2025 tập trung vào việc nâng cấp và hiện đại hóa hệ thống, áp dụng các công nghệ mới và mở rộng phạm vi phục vụ.\"}},\"overview\":{\"title\":\"SƠ LƯỢC MÔ HÌNH CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"CSDLQG về pháp luật tập hợp các văn bản quy phạm pháp luật và văn bản hợp nhất văn bản quy phạm pháp luật (sau đây gọi chung là văn bản) dưới dạng văn bản điện tử do Chính phủ thống nhất quản lý, có địa chỉ truy cập vbpl.vn, bao gồm các Cơ sở dữ liệu thành phần: Cơ sở dữ liệu văn bản pháp luật Trung ương và Cơ sở dữ liệu văn bản pháp luật địa phương.\",\"central\":{\"title\":\"Cơ sở dữ liệu Văn bản pháp luật Trung ương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của các Bộ, cơ quan ngang Bộ, cơ quan nhà nước khác ở Trung ương ban hành hoặc phối hợp ban hành. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật; Văn bản hợp nhất; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"local\":{\"title\":\"Cơ sở dữ liệu văn bản pháp luật địa phương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của từng tỉnh, thành phố trực thuộc Trung ương trên toàn quốc. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật của Hội đồng nhân dân và Ủy ban nhân dân; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"other\":{\"title\":\"Các chuyên mục khác\",\"content\":\"Ngoài các Cơ sở dữ liệu thành phần kể trên, CSDLQG về pháp luật còn có các chuyên mục khác như: Giới thiệu văn bản mới, Tin tức, Tình huống pháp luật. Ngoài ra, CSDLQG về thủ tục hành chính, bộ pháp điển điện tử, cổng thông tin điện tử Bộ Tư pháp cũng trích xuất về CSDLQG về pháp luật.\"}},\"vision\":{\"title\":\"Tầm nhìn\",\"content\":\"Trở thành nguồn tra cứu văn bản pháp luật chính thống, đầy đủ và đáng tin cậy, phục vụ hiệu quả cho người dân, doanh nghiệp và cơ quan nhà nước.\"},\"mission\":{\"title\":\"Sứ mệnh\",\"content\":\"Cung cấp hệ thống văn bản pháp luật được cập nhật kịp thời, tra cứu thuận tiện, góp phần nâng cao nhận thức pháp luật và bảo đảm việc tuân thủ pháp luật trong xã hội.\"},\"features\":{\"title\":\"MỘT SỐ TÍNH NĂNG, TIỆN ÍCH CỦA CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"Hiện nay, CSDLQG về PL có giao diện tương đối thân thiện, dễ tìm kiếm, dễ khai thác các thông tin và tải về sử dụng. Cơ sở dữ liệu cung cấp các chức năng, tiện ích cơ bản và thuận tiện\",\"list\":[{\"key\":\"fullText\",\"label\":\"Tra cứu toàn văn\",\"icon\":\"SearchOutlined\"},{\"key\":\"tableOfContents\",\"label\":\"Tự động tạo mục lục\",\"icon\":\"BookOutlined\"},{\"key\":\"relatedDocuments\",\"label\":\"Liên kết văn bản liên quan\",\"icon\":\"LinkOutlined\"},{\"key\":\"validity\",\"label\":\"Xác định hiệu lực tự động\",\"icon\":\"BarChartOutlined\"},{\"key\":\"validityHistory\",\"label\":\"Lịch sử hiệu lực\",\"icon\":\"ClockCircleOutlined\"},{\"key\":\"download\",\"label\":\"Tải văn bản\",\"icon\":\"DownloadOutlined\"},{\"key\":\"english\",\"label\":\"Xem văn bản tiếng Anh\",\"icon\":\"GlobalOutlined\"},{\"key\":\"centralLocal\",\"label\":\"Liên kết văn bản Trung ương – địa phương\",\"icon\":\"ShareAltOutlined\"},{\"key\":\"diagram\",\"label\":\"Lược đồ văn bản\",\"icon\":\"FileTextOutlined\"}]}},\"mostViewed\":{\"title\":\"Văn bản được xem nhiề =\"Arial\"\u003e\u003cb\u003eChương I\u003c/b\u003e\u003c/font\u003e\u003c/p\u003e\n\u003cp align=\"center\" style=\"text-align:center;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e\u003cb\u003eNHỮNG QUY ĐỊNH CHUNG\u003c/b\u003e\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e\u003cb\u003eĐiều 1. Phạm vi điều chỉnh\u003c/b\u003e\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eLuật này quy định về đối tượng chịu thuế, đối tượng không chịu thuế, người nộp thuế, căn cứ và phương pháp tính thuế, khấu trừ và hoàn thuế giá trị gia tăng.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont face=\"Arial\"\u003e\u003cb\u003e\u003cfont size=\"2\"\u003eĐiều 2.\u003c/font\u003e\u003c/b\u003e\u003cfont size=\"2\"\u003e \u003c/font\u003e \u003cb\u003e\u003cfont size=\"2\"\u003eThuế giá trị gia tăng\u003c/font\u003e\u003c/b\u003e\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eThuế giá trị gia tăng là thuế tính trên giá trị tăng thêm của hàng hóa, dịch vụ phát sinh trong quá trình từ sản xuất, lưu thông đến tiêu dùng.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont face=\"Arial\"\u003e\u003cb\u003e\u003cfont size=\"2\"\u003eĐiều 3.\u003c/font\u003e\u003c/b\u003e\u003cfont size=\"2\"\u003e \u003c/font\u003e \u003cb\u003e\u003cfont size=\"2\"\u003eĐối tượng chịu thuế\u003c/font\u003e\u003c/b\u003e\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eHàng hóa, dịch vụ sử dụng cho sản xuất, kinh doanh và tiêu dùng ở Việt Nam là đối tượng chịu thuế giá trị gia tăng, trừ các đối tượng quy định tại Điều 5 của Luật này.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e\u003cb\u003eĐiều 4. Người nộp thuế\u003c/b\u003e\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eNgười nộp thuế giá trị gia tăng là tổ chức, cá nhân sản xuất, kinh doanh hàng hóa, dịch vụ chịu thuế giá trị gia tăng (sau đây gọi là cơ sở kinh doanh) và tổ chức, cá nhân nhập khẩu hàng hóa chịu thuế giá trị gia tăng (sau đây gọi là người nhập khẩu).\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e\u003cb\u003eĐiều 5. Đối tượng không chịu thuế\u003c/b\u003e\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e1. Sản phẩm trồng trọt, chăn nuôi, thủy sản nuôi trồng, đánh bắt chưa chế biến thành các sản phẩm khác hoặc chỉ qua sơ chế thông thường của tổ chức, cá nhân tự sản xuất, đánh bắt bán ra và ở khâu nhập khẩu.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e2. Sản phẩm là giống vật nuôi, giống cây trồng, bao gồm trứng giống, con giống, cây giống, hạt giống, tinh dịch, phôi, vật liệu di truyền.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e3. Tưới, tiêu nước; cày, bừa đất; nạo vét kênh, mương nội đồng phục vụ sản xuất nông nghiệp; dịch vụ thu hoạch sản phẩm nông nghiệp.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e4. Sản phẩm muối được sản xuất từ nước biển, muối mỏ tự nhiên, muối tinh, muối i-ốt.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e5. Nhà ở thuộc sở hữu Nhà nước do Nhà nước bán cho người đang thuê.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e6. Chuyển quyền sử dụng đất\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e7. Bảo hiểm nhân thọ, bảo hiểm người học, bảo hiểm vật nuôi, bảo hiểm cây trồng và tái bảo hiểm.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e8. Dịch vụ cấp tín dụng; kinh doanh chứng khoán; chuyển nhượng vốn; dịch vụ tài chính phát sinh, bao gồm hoán đổi lãi suất, hợp đồng kỳ hạn, hợp đồng tương lai, quyền chọn mua, bán ngoại tệ và các dịch vụ tài chính phát sinh khác theo quy định của pháp luật.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e9. Dịch vụ y tế, dịch vụ thú y, bao gồm dịch vụ khám bệnh, chữa bệnh, phòng bệnh cho người và vật nuôi.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e10. Dịch vụ bưu chính, viễn thông công ích và In-ter-net phổ cập theo chương trình của Chính phủ.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e11. Dịch vụ phục vụ công cộng về vệ sinh, thoát nước đường phố và khu dân cư; duy trì vườn thú, vườn hoa, công viên, cây xanh đường phố, chiếu sáng công cộng; dịch vụ tang lễ.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e12. Duy tu, sửa chữa, xây dựng bằng nguồn vốn đóng góp của nhân dân, vốn viện trợ nhân đạo đối với các công trình văn hóa, nghệ thuật, công trình phục vụ công cộng, cơ sở hạ tầng và nhà ở cho đối tượng chính sách xã hội.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e13. Dạy học, dạy nghề theo quy định của pháp luật.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e14. Phát sóng truyền thanh, truyền hình bằng nguồn vốn ngân sách nhà nước.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e15. Xuất bản, nhập khẩu, phát hành báo, tạp chí, bản tin chuyên ngành, sách chính trị, sách giáo khoa, giáo trình, sách văn bản pháp luật, sách khoa học – kỹ thuật, sách in bằng chữ dân tộc thiểu số và tranh, ảnh, áp phích tuyên truyền cổ động, kể cả dưới dạng băng hoặc đĩa ghi tiếng, ghi hình, dữ liệu điện tử; in tiền.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e16. Vận chuyển hành khách công cộng bằng xe buýt, xe điện.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e17. Máy móc, thiết bị, vật tư thuộc loại trong nước chưa sản xuất được cần nhập khẩu để sử dụng trực tiếp cho hoạt động nghiên cứu khoa học, phát triển công nghệ; máy móc, thiết bị, phụ tùng thay thế, phương tiện vận tải chuyên dùng và vật tư thuộc loại trong nước chưa sản xuất được cần nhập khẩu để tiến hành hoạt động tìm kiếm, thăm dò, phát triển mỏ dầu, khí đốt; tàu bay, dàn khoan, tàu thủy thuộc loại trong nước chưa sản xuất được cần nhập khẩu tạo tài sản cố định của doanh nghiệp, thuê của nước ngoài sử dụng cho sản xuất, kinh doanh và để cho thuê.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e18. Vũ khí, khí tài chuyên dùng phục vụ quốc phòng, an ninh.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e19. Hàng hóa nhập khẩu trong trường hợp viện trợ nhân đạo, viện trợ không hoàn lại; quà tặng cho cơ quan nhà nước, tổ chức chính trị, tổ chức chính trị - xã hội, tổ chức chính trị xã hội – nghề nghiệp, tổ chức xã hội, tổ chức xã hội – nghề nghiệp, đơn vị vũ trang nhân dân; quà biếu, quà tặng cho cá nhân tại Việt Nam theo mức quy định của Chính phủ; đồ dùng của tổ chức, cá nhân nước ngoài theo tiêu chuẩn miễn trừ ngoại giao; hàng mang theo người trong tiêu chuẩn hành lý miễn thuế.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eHàng hóa, dịch vụ bán cho tổ chức, cá nhân nước ngoài, tổ chức quốc tế để viện trợ nhân đạo, viên trợ không hoàn lại cho Việt Nam.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e20. Hàng hóa chuyển khẩu, quá cảnh qua lãnh thổ Việt Nam; hàng tạm nhập khẩu, tái xuất khẩu; hàng tạm xuất khẩu, tái nhập khẩu; nguyên liệu nhập khẩu để sản xuất, gia công hàng hóa xuất khẩu theo hợp đồng sản xuất; gia công xuất khẩu ký kết với bên nước ngoài; hàng hóa, dịch vụ được mua bán giữa nước ngoài với các khu phi thuế quan và giữa các khu phi thuế quan với nhau.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e21. Chuyển giao công nghệ theo quy định của Luật chuyển giao công nghệ; chuyển nhượng quyền sở hữu trí tuệ theo quy định của Luật sở hữu trí tuệ; phần mềm máy tính.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e22. Vàng nhập khẩu dạng thỏi, miếng chưa được chế tác thành sản phẩm mỹ nghệ, đồ trang sức hay sản phẩm khác.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e23. Sản phẩm xuất khẩu là tài nguyên, khoáng sản khai thác chưa chế biến theo quy định của Chính phủ.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e24. Sản phẩm nhân tạo dùng để thay thế cho bộ phận cơ thể của người bệnh; nạng, xe lăn và dụng cụ chuyên dùng khác cho người tàn tật.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e25. Hàng hóa, dịch vụ của cá nhân kinh doanh có mức thu nhập bình quân tháng thấp hơn mức lương tối thiểu chung áp dụng đối với tổ chức, doanh nghiệp trong nước.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eCơ sở kinh doanh hàng hóa, dịch vụ không chịu thuế giá trị gia tăng quy định tại Điều này không được khấu trừ và hoàn thuế giá trị gia tăng đầu vào, trừ trường hợp áp dụng mức thuế suất 0% quy định tại khoản 1 Điều 8 của Luật này.\u003c/font\u003e\u003c/p\u003e\n\u003cp align=\"center\" style=\"text-align:center;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e\u003cb\u003eChương II\u003c/b\u003e\u003c/font\u003e\u003c/p\u003e\n\u003cp align=\"center\" style=\"text-align:center;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e\u003cb\u003eCĂN CỨ VÀ PHƯƠNG PHÁP TÍNH THUẾ\u003c/b\u003e\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e\u003cb\u003eĐiều 6. Căn cứ tính thuế\u003c/b\u003e\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eCăn cứ tính thuế giá trị gia tăng là giá tính thuế và thuế suất.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e\u003cb\u003eĐiều 7. Giá tính thuế\u003c/b\u003e\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e1. Giá tính thuế được quy định như sau:\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003ea) Đối với hàng hóa, dịch vụ do cơ sở sản xuất, kinh doanh bán ra là giá bán chưa có thuế giá trị gia tăng. Đối với hàng hóa, dịch vụ chịu thuế tiêu thụ đặc biệt là giá bán đã có thuế tiêu thụ đặc biệt nhưng chưa có thuế giá trị gia tăng;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eb) Đối với hàng hóa nhập khẩu là giá nhập tại cửa khẩu cộng với thuế nhập khẩu (nếu có), cộng với thuế tiêu thụ đặc biệt (nếu có). Giá nhập tại cửa khẩu được xác định theo quy định về giá tính thuế hàng nhập khẩu.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003ec) Đối với hàng hóa, dịch vụ dùng để trao đổi, tiêu dùng nội bộ, biếu tặng cho là giá tính thuế giá trị gia tăng của hàng hóa, dịch vụ cùng loại hoặc tương đương tại thời điểm phát sinh các hoạt động này;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003ed) Đối với hoạt động cho thuê tài sản là số tiền cho thuê chưa có thuế giá trị gia tăng;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eTrường hợp cho thuê theo hình thức trả tiền thuê từng kỳ hoặc trả trước tiền thuê cho một thời hạn thuê thì giá tính thuế là tiền cho thuê trả từng thời kỳ hoặc trả trước cho thời hạn thuê chưa có thuế giá trị gia tăng;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eTrường hợp thuê máy móc, thiết bị, phương tiện vận tải của nước ngoài loại trong nước chưa sản xuất được để cho thuê lại, giá tính thuế được trừ giá thuê phải trả cho nước ngoài.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eđ) Đối với hàng hóa bán theo phương thức trả góp, trả chậm là giá tính theo giá bán trả một lần chưa có thuế giá trị gia tăng của hàng hóa đó, không bao gồm khoản lãi trả góp, lãi trả chậm;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003ee) Đối với gia công hàng hóa là giá gia công chưa có thuế giá trị gia tăng;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eg) Đối với hoạt động xây dựng, lắp đặt là giá trị công trình, hạng mục công trình hay phần công việc thực hiện bàn giao chưa có thuế giá trị gia tăng. Trường hợp xây dựng, lắp đặt không bao thầu nguyên vật liệu, máy móc, thiết bị thì giá tính thuế là giá trị xây dựng, lắp đặt không bao gồm giá trị nguyên vật liệu và máy móc, thiết bị;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eh) Đối với hoạt động kinh doanh bất động sản là giá bán bất động sản chưa có thuế giá trị gia tăng, trừ giá chuyển quyền sử dụng đất hoặc tiền thuê đất phải nộp ngân sách nhà nước;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003ei) Đối với hoạt động đại lý, môi giới mua bán hàng hóa và dịch vụ hưởng hoa hồng là tiền hoa hồng thu được từ các hoạt động này chưa có thuế giá trị gia tăng;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003ek) Đối với hàng hóa, dịch vụ được sử dụng chứng từ thanh toán ghi giá thanh toán là giá đã có thuế giá trị gia tăng thì giá tính thuế được xác định theo công thức sau:\u003c/font\u003e\u003c/p\u003e\n\u003cdiv align=\"center\"\u003e\n \u003ctable cellspacing=\"0\" cellpadding=\"0\" border=\"0\" id=\"table1\" style=\"border-collapse:collapse;\" class=\"MsoNormalTable\"\u003e\n  \u003ctbody\u003e\n   \u003ctr style=\"height:11.65pt;\"\u003e\n    \u003ctd width=\"259\" style=\"width:194pt;height:11.65pt;border-style:solid;border-width:1px;padding:0cm 5.4pt;\" rowspan=\"2\"\u003e\n     \u003cp style=\"text-align:justify;margin-top:6pt;margin-bottom:6pt;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eGiá chưa có thuế giá trị gia tăng\u003c/font\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003ctd width=\"37\" style=\"width:27.4pt;height:11.65pt;border-style:solid;border-width:1px;padding:0cm 5.4pt;\" rowspan=\"2\"\u003e\n     \u003cp align=\"center\" style=\"text-align:center;margin-top:6pt;margin-bottom:6pt;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e=\u003c/font\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003ctd width=\"276\" style=\"width:207pt;height:11.65pt;border-left:1px solid;border-right:1px solid;border-top:1px solid;border-color:-moz-use-text-color -moz-use-text-color windowtext;padding:0cm 5.4pt;\"\u003e\n     \u003cp align=\"center\" style=\"text-align:center;margin-top:6pt;margin-bottom:6pt;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eGiá thanh toán\u003c/font\u003e\u003c/p\u003e\u003c/td\u003e\n   \u003c/tr\u003e\n   \u003ctr style=\"height:4.8pt;\"\u003e\n    \u003ctd width=\"276\" style=\"width:207pt;height:4.8pt;border-right-style:solid;border-right-width:1px;border-top-style:solid;border-top-width:1px;border-bottom-style:solid;border-bottom-width:1px;padding:0cm 5.4pt;\"\u003e\n     \u003cp align=\"center\" style=\"text-align:center;margin-top:6pt;margin-bottom:6pt;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e1 + thuế suất của hàng hóa, dịch vụ (%)\u003c/font\u003e\u003c/p\u003e\u003c/td\u003e\n   \u003c/tr\u003e\n  \u003c/tbody\u003e\n \u003c/table\u003e\n\u003c/div\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e2. Giá tính thuế đối với hàng hóa, dịch vụ quy định tại khoản 1 Điều này bao gồm cả khoản phụ thu và phí thu thêm mà cơ sở kinh doanh được hưởng.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e3. Giá tính thuế được xác định bằng đồng Việt Nam. Trường hợp người nộp thuế có doanh thu bằng ngoại tệ thì phải quy đổi ra đồng Việt Nam theo tỷ giá giao dịch bình quân trên thị trường ngoại tệ liên ngân hàng do Ngân hàng Nhà nước Việt Nam công bố tại thời điểm phát sinh doanh thu để xác định giá tính thuế.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e\u003cb\u003eĐiều 8. Thuế suất\u003c/b\u003e\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e1. Mức thuế suất 0% áp dụng đối với hàng hóa, dịch vụ xuất khẩu, vận tải quốc tế và hàng hóa, dịch vụ không chịu thuế giá trị gia tăng quy định tại Điều 5 của Luật này khi xuất khẩu, trừ các trường hợp chuyển giao công nghệ, chuyển nhượng quyền sở hữu trí tuệ ra nước ngoài; dịch vụ tái bảo hiểm ra nước ngoài; dịch vụ cấp tín dụng, chuyển nhượng vốn, dịch vụ tài chính phát sinh; dịch vụ bưu chính, viễn thông; sản phẩm xuất khẩu là tài nguyên, khoáng sản khai thác chưa qua chế biến quy định tại khoản 23 Điều 5 của Luật này.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e2. Mức thuế suất 5% áp dụng đối với hàng hóa, dịch vụ sau đây:\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003ea) Nước sạch phục vụ sản xuất và sinh hoạt;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eb) Phân bón; quặng để sản xuất phân bón; thuốc phòng trừ sâu bệnh và chất kích thích tăng trưởng vật nuôi, cây trồng;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003ec) Thức ăn gia súc, gia cầm và thức ăn cho vật nuôi khác;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003ed) Dịch vụ đào đắp, nạo vét kênh, mương, ao hồ phục vụ sản xuất nông nghiệp; nuôi trồng, chăm sóc, phòng trừ sâu bệnh cho cây trồng; sơ chế, bảo quản sản phẩm nông nghiệp;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eđ) Sản phẩm trồng trọt,chăn nuôi, thủy sản chưa qua chế biến, trừ sản phẩm quy định tại khoản 1 Điều 5 của Luật này;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003ee) Mủ cao su sơ chế; nhựa thông sơ chế; lưới, dây giềng và sợi để đan lưới đánh cá;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eg) Thực phẩm tươi sống; lâm sản chưa qua chế biến, trừ gỗ, măng và sản phẩm quy định tại khoản 1 Điều 5 của Luật này;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eh) Đường; phụ phẩm trong sản xuất đường, bao gồm gỉ đường, bã mía, bã bùn;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003ei) Sản phẩm bằng đay, cói, tre, nứa, lá, rơm, vỏ dừa, sọ dừa, bèo tây và các sản phẩm thủ công khác sản xuất bằng nguyên liệu tận dụng từ nông nghiệp; bông sơ chế; giấy in báo;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003ek) Máy móc, thiết bị chuyên dùng phục vụ cho sản xuất nông nghiệp, bao gồm máy cày, máy bừa, máy cấy, máy gieo hạt, máy tuốt lúa, máy gặt, máy gặt đập liên hợp, máy thu hoạch sản phẩm nông nghiệp, máy hoặc bình bơm thuốc trừ sâu;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003el) Thiết bị, dụng cụ y tế, bông, băng vệ sinh y tế; thuốc phòng bệnh, chữa bệnh; sản phẩm hóa dược, dược liệu là nguyên liệu sản xuất thuốc chữa bệnh, thuốc phòng bệnh;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003em) Giáo cụ dùng để giảng dạy và học tập, bao gồm các loại mô hình, hình vẽ, bảng, phấn, thước kẻ, com-pa và các loại thiết bị, dụng cụ chuyên dùng cho giảng dạy, nghiên cứu, thí nghiệm khoa học;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003en) Hoạt động văn hóa, triển lãm, thể dục, thể thao; biểu diễn nghệ thuật, sản xuất phim; nhập khẩu, phát hành và chiếu phim;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eo) Đồ chơi cho trẻ em; sách các loại, trừ sách quy định tại khoản 15 Điều 5 của Luật này;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003ep) Dịch vụ khoa học, công nghệ theo quy định của Luật khoa học và công nghệ.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e3. Mức thuế suất 10% áp dụng đối với hàng hóa, dịch vụ không quy định tại khoản 1 và khoản 2 Điều này.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e\u003cb\u003eĐiều 9. Phương pháp tính thuế\u003c/b\u003e\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003ePhương pháp tính thuế giá trị gia tăng gồm phương pháp khấu trừ thuế giá trị gia tăng và phương pháp tính trực tiếp trên giá trị gia tăng.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e\u003cb\u003eĐiều 10. Phương pháp khấu trừ thuế\u003c/b\u003e\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e1. Phương pháp khấu trừ thuế giá trị gia tăng được quy định như sau:\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003ea) Số thuế giá trị gia tăng phải nộp theo phương pháp khấu trừ thuế bằng số thuế giá trị gia tăng đầu ra trừ số thuế giá trị gia tăng đầu vào được khấu trừ;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eb) Số thuế giá trị gia tăng đầu ra bằng tổng số thuế giá trị gia tăng của hàng hóa, dịch vụ bán ra ghi trên hóa đơn giá trị gia tăng;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003ec) Số thuế giá trị gia tăng đầu vào được khấu trừ bằng tổng số thuế giá trị gia tăng ghi trên hóa đơn giá trị gia tăng mua hàng hóa, dịch vụ, chứng từ nộp thuế giá trị gia tăng của hàng hóa nhập khẩu và đáp ứng điều kiện quy định tại Điều 12 của Luật này.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e2. Phương pháp khấu trừ thuế áp dụng đối với cơ sở kinh doanh thực hiện đầy đủ chế độ kế toán, hóa đơn, chứng từ theo quy định của pháp luật về kế toán, hóa đơn, chứng từ và đăng ký nộp thuế theo phương pháp khấu trừ thuế.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e\u003cb\u003eĐiều 11. Phương pháp tính trực tiếp trên giá trị gia tăng\u003c/b\u003e\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e1. Phương pháp tính trực tiếp trên giá trị gia tăng được quy định như sau:\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003ea) Số thuế giá trị gia tăng phải nộp theo phương pháp tính trực tiếp trên giá trị gia tăng bằng giá trị gia tăng của hàng hóa, dịch vụ bán ra nhân với thuế suất thuế giá trị gia tăng;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eb) Giá trị gia tăng được xác định bằng giá thanh toán của hàng hóa, dịch vụ bán ra trừ giá thanh toán của hàng hóa, dịch vụ mua vào tương ứng.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e2. Phương pháp tính trực tiếp trên giá trị gia tăng áp dụng đối với các trường hợp sau đây:\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003ea) Cơ sở kinh doanh và tổ chức, cá nhân nước ngoài kinh doanh không có cơ sở thường trú tại\u0026nbsp; Việt Nam nhưng có thu nhập phát sinh tại Việt Nam chưa thực hiện đầy đủ chế độ kế toán, hóa đơn chứng từ;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eb) Hoạt động mua bán vàng, bạc, đá quý.\u003c/font\u003e\u003c/p\u003e\n\u003cp align=\"center\" style=\"text-align:center;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e\u003cb\u003eChương III\u003c/b\u003e\u003c/font\u003e\u003c/p\u003e\n\u003cp align=\"center\" style=\"text-align:center;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e\u003cb\u003eKHẤU TRỪ, HOÀN THUẾ\u003c/b\u003e\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e\u003cb\u003eĐiều 12. Khấu trừ thuế giá trị gia tăng đầu vào\u003c/b\u003e\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e1. Cơ sở kinh doanh nộp thuế giá trị gia tăng theo phương pháp khấu trừ thuế được khấu trừ thuế giá trị gia tăng đầu vào như sau:\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003ea) Thuế giá trị gia tăng đầu vào của hàng hóa, dịch vụ sử dụng cho sản xuất, kinh doanh hàng hóa, dịch vụ chịu thuế giá trị gia tăng được khấu trừ toàn bộ;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eb) Thuế giá trị gia tăng đầu vào của hàng hóa, dịch vụ sử dụng đồng thời cho sản xuất, kinh doanh hàng hóa, dịch vụ chịu thuế và không chịu thuế thì chỉ được khấu trừ số thuế giá trị gia tăng đầu vào của hàng hóa,dịch vụ sử dụng cho sản xuất, kinh doanh hàng hóa, dịch vụ chịu thuế giá trị gia tăng. Trường hợp thuế giá trị gia tăng đầu vào của tài sản cố định sử dụng đồng thời cho sản xuất, kinh doanh hàng hóa, dịch vụ chịu thuế giá trị gia tăng và không chịu thuế giá trị gia tăng thì được khấu trừ toàn bộ;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003ec) Thuế giá trị gia tăng đầu vào của hàng hóa, dịch vụ bán cho tổ chức, cá nhân sử dụng nguồn vốn viện trợ nhân đạo, viện trợ không hoàn lại được khấu trừ toàn bộ;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003ed) Thuế giá trị gia tăng đầu vào phát sinh trong tháng nào được kê khai, khấu trừ khi xác định số thuế phải nộp của tháng đó. Trường hợp cơ sở kinh doanh phát hiện số thuế giá trị gia tăng đầu vào khi kê khai, khấu trừ bị sai sót thì được kê khai, khấu trừ bổ sung; thời gian để kê khai, bổ sung tối đa là 6 tháng, kể từ thời điểm phát sinh sai sót.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e2. Điều kiện khấu trừ thuế giá trị gia tăng đầu vào được quy định như sau:\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003ea) Có hóa đơn giá trị gia tăng mua hàng hóa, dịch vụ hoặc chứng từ nộp thuế giá trị gia tăng ở khâu nhập khẩu;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eb) Có chứng từ thanh toán qua ngân hàng đối với hàng hóa, dịch vụ mua vào, trừ hàng hóa, dịch vụ mua từng lần có giá trị dưới hai mươi triệu đồng;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003ec) Đối với hàng hóa, dịch vụ xuất khẩu, ngoài các điều kiện quy định tại điểm a và điểm b khoản này phải có hợp đồng ký kết với bên ngoài về việc bán, gia công hàng hóa, cung ứng dịch vụ, hóa đơn bán hàng hóa, dịch vụ, chứng từ thanh toán qua ngân hàng, tờ khai hải quan đối với hàng hóa xuất khẩu.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eViệc thanh toán tiền hàng hóa, dịch vụ xuất khẩu dưới hình thức thanh toán bù trừ giữa hàng hóa, dịch vụ xuất khẩu với hàng hóa, dịch vụ nhập khẩu, trả nợ thay Nhà nước được coi là thanh toán qua ngân hàng.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e\u003cb\u003eĐiều 13. Các trường hợp hoàn thuế\u003c/b\u003e\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e1. Cơ sở kinh doanh nộp thuế giá trị gia tăng theo phương pháp khấu trừ thuế được hoàn thuế giá trị gia tăng nếu trong ba tháng liên tục trở lên có số thuế giá trị gia tăng đầu vào chưa được khấu trừ hết.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eTrường hợp cơ sở kinh doanh đã đăng ký nộp thuế giá trị gia tăng theo phương pháp khấu trừ có dự án đầu tư mới, đang trong giai đoạn đầu tư có số thuế giá trị gia tăng của hàng hóa, dịch vụ mua vào sử dụng cho nhà đầu tư mà chưa được khấu trừ hết và có số thuế còn lại từ hai trăm triệu đồng trở lên thì được hoàn thuế giá trị gia tăng.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e2. Cơ sở kinh doanh trong tháng có hàng hóa, dịch vụ xuất khẩu nếu có số thuế giá trị gia tăng đầu vào chưa được khấu trừ từ hai trăm triệu đồng trở lên thì được hoàn thuế giá trị gia tăng theo tháng.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e3. Cơ sở kinh doanh nộp thuế giá trị gia tăng theo phương pháp khấu trừ thuế được hoàn thuế giá trị gia tăng khi chuyển đổi sở hữu, chuyển đổi doanh nghiệp, sáp nhập, hợp nhất, chia, tách, giải thể, phá sản, chấm dứt hoạt động có số thuế giá trị gia tăng nộp thừa hoặc số thuế giá trị gia tăng đầu vào chưa được khấu trừ hết.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e4. Cơ sở kinh doanh có quyết định hoàn thuế giá trị gia tăng của cơ quan có thẩm quyền theo quy định của pháp luật và trường hợp hoàn thuế giá trị gia tăng theo điều ước quốc tế mà Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e\u003cb\u003eĐiều 14. Hóa đơn, chứng từ\u003c/b\u003e\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e1. Việc mua bán hàng hóa, dịch vụ phải có hóa đơn, chứng từ theo quy định của pháp luật và các quy định sau đây:\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003ea) Cơ sở kinh doanh nộp thuế theo phương pháp khấu trừ thuế sử dụng hóa đơn giá trị gia tăng; hóa đơn phải được ghi đầy đủ, đúng nội dung quy định, bao gồm cả khoản phụ thu, phí thu thêm (nếu có). Trường hợp bán hàng hóa, dịch vụ chịu thuế giá trị gia tăng mà trên hóa đơn giá trị gia tăng không ghi khoản thuế giá trị gia tăng thì thuế giá trị gia tăng đầu ra được xác định bằng giá thanh toán ghi trên hóa đơn nhân với thuế suất thuế giá trị gia tăng, trừ trường hợp quy định tại khoản 2 Điều này;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eb) Cơ sở kinh doanh nộp thuế theo phương pháp tính trực tiếp trên giá trị gia tăng sử dụng hóa đơn bán hàng.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e2. Đối với các loại tem, vé là chứng từ thanh toán in sẵn giá thanh toán thì giá thanh toán tem, vé đó đã bao gồm thuế giá trị gia tăng.\u003c/font\u003e\u003c/p\u003e\n\u003cp align=\"center\" style=\"text-align:center;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e\u003cb\u003eChương IV\u003c/b\u003e\u003c/font\u003e\u003c/p\u003e\n\u003cp align=\"center\" style=\"text-align:center;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e\u003cb\u003eĐIỀU KHOẢN THI HÀNH\u003c/b\u003e\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e\u003cb\u003eĐiều 15. Hiệu lực thi hành\u003c/b\u003e\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e1. Luật này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2009.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e2. Luật này thay thế các luật sau đây:\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003ea) Luật thuế giá trị gia tăng năm 1997;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eb) Luật sửa đổi, bổ sung một số điều của Luật thuế giá trị gia tăng số 07/2003/QH11;\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e3. Bãi bỏ Điều 2 của Luật sửa đổi, bổ sung một số điều của Luật thuế tiêu thụ đặc biệt và Luật thuế giá trị gia tăng số 57/2005/QH11.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e\u003cb\u003eĐiều 16. Hướng dẫn thi hành\u003c/b\u003e\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003eChính phủ quy định chi tiết và hướng dẫn thi hành các điều 5, 7, 8, 12, 13 và các nội dung cần thiết khác của Luật này theo yêu cầu quản lý.\u003c/font\u003e\u003c/p\u003e\n\u003cp style=\"text-align:justify;margin:6pt 0cm;\" class=\"MsoNormal\"\u003e\u003cfont size=\"2\" face=\"Arial\"\u003e\u003ci\u003eLuật này đã được Quốc hội nước Cộng hòa xã hội chủ nghĩa Việt Nam khóa XII, kỳ họp thứ 3 thông qua ngày 03 tháng 6 năm 2008./.\u003c/i\u003e\u003c/font\u003e\u003c/p\u003e\n\u003c/body\u003e\n\u003c/html\u003e"])</script><script>self.__next_f.push([1,"d:[[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"Legislation\\\",\\\"name\\\":\\\"Luật Thuế giá trị gia tăng số 13/2008/QH12\\\",\\\"legislationIdentifier\\\":\\\"13/2008/QH12\\\",\\\"legislationType\\\":\\\"Luật\\\",\\\"legislationDate\\\":\\\"2008-06-03T00:00:00\\\",\\\"legislationLegalForce\\\":\\\"NotInForce\\\",\\\"legislationPassedBy\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Quốc hội\\\"},\\\"legislationJurisdiction\\\":\\\"VN\\\",\\\"url\\\":\\\"https://vbpl.vn/van-ban/chi-tiet/luat-thue-gia-tri-gia-tang-so-13-2008-qh12--12806\\\",\\\"inLanguage\\\":\\\"vi\\\",\\\"keywords\\\":\\\"Luật, Chưa phân loại, Quốc hội, văn bản pháp luật, pháp luật Việt Nam\\\"}\"}}],[\"$\",\"script\",\"breadcrumb-jsonld\",{\"type\":\"application/ld+json\",\"id\":\"breadcrumb-jsonld\",\"data-testid\":\"$undefined\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"Trang chủ\\\",\\\"item\\\":\\\"https://vbpl.vn\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"Văn bản trung ương\\\",\\\"item\\\":\\\"https://vbpl.vn/van-ban/trung-uong\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":\\\"Luật Thuế giá trị gia tăng số 13/2008/QH12\\\",\\\"item\\\":\\\"https://vbpl.vn/van-ban/chi-tiet/luat-thue-gia-tri-gia-tang-so-13-2008-qh12--12806\\\"}]}\"},\"nonce\":\"$undefined\"}]],[\

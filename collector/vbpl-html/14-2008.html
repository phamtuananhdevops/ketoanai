"}}},\"footer\":{\"unit\":\"Đơn vị chủ quản\",\"unitContent\":\"Bộ Tư pháp\",\"address\":\"Địa chỉ\",\"addressContent\":\"Số 60 Trần Phú - Ba Đình - Thành phố Hà Nội\",\"phoneNumber\":\"Điện thoại\",\"phoneNumberContent\":\"024.6273.9468\",\"fax\":\"Fax\",\"faxContent\":\"024.6273.9359\"},\"underConstruction\":{\"title\":\"Đang cập nhật\",\"message\":\"Chức năng này đang được phát triển.\"},\"gioiThieu\":{\"timeline\":{\"2005\":{\"description\":\"Năm 2005 đánh dấu sự khởi đầu của dự án xây dựng Cơ sở dữ liệu quốc gia về pháp luật, với mục tiêu số hóa và tập trung hóa các văn bản pháp luật của Việt Nam.\"},\"2012-2013\":{\"description\":\"Giai đoạn 2012-2013 là thời kỳ phát triển và mở rộng hệ thống, với việc tích hợp thêm nhiều tính năng và cải thiện giao diện người dùng.\"},\"2023-2025\":{\"description\":\"Giai đoạn 2023-2025 tập trung vào việc nâng cấp và hiện đại hóa hệ thống, áp dụng các công nghệ mới và mở rộng phạm vi phục vụ.\"}},\"overview\":{\"title\":\"SƠ LƯỢC MÔ HÌNH CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"CSDLQG về pháp luật tập hợp các văn bản quy phạm pháp luật và văn bản hợp nhất văn bản quy phạm pháp luật (sau đây gọi chung là văn bản) dưới dạng văn bản điện tử do Chính phủ thống nhất quản lý, có địa chỉ truy cập vbpl.vn, bao gồm các Cơ sở dữ liệu thành phần: Cơ sở dữ liệu văn bản pháp luật Trung ương và Cơ sở dữ liệu văn bản pháp luật địa phương.\",\"central\":{\"title\":\"Cơ sở dữ liệu Văn bản pháp luật Trung ương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của các Bộ, cơ quan ngang Bộ, cơ quan nhà nước khác ở Trung ương ban hành hoặc phối hợp ban hành. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật; Văn bản hợp nhất; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"local\":{\"title\":\"Cơ sở dữ liệu văn bản pháp luật địa phương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của từng tỉnh, thành phố trực thuộc Trung ương trên toàn quốc. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật của Hội đồng nhân dân và Ủy ban nhân dân; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"other\":{\"title\":\"Các chuyên mục khác\",\"content\":\"Ngoài các Cơ sở dữ liệu thành phần kể trên, CSDLQG về pháp luật còn có các chuyên mục khác như: Giới thiệu văn bản mới, Tin tức, Tình huống pháp luật. Ngoài ra, CSDLQG về thủ tục hành chính, bộ pháp điển điện tử, cổng thông tin điện tử Bộ Tư pháp cũng trích xuất về CSDLQG về pháp luật.\"}},\"vision\":{\"title\":\"Tầm nhìn\",\"content\":\"Trở thành nguồn tra cứu văn bản pháp luật chính thống, đầy đủ và đáng tin cậy, phục vụ hiệu quả cho người dân, doanh nghiệp và cơ quan nhà nước.\"},\"mission\":{\"title\":\"Sứ mệnh\",\"content\":\"Cung cấp hệ thống văn bản pháp luật được cập nhật kịp thời, tra cứu thuận tiện, góp phần nâng cao nhận thức pháp luật và bảo đảm việc tuân thủ pháp luật trong xã hội.\"},\"features\":{\"title\":\"MỘT SỐ TÍNH NĂNG, TIỆN ÍCH CỦA CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"Hiện nay, CSDLQG về PL có giao diện tương đối thân thiện, dễ tìm kiếm, dễ khai thác các thông tin và tải về sử dụng. Cơ sở dữ liệu cung cấp các chức năng, tiện ích cơ bản và thuận tiện\",\"list\":[{\"key\":\"fullText\",\"label\":\"Tra cứu toàn văn\",\"icon\":\"SearchOutlined\"},{\"key\":\"tableOfContents\",\"label\":\"Tự động tạo mục lục\",\"icon\":\"BookOutlined\"},{\"key\":\"relatedDocuments\",\"label\":\"Liên kết văn bản liên quan\",\"icon\":\"LinkOutlined\"},{\"key\":\"validity\",\"label\":\"Xác định hiệu lực tự động\",\"icon\":\"BarChartOutlined\"},{\"key\":\"validityHistory\",\"label\":\"Lịch sử hiệu lực\",\"icon\":\"ClockCircleOutlined\"},{\"key\":\"download\",\"label\":\"Tải văn bản\",\"icon\":\"DownloadOutlined\"},{\"key\":\"english\",\"label\":\"Xem văn bản tiếng Anh\",\"icon\":\"GlobalOutlined\"},{\"key\":\"centralLocal\",\"label\":\"Liên kết văn bản Trung ương – địa phương\",\"icon\":\"ShareAltOutlined\"},{\"key\":\"diagram\",\"label\":\"Lược đồ văn bản\",\"icon\":\"FileTextOutlined\"}]}},\"mostViewed\":{\"title\":\"V t-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLuật số: 14/2008/QH12\u003c/span\u003e\n     \u003c/div\u003e\n     \u003cdiv style=\"display: table-cell; width: 50%; text-align: center; vertical-align: top; font-style: italic;\"\u003e\n      \u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNgày 3 tháng 6 năm 2008\u003c/span\u003e\n     \u003c/div\u003e\n    \u003c/div\u003e\n   \u003c/div\u003e\n  \u003c/div\u003e\n  \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u0026nbsp;\u0026nbsp;\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" align=\"center\" style=\"margin-top: 0pt; margin-bottom: 0pt;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cb\u003eLUẬT\u003c/b\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" align=\"center\" style=\"margin-top: 0pt; margin-bottom: 0pt;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cb\u003eThuế thu nhập doanh nghiệp\u003c/b\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal\" align=\"center\" style=\"margin-top: 0pt; margin-bottom: 0pt;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cb\u003e\u0026nbsp;_______________\u003c/b\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText2\" style=\"text-align: justify; margin: 6pt 0cm;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCăn cứ Hiến pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam năm 1992 đã được sửa đổi, bổ sung một số điều theo Nghị quyết số 51/2001/QH10;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText2\" style=\"text-align: justify; margin: 6pt 0cm;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eQuốc hội ban hành Luật thuế thu nhập doanh nghiệp,\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff1ff40-29c8-11f1-9633-e145b99e0d20\" class=\"MsoNormal prov-chapter\" style=\"font-size: 14px; text-align: center;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eChương I\u003c/b\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff1ff40-29c8-11f1-9633-e145b99e0d20\" class=\"MsoNormal prov-chapter\" style=\"font-size: 14px; text-align: center;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eNHỮNG QUY ĐỊNH CHUNG\u003c/b\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff22650-29c8-11f1-b96a-b9a2a1cf0ddb\" class=\"MsoNormal prov-article\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eĐiều 1. Phạm vi điều chỉnh\u003c/b\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLuật này quy định về người nộp thuế, thu nhập chịu thuế, thu nhập được miễn thuế, căn cứ tính thuế, phương pháp tính thuế và ưu đãi thuế thu nhập doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff24d60-29c8-11f1-9101-09b5b0f7108a\" class=\"MsoNormal prov-article\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eĐiều 2. Người nộp thuế\u003c/b\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff27470-29c8-11f1-9e25-3382da70c75a\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Người nộp thuế thu nhập doanh nghiệp là tổ chức hoạt động sản xuất, kinh doanh hàng hóa, dịch vụ có thu nhập chịu thuế theo quy định của Luật này (sau đây gọi là doanh nghiệp), bao gồm:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff29b80-29c8-11f1-b3af-d7f229ecb368\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Doanh nghiệp được thành lập theo quy định của pháp luật Việt Nam;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff2c290-29c8-11f1-ad2b-83ddb5a1852b\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Doanh nghiệp được thành lập theo quy định của pháp luật nước ngoài (sau đây gọi là doanh nghiệp nước ngoài) có cơ sở thường trú hoặc không có cơ sở thường trú tại Việt Nam;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff310b0-29c8-11f1-bb9c-356bd258dc55\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec) Tổ chức được thành lập theo Luật hợp tác xã;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff310ba-29c8-11f1-8e37-afe3fd62c50c\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ed) Đơn vị sự nghiệp được thành lập theo quy định của pháp luật Việt Nam;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff310c4-29c8-11f1-9baa-d3fd0ef3751c\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eđ) Tổ chức khác có hoạt động sản xuất, kinh doanh có thu nhập.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff310ce-29c8-11f1-803f-432d6c7d980d\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Doanh nghiệp có thu nhập chịu thuế quy định tại Điều 3 của Luật này phải nộp thuế thu nhập doanh nghiệp như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff310d8-29c8-11f1-97ff-2b7c3a64be82\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Doanh nghiệp được thành lập theo quy định của pháp luật Việt Nam nộp thuế đối với thu nhập chịu thuế phát sinh tại Việt Nam và thu nhập chịu thuế phát sinh ngoài Việt Nam;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff310e2-29c8-11f1-8099-591b6f29f877\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Doanh nghiệp nước ngoài có cơ sở thường trú tại Việt Nam nộp thuế đối với thu nhập chịu thuế phát sinh tại Việt Nam và thu nhập chịu thuế phát sinh ngoài Việt Nam liên quan đến hoạt động của cơ sở thường trú đó;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff310ec-29c8-11f1-a3ab-a10892ee7c9a\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec) Doanh nghiệp nước ngoài có cơ sở thường trú tại Việt Nam nộp thuế đối với thu nhập chịu thuế phát sinh tại Việt Nam mà khoản thu nhập này không liên quan đến hoạt động của cơ sở thường trú;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff310f6-29c8-11f1-a488-25ba4ff14f38\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ed) Doanh nghiệp nước ngoài không có cơ sở thường trú tại Việt Nam nộp thuế đối với thu nhập chịu thuế phát sinh tại Việt Nam.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff31100-29c8-11f1-8eea-a9426d93e64a\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" type=\"10:b37ed9f0-26e4-11f1-851b-9de74a54b85d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Cơ sở thường trú của doanh nghiệp nước ngoài là cơ sở sản xuất, kinh doanh mà thông qua cơ sở này, doanh nghiệp nước ngoài tiến hành một phần hoặc toàn bộ hoạt động sản xuất, kinh doanh tại Việt Nam mang lại thu nhập, bao gồm:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff3110a-29c8-11f1-8a95-55830bd0e8fd\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\" parent-id=\"7ff31100-29c8-11f1-8eea-a9426d93e64a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Chi nhánh, văn phòng điều hành, nhà máy, công xưởng, phương tiện vận tải, hầm mỏ, mỏ dầu, khí hoặc địa điểm khai thác tài nguyên thiên nhiên khác tại Việt Nam;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff31114-29c8-11f1-a2f8-a947938b3829\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\" parent-id=\"7ff31100-29c8-11f1-8eea-a9426d93e64a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Địa điểm xây dựng, công trình xây dựng, lắp đặt, lắp ráp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff3111e-29c8-11f1-af92-4b748dc65ace\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\" parent-id=\"7ff31100-29c8-11f1-8eea-a9426d93e64a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec) Cơ sở cung cấp dịch vụ, bao gồm cả dịch vụ tư vấn thông qua người làm công hay một tổ chức, cá nhân khác;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff31128-29c8-11f1-80b4-9d242b9d1f3d\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\" parent-id=\"7ff31100-29c8-11f1-8eea-a9426d93e64a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ed) Đại lý cho doanh nghiệp nước ngoài;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff31132-29c8-11f1-860c-1993bd05264a\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\" parent-id=\"7ff31100-29c8-11f1-8eea-a9426d93e64a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eđ) Đại diện tại Việt Nam trong trường hợp là đại diện có thẩm quyền ký kết hợp đồng đứng tên doanh nghiệp nước ngoài hoặc đại diện không có thẩm quyền ký kết hợp đồng đứng tên doanh nghiệp nước ngoài nhưng thường xuyên thực hiện việc giao hàng hóa hoặc cung ứng dịch vụ tại Việt Nam.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff3113c-29c8-11f1-ae51-9948543734b0\" class=\"MsoNormal prov-article\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eĐiều 3. Thu nhập chịu thuế\u003c/b\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff55aa0-29c8-11f1-951b-a39628a226c4\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Thu nhập chịu thuế bao gồm thu nhập từ hoạt động sản xuất, kinh doanh hàng hóa, dịch vụ và thu nhập khác quy định tại khoản 2 Điều này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff581b0-29c8-11f1-93e7-d166316aed56\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" type=\"10:b37f9d40-26e4-11f1-8dd2-698e7121a968\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Thu nhập khác bao gồm thu nhập từ chuyển nhượng vốn, chuyển nhượng bất động sản; thu nhập từ quyền sở hữu, quyền sử dụng tài sản; thu nhập từ chuyển nhượng, cho thuê, thanh lý tài sản; thu nhập từ lãi tiền gửi, cho vay vốn, bán ngoại tệ; hoàn nhập các khoản dự phòng; thu khoản nợ khó đòi đã xóa nay đòi được; thu khoản nợ phải trả không xác định được chủ; khoản thu nhập từ kinh doanh của những năm trước bị bỏ sót và các khoản thu nhập khác, kể cả thu nhập nhận được từ hoạt động sản xuất, kinh doanh ở ngoài Việt Nam.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff5a8c0-29c8-11f1-b9cb-e5930fb0b64d\" class=\"MsoNormal prov-article\" style=\"font-size: 14px;\" type=\"10:b38087a0-26e4-11f1-a8e2-0d1a4c413091\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eĐiều 4. Thu nhập được miễn thuế\u003c/b\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff5a8ca-29c8-11f1-9f46-e1e1abdd3d40\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" type=\"10:b38087a0-26e4-11f1-a8e2-0d1a4c413091\" parent-id=\"7ff5a8c0-29c8-11f1-b9cb-e5930fb0b64d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Thu nhập từ trồng trọt, chăn nuôi, nuôi trồng thủy sản của tổ chức được thành lập theo Luật hợp tác xã.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff5cfd0-29c8-11f1-afb1-4b9091a442ab\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" parent-id=\"7ff5a8c0-29c8-11f1-b9cb-e5930fb0b64d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Thu nhập từ việc thực hiện dịch vụ kỹ thuật trực tiếp phục vụ nông nghiệp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff5f6e0-29c8-11f1-bd9b-43444c2c0c78\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" parent-id=\"7ff5a8c0-29c8-11f1-b9cb-e5930fb0b64d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Thu nhập từ việc thực hiện hợp đồng nghiên cứu khoa học và phát triển công nghệ, sản phẩm đang trong thời kỳ sản xuất thử nghiệm, sản phẩm làm ra từ công nghệ mới lần đầu áp dụng tại Việt Nam.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff61df0-29c8-11f1-9a36-0f0bc7439a2a\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" type=\"10:b38087a0-26e4-11f1-a8e2-0d1a4c413091\" parent-id=\"7ff5a8c0-29c8-11f1-b9cb-e5930fb0b64d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4. Thu nhập từ hoạt động sản xuất, kinh doanh hàng hóa, dịch vụ của doanh nghiệp dành riêng cho lao động là người tàn tật, người sau cai nghiện, người nhiễm HIV. Chính phủ quy định tiêu chí, điều kiện xác định doanh nghiệp dành riêng cho lao động là người tàn tật, người sau cai nghiện, người nhiễm HIV.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff64500-29c8-11f1-ab99-db188a726ccc\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" parent-id=\"7ff5a8c0-29c8-11f1-b9cb-e5930fb0b64d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5. Thu nhập từ hoạt động dạy nghề dành riêng cho người dân tộc thiểu số, người tàn tật, trẻ em có hoàn cảnh đặc biệt khó khăn, đối tượng tệ nạn xã hội.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff66c10-29c8-11f1-8a32-1b54cbeb06d7\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" parent-id=\"7ff5a8c0-29c8-11f1-b9cb-e5930fb0b64d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e6. Thu nhập được chia từ hoạt động góp vốn, liên doanh, liên kết với doanh nghiệp trong nước, sau khi đã nộp thuế thu nhập doanh nghiệp theo quy định của Luật này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff69320-29c8-11f1-b753-a717b81b9762\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" parent-id=\"7ff5a8c0-29c8-11f1-b9cb-e5930fb0b64d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e7. Khoản tài trợ nhận được để sử dụng cho hoạt động giáo dục, nghiên cứu khoa học, văn hóa, nghệ thuật, từ thiện, nhân đạo và hoạt động xã hội khác tại Việt Nam.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff6ba30-29c8-11f1-9ed8-8532e66f4145\" class=\"MsoNormal prov-article\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eĐiều 5. Kỳ tính thuế\u003c/b\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff6e140-29c8-11f1-9649-a11318e0f279\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Kỳ tính thuế thu nhập doanh nghiệp được xác định theo năm dương lịch hoặc năm tài chính, trừ trường hợp quy định tại khoản 2 Điều này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff70850-29c8-11f1-b265-e9dbb9b33f90\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Kỳ tính thuế thu nhập doanh nghiệp theo từng lần phát sinh thu nhập áp dụng đối với doanh nghiệp nước ngoài được quy định tại điểm c và điểm d khoản 2 Điều 2 của Luật này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff72f60-29c8-11f1-854f-5f6cf29e48f8\" class=\"MsoNormal prov-chapter\" style=\"font-size: 14px; text-align: center;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eChương II\u003c/b\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff72f60-29c8-11f1-854f-5f6cf29e48f8\" class=\"MsoNormal prov-chapter\" style=\"font-size: 14px; text-align: center;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eCĂN CỨ VÀ PHƯƠNG PHÁP TÍNH THUẾ\u003c/b\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff75670-29c8-11f1-8c02-2934b8081dfa\" class=\"MsoNormal prov-article\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eĐiều 6. Căn cứ tính thuế\u003c/b\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCăn cứ tính thuế là thu nhập tính thuế và thuế suất.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff77d80-29c8-11f1-ac2b-5f0446002e6d\" class=\"MsoNormal prov-article\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eĐiều 7. Xác định thu nhập tính thuế\u003c/b\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff7a490-29c8-11f1-be4d-cd8d2ffa53ec\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Thu nhập tính thuế trong kỳ tính thuế được xác định bằng thu nhập chịu thuế trừ thu nhập được miễn thuế và các khoản lỗ được kết chuyển từ các năm trước.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff7f2b0-29c8-11f1-b5fc-7f843dd7afb2\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Thu nhập chịu thuế bằng doanh thu trừ các khoản chi được trừ của hoạt động sản xuất, kinh doanh cộng thu nhập khác, kể cả thu nhập nhận được ở ngoài Việt Nam.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff819c0-29c8-11f1-ad7f-61bca512a231\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" type=\"10:b3814af0-26e4-11f1-8877-3d219ded78e7\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Thu nhập từ hoạt động chuyển nhượng bất động sản phải xác định riêng để kê khai nộp thuế.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChính phủ quy định chi tiết và hướng dẫn thi hành Điều này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff819ca-29c8-11f1-b23b-9b4a24dd36b7\" class=\"MsoNormal prov-article\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eĐiều 8. Doanh thu\u003c/b\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eDoanh thu là toàn bộ tiền bán hàng, tiền gia công, tiền cung ứng dịch vụ, trợ giá, phụ thu, phụ trội mà doanh nghiệp được hưởng. Doanh thu được tính bằng đồng Việt Nam; trường hợp có doanh thu bằng ngoại tệ thì phải quy đổi ngoại tệ ra đồng Việt Nam theo tỷ giá giao dịch bình quân trên thị trường ngoại tệ liên ngân hàng do Ngân hàng Nhà nước Việt Nam công bố tại thời điểm phát sinh doanh thu bằng ngoại tệ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChính phủ quy định chi tiết và hướng dẫn thi hành Điều này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff867e0-29c8-11f1-986b-e9c01e39090c\" class=\"MsoNormal prov-article\" style=\"font-size: 14px;\" type=\"10:b381e730-26e4-11f1-9a3e-63678ee219f8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eĐiều 9. Các khoản chi được trừ và không được trừ khi xác định thu nhập chịu thuế\u003c/b\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff88ef0-29c8-11f1-aa7c-895f0d057e32\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" parent-id=\"7ff867e0-29c8-11f1-986b-e9c01e39090c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Trừ các khoản chi quy định tại khoản 2 Điều này, doanh nghiệp được trừ mọi khoản chi nếu đáp ứng đủ các điều kiện sau đây:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff8b600-29c8-11f1-b77f-d3d0d67e1705\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\" parent-id=\"7ff867e0-29c8-11f1-986b-e9c01e39090c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Khoản chi thực tế phát sinh liên quan đến hoạt động sản xuất, kinh doanh của doanh nghiệp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff8dd10-29c8-11f1-827d-0f985b8aa610\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\" parent-id=\"7ff867e0-29c8-11f1-986b-e9c01e39090c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Khoản chi có đủ hóa đơn, chứng từ theo quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff90420-29c8-11f1-ae17-c1825da60ff3\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" parent-id=\"7ff867e0-29c8-11f1-986b-e9c01e39090c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Các khoản chi không được trừ khi xác định thu nhập chịu thuế bao gồm:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff95240-29c8-11f1-b8eb-45f5cc23ad88\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\" parent-id=\"7ff867e0-29c8-11f1-986b-e9c01e39090c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Khoản chi không đáp ứng đủ các điều kiện quy định tại khoản 1 Điều này, trừ phần giá trị tổn thất do thiên tai, dịch bệnh và trường hợp bất khả kháng khác không được bồi thường;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff97950-29c8-11f1-99c7-f3381f3adbf2\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\" parent-id=\"7ff867e0-29c8-11f1-986b-e9c01e39090c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Khoản tiền phạt do vi phạm hành chính;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff9a060-29c8-11f1-854b-cf84ccfaac27\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\" parent-id=\"7ff867e0-29c8-11f1-986b-e9c01e39090c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec) Khoản chi được bù đắp bằng nguồn kinh phí khác;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff9c770-29c8-11f1-8d55-ab2e8877f847\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\" parent-id=\"7ff867e0-29c8-11f1-986b-e9c01e39090c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ed) Phần chi phí quản lý kinh doanh do doanh nghiệp nước ngoài phân bổ cho cơ sở thường trú tại Việt Nam vượt mức tính theo phương pháp phân bổ do pháp luật Việt Nam quy định;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ff9ee80-29c8-11f1-a295-b53efdc218a4\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\" parent-id=\"7ff867e0-29c8-11f1-986b-e9c01e39090c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eđ) Phần chi vượt mức theo quy định của pháp luật về trích lập dự phòng;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffa3ca0-29c8-11f1-8ebd-2ba60b796e87\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\" parent-id=\"7ff867e0-29c8-11f1-986b-e9c01e39090c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ee) Phần chi phí nguyên liệu, vật liệu, nhiên liệu, năng lượng, hàng hóa vượt định mức tiêu hao do doanh nghiệp xây dựng, thông báo cho cơ quan thuế và giá thực tế xuất kho;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffa63b0-29c8-11f1-a0fc-97e9b204a427\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\" parent-id=\"7ff867e0-29c8-11f1-986b-e9c01e39090c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eg) Phần chi trả lãi tiền vay vốn sản xuất, kinh doanh của đối tượng không phải là tổ chức tín dụng hoặc tổ chức kinh tế vượt quá 150% mức lãi suất cơ bản do Ngân hàng Nhà nước Việt Nam công bố tại thời điểm vay;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffa63ba-29c8-11f1-a15a-abff4416a3c4\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\" parent-id=\"7ff867e0-29c8-11f1-986b-e9c01e39090c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eh) Trích khấu hao tài sản cố định không đúng quy định của pháp luật;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffab1d0-29c8-11f1-8766-83fd0895bbcf\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\" parent-id=\"7ff867e0-29c8-11f1-986b-e9c01e39090c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ei) Khoản trích trước vào chi phí không đúng quy định của pháp luật;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffad8e0-29c8-11f1-b7a3-c3ff70b0a828\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\" parent-id=\"7ff867e0-29c8-11f1-986b-e9c01e39090c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ek) Tiền lương, tiền công của chủ doanh nghiệp tư nhân; thù lao trả cho sáng lập viên doanh nghiệp không trực tiếp tham gia điều hành sản xuất, kinh doanh; tiền lương, tiền công, các khoản hạch toán khác để trả cho người lao động nhưng thực tế không chi trả hoặc không có hóa đơn, chứng từ theo quy định của pháp luật;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffafff0-29c8-11f1-a938-3b159584431f\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\" parent-id=\"7ff867e0-29c8-11f1-986b-e9c01e39090c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003el) Chi trả lãi tiền vay vốn tương ứng với phần vốn điều lệ còn thiếu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffb2700-29c8-11f1-908b-4d10acfbafd7\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\" parent-id=\"7ff867e0-29c8-11f1-986b-e9c01e39090c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003em) Thuế giá trị gia tăng đầu vào đã được khấu trừ, thuế giá trị gia tăng nộp theo phương pháp khấu trừ, thuế thu nhập doanh nghiệp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffb7520-29c8-11f1-909b-c3b5bdb1ce2d\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\" parent-id=\"7ff867e0-29c8-11f1-986b-e9c01e39090c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003en) Phần chi quảng cáo, tiếp thị, khuyến mại, hoa hồng môi giới; chi tiếp tân, khánh tiết, hội nghị; chi hỗ trợ tiếp thị, chi hỗ trợ chi phí, chiết khấu thanh toán; chi báo biếu, báo tặng của cơ quan báo chí liên quan trực tiếp đến hoạt động sản xuất, kinh doanh vượt quá 10% tổng số chi được trừ; đối với doanh nghiệp thành lập mới là phần chi vượt quá 15% trong ba năm đầu, kể từ khi được thành lập. Tổng số chi được trừ không bao gồm các khoản chi quy định tại điểm này; đối với hoạt động thương mại, tổng số chi được trừ không bao gồm giá mua của hàng hóa bán ra;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffb9c30-29c8-11f1-985f-f3199ef85043\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\" parent-id=\"7ff867e0-29c8-11f1-986b-e9c01e39090c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eo) Khoản tài trợ, trừ khoản tài trợ cho giáo dục, y tế, khắc phục hậu quả thiên tai và làm nhà tình nghĩa cho người nghèo theo quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffbc340-29c8-11f1-978e-1d37011df9c6\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" parent-id=\"7ff867e0-29c8-11f1-986b-e9c01e39090c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Khoản chi bằng ngoại tệ được trừ khi xác định thu nhập chịu thuế phải quy đổi ra đồng Việt Nam theo tỷ giá giao dịch bình quân trên thị trường ngoại tệ liên ngân hàng do Ngân hàng Nhà nước Việt Nam công bố tại thời điểm phát sinh chi phí bằng ngoại tệ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChính phủ quy định chi tiết và hướng dẫn thi hành Điều này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffc3870-29c8-11f1-b414-cb13668ee27d\" class=\"MsoNormal prov-article\" style=\"font-size: 14px;\" type=\"10:dfba0af2-eb99-11f0-9c78-590b30ca93b3\" new-types=\"10:b382aa80-26e4-11f1-b2ab-b99bdf28c68c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eĐiều 10. Thuế suất\u003c/b\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffc5f80-29c8-11f1-9f52-e116e87f38d0\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" parent-id=\"7ffc3870-29c8-11f1-b414-cb13668ee27d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Thuế suất thuế thu nhập doanh nghiệp là 25%, trừ trường hợp quy định tại khoản 2 Điều này và Điều 13 của Luật này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffc8690-29c8-11f1-b581-9fce80b9b768\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" parent-id=\"7ffc3870-29c8-11f1-b414-cb13668ee27d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Thuế suất thuế thu nhập doanh nghiệp đối với hoạt động tìm kiếm, thăm dò, khai thác dầu khí và tài nguyên quý hiếm khác từ 32% đến 50% phù hợp với từng dự án, từng cơ sở kinh doanh.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChính phủ quy định chi tiết và hướng dẫn thi hành Điều này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffcada0-29c8-11f1-8510-cd8dc673a9ab\" class=\"MsoNormal prov-article\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eĐiều 11. Phương pháp tính thuế\u003c/b\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffcd4b0-29c8-11f1-ad3e-f3e8584f061f\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Số thuế thu nhập doanh nghiệp phải nộp trong kỳ tính thuế được tính bằng thu nhập tính thuế nhân với thuế suất; trường hợp doanh nghiệp đã nộp thuế thu nhập ở ngoài Việt Nam thì được trừ số thuế thu nhập đã nộp nhưng tối đa không quá số thuế thu nhập doanh nghiệp phải nộp theo quy định của Luật này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffcfbc0-29c8-11f1-922d-f78c5df9380e\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Phương pháp tính thuế đối với doanh nghiệp quy định tại điểm c và điểm d khoản 2 Điều 2 của Luật này được thực hiện theo quy định của Chính phủ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffd22d0-29c8-11f1-ac65-6bc0742dbb3d\" class=\"MsoNormal prov-article\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eĐiều 12. Nơi nộp thuế\u003c/b\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eDoanh nghiệp nộp thuế tại nơi có trụ sở chính. Trường hợp doanh nghiệp có cơ sở sản xuất hạch toán phụ thuộc hoạt động tại địa bàn tỉnh, thành phố trực thuộc trung ương khác với địa bàn nơi doanh nghiệp có trụ sở chính thì số thuế được tính nộp theo tỷ lệ chi phí giữa nơi có cơ sở sản xuất và nơi có trụ sở chính. Việc phân cấp, quản lý, sử dụng nguồn thu được thực hiện theo quy định của Luật ngân sách nhà nước.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChính phủ quy định chi tiết và hướng dẫn thi hành Điều này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffd70f0-29c8-11f1-a690-2b2ed309d620\" class=\"MsoNormal prov-chapter\" style=\"font-size: 14px; text-align: center;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eChương III\u003c/b\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffd70f0-29c8-11f1-a690-2b2ed309d620\" class=\"MsoNormal prov-chapter\" style=\"font-size: 14px; text-align: center;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eƯU ĐÃI THUẾ THU NHẬP DOANH NGHIỆP\u003c/b\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffd9800-29c8-11f1-a4c7-99ab504a9c25\" class=\"MsoNormal prov-article\" style=\"font-size: 14px;\" type=\"10:b382f8a0-26e4-11f1-85d4-a1e9e8fec9ff\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eĐiều 13. Ưu đãi về thuế suất\u003c/b\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffdbf10-29c8-11f1-bd11-c576865b1cb3\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" parent-id=\"7ffd9800-29c8-11f1-a4c7-99ab504a9c25\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Doanh nghiệp thành lập mới từ dự án đầu tư tại địa bàn có điều kiện kinh tế - xã hội đặc biệt khó khăn, khu kinh tế, khu công nghệ cao; doanh nghiệp thành lập mới từ dự án đầu tư thuộc lĩnh vực công nghệ cao, nghiên cứu khoa học và phát triển công nghệ, đầu tư phát triển cơ sở hạ tầng đặc biệt quan trọng của Nhà nước, sản xuất sản phẩm phần mềm được áp dụng thuế suất 10% trong thời gian mười lăm năm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffde620-29c8-11f1-b954-d7d6bfd9d8a0\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" parent-id=\"7ffd9800-29c8-11f1-a4c7-99ab504a9c25\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Doanh nghiệp hoạt động trong lĩnh vực giáo dục – đào tạo, dạy nghề, y tế, văn hóa, thể thao và môi trường được áp dụng thuế suất 10%.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffe0d30-29c8-11f1-b7e9-8175376135bf\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" parent-id=\"7ffd9800-29c8-11f1-a4c7-99ab504a9c25\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Doanh nghiệp thành lập mới từ dự án đầu tư tại địa bàn có điều kiện kinh tế - xã hội khó khăn được áp dụng thuế suất 20% trong thời gian mười năm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffe5b50-29c8-11f1-908a-59f467e4975e\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" parent-id=\"7ffd9800-29c8-11f1-a4c7-99ab504a9c25\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4. Hợp tác xã dịch vụ nông nghiệp và quỹ tín dụng nhân dân được áp dụng thuế suất 20%.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffea970-29c8-11f1-924a-91f9032a5c6f\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" parent-id=\"7ffd9800-29c8-11f1-a4c7-99ab504a9c25\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5. Đối với dự án cần đặc biệt thu hút đầu tư có quy mô lớn và công nghệ cao thì thời gian áp dụng thuế suất ưu đãi có thể kéo dài thêm, nhưng thời gian kéo dài thêm không quá thời hạn quy định tại khoản 1 Điều này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffed080-29c8-11f1-9e46-4d3a1cf7ef43\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" parent-id=\"7ffd9800-29c8-11f1-a4c7-99ab504a9c25\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e6. Thời gian áp dụng thuế suất ưu đãi quy định tại Điều này được tính từ năm đầu tiên doanh nghiệp có doanh thu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChính phủ quy định chi tiết và hướng dẫn thi hành Điều này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7ffef790-29c8-11f1-a30a-0d497515637c\" class=\"prov-article\" style=\"font-size: 14px;\" type=\"10:b3831fb0-26e4-11f1-8e30-bdd956a3f211\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 14. Ưu đãi về thời gian miễn thuế, giảm thuế\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7fff1ea0-29c8-11f1-8438-f3135b003636\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" parent-id=\"7ffef790-29c8-11f1-a30a-0d497515637c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Doanh nghiệp thành lập mới từ dự án đầu tư tại địa bàn có điều kiện kinh tế - xã hội đặc biệt khó khăn, khu kinh tế, khu công nghệ cao; doanh nghiệp thành lập mới từ dự án đầu tư thuộc lĩnh vực công nghệ cao, nghiên cứu khoa học và phát triển công nghệ, đầu tư phát triển cơ sở hạ tầng đặc biệt quan trọng của Nhà nước, sản xuất sản phẩm phần mềm; doanh nghiệp thành lập mới hoạt động trong lĩnh vực giáo dục – đào tạo, dạy nghề, y tế, văn hóa, thể thao và môi trường được miễn thuế tối đa không quá bốn năm và giảm 50% số thuế phải nộp tối đa không quá chín năm tiếp theo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7fff6cc0-29c8-11f1-8dd8-a504007da3bd\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" parent-id=\"7ffef790-29c8-11f1-a30a-0d497515637c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Doanh nghiệp thành lập mới từ dự án đầu tư tại địa bàn có điều kiện kinh tế - xã hội khó khăn được miễn thuế tối đa không quá hai năm và giảm 50% số thuế phải nộp tối đa không quá bốn năm tiếp theo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7fff93d0-29c8-11f1-97ee-9d1b349723d2\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" parent-id=\"7ffef790-29c8-11f1-a30a-0d497515637c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Thời gian miễn thuế, giảm thuế quy định tại Điều này được tính từ năm đầu tiên doanh nghiệp có thu nhập chịu thuế; trường hợp doanh nghiệp không có thu nhập chịu thuế trong ba năm đầu, kể từ năm đầu tiên có doanh thu thì thời gian miễn thuế, giảm thuế được tính từ năm thứ tư.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChính phủ quy định chi tiết và hướng dẫn thi hành Điều này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7fffbae0-29c8-11f1-ab45-17af92332a3a\" class=\"MsoNormal prov-article\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eĐiều 15. Các trường hợp giảm thuế khác\u003c/b\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"7fffe1f0-29c8-11f1-a36f-75d845bca997\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Doanh nghiệp sản xuất, xây dựng, vận tải sử dụng nhiều lao động nữ được giảm thuế thu nhập doanh nghiệp bằng số chi thêm cho lao động nữ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"80003010-29c8-11f1-8e8d-e119b67010ac\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" type=\"13:b3836dd0-26e4-11f1-9f2a-bbf26bfe0272\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Doanh nghiệp sử dụng nhiều lao động là người dân tộc thiểu số được giảm thuế thu nhập doanh nghiệp bằng số chi thêm cho lao động là người dân tộc thiểu số.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChính phủ quy định chi tiết và hướng dẫn thi hành Điều này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"80005720-29c8-11f1-b5a9-2577df180749\" class=\"MsoNormal prov-article\" style=\"font-size: 14px;\" type=\"10:b38394e0-26e4-11f1-882a-475d307dabef\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eĐiều 16. Chuyển lỗ\u003c/b\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8000a540-29c8-11f1-baf8-37306392924c\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" parent-id=\"80005720-29c8-11f1-b5a9-2577df180749\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Doanh nghiệp có lỗ được chuyển số lỗ sang năm sau; số lỗ này được trừ vào thu nhập tính thuế. Thời gian được chuyển lỗ không quá năm năm, kể từ năm tiếp theo năm phát sinh lỗ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8000cc50-29c8-11f1-9f73-2f9a75526d0b\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" parent-id=\"80005720-29c8-11f1-b5a9-2577df180749\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Doanh nghiệp có lỗ từ hoạt động chuyển nhượng bất động sản chỉ được chuyển số lỗ vào thu nhập tính thuế của hoạt động này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8000f360-29c8-11f1-8522-f51424b3f155\" class=\"prov-article\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 17. Trích lập Quỹ phát triển khoa học và công nghệ của doanh nghiệp\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"80011a70-29c8-11f1-bbce-1bc619524377\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" type=\"10:b383bbf0-26e4-11f1-91ab-3f9784ebbe13\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Doanh nghiệp được thành lập, hoạt động theo quy định của pháp luật Việt Nam được trích tối đa 10% thu nhập tính thuế hàng năm để lập Quỹ phát triển khoa học và công nghệ của doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"80016890-29c8-11f1-b388-4fb218f4856d\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Trong thời hạn năm năm, kể từ khi trích lập, nếu Quỹ phát triển khoa học và công nghệ không được sử dụng hoặc sử dụng không hết 70% hoặc sử dụng không đúng mục đích thì doanh nghiệp phải nộp ngân sách nhà nước phần thuế thu nhập doanh nghiệp tính trên khoản thu nhập đã trích lập quỹ mà không sử dụng hoặc sử dụng không đúng mục đích và phần lãi phát sinh từ số thuế thu nhập doanh nghiệp đó.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eThuế suất thuế thu nhập doanh nghiệp dùng để tính số thuế thu hồi là thuế suất áp dụng cho doanh nghiệp trong thời gian trích lập quỹ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLãi suất tính lãi đối với số thuế thu hồi tính trên phần quỹ không sử dụng hết là lãi suất trái phiếu kho bạc loại kỳ hạn một năm áp dụng tại thời điểm thu hồi và thời gian tính lãi là hai năm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLãi suất tính lãi đối với số thuế thu hồi tính trên phần quỹ sử dụng sai mục đích là lãi phạt chậm nộp theo quy định của Luật quản lý thuế và thời gian tính lãi là khoảng thời gian kể từ khi trích lập quỹ đến khi thu hồi.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"80018fa0-29c8-11f1-80b5-4d2a6c667cf8\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Doanh nghiệp không được hạch toán các khoản chi từ Quỹ phát triển khoa học và công nghệ của doanh nghiệp vào chi phí được trừ khi xác định thu nhập chịu thuế trong kỳ tính thuế.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8001b6b0-29c8-11f1-9b3d-4975ac3b1cde\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4. Quỹ phát triển khoa học và công nghệ của doanh nghiệp chỉ được sử dụng cho đầu tư khoa học và công nghệ tại Việt Nam.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"800204d0-29c8-11f1-bf2b-13c102a8d203\" class=\"MsoNormal prov-article\" style=\"font-size: 14px;\" type=\"10:b383e300-26e4-11f1-b01e-874094d567c9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eĐiều 18. Điều kiện áp dụng ưu đãi thuế\u003c/b\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"80022be0-29c8-11f1-ac04-2bee82142a1b\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" parent-id=\"800204d0-29c8-11f1-bf2b-13c102a8d203\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Ưu đãi thuế thu nhập doanh nghiệp quy định tại các điều 13, 14, 15, 16 và 17 của Luật này chỉ áp dụng đối với doanh nghiệp thực hiện chế độ kế toán, hóa đơn, chứng từ và nộp thuế theo kê khai.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"800252f0-29c8-11f1-8e5c-7dda21b6234c\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" parent-id=\"800204d0-29c8-11f1-bf2b-13c102a8d203\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Doanh nghiệp phải hạch toán riêng thu nhập từ hoạt động sản xuất, kinh doanh được ưu đãi thuế quy định tại Điều 13 và Điều 14 của Luật này với thu nhập từ hoạt động sản xuất, kinh doanh không được ưu đãi thuế; trường hợp không hạch toán riêng được thì thu nhập từ hoạt động sản xuất, kinh doanh được ưu đãi thuế được xác định theo tỷ lệ doanh thu giữa hoạt động sản xuất, kinh doanh được ưu đãi thuế trên tổng doanh thu của doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"80027a00-29c8-11f1-b467-b3a5656114bc\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\" parent-id=\"800204d0-29c8-11f1-bf2b-13c102a8d203\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Việc ưu đãi thuế thu nhập doanh nghiệp quy định tại Điều 13 và Điều 14 của Luật này không áp dụng đối với:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8002c820-29c8-11f1-bc14-03e02c56e9ca\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\" parent-id=\"800204d0-29c8-11f1-bf2b-13c102a8d203\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea) Thu nhập quy định tại khoản 2 Điều 3 của Luật này;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8002ef30-29c8-11f1-96eb-695cb0d24f94\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\" parent-id=\"800204d0-29c8-11f1-bf2b-13c102a8d203\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb) Thu nhập từ hoạt động tìm kiếm, thăm dò, khai thác dầu khí và tài nguyên quý hiếm khác;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8002ef3a-29c8-11f1-a840-9f143d2d0d4d\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\" parent-id=\"800204d0-29c8-11f1-bf2b-13c102a8d203\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec) Thu nhập từ kinh doanh trò chơi có thưởng, cá cược theo quy định của pháp luật;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"80033d50-29c8-11f1-a2cd-8935cf140974\" class=\"MsoNormal prov-item\" style=\"font-size: 14px;\" parent-id=\"800204d0-29c8-11f1-bf2b-13c102a8d203\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ed) Trường hợp khác theo quy định của Chính phủ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"80036460-29c8-11f1-b521-85a68f3961ce\" class=\"MsoNormal prov-chapter\" style=\"font-size: 14px; text-align: center;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eChương IV\u003c/b\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"80036460-29c8-11f1-b521-85a68f3961ce\" class=\"MsoNormal prov-chapter\" style=\"font-size: 14px; text-align: center;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eĐIỀU KHOẢN THI HÀNH\u003c/b\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"80038b70-29c8-11f1-b6f7-0503917d368b\" class=\"MsoNormal prov-article\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e\u003cb\u003eĐiều 19. Hiệu lực thi hành\u003c/b\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8003d990-29c8-11f1-b815-cb5b4345e422\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Luật này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2009.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"8003d99a-29c8-11f1-bb7c-7b9803350207\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Luật này thay thế Luật thuế thu nhập doanh nghiệp số 09/2003/QH11.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"800427b0-29c8-11f1-84b1-9fe9c591fa19\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Doanh nghiệp đang hưởng ưu đãi thuế thu nhập doanh nghiệp theo quy định của Luật thuế thu nhập doanh nghiệp số 09/2003/QH11 tiếp tục được hưởng các ưu đãi này cho thời gian còn lại theo quy định của Luật thuế thu nhập doanh nghiệp số 09/2003/QH11; trường hợp mức ưu đãi về thuế thu nhập doanh nghiệp bao gồm cả thuế suất ưu đãi và thời gian miễn thuế, giảm thuế thấp hơn mức ưu đãi theo quy định của Luật này thì được áp dụng ưu đãi thuế theo quy định của Luật này cho thời gian còn lại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"800427ba-29c8-11f1-a259-5fd70c543b8c\" class=\"MsoNormal prov-clause\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4. Doanh nghiệp thuộc diện hưởng thời gian miễn thuế, giảm thuế theo quy định của Luật thuế thu nhập doanh nghiệp số 09/2003/QH11 mà chưa có thu nhập chịu thuế thì thời điểm bắt đầu tính thời gian miễn thuế, giảm thuế được tính theo quy định của Luật này và kể từ ngày Luật này có hiệu lực.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"800427c4-29c8-11f1-a627-6f8d2c01619d\" class=\"prov-article\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 20. Hướng dẫn thi hành\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoNormal prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChính phủ quy định chi tiết và hướng dẫn thi hành các điều 4, 7, 8, 9, 10, 11, 12, 13, 14, 15, 18 và các nội dung cần thiết khác của Luật này theo yêu cầu quản lý.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"MsoBodyText2\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003ci\u003eLuật này đã được Quốc hội nước Cộng hòa xã hội chủ nghĩa Việt Nam khóa XII, kỳ họp thứ 3 thông qua ngày 03 tháng 6 năm 2008./.\u003c/i\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cdiv\u003e\n   \u003cdiv style=\"width: 100%; margin-top: 32px; font-family: 'Times New Roman', serif; font-size: 14px; color: #000; display: flex; justify-content: flex-end;\"\u003e\n    \u003cdiv style=\"display: table-cell; width: 50%; text-align: center; vertical-align: top; font-weight: bold; line-height: 1.8;\"\u003e\n     \u003cdiv style=\"font-weight: bold; text-transform: uppercase; line-height: 1.3;\"\u003e\n      \u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCHỦ TỊCH QUỐC HỘI\u003c/span\u003e\n     \u003c/div\u003e\n     \u003cdiv style=\"font-style: italic; font-weight: bold;\"\u003e\n      \u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(Đã ký)\u003c/span\u003e\n     \u003c/div\u003e\n     \u003cdiv style=\"font-weight: bold; margin-top: 16px;\"\u003e\n      \u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNguyễn Phú Trọng\u003c/span\u003e\n     \u003c/div\u003e\n    \u003c/div\u003e\n   \u003c/div\u003e\n  \u003c/div\u003e\n \u003c/body\u003e\n\u003c/html\u003e"])</script><script>self.__next_f.push([1,"d:[[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"Legislation\\\",\\\"name\\\":\\\"Luật Thuế thu nhập doanh nghiệp số 14/2008/QH12\\\",\\\"legislationIdentifier\\\":\\\"14/2008/QH12\\\",\\\"legislationType\\\":\\\"Luật\\\",\\\"legislationDate\\\":\\\"2008-06-03T00:00:00\\\",\\\"legislationLegalForce\\\":\\\"PartiallyInForce\\\",\\\"legislationPassedBy\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Quốc hội\\\"},\\\"legislationJurisdiction\\\":\\\"VN\\\",\\\"url\\\":\\\"https://vbpl.vn/van-ban/chi-tiet/luat-thue-thu-nhap-doanh-nghiep-so-14-2008-qh12--12807\\\",\\\"inLanguage\\\":\\\"vi\\\",\\\"keywords\\\":\\\"Luật, Chưa phân loại, Quốc hội, văn bản pháp lu

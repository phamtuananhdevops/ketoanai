lGazette\":{\"title\":\"Cổng Thông tin điện tử\u003cbr/\u003eCông báo\",\"description\":\"Cổng thông tin chính thức của Cơ quan Công báo Việt Nam\"},\"feedbackSuggestions\":{\"title\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\",\"description\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\"}}},\"footer\":{\"unit\":\"Đơn vị chủ quản\",\"unitContent\":\"Bộ Tư pháp\",\"address\":\"Địa chỉ\",\"addressContent\":\"Số 60 Trần Phú - Ba Đình - Thành phố Hà Nội\",\"phoneNumber\":\"Điện thoại\",\"phoneNumberContent\":\"024.6273.9468\",\"fax\":\"Fax\",\"faxContent\":\"024.6273.9359\"},\"underConstruction\":{\"title\":\"Đang cập nhật\",\"message\":\"Chức năng này đang được phát triển.\"},\"gioiThieu\":{\"timeline\":{\"2005\":{\"description\":\"Năm 2005 đánh dấu sự khởi đầu của dự án xây dựng Cơ sở dữ liệu quốc gia về pháp luật, với mục tiêu số hóa và tập trung hóa các văn bản pháp luật của Việt Nam.\"},\"2012-2013\":{\"description\":\"Giai đoạn 2012-2013 là thời kỳ phát triển và mở rộng hệ thống, với việc tích hợp thêm nhiều tính năng và cải thiện giao diện người dùng.\"},\"2023-2025\":{\"description\":\"Giai đoạn 2023-2025 tập trung vào việc nâng cấp và hiện đại hóa hệ thống, áp dụng các công nghệ mới và mở rộng phạm vi phục vụ.\"}},\"overview\":{\"title\":\"SƠ LƯỢC MÔ HÌNH CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"CSDLQG về pháp luật tập hợp các văn bản quy phạm pháp luật và văn bản hợp nhất văn bản quy phạm pháp luật (sau đây gọi chung là văn bản) dưới dạng văn bản điện tử do Chính phủ thống nhất quản lý, có địa chỉ truy cập vbpl.vn, bao gồm các Cơ sở dữ liệu thành phần: Cơ sở dữ liệu văn bản pháp luật Trung ương và Cơ sở dữ liệu văn bản pháp luật địa phương.\",\"central\":{\"title\":\"Cơ sở dữ liệu Văn bản pháp luật Trung ương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của các Bộ, cơ quan ngang Bộ, cơ quan nhà nước khác ở Trung ương ban hành hoặc phối hợp ban hành. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật; Văn bản hợp nhất; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"local\":{\"title\":\"Cơ sở dữ liệu văn bản pháp luật địa phương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của từng tỉnh, thành phố trực thuộc Trung ương trên toàn quốc. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật của Hội đồng nhân dân và Ủy ban nhân dân; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"other\":{\"title\":\"Các chuyên mục khác\",\"content\":\"Ngoài các Cơ sở dữ liệu thành phần kể trên, CSDLQG về pháp luật còn có các chuyên mục khác như: Giới thiệu văn bản mới, Tin tức, Tình huống pháp luật. Ngoài ra, CSDLQG về thủ tục hành chính, bộ pháp điển điện tử, cổng thông tin điện tử Bộ Tư pháp cũng trích xuất về CSDLQG về pháp luật.\"}},\"vision\":{\"title\":\"Tầm nhìn\",\"content\":\"Trở thành nguồn tra cứu văn bản pháp luật chính thống, đầy đủ và đáng tin cậy, phục vụ hiệu quả cho người dân, doanh nghiệp và cơ quan nhà nước.\"},\"mission\":{\"title\":\"Sứ mệnh\",\"content\":\"Cung cấp hệ thống văn bản pháp luật được cập nhật kịp thời, tra cứu thuận tiện, góp phần nâng cao nhận thức pháp luật và bảo đảm việc tuân thủ pháp luật trong xã hội.\"},\"features\":{\"title\":\"MỘT SỐ TÍNH NĂNG, TIỆN ÍCH CỦA CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"Hiện nay, CSDLQG về PL có giao diện tương đối thân thiện, dễ tìm kiếm, dễ khai thác các thông tin và tải về sử dụng. Cơ sở dữ liệu cung cấp các chức năng, tiện ích cơ bản và thuận tiện\",\"list\":[{\"key\":\"fullText\",\"label\":\"Tra cứu toàn văn\",\"icon\":\"SearchOutlined\"},{\"key\":\"tableOfContents\",\"label\":\"Tự động tạo mục lục\",\"icon\":\"BookOutlined\"},{\"key\":\"relatedDocuments\",\"label\":\"Liên kết văn bản liên quan\",\"icon\":\"LinkOutlined\"},{\"key\":\"validity\",\"label\":\"Xác định hiệu lực tự động\",\"icon\":\"BarChartOutlined\"},{\"key\":\"validityHistory\",\"label\":\"Lịch sử hiệu lực\",\"icon\":\"ClockCircleOutlined\"},{\"key\":\"download\",\"label\":\"Tải văn bản\",\"icon\":\"DownloadOutlined\"},{\"key\":\"english\",\"label\":\"Xem văn cc326b2041b88f5.js\",\"119\",\"static/chunks/119-af8d6d47e84615fe.js\",\"6625\",\"static/chunks/6625-1107db2d5233eb73.js\",\"3954\",\"static/chunks/3954-946ccf0eafc577be.js\",\"5292\",\"static/chunks/5292-beb20880bf4a7330.js\",\"3207\",\"static/chunks/3207-0792bf349fc6782d.js\",\"7287\",\"static/chunks/7287-1e02014aaec038d7.js\",\"2007\",\"static/chunks/2007-dba949ac429f5003.js\",\"4310\",\"static/chunks/app/%5Blocale%5D/van-ban/%5Bcategory%5D/%5Bid%5D/page-75f20aedc57a9c0c.js\"],\"default\"]\n2b:T17ae7,"])</script><script>self.__next_f.push([1,"\u003c!DOCTYPE html\u003e\n\u003chtml\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n    \u003ctitle\u003eDocument Content\u003c/title\u003e\n    \u003cstyle\u003e\n        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }\n        p { margin: 10px 0; }\n    \u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"margin:0cm 0cm 0pt;text-align:center;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eNGHỊ ĐỊNH\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"margin:0cm 0cm 0pt;text-align:center;\"\u003e\u003cb style=\"\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eQuy định chi tiết và hướng dẫn thi hành một số điều của Luật Thuế thu nhập doanh nghiệp \u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"margin:0cm 0cm 0pt;text-align:center;\"\u003e\u003cb style=\"\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e_______________________________________\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:center;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eCHÍNH PHỦ\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cem\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eCăn cứ Luật Tổ chức Chính phủ ngày 25 tháng 12 năm 2001;\u003c/span\u003e\u003c/em\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cem\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eCăn cứ Luật Thuế thu nhập doanh nghiệp ngày 03 tháng 6 năm 2008;\u003c/span\u003e\u003c/em\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cem\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eXét đề nghị của Bộ trưởng Bộ Tài chính,\u003c/span\u003e\u003c/em\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:center;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eNGHỊ ĐỊNH:\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:center;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eChương I\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:center;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eQUY ĐỊNH CHUNG\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐiều 1. Phạm vi điều chỉnh\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eNghị định này quy định chi tiết và hướng dẫn thi hành một số điều của Luật Thuế thu nhập doanh nghiệp ngày 03 tháng 6 năm 2008 (sau đây gọi tắt là Luật Thuế thu nhập doanh nghiệp).\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐiều 2. Người nộp thuế\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eNgười nộp thuế thực hiện theo quy định tại Điều 2 Luật Thuế thu nhập doanh nghiệp\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e1. Người nộp thuế theo quy định tại khoản 1 Điều 2 Luật Thuế thu nhập doanh nghiệp bao gồm: \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ea. Doanh nghiệp được thành lập và hoạt động theo quy định của Luật Doanh nghiệp, Luật Doanh nghiệp nhà nước, Luật Đầu tư nước ngoài tại Việt Nam, Luật Đầu tư, Luật Các tổ chức tín dụng, Luật Kinh doanh bảo hiểm, Luật Chứng khoán, Luật Dầu khí, Luật Thương mại và quy định tại các văn bản pháp luật khác dưới các hình thức: công ty cổ phần; công ty trách nhiệm hữu hạn; công ty hợp danh; doanh nghiệp tư nhân; công ty Nhà nước; các bên trong hợp đồng hợp tác kinh doanh; các bên trong hợp đồng phân chia sản phẩm dầu khí, xí nghiệp liên doanh dầu khí, công ty điều hành chung;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eb. Doanh nghiệp được thành lập theo quy định của pháp luật nước ngoài (sau đây gọi là doanh nghiệp nước ngoài) có cơ sở thường trú hoặc không có cơ sở thường trú tại Việt Nam;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ec. Các đơn vị sự nghiệp công lập, ngoài công lập sản xuất, kinh doanh hàng hóa, dịch vụ có thu nhập chịu thuế theo quy định tại Điều 3 Nghị định này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ed. Các tổ chức được thành lập và hoạt động theo Luật Hợp tác xã;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eđ. Tổ chức khác ngoài tổ chức quy định tại các điểm a, b, c, d khoản này có hoạt động sản xuất, kinh doanh và có thu nhập chịu thuế theo quy định tại Điều 3 Nghị định này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e2. Tổ chức được thành lập và hoạt động (hoặc đăng ký hoạt động) theo quy định của pháp luật Việt Nam, cá nhân kinh doanh là người nộp thuế theo phương pháp khấu trừ tại nguồn trong trường hợp mua dịch vụ (kể cả mua dịch vụ gắn với hàng hóa) của doanh nghiệp quy định tại điểm c, d khoản 2 Điều 2 Luật Thuế thu nhập doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eBộ Tài chính hướng dẫn cụ thể việc khấu trừ thuế quy định tại khoản này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐiều 3. Thu nhập chịu thuế\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e1. Thu nhập chịu thuế bao gồm thu nhập từ hoạt động sản xuất, kinh doanh hàng hóa, dịch vụ và thu nhập khác quy định tại khoản 2 Điều này. Đối với doanh nghiệp đăng ký kinh doanh và có thu nhập quy định tại khoản 2 Điều này thì thu nhập này được xác định là thu nhập từ hoạt động sản xuất, kinh doanh của cơ sở.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e2. Thu nhập khác bao gồm:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ea. Thu nhập từ chuyển nhượng vốn bao gồm thu nhập từ việc chuyển nhượng một phần hoặc toàn bộ số vốn đã đầu tư vào doanh nghiệp, kể cả trường hợp bán doanh nghiệp, chuyển nhượng chứng khoán và các hình thức chuyển nhượng vốn khác theo quy định của pháp luật;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eb. Thu nhập từ chuyển nhượng bất động sản quy định tại Điều 13 Nghị định này;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ec. Thu nhập từ quyền sở hữu, quyền sử dụng tài sản bao gồm cả tiền thu về bản quyền dưới mọi hình thức, thu về quyền sở hữu trí tuệ; thu nhập từ chuyển giao công nghệ theo quy định của pháp luật. Cho thuê tài sản dưới mọi hình thức;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ed. Thu nhập từ chuyển nhượng, thanh lý tài sản (trừ bất động sản), các loại giấy tờ có giá khác;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eđ. Thu nhập từ lãi tiền gửi, lãi cho vay vốn, bán ngoại tệ bao gồm: lãi tiền gửi tại các tổ chức tín dụng, lãi cho vay vốn dưới mọi hình thức theo quy định của pháp luật, phí bảo lãnh tín dụng và các khoản phí khác trong hợp đồng cho vay vốn. Thu nhập từ bán ngoại tệ;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ee. Hoàn nhập các khoản dự phòng, các khoản trích trước vào chi phí nhưng không sử dụng hoặc sử dụng không hết theo kỳ hạn trích lập;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eg. Khoản nợ khó đòi đã xóa nay đòi được;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eh. Khoản nợ phải trả không xác định được chủ nợ;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ei. Khoản thu nhập từ kinh doanh của những năm trước bị bỏ sót phát hiện ra;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ek. Chênh lệch giữa thu về tiền phạt, tiền bồi thường do vi phạm hợp đồng kinh tế trừ (-) đi khoản bị phạt, trả bồi thường do vi phạm hợp đồng theo quy định của pháp luật;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003el. Các khoản tài trợ bằng tiền hoặc hiện vật nhận được, trừ khoản tài trợ quy định tại khoản 6 Điều 4 Nghị định này;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003em. Chênh lệch do đánh giá lại tài sản theo quy định của pháp luật để góp vốn, điều chuyển khi chia, tách, sáp nhập, hợp nhất, chuyển đổi loại hình doanh nghiệp, trừ trường hợp đánh giá tài sản cố định khi chuyển doanh nghiệp Nhà nước thành công ty cổ phần.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eDoanh nghiệp nhận tài sản được hạch toán theo giá đánh giá lại khi xác định chi phí được trừ quy định tại Điều 9 Nghị định này;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003en. Thu nhập nhận được từ hoạt động sản xuất, kinh doanh ở ngoài Việt Nam;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eo. Các khoản thu nhập khác theo quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e3. Thu nhập chịu thuế phát sinh tại Việt Nam của các doanh nghiệp quy định tại điểm c, d khoản 2 Điều 2 Luật Thuế thu nhập doanh nghiệp là thu nhập nhận được có nguồn gốc từ Việt Nam từ hoạt động cung ứng dịch vụ, cho vay vốn, tiền bản quyền cho tổ chức, cá nhân Việt Nam hoặc cho tổ chức, cá nhân nước ngoài đang kinh doanh tại Việt Nam, không phụ thuộc vào địa điểm tiến hành kinh doanh.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eThu nhập chịu thuế quy định tại khoản này không bao gồm thu nhập từ dịch vụ thực hiện ngoài lãnh thổ Việt Nam như: sửa chữa phương tiện vận tải, máy móc, thiết bị ở nước ngoài; quảng cáo, tiếp thị, xúc tiến đầu tư và xúc tiến thương mại ở nước ngoài; môi giới bán hàng hóa ở nước ngoài; đào tạo ở nước ngoài; chia cước dịch vụ bưu chính, viễn thông quốc tế cho phía nước ngoài.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eBộ Tài chính hướng dẫn cụ thể về thu nhập chịu thuế quy định tại khoản này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐiều 4. Thu nhập được miễn thuế\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eThu nhập được miễn thuế thực hiện theo quy định tại Điều 4 Luật Thuế thu nhập doanh nghiệp\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e1. Đối với thu nhập từ việc thực hiện dịch vụ kỹ thuật trực tiếp phục vụ nông nghiệp được miễn thuế gồm: thu nhập từ dịch vụ tưới, tiêu nước; cày, bừa đất, nạo vét kênh, mương nội đồng; dịch vụ phòng trừ sâu, bệnh cho cây trồng, vật nuôi; dịch vụ thu hoạch sản phẩm nông nghiệp.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e2. Đối với thu nhập từ việc thực hiện hợp đồng nghiên cứu khoa học và phát triển công nghệ, thu nhập từ kinh doanh sản phẩm sản xuất thử nghiệm và thu nhập từ sản xuất sản phẩm làm ra từ công nghệ mới lần đầu tiên áp dụng tại Việt Nam, thời gian miễn thuế tối đa không quá 01 năm, kể từ ngày bắt đầu sản xuất sản phẩm theo hợp đồng nghiên cứu khoa học và ứng dụng công nghệ, sản xuất thử nghiệm hoặc sản xuất theo công nghệ mới.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eBộ Tài chính hướng dẫn cụ thể quy định tại khoản này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e3. Thu nhập từ hoạt động sản xuất, kinh doanh hàng hóa, dịch vụ của doanh nghiệp có từ 51% số lao động bình quân trong năm trở lên là người khuyết tật, người sau cai nghiện, người nhiễm HIV.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eThu nhập được miễn thuế quy định tại khoản này không bao gồm thu nhập khác quy định tại khoản 2 Điều 3 Nghị định này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e4. Thu nhập từ hoạt động dạy nghề dành riêng cho người dân tộc thiểu số, người khuyết tật, trẻ em có hoàn cảnh đặc biệt khó khăn, đối tượng tệ nạn xã hội. Trường hợp cơ sở dạy nghề có cả các đối tượng khác thì phần thu nhập được miễn thuế được xác định theo tỷ lệ giữa số người dân tộc thiểu số, người khuyết tật, trẻ em có hoàn cảnh đặc biệt khó khăn, đối tượng tệ nạn xã hội so với tổng số người học của cơ sở.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e5. Thu nhập được chia từ hoạt động góp vốn, mua cổ phần, liên doanh, liên kết kinh tế với doanh nghiệp trong nước, sau khi bên nhận góp vốn, phát hành cổ phiếu, liên doanh, liên kết đã nộp thuế theo quy định của Luật Thuế thu nhập doanh nghiệp, kể cả trường hợp bên nhận góp vốn, phát hành cổ phiếu, bên liên doanh, liên kết đang được hưởng ưu đãi thuế quy định tại Chương IV Nghị định này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e6. Khoản tài trợ nhận được để sử dụng cho hoạt động giáo dục, nghiên cứu khoa học, văn hóa, nghệ thuật, từ thiện, nhân đạo và hoạt động xã hội khác tại Việt Nam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eTrường hợp tổ chức nhận tài trợ sử dụng không đúng mục đích các khoản tài trợ trên thì phải nộp lại thuế thu nhập doanh nghiệp theo mức thuế suất 25% tính trên số tiền nhận tài trợ sử dụng không đúng mục đích.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eTổ chức nhận tài trợ quy định tại khoản này là tổ chức được thành lập và hoạt động theo quy định của pháp luật, thực hiện đúng quy định của pháp luật về kế toán thống kê.\u003c/span\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:center;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eChương II\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:center;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eCĂN CỨ VÀ PHƯƠNG PHÁP TÍNH THUẾ\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐiều 5. Căn cứ tính thuế\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eCăn cứ tính thuế là thu nhập tính thuế trong kỳ và thuế suất.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eKỳ tính thuế thực hiện theo quy định tại Điều 5 Luật Thuế thu nhập doanh nghiệp và quy định của pháp luật quản lý thuế.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eDoanh nghiệp được lựa chọn kỳ tính thuế theo năm dương lịch hoặc năm tài chính nhưng phải đăng ký với cơ quan thuế trước khi thực hiện.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐiều 6. Xác định thu nhập tính thuế\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e1. Thu nhập tính thuế trong kỳ tính thuế được xác định như sau:\u003c/span\u003e\u003c/p\u003e\n\u003cdiv align=\"center\"\u003e\n \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" class=\"MsoNormalTable\" style=\"border-collapse:collapse;\"\u003e\n  \u003ctbody\u003e\n   \u003ctr style=\"\"\u003e\n    \u003ctd style=\"border-right:#ece9d8;padding-right:5.4pt;border-top:#ece9d8;padding-left:5.4pt;padding-bottom:0cm;border-left:#ece9d8;width:68.4pt;padding-top:0cm;border-bottom:#ece9d8;background-color:transparent;\" width=\"91\"\u003e\n     \u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eThu nhập tính thuế\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003ctd style=\"border-right:#ece9d8;padding-right:5.4pt;border-top:#ece9d8;padding-left:5.4pt;padding-bottom:0cm;border-left:#ece9d8;width:18pt;padding-top:0cm;border-bottom:#ece9d8;background-color:transparent;\" width=\"24\"\u003e\n     \u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e=\u003

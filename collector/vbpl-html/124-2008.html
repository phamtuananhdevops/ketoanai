e=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eThu nhập chịu thuế\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003ctd style=\"border-right:#ece9d8;padding-right:5.4pt;border-top:#ece9d8;padding-left:5.4pt;padding-bottom:0cm;border-left:#ece9d8;width:18pt;padding-top:0cm;border-bottom:#ece9d8;background-color:transparent;\" width=\"24\"\u003e\n     \u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e=\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003ctd style=\"border-right:#ece9d8;padding-right:5.4pt;border-top:#ece9d8;padding-left:5.4pt;padding-bottom:0cm;border-left:#ece9d8;width:11.8pt;padding-top:0cm;border-bottom:#ece9d8;background-color:transparent;\" width=\"16\"\u003e\n     \u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003ctd style=\"border-right:#ece9d8;padding-right:5.4pt;border-top:#ece9d8;padding-left:5.4pt;padding-bottom:0cm;border-left:#ece9d8;width:42.2pt;padding-top:0cm;border-bottom:#ece9d8;background-color:transparent;\" width=\"56\"\u003e\n     \u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eDoanh thu\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003ctd style=\"border-right:#ece9d8;padding-right:5.4pt;border-top:#ece9d8;padding-left:5.4pt;padding-bottom:0cm;border-left:#ece9d8;width:18pt;padding-top:0cm;border-bottom:#ece9d8;background-color:transparent;\" width=\"24\"\u003e\n     \u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e-\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003ctd style=\"border-right:#ece9d8;padding-right:5.4pt;border-top:#ece9d8;padding-left:5.4pt;padding-bottom:0cm;border-left:#ece9d8;width:54pt;padding-top:0cm;border-bottom:#ece9d8;background-color:transparent;\" width=\"72\"\u003e\n     \u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eChi phí được trừ\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003ctd style=\"border-right:#ece9d8;padding-right:5.4pt;border-top:#ece9d8;padding-left:5.4pt;padding-bottom:0cm;border-left:#ece9d8;width:13.8pt;padding-top:0cm;border-bottom:#ece9d8;background-color:transparent;\" width=\"18\"\u003e\n     \u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003ctd style=\"border-right:#ece9d8;padding-right:5.4pt;border-top:#ece9d8;padding-left:5.4pt;padding-bottom:0cm;border-left:#ece9d8;width:16.65pt;padding-top:0cm;border-bottom:#ece9d8;background-color:transparent;\" width=\"22\"\u003e\n     \u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e+\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003ctd style=\"border-right:#ece9d8;padding-right:5.4pt;border-top:#ece9d8;padding-left:5.4pt;padding-bottom:0cm;border-left:#ece9d8;width:59.55pt;padding-top:0cm;border-bottom:#ece9d8;background-color:transparent;\" width=\"79\"\u003e\n     \u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eCác khoản thu nhập khác\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n   \u003c/tr\u003e\n  \u003c/tbody\u003e\n \u003c/table\u003e\n\u003c/div\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eDoanh nghiệp có nhiều hoạt động kinh doanh thì thu nhập chịu thuế từ hoạt động sản xuất, kinh doanh là tổng thu nhập của tất cả các hoạt động kinh doanh. Trường hợp nếu có hoạt động kinh doanh bị lỗ thì được bù trừ số lỗ vào thu nhập chịu thuế của các hoạt động kinh doanh có thu nhập do doanh nghiệp tự lựa chọn. Phần thu nhập còn lại sau khi bù trừ áp dụng mức thuế suất thuế thu nhập doanh nghiệp của hoạt động kinh doanh còn thu nhập.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eThu nhập từ chuyển nhượng bất động sản phải hạch toán riêng để kê khai nộp thuế, không được bù trừ vào thu nhập hoặc lỗ của các hoạt động kinh doanh khác.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e3. Việc xác định thu nhập chịu thuế đối với một số hoạt động sản xuất, kinh doanh được quy định như sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ea. Đối với thu nhập từ chuyển nhượng vốn (trừ thu nhập từ chuyển nhượng chứng khoán quy định tại điểm b khoản này) được xác định bằng tổng số tiền thu theo hợp đồng chuyển nhượng trừ (-) giá mua phần vốn được chuyển nhượng, trừ (-) chi phí liên quan đến việc chuyển nhượng;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eb. Đối với thu nhập từ chuyển nhượng chứng khoán được xác định bằng giá bán trừ (-) giá mua của chứng khoán được chuyển nhượng, trừ (-) các chi phí liên quan đến việc chuyển nhượng chứng khoán;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ec. Đối với thu nhập từ bản quyền sở hữu trí tuệ, chuyển giao công nghệ được xác định bằng tổng số tiền thu được trừ (-) giá vốn hoặc chi phí tạo ra quyền sở hữu trí tuệ, công nghệ được chuyển giao, trừ (-) chi phí duy trì, nâng cấp, phát triển quyền sở hữu trí tuệ, công nghệ được chuyển giao và các khoản chi được trừ khác;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ed. Đối với thu nhập về cho thuê tài sản được xác định bằng doanh thu cho thuê trừ (-) các khoản trích khấu hao cơ bản, chi phí duy tu, sửa chữa, bảo dưỡng tài sản, chi phí thuê tài sản để cho thuê lại (nếu có) và các chi phí khác được trừ liên quan đến việc cho thuê tài sản.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eđ. Thu nhập từ chuyển nhượng, thanh lý tài sản (trừ bất động sản) bằng số tiền thu từ chuyển nhượng, thanh lý tài sản trừ (-) giá trị còn lại của tài sản ghi trên sổ sách kế toán tại thời điểm chuyển nhượng, thanh lý và các khoản chi phí được trừ liên quan đến việc chuyển nhượng, thanh lý tài sản;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ee. Thu nhập từ hoạt động bán ngoại tệ bằng tổng số tiền thu từ bán ngoại tệ trừ (-) giá mua của số lượng ngoại tệ bán ra (không bao gồm chênh lệch tỷ giá hối đoái do đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ cuối năm tài chính, chênh lệch tỷ giá phát sinh trong quá trình đầu tư xây dựng cơ bản giai đoạn trước hoạt động sản xuất kinh doanh);\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eg. Chênh lệch do đánh giá lại tài sản cố định khi góp vốn là phần chênh lệch giữa giá trị đánh giá lại với giá trị còn lại của tài sản cố định, được phân bổ theo số năm còn được trích khấu hao của tài sản cố định đánh giá lại tại doanh nghiệp góp vốn;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐối với tài sản cố định được điều chuyển khi chia, tách, hợp nhất, sáp nhập, chuyển đổi loại hình doanh nghiệp, là phần chênh lệch giữa giá trị đánh giá lại so với giá trị ghi trên sổ sách kế toán hoặc so với giá trị còn lại của tài sản cố định.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐối với tài sản không phải là tài sản cố định là phần chênh lệch giữa giá đánh giá lại với giá trị ghi trên sổ sách kế toán;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eh. Các khoản thu nhập nhận được từ hoạt động sản xuất, kinh doanh, dịch vụ ở nước ngoài là tổng các khoản thu nhập trước thuế.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e4. Thu nhập từ hoạt động thăm dò, khai thác dầu khí được xác định theo từng hợp đồng dầu khí.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐiều 7. Xác định lỗ và chuyển lỗ\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e1. Lỗ phát sinh trong kỳ tính thuế là số chênh lệch âm (-) về thu nhập chịu thuế được xác định theo công thức quy định tại khoản 2 Điều 6 Nghị định này;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e2. Doanh nghiệp có lỗ thì được chuyển lỗ sang năm sau; số lỗ này được trừ vào thu nhập chịu thuế. Thời gian được chuyển lỗ tính liên tục không quá 5 năm, kể từ năm tiếp sau năm phát sinh lỗ.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e3. Lỗ từ hoạt động chuyển nhượng bất động sản phải được hạch toán riêng và chỉ được bù trừ với thu nhập chịu thuế của hoạt động này, thời gian chuyển lỗ tối đa không quá 5 năm liên tục, kể từ năm tiếp sau năm phát sinh lỗ.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐiều 8. Doanh thu\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eDoanh thu để tính thu nhập chịu thuế thực hiện theo quy định tại Điều 8 Luật Thuế thu nhập doanh nghiệp\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e1. Doanh thu để tính thu nhập chịu thuế là toàn bộ tiền bán hàng, tiền gia công, tiền cung ứng dịch vụ kể cả trợ giá, phụ thu, phụ trội mà doanh nghiệp được hưởng, không phân biệt đã thu được tiền hay chưa thu được tiền.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐối với doanh nghiệp kê khai, nộp thuế giá trị gia tăng theo phương pháp khấu trừ thuế thì doanh thu tính thuế thu nhập doanh nghiệp là doanh thu không có thuế giá trị gia tăng. Đối với doanh nghiệp kê khai, nộp thuế giá trị gia tăng theo phương pháp trực tiếp trên giá trị gia tăng thì doanh thu tính thuế thu nhập doanh nghiệp bao gồm cả thuế giá trị gia tăng.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e2. Thời điểm xác định doanh thu để tính thu nhập chịu thuế đối với hàng hóa bán ra là thời điểm chuyển giao quyền sở hữu, quyền sử dụng hàng hóa cho người mua.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eThời điểm xác định doanh thu để tính thu nhập chịu thuế đối với dịch vụ là thời điểm hoàn thành việc cung ứng dịch vụ cho người mua hoặc thời điểm lập hóa đơn cung ứng dịch vụ.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e3. Doanh thu để tính thu nhập chịu thuế đối với một số trường hợp được quy định cụ thể như sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ea. Đối với hàng hóa bán theo phương thức trả góp được xác định theo giá bán hàng hóa trả tiền một lần, không bao gồm tiền lãi trả góp, trả chậm;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eb. Đối với hàng hóa, dịch vụ dùng để trao đổi, biếu, tặng, tiêu dùng nội bộ được xác định theo giá bán của sản phẩm, hàng hóa, dịch vụ cùng loại hoặc tương đương tại thời điểm trao đổi, biếu, tặng, tiêu dùng nội bộ;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ec. Đối với hoạt động gia công hàng hóa là tiền thu về hoạt động gia công bao gồm cả tiền công, chi phí về nhiên liệu, động lực, vật liệu phụ và chi phí khác phục vụ cho việc gia công hàng hóa;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ed. Đối với hoạt động cho thuê tài sản là số tiền bên thuê trả từng kỳ theo hợp đồng thuê. Trường hợp bên thuê trả tiền thuê trước cho nhiều năm thì doanh thu để tính thu nhập chịu thuế được phân bổ cho số năm trả tiền trước.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eđ. Đối với hoạt động tín dụng, hoạt động cho thuê tài chính là tiền lãi cho vay, doanh thu về cho thuê tài chính phải thu phát sinh trong kỳ tính thuế;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ee. Đối với hoạt động kinh doanh sân gôn là tiền bán thẻ hội viên, bán vé chơi gôn và các khoản thu khác trong kỳ tính thuế;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eg. Đối với hoạt động vận tải là toàn bộ doanh thu cước vận chuyển hành khách, hàng hóa, hành lý phát sinh trong kỳ tính thuế;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eh. Đối với điện, nước sạch là số tiền ghi trên hóa đơn giá trị gia tăng;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ei. Đối với hoạt động kinh doanh bảo hiểm, tái bảo hiểm là số tiền phải thu về phí bảo hiểm gốc; phí dịch vụ đại lý (bao gồm giám định tổn thất, xét giải quyết bồi thường, yêu cầu người thứ ba bồi hoàn, xử lý hàng bồi thường 100%); phí nhận tái bảo hiểm; thu hoa hồng tái bảo hiểm và các khoản thu khác về kinh doanh bảo hiểm trừ (-) các khoản hoàn hoặc giảm phí bảo hiểm, phí nhận tái bảo hiểm, các khoản hoàn hoặc giảm hoa hồng nhượng tái bảo hiểm;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eTrường hợp đồng bảo hiểm, doanh thu để tính thu nhập chịu thuế là tiền thu phí bảo hiểm gốc được phân bổ theo tỷ lệ đồng bảo hiểm chưa bao gồm thuế giá trị gia tăng.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐối với hợp đồng bảo hiểm thỏa thuận trả tiền theo từng kỳ thì doanh thu để tính thu nhập chịu thuế là số tiền phải thu phát sinh trong từng kỳ.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ek. Đối với hoạt động xây dựng, lắp đặt là giá trị công trình, hạng mục công trình hoặc khối lượng công trình xây dựng, lắp đặt được nghiệm thu. Trường hợp xây dựng, lắp đặt không bao thầu nguyên vật liệu, máy móc, thiết bị thì doanh thu tính thuế không bao gồm giá trị nguyên vật liệu, máy móc, thiết bị;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003el. Đối với hoạt động kinh doanh dưới hình thức hoạt động hợp tác kinh doanh mà không thành lập pháp nhân:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e- Trường hợp các bên tham gia hợp đồng hợp tác kinh doanh phân chia kết quả kinh doanh bằng doanh thu bán hàng hóa, dịch vụ thì doanh thu tính thuế là doanh thu của từng bên được chia theo hợp đồng;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e- Trường hợp các bên tham gia hợp đồng hợp tác kinh doanh phân chia kết quả kinh doanh bằng sản phẩm thì doanh thu tính thuế là doanh thu của sản phẩm được chia cho từng bên theo hợp đồng;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e- Trường hợp các bên tham gia hợp đồng hợp tác kinh doanh phân chia kết quả kinh doanh bằng lợi nhuận trước thuế thì doanh thu để xác định thu nhập trước thuế là số tiền bán hàng hóa, dịch vụ theo hợp đồng.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003em. Đối với dịch vụ casino, trò chơi điện tử có thưởng, kinh doanh giải trí có đặt cược là số tiền thu từ hoạt động này bao gồm cả thuế tiêu thụ đặc biệt trừ (-) số tiền đã trả thưởng cho khách;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003en. Đối với kinh doanh chứng khoán là các khoản thu từ dịch vụ môi giới, tự doanh chứng khoán, bảo lãnh phát hành chứng khoán, tư vấn đầu tư chứng khoán, quản lý quỹ đầu tư, phát hành chứng chỉ quỹ, dịch vụ tổ chức thị trường và các dịch vụ chứng khoán khác theo quy định của pháp luật;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eo. Đối với hoạt động tìm kiếm, thăm dò và khai thác dầu khí là toàn bộ doanh thu bán dầu, khí theo hợp đồng giao dịch sòng phẳng trong kỳ tính thuế.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ep. Đối với dịch vụ tài chính phái sinh là số tiền thu từ việc cung ứng các dịch vụ tài chính phái sinh thực hiện trong kỳ tính thuế\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eBộ Tài chính hướng dẫn cụ thể quy định tại Điều này và đối với một số trường hợp đặc thù khác.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐiều 9. Các khoản chi được trừ và không được trừ khi xác định thu nhập chịu thuế\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e1. Trừ các khoản chi quy định tại khoản 2 Điều này, doanh nghiệp được trừ mọi khoản chi nếu đáp ứng đủ các điều kiện sau đây:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ea. Khoản chi thực tế phát sinh liên quan đến hoạt động sản xuất, kinh doanh của doanh nghiệp;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eb. Khoản chi có đủ hóa đơn, chứng từ theo quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐối với các trường hợp: mua hàng hóa là nông, lâm, thủy sản của người sản xuất, đánh bắt trực tiếp bán ra; mua sản phẩm thủ công làm bằng đay, cói, tre, nứa, lá, song, mây, rơm, vỏ dừa, sọ dừa hoặc nguyên liệu tận dụng từ sản phẩm nông nghiệp của người sản xuất thủ công trực tiếp bán ra; mua đất, đá, cát, sỏi của người dân tự khai thác trực tiếp bán ra; mua phế liệu của người trực tiếp thu nhặt, mua đồ dùng, tài sản của hộ gia đình, cá nhân đã qua sử dụng trực tiếp bán ra và dịch vụ mua của cá nhân không kinh doanh phải có chứng từ thanh toán chi trả tiền cho người bán và Bảng kê thu mua hàng hóa, dịch vụ do người đại diện theo pháp luật hoặc người được ủy quyền của doanh nghiệp kinh doanh ký và chịu trách nhiệm.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e2. Các khoản chi không được trừ khi xác định thu nhập chịu thuế thực hiện theo quy định tại khoản 2 Điều 9 Luật Thuế thu nhập doanh nghiệp. Một số trường hợp được quy định như sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ea. Các khoản chi không đáp ứng đủ các điều kiện quy định tại khoản 1 Điều này, trừ phần giá trị tổn thất do thiên tai, dịch bệnh, hỏa hoạn và trường hợp bất khả kháng khác không được bồi thường;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ePhần giá trị tổn thất do thiên tai, dịch bệnh, hỏa hoạn và trường hợp bất khả kháng khác không được bồi thường được xác định bằng tổng giá trị tổn thất trừ (-) phần giá trị doanh nghiệp bảo hiểm hoặc tổ chức, cá nhân khác phải bồi thường theo quy định của pháp luật\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eb. Phần chi phí quản lý kinh doanh do doanh nghiệp nước ngoài phân bổ cho cơ sở thường trú tại Việt Nam vượt mức tính theo công thức sau:\u003c/span\u003e\u003c/p\u003e\n\u003cdiv align=\"center\"\u003e\n \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" class=\"MsoNormalTable\" style=\"margin:auto auto auto -19.8pt;border-collapse:collapse;\"\u003e\n  \u003ctbody\u003e\n   \u003ctr style=\"height:36pt;\"\u003e\n    \u003ctd rowspan=\"2\" style=\"border-right:#ece9d8;padding-right:5.4pt;border-top:#ece9d8;padding-left:5.4pt;padding-bottom:0cm;border-left:#ece9d8;width:104.4pt;padding-top:0cm;border-bottom:#ece9d8;height:36pt;background-color:transparent;\" width=\"139\"\u003e\n     \u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eChi phí quản lý kinh doanh do công ty ở nước ngoài phân bổ cho cơ sở thường trú tại Việt Nam trong kỳ tính thuế\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003ctd rowspan=\"2\" style=\"border-right:#ece9d8;padding-right:5.4pt;border-top:#ece9d8;padding-left:5.4pt;padding-bottom:0cm;border-left:#ece9d8;width:27pt;padding-top:0cm;border-bottom:#ece9d8;height:36pt;background-color:transparent;\" width=\"36\"\u003e\n     \u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e=\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003ctd style=\"border-right:#ece9d8;padding-right:5.4pt;border-top:#ece9d8;padding-left:5.4pt;padding-bottom:0cm;border-left:#ece9d8;width:163.8pt;padding-top:0cm;border-bottom:windowtext 1pt solid;height:36pt;background-color:transparent;\" width=\"218\"\u003e\n     \u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eDoanh thu tính thuế của cơ sở thường trú tại Việt Nam trong kỳ tính thuế\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003ctd rowspan=\"2\" style=\"border-right:#ece9d8;padding-right:5.4pt;border-top:#ece9d8;padding-left:5.4pt;padding-bottom:0cm;border-left:#ece9d8;width:27pt;padding-top:0cm;border-bottom:#ece9d8;height:36pt;background-color:transparent;\" width=\"36\"\u003e\n     \u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ex\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003ctd rowspan=\"2\" style=\"border-right:#ece9d8;padding-right:5.4pt;border-top:#ece9d8;padding-left:5.4pt;padding-bottom:0cm;border-left:#ece9d8;width:90pt;padding-top:0cm;border-bottom:#ece9d8;height:36pt;background-color:transparent;\" width=\"120\"\u003e\n     \u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eTổng số chi phí quản lý kinh doanh của công ty ở nước ngoài trong kỳ tính thuế\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n   \u003c/tr\u003e\n   \u003ctr style=\"\"\u003e\n    \u003ctd style=\"border-right:#ece9d8;padding-right:5.4pt;border-top:#ece9d8;padding-left:5.4pt;padding-bottom:0cm;border-left:#ece9d8;width:163.8pt;padding-top:0cm;border-bottom:#ece9d8;background-color:transparent;\" width=\"218\"\u003e\n     \u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eTổng doanh thu của công ty ở nước ngoài, bao gồm cả doanh thu của các cơ sở thường trú ở các nước khác trong kỳ tính thuế\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n   \u003c/tr\u003e\n  \u003c/tbody\u003e\n \u003c/table\u003e\n\u003c/div\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ec. Phần chi vượt mức theo quy định về trích lập dự phòng;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ed. Phần trích khấu hao tài sản cố định không đúng quy định của Bộ Tài chính, bao gồm: khấu hao đối với ô tô chở người từ 9 chỗ ngồi trở xuống (trừ ô tô dùng cho kinh doanh vận tải hành khách, kinh doanh du lịch, khách sạn) tương ứng với phần nguyên giá vượt trên 1,6 tỷ đồng/xe; khấu hao của tàu bay dân dụng, du thuyền không sử dụng kinh doanh vận chuyển hàng hóa, hành khách, khách, kinh doanh du lịch, khách sạn;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eđ. Các khoản trích trước vào chi phí không đúng với quy định của pháp luật;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eCác khoản trích trước bao gồm: trích trước về sửa chữa lớn tài sản cố định theo chu kỳ, các khoản trích trước đối với hoạt động đã hạch toán doanh thu nhưng còn tiếp tục phải thực hiện nghĩa vụ theo hợp đồng, các khoản trích trước khác theo quy định của Bộ Tài chính.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ee. Chi trả lãi tiền vay vốn tương ứng với phần vốn điều lệ còn thiếu theo tiến độ góp vốn ghi trong điều lệ của doanh nghiệp; lãi vay vốn để triển khai thực hiện các hợp đồng tìm kiếm thăm dò và khai thác dầu khí;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eg. Phần chi quảng cáo, tiếp thị, khuyến mại, hoa hồng môi giới (không bao gồm hoa hồng môi giới bảo hiểm theo quy định của pháp luật về kinh doanh bảo hiểm, hoa hồng đại lý bán hàng đúng giá); chi tiếp tân, khánh tiết, hội nghị; chi hỗ trợ tiếp thị, chi hỗ trợ chi phí, chiết khấu thanh toán; chi báo biếu, báo tặng của cơ quan báo chí liên quan trực tiếp đến hoạt động sản xuất, kinh doanh vượt quá 10% tổng số chi được trừ. Đối với doanh nghiệp mới thành lập từ ngày 01 tháng 01 năm 2009 là phần chi vượt quá 15% trong ba năm đầu, kể từ khi được thành lập;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eTổng số chi được trừ không bao gồm các khoản chi quy định trên đây; đối với hoạt động thương mại không bao gồm giá mua hàng hóa bán ra.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eh. Phần chi phí được phép thu hồi vượt quá tỷ lệ quy định tại hợp đồng dầu khí được duyệt; trường hợp hợp đồng dầu khí không quy định về tỷ lệ thu hồi chi phí thì phần chi phí vượt trên 35% không được tính vào chi phí được trừ;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eCác chi phí không được tính vào chi phí thu hồi gồm:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e- Các khoản chi quy định tại khoản 2 Điều 9 Luật Thuế thu nhập doanh nghiệp;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e- Chi phí phát sinh trước khi hợp đồng dầu khí có hiệu lực, trừ trường hợp đã được thỏa thuận trong hợp đồng dầu khí hoặc theo quyết định của Thủ tướng Chính phủ;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e- Các loại hoa hồng dầu khí và các khoản chi khác không tính vào chi phí thu hồi theo hợp đồng;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e- Lãi đối với khoản đầu tư cho tìm kiếm, thăm dò, phát triển mỏ và khai thác dầu khí;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e- Tiền phạt, tiền bồi thường thiệt hại.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ei. Thuế giá trị gia tăng đầu vào đã được khấu trừ, thuế thu nhập doanh nghiệp và các khoản thuế, phí, lệ phí và thu khác không được tính vào chi phí theo quy định của Bộ Tài chính;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ek. Các khoản chi không tương ứng với doanh thu tính thuế;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003el. Chênh lệch tỷ giá hối đoái do đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ cuối kỳ tính thuế; chênh lệch tỷ giá phát sinh trong quá trình đầu tư xây dựng cơ bản.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eBộ Tài chính hướng dẫn cụ thể về chi phí được trừ và không được trừ quy định tại Điều này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐiều 10. Thuế suất\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eThuế suất thuế thu nhập doanh nghiệp thực hiện theo quy định tại Điều 10 Luật Thuế thu nhập doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e1. Thuế suất thuế thu nhập doanh nghiệp là 25%, trừ trường hợp quy định tại khoản 2 Điều này và Điều 15 Nghị định này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e2. Thuế suất thuế thu nhập doanh nghiệp đối với hoạt động tìm kiếm, thăm dò, khai thác dầu khí và tài nguyên quý hiếm khác tại Việt Nam từ 32% đến 50%. Căn cứ vào vị trí, điều kiện khai thác và trữ lượng mỏ, Thủ tướng Chính phủ quyết định mức thuế suất cụ thể phù hợp với từng dự án, từng cơ sở kinh doanh theo đề nghị của Bộ trưởng Bộ Tài chính.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eTài nguyên quý hiếm khác quy định tại khoản này bao gồm: bạch kim, vàng, bạc, thiếc, wonfram, antimoan, đá quý, đất hiếm.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐiều 11. Phương pháp tính thuế\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e1. Số thuế thu nhập doanh nghiệp phải nộp trong kỳ tính thuế bằng thu nhập tính thuế nhân (x) với thuế suất; trường hợp doanh nghiệp đã nộp thuế thu nhập đối với thu nhập phát sinh ở nước ngoài thì được trừ số thuế thu nhập đã nộp, nhưng tối đa không quá số thuế thu nhập doanh nghiệp phải nộp theo quy định của Luật Thuế thu nhập doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e2. Số thuế thu nhập doanh nghiệp phải nộp đối với kinh doanh bất động sản bằng thu nhập từ kinh doanh bất động sản nhân (x) với thuế suất 25%.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e3. Đối với doanh nghiệp quy định tại điểm c, d khoản 2 Điều 2 Luật Thuế thu nhập doanh nghiệp, số thuế thu nhập doanh nghiệp phải nộp được tính theo tỷ lệ % trên doanh thu bán hàng hóa, dịch vụ tại Việt Nam, cụ thể như sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ea. Dịch vụ: 5%, riêng trường hợp cung ứng dịch vụ có gắn với hàng hóa thì hàng hóa được tính theo tỷ lệ 1%;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eb. Tiền bản quyền: 10%;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ec. Thuê tàu bay (kể cả thuê động cơ, phụ tùng tàu bay), tàu biển: 2%;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ed. Thuê máy móc, thiết bị phương tiện vận tải (trừ quy định tại điểm c khoản này): 5%;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eđ. Lãi tiền vay: 10%;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ee. Chuyển nhượng chứng khoán: 0,1%;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eg. Xây dựng, vận tải, tái bảo hiểm ra nước ngoài và hoạt động khác: 2%.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e4. Đối với hoạt động khai thác dầu khí có quy định việc hạch toán doanh thu, chi phí bằng ngoại tệ trong hợp đồng thì thu nhập tính thuế và số thuế phải nộp được xác định bằng ngoại tệ.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐiều 12. Nơi nộp thuế\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e1. Doanh nghiệp nộp thuế tại địa phương nơi đóng trụ sở chính. Trường hợp doanh nghiệp có cơ sở sản xuất hạch toán phụ thuộc ở địa bàn tỉnh, thành phố trực thuộc Trung ương khác với địa phương nơi đóng trụ sở chính thì số thuế được tính nộp ở nơi có trụ sở chính và ở nơi có cơ sở sản xuất.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eSố thuế thu nhập doanh nghiệp tính nộp ở tỉnh, thành phố trực thuộc Trung ương nơi có cơ sở sản xuất hạch toán phụ thuộc được xác định bằng số thuế thu nhập doanh nghiệp phải nộp trong kỳ của doanh nghiệp nhân (x) với tỷ lệ giữa chi phí phát sinh tại cơ sở sản xuất hạch toán phụ thuộc với tổng chi phí của doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eViệc nộp thuế quy định tại khoản này không áp dụng đối với công trình, hạng mục công trình hay cơ sở xây dựng hạch toán phụ thuộc.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eViệc phân cấp, quản lý, sử dụng nguồn thu về thuế thu nhập doanh nghiệp thực hiện theo quy định của Luật Ngân sách nhà nước.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e2. Đơn vị hạch toán phụ thuộc các doanh nghiệp hạch toán toàn ngành có thu nhập ngoài hoạt động kinh doanh chính thì nộp thuế tại tỉnh, thành phố trực thuộc Trung ương nơi có hoạt động kinh doanh đó.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e3. Bộ Tài chính hướng dẫn về nơi nộp thuế quy định tại Điều này.\u003c/span\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:center;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eChương III\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:center;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eTHU NHẬP TỪ CHUYỂN NHƯỢNG BẤT ĐỘNG SẢN\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐiều 13.\u003c/span\u003e\u003c/b\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e Thu nhập từ chuyển nhượng bất động sản bao gồm thu nhập từ chuyển quyền sử dụng đất, chuyển nhượng quyền thuê đất; thu nhập từ cho thuê lại đất của doanh nghiệp kinh doanh bất động sản theo quy định của pháp luật về đất đai không phân biệt có hay không có kết cấu hạ tầng, công trình kiến trúc gắn liền với đất.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐiều 14.\u003c/span\u003e\u003c/b\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e Thu nhập chịu thuế từ chuyển nhượng bất động sản được xác định bằng doanh thu từ hoạt động chuyển nhượng bất động sản trừ giá vốn của bất động sản và các khoản chi phí được trừ liên quan đến hoạt động chuyển nhượng bất động sản.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e1. Doanh thu để tính thu nhập chịu thuế được xác định theo giá thực tế chuyển nhượng.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eTrường hợp giá chuyển quyền sử dụng đất thấp hơn giá đất do Ủy ban nhân dân tỉnh, thành phố trực thuộc Trung ương quy định thì tính theo giá do Ủy ban nhân dân tỉnh, thành phố trực thuộc Trung ương quy định tại thời điểm chuyển nhượng bất động sản.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e2. Thời điểm xác định doanh thu để tính thu nhập chịu thuế là thời điểm bàn giao bất động sản.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eTrường hợp có thu tiền trước theo tiến độ thì thời điểm xác định doanh thu tính số thuế thu nhập doanh nghiệp tạm nộp thì thời điểm thu tiền. Bộ Tài chính hướng dẫn việc tạm nộp thuế quy định tại khoản này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e3. Chi phí chuyển nhượng bất động sản được trừ:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ea. Giá vốn của đất chuyển quyền được xác định phù hợp với nguồn gốc quyền sử dụng đất, cụ thể như sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e- Đối với đất Nhà nước giao có thu tiền sử dụng đất, thu tiền cho thuê đất thì giá vốn là số tiền sử dụng đất, số tiền cho thuê đất thực nộp ngân sách nhà nước;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e- Đối với đất nhận quyền sử dụng của tổ chức, cá nhân khác thì căn cứ vào hợp đồng và chứng từ trả tiền hợp pháp khi nhận quyền sử dụng đất, quyền thuê đất; trường hợp không có hợp đồng và chứng từ trả tiền hợp pháp thì giá vốn được tính theo giá do Ủy ban nhân dân tỉnh, thành phố trực thuộc Trung ương quy định tại thời điểm doanh nghiệp nhận chuyển nhượng bất động sản;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e- Đối với đất nhận góp vốn thì giá vốn là giá thỏa thuận khi góp vốn;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e- Đối với đất nhận thừa kế, được biếu, tặng, cho mà không xác định được giá vốn thì xác định theo giá các loại đất do Ủy ban nhân dân tỉnh, thành phố trực thuộc Trung ương quy định tại thời điểm nhận thừa kế, cho, biếu, tặng.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eTrường hợp đất nhận thừa kế, cho, biếu, tặng trước năm 1994 thì giá vốn được xác định theo giá các loại đất do Ủy ban nhân dân tỉnh, thành phố trực thuộc Trung ương quyết định năm 1994 căn cứ vào Bảng khung giá các loại đất quy định tại Nghị định số 87/CP ngày 17 tháng 8 năm 1994 của Chính phủ.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eb. Chi phí bồi thường, hỗ trợ khi Nhà nước thu hồi đất;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ec. Các loại phí, lệ phí theo quy định của pháp luật liên quan đến cấp quyền sử dụng đất.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ed. Chi phí cải tạo đất, san lấp mặt bằng;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eđ. Giá trị kết cấu hạ tầng, công trình kiến trúc có trên đất;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ee. Chi phí khác liên quan đến bất động sản được chuyển nhượng.\u003c/span\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:center;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eChương IV\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:center;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eƯU ĐÃI THUẾ THU NHẬP DOANH NGHIỆP\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐiều 15. Thuế suất ưu đãi \u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e1. Thuế suất ưu đãi 10% trong thời hạn 15 năm áp dụng đối với:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ea. Doanh nghiệp thành lập mới từ dự án đầu tư tại địa bàn có điều kiện kinh tế - xã hội đặc biệt khó khăn quy định tại Phụ lục ban hành kèm theo Nghị định này, khu kinh tế, khu công nghệ cao được thành lập theo Quyết định của Thủ tướng Chính phủ.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eb. Doanh nghiệp thành lập mới từ dự án đầu tư thuộc các lĩnh vực:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e- Công nghệ cao theo quy định của pháp luật; nghiên cứu khoa học và phát triển công nghệ;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e- Đầu tư phát triển nhà máy nước, nhà máy điện, hệ thống cấp thoát nước; cầu, đường bộ, đường sắt; cảng hàng không, cảng biển, cảng sông; sân bay, nhà ga và công trình cơ sở hạ tầng đặc biệt quan trọng khác do Thủ tướng Chính phủ quyết định;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e- Sản xuất sản phẩm phần mềm.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e2. Doanh nghiệp thành lập mới từ dự án đầu tư thuộc lĩnh vực quy định tại điểm b khoản 1 Điều này có quy mô lớn, công nghệ cao hoặc mới cần đặc biệt thu hút đầu tư, thì thời gian áp dụng thuế suất ưu đãi có thể kéo dài nhưng tổng thời gian áp dụng thuế suất 10% không quá 30 năm. Thủ tướng Chính phủ quyết định việc kéo dài thêm thời gian áp dụng thuế suất ưu đãi 10% quy định tại khoản này theo đề nghị của Bộ trưởng Bộ Tài chính.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e3. Thuế suất 10% trong suốt thời gian hoạt động áp dụng đối với phần thu nhập của doanh nghiệp hoạt động trong lĩnh vực giáo dục - đào tạo, dạy nghề, y tế, văn hóa, thể thao và môi trường (sau đây gọi chung là lĩnh vực xã hội hóa).\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eDanh mục các hoạt động trong lĩnh vực xã hội hóa quy định tại khoản này do Thủ tướng Chính phủ quy định.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e4. Thuế suất ưu đãi 20% áp dụng trong thời gian 10 năm đối với doanh nghiệp thành lập mới từ dự án đầu tư tại địa bàn có điều kiện kinh tế - xã hội khó khăn quy định tại Phụ lục ban hành kèm theo Nghị định này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e5. Thuế suất ưu đãi 20% áp dụng trong suốt thời gian hoạt động đối với hợp tác xã dịch vụ nông nghiệp và quỹ tín dụng nhân dân.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐối với hợp tác xã dịch vụ nông nghiệp, quỹ tín dụng nhân dân sau khi hết thời hạn áp dụng mức thuế suất 10% quy định tại điểm a khoản 1 Điều này thì chuyển sang áp dụng mức thuế suất 20%.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e6. Thời gian áp dụng thuế suất ưu đãi quy định tại Điều này được tính liên tục từ năm đầu tiên doanh nghiệp có doanh thu từ hoạt động được hưởng ưu đãi thuế.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐiều 16. Miễn thuế, giảm thuế\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e1. Miễn thuế 4 năm, giảm 50% số thuế phải nộp trong 9 năm tiếp theo đối với:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ea. Doanh nghiệp thành lập mới từ dự án đầu tư quy định tại khoản 1 Điều 15 Nghị định này;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eb. Doanh nghiệp thành lập mới trong lĩnh vực xã hội hóa thực hiện tại địa bàn có điều kiện kinh tế - xã hội khó khăn hoặc đặc biệt khó khăn quy định tại Phụ lục ban hành kèm theo Nghị định này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e2. Miễn thuế 4 năm, giảm 50% số thuế phải nộp trong 5 năm tiếp theo đối với doanh nghiệp thành lập mới trong lĩnh vực xã hội hóa thực hiện tại địa bàn không thuộc danh mục địa bàn có điều kiện kinh tế - xã hội khó khăn hoặc đặc biệt khó khăn quy định tại Phụ lục ban hành kèm theo Nghị định này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e3. Miễn thuế 2 năm, giảm 50% số thuế phải nộp trong 4 năm tiếp theo đối với doanh nghiệp thành lập mới từ dự án đầu tư tại địa bàn có điều kiện kinh tế - xã hội khó khăn quy định tại Phụ lục ban hành kèm theo Nghị định này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e4. Thời gian miễn thuế, giảm thuế quy định tại Điều này được tính liên tục từ năm đầu tiên doanh nghiệp có thu nhập chịu thuế từ dự án đầu tư; trường hợp doanh nghiệp không có thu nhập chịu thuế trong ba năm đầu, kể từ năm đầu tiên có doanh thu từ dự án thì thời gian miễn thuế, giảm thuế được tính từ năm thứ tư.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eTrong năm tính thuế đầu tiên mà doanh nghiệp có thời gian hoạt động sản xuất, kinh doanh được miễn thuế, giảm thuế dưới 12 (mười hai) tháng, doanh nghiệp được hưởng miễn thuế, giảm thuế ngay năm đó hoặc đăng ký với cơ quan thuế thời gian bắt đầu được miễn thuế, giảm thuế từ năm tính thuế tiếp theo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐiều 17. Giảm thuế cho các trường hợp khác\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e1. Doanh nghiệp sản xuất, xây dựng, vận tải sử dụng nhiều lao động nữ được giảm thuế thu nhập doanh nghiệp bằng số chi thêm cho lao động nữ, gồm:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ea. Chi đào tạo lại nghề;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eb. Chi phí tiền lương và phụ cấp (nếu có) cho cô giáo dạy ở nhà trẻ, mẫu giáo do doanh nghiệp tổ chức và quản lý;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ec. Chi khám sức khoẻ thêm trong năm;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ed. Chi bồi dưỡng cho lao động nữ sau khi sinh con. Căn cứ quy định của pháp luật về lao động, Bộ Tài chính phối hợp với Bộ Lao động - Thương binh và Xã hội quy định cụ thể mức chi bồi dưỡng quy định tại khoản này;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eđ. Lương, phụ cấp trả cho thời gian lao động nữ được nghỉ sau khi sinh con, nghỉ cho con bú theo chế độ nhưng vẫn làm việc.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e2. Doanh nghiệp sử dụng lao động là người dân tộc thiểu số được giảm thuế thu nhập doanh nghiệp bằng số chi thêm cho lao động là người dân tộc thiểu số để đào tạo nghề, tiền hỗ trợ về nhà ở, bảo hiểm xã hội, bảo hiểm y tế cho người dân tộc thiểu số trong trường hợp chưa được Nhà nước hỗ trợ theo chế độ quy định.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐiều 18. Trích lập Quỹ phát triển khoa học và công nghệ của doanh nghiệp\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eViệc trích lập Quỹ phát triển khoa học và công nghệ của doanh nghiệp được thực hiện theo quy định tại Điều 17 Luật Thuế thu nhập doanh nghiệp\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e1. Doanh nghiệp được thành lập, hoạt động theo quy định của pháp luật Việt Nam được trích tối đa 10% trên thu nhập tính thuế hàng năm để lập Quỹ phát triển khoa học và công nghệ của doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eHàng năm, doanh nghiệp tự quyết định mức trích lập Quỹ phát triển khoa học theo quy định trên đây và lập Báo cáo trích, sử dụng Quỹ phát triển khoa học và công nghệ cùng tờ khai quyết toán thuế thu nhập doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eMẫu Báo cáo trích lập, sử dụng Quỹ phát triển khoa học và công nghệ của doanh nghiệp do Bộ Tài chính quy định.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e2. Doanh nghiệp đang hoạt động mà có thay đổi về hình thức sở hữu, hợp nhất, sáp nhập thì doanh nghiệp mới thành lập từ việc đổi hình thức sở hữu, hợp nhất, sáp nhập được kế thừa và chịu trách nhiệm về việc quản lý, sử dụng Quỹ phát triển khoa học và công nghệ của doanh nghiệp trước khi chuyển đổi, hợp nhất, sáp nhập.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eDoanh nghiệp có Quỹ phát triển khoa học và công nghệ chưa sử dụng hết khi chia, tách thì doanh nghiệp mới thành lập từ việc chia, tách được kế thừa và chịu trách nhiệm về việc quản lý, sử dụng Quỹ phát triển khoa học và công nghệ của doanh nghiệp trước khi chia, tách. Việc phân chia Quỹ phát triển khoa học và công nghệ do doanh nghiệp quyết định và đăng ký với cơ quan Thuế.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐiều 19. Điều kiện áp dụng ưu đãi thuế thu nhập doanh nghiệp\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐiều kiện áp dụng ưu đãi thuế thu nhập doanh nghiệp thực hiện theo quy định tại Điều 18 Luật Thuế thu nhập doanh nghiệp\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e1. Doanh nghiệp phải hạch toán riêng thu nhập từ hoạt động sản xuất, kinh doanh được hưởng ưu đãi thuế thu nhập doanh nghiệp (bao gồm mức thuế suất ưu đãi hoặc miễn, giảm thuế); trường hợp có khoản doanh thu hoặc chi phí được trừ không thể hạch toán riêng được thì khoản doanh thu hoặc chi phí được trừ đó xác định theo tỷ lệ giữa chi phí được trừ hoặc doanh thu của hoạt động sản xuất, kinh doanh hưởng ưu đãi thuế trên tổng chi phí được trừ hoặc doanh thu của doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e2. Thu nhập không được áp dụng quy định về ưu đãi thuế thu nhập doanh nghiệp gồm: các khoản thu nhập được quy định tại điểm a, b và c khoản 3 Điều 18 Luật Thuế thu nhập doanh nghiệp và thu nhập từ hoạt động khai thác khoáng sản.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e3. Trong cùng một thời gian, nếu doanh nghiệp được hưởng nhiều mức ưu đãi thuế khác nhau đối với cùng một khoản thu nhập thì doanh nghiệp được lựa chọn áp dụng mức ưu đãi thuế có lợi nhất.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e4. Trong thời gian được ưu đãi thuế thu nhập doanh nghiệp, nếu trong năm tính thuế mà doanh nghiệp không đáp ứng đủ một trong các điều kiện ưu đãi thuế quy định tại Điều 18 Luật Thuế thu nhập doanh nghiệp và quy định tại Điều này thì năm tính thuế đó không được hưởng ưu đãi thuế mà phải nộp thuế theo mức thuế suất 25%.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e5. Doanh nghiệp thành lập mới từ dự án đầu tư được hưởng ưu đãi thuế quy định tại Điều 15 và Điều 16 Nghị định này là doanh nghiệp đăng ký kinh doanh lần đầu, trừ các trường hợp sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ea. Doanh nghiệp thành lập trong các trường hợp chia, tách, sáp nhập, hợp nhất theo quy định của pháp luật;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eb. Doanh nghiệp thành lập do chuyển đổi hình thức doanh nghiệp, chuyển đổi sở hữu, trừ trường hợp giao, khoán, cho thuê doanh nghiệp Nhà nước;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ec. Doanh nghiệp tư nhân, công ty trách nhiệm hữu hạn một thành viên mới thành lập mà chủ doanh nghiệp là chủ hộ kinh doanh cá thể và không có thay đổi về ngành nghề kinh doanh trước đây;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ed. Doanh nghiệp tư nhân, công ty hợp danh, công ty trách nhiệm hữu hạn hoặc hợp tác xã mới thành lập mà người đại diện theo pháp luật (trừ trường hợp người đại diện theo pháp luật không phải là thành viên góp vốn), thành viên hợp danh hoặc người có số vốn góp cao nhất đã tham gia hoạt động kinh doanh với vai trò là người đại diện theo pháp luật, thành viên hợp danh hoặc người có số vốn góp cao nhất trong các doanh nghiệp đang hoạt động hoặc đã giải thể nhưng chưa được 12 tháng tính từ thời điểm giải thể doanh nghiệp cũ đến thời điểm thành lập doanh nghiệp mới.\u003c/span\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:center;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eChương V\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:center;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐIỀU KHOẢN THI HÀNH\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐiều 20. Hiệu lực thi hành\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e1. Nghị định này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2009.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e2. Doanh nghiệp đang hưởng ưu đãi thuế thu nhập doanh nghiệp theo quy định của Luật Thuế thu nhập doanh nghiệp số 09/2003/QH11, Luật Dầu khí và các văn bản pháp luật của Chính phủ ban hành trước ngày Nghị định này có hiệu lực thi hành thì tiếp tục được hưởng các ưu đãi theo quy định của Luật Thuế thu nhập doanh nghiệp số 09/2003/QH11, Luật Dầu khí và các văn bản pháp luật của Chính phủ đã ban hành cho thời gian còn lại; trường hợp mức ưu đãi về thuế thu nhập doanh nghiệp (bao gồm mức thuế suất ưu đãi và thời gian miễn, giảm thuế) thấp hơn mức ưu đãi quy định tại Nghị định này thì doanh nghiệp được áp dụng ưu đãi thuế theo quy định của Nghị định này cho thời gian còn lại.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eViệc xác định thời gian còn lại để hưởng ưu đãi thuế được tính liên tục kể từ khi thực hiện quy định về ưu đãi thuế tại các văn bản pháp luật về đầu tư nước ngoài tại Việt Nam, về khuyến khích đầu tư trong nước và về thuế thu nhập doanh nghiệp ban hành trước ngày Nghị định này có hiệu lực thi hành.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eCơ sở kinh doanh đã được cấp Giấy phép đầu tư, Giấy chứng nhận đăng ký kinh doanh, Giấy chứng nhận ưu đãi đầu tư trước ngày nước Cộng hòa xã hội chủ nghĩa Việt Nam chính thức trở thành thành viên của Tổ chức Thương mại thế giới (ngày 11 tháng 01 năm 2007) mà có thu nhập từ hoạt động xuất khẩu hàng hóa (trừ xuất khẩu hàng dệt may) và đang trong thời gian được hưởng ưu đãi thuế thu nhập doanh nghiệp do đáp ứng điều kiện về tỷ lệ xuất khẩu theo quy định tại các văn bản pháp luật về đầu tư nước ngoài tại Việt Nam, về khuyến khích đầu tư trong nước và thuế thu nhập doanh nghiệp thì được tiếp tục hưởng ưu đãi thuế theo quy định tại các văn bản pháp luật này đến hết năm 2011.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e3. Doanh nghiệp có hoạt động trong lĩnh vực xã hội hóa trước ngày Nghị định này có hiệu lực thi hành mà đang áp dụng mức thuế suất cao hơn mức 10% thì được chuyển sang áp dụng mức thuế suất 10% kể từ ngày Nghị định này có hiệu lực thi hành.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e4. Doanh nghiệp có dự án đầu tư mở rộng sản xuất đến ngày 31 tháng 12 năm 2008 đang đầu tư xây dựng dở dang, trong năm 2009 mới hoàn thành và đi vào sản xuất, kinh doanh thì được tiếp tục hưởng ưu đãi thuế về điều kiện đầu tư mở rộng quy định tại Luật Thuế thu nhập doanh nghiệp số 09/2003/QH11 và các văn bản pháp luật của Chính phủ ban hành trước ngày Nghị định này có hiệu lực thi hành.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e5. Doanh nghiệp đang được hưởng thời gian miễn thuế, giảm thuế theo quy định của Luật Thuế thu nhập doanh nghiệp số 09/2003/QH11 và các văn bản pháp luật của Chính phủ ban hành trước ngày Nghị định này có hiệu lực thi hành, nhưng đến hết kỳ tính thuế 2008 nếu:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ea. Chưa có doanh thu thì thời gian miễn thuế, giảm thuế tính từ năm đầu tiên có thu nhập chịu thuế; trường hợp không có thu nhập chịu thuế trong 3 năm đầu kể từ năm đầu tiên có doanh thu thì thời gian miễn thuế, giảm thuế được tính từ năm thứ tư;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eb. Đã có doanh thu nhưng chưa đủ 3 năm, kể từ khi có doanh thu thì thời gian miễn thuế, giảm thuế được tính từ năm đầu tiên có thu nhập chịu thuế; trường hợp không có thu nhập chịu thuế trong 3 năm đầu kể từ năm đầu tiên có doanh thu thì thời gian miễn thuế, giảm thuế được tính từ năm thứ tư.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003ec. Đã có doanh thu từ 3 năm trở lên thì thời gian miễn thuế, giảm thuế được tính từ năm tính thuế 2009.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e6. Doanh nghiệp thành lập từ việc chuyển đổi loại hình doanh nghiệp, chuyển đổi sở hữu, chia, tách, sáp nhập, hợp nhất có trách nhiệm thực hiện nghĩa vụ nộp thuế thu nhập doanh nghiệp (kể cả tiền phạt nếu có), đồng thời được kế thừa các ưu đãi thuế thu nhập doanh nghiệp (kể cả các khoản lỗ chưa được kết chuyển) của doanh nghiệp trước khi chuyển đổi, chia, tách, sáp nhập, hợp nhất nếu tiếp tục đáp ứng các điều kiện ưu đãi thuế thu nhập doanh nghiệp, điều kiện chuyển lỗ theo quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003e7. Việc giải quyết những tồn tại về thuế, quyết toán thuế, miễn, giảm thuế trước ngày 01 tháng 01 năm 2009 được thực hiện theo quy định của các văn bản pháp luật về thuế thu nhập doanh nghiệp, pháp luật về đầu tư nước ngoài tại Việt Nam, pháp luật về khuyến khích đầu tư trong nước và các văn bản quy phạm pháp luật khác ban hành trước ngày Nghị định này có hiệu lực thi hành.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cb\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eĐiều 21. \u003c/span\u003e\u003c/b\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eBộ Tài chính hướng dẫn thi hành Nghị định này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"margin:6pt 0cm;text-align:justify;\"\u003e\u003cspan style=\"font-size:10pt;font-family:Arial;\"\u003eCác Bộ trưởng, Thủ trưởng cơ quan ngang Bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân tỉnh, thành phố trực thuộc Trung ương và các tổ chức, cá nhân liên quan chịu trách nhiệm thi hành Nghị định này./.\u003c/span\u003e\u003c/p\u003e\n\u003c/body\u003e\n\u003c/html\u003e"])</script><script>self.__next_f.push([1,"d:[[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"Legislation\\\",\\\"name\\\":\\\"Nghị định số 124/2008/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Luật Thuế thu nhập doanh nghiệp\\\",\\\"legislationIdentifier\\\":\\\"124/2008/NĐ-CP\\\",\\\"legislationType\\\":\\\"Nghị định\\\",\\\"legislationDate\\\":\\\"2008-12-11T00:00:00\\\",\\\"legislationLegalForce\\\":\\\"NotInForce\\\",\\\"legislationPassedBy\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Chính phủ\\\"},\\\"legislationJurisdiction\\\":\\\"VN\\\",\\\"url\\\":\\\"https://vbpl.vn/van-ban/chi-tiet/nghi-dinh-so-124-2008-nd-cp-quy-dinh-chi-tiet-va-huong-dan-thi-hanh-mot-so-dieu-cua-luat-thue-thu-nhap-doanh-nghiep--11606\\\",\\\"inLanguage\\\":\\\"vi\\\",\\\"keywords\\\":\\\"Nghị định, Quản lý thuế, phí, lệ phí và thu khác của ngân sách nhà nước, Chính phủ, văn bản pháp luật, pháp luật Việt Nam\\\"}\"}}],[\"$\",\"script\",\"breadcrumb-jsonld\",{\"type\":\"application/ld+json\",\"id\":\"breadcrumb-jsonld\",\"data-testid\":\"$undefined\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"Trang chủ\\\",\\\"item\\\":

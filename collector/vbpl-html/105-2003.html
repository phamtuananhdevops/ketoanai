 lãi tiền gửi, cổ tức và lợi nhuận được chia...;\u003c/p\u003e\n\u003cp\u003e+ Chi phí lãi vay đã ghi nhận vào Báo cáo kết quả hoạt động kinh doanh trong kỳ.\u003c/p\u003e\n\u003cp\u003eLuồng tiền từ hoạt động kinh doanh được điều chỉnh tiếp tục với sự thay đổi vốn lưu động, chi phí trả trước dài hạn và các khoản thu, chi khác từ hoạt động kinh doanh, như:\u003c/p\u003e\n\u003cp\u003e+ Các thay đổi trong kỳ báo cáo của khoản mục hàng tồn kho, các khoản phải thu, các khoản phải trả từ hoạt động kinh doanh;\u003c/p\u003e\n\u003cp\u003e+ Các thay đổi của chi phí trả trước;\u003c/p\u003e\n\u003cp\u003e+ Lãi tiền vay đã trả;\u003c/p\u003e\n\u003cp\u003e+ Thuế TNDN đã nộp;\u003c/p\u003e\n\u003cp\u003e+ Tiền thu khác từ hoạt động kinh doanh;\u003c/p\u003e\n\u003cp\u003e+ Tiền chi khác từ hoạt động kinh doanh;\u003c/p\u003e\n\u003cp\u003e- Cơ sở lập:\u003c/p\u003e\n\u003cp\u003e+ Bảng Cân đối kế toán;\u003c/p\u003e\n\u003cp\u003e+ Báo cáo kết quả hoạt động kinh doanh;\u003c/p\u003e\n\u003cp\u003e+ Thuyết minh báo cáo tài chính;\u003c/p\u003e\n\u003cp\u003e+ Sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\" và \"Tiền đang chuyển\";\u003c/p\u003e\n\u003cp\u003e+ Sổ kế toán các Tài khoản hàng tồn kho, các Tài khoản phải thu, các Tài khoản phải trả liên quan đến hoạt động kinh doanh;\u003c/p\u003e\n\u003cp\u003e+ Sổ kế toán các Tài khoản khác có liên quan;\u003c/p\u003e\n\u003cp\u003e+ Bảng tính và phân bổ khấu hao TSCĐ;\u003c/p\u003e\n\u003cp\u003e+ Báo cáo lưu chuyển tiền tệ kỳ trước.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e- Phương pháp lập các chỉ tiêu cụ thể (Xem Phụ lục số 03)\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(1) Lợi nhuận trước thuế - Mã số 01\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lấy từ chỉ tiêu tổng lợi nhuận trước thuế (Mã số 50) trên Báo cáo kết quả hoạt động kinh doanh trong kỳ báo cáo. Nếu số liệu này là số âm (trường hợp lỗ), thì ghi trong ngoặc đơn (***).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(2) Điều chỉnh cho các khoản\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eKhấu hao TSCĐ - Mã số 02\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này phản ánh số khấu hao TSCĐ đã trích được ghi nhận vào Báo cáo kết quả hoạt động kinh doanh trong kỳ báo cáo. Chỉ tiêu này được lập căn cứ vào số khấu hao TSCĐ đã trích trong kỳ trên Bảng tính và phân bổ khấu hao TSCĐ và sổ kế toán các Tài khoản có liên quan.\u003c/p\u003e\n\u003cp\u003eSố liệu chỉ tiêu này được cộng (+) vào số liệu chỉ tiêu \"Lợi nhuận trước thuế\".\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCác khoản dự phòng - Mã số 03\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này phản ánh các khoản dự phòng giảm giá đã lập được ghi nhận vào Báo cáo kết quả hoạt động kinh doanh trong kỳ báo cáo. Chỉ tiêu này được lập căn cứ vào sổ kế toán các Tài khoản \"Dự phòng giảm giá hàng tồn kho\", \"Dự phòng giảm giá đầu tư ngắn hạn\", \"Dự phòng giảm giá đầu tư dài hạn\", \"Dự phòng phải thu khó đòi\", sau khi đối chiếu với sổ kế toán các tài khoản có liên quan.\u003c/p\u003e\n\u003cp\u003eSố liệu chỉ tiêu này được cộng (+) vào số liệu chỉ tiêu \"Lợi nhuận trước thuế\". Trường hợp các khoản dự phòng nêu trên được hoàn nhập ghi giảm chi phí sản xuất, kinh doanh trong kỳ báo cáo thì được trừ (-) vào chỉ tiêu \"Lợi nhuận trước thuế\" và được ghi bằng số âm dưới hình thức ghi trong ngoặc đơn (***).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eLãi/lỗ chênh lệch tỷ giá hối đoái chưa thực hiện - Mã số 04\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này phản ánh lãi (hoặc lỗ) chênh lệch tỷ giá hối đoái chưa thực hiện đã được phản ánh vào lợi nhuận trước thuế trong kỳ báo cáo. Chỉ tiêu này được lập căn cứ vào sổ kế toán Tài khoản \"Doanh thu hoạt động tài chính\", chi tiết phần lãi chênh lệch tỷ giá hối đoái do đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ cuối kỳ báo cáo hoặc sổ kế toán Tài khoản \"Chi phí tài chính\", chi tiết phần lỗ chênh lệch tỷ giá hối đoái do đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ cuối kỳ báo cáo được ghi nhận vào doanh thu hoạt động tài chính hoặc chi phí tài chính trong kỳ báo cáo.\u003c/p\u003e\n\u003cp\u003eSố liệu chỉ tiêu này được trừ (-) vào số liệu chỉ tiêu \"Lợi nhuận trước thuế\", nếu có lãi chênh lệch tỷ giá hối đoái chưa thực hiện, hoặc được cộng (+) vào chỉ tiêu trên, nếu có lỗ chênh lệch tỷ giá hối đoái chưa thực hiện.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eLãi/lỗ từ hoạt động đầu tư - Mã số 05\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này phản ánh lãi/lỗ phát sinh trong kỳ đã được phản ánh vào lợi nhuận trước thuế nhưng được phân loại là luồng tiền từ hoạt động đầu tư, gồm lãi/lỗ từ việc thanh lý TSCĐ và các khoản đầu tư dài hạn mà doanh nghiệp mua và nắm giữ vì mục đích đầu tư, như: Lãi/lỗ bán bất động sản đầu tư, lãi cho vay, lãi tiền gửi, lãi/lỗ từ việc mua và bán lại các công cụ nợ (Trái phiếu, kỳ phiếu, tín phiếu); Cổ tức và lợi nhuận được chia từ các khoản đầu tư vốn vào đơn vị khác (không bao gồm lãi/lỗ mua bán chứng khoán vì mục đích thương mại). Chỉ tiêu này được lập căn cứ vào sổ kế toán các Tài khoản \"Doanh thu hoạt động tài chính\", \"Thu nhập khác\" và sổ kế toán các Tài khoản \"Chi phí tài chính\", \"Chi phí khác\", chi tiết phần lãi/lỗ được xác định là luồng tiền từ hoạt động đầu tư trong kỳ báo cáo.\u003c/p\u003e\n\u003cp\u003eSố liệu chỉ tiêu này được trừ (-) vào số liệu chỉ tiêu \"Lợi nhuận trước thuế\", nếu có lãi hoạt động đầu tư và được ghi bằng số âm dưới hình thức ghi trong ngoặc đơn (***) ; hoặc được cộng (+) vào chỉ tiêu trên, nếu có lỗ hoạt động đầu tư.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eChi phí lãi vay\u0026nbsp; - Mã số 06\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này phản ánh chi phí lãi vay đã ghi nhận vào Báo cáo kết quả hoạt động kinh doanh trong kỳ báo cáo. Chỉ tiêu này được lập căn cứ vào sổ kế toán Tài khoản 635 \"Chi phí tài chính\", chi tiết chi phí lãi vay được ghi nhận vào Báo cáo kết quả hoạt động kinh doanh trong kỳ báo cáo sau khi đối chiếu với sổ kế toán các Tài khoản có liên quan, hoặc căn cứ vào chỉ tiêu “Chi phí lãi vay” trong Báo cáo kết quả hoạt động kinh doanh.\u003c/p\u003e\n\u003cp\u003eSố liệu chỉ tiêu này được cộng vào số liệu chỉ tiêu \"Lợi nhuận trước thuế\".\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(3) Lợi nhuận kinh doanh trước những thay đổi vốn lưu động - Mã số 08\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này phản ánh luồng tiền được tạo ra từ hoạt động kinh doanh trong kỳ báo cáo sau khi đã loại trừ ảnh hưởng của các khoản mục thu nhập và chi phí không phải bằng tiền.\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào lợi nhuận trước thuế TNDN cộng (+) các khoản điều chỉnh.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eMã số 08 = Mã số 01 + Mã số 02 + Mã số 03 + Mã số 04 + Mã số 05 + Mã số 06\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eNếu số liệu chỉ tiêu này là số âm thì ghi trong ngoặc đơn (***).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTăng, giảm các khoản phải thu - Mã số 09\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào tổng các chênh lệch giữa số dư cuối kỳ và số dư đầu kỳ của các Tài khoản phải thu liên quan đến hoạt động kinh doanh, như: Tài khoản \"Phải thu của khách hàng\" (chi tiết \"Phải thu của khách hàng\"), Tài khoản \"Phải trả cho người bán\" (chi tiết \"Trả trước cho người bán\"), các Tài khoản \"Phải thu nội bộ\", \"Phải thu khác\", \"Thuế GTGT được khấu trừ\" và Tài khoản \"Tạm ứng\" trong kỳ báo cáo. Chỉ tiêu này không bao gồm các khoản phải thu liên quan đến hoạt động đầu tư và hoạt động tài chính, như: Phải thu về tiền lãi cho vay, phải thu về cổ tức và lợi nhuận được chia, phải thu về thanh lý, nhượng bán TSCĐ, bất động sản đầu tư...\u003c/p\u003e\n\u003cp\u003eSố liệu chỉ tiêu này được cộng (+) vào chỉ tiêu “Lợi nhuận kinh doanh trước những thay đổi vốn lưu động” nếu tổng các số dư cuối kỳ nhỏ hơn tổng các số dư đầu kỳ. Số liệu chỉ tiêu này được trừ (-) vào số liệu chỉ tiêu “Lợi nhuận kinh doanh trước những thay đổi vốn lưu động” nếu tổng các số dư cuối kỳ lớn hơn tổng các số dư đầu kỳ và được ghi bằng số âm dưới hình thức ghi trong ngoặc đơn (***).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTăng, giảm hàng tồn kho - Mã số 10\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào tổng các chênh lệch giữa số dư cuối kỳ và số dư đầu kỳ của các Tài khoản hàng tồn kho (Không bao gồm số dư của Tài khoản \"Dự phòng giảm giá hàng tồn kho\").\u003c/p\u003e\n\u003cp\u003eSố liệu chỉ tiêu này được cộng (+) vào chỉ tiêu “Lợi nhuận kinh doanh trước những thay đổi vốn lưu động” nếu tổng các số dư cuối kỳ nhỏ hơn tổng các số dư đầu kỳ. Số liệu chỉ tiêu này được trừ (-) vào chỉ tiêu “Lợi nhuận kinh doanh trước những thay đổi vốn lưu động” nếu tổng các số dư cuối kỳ lớn hơn tổng các số dư đầu kỳ và được ghi bằng số âm dưới hình thức ghi trong ngoặc đơn (***).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTăng, giảm các khoản phải trả - Mã số 11\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào tổng các chênh lệch giữa số dư cuối kỳ với số dư đầu kỳ của các Tài khoản nợ phải trả liên quan đến hoạt động kinh doanh, như: Tài khoản \"Phải trả cho người bán\" (Chi tiết \"Phải trả cho người bán\"), Tài khoản \"Phải thu của khách hàng\" (Chi tiết \"Người mua trả tiền trước\"), các Tài khoản \"Thuế và các khoản phải nộp Nhà nước\", \"Phải trả công nhân viên\", \"Chi phí phải trả\", \"Phải trả nội bộ\", \"Phải trả, phải nộp khác\". Chỉ tiêu này không bao gồm các khoản phải trả về thuế TNDN phải nộp, các khoản phải trả về lãi tiền vay, các khoản phải trả liên quan đến hoạt động đầu tư (như mua sắm, xây dựng TSCĐ, mua bất động sản đầu tư, mua các công cụ nợ...) và hoạt động tài chính (Vay và nợ ngắn hạn, dài hạn...).\u003c/p\u003e\n\u003cp\u003eSố liệu chỉ tiêu này được cộng (+) vào chỉ tiêu “Lợi nhuận kinh doanh trước những thay đổi vốn lưu động” nếu tổng các số dư cuối kỳ lớn hơn tổng số dư đầu kỳ. Số liệu chỉ tiêu này được trừ (-) vào số liệu chỉ tiêu “Lợi nhuận kinh doanh trước những thay đổi vốn lưu động” nếu tổng các số dư cuối kỳ nhỏ hơn tổng các số dư đầu kỳ và được ghi bằng số âm dưới hình thức ghi trong ngoặc đơn (***).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTăng, giảm chi phí trả trước - Mã số 12\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào tổng các chênh lệch giữa số dư cuối kỳ và số dư đầu kỳ của các Tài khoản \"Chi phí trả trước\" và \"Chi phí trả trước dài hạn\" trong kỳ báo cáo.\u003c/p\u003e\n\u003cp\u003eSố liệu chỉ tiêu này được cộng (+) vào chỉ tiêu “Lợi nhuận kinh doanh trước những thay đổi vốn lưu động” nếu tổng các số dư cuối kỳ nhỏ hơn tổng các số dư đầu kỳ. Số liệu chỉ tiêu này được trừ (-) vào số liệu chỉ tiêu \"Lợi nhuận kinh doanh trước những thay đổi vốn lưu động\" nếu tổng các số dư cuối kỳ lớn hơn tổng các số dư đầu kỳ và được ghi bằng số âm dưới hình thức ghi trong ngoặc đơn (***).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTiền lãi vay đã trả - Mã số 13\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\", \"Tiền đang chuyển\" (phần chi tiền) để trả các khoản tiền lãi vay, sổ kế toán Tài khoản “Phải thu của khách hàng” (phần trả tiền lãi vay từ tiền thu các khoản phải thu của khách hàng) trong kỳ báo cáo, sau khi đối chiếu với sổ kế toán các Tài khoản \"Chi phí trả trước\", \"Chi phí trả trước dài hạn\", \"Chi phí tài chính\", \"Xây dựng cơ bản dở dang\", \"Chi phí sản xuất chung\" và \"Chi phí phải trả\" (chi tiết số tiền lãi vay trả trước, tiền lãi vay phát sinh trả trong kỳ này hoặc số tiền lãi vay phát sinh trong các kỳ trước và đã trả trong kỳ này).\u003c/p\u003e\n\u003cp\u003eSố liệu chỉ tiêu này được trừ (-) vào số liệu chỉ tiêu “Lợi nhuận kinh doanh trước những thay đổi vốn lưu động” và được ghi bằng số âm dưới hình thức ghi trong ngoặc đơn (***).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eThuế thu nhập doanh nghiệp đã nộp - Mã số 14\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\", \"Tiền đang chuyển\", (phần chi tiền nộp thuế TNDN), sổ kế toán Tài khoản “Phải thu của khách hàng” (phần đã nộp thuế TNDN từ tiền thu các khoản phải thu của khách hàng) trong kỳ báo cáo, sau khi đối chiếu với sổ kế toán Tài khoản \"Thuế TNDN phải nộp\" (chi tiết số tiền đã chi để nộp thuế TNDN trong kỳ báo cáo).\u003c/p\u003e\n\u003cp\u003eSố liệu chỉ tiêu này được trừ (-) vào số liệu chỉ tiêu “Lợi nhuận kinh doanh trước những thay đổi vốn lưu động” và được ghi bằng số âm dưới hình thức ghi trong ngoặc đơn (***).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTiền thu khác từ hoạt động kinh doanh - Mã số 15\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này phản ánh các khoản tiền thu khác phát sinh từ hoạt động kinh doanh ngoài các khoản đã nêu ở các Mã số từ 01 đến 14, như: Tiền thu được do nhận ký cược, ký quỹ, tiền thu hồi các khoản đưa đi ký cược, ký quỹ; Tiền thu từ nguồn kinh phí sự nghiệp, dự án (nếu có); Tiền được các tổ chức, cá nhân bên ngoài thưởng, hỗ trợ ghi tăng các quỹ của doanh nghiệp; Tiền nhận được ghi tăng các quỹ do cấp trên cấp hoặc cấp dưới nộp... trong kỳ báo cáo.\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\", “Tiền đang chuyển” sau khi đối chiếu với sổ kế toán các Tài khoản có liên quan trong kỳ báo cáo.\u003c/p\u003e\n\u003cp\u003eSố liệu chỉ tiêu này được cộng (+) vào số liệu chỉ tiêu “Lợi nhuận kinh doanh trước những thay đổi vốn lưu động”.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTiền chi khác từ hoạt động kinh doanh - Mã số 16\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này phản ánh các khoản tiền chi khác phát sinh từ hoạt động kinh doanh ngoài các khoản đã nêu ở các Mã số từ 01 đến 14, như: Tiền đưa đi ký cược, ký quỹ; Tiền trả lại các khoản đã nhận ký cược, ký quỹ; Tiền chi trực tiếp từ quỹ khen thưởng, phúc lợi; Tiền chi trực tiếp bằng nguồn kinh phí sự nghiệp, dự án; Tiền chi nộp các quỹ lên cấp trên hoặc cấp cho cấp dưới... trong kỳ báo cáo.\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\", \"Tiền đang chuyển\" sau khi đối chiếu với sổ kế toán các Tài khoản có liên quan trong kỳ báo cáo.\u003c/p\u003e\n\u003cp\u003eSố liệu chỉ tiêu này được trừ (-) vào số liệu chỉ tiêu “Lợi nhuận kinh doanh trước những thay đổi vốn lưu động”.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eLưu chuyển tiền thuần từ hoạt động kinh doanh - Mã số 20\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu “Lưu chuyển tiền thuần từ hoạt động kinh doanh” phản ánh chênh lệch giữa tổng số tiền thu vào với tổng số tiền chi ra từ hoạt động kinh doanh trong kỳ báo cáo.\u003c/p\u003e\n\u003cp\u003eSố liệu chỉ tiêu này được tính bằng tổng cộng số liệu các chỉ tiêu có mã số từ Mã số 08 đến Mã số 16. Nếu số liệu chỉ tiêu này là số âm thì sẽ được ghi dưới hình thức trong ngoặc đơn (***).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eMã số 20 = Mã số 08 + Mã số 09 + Mã số 10 + Mã số 11 + Mã số 12 + Mã số\u003cbr\u003e\n   \u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; 13 + Mã số 14 + Mã số 15 + Mã số 16\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e6.2. Lập báo cáo các chỉ tiêu luồng tiền từ hoạt động đầu tư\u003c/p\u003e\n\u003cp\u003e- Nguyên tắc lập:\u003c/p\u003e\n\u003cp\u003e+ Luồng tiền từ hoạt động đầu tư được lập và trình bày trên Báo cáo lưu chuyển tiền tệ một cách riêng biệt các luồng tiền vào và các luồng tiền ra, trừ trường hợp các luồng tiền được báo cáo\u0026nbsp; trên cơ sở thuần đề cập trong đoạn 18 của Chuẩn mực số 24 \"Báo cáo lưu chuyển tiền tệ\".\u003c/p\u003e\n\u003cp\u003e+ Luồng tiền từ hoạt động đầu tư được lập theo phương pháp trực tiếp. Các luồng tiền vào, các luồng tiền ra trong kỳ từ hoạt động đầu tư được xác định bằng cách phân tích và tổng hợp trực tiếp các khoản tiền thu vào và chi ra theo từng nội dung thu, chi từ các ghi chép kế toán của doanh nghiệp.\u003c/p\u003e\n\u003cp\u003e+ Các luồng tiền phát sinh từ việc mua và thanh lý các công ty con hoặc các đơn vị kinh doanh khác được phân loại là luồng tiền từ hoạt động đầu tư và phải trình bày thành chỉ tiêu riêng biệt trên Báo cáo lưu chuyển tiền tệ.\u003c/p\u003e\n\u003cp\u003e+ Tổng số tiền chi trả hoặc thu được từ việc mua và thanh lý công ty con hoặc đơn vị kinh doanh khác được trình bày trong Báo cáo lưu chuyển tiền tệ theo số thuần của tiền và tương đương tiền chi trả hoặc thu được từ việc mua và thanh lý.\u003c/p\u003e\n\u003cp\u003e+ Ngoài việc trình bày trong Báo cáo lưu chuyển tiền tệ, doanh nghiệp phải trình bày trong Thuyết minh báo cáo tài chính một cách tổng hợp về cả việc mua và thanh lý các công ty con hoặc các đơn vị kinh doanh khác trong kỳ những thông tin sau:\u003c/p\u003e\n\u003cp\u003e* Tổng giá trị mua hoặc thanh lý;\u003c/p\u003e\n\u003cp\u003e* Phần giá trị mua hoặc thanh lý được thanh toán bằng tiền và các khoản tương đương tiền;\u003c/p\u003e\n\u003cp\u003e* Số tiền và các khoản tương đương tiền thực có trong công ty con hoặc đơn vị kinh doanh khác được mua hoặc thanh lý;\u003c/p\u003e\n\u003cp\u003e* Phần giá trị tài sản và công nợ không phải là tiền và các khoản tương đương tiền trong công ty con hoặc đơn vị kinh doanh khác được mua hoặc thanh lý trong kỳ. Giá trị tài sản này phải được tổng hợp theo từng loại tài sản.\u003c/p\u003e\n\u003cp\u003e- Cơ sở lập:\u003c/p\u003e\n\u003cp\u003e+ Bảng Cân đối kế toán;\u003c/p\u003e\n\u003cp\u003e+ Thuyết minh báo cáo tài chính;\u003c/p\u003e\n\u003cp\u003e+ Sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\", \"Tiền đang chuyển\", “Phải thu của khách hàng”;\u003c/p\u003e\n\u003cp\u003e+ Sổ kế toán các Tài khoản \"TSCĐ hữu hình\", \"TSCĐ vô hình\", \"XDCB dở dang\", \"Thu nhập khác\", \"Chi phí khác\";\u003c/p\u003e\n\u003cp\u003e+ Sổ kế toán các Tài khoản \"Đầu tư chứng khoán ngắn hạn\", \"Đầu tư ngắn hạn khác\", \"Đầu tư chứng khoán dài hạn\", \"Góp vốn liên doanh\", \"Đầu tư dài hạn khác\" và các Tài khoản khác có liên quan;\u003c/p\u003e\n\u003cp\u003e+ Các sổ kế toán khác có liên quan;\u003c/p\u003e\n\u003cp\u003e+ Báo cáo lưu chuyển tiền tệ kỳ trước.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e- Phương pháp lập các chỉ tiêu cụ thể (Xem Phụ lục số 03)\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(1) Tiền chi mua sắm, xây dựng TSCĐ và các tài sản dài hạn khác -\u0026nbsp; Mã số 21 \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào tổng số tiền đã chi để mua sắm, xây dựng TSCĐ hữu hình, TSCĐ vô hình, tiền chi cho giai đoạn triển khai đã được vốn hoá thành TSCĐ vô hình, tiền chi cho hoạt động đầu tư xây dựng dở dang, đầu tư bất động sản trong kỳ báo cáo.\u003c/p\u003e\n\u003cp\u003eSố liệu để ghi vào chỉ tiêu này lấy từ sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\", \"Tiền đang chuyển\" (phần chi tiền), sổ kế toán Tài khoản “Phải thu của khách hàng” (phần chi tiền từ tiền thu các khoản phải thu của khách hàng), sổ kế toán Tài khoản “Vay dài hạn” (Phần chi tiền từ tiền vay dài hạn nhận được chuyển trả ngay cho người bán) trong kỳ báo cáo, sau khi đối chiếu với sổ kế toán các Tài khoản \"TSCĐ hữu hình\",\u0026nbsp; \"TSCĐ vô hình\", \"Xây dựng cơ bản dở dang\", \"Đầu tư dài hạn khác\", “Phải trả cho người bán” trong kỳ báo cáo và được ghi bằng số âm dưới hình thức ghi trong ngoặc đơn (***).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(2) Tiền thu thanh lý, nhượng bán TSCĐ và các tài sản dài hạn khác - Mã số 22\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào số tiền thuần đã thu từ việc thanh lý, nhượng bán TSCĐ hữu hình, TSCĐ vô hình và bất động sản đầu tư trong kỳ báo cáo.\u003c/p\u003e\n\u003cp\u003eSố liệu để ghi vào chỉ tiêu này là chênh lệch giữa số tiền thu và số tiền chi cho việc thanh lý, nhượng bán TSCĐ và bất động sản đầu tư. Số tiền thu được lấy từ sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\", \"Tiền đang chuyển\", sau khi đối chiếu với sổ kế toán Tài khoản \"Thu nhập khác\" (Chi tiết thu về thanh lý, nhượng bán TSCĐ), sổ kế toán Tài khoản \"Doanh thu hoạt động tài chính\" (chi tiết thu về bán bất động sản đầu tư), sổ kế toán Tài khoản “Phải thu của khách hàng” (phần tiền thu liên quan đến thanh lý, nhượng bán TSCĐ và các tài sản dài hạn khác) trong kỳ báo cáo. Số tiền chi được lấy từ sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\", \"Tiền đang chuyển\", sau khi đối chiếu với sổ kế toán Tài khoản \"Chi phí tài chính\" và \"Chi phí khác\" (Chi tiết chi về thanh lý, nhượng bán TSCĐ và bất động sản đầu tư) trong kỳ báo cáo. Chỉ tiêu này được ghi bằng số âm dưới hình thức ghi trong ngoặc đơn (***) nếu số tiền thực thu nhỏ hơn số tiền thực chi.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(3) Tiền chi cho vay và mua các công cụ nợ của đơn vị khác - Mã số 23\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào tổng số tiền đã chi cho bên khác vay, chi mua các công cụ nợ của đơn vị khác (Trái phiếu, tín phiếu, kỳ phiếu...) vì mục đích nắm giữ đầu tư trong kỳ báo cáo. Chỉ tiêu này không bao gồm tiền chi mua các công cụ nợ được coi là các khoản tương đương tiền và mua các công cụ nợ vì mục đích thương mại.\u003c/p\u003e\n\u003cp\u003eSố liệu để ghi vào chỉ tiêu này lấy từ sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\", \"Tiền đang chuyển\", sau khi đối chiếu với sổ kế toán các Tài khoản \"Đầu tư ngắn hạn khác\", \"Đầu tư dài hạn khác\" (Chi tiết các khoản tiền chi cho vay), Tài khoản \"Đầu tư chứng khoán ngắn hạn\", \"Đầu tư chứng khoán dài hạn\" (Chi tiết tiền chi mua các công cụ nợ của đơn vị khác (Trái phiếu, tín phiếu, kỳ phiếu...) trong kỳ báo cáo. Chỉ tiêu này được ghi bằng số âm dưới hình thức ghi trong ngoặc đơn (***).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(4) Tiền thu hồi cho vay, bán lại công cụ nợ của đơn vị\u0026nbsp; khác - Mã số 24\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào tổng số tiền đã thu từ việc thu hồi lại số tiền gốc đã cho vay, từ bán lại hoặc thanh toán các công cụ nợ của đơn vị khác trong kỳ báo cáo. Chỉ tiêu này không bao gồm tiền thu từ bán các công cụ nợ được coi là các khoản tương đương tiền và bán các công cụ nợ vì mục đích thương mại.\u003c/p\u003e\n\u003cp\u003eSố liệu để ghi vào chỉ tiêu này lấy từ sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\", sau khi đối chiếu với sổ kế toán các Tài khoản \"Đầu tư ngắn hạn khác\",\u0026nbsp; \"Đầu tư dài hạn khác\" (Chi tiết thu hồi tiền cho vay) và các Tài khoản \"Đầu tư chứng khoán ngắn hạn\", \"Đầu tư chứng khoán dài hạn\" (Chi tiết số tiền thu do bán lại các công cụ nợ (Trái phiếu, tín phiếu, kỳ phiếu)).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(5) Tiền chi đầu tư vốn vào đơn vị khác - Mã số 25\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào tổng số tiền đã chi để đầu tư vốn vào doanh nghiệp khác trong kỳ báo cáo, bao gồm tiền chi đầu tư vốn dưới hình thức mua cổ phiếu, góp vốn vào công ty liên doanh, liên kết (không bao gồm tiền chi mua cổ phiếu vì mục đích thương mại).\u003c/p\u003e\n\u003cp\u003eSố liệu để ghi vào chỉ tiêu này lấy từ\u0026nbsp; sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\" và \"Tiền đang chuyển\", sau khi đối chiếu với sổ kế toán các Tài khoản \"Đầu tư chứng khoán dài hạn\" (Chi tiết đầu tư cổ phiếu), Tài khoản \"Góp vốn liên doanh\", Tài khoản \"Đầu tư ngắn hạn khác\" và Tài khoản \"Đầu tư dài hạn khác\" trong kỳ báo cáo và được ghi bằng số âm dưới hình thức ghi trong ngoặc đơn (***).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(6) Tiền thu hồi đầu tư vốn vào đơn vị khác - Mã số 26\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào tổng số tiền thu hồi các khoản đầu tư vốn vào đơn vị khác (Do bán lại hoặc thanh lý các khoản vốn đã đầu tư vào đơn vị khác) trong kỳ báo cáo (không bao gồm tiền thu do bán cổ phiếu đã mua vì mục đích thương mại).\u003c/p\u003e\n\u003cp\u003eSố liệu để ghi vào chỉ tiêu này lấy từ sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\", sau khi đối chiếu với sổ kế toán các Tài khoản \"Đầu tư chứng khoán dài hạn\" (Chi tiết cổ phiếu), Tài khoản \"Góp vốn liên doanh\", Tài khoản \"Đầu tư ngắn hạn khác\" và Tài khoản \"Đầu tư dài hạn khác\"(Chi tiết đầu tư vốn vào đơn vị khác) trong kỳ báo cáo.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(7) Thu lãi tiền cho vay, cổ tức và lợi nhuận được chia - Mã số 27\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào số tiền thu về các khoản tiền lãi cho vay, lãi tiền gửi, lãi từ mua và nắm giữ đầu tư các công cụ nợ (Trái phiếu, tín phiếu, kỳ phiếu...), cổ tức và lợi nhuận nhận được từ góp vốn vào các đơn vị khác trong kỳ báo cáo.\u003c/p\u003e\n\u003cp\u003eSố liệu để ghi vào chỉ tiêu này lấy từ sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\", sau khi đối chiếu với sổ kế toán các Tài khoản \"Doanh thu hoạt động tài chính\", \"Đầu tư chứng khoán ngắn hạn\", \"Đầu tư chứng khoán dài hạn\", \"Góp vốn liên doanh\", \"Đầu tư ngắn hạn khác\", \"Đầu tư dài hạn khác\" và các Tài khoản khác có liên quan trong kỳ báo cáo.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(8) Lưu chuyển tiền thuần từ hoạt động đầu tư -\u0026nbsp; Mã số 30\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu “Lưu chuyển tiền thuần từ hoạt động đầu tư” phản ánh chênh lệch giữa tổng số tiền thu vào với tổng số tiền chi ra từ hoạt động đầu tư trong kỳ báo cáo.\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được tính bằng tổng cộng số liệu các chỉ tiêu có mã số từ Mã số 21 đến Mã số 27. Nếu số liệu chỉ tiêu này là số âm thì được ghi dưới hình thức ghi trong ngoặc đơn (***).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eMã số 30 = Mã số 21 + Mã số 22 + Mã số 23 + Mã số 24 + Mã số 25 + Mã số\u003cbr\u003e\n   \u0026nbsp;\u0026nbsp;\u0026nbsp; \u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;26 + Mã số 27\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e6.3. Lập báo cáo các chỉ tiêu luồng tiền từ hoạt động tài chính \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e- Nguyên tắc lập:\u003c/p\u003e\n\u003cp\u003e+ Luồng tiền từ hoạt động tài chính được lập và trình bày trên Báo cáo lưu chuyển tiền tệ một cách riêng biệt các luồng tiền vào và các luồng tiền ra, trừ trường hợp các luồng tiền được báo cáo trên cơ sở thuần được đề cập trong đoạn 19 của Chuẩn mực \"Báo cáo lưu chuyển tiền tệ\".\u003c/p\u003e\n\u003cp\u003e+ Luồng tiền từ hoạt động tài chính được lập theo phương pháp trực tiếp. Các luồng tiền vào, các luồng tiền ra trong kỳ từ hoạt động tài chính được xác định bằng cách phân tích và tổng hợp trực tiếp các khoản tiền thu vào và chi ra theo từng nội dung thu, chi từ các ghi chép kế toán của doanh nghiệp.\u003c/p\u003e\n\u003cp\u003e- Cơ sở lập:\u003c/p\u003e\n\u003cp\u003e+ Bảng Cân đối kế toán;\u003c/p\u003e\n\u003cp\u003e+ Thuyết minh báo cáo tài chính;\u003c/p\u003e\n\u003cp\u003e+ Sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\" và \"Tiền đang chuyển\", “Phải thu của khách hàng”;\u003c/p\u003e\n\u003cp\u003e+ Sổ kế toán các Tài khoản \"Nguồn vốn kinh doanh\", \"Vay ngắn hạn\", \"Nợ dài hạn đến hạn trả\", \"Vay dài hạn\", \"Nợ dài hạn\", \"Trái phiếu phát hành\", và các Tài khoản khác có liên quan trong kỳ báo cáo;\u003c/p\u003e\n\u003cp\u003e+ Các sổ kế toán chi tiết khác có liên quan;\u003c/p\u003e\n\u003cp\u003e+ Báo cáo lưu chuyển tiền tệ kỳ trước.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e- Phương pháp lập các chỉ tiêu cụ thể (Xem\u0026nbsp; Phụ lục số 03)\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(1) Tiền thu từ phát hành cổ phiếu, nhận vốn góp của chủ sở hữu - Mã số 31\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào tổng số tiền đã thu do các chủ sở hữu của doanh nghiệp góp vốn dưới các hình thức phát hành cổ phiếu thu bằng tiền (số tiền thu theo giá thực tế phát hành), tiền thu góp vốn bằng tiền của các chủ sở hữu, tiền thu do Nhà nước cấp vốn trong kỳ báo cáo.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này không bao gồm các khoản vay và nợ được chuyển thành vốn cổ phần hoặc nhận vốn góp của chủ sở hữu bằng tài sản.\u003c/p\u003e\n\u003cp\u003eSố liệu để ghi vào chỉ tiêu này lấy từ sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\", sau khi đối chiếu với sổ kế toán Tài khoản \"Nguồn vốn kinh doanh\" (Chi tiết vốn góp của chủ sở hữu) trong kỳ báo cáo.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(2) Tiền chi trả vốn góp cho các chủ sở hữu, mua lại cổ phiếu đã phát hành - Mã số 32\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào tổng số tiền đã trả do hoàn lại vốn góp cho các chủ sở hữu của doanh nghiệp dưới các hình thức hoàn trả bằng tiền hoặc mua lại cổ phiếu của doanh nghiệp đã phát hành bằng tiền để huỷ bỏ hoặc sử dụng làm cổ phiếu ngân quỹ trong kỳ báo cáo.\u003c/p\u003e\n\u003cp\u003eSố liệu để ghi vào chỉ tiêu này lấy từ sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\", \"Tiền đang chuyển\", sau khi đối chiếu với sổ kế toán các Tài khoản \"Nguồn vốn kinh doanh\" và \"Cổ phiếu ngân quỹ\" trong kỳ báo cáo. Chỉ tiêu này được ghi bằng số âm dưới hình thức ghi trong ngoặc đơn (***).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(3) Tiền vay nhận được - Mã số 33\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào tổng số tiền đã nhận được do doanh nghiệp đi vay ngắn hạn, dài hạn của ngân hàng, các tổ chức tài chính, tín dụng và các đối tượng khác trong kỳ báo cáo. Đối với các khoản vay bằng trái phiếu, số tiền đã thu được phản ánh theo số thực thu (Bằng mệnh giá trái phiếu điều chỉnh với các khoản chiết khấu, phụ trội trái phiếu hoặc lãi trái phiếu trả trước).\u003c/p\u003e\n\u003cp\u003eSố liệu để ghi vào chỉ tiêu này lấy từ sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\", các tài khoản phải trả (phần tiền vay nhận được chuyển trả ngay các khoản nợ phải trả) trong kỳ báo cáo, sau khi đối chiếu với sổ kế toán các Tài khoản \"Vay ngắn hạn\", \"Vay dài hạn\", \"Nợ dài hạn\", \"Trái phiếu phát hành\" và các Tài khoản khác có liên quan trong kỳ báo cáo.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(4) Tiền trả nợ vay - Mã số 34\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào tổng số tiền đã trả về khoản nợ gốc vay ngắn hạn, vay dài hạn, nợ thuê tài chính của ngân hàng, tổ chức tài chính, tín dụng và các đối tượng khác trong kỳ báo cáo.\u003c/p\u003e\n\u003cp\u003eSố liệu để ghi vào chỉ tiêu này lấy từ sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\", \"Tiền đang chuyển\", sổ kế toán Tài khoản “Phải thu của khách hàng” (phần tiền trả nợ vay từ tiền thu các khoản phải thu của khách hàng) trong kỳ báo cáo, sau khi đối chiếu với sổ kế toán các Tài khoản \"Vay ngắn hạn\", \"Nợ dài hạn đến hạn trả\", \"Vay dài hạn\", \"Nợ dài hạn\" và \"Trái phiếu phát hành\" trong kỳ báo cáo. Chỉ tiêu này được ghi bằng số âm dưới hình thức ghi trong ngoặc đơn (***).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(5) Tiền chi trả nợ thuê tài chính - Mã số 35\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào tổng số tiền đã trả về khoản nợ thuê tài chính trong kỳ báo cáo.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eSố liệu để ghi vào chỉ tiêu này lấy từ sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\", \"Tiền đang chuyển\", sổ kế toán Tài khoản “Phải thu của khách hàng” (phần tiền trả nợ thuê tài chính từ tiền thu các khoản phải thu của khách hàng) trong kỳ báo cáo, sau khi đối chiếu với sổ kế toán các Tài khoản \"Nợ dài hạn đến hạn trả\" và \"Nợ dài hạn\" (Chi tiết số trả nợ thuê tài chính) trong kỳ báo cáo. Chỉ tiêu này được ghi bằng số âm dưới hình thức ghi trong ngoặc đơn (***).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(6) Cổ tức, lợi nhuận đã trả - Mã số 36\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào tổng số tiền đã trả cổ tức và lợi nhuận được chia cho các chủ sở hữu của doanh nghiệp trong kỳ báo cáo.\u003c/p\u003e\n\u003cp\u003eSố liệu để ghi vào chỉ tiêu này lấy từ sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\", \"Tiền đang chuyển\", sau khi đối chiếu với sổ kế toán Tài khoản \"Lợi nhuận chưa phân phối\" (Chi tiết số tiền đã trả về cổ tức và lợi nhuận) trong kỳ báo cáo. Chỉ tiêu này được ghi bằng số âm dưới hình thức ghi trong ngoặc đơn (***).\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này không bao gồm khoản cổ tức hoặc lợi nhuận được chia nhưng không trả cho chủ sở hữu mà được chuyển thành vốn cổ phần.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(7) Lưu chuyển tiền thuần từ hoạt động tài chính - Mã số 40\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu lưu chuyển tiền thuần từ hoạt động tài chính phản ánh chênh lệch giữa tổng số tiền thu vào với tổng số tiền chi ra từ hoạt động tài chính trong kỳ báo cáo.\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được tính bằng tổng cộng số liệu các chỉ tiêu có mã số từ Mã số 31 đến Mã số 36.\u003c/p\u003e\n\u003cp\u003eNếu số liệu chỉ tiêu này là số âm thì ghi trong ngoặc đơn (***).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eMã số 40 = Mã số 31 + Mã số 32 + Mã số 33 + Mã số 34 + Mã số 35 + Mã số 36\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e6.4. Tổng hợp các luồng tiền trong kỳ (Xem Phụ lục số 03)\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(1) Lưu chuyển tiền thuần trong kỳ - Mã số 50\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu “Lưu chuyển tiền thuần trong kỳ” phản ánh chênh lệch giữa tổng số tiền thu vào với tổng số tiền chi ra từ ba loại hoạt động: Hoạt động kinh doanh, hoạt động đầu tư và hoạt động tài chính của doanh nghiệp trong kỳ báo cáo.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eMã số 50 = Mã số 20 + Mã số 30 + Mã số 40\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eNếu số liệu chỉ tiêu này là số âm thì ghi trong ngoặc đơn (***).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(2) Tiền và tương đương tiền đầu kỳ - Mã số 60\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào số dư của tiền và tương đương tiền đầu kỳ báo cáo, bao gồm tiền mặt, tiền gửi Ngân hàng, tiền đang chuyển (Mã số 110, cột “Số đầu kỳ” trên Bảng Cân đối kế toán) và số dư của các khoản tương đương tiền đầu kỳ được lấy trên sổ kế toán chi tiết Tài khoản \"Đầu tư chứng khoán ngắn hạn\" đối với các khoản đầu tư ngắn hạn thoả mãn định nghĩa là tương đương tiền.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(3) ảnh hưởng của thay đổi tỷ giá hối đoái quy đổi ngoại tệ - Mã số 61\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào tổng số chênh lệch tỷ giá hối đoái do đánh giá lại số dư cuối kỳ của tiền (Mã số 110) và các khoản tương đương tiền bằng ngoại tệ tại thời điểm cuối kỳ báo cáo.\u003c/p\u003e\n\u003cp\u003eSố liệu để ghi vào chỉ tiêu này được lấy từ sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\", \"Tiền đang chuyển\", và Tài khoản \"Đầu tư chứng khoán ngắn hạn\" (Chi tiết các khoản đầu tư ngắn hạn thoả mãn định nghĩa là tương đương tiền), sau khi đối chiếu với sổ kế toán chi tiết Tài khoản \"Chênh lệch tỷ giá hối đoái\" trong kỳ báo cáo. Chỉ tiêu này được ghi bằng số dương nếu tỷ giá hối đoái cuối kỳ cao hơn tỷ giá hối đoái đã ghi nhận trong kỳ, chỉ tiêu này được ghi bằng số âm dưới hình thức ghi trong ngoặc đơn nếu tỷ giá hối đoái cuối kỳ thấp hơn tỷ giá hối đoái đã ghi nhận trong kỳ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(4) Tiền và tương đương tiền cuối kỳ - Mã số 70\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào số dư của tiền và tương đương tiền cuối kỳ báo cáo, bao gồm tiền mặt, Tiền gửi Ngân hàng, tiền đang chuyển (Mã số 110, cột “Số cuối kỳ” trên Bảng Cân đối kế toán) và số dư cuối kỳ của các khoản tương đương tiền được lấy trên sổ kế toán chi tiết Tài khoản \"Đầu tư chứng khoán ngắn hạn\" đối với các khoản đầu tư ngắn hạn thoả mãn định nghĩa là tương đương tiền.\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này cũng bằng số tổng cộng của các chỉ tiêu Mã số 50, 60 và 61.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eMã số 70 = Mã số 50 + Mã số 60 + Mã số 61 \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eVI. HƯỚNG DẪN SỬA ĐỔI, \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBỔ SUNG CHẾ ĐỘ BÁO CÁO TÀI CHÍNH\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1. Bảng cân đối kế toán\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eCăn cứ vào 06 chuẩn mực kế toán đã ban hành theo Quyết định số 165/2002/QĐ-BTC ngày 31/12/2002 của Bộ Tài chính, Bảng Cân đối kế toán (Mẫu số B01-DN) được sửa đổi, bổ sung một số chỉ tiêu sau đây:\u003c/p\u003e\n\u003cp\u003e1.1. Bổ sung chỉ tiêu “Phải thu theo tiến độ kế hoạch hợp đồng xây dựng” (Mã số 137) vào điểm III - “Các khoản phải thu” của Mục A - “Tài sản lưu động và đầu tư ngắn hạn”.\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này phản ánh số chênh lệch giữa tổng số doanh thu đã ghi nhận luỹ kế tương ứng với phần công việc đã hoàn thành lớn hơn tổng số tiền luỹ kế khách hàng phải thanh toán theo tiến độ kế hoạch đến cuối kỳ báo cáo của các hợp đồng xây dựng dở dang.\u003c/p\u003e\n\u003cp\u003eSố liệu để ghi vào chỉ tiêu này căn cứ vào số dư Nợ TK 337 “Thanh toán theo tiến độ kế hoạch hợp đồng xây dựng”.\u003c/p\u003e\n\u003cp\u003e1.2.\u0026nbsp; Bổ sung chỉ tiêu “Phải trả theo tiến độ kế hoạch hợp đồng xây dựng” (Mã số 319) vào điểm\u0026nbsp; I - “Nợ ngắn hạn” của Mục A - “Nợ phải trả”.\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này phản ánh số chênh lệch giữa tổng số tiền luỹ kế khách hàng phải thanh toán theo tiến độ kế hoạch lớn hơn tổng số doanh thu đã ghi nhận luỹ kế tương ứng với phần công việc đã hoàn thành đến cuối kỳ báo cáo của các hợp đồng xây dựng dở dang.\u003c/p\u003e\n\u003cp\u003eSố liệu để ghi vào chỉ tiêu này căn cứ vào số dư Có TK 337 “Thanh toán theo tiến độ kế hoạch hợp đồng xây dựng”.\u003c/p\u003e\n\u003cp\u003e1.3. Bổ sung chỉ tiêu “Trái phiếu phát hành” (Mã số 323) vào điểm II – “Nợ dài hạn” của Mục A – “Nợ phải trả”.\u003c/p\u003e\n\u003cp\u003eSố liệu để ghi vào chỉ tiêu này được xác định bằng cách: Lấy số dư Có TK 3431 trừ (-) dư Nợ TK 3432 cộng (+) dư Có TK 3433. Kết quả tìm được ghi vào chỉ tiêu này.\u003c/p\u003e\n\u003cp\u003e1.4. Chỉ tiêu “Chênh lệch tỷ giá” - Mã số 413, đổi thành chỉ tiêu “Chênh lệch tỷ giá hối đoái”. Nội dung của chỉ tiêu này phản ánh số chênh lệch tỷ giá hối đoái phát sinh và đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ (lãi, lỗ tỷ giá) của hoạt động đầu tư XDCB (giai đoạn trước hoạt động, chưa hoàn thành đầu tư) ở thời điểm lập Bảng CĐKT cuối năm tài chính và số chênh lệch tỷ giá hối đoái từ chuyển đổi báo cáo tài chính của cơ sở nước ngoài chưa xử lý ở thời điểm lập bảng CĐKT cuối năm tài chính (nếu có).\u003c/p\u003e\n\u003cp\u003e1.5. Bỏ chỉ tiêu “Quỹ dự phòng về trợ cấp mất việc làm” – Mã số 421.\u003c/p\u003e\n\u003cp\u003eMẫu biểu “Bảng Cân đối kế toán” sau khi sửa đổi, bổ sung được quy định ở Phụ lục số 02 Thông tư này.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. Báo cáo kết quả hoạt động kinh doanh\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eĐổi tên chỉ tiêu “Trong đó: Lãi vay phải trả” Mã số 23 trong Báo cáo “Kết quả hoạt động kinh doanh” thành “Trong đó: Chi phí lãi vay”.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3. Thuyết minh báo cáo tài chính\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eCăn cứ vào 06 chuẩn mực kế toán đã ban hành theo Quyết định số 165/2002/QĐ-BTC ngày 31/12/2002 của Bộ Tài chính, Thuyết minh báo cáo tài chính (Mẫu B09-DN) được sửa đổi, bổ sung một số chỉ tiêu sau đây:\u003c/p\u003e\n\u003cp\u003e3.1. Bổ sung mục 2.7- “Chính sách kế toán đối với chi phí đi vay” vào mục 2 – “Chính sách kế toán áp dụng tại doanh nghiệp” trong “Thuyết minh báo cáo tài chính”:\u003c/p\u003e\n\u003cp\u003e+ Chính sách kế toán được áp dụng cho chi phí đi vay;\u003c/p\u003e\n\u003cp\u003e+ Tổng số chi phí đi vay được vốn hoá trong kỳ; và\u003c/p\u003e\n\u003cp\u003e+ Tỷ lệ vốn hoá được sử dụng để xác định chi phí đi vay được vốn hoá trong kỳ.\u003c/p\u003e\n\u003cp\u003e3.2. Bổ sung mục\u0026nbsp; 2.8 “Phương pháp xác định doanh thu và phương pháp xác định phần công việc đã hoàn thành của Hợp đồng xây dựng” vào mục 2 “Chính sách kế toán áp dụng tại doanh nghiệp” trong “Thuyết minh báo cáo tài chính”:\u003c/p\u003e\n\u003cp\u003e- Phương pháp xác định phần công việc đã hoàn thành của các giao dịch cung cấp dịch vụ;\u003c/p\u003e\n\u003cp\u003e- Phương pháp xác định phần công việc đã hoàn thành của hợp đồng xây dựng.\u003c/p\u003e\n\u003cp\u003e3.3. Bổ sung vào mục 3.3 “Tình hình tăng, giảm TSCĐ” trong “Thuyết minh báo cáo tài chính” các chỉ tiêu sau:\u003c/p\u003e\n\u003cp\u003eb. TSCĐ thuê tài chính:\u003c/p\u003e\n\u003cp\u003e- Tiền thuê phát sinh thêm được ghi nhận là chi phí trong kỳ;\u003c/p\u003e\n\u003cp\u003e- Căn cứ để xác định tiền thuê phát sinh thêm;\u003c/p\u003e\n\u003cp\u003e- Điều khoản gia hạn thuê hoặc quyền được mua tài sản.\u003c/p\u003e\n\u003cp\u003ec. TSCĐ thuê hoạt động:\u003c/p\u003e\n\u003cp\u003e- Tổng số tiền thuê tối thiểu trong tương lai cho hợp đồng thuê hoạt động không huỷ ngang theo các thời hạn:\u003c/p\u003e\n\u003cp\u003e+ Từ một (1) năm trở xuống;\u003c/p\u003e\n\u003cp\u003e+ Trên một (1) năm đến năm (5) năm;\u003c/p\u003e\n\u003cp\u003e+ Trên năm (5) năm.\u003c/p\u003e\n\u003cp\u003e- Căn cứ xác định chi phí tiền thuê phát sinh thêm.\u003c/p\u003e\n\u003cp\u003e3.4. Bổ sung vào mục 3.5 “Tình hình tăng, giảm nguồn vốn chủ sở hữu” trong \"Thuyết minh báo cáo tài chính\" chỉ tiêu “Chênh lệch tỷ giá hối đoái” để phản ánh chênh lệch tỷ giá hối đoái thuần được phân loại như vốn chủ sở hữu theo quy định của chuẩn mực “ảnh hưởng của việc thay đổi tỷ giá hối đoái”.\u003c/p\u003e\n\u003cp\u003e3.5. Bổ sung vào mục 4 “Giải thích và thuyết minh về một số tình hình và kết quả hoạt động sản xuất, kinh doanh“\u0026nbsp; trong “Thuyết minh báo cáo tài chính” các chỉ tiêu sau:\u003c/p\u003e\n\u003cp\u003e- Lãi, lỗ chênh lệch tỷ giá hối đoái đã ghi nhận vào lãi hoặc lỗ thuần trong kỳ;\u003c/p\u003e\n\u003cp\u003e- Doanh thu của hợp đồng xây dựng được ghi nhận trong kỳ;\u003c/p\u003e\n\u003cp\u003e- Tổng doanh thu luỹ kế của hợp đồng xây dựng được ghi nhận đến thời điểm lập Báo cáo tài chính;\u003c/p\u003e\n\u003cp\u003e- Số tiền còn phải trả cho khách hàng liên quan đến hợp đồng xây dựng;\u003c/p\u003e\n\u003cp\u003e- Số tiền còn phải thu của khách hàng liên quan đến hợp đồng xây dựng.\u003c/p\u003e\n\u003cp\u003e3.6. Bổ sung mục 5 “Các thông tin bổ sung về lưu chuyển tiền tệ” trong \"Thuyết minh báo cáo tài chính\" gồm các chỉ tiêu sau:\u003c/p\u003e\n\u003cp\u003e5.1. Thông tin về các giao dịch không bằng tiền phát sinh trong kỳ báo cáo:\u003c/p\u003e\n\u003cp\u003eViệc mua tài sản bằng cách nhận các khoản nợ liên quan trực tiếp hoặc thông qua nghiệp vụ cho thuê tài chính;\u003c/p\u003e\n\u003cp\u003e(b) Việc mua doanh nghiệp thông qua phát hành cổ phiếu;\u003c/p\u003e\n\u003cp\u003e(c) Việc chuyển nợ thành vốn chủ sở hữu.\u003c/p\u003e\n\u003cp\u003e5.2. Thông tin về mua và thanh lý các công ty con hoặc các đơn vị kinh doanh khác trong kỳ báo cáo:\u003c/p\u003e\n\u003cp\u003e(a) Tổng giá trị mua hoặc thanh lý;\u003c/p\u003e\n\u003cp\u003e(b) Phần giá trị mua hoặc thanh lý được thanh toán bằng tiền và các khoản tương đương tiền;\u003c/p\u003e\n\u003cp\u003e(c) Số tiền và các khoản tương đương tiền thực có trong công ty con hoặc đơn vị kinh doanh khác được mua hoặc thanh lý;\u003c/p\u003e\n\u003cp\u003e(d) Phần giá trị tài sản và công nợ không phải là tiền và các khoản tương đương tiền trong công ty con hoặc đơn vị kinh doanh khác được mua hoặc thanh lý\u0026nbsp; trong kỳ. Giá trị tài sản này phải được tổng hợp theo từng loại tài sản.\u003c/p\u003e\n\u003cp\u003e5.3. Các khoản tiền và tương đương tiền doanh nghiệp nắm giữ nhưng không được sử dụng:\u003c/p\u003e\n\u003cp\u003e- Các khoản tiền nhận ký quỹ, ký cược;\u003c/p\u003e\n\u003cp\u003e- Các quỹ chuyên dùng;\u003c/p\u003e\n\u003cp\u003e- Kinh phí dự án;\u003c/p\u003e\n\u003cp\u003e- Các khoản khác.\u003c/p\u003e\n\u003cp\u003e3.7. Thay đổi số thứ tự một số mục trong “Thuyết minh báo cáo tài chính” như sau:\u003c/p\u003e\n\u003cp\u003e- Mục 5 “Một số chỉ tiêu đánh giá khái quát thực trạng tài chính và kết quả kinh doanh của doanh nghiệp” chuyển thành mục 6;\u003c/p\u003e\n\u003cp\u003e- Mục 6 “Đánh giá tổng quát các chỉ tiêu” chuyển thành mục 7;\u003c/p\u003e\n\u003cp\u003e- Mục 7 “Các kiến nghị” chuyển thành mục 8;\u003c/p\u003e\n\u003cp\u003eMẫu biểu “Thuyết minh báo cáo tài chính” (Mẫu B - 09DN) sau khi sửa đổi, bổ sung được quy định ở Phụ lục số 4 Thông tư này.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eVII. ĐIỀU KHOẢN THI HÀNH\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e1. Thông tư này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2004. Các quy định trước đây trái với Thông tư này đều bãi bỏ, những phần kế toán khác có liên quan nhưng không hướng dẫn trong Thông tư này thì thực hiện theo chế độ kế toán doanh nghiệp hiện hành.\u003c/p\u003e\n\u003cp\u003e2. Các quy định trong chuẩn mực kế toán có khác biệt với chính sách tài chính do Bộ Tài chính ban hành thì thực hiện theo quy định trong chuẩn mực kế toán và hướng dẫn trong Thông tư này.\u003c/p\u003e\n\u003cp\u003e3. Các Tổng công ty, công ty có chế độ kế toán đặc thù đã được Bộ Tài chính chấp thuận, phải căn cứ vào 06 chuẩn mực kế toán ban hành theo Quyết định số 165/2002/QĐ-BTC ngày 31/12/2002 và Thông tư này để hướng dẫn, bổ sung cho phù hợp.\u003c/p\u003e\n\u003cp\u003e4. Các Bộ, Ngành, Uỷ Ban nhân dân, Sở Tài chính, Cục thuế các Tỉnh, Thành phố trực thuộc Trung ương có trách nhiệm triển khai hướng dẫn các doanh nghiệp thực hiện Thông tư này. Trong quá trình thực hiện nếu có vướng mắc đề nghị phản ánh về Bộ Tài chính để nghiên cứu giải quyết.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003c/body\u003e\n\u003c/html\u003e"])</script><script>self.__next_f.push([1,"d:[[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"Legislation\\\",\\\"name\\\":\\\"Thông tư số 105/2003/TT-BTC Hướng dẫn kế toán thực hiện sáu (6) chuẩn mực kế toán ban  hành theo Quyết định số 165/2002/QĐ-BTC ngày 31/12/2002 của Bộ trưởng Bộ Tài chính\\\",\\\"legislationIdentifier\\\":\\\"105/2003/TT-BTC\\\",\\\"legislationType\\\":\\\"Thông tư\\\",\\\"legislationDate\\\":\\\"2003-11-04T00:00:00\\\",\\\"legislationLegalForce\\\":\\\"NotInForce\\\",\\\"legislationPassedBy\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Bộ Tài chính\\\"},\\\"legislationJurisdiction\\\":\\\"VN\\\",\\\"url\\\":\\\"https://vbpl.vn/van-ban/chi-tiet/thong-tu-so-105-2003-tt-btc-huong-dan-ke-toan-thuc-hien-sau-6-chuan-muc-ke-toan-ban-hanh-theo-quyet-dinh-so-165-2002-qd-btc-ngay-31-12-2002-cua-bo-truong-bo-tai-chinh--24807\\\",\\\"inLanguage\\\":\\\"vi\\\",\\\"keywords\\\":\\\"Thông tư, Quản lý dịch vụ tài chính và các quỹ tài chính, Bộ Tài chính, văn bản pháp luật, pháp luật Việt Nam\\\"}\"}}],[\"$\",\"script\",\"breadc

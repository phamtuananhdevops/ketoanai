ức của Tòa án Nhân dân Tối cao Việt Nam\"},\"foreign\":{\"title\":\"Cổng Thông tin điện tử\u003cbr/\u003eBộ Ngoại giao\",\"description\":\"Cổng thông tin chính thức của Bộ Ngoại giao Việt Nam\"},\"officialGazette\":{\"title\":\"Cổng Thông tin điện tử\u003cbr/\u003eCông báo\",\"description\":\"Cổng thông tin chính thức của Cơ quan Công báo Việt Nam\"},\"feedbackSuggestions\":{\"title\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\",\"description\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\"}}},\"footer\":{\"unit\":\"Đơn vị chủ quản\",\"unitContent\":\"Bộ Tư pháp\",\"address\":\"Địa chỉ\",\"addressContent\":\"Số 60 Trần Phú - Ba Đình - Thành phố Hà Nội\",\"phoneNumber\":\"Điện thoại\",\"phoneNumberContent\":\"024.6273.9468\",\"fax\":\"Fax\",\"faxContent\":\"024.6273.9359\"},\"underConstruction\":{\"title\":\"Đang cập nhật\",\"message\":\"Chức năng này đang được phát triển.\"},\"gioiThieu\":{\"timeline\":{\"2005\":{\"description\":\"Năm 2005 đánh dấu sự khởi đầu của dự án xây dựng Cơ sở dữ liệu quốc gia về pháp luật, với mục tiêu số hóa và tập trung hóa các văn bản pháp luật của Việt Nam.\"},\"2012-2013\":{\"description\":\"Giai đoạn 2012-2013 là thời kỳ phát triển và mở rộng hệ thống, với việc tích hợp thêm nhiều tính năng và cải thiện giao diện người dùng.\"},\"2023-2025\":{\"description\":\"Giai đoạn 2023-2025 tập trung vào việc nâng cấp và hiện đại hóa hệ thống, áp dụng các công nghệ mới và mở rộng phạm vi phục vụ.\"}},\"overview\":{\"title\":\"SƠ LƯỢC MÔ HÌNH CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"CSDLQG về pháp luật tập hợp các văn bản quy phạm pháp luật và văn bản hợp nhất văn bản quy phạm pháp luật (sau đây gọi chung là văn bản) dưới dạng văn bản điện tử do Chính phủ thống nhất quản lý, có địa chỉ truy cập vbpl.vn, bao gồm các Cơ sở dữ liệu thành phần: Cơ sở dữ liệu văn bản pháp luật Trung ương và Cơ sở dữ liệu văn bản pháp luật địa phương.\",\"central\":{\"title\":\"Cơ sở dữ liệu Văn bản pháp luật Trung ương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của các Bộ, cơ quan ngang Bộ, cơ quan nhà nước khác ở Trung ương ban hành hoặc phối hợp ban hành. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật; Văn bản hợp nhất; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"local\":{\"title\":\"Cơ sở dữ liệu văn bản pháp luật địa phương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của từng tỉnh, thành phố trực thuộc Trung ương trên toàn quốc. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật của Hội đồng nhân dân và Ủy ban nhân dân; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"other\":{\"title\":\"Các chuyên mục khác\",\"content\":\"Ngoài các Cơ sở dữ liệu thành phần kể trên, CSDLQG về pháp luật còn có các chuyên mục khác như: Giới thiệu văn bản mới, Tin tức, Tình huống pháp luật. Ngoài ra, CSDLQG về thủ tục hành chính, bộ pháp điển điện tử, cổng thông tin điện tử Bộ Tư pháp cũng trích xuất về CSDLQG về pháp luật.\"}},\"vision\":{\"title\":\"Tầm nhìn\",\"content\":\"Trở thành nguồn tra cứu văn bản pháp luật chính thống, đầy đủ và đáng tin cậy, phục vụ hiệu quả cho người dân, doanh nghiệp và cơ quan nhà nước.\"},\"mission\":{\"title\":\"Sứ mệnh\",\"content\":\"Cung cấp hệ thống văn bản pháp luật được cập nhật kịp thời, tra cứu thuận tiện, góp phần nâng cao nhận thức pháp luật và bảo đảm việc tuân thủ pháp luật trong xã hội.\"},\"features\":{\"title\":\"MỘT SỐ TÍNH NĂNG, TIỆN ÍCH CỦA CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"Hiện nay, CSDLQG về PL có giao diện tương đối thân thiện, dễ tìm kiếm, dễ khai thác các thông tin và tải về sử dụng. Cơ sở dữ liệu cung cấp các chức năng, tiện ích cơ bản và thuận tiện\",\"list\":[{\"key\":\"fullText\",\"label\":\"Tra cứu toàn văn\",\"icon\":\"SearchOutlined\"},{\"key\":\"tableOfContents\",\"label\":\"Tự động tạo mục lục\",\"icon\":\"BookOutlined\"},{\"key\":\"relatedDocuments\",\"label\":\"Liên kết văn bản liên quan\",\"icon\":\"LinkOutlined\"},{\"key\":\"validity\",\"label\":\"Xác định hiệu lực tự động\",\"icon\":\"BarChartOutlined\"},{\"key\": d4626d4d27d18.js\",\"3911\",\"static/chunks/3911-317a706af8dde810.js\",\"1870\",\"static/chunks/1870-6c442a62b9aa4b08.js\",\"8510\",\"static/chunks/8510-5152690b3aa4b6a7.js\",\"956\",\"static/chunks/956-dcc326b2041b88f5.js\",\"119\",\"static/chunks/119-af8d6d47e84615fe.js\",\"6625\",\"static/chunks/6625-1107db2d5233eb73.js\",\"3954\",\"static/chunks/3954-946ccf0eafc577be.js\",\"5292\",\"static/chunks/5292-beb20880bf4a7330.js\",\"3207\",\"static/chunks/3207-0792bf349fc6782d.js\",\"7287\",\"static/chunks/7287-1e02014aaec038d7.js\",\"2007\",\"static/chunks/2007-dba949ac429f5003.js\",\"4310\",\"static/chunks/app/%5Blocale%5D/van-ban/%5Bcategory%5D/%5Bid%5D/page-75f20aedc57a9c0c.js\"],\"default\"]\n2b:T346b4,"])</script><script>self.__next_f.push([1,"\u003c!DOCTYPE html\u003e\n\u003chtml\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n    \u003ctitle\u003eDocument Content\u003c/title\u003e\n    \u003cstyle\u003e\n        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }\n        p { margin: 10px 0; }\n    \u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cp style=\"text-align:center;\"\u003e\u003cstrong\u003eTHÔNG TƯ\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\"text-align:center;\"\u003e\u003cstrong\u003eCủa Bộ Tài chính số 105/2003/TT-BTC ngày 4 tháng 11 năm 2003 hướng dẫn kế toán thực hiện sáu (06) chuẩn mực kế toán ban hành theo Quyết định số 165/2002/QĐ-BTC ngày 31/12/2002 của Bộ trưởng Bộ Tài chính\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eCăn cứ Quyết định số 165/2002/QĐ-BTC ngày 31/12/2002 của Bộ trưởng Bộ Tài chính về việc ban hành và công bố sáu (06) Chuẩn mực kế toán Việt Nam (đợt 2);\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eCăn cứ Chế độ kế toán doanh nghiệp ban hành theo Quyết định số\u0026nbsp; 1141TC/QĐ/CĐKT ngày 1/11/1995 và các Thông tư hướng dẫn sửa đổi, bổ sung Chế độ kế toán doanh nghiệp của Bộ Tài chính;\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eBộ Tài chính hướng dẫn kế toán thực hiện sáu (06) Chuẩn mực kế toán trên áp dụng cho các doanh nghiệp thuộc các ngành, các thành phần kinh tế trong cả nước.\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eI. HƯỚNG DẪN KẾ TOÁN CHUẨN MỰC \"THUÊ TÀI SẢN\"\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eA. PHÂN LOẠI THUÊ TÀI SẢN\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e1.1. Phân loại thuê tài sản phải căn cứ vào bản chất các điều khoản trong hợp đồng và phải thực hiện ngay tại thời điểm khởi đầu thuê tài sản. Sau thời điểm khởi đầu thuê tài sản nếu có thay đổi các điều khoản của hợp đồng (trừ gia hạn hợp đồng) thì các điều khoản mới này được áp dụng cho suốt thời hạn hợp đồng. Nhưng thay đổi về ước tính (thay đổi ước tính thời gian sử dụng kinh tế hoặc giá trị còn lại của tài sản thuê) hoặc thay đổi khả năng thanh toán của bên thuê thì không làm thay đổi sự phân loại thuê tài sản đối với ghi sổ kế toán.\u003c/p\u003e\n\u003cp\u003e1.2. Phân loại thuê tài sản được căn cứ vào mức độ chuyển giao các rủi ro và lợi ích gắn liền với quyền sở hữu tài sản thuê từ bên cho thuê cho bên thuê. Thuê tài sản bao gồm thuê tài chính và thuê hoạt động.\u003c/p\u003e\n\u003cp\u003e1.2.1. Thuê tài chính:\u003c/p\u003e\n\u003cp\u003e- Thuê tài chính: Là thuê tài sản mà bên cho thuê có sự chuyển giao phần lớn rủi ro và lợi ích gắn liền với quyền sở hữu tài sản cho bên thuê. Quyền sở hữu tài sản có thể chuyển giao vào cuối thời hạn thuê.\u003c/p\u003e\n\u003cp\u003e- Các trường hợp thuê tài sản dưới đây thường dẫn đến hợp đồng thuê tài chính :\u003c/p\u003e\n\u003cp\u003ea) Bên cho thuê chuyển giao quyền sở hữu tài sản cho bên thuê khi hết thời hạn thuê.\u003c/p\u003e\n\u003cp\u003eb) Tại thời điểm khởi đầu thuê tài sản, bên thuê có quyền lựa chọn mua lại tài sản thuê với mức giá ước tính thấp hơn giá trị hợp lý vào cuối thời hạn thuê.\u003c/p\u003e\n\u003cp\u003ec) Thời hạn thuê tài sản tối thiểu phải chiếm phần lớn thời gian sử dụng kinh tế của tài sản cho dù không có sự chuyển giao quyền sở hữu.\u003c/p\u003e\n\u003cp\u003ed) Tại thời điểm khởi đầu thuê tài sản, giá trị hiện tại của khoản thanh toán tiền thuê tối thiểu chiếm phần lớn (tương đương) giá trị hợp lý của tài sản thuê.\u003c/p\u003e\n\u003cp\u003ee) Tài sản thuê thuộc loại chuyên dùng mà chỉ có bên thuê có khả năng sử dụng không cần có sự thay đổi, sửa chữa lớn nào.\u003c/p\u003e\n\u003cp\u003e- Hợp đồng thuê tài sản cũng được coi là hợp đồng thuê tài chính nếu hợp đồng thoả mãn ít nhất một trong ba (3) trường hợp sau:\u003c/p\u003e\n\u003cp\u003ea) Nếu bên thuê huỷ hợp đồng và đền bù tổn thất phát sinh liên quan đến việc huỷ hợp đồng cho bên cho thuê;\u003c/p\u003e\n\u003cp\u003eb) Thu nhập hoặc tổn thất do sự thay đổi giá trị hợp lý của giá trị còn lại của tài sản thuê gắn với bên thuê;\u003c/p\u003e\n\u003cp\u003ec) Bên thuê có khả năng tiếp tục thuê lại tài sản sau khi hết hạn hợp đồng thuê với tiền thuê thấp hơn giá thuê thị trường.\u003c/p\u003e\n\u003cp\u003e1.2.2. Thuê hoạt động:\u003c/p\u003e\n\u003cp\u003e- Thuê tài sản được phân loại là thuê hoạt động nếu nội dung của hợp đồng thuê tài sản không có sự chuyển giao phần lớn rủi ro và lợi ích gắn liền với quyền sở hữu tài sản.\u003c/p\u003e\n\u003cp\u003e- Thuê tài sản là quyền sử dụng đất thường được phân loại là thuê hoạt động vì quyền sử dụng đất thường có thời gian sử dụng kinh tế vô hạn và quyền sở hữu sẽ không chuyển giao cho bên thuê khi hết thời hạn thuê.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eB. HƯỚNG DẪN KẾ TOÁN THUÊ TÀI SẢN LÀ THUÊ TÀI CHÍNH\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1. Ghi nhận tài sản thuê tài chính đối với bên thuê\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e1.1. Tại thời điểm nhận tài sản thuê, bên thuê ghi nhận giá trị tài sản thuê tài chính và nợ gốc phải trả về thuê tài chính với cùng một giá trị bằng với giá trị hợp lý của tài sản thuê. Nếu giá trị hợp lý của tài sản thuê cao hơn giá trị hiện tại của khoản thanh toán tiền thuê tối thiểu thì ghi theo giá trị hiện tại của khoản thanh toán tiền thuê tối thiểu.\u003c/p\u003e\n\u003cp\u003eKhi tính giá trị hiện tại của khoản thanh toán tiền thuê tối thiểu cho việc thuê tài sản, doanh nghiệp có thể sử dụng tỷ lệ lãi suất ngầm định hoặc tỷ lệ lãi suất được ghi trong hợp đồng thuê hoặc tỷ lệ lãi suất biên đi vay của bên thuê.\u003c/p\u003e\n\u003cp\u003eTrường hợp trong hợp đồng thuê tài chính đã ghi rõ số nợ gốc phải trả bằng giá trị hợp lý tài sản thuê thì tài sản thuê và nợ phải trả về thuê tài chính được ghi theo cùng giá trị này.\u003c/p\u003e\n\u003cp\u003eGiá trị hợp lý hoặc giá trị hiện tại của khoản thanh toán tiền thuê tối thiểu ghi nhận giá trị TSCĐ thuê tài chính là giá chưa có thuế GTGT (Kể cả trường hợp TSCĐ thuê tài chính dùng vào hoạt động SXKD hàng hoá, dịch vụ thuộc đối tượng chịu thuế GTGT tính theo phương pháp khấu trừ thuế và trường hợp TSCĐ thuê tài chính dùng vào hoạt động SXKD hàng hoá, dịch vụ thuộc đối tượng không chịu thuế GTGT hoặc chịu thuế GTGT tính theo phương pháp trực tiếp).\u003c/p\u003e\n\u003cp\u003e1.2. Các chi phí trực tiếp phát sinh ban đầu liên quan đến hoạt động thuê tài chính được tính vào nguyên giá của tài sản thuê.\u003c/p\u003e\n\u003cp\u003e1.3. Khoản thanh toán\u0026nbsp; tiền thuê tài sản thuê tài chính phải được chia ra thành chi phí tài chính (số tiền lãi thuê tài chính) và khoản phải trả nợ gốc từng kỳ. Số tiền lãi thuê tài chính phải trả được hạch toán vào chi phí tài chính trong suốt thời hạn thuê. Số tiền lãi thuê tài chính ghi nhận vào chi phí tài chính từng kỳ được xác định bằng số dư nợ gốc còn lại nhân (x) với tỷ lệ lãi suất định kỳ cố định.\u003c/p\u003e\n\u003cp\u003eTrường hợp số thuế GTGT do bên cho thuê đã trả khi mua TSCĐ để cho thuê mà bên thuê phải hoàn lại thì số tiền lãi thuê tài chính phải trả bao gồm cả số lãi tính trên số thuế GTGT mà bên thuê chưa trả cho bên cho thuê.\u003c/p\u003e\n\u003cp\u003e1.4. Bên thuê có trách nhiệm tính, trích khấu hao tài sản cố định vào chi phí sản xuất, kinh doanh theo định kỳ trên cơ sở áp dụng chính sách khấu hao nhất quán với chính sách khấu hao của tài sản cùng loại thuộc sở hữu của doanh nghiệp đi thuê.\u003c/p\u003e\n\u003cp\u003eNếu không chắc chắn là bên thuê sẽ có quyền sở hữu tài sản thuê khi hết hạn hợp đồng thuê thì tài sản thuê sẽ được khấu hao theo thời hạn thuê nếu thời hạn thuê ngắn hơn thời gian sử dụng hữu ích của tài sản thuê.\u003c/p\u003e\n\u003cp\u003e1.5. Trường hợp lãi thuê tài chính đủ điều kiện được vốn hoá vào giá trị tài sản dở dang thì thực hiện theo quy định tại phần IV Thông tư này.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. Kế toán TSCĐ thuê tài chính\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.1. Tài khoản kế toán\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eKế toán TSCĐ thuê tài chính sử dụng TK 212 - Tài sản cố định thuê tài chính.\u003c/p\u003e\n\u003cp\u003eTài khoản này phản ánh giá trị hiện có và tình hình biến động của toàn bộ TSCĐ thuê tài chính của doanh nghiệp.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eHạch toán TK 212- TSCĐ thuê tài chính cần tôn trọng các quy định sau:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e1. Tài khoản này dùng cho doanh nghiệp thuê hạch toán nguyên giá của TSCĐ đi thuê tài chính. Đây là những TSCĐ chưa thuộc quyền sở hữu của doanh nghiệp nhưng doanh nghiệp có nghĩa vụ và trách nhiệm pháp lý quản lý và sử dụng như tài sản của doanh nghiệp.\u003c/p\u003e\n\u003cp\u003eNguyên giá của TSCĐ đi thuê tài chính không bao gồm số thuế GTGT bên cho thuê đã trả khi mua TSCĐ để cho thuê (Kể cả trường hợp TSCĐ thuê tài chính dùng vào hoạt động SXKD hàng hoá, dịch vụ thuộc đối tượng chịu thuế GTGT tính theo phương pháp khấu trừ thuế và trường hợp TSCĐ thuê tài chính dùng vào hoạt động SXKD hàng hoá, dịch vụ thuộc đối tượng không chịu thuế GTGT hoặc chịu thuế GTGT tính theo phương pháp trực tiếp).\u003c/p\u003e\n\u003cp\u003e2. Không phản ánh vào tài khoản này giá trị của các TSCĐ đi thuê hoạt động.\u003c/p\u003e\n\u003cp\u003e3. Tài khoản 212 được mở chi tiết để theo dõi từng loại, từng TSCĐ đi thuê.\u003c/p\u003e\n\u003cp\u003e4. Việc ghi nhận nguyên giá của TSCĐ thuê tài chính tại thời điểm khởi đầu thuê được thực hiện theo quy định của chuẩn mực kế toán số 06 \"Thuê tài sản\". Sau thời điểm đó, kế toán TSCĐ thuê tài chính trên TK 212 được thực hiện theo quy định của chuẩn mực kế toán số 03 \"TSCĐ hữu hình\".\u003c/p\u003e\n\u003cp\u003e5. Số thuế GTGT bên thuê phải trả cho bên cho thuê theo định kỳ nhận được hoá đơn thanh toán tiền thuê tài chính được hạch toán như sau:\u003c/p\u003e\n\u003cp\u003e- Trường hợp TSCĐ thuê tài chính dùng vào hoạt động SXKD hàng hoá, dịch vụ thuộc đối tượng chịu thuế GTGT tính theo phương pháp khấu trừ thuế thì số thuế GTGT phải trả từng kỳ được ghi vào bên Nợ TK 133- Thuế GTGT được khấu trừ (1332);\u003c/p\u003e\n\u003cp\u003e- Trường hợp TSCĐ thuê tài chính dùng vào hoạt\u0026nbsp; động SXKD hàng hoá, dịch vụ thuộc đối tượng không chịu thuế GTGT hoặc chịu thuế GTGT tính theo phương pháp trực tiếp thì số thuế GTGT phải trả từng kỳ được ghi vào chi phí SXKD trong kỳ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eKết cấu và nội dung phản ánh của Tài khoản 212 - TSCĐ thuê tài chính\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBên Nợ:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eNguyên giá của TSCĐ thuê tài chính tăng.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBên Có:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eNguyên giá của TSCĐ thuê tài chính giảm do chuyển trả lại cho bên cho thuê khi\u0026nbsp; hết hạn hợp đồng hoặc mua lại thành TSCĐ của doanh nghiệp.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSố dư bên Nợ:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eNguyên giá của TSCĐ thuê tài chính hiện có.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.2. Phương pháp kế toán các hoạt động kinh tế liên quan đến thuê tài sản là thuê tài chính\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ea. Khi phát sinh các chi phí trực tiếp ban đầu liên quan đến tài sản thuê tài chính trước khi nhận tài sản thuê như đàm phán, ký kết hợp đồng..., ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 142 - Chi phí trả trước\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112...\u003c/p\u003e\n\u003cp\u003eb. Khi chi tiền ứng trước khoản tiền thuê tài chính, ký quỹ đảm bảo việc thuê tài sản, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 342- Nợ dài hạn (Số tiền thuê trả trước - nếu có)\u003c/p\u003e\n\u003cp\u003eNợ TK 244- Ký quỹ, ký cược dài hạn\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112...\u0026nbsp;\u0026nbsp;\u003c/p\u003e\n\u003cp\u003ec. Trường hợp nợ gốc phải trả về thuê tài chính xác định theo giá mua chưa có thuế GTGT mà bên cho thuê đã trả khi mua TSCĐ để cho thuê.\u003c/p\u003e\n\u003cp\u003ec.1. Khi nhận TSCĐ thuê tài chính, kế toán căn cứ vào hợp đồng thuê tài sản và các chứng từ có liên quan phản ánh giá trị TSCĐ thuê tài chính theo giá chưa có thuế GTGT đầu vào, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 212- TSCĐ thuê tài chính (Giá chưa có thuế GTGT)\u003c/p\u003e\n\u003cp\u003eCó TK 342 - Nợ dài hạn (Giá trị hiện tại của khoản thanh toán tiền thuê tối thiểu hoặc giá trị hợp lý của tài sản thuê trừ (-) Số nợ gốc phải trả kỳ này)\u003c/p\u003e\n\u003cp\u003eCó TK 315- Nợ dài hạn đến hạn trả (Số nợ gốc phải trả kỳ này).\u003c/p\u003e\n\u003cp\u003ec.2. Chi phí trực tiếp ban đầu liên quan đến hoạt động thuê tài chính được ghi nhận vào nguyên giá TSCĐ thuê tài chính, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 212 - TSCĐ thuê tài chính\u003c/p\u003e\n\u003cp\u003eCó TK 142 - Chi phí trả trước, hoặc\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112 (Số chi phí trực tiếp liên quan đến hoạt động thuê phát sinh khi nhận tài sản thuê tài chính).\u003c/p\u003e\n\u003cp\u003ec.3. Cuối niên độ kế toán, căn cứ vào hợp đồng thuê tài sản xác định số nợ gốc thuê tài chính đến hạn trả trong niên độ kế toán tiếp theo, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 342- Nợ dài hạn\u003c/p\u003e\n\u003cp\u003eCó TK 315- Nợ dài hạn đến hạn trả.\u003c/p\u003e\n\u003cp\u003ec.4. Định kỳ, nhận được hoá đơn thanh toán tiền thuê tài chính:\u003c/p\u003e\n\u003cp\u003ec.4.1. Trường hợp TSCĐ thuê tài chính dùng vào hoạt động sản xuất kinh doanh hàng hoá, dịch vụ thuộc đối tượng chịu thuế GTGT tính theo phương pháp khấu trừ thuế:\u003c/p\u003e\n\u003cp\u003e- Khi xuất tiền trả nợ gốc, tiền lãi thuê và thuế GTGT cho đơn vị cho thuê, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 635- Chi phí tài chính (Tiền lãi thuê trả kỳ này)\u003c/p\u003e\n\u003cp\u003eNợ TK 315- Nợ dài hạn đến hạn trả (Nợ gốc trả kỳ này)\u003c/p\u003e\n\u003cp\u003eNợ TK 133- Thuế GTGT được khấu trừ (1332)\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112.\u003c/p\u003e\n\u003cp\u003e- Khi nhận được hoá đơn thanh toán tiền thuê tài sản nhưng doanh nghiệp chưa trả tiền ngay, căn cứ vào hoá đơn phản ánh số nợ phải trả lãi thuê tài chính và số thuế GTGT vào TK 315- Nợ dài hạn đến hạn trả, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 635- Chi phí tài chính (Tiền lãi thuê)\u003c/p\u003e\n\u003cp\u003eNợ TK 133- Thuế GTGT được khấu trừ (1332)\u003c/p\u003e\n\u003cp\u003eCó TK 315- Nợ dài hạn đến hạn trả.\u003c/p\u003e\n\u003cp\u003ec.4.2. Trường hợp TSCĐ thuê tài chính dùng vào hoạt động sản xuất, kinh doanh hàng hoá, dịch\u0026nbsp; vụ\u0026nbsp; thuộc\u0026nbsp; đối\u0026nbsp; tượng\u0026nbsp; không\u0026nbsp; chịu thuế GTGT hoặc chịu thuế GTGT tính theo phương pháp trực tiếp:\u003c/p\u003e\n\u003cp\u003e- Khi xuất tiền trả nợ gốc, tiền lãi thuê và thuế GTGT cho đơn vị cho thuê, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 635- Chi phí tài chính (Tiền lãi thuê trả kỳ này)\u003c/p\u003e\n\u003cp\u003eNợ TK 315- Nợ dài hạn đến hạn trả (Nợ gốc trả kỳ này)\u003c/p\u003e\n\u003cp\u003eNợ TK 623, TK 627, TK 641, TK 642 (Số thuế GTGT trả kỳ này)\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112.\u003c/p\u003e\n\u003cp\u003e- Khi nhận được hoá đơn thanh toán tiền thuê tài chính nhưng doanh nghiệp chưa trả tiền ngay, căn cứ vào hoá đơn phản ánh số nợ phải trả lãi thuê tài chính và số thuế GTGT phải trả vào TK 315- Nợ dài hạn đến hạn trả, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 635- Chi phí tài chính (Tiền lãi thuê)\u003c/p\u003e\n\u003cp\u003eNợ TK 623, TK 627,\u0026nbsp; TK 641, TK 642 (Số thuế GTGT)\u003c/p\u003e\n\u003cp\u003eCó TK 315- Nợ dài hạn đến hạn trả.\u003c/p\u003e\n\u003cp\u003ed. Trường hợp nợ gốc phải trả về thuê tài chính xác định theo giá mua có thuế GTGT mà bên cho thuê đã trả khi mua TSCĐ để cho thuê:\u003c/p\u003e\n\u003cp\u003ed.1. Khi nhận TSCĐ thuê tài chính bên đi thuê nhận nợ cả số thuế GTGT do bên cho thuê đã trả khi mua TSCĐ để cho thuê mà bên thuê phải hoàn lại cho bên cho thuê, kế toán căn cứ vào hợp đồng thuê tài chính và các chứng từ liên quan phản ánh giá trị TSCĐ thuê tài chính theo giá chưa có thuế GTGT phải hoàn lại cho bên cho thuê, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 212 - TSCĐ thuê tài chính (Giá chưa có thuế GTGT)\u003c/p\u003e\n\u003cp\u003eNợ TK 138 - Phải thu khác (Số thuế GTGT đầu vào của TSCĐ thuê tài chính)\u003c/p\u003e\n\u003cp\u003eCó TK 315 - Nợ dài hạn đến hạn trả (Số nợ phải trả kỳ này có cả thuế GTGT)\u003c/p\u003e\n\u003cp\u003eCó TK 342 - Nợ dài hạn (Giá trị hiện tại của khoản thanh toán tiền thuê tối thiểu hoặc giá trị hợp lý của tài sản thuê trừ (-) Số nợ phải trả kỳ này cộng (+) Số thuế GTGT bên thuê còn phải trả dần trong suốt thời hạn thuê).\u003c/p\u003e\n\u003cp\u003ed.2. Chi phí trực tiếp ban đầu được ghi nhận vào nguyên giá TSCĐ thuê tài chính, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 212 - TSCĐ thuê tài chính\u003c/p\u003e\n\u003cp\u003eCó TK 142 - Chi phí trả trước\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112 (Chi phí trực tiếp phát sinh liên quan đến hoạt động thuê tài chính khi nhận tài sản thuê tài chính).\u003c/p\u003e\n\u003cp\u003ed.3. Cuối niên độ kế toán, căn cứ vào hợp đồng thuê tài chính xác định số nợ gốc thuê tài chính đến hạn trả trong niên độ kế toán tiếp theo, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 342- Nợ dài hạn\u003c/p\u003e\n\u003cp\u003eCó TK 315- Nợ dài hạn đến hạn trả.\u003c/p\u003e\n\u003cp\u003ed.4. Định kỳ, nhận được hoá đơn thanh toán tiền thuê tài chính:\u003c/p\u003e\n\u003cp\u003ed.4.1. Khi chi tiền trả nợ gốc và tiền lãi thuê tài sản cho đơn vị cho thuê, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 635 - Chi phí tài chính (Tiền lãi thuê trả kỳ này)\u003c/p\u003e\n\u003cp\u003eNợ TK 315 - Nợ dài hạn đến hạn trả (Nợ gốc phải trả kỳ này có cả thuế GTGT)\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112 ...\u003c/p\u003e\n\u003cp\u003ed.4.2. Căn cứ vào hoá đơn thanh toán tiền thuê phản ánh số thuế GTGT phải thanh toán cho bên cho thuê trong kỳ, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 133 - Thuế GTGT được khấu trừ (1332), hoặc\u003c/p\u003e\n\u003cp\u003eNợ các TK 627, 641, 642 (Thuế GTGT tính theo phương pháp trực tiếp hạch toán vào chi phí SXKD trong kỳ)\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eCó TK 138 - Phải thu khác.\u003c/p\u003e\n\u003cp\u003ed.4.3. Khi nhận được hoá đơn thanh toán tiền thuê tài chính nhưng doanh nghiệp chưa trả tiền ngay, căn cứ vào hoá đơn phản ánh số lãi thuê tài chính phải trả kỳ này vào TK 315- Nợ dài hạn đến hạn trả, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 635- Chi phí tài chính\u003c/p\u003e\n\u003cp\u003eCó TK 315- Nợ dài hạn đến hạn trả (Tiền lãi thuê phải trả kỳ này).\u003c/p\u003e\n\u003cp\u003e- Căn cứ hoá đơn thanh toán tiền thuê phản ánh số thuế GTGT được khấu trừ hoặc tính vào chi phí trong kỳ giống như trường hợp chi tiền trả nợ khi nhận được hoá đơn (như bút toán d.4.2).\u003c/p\u003e\n\u003cp\u003eđ. Khi trả phí cam kết sử dụng vốn phải trả cho bên cho thuê tài sản, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 635 - Chi phí tài chính\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112...\u003c/p\u003e\n\u003cp\u003ee. Định kỳ, kế toán tính, trích khấu hao TSCĐ thuê tài chính vào chi phí sản xuất, kinh doanh hoặc vốn hoá vào giá trị tài sản dở dang, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 623, 627, 641, 642, 241 ...\u003c/p\u003e\n\u003cp\u003eCó TK 214 - Hao mòn TSCĐ thuê tài chính (2142).\u003c/p\u003e\n\u003cp\u003eĐồng thời ghi đơn bên Nợ TK 009- Nguồn vốn khấu hao TSCĐ.\u003c/p\u003e\n\u003cp\u003eg. Khi trả lại TSCĐ thuê tài chính theo quy định của hợp đồng thuê cho bên cho thuê, kế toán ghi giảm giá trị TSCĐ thuê tài chính, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 214 - Hao mòn TSCĐ (2142)\u003c/p\u003e\n\u003cp\u003eCó TK 212 - TSCĐ thuê tài chính.\u003c/p\u003e\n\u003cp\u003eh. Trường hợp trong hợp đồng thuê tài sản quy định bên đi thuê chỉ thuê hết một phần giá trị tài sản, sau đó mua lại thì khi nhận chuyển giao quyền sở hữu tài sản, kế toán ghi giảm TSCĐ thuê tài chính và ghi tăng TSCĐ hữu hình thuộc sở hữu của doanh nghiệp:\u003c/p\u003e\n\u003cp\u003e- Khi chuyển từ tài sản thuê tài chính sang tài sản thuộc sở hữu, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 211 - TSCĐ hữu hình\u003c/p\u003e\n\u003cp\u003eCó TK 212 - TSCĐ thuê tài chính.\u003c/p\u003e\n\u003cp\u003e- Số tiền trả khi mua lại TSCĐ thuê tài chính, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 211- TSCĐ hữu hình\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112.\u003c/p\u003e\n\u003cp\u003eĐồng thời chuyển giá trị hao mòn, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 2142 - Hao mòn\u0026nbsp; TSCĐ thuê tài chính\u003c/p\u003e\n\u003cp\u003eCó TK 2141 - Hao mòn TSCĐ hữu hình.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eC. HƯỚNG DẪN KẾ TOÁN THUÊ TÀI SẢN LÀ THUÊ HOẠT ĐỘNG\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1. Ghi nhận thuê tài sản là thuê hoạt động đối với doanh nghiệp thuê\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThuê tài sản là thuê hoạt động thì doanh nghiệp thuê không phản ánh giá trị tài sản đi thuê trên Bảng cân đối kế toán của doanh nghiệp, mà chỉ phản ánh chi phí tiền thuê hoạt động vào chi phí sản xuất, kinh doanh theo phương pháp đường thẳng cho suốt thời hạn thuê tài sản, không phụ thuộc vào phương thức thanh toán tiền thuê (Trả tiền thuê từng kỳ hay trả trước, trả sau).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. Kế toán TSCĐ thuê hoạt động\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e2.1. Khi xác định chi phí tiền thuê tài sản là thuê hoạt động phải trả trong kỳ, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 623, 627, 641, 642\u003c/p\u003e\n\u003cp\u003eNợ TK 133- Thuế GTGT được khấu trừ (1332)\u003c/p\u003e\n\u003cp\u003eCó TK 331 - Phải trả cho người bán, hoặc\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112,...\u003c/p\u003e\n\u003cp\u003e2.2. Trường hợp doanh nghiệp phải trả trước tiền thuê tài sản là thuê hoạt động cho nhiều kỳ.\u003c/p\u003e\n\u003cp\u003ea. Khi xuất tiền trả trước tiền thuê cho nhiều kỳ, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 623, 627, 641, 642 (Số trả cho kỳ này)\u003c/p\u003e\n\u003cp\u003eNợ TK 142 - Chi phí trả trước\u003c/p\u003e\n\u003cp\u003eNợ TK 242 - Chi phí trả trước dài hạn\u003c/p\u003e\n\u003cp\u003eNợ TK 133 - Thuế GTGT được khấu trừ (nếu có)\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112...\u003c/p\u003e\n\u003cp\u003eb. Định kỳ, phân bổ tiền thuê tài sản là thuê hoạt động đã trả trước vào chi phí sản xuất, kinh doanh, ghi:\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eNợ các TK 623, 627, 641, 642\u003c/p\u003e\n\u003cp\u003eCó TK 142 - Chi phí trả trước, hoặc\u003c/p\u003e\n\u003cp\u003eCó TK 242 - Chi phí trả trước dài hạn.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eD. HƯỚNG DẪN KẾ TOÁN CHO THUÊ TÀI SẢN\u003cbr\u003e\n   LÀ CHO THUÊ HOẠT ĐỘNG\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1. Ghi nhận TSCĐ cho thuê hoạt động \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e1.1. Cho thuê hoạt động là bên cho thuê không có sự chuyển giao phần lớn rủi ro và lợi ích gắn với quyền sở hữu tài sản cho thuê. Bên cho thuê vẫn ghi nhận tài sản cho thuê hoạt động trên Bảng cân đối kế toán theo cách phân loại tài sản của doanh nghiệp cho thuê.\u003c/p\u003e\n\u003cp\u003e1.2. Doanh thu cho thuê tài sản từ cho thuê hoạt động phải được ghi nhận theo phương pháp đường thẳng trong suốt thời hạn cho thuê mà không phụ thuộc vào phương thức thanh toán, trừ khi áp dụng phương pháp tính khác hợp lý hơn.\u003c/p\u003e\n\u003cp\u003e1.3. Chi phí cho thuê hoạt động trong kỳ bao gồm khoản khấu hao tài sản cho thuê hoạt động và số chi phí trực tiếp ban đầu được ghi nhận ngay hoặc phân bổ dần cho suốt thời hạn cho thuê phù hợp với việc ghi nhận doanh thu.\u003c/p\u003e\n\u003cp\u003e1.4. Khấu hao tài sản cố định cho thuê hoạt động theo quy định của Chuẩn mực kế toán TSCĐ hữu hình hoặc Chuẩn mực kế toán TSCĐ vô hình phù hợp với chính sách khấu hao của doanh nghiệp.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. Kế toán TSCĐ cho thuê hoạt động\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e2.1. Khi phát sinh các chi phí trực tiếp ban đầu liên quan đến cho thuê hoạt động, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 627- Chi phí sản xuất chung (Được ghi nhận ngay vào chi phí trong kỳ)\u003c/p\u003e\n\u003cp\u003eNợ TK 142- Chi phí trả trước, hoặc\u003c/p\u003e\n\u003cp\u003eNợ TK 242- Chi phí trả trước dài hạn\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112, 331,...\u003c/p\u003e\n\u003cp\u003e2.2. Đối với doanh nghiệp tính thuế GTGT phải nộp theo phương pháp khấu trừ thuế.\u003c/p\u003e\n\u003cp\u003ea. Trường hợp thu tiền cho thuê hoạt động theo định kỳ:\u003c/p\u003e\n\u003cp\u003e- Khi phát hành hoá đơn thanh toán tiền thuê tài sản, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 131- Phải thu của khách hàng\u003c/p\u003e\n\u003cp\u003eCó TK 511- Doanh thu bán hàng và cung cấp dịch vụ (Tiền cho thuê chưa có thuế GTGT)\u003c/p\u003e\n\u003cp\u003eCó TK 3331- Thuế GTGT phải nộp.\u003c/p\u003e\n\u003cp\u003e- Khi thu được tiền, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111, 112,...\u003c/p\u003e\n\u003cp\u003eCó TK 131- Phải thu của khách hàng.\u003c/p\u003e\n\u003cp\u003eb. Trường hợp thu trước tiền cho thuê hoạt động nhiều kỳ.\u003c/p\u003e\n\u003cp\u003e- Khi nhận tiền của khách hàng trả trước về hoạt động cho thuê tài sản cho nhiều kỳ, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111, 112,... (Tổng số tiền nhận trước)\u003c/p\u003e\n\u003cp\u003eCó TK 3387- Doanh thu chưa thực hiện (Theo giá chưa có thuế GTGT)\u003c/p\u003e\n\u003cp\u003eCó TK 3331- Thuế GTGT phải nộp.\u003c/p\u003e\n\u003cp\u003e- Định kỳ, tính và kết chuyển doanh thu của kỳ kế toán, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 3387 - Doanh thu chưa thực hiện\u003c/p\u003e\n\u003cp\u003eCó TK 511- Doanh thu bán hàng và cung cấp dịch vụ.\u003c/p\u003e\n\u003cp\u003e- Số tiền phải trả lại cho khách hàng vì hợp đồng cho thuê tài sản không được thực hiện tiếp hoặc thời gian thực hiện ngắn hơn thời gian đã thu tiền trước (nếu có), ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 3387- Doanh thu chưa thực hiện (Giá chưa có thuế GTGT)\u003c/p\u003e\n\u003cp\u003eNợ TK 3331- Thuế GTGT phải nộp (Số tiền trả lại cho người đi thuê về thuế GTGT của hoạt động cho thuê tài sản không được thực hiện)\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112 (Tổng số tiền trả lại).\u003c/p\u003e\n\u003cp\u003e2.3. Đối với đơn vị tính thuế GTGT phải nộp theo phương pháp trực tiếp.\u003c/p\u003e\n\u003cp\u003ea. Trường hợp thu tiền cho thuê hoạt động theo định kỳ.\u003c/p\u003e\n\u003cp\u003e- Khi phát hành hoá đơn dịch vụ cho thuê tài sản, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 131- Phải thu của khách hàng\u003c/p\u003e\n\u003cp\u003eCó TK 511- Doanh thu bán hàng và cung cấp dịch vụ (Tổng giá thanh toán).\u003c/p\u003e\n\u003cp\u003e- Khi thu được tiền, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111, 112,...\u003c/p\u003e\n\u003cp\u003eCó TK 131- Phải thu của khách hàng.\u003c/p\u003e\n\u003cp\u003eb. Trường hợp thu trước tiền cho thuê hoạt động nhiều kỳ.\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e- Khi nhận tiền của khách hàng trả trước về cho thuê hoạt động cho nhiều năm, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111, 112... (Tổng số tiền nhận trước)\u003c/p\u003e\n\u003cp\u003eCó TK 3387 - Doanh thu chưa thực hiện (Tổng số tiền nhận trước).\u003c/p\u003e\n\u003cp\u003e- Định kỳ, tính và kết chuyển doanh thu của kỳ kế toán, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 3387- Doanh thu chưa thực hiện\u003c/p\u003e\n\u003cp\u003eCó TK 511- Doanh thu bán hàng và cung cấp dịch vụ.\u003c/p\u003e\n\u003cp\u003e- Cuối kỳ kế toán, tính và phản ánh số thuế GTGT phải nộp theo phương pháp trực tiếp, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 511- Doanh thu bán hàng và cung cấp dịch vụ\u003c/p\u003e\n\u003cp\u003eCó TK 3331- Thuế GTGT phải nộp.\u003c/p\u003e\n\u003cp\u003e- Số tiền phải trả lại cho khách hàng vì hợp đồng cung cấp dịch vụ về cho thuê tài sản không được thực hiện, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 3387 - Doanh thu chưa thực hiện\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112,... (Tổng số tiền trả lại).\u003c/p\u003e\n\u003cp\u003e2.4. Định kỳ, tính, trích khấu hao TSCĐ cho thuê hoạt động vào chi phí SXKD, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 627- Chi phí sản xuất chung\u003c/p\u003e\n\u003cp\u003eCó TK 214- Hao mòn TSCĐ (Hao mòn TSCĐ cho thuê hoạt động).\u003c/p\u003e\n\u003cp\u003eĐồng thời, ghi đơn bên Nợ TK 009- Nguồn vốn khấu hao TSCĐ.\u003c/p\u003e\n\u003cp\u003e2.5. Định kỳ, phân bổ số chi phí trực tiếp ban đầu liên quan đến cho thuê hoạt động (nếu phân bổ dần) phù hợp với việc ghi nhận doanh thu cho thuê hoạt động, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 627 - Chi phí sản xuất chung\u003c/p\u003e\n\u003cp\u003eCó TK 142- Chi phí trả trước\u003c/p\u003e\n\u003cp\u003eCó TK 242- Chi phí trả trước dài hạn.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐ. KẾ TOÁN GIAO DỊCH BÁN VÀ THUÊ LẠI TSCĐ LÀ THUÊ TÀI CHÍNH\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1. Ghi nhận giao dịch bán và thuê lại tài sản là thuê tài chính\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eGiao dịch bán và thuê lại tài sản được thực hiện khi tài sản được bán và được thuê lại bởi chính người bán. Khoản chênh lệch giữa thu nhập bán tài sản với giá trị còn lại trên sổ kế toán không được ghi nhận ngay là một khoản lãi hoặc lỗ từ việc bán tài sản mà phải ghi nhận là thu nhập chưa thực hiện hoặc chi phí trả trước dài hạn và phân bổ cho suốt thời gian thuê tài sản. Trong giao dịch bán và thuê lại, nếu có chi phí phát sinh ngoài chi phí khấu hao thì được hạch toán vào chi phí sản xuất, kinh doanh trong kỳ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. Kế toán giao dịch bán và thuê lại tài sản là thuê tài chính\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e2.1. Trường hợp giao dịch bán và thuê lại với giá bán tài sản cao hơn giá trị còn lại của TSCĐ.\u003c/p\u003e\n\u003cp\u003ea. Khi hoàn tất thủ tục bán tài sản, căn cứ vào hoá đơn và các chứng từ liên quan, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111, 112, 131(Tổng giá thanh toán)\u003c/p\u003e\n\u003cp\u003eCó TK 711- Thu nhập khác (Theo giá trị còn lại của TSCĐ bán và thuê lại)\u003c/p\u003e\n\u003cp\u003eCó TK 3387 - Doanh thu chưa thực hiện (Chênh lệch giữa giá bán lớn hơn giá trị còn lại của TSCĐ)\u003c/p\u003e\n\u003cp\u003eCó TK 3331 - Thuế GTGT phải nộp.\u003c/p\u003e\n\u003cp\u003eĐồng thời, ghi giảm TSCĐ:\u003c/p\u003e\n\u003cp\u003eNợ TK 811 - Chi phí khác (Giá trị còn lại của TSCĐ bán và thuê lại)\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eNợ TK 214 - Hao mòn TSCĐ (Nếu có)\u003c/p\u003e\n\u003cp\u003eCó TK 211 - TSCĐ hữu hình (Nguyên giá TSCĐ).\u003c/p\u003e\n\u003cp\u003eb. Các bút toán ghi nhận tài sản thuê và nợ phải trả về thuê tài chính, trả tiền thuê từng kỳ thực hiện theo bút toán 2.2.c và 2.2.d - Phần B \"Kế toán thuê tài sản là thuê tài chính\".\u003c/p\u003e\n\u003cp\u003ec. Định kỳ, kế toán tính, trích khấu hao TSCĐ thuê tài chính vào chi phí sản xuất, kinh doanh, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 623, 627, 641, 642\u003c/p\u003e\n\u003cp\u003eCó TK 2142 - Hao mòn TSCĐ thuê tài chính.\u003c/p\u003e\n\u003cp\u003eĐồng thời, ghi đơn bên Nợ TK 009 - Nguồn vốn khấu hao TSCĐ- Tài khoản ngoài Bảng cân đối kế toán.\u003c/p\u003e\n\u003cp\u003ed. Định kỳ, kết chuyển chênh lệch lớn hơn (lãi) giữa giá bán và giá trị còn lại của tài sản cố định bán và thuê lại ghi giảm chi phí sản xuất, kinh doanh trong kỳ phù hợp thời gian thuê tài sản, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 3387 - Doanh thu chưa thực hiện\u003c/p\u003e\n\u003cp\u003eCó các TK 623, 627, 641, 642,...\u003c/p\u003e\n\u003cp\u003e2.2. Trường hợp giao dịch bán và thuê lại với giá thấp hơn giá trị còn lại của TSCĐ.\u003c/p\u003e\n\u003cp\u003ea. Khi hoàn tất thủ tục bán tài sản, căn cứ vào hoá đơn và các chứng từ liên quan, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111, 112, 131 (Tổng giá thanh toán)\u003c/p\u003e\n\u003cp\u003eCó TK 711 - Thu nhập khác (Giá bán TSCĐ)\u003c/p\u003e\n\u003cp\u003eCó TK 3331 - Thuế GTGT phải nộp (Nếu có).\u003c/p\u003e\n\u003cp\u003eĐồng thời, ghi giảm TSCĐ:\u003c/p\u003e\n\u003cp\u003eNợ TK 811 - Chi phí khác (Tính bằng giá bán TSCĐ)\u003c/p\u003e\n\u003cp\u003eNợ TK 242 - Chi phí trả trước dài hạn (Chênh lệch giá bán nhỏ hơn giá trị còn lại của TSCĐ)\u003c/p\u003e\n\u003cp\u003eNợ TK 214 - Hao mòn TSCĐ (Nếu có)\u003c/p\u003e\n\u003cp\u003eCó TK 211 - TSCĐ hữu hình (Nguyên giá TSCĐ).\u003c/p\u003e\n\u003cp\u003eb. Các bút toán ghi nhận tài sản, nợ phải trả về thuê tài chính, trả tiền thuê từng kỳ và tính, trích khấu hao TSCĐ thuê tài chính thực hiện theo bút toán 2.2.c, 2.2.d và 2.2.g - Phần B \"Kế toán thuê tài sản là thuê tài chính\".\u003c/p\u003e\n\u003cp\u003ec. Định kỳ, kết chuyển số chênh lệch nhỏ hơn (lỗ) giữa giá bán và giá trị còn lại của TSCĐ bán và thuê lại ghi tăng chi phí sản xuất, kinh doanh trong kỳ, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK\u0026nbsp; 623, 627, 641, 642,...\u003c/p\u003e\n\u003cp\u003eCó TK 242 - Chi phí trả trước dài hạn.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eE. KẾ TOÁN GIAO DỊCH BÁN VÀ THUÊ LẠI TSCĐ\u003cbr\u003e\n   LÀ THUÊ HOẠT ĐỘNG\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1. Ghi nhận giao dịch bán và thuê lại TSCĐ là thuê hoạt động\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e1.1. Nếu giá bán được thỏa thuận ở mức giá trị hợp lý thì các khoản lỗ hoặc lãi phải được ghi nhận ngay vào Báo cáo kết quả hoạt động kinh doanh trong kỳ phát sinh;\u003c/p\u003e\n\u003cp\u003e1.2. Nếu giá bán được thoả thuận thấp hơn giá trị hợp lý thì các khoản lãi hoặc lỗ cũng phải được ghi nhận ngay trong kỳ phát sinh, trừ trường hợp khoản lỗ được bù đắp bằng khoản tiền thuê trong tương lai ở một mức giá thuê thấp hơn giá thuê thị trường, thì khoản lỗ này không được ghi nhận ngay mà phải phân bổ dần phù hợp với khoản thanh toán tiền thuê trong suốt thời gian mà tài sản đó được dự kiến sử dụng;\u003c/p\u003e\n\u003cp\u003e1.3. Nếu giá bán cao hơn giá trị hợp lý thì khoản chênh lệch cao hơn giá trị hợp lý không được ghi nhận ngay là một khoản lãi trong kỳ mà phải được phân bổ dần trong suốt thời gian mà tài sản đó được dự kiến sử dụng;\u003c/p\u003e\n\u003cp\u003e1.4. Đối với thuê hoạt động, nếu giá trị hợp lý tại thời điểm bán và thuê lại tài sản thấp hơn giá trị còn lại của tài sản, khoản lỗ bằng số chênh lệch giữa giá trị còn lại và giá trị hợp lý phải được ghi nhận ngay trong kỳ phát sinh.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. Bổ sung nội dung phản ánh của Tài khoản 242 \"Chi phí trả trước dài hạn\"\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eBổ sung thêm nội dung bên Nợ TK 242:\u003c/p\u003e\n\u003cp\u003e- Số chênh lệch giá bán nhỏ hơn giá trị còn lại của TSCĐ bán và thuê lại là thuê hoạt động.\u003c/p\u003e\n\u003cp\u003eBổ sung thêm nội dung bên Có TK 242:\u003c/p\u003e\n\u003cp\u003e- Phân bổ số chênh lệch giá bán nhỏ hơn giá trị còn lại của TSCĐ bán và thuê lại vào chi phí sản xuất, kinh doanh trong suốt thời hạn thuê lại tài sản.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3. Kế toán giao dịch bán và thuê lại TSCĐ là thuê hoạt động\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e3.1. Khi bán TSCĐ và thuê lại, căn cứ vào hóa đơn GTGT và các chứng từ liên quan đến việc bán TSCĐ, kế toán phản ánh giao dịch bán theo các trường hợp sau:\u003c/p\u003e\n\u003cp\u003ea. Nếu giá bán được thỏa thuận ở mức giá trị hợp lý thì các khoản lỗ hay lãi phải được ghi nhận ngay trong kỳ phát sinh, căn cứ vào hoá đơn chứng từ:\u003c/p\u003e\n\u003cp\u003e- Phản ánh số thu nhập bán TSCĐ, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111, 112, 131,...\u003c/p\u003e\n\u003cp\u003eCó TK 711 - Thu nhập khác (Giá bán TSCĐ)\u003c/p\u003e\n\u003cp\u003eCó TK 3331 - Thuế GTGT phải nộp (Nếu có).\u003c/p\u003e\n\u003cp\u003eĐồng thời, ghi giảm TSCĐ:\u003c/p\u003e\n\u003cp\u003eNợ TK 811 - Chi phí khác (Giá trị còn lại của TSCĐ bán và thuê lại)\u003c/p\u003e\n\u003cp\u003eNợ TK 214 - Hao mòn TSCĐ (Số đã hao mòn - Nếu có)\u003c/p\u003e\n\u003cp\u003eCó TK 211- TSCĐ hữu hình (Nguyên giá TSCĐ).\u003c/p\u003e\n\u003cp\u003eb. Nếu giá bán được thoả thuận ở mức thấp hơn giá trị hợp lý thì các khoản lãi hoặc lỗ cũng phải được ghi nhận ngay, kế toán ghi sổ các bút toán như ở điểm 3.1(a).\u003c/p\u003e\n\u003cp\u003eTrường hợp giá bán và thuê lại TSCĐ thấp hơn giá trị hợp lý nhưng mức giá thuê thấp hơn giá thuê thị trường thì khoản lỗ này không được ghi nhận ngay mà phải phân bổ dần phù hợp với khoản thanh toán tiền thuê trong thời gian thuê tài sản, ghi:\u003c/p\u003e\n\u003cp\u003e- Căn cứ vào hoá đơn GTGT và các chứng từ liên quan đến việc bán TSCĐ, phản ánh thu nhập bán TSCĐ, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111, 112,...\u003c/p\u003e\n\u003cp\u003eCó TK 711 - Thu nhập khác (Giá bán TSCĐ)\u003c/p\u003e\n\u003cp\u003eCó TK 3331 - Thuế GTGT phải nộp.\u003c/p\u003e\n\u003cp\u003eĐồng thời, ghi giảm TSCĐ:\u003c/p\u003e\n\u003cp\u003eNợ TK 811 - Chi phí khác (Tính bằng giá bán của TSCĐ)\u003c/p\u003e\n\u003cp\u003eNợ TK 242 - Chi phí trả trước dài hạn (Chênh lệch giá trị còn lại của TSCĐ lớn hơn giá bán)\u003c/p\u003e\n\u003cp\u003eNợ TK 214 - Hao mòn TSCĐ\u003c/p\u003e\n\u003cp\u003eCó TK 211 - TSCĐ hữu hình.\u003c/p\u003e\n\u003cp\u003e- Trong các kỳ tiếp theo phân bổ số lỗ về giao dịch bán và thuê lại tài sản là thuê hoạt động vào chi phí sản xuất, kinh doanh trong kỳ phù hợp với khoản thanh toán tiền thuê trong suốt thời gian mà tài sản đó dự kiến sử dụng, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 623, 627, 641, 642\u003c/p\u003e\n\u003cp\u003eCó TK 242 - Chi phí trả trước dài hạn.\u003c/p\u003e\n\u003cp\u003ec. Nếu giá bán và thuê lại tài sản cao hơn giá trị hợp lý thì khoản chênh lệch cao hơn giá trị hợp lý không được ghi nhận ngay là một khoản lãi trong kỳ mà được phân bổ dần trong suốt thời gian mà tài sản đó được dự kiến sử dụng còn số chênh lệch giữa giá trị hợp lý và giá trị còn lại được ghi nhận ngay là một khoản lãi hay lỗ trong kỳ.\u003c/p\u003e\n\u003cp\u003ec.1. Căn cứ vào hoá đơn GTGT bán TSCĐ, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111, 112, 131\u003c/p\u003e\n\u003cp\u003eCó TK 711 - Thu nhập khác (Tính bằng giá trị hợp lý của TSCĐ)\u003c/p\u003e\n\u003cp\u003eCó TK 3387- Doanh thu chưa thực hiện (Chênh lệch giá bán cao hơn giá trị hợp lý của TSCĐ)\u003c/p\u003e\n\u003cp\u003eCó TK 3331 - Thuế GTGT phải nộp (Nếu có).\u003c/p\u003e\n\u003cp\u003eĐồng thời, ghi giảm giá trị TSCĐ bán và thuê lại:\u003c/p\u003e\n\u003cp\u003eNợ TK 811 - Chi phí khác (Giá trị còn lại của TSCĐ bán và thuê lại)\u003c/p\u003e\n\u003cp\u003eNợ TK 214 - Hao mòn TSCĐ (Nếu có)\u003c/p\u003e\n\u003cp\u003eCó TK 211 - TSCĐ hữu hình.\u003c/p\u003e\n\u003cp\u003ec.2. Định kỳ, phân bổ số lãi về giao dịch bán và thuê lại tài sản là thuê hoạt động ghi giảm chi phí sản xuất, kinh doanh trong kỳ phù hợp với khoản thanh toán tiền thuê trong suốt thời gian mà tài sản đó dự kiến sử dụng, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 3387 - Doanh thu chưa thực hiện\u003c/p\u003e\n\u003cp\u003eCó các TK\u0026nbsp; 623, 627, 641, 642.\u003c/p\u003e\n\u003cp\u003e3.2. Định kỳ, xác định tiền thuê TSCĐ phải trả, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 623, 627, 641, 642\u003c/p\u003e\n\u003cp\u003eNợ TK 133 - Thuế GTGT được khấu trừ (nếu có)\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112, 331.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eII. HƯỚNG DẪN KẾ TOÁN CHUẨN MỰC \"ẢNH HƯỞNG\u003cbr\u003e\n   CỦA VIỆC THAY ĐỔI TỶ GIÁ HỐI ĐOÁI\"\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1. Chênh lệch tỷ giá hối đoái\u0026nbsp; \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eTrường hợp doanh nghiệp phát sinh các đơn vị tiền tệ khác với đơn vị tiền tệ chính thức sử dụng trong kế toán và lập báo cáo tài chính, thì khi quy đổi từ đơn vị tiền tệ khác sang đơn vị tiền tệ sử dụng trong kế toán sẽ phát sinh chênh lệch tỷ giá hối đoái.\u003c/p\u003e\n\u003cp\u003eChênh lệch tỷ giá hối đoái là chênh lệch từ việc trao đổi thực tế hoặc quy đổi cùng một số lượng tiền tệ khác sang đơn vị tiền tệ kế toán theo tỷ giá hối đoái khác nhau.\u003c/p\u003e\n\u003cp\u003eChênh lệch tỷ giá hối đoái chủ yếu phát sinh trong các trường hợp:\u003c/p\u003e\n\u003cp\u003ea) Thực tế mua bán, trao đổi, thanh toán các nghiệp vụ bằng ngoại tệ trong kỳ (chênh lệch tỷ giá hối đoái đã thực hiện): Là khoản chênh lệch từ việc trao đổi thực tế hoặc quy đổi cùng một số lượng đơn vị tiền tệ khác sang đơn vị tiền tệ kế toán theo tỷ giá hối đoái khác nhau. Chênh lệch tỷ giá hối đoái này thường phát sinh trong các giao dịch mua, bán hàng hoá, dịch vụ; hoặc thanh toán nợ phải trả, hay ứng trước để mua hàng; hoặc vay, hay cho vay,... bằng đơn vị tiền tệ khác với đơn vị tiền tệ kế toán. Trong các trường hợp nêu trên, tỷ giá hối đoái giữa đơn vị tiền tệ khác với đơn vị tiền tệ kế toán sẽ được ghi theo tỷ giá hối đoái ngày giao dịch (tỷ giá hối đoái giao dịch thực tế, tỷ giá giao dịch bình quân trên thị trường ngoại tệ liên ngân hàng do Ngân hàng Nhà nước Việt Nam công bố tại thời điểm phát sinh giao dịch).\u003c/p\u003e\n\u003cp\u003eChênh lệch tỷ giá hối đoái thực tế phát sinh trong kỳ (chênh lệch tỷ giá hối đoái đã thực hiện) ở doanh nghiệp bao gồm:\u003c/p\u003e\n\u003cp\u003e* Chênh lệch tỷ giá hối đoái thực tế phát sinh trong kỳ của hoạt động đầu tư xây dựng để hình thành tài sản cố định (giai đoạn trước hoạt động);\u003c/p\u003e\n\u003cp\u003e* Chênh lệch tỷ giá hối đoái thực tế phát sinh trong kỳ của hoạt động kinh doanh, kể cả của hoạt động đầu tư XDCB của doanh nghiệp vừa kinh doanh vừa có hoạt động đầu tư xây dựng.\u003c/p\u003e\n\u003cp\u003eb) Đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ tại ngày lập bảng CĐKT ở thời điểm cuối năm tài chính:\u003c/p\u003e\n\u003cp\u003eỞ thời điểm kết thúc năm tài chính về nguyên tắc các khoản mục tiền tệ (Số dư của các Tài khoản tiền mặt, Tiền gửi Ngân hàng, nợ phải thu, nợ phải trả được phản ánh đồng thời theo đơn vị tiền tệ kế toán và theo đơn vị tiền tệ khác với đơn vị tiền tệ kế toán) phải được báo cáo bằng tỷ giá cuối năm tài chính. Vì vậy, ở thời điểm này doanh nghiệp phải đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ theo tỷ giá hối đoái giao dịch bình quân trên thị trường ngoại tệ liên ngân hàng do Ngân hàng Nhà nước Việt Nam công bố tại thời điểm cuối năm tài chính.\u003c/p\u003e\n\u003cp\u003eChênh lệch tỷ giá hối đoái do đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ tại ngày lập bảng CĐKT ở thời điểm cuối năm tài chính, gồm:\u003c/p\u003e\n\u003cp\u003e* Chênh lệch tỷ giá hối đoái tại ngày lập Bảng CĐKT ở thời điểm cuối năm tài chính do đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ liên quan đến giai đoạn đầu tư xây dựng (giai đoạn trước hoạt động);\u003c/p\u003e\n\u003cp\u003e* Chênh lệch tỷ giá hối đoái tại ngày lập Bảng CĐKT ở thời điểm cuối năm tài chính do đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ liên quan đến hoạt động sản xuất, kinh doanh.\u003c/p\u003e\n\u003cp\u003ec) Đối với các doanh nghiệp sử dụng công cụ tài chính để dự phòng rủi ro hối đoái thì các khoản vay, nợ phải trả có gốc ngoại tệ được hạch toán theo tỷ giá hối đoái thực tế phát sinh. Doanh nghiệp không được đánh giá lại các khoản vay, nợ phải trả có gốc ngoại tệ đã sử dụng công cụ tài chính để dự phòng rủi ro hối đoái.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. Nguyên tắc ghi nhận các nghiệp vụ kinh tế phát sinh bằng ngoại tệ và đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ tại ngày lập Bảng CĐKT ở thời điểm cuối năm tài chính\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e2.1. Các doanh nghiệp sản xuất, kinh doanh có các nghiệp vụ kinh tế phát sinh bằng ngoại tệ phải thực hiện ghi sổ kế toán và lập báo cáo tài chính theo một đơn vị tiền tệ thống nhất là Đồng Việt Nam, hoặc đơn vị tiền tệ chính thức sử dụng trong kế toán (nếu được chấp thuận). Việc quy đổi đồng ngoại tệ ra Đồng Việt Nam, hoặc ra đơn vị tiền tệ chính thức sử dụng trong kế toán về nguyên tắc doanh nghiệp phải căn cứ vào tỷ giá giao dịch thực tế của nghiệp vụ kinh tế phát sinh hoặc tỷ giá giao dịch bình quân trên thị trường ngoại tệ liên ngân hàng do Ngân hàng Nhà nước Việt Nam công bố tại thời điểm phát sinh nghiệp vụ kinh tế (sau đây gọi tắt là tỷ giá giao dịch) để ghi sổ kế toán.\u003c/p\u003e\n\u003cp\u003eDoanh nghiệp đồng thời phải theo dõi nguyên tệ trên sổ kế toán chi tiết các Tài khoản: Tiền mặt, Tiền gửi Ngân hàng, Tiền đang chuyển, các khoản phải thu, các khoản phải trả và Tài khoản 007 “Ngoại tệ các loại” (Tài khoản ngoài Bảng Cân đối kế toán).\u003c/p\u003e\n\u003cp\u003e2.2. Đối với Tài khoản thuộc loại doanh thu, hàng tồn kho, TSCĐ, chi phí sản xuất, kinh doanh, chi phí khác, bên Nợ các Tài khoản vốn bằng tiền,... khi phát sinh các nghiệp vụ kinh tế bằng ngoại tệ phải được ghi sổ kế toán bằng Đồng Việt Nam, hoặc bằng đơn vị tiền tệ chính thức sử dụng trong kế toán theo tỷ giá giao dịch thực tế hoặc tỷ giá giao dịch bình quân liên ngân hàng tại thời điểm nghiệp vụ kinh tế phát sinh.\u003c/p\u003e\n\u003cp\u003e2.3. Đối với bên Có của các Tài khoản vốn bằng tiền, khi phát sinh các nghiệp vụ kinh tế bằng ngoại tệ phải được ghi sổ kế toán bằng Đồng Việt Nam, hoặc bằng đơn vị tiền tệ chính thức sử dụng trong kế toán theo tỷ giá ghi trên sổ kế toán (tỷ giá bình quân gia quyền; tỷ giá nhập trước, xuất trước...).\u003c/p\u003e\n\u003cp\u003e2.4. Đối với bên Có của các Tài khoản nợ phải trả, hoặc bên Nợ của các Tài khoản nợ phải thu, khi phát sinh các nghiệp vụ kinh tế bằng ngoại tệ phải được ghi sổ kế toán bằng Đồng Việt Nam, hoặc bằng đơn vị tiền tệ chính thức sử dụng trong kế toán theo tỷ giá giao dịch; Cuối năm tài chính các số dư Nợ phải trả hoặc dư Nợ phải thu có gốc ngoại tệ được đánh giá lại theo tỷ giá giao dịch bình quân trên thị trường ngoại tệ liên ngân hàng do Ngân hàng Nhà nước Việt Nam công bố tại thời điểm cuối năm tài chính.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e2.5. Đối với bên Nợ của các Tài khoản nợ phải trả, hoặc bên Có của các Tài khoản nợ phải thu, khi phát sinh các nghiệp vụ kinh tế bằng ngoại tệ phải được ghi sổ kế toán bằng Đồng Việt Nam, hoặc bằng đơn vị tiền tệ chính thức sử dụng trong kế toán theo tỷ giá ghi trên sổ kế toán.\u003c/p\u003e\n\u003cp\u003e2.6. Cuối năm tài chính, doanh nghiệp phải đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ theo tỷ giá giao dịch bình quân trên thị trường ngoại tệ liên ngân hàng do Ngân hàng Nhà nước Việt Nam công bố tại thời điểm lập Bảng CĐKT cuối năm tài chính.\u003c/p\u003e\n\u003cp\u003e2.7. Trường hợp mua, bán ngoại tệ bằng Đồng Việt Nam thì hạch toán theo tỷ giá thực tế mua, bán.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3. Nguyên tắc xử lý chênh lệch tỷ giá hối đoái \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e3.1. Xử lý chênh lệch tỷ giá hối đoái phát sinh trong kỳ và chênh lệch đánh giá lại cuối kỳ liên quan đến hoạt động sản xuất, kinh doanh:\u003c/p\u003e\n\u003cp\u003e- Toàn bộ chênh lệch tỷ giá hối đoái phát sinh trong kỳ và chênh lệch tỷ giá hối đoái đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ cuối năm tài chính hoặc ngày kết thúc năm tài chính khác với năm dương lịch (đã được chấp thuận) của các khoản mục tiền tệ có gốc ngoại tệ được ghi nhận ngay vào chi phí tài chính, hoặc doanh thu hoạt động tài chính trên Báo cáo kết quả hoạt động kinh doanh của năm tài chính.\u003c/p\u003e\n\u003cp\u003e- Đối với doanh nghiệp vừa có hoạt động kinh doanh, vừa có hoạt động đầu tư XDCB, nếu phát sinh chênh lệch tỷ giá hối đoái trong kỳ và chênh lệch đánh giá lại cuối kỳ liên quan đến hoạt động đầu tư XDCB thì cũng xử lý các chênh lệch tỷ giá hối đoái này vào chi phí tài chính, hoặc doanh thu hoạt động tài chính trên Báo cáo kết quả hoạt động kinh doanh của năm tài chính.\u003c/p\u003e\n\u003cp\u003e- Doanh nghiệp không được chia lợi nhuận hoặc trả cổ tức trên lãi chênh lệch tỷ giá hối đoái đánh giá lại cuối năm tài chính của các khoản mục tiền tệ có gốc ngoại tệ.\u003c/p\u003e\n\u003cp\u003e3.2. Xử lý chênh lệch tỷ giá hối đoái phát sinh trong kỳ và chênh lệch do đánh giá lại cuối kỳ liên quan đến hoạt động đầu tư xây dựng (giai đoạn trước hoạt động) như sau:\u003c/p\u003e\n\u003cp\u003e- Trong giai đoạn đầu tư xây dựng, khoản chênh lệch tỷ giá hối đoái đã thực hiện và chênh lệch tỷ giá đánh giá lại cuối năm tài chính của các khoản mục tiền tệ có gốc ngoại tệ phản ánh luỹ kế trên Bảng cân đối kế toán (Chỉ tiêu Chênh lệch tỷ giá hối đoái).\u003c/p\u003e\n\u003cp\u003e- Khi kết thúc quá trình đầu tư xây dựng, chênh lệch tỷ giá hối đoái thực tế phát sinh trong giai đoạn đầu tư xây dựng (lỗ hoặc lãi tỷ giá hối đoái) không tính vào trị giá TSCĐ mà kết chuyển toàn bộ vào chi phí tài chính, hoặc doanh thu hoạt động tài chính của năm tài chính có TSCĐ và các tài sản đầu tư hoàn thành đưa vào hoạt động hoặc phân bổ tối đa là 5 năm (kể từ khi công trình đưa vào hoạt động).\u003c/p\u003e\n\u003cp\u003e- Chênh lệch tỷ giá hối đoái đánh giá lại của các khoản mục tiền tệ có gốc ngoại tệ cuối năm tài chính và ở thời điểm quyết toán, bàn giao đưa TSCĐ vào sử dụng (lỗ hoặc lãi tỷ giá hối đoái) không tính vào trị giá TSCĐ hoàn thành đầu tư mà phân bổ vào chi phí tài chính, hoặc doanh thu hoạt động tài chính của các kỳ kinh doanh tiếp theo với thời gian tối đa là 5 năm (kể từ khi công trình đưa vào hoạt động).\u003c/p\u003e\n\u003cp\u003e3.3. Xử lý chênh lệch tỷ giá hối đoái phát sinh từ chuyển đổi báo cáo tài chính của hoạt động ở nước ngoài\u003c/p\u003e\n\u003cp\u003e- Chênh lệch tỷ giá hối đoái phát sinh từ chuyển đổi báo cáo tài chính của hoạt động ở nước ngoài không thể tách rời với hoạt động của doanh nghiệp báo cáo được tính ngay vào chi phí tài chính hoặc doanh thu hoạt động tài chính trong kỳ như quy định tại điểm 3.1 phần II Thông tư này.\u003c/p\u003e\n\u003cp\u003e- Chênh lệch tỷ giá hối đoái phát sinh từ chuyển đổi báo cáo tài chính của cơ sở nước ngoài hoạt động độc lập được phản ánh luỹ kế trên Tài khoản 413 - Chênh lệch tỷ giá hối đoái và chỉ được tính vào chi phí tài chính, hoặc doanh thu hoạt động tài chính khi doanh nghiệp thanh lý khoản đầu tư thuần đó ở cơ sở nước ngoài.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4. Kế toán chênh lệch tỷ giá hối đoái \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4.1. Tài khoản 413 \"Chênh lệch tỷ giá hối đoái\"\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eTài khoản này dùng để phản ánh số chênh lệch tỷ giá hối đoái phát sinh trong hoạt động đầu tư XDCB (giai đoạn trước hoạt động); chênh lệch tỷ giá hối đoái do đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ cuối năm tài chính; khoản chênh lệch tỷ giá hối đoái khi chuyển đổi báo cáo tài chính của cơ sở ở nước ngoài và tình hình xử lý số chênh lệch tỷ giá hối đoái đó.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eHạch toán Tài khoản 413 - Chênh lệch tỷ giá hối đoái cần tôn trọng một số quy định sau:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e1. Doanh nghiệp chỉ phản ánh các khoản chênh lệch tỷ giá hối đoái vào TK 413 - Chênh lệch tỷ giá hối đoái, trong các trường hợp:\u003c/p\u003e\n\u003cp\u003e- Chênh lệch tỷ giá hối đoái đã thực hiện và chênh lệch tỷ giá hối đoái do đánh giá lại của các khoản mục tiền tệ có gốc ngoại tệ cuối năm tài chính của hoạt động đầu tư XDCB trong giai đoạn trước hoạt động của doanh nghiệp mới thành lập (Khi chưa hoàn thành đầu tư);\u003c/p\u003e\n\u003cp\u003e- Khoản chênh lệch tỷ giá hối đoái do đánh giá lại của các khoản mục tiền tệ có gốc ngoại tệ cuối năm tài chính của hoạt động kinh doanh, kể cả hoạt động đầu tư XDCB (doanh nghiệp kinh doanh vừa có hoạt động đầu tư XDCB);\u003c/p\u003e\n\u003cp\u003e- Khoản chênh lệch tỷ giá hối đoái khi chuyển đổi báo cáo tài chính của cơ sở ở nước ngoài hoạt động độc lập.\u003c/p\u003e\n\u003cp\u003e2. Cuối năm tài chính, kế toán đánh giá lại số dư các Tài khoản “Tiền mặt”, “Tiền gửi Ngân hàng”, “Tiền đang chuyển”, các khoản tương đương tiền, các khoản phải thu, các khoản phải trả có gốc ngoại tệ theo tỷ giá giao dịch bình quân trên thị trường ngoại tệ liên ngân hàng do Ngân hàng Nhà nước Việt Nam công bố tại thời điểm lập bảng CĐKT cuối năm tài chính. Khoản chênh lệch tỷ giá do đánh giá lại số dư ngoại tệ của các khoản mục tiền tệ có gốc ngoại tệ được hạch toán vào Tài khoản 413 “Chênh lệch tỷ giá hối đoái”; sau khi bù trừ giữa chênh lệch tỷ giá hối đoái tăng, hoặc giảm do đánh giá lại phải kết chuyển ngay vào chi phí tài chính hoặc doanh thu hoạt động tài chính.\u003c/p\u003e\n\u003cp\u003e3. Khoản chênh lệch tỷ giá hối đoái đã thực hiện và chênh lệch tỷ giá hối đoái đánh giá lại cuối năm tài chính đối với các khoản mục tiền tệ có gốc ngoại tệ của hoạt động đầu tư XDCB (giai đoạn trước hoạt động) được phản ánh luỹ kế trên Bảng cân đối kế toán {khoản mục Chênh lệch tỷ giá (TK 413)}.\u003c/p\u003e\n\u003cp\u003eKhi kết thúc quá trình đầu tư xây dựng, khoản chênh lệch hối đoái này được tính ngay, hoặc phân bổ tối đa là 5 năm vào doanh thu hoạt động tài chính, hoặc chi phí tài chính kể từ khi công trình hoàn thành đưa vào hoạt động.\u003c/p\u003e\n\u003cp\u003e4. Khoản chênh lệch tỷ giá hối đoái khi chuyển đổi báo cáo tài chính của cơ sở ở nước ngoài phải tuân thủ quy định tại Đoạn 24, Chuẩn mực số 10- ảnh hưởng của việc thay đổi tỷ giá hối đoái và được hạch toán trên TK 413 - \"Chênh lệch tỷ giá hối đoái\" và được ghi nhận vào Báo cáo kết quả hoạt động kinh doanh theo quy định của Đoạn 30, Chuẩn mực số 10 \"ảnh hưởng của việc thay đổi tỷ giá hối đoái\".\u003c/p\u003e\n\u003cp\u003e5. Đối với doanh nghiệp không chuyên kinh doanh mua, bán ngoại tệ, thì các nghiệp vụ kinh tế mua, bán ngoại tệ phát sinh được quy đổi ra Đồng Việt Nam theo tỷ giá mua, bán thực tế phát sinh. Chênh lệch giữa tỷ giá thực tế mua vào và tỷ giá thực tế bán ra của ngoại tệ được hạch toán vào Tài khoản 515 “Doanh thu hoạt động tài chính”, hoặc vào Tài khoản 635 “Chi phí tài chính”.\u003c/p\u003e\n\u003cp\u003e6. Đối với các Tổng\u0026nbsp; công\u0026nbsp; ty, khoản\u0026nbsp; chênh\u0026nbsp; lệch\u0026nbsp; tỷ\u0026nbsp; giá\u0026nbsp; hối\u0026nbsp; đoái phản\u0026nbsp; ánh trên\u003c/p\u003e\n\u003cp\u003eBảng CĐKT hợp nhất chỉ phản ánh khoản chênh lệch tỷ giá khi chuyển đổi báo cáo tài chính của cơ sở nước ngoài để hợp nhất báo cáo tài chính và khoản chênh lệch tỷ giá của hoạt động đầu tư XDCB chưa hoàn thành (giai đoạn trước hoạt động) của các đơn vị thành viên.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eKết cấu và nội dung phản ánh của Tài khoản 413 - Chênh lệch tỷ giá hối đoái\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBên Nợ:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e- Chênh lệch tỷ giá hối đoái do đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ (lỗ tỷ giá) cuối năm tài chính của hoạt động kinh doanh, kể cả hoạt động đầu tư XDCB (doanh nghiệp sản xuất, kinh doanh có cả hoạt động đầu tư XDCB);\u003c/p\u003e\n\u003cp\u003e- Chênh lệch tỷ giá hối đoái phát sinh và đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ (lỗ tỷ giá) của hoạt động đầu tư XDCB (giai đoạn trước hoạt động);\u003c/p\u003e\n\u003cp\u003e- Chênh lệch tỷ giá hối đoái khi chuyển đổi báo cáo tài chính của cơ sở ở nước ngoài (lỗ tỷ giá);\u003c/p\u003e\n\u003cp\u003e- Kết chuyển chênh lệch tỷ giá hối đoái do đánh giá lại khoản mục tiền tệ có gốc ngoại tệ cuối năm tài chính (lãi tỷ giá) của hoạt động kinh doanh vào doanh thu hoạt động tài chính;\u003c/p\u003e\n\u003cp\u003e- Kết chuyển chênh lệch tỷ giá hối đoái phát sinh và đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ (lãi tỷ giá) của hoạt động đầu tư XDCB (khi kết thúc giai đoạn đầu tư XDCB) vào doanh thu hoạt động tài chính, hoặc phân bổ dần;\u003c/p\u003e\n\u003cp\u003e- Kết chuyển chênh lệch tỷ giá hối đoái khi chuyển đổi báo cáo tài chính của cơ sở ở nước ngoài (lãi tỷ giá) vào doanh thu hoạt động tài chính khi thanh lý khoản đầu tư thuần đó ở cơ sở nước ngoài.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBên Có:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e- Chênh lệch tỷ giá hối đoái do đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ (lãi tỷ giá) cuối năm tài chính của hoạt động kinh doanh, kể cả hoạt động đầu tư XDCB (doanh nghiệp sản xuất, kinh doanh có cả hoạt động đầu tư XDCB);\u003c/p\u003e\n\u003cp\u003e- Chênh lệch tỷ giá hối đoái phát sinh, hoặc đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ (lãi tỷ giá) của hoạt động đầu tư XDCB (giai đoạn trước hoạt động);\u003c/p\u003e\n\u003cp\u003e- Chênh lệch tỷ giá hối đoái khi chuyển đổi báo cáo tài chính của cơ sở ở nước ngoài (lãi tỷ giá);\u003c/p\u003e\n\u003cp\u003e- Kết chuyển chênh lệch tỷ giá hối đoái do đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ (lỗ tỷ giá) cuối năm tài chính của hoạt động kinh doanh vào chi phí tài chính;\u003c/p\u003e\n\u003cp\u003e- Kết chuyển chênh lệch tỷ giá hối đoái phát sinh, hoặc đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ (lỗ tỷ giá) của hoạt động đầu tư XDCB (khi hoàn thành đầu tư giai đoạn trước hoạt động) vào chi phí hoạt động tài chính hoặc phân bổ dần;\u003c/p\u003e\n\u003cp\u003e- Kết chuyển chênh lệch tỷ giá hối đoái khi chuyển đổi báo cáo tài chính của cơ sở ở nước ngoài (lỗ tỷ giá) vào chi phí tài chính khi thanh lý khoản đầu tư thuần đó ở cơ sở nước ngoài.\u003c/p\u003e\n\u003cp\u003eTài khoản 413 “Chênh lệch tỷ giá hối đoái” có thể có số dư bên Nợ hoặc số dư bên Có.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSố dư bên Nợ:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e- Số chênh lệch tỷ giá hối đoái phát sinh, hoặc đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ (lỗ tỷ giá) của hoạt động đầu tư XDCB (giai đoạn trước hoạt động, chưa hoàn thành đầu tư) ở thời điểm lập Bảng CĐKT cuối năm tài chính;\u003c/p\u003e\n\u003cp\u003e- Số chênh lệch tỷ giá hối đoái từ chuyển đổi báo cáo tài chính của cơ sở ở nước ngoài chưa xử lý ở thời điểm lập Bảng CĐKT cuối năm tài chính.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSố dư bên Có:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e- Số chênh lệch tỷ giá hối đoái phát sinh và đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ (lãi tỷ giá) của hoạt động đầu tư XDCB (giai đoạn trước hoạt động, chưa hoàn thành đầu tư) ở thời điểm lập Bảng CĐKT cuối năm tài chính;\u003c/p\u003e\n\u003cp\u003e- Số chênh lệch tỷ giá hối đoái từ chuyển đổi báo cáo tài chính của cơ sở ở nước ngoài chưa xử lý ở thời điểm lập Bảng CĐKT cuối năm tài chính.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTài khoản 413 - Chênh lệch tỷ giá hối đoái, có 3 Tài khoản cấp hai:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eTài khoản 4131 - Chênh lệch tỷ giá hối đoái đánh giá lại cuối năm tài chính: Phản ánh khoản chênh lệch tỷ giá hối đoái do đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ (lãi, lỗ tỷ giá) cuối năm tài chính của hoạt động kinh doanh, kể cả hoạt động đầu tư XDCB (doanh nghiệp kinh doanh có hoạt động đầu tư XDCB).\u003c/p\u003e\n\u003cp\u003eTài khoản 4132 - Chênh lệch tỷ giá hối đoái trong giai đoạn đầu tư XDCB: Phản ánh khoản chênh lệch tỷ giá hối đoái phát sinh, và chênh lệch tỷ giá do đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ (lãi, lỗ tỷ giá) của hoạt động đầu tư XDCB (giai đoạn trước hoạt động, chưa hoàn thành đầu tư).\u003c/p\u003e\n\u003cp\u003eTài khoản 4133 - Chênh lệch tỷ giá hối đoái từ chuyển đổi báo cáo tài chính: Phản ánh khoản chênh lệch tỷ giá hối đoái khi chuyển đổi báo cáo tài chính của cơ sở ở nước ngoài hoạt động độc lập.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4.2. Tài khoản 242 - Chi phí trả trước dài hạn\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eBổ sung nội dung phản ánh của Tài khoản 242 - Chi phí trả trước dài hạn:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBên Nợ:\u003c/strong\u003e Phản ánh số kết chuyển chênh lệch tỷ giá hối đoái phát sinh và chênh lệch tỷ giá do đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ (trường hợp lỗ tỷ giá) của hoạt động đầu tư XDCB (giai đoạn trước hoạt động) khi hoàn thành đầu tư.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBên Có:\u003c/strong\u003e Phản ánh số phân bổ chênh lệch tỷ giá hối đoái phát sinh và đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ (lỗ tỷ giá) của hoạt động đầu tư XDCB (giai đoạn trước hoạt động) khi hoàn thành đầu tư vào chi phí tài chính.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSố dư bên Nợ:\u003c/strong\u003e Phản ánh chênh lệch tỷ giá hối đoái phát sinh, hoặc đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ (lỗ tỷ giá) của hoạt động đầu tư XDCB (giai đoạn trước hoạt động) khi hoàn thành đầu tư chưa xử lý tại thời điểm lập Bảng CĐKT cuối năm tài chính.\u003c/p\u003e\n\u003cp\u003eDoanh nghiệp phải mở sổ chi tiết theo dõi riêng biệt chênh lệch tỷ giá hối đoái (lỗ tỷ giá) phát sinh trong giai đoạn trước hoạt động của hoạt động đầu tư XDCB chưa phân bổ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4.3. Tài khoản 3387 - Doanh thu chưa thực hiện\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eBổ sung nội dung phản ánh của Tài khoản 3387 - Doanh thu chưa thực hiện:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBên Nợ: \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ePhản ánh số phân bổ chênh lệch tỷ giá hối đoái phát sinh, và đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ (lãi tỷ giá) của hoạt động đầu tư XDCB (giai đoạn trước hoạt động) đã hoàn thành vào doanh thu hoạt động tài chính trong kỳ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBên Có: \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ePhản ánh số kết chuyển chênh lệch tỷ giá hối đoái phát sinh và đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ (trường hợp lãi tỷ giá) của hoạt động đầu tư XDCB (giai đoạn trước hoạt động) khi hoàn thành đầu tư để phân bổ dần vào doanh thu hoạt động tài chính.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSố dư Bên Có: \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ePhản ánh chênh lệch tỷ giá hối đoái phát sinh, và đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ (lãi tỷ giá) của hoạt động đầu tư XDCB (giai đoạn trước hoạt động) khi hoàn thành đầu tư chưa xử lý tại thời điểm lập Bảng CĐKT cuối năm tài chính.\u003c/p\u003e\n\u003cp\u003eDoanh nghiệp phải mở sổ kế toán chi tiết theo dõi riêng biệt về chênh lệch tỷ giá hối đoái (lãi tỷ giá) chưa phân bổ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4.4. Tài khoản 515 - Doanh thu hoạt động tài chính\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eBổ sung nội dung phản ánh của Tài khoản 515 - Doanh thu hoạt động tài chính:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBên Nợ:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e- Kết chuyển số phân bổ chênh lệch tỷ giá hối đoái của hoạt động đầu tư XDCB (lãi tỷ giá) (giai đoạn trước hoạt động, khi hoàn thành đầu tư) để xác định kết quả kinh doanh;\u003c/p\u003e\n\u003cp\u003e- Kết chuyển khoản xử lý chênh lệch tỷ giá hối đoái từ chuyển đổi báo cáo tài chính của hoạt động ở nước ngoài để xác định kết quả kinh doanh.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBên Có: \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e- Phản ánh số phân bổ chênh lệch tỷ giá hối đoái của hoạt động đầu tư XDCB (lãi tỷ giá) (giai đoạn trước hoạt động) đã hoàn thành đầu tư vào doanh thu hoạt động tài chính;\u003c/p\u003e\n\u003cp\u003e- Phản ánh khoản xử lý chênh lệch tỷ giá hối đoái từ chuyển đổi báo cáo tài chính của hoạt động ở nước ngoài vào doanh thu hoạt động tài chính.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4.5. Tài khoản 635 - Chi phí tài chính \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eBổ sung nội dung phản ánh của Tài khoản 635 - Chi phí tài chính:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBên Nợ: \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e- Phản ánh số phân bổ chênh lệch tỷ giá hối đoái của hoạt động đầu tư XDCB (lỗ tỷ giá) (giai đoạn trước hoạt động) đã hoàn thành đầu tư vào chi phí tài chính;\u003c/p\u003e\n\u003cp\u003e- Phản ánh khoản xử lý chênh lệch tỷ giá hối đoái từ chuyển đổi báo cáo tài chính của hoạt động ở nước ngoài (lỗ tỷ giá) vào chi phí tài chính.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBên Có: \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e- Phản ánh số kết chuyển khoản xử lý chênh lệch tỷ giá hối đoái của hoạt động đầu tư XDCB (lỗ tỷ giá) (giai đoạn trước hoạt động) đã hoàn thành đầu tư để xác định kết quả kinh doanh;\u003c/p\u003e\n\u003cp\u003e- Phản ánh khoản xử lý chênh lệch tỷ giá hối đoái từ chuyển đổi báo cáo tài chính của hoạt động ở nước ngoài (lỗ tỷ giá) để xác định kết quả kinh doanh.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5. Phương pháp hạch toán kế toán một số nghiệp vụ kinh tế chủ yếu \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5.1. Kế toán chênh lệch tỷ giá hối đoái phát sinh trong kỳ\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e5.1.1. Kế toán chênh lệch tỷ giá hối đoái phát sinh trong kỳ của hoạt động kinh doanh, kể cả hoạt động đầu tư XDCB của doanh nghiệp đang sản xuất, kinh doanh\u003c/p\u003e\n\u003cp\u003ea) Khi mua hàng hoá, dịch vụ thanh toán bằng ngoại tệ:\u003c/p\u003e\n\u003cp\u003e- Nếu phát sinh lỗ tỷ giá hối đoái trong giao dịch mua ngoài vật tư, hàng hoá, TSCĐ, dịch vụ, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 151,152,153,156,157,211,213,241,623,627,641,642, 133,...(Theo tỷ giá hối đoái ngày giao dịch)\u003c/p\u003e\n\u003cp\u003eNợ TK 635 - Chi phí tài chính (Lỗ tỷ giá hối đoái)\u003c/p\u003e\n\u003cp\u003eCó các TK 111 (1112), 112 (1122) (Theo tỷ giá hối đoái ghi sổ kế toán).\u003c/p\u003e\n\u003cp\u003e- Nếu phát sinh lãi tỷ giá hối đoái trong giao dịch mua ngoài hàng hoá, dịch vụ, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 151,152,153,156,157,211,213,241,623,627,641,642,133,...(Theo tỷ giá hối đoái ngày giao dịch)\u003c/p\u003e\n\u003cp\u003eCó các TK 111 (1112), 112 (1122) (Theo tỷ giá ghi sổ kế toán)\u003c/p\u003e\n\u003cp\u003eCó TK 515 - Doanh thu hoạt động tài chính (Lãi tỷ giá hối đoái).\u003c/p\u003e\n\u003cp\u003eb) Khi nhận hàng hoá, dịch vụ của nhà cung cấp, hoặc khi vay ngắn hạn, vay dài hạn, nợ dài hạn, hoặc nhận nợ nội bộ,... bằng ngoại tệ, căn cứ tỷ giá hối đoái thực tế ngày giao dịch, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK có liên quan (Theo tỷ giá hối đoái ngày giao dịch)\u003c/p\u003e\n\u003cp\u003eCó các TK 331, 311, 341, 342, 336,.. (Theo tỷ giá hối đoái ngày giao dịch).\u003c/p\u003e\n\u003cp\u003ec) Khi thanh toán nợ phải trả (nợ phải trả người bán, nợ vay ngắn hạn, vay dài hạn, nợ dài hạn, nợ nội bộ,...):\u003c/p\u003e\n\u003cp\u003e- Nếu phát sinh lỗ tỷ giá hối đoái trong giao dịch thanh toán nợ phải trả, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 311, 315, 331, 336, 341, 342,... (Tỷ giá hối đoái ghi sổ kế toán)\u003c/p\u003e\n\u003cp\u003eNợ TK 635 - Chi phí tài chính (Lỗ tỷ giá hối đoái)\u003c/p\u003e\n\u003cp\u003eCó các TK 111 (1112), 112 (1122) (Tỷ giá hối đoái ghi sổ kế toán).\u003c/p\u003e\n\u003cp\u003e- Nếu phát sinh lãi tỷ giá hối đoái trong giao dịch thanh toán nợ phải trả, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 311, 315, 331, 336, 341, 342,... (Tỷ giá hối đoái ghi sổ kế toán)\u003c/p\u003e\n\u003cp\u003eCó TK 515 - Doanh thu hoạt động tài chính (Lãi tỷ giá hối đoái)\u003c/p\u003e\n\u003cp\u003eCó các TK 111 (1112), 112 (1122) (Tỷ giá hối đoái ghi sổ kế toán).\u003c/p\u003e\n\u003cp\u003ed) Khi phát sinh doanh thu, thu nhập khác bằng các đơn vị tiền tệ khác với đơn vị tiền tệ sử dụng để ghi sổ kế toán, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111(1112), 112(1122), 131,... (Tỷ giá hối đoái BQLNH)\u003c/p\u003e\n\u003cp\u003eCó các TK 511, 711\u0026nbsp; (Tỷ giá hối đoái giao dịch thực tế hoặc BQLNH).\u003c/p\u003e\n\u003cp\u003ee) Khi phát sinh các khoản nợ phải thu bằng ngoại tệ, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 136, 138 (tỷ giá hối đoái ngày giao dịch)\u003c/p\u003e\n\u003cp\u003eNợ TK 635 - Chi phí tài chính (Nếu lỗ tỷ giá hối đoái)\u003c/p\u003e\n\u003cp\u003eCó các TK 111 (1112), 112 (1122) (Tỷ giá hối đoái ghi sổ kế toán)\u003c/p\u003e\n\u003cp\u003eCó TK 515 - Doanh thu hoạt động tài chính (Nếu lãi tỷ giá hối đoái).\u003c/p\u003e\n\u003cp\u003ef) Khi thu được tiền nợ phải thu bằng ngoại tệ (Phải thu khách hàng, phải thu nội bộ,...):\u003c/p\u003e\n\u003cp\u003e- Nếu phát sinh lỗ chênh lệch tỷ giá trong giao dịch thanh toán nợ phải thu, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111 (1112), 112 (1122) (Tỷ giá hối đoái ngày giao dịch)\u003c/p\u003e\n\u003cp\u003eNợ TK 635 - Chi phí tài chính (Lỗ tỷ giá hối đoái)\u003c/p\u003e\n\u003cp\u003eCó các TK 131, 136, 138 (Tỷ giá hối đoái ghi sổ kế toán).\u003c/p\u003e\n\u003cp\u003e- Nếu phát sinh lãi chênh lệch tỷ giá hối đoái khi thanh toán nợ phải thu bằng ngoại tệ, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111 (1112), 112 (1122) (Tỷ giá hối đoái ngày giao dịch)\u003c/p\u003e\n\u003cp\u003eCó TK 515 - Doanh thu hoạt động tài chính (Lãi tỷ giá hối đoái)\u003c/p\u003e\n\u003cp\u003eCó các TK 131, 136, 138... (Tỷ giá hối đoái ghi sổ kế toán).\u003c/p\u003e\n\u003cp\u003e5.1.2. Kế toán chênh lệch tỷ giá phát sinh trong kỳ của hoạt động đầu tư XDCB (giai đoạn trước hoạt động)\u003c/p\u003e\n\u003cp\u003ea) Khi mua ngoài hàng hoá, dịch vụ, TSCĐ, thiết bị, khối lượng xây dựng, lắp đặt do người bán hoặc bên nhận thầu bàn giao:\u003c/p\u003e\n\u003cp\u003e- Nếu phát sinh lỗ chênh lệch tỷ giá trong giao dịch bằng ngoại tệ thanh toán mua hàng hoá, dịch vụ, TSCĐ, thiết bị, khối lượng xây dựng, lắp đặt do bên nhận thầu bàn giao, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 151, 152, 211, 213, 241,...(Tỷ giá hối đoái ngày giao dịch)\u003c/p\u003e\n\u003cp\u003eNợ TK 413 - Chênh lệch tỷ giá hối đoái(4131) (Lỗ tỷ giá hối đoái)\u003c/p\u003e\n\u003cp\u003eCó các TK 111 (1112), 112 (1122)(Tỷ giá hối đoái ghi sổ kế toán).\u003c/p\u003e\n\u003cp\u003e- Nếu phát sinh lãi chênh lệch tỷ giá hối đoái trong giao dịch bằng ngoại tệ thanh toán mua hàng hoá, dịch vụ, TSCĐ, thiết bị, khối lượng xây dựng, lắp đặt do bên nhận thầu bàn giao, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 151, 152, 211, 213, 241,...(Tỷ giá hối đoái ngày giao dịch)\u003c/p\u003e\n\u003cp\u003eCó các TK 111 (1112), 112 (1122)(Tỷ giá hối đoái ghi sổ kế toán)\u003c/p\u003e\n\u003cp\u003eCó TK 413 - Chênh lệch tỷ giá hối đoái (4131) (Lãi tỷ giá).\u003c/p\u003e\n\u003cp\u003eb) Khi thanh toán nợ phải trả bằng ngoại tệ (nợ phải trả người bán, nợ vay dài hạn, ngắn hạn, nợ nội bộ (nếu có),...):\u003c/p\u003e\n\u003cp\u003e- Nếu phát sinh lỗ chênh lệch tỷ giá hối đoái trong giao dịch thanh toán nợ phải trả, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 311, 315, 331, 336, 341, 342,... (Tỷ giá hối đoái ghi sổ kế toán)\u003c/p\u003e\n\u003cp\u003eNợ TK 413 - Chênh lệch tỷ giá hối đoái (4131) (Lỗ tỷ giá)\u003c/p\u003e\n\u003cp\u003eCó các TK 111 (1112), 112 (1122) (Tỷ giá hối đoái ghi sổ kế toán).\u003c/p\u003e\n\u003cp\u003e- Nếu phát sinh lãi chênh lệch tỷ giá hối đoái trong giao dịch thanh toán nợ phải trả, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 311, 315, 331, 336, 341, 342,...(Tỷ giá hối đoái ghi sổ kế toán)\u003c/p\u003e\n\u003cp\u003eCó các TK 111 (1112), 112 (1122) (Tỷ giá hối đoái ghi sổ kế toán)\u003c/p\u003e\n\u003cp\u003eCó TK 413 - Chênh lệch tỷ giá hối đoái (4131) (Lãi tỷ giá hối đoái).\u003c/p\u003e\n\u003cp\u003ec) Hàng năm, chênh lệch tỷ giá đã thực hiện phát sinh trong giai đoạn đầu tư xây dựng (giai đoạn trước hoạt động) được phản ánh luỹ kế trên TK 413 - Chênh lệch tỷ giá hối đoái (4132) cho đến khi hoàn thành đầu tư XDCB.\u003c/p\u003e\n\u003cp\u003ed) Kết thúc giai đoạn đầu tư xây dựng (giai đoạn trước hoạt động), kết chuyển chênh lệch tỷ giá hối đoái đã thực hiện (theo số thuần sau khi bù trừ số dư bên Nợ và bên Có Tài khoản 4132) của hoạt động đầu tư (giai đoạn trước hoạt động) trên TK 413 - Chênh lệch tỷ giá hối đoái (TK 4132) tính ngay vào chi phí tài chính, hoặc doanh thu hoạt động tài chính, hoặc kết chuyển sang TK 242 - Chi phí trả trước dài hạn (nếu lỗ tỷ giá); hoặc TK 3387 - Doanh thu chưa thực hiện (nếu lãi tỷ giá) để phân bổ trong thời gian tối đa là 5 năm, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 413 - Chênh lệch tỷ giá hối đoái (4132)\u003c/p\u003e\n\u003cp\u003eCó TK 3387 - Doanh thu chưa thực hiện (Lãi tỷ giá hối đoái).\u003c/p\u003e\n\u003cp\u003eHoặc\u003c/p\u003e\n\u003cp\u003eNợ TK 242 - Chi phí trả trước dài hạn (Lỗ tỷ giá hối đoái)\u003c/p\u003e\n\u003cp\u003eCó TK 413 - Chênh lệch tỷ giá hối đoái (4132).\u003c/p\u003e\n\u003cp\u003eđ) Xử lý chênh lệch tỷ giá hối đoái (Lỗ hoặc lãi) đã thực hiện trong giai đoạn đầu tư được luỹ kế trong giai đoạn đầu tư đến thời điểm quyết toán bàn giao đưa công trình vào hoạt động sẽ kết chuyển ngay toàn bộ, hoặc phân bổ trong thời gian đối đa là 5 năm (phản ánh trên TK 242, hoặc TK 3387) vào chi phí tài chính, hoặc doanh thu hoạt động tài chính.\u003c/p\u003e\n\u003cp\u003e- Phân bổ chênh lệch lỗ tỷ giá hối đoái đã thực hiện phát sinh trong giai đoạn đầu tư xây dựng vào chi phí tài chính của năm tài chính khi kết thúc giai đoạn đầu tư, xây dựng đưa TSCĐ vào sử dụng, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 635 - Chi phí tài chính (Lỗ tỷ giá hối đoái)\u003c/p\u003e\n\u003cp\u003eCó TK 242 - Chi phí trả trước dài hạn.\u003c/p\u003e\n\u003cp\u003e- Phân bổ chênh lệch lãi tỷ giá ngoại tệ đã thực hiện phát sinh trong giai đoạn đầu tư xây dựng vào doanh thu hoạt động tài chính của năm tài chính khi kết thúc giai đoạn đầu tư, xây dựng đưa TSCĐ vào sử dụng, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 3387 - Doanh thu chưa thực hiện\u003c/p\u003e\n\u003cp\u003eCó TK 515 - Doanh thu hoạt động tài chính (Lãi tỷ giá hối đoái).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5.2. Kế toán chênh lệch tỷ giá hối đoái đánh giá lại cuối năm\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e5.2.1. Kế toán chênh lệch tỷ giá hối đoái đánh giá lại cuối năm\u003c/p\u003e\n\u003cp\u003eỞ thời điểm cuối năm tài chính, doanh nghiệp phải đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ (đơn vị tiền tệ khác với đơn vị tiền tệ chính thức sử dụng trong kế toán) theo tỷ giá hối đoái ở thời điểm cuối năm tài chính theo tỷ giá hối đoái bình quân liên ngân hàng do Ngân hàng Nhà nước công bố tại thời điểm cuối năm tài chính, có thể phát sinh chênh lệch tỷ giá hối đoái (lãi hoặc lỗ). Doanh nghiệp phải chi tiết khoản chênh lệch tỷ giá hối đoái phát sinh do đánh giá lại các khoản mục tiền tệ này của hoạt động đầu tư xây dựng cơ bản (giai đoạn trước hoạt động) (TK 4132) và của hoạt động sản xuất, kinh doanh (TK 4131):\u003c/p\u003e\n\u003cp\u003e- Nếu phát sinh lãi tỷ giá hối đoái, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111 (1112), 112 (1122), 131, 136, 138, 311, 315, 331, 341, 342,...\u003c/p\u003e\n\u003cp\u003eCó TK 413 - Chênh lệch tỷ giá hối đoái (4131, 4132).\u003c/p\u003e\n\u003cp\u003e- Nếu phát sinh lỗ tỷ giá hối đoái, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 413 - Chênh lệch tỷ giá hối đoái (4131, 4132)\u003c/p\u003e\n\u003cp\u003eCó các TK111(1112), 112(1122), 131, 136, 138, 311, 315, 331, 341,342,...\u003c/p\u003e\n\u003cp\u003e5.2.2. Xử lý chênh lệch tỷ giá hối đoái đánh giá lại cuối năm\u003c/p\u003e\n\u003cp\u003ea. Xử lý chênh lệch tỷ giá hối đoái đánh giá lại cuối năm của các khoản mục tiền tệ của hoạt động sản xuất, kinh doanh, kể cả hoạt động đầu tư xây dựng (của doanh nghiệp đang sản xuất, kinh doanh):\u003c/p\u003e\n\u003cp\u003e- Kết chuyển toàn bộ khoản chênh lệch tỷ giá hối đoái đánh giá lại cuối năm\u0026nbsp; tài chính của hoạt động

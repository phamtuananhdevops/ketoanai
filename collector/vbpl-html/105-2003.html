kinh doanh (theo số thuần sau khi bù trừ số dư bên Nợ và bên Có của TK 4132) vào chi phí tài chính (nếu lỗ tỷ giá hối đoái), hoặc doanh thu hoạt động tài chính (nếu lãi tỷ giá hối đoái) để xác định kết quả hoạt động kinh doanh:\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e+ Kết chuyển lãi chênh lệch tỷ giá hối đoái đánh giá lại cuối năm tài chính vào doanh thu hoạt động tài chính, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 413 - Chênh lệch tỷ giá hối đoái (4131)\u003c/p\u003e\n\u003cp\u003eCó TK 515 - Doanh thu hoạt động tài chính (Nếu lãi tỷ giá hối đoái).\u003c/p\u003e\n\u003cp\u003e+ Kết chuyển lỗ chênh lệch tỷ giá hối đoái đánh giá lại cuối năm tài chính vào chi phí tài chính, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 635 - Chi phí tài chính (Nếu lỗ tỷ giá hối đoái)\u003c/p\u003e\n\u003cp\u003eCó TK 413 - Chênh lệch tỷ giá hối đoái (4131).\u003c/p\u003e\n\u003cp\u003eb. Xử lý chênh lệch tỷ giá hối đoái đánh giá lại cuối năm của các khoản mục tiền tệ của hoạt động đầu tư xây dựng cơ bản:\u003c/p\u003e\n\u003cp\u003e- Ở giai đoạn đang đầu tư\u0026nbsp; xây dựng, doanh nghiệp chưa đi vào hoạt động thì chênh lệch tỷ giá hối đoái đánh giá lại cuối năm được phản ánh luỹ kế trên TK 413 - Chênh lệch tỷ giá hối đoái, số dư Nợ, hoặc Có phản ánh trên\u0026nbsp; Bảng Cân đối kế toán.\u003c/p\u003e\n\u003cp\u003e- Khi kết thúc giai đoạn đầu tư, xây dựng chuyển sang hoạt động sản xuất, kinh doanh số dư Nợ, hoặc số dư Có TK 413 - Chênh lệch tỷ giá hối đoái phản ánh chênh lệch tỷ giá hối đoái đánh giá lại các khoản mục tiền tệ cuối mỗi năm tài chính (không bao gồm khoản đánh giá lại các khoản mục tiền tệ liên quan đến hoạt động đầu tư xây dựng ở thời điểm bàn giao tài sản để đưa vào sử dụng) sẽ được xử lý như sau:\u003c/p\u003e\n\u003cp\u003e+ Kết chuyển số dư Nợ TK 413 - Chênh lệch tỷ giá hối đoái (4132) về TK 242 - Chi phí trả trước dài hạn để phân bổ dần số lỗ tỷ giá hối đoái của giai đoạn đầu tư xây dựng trong các năm tài chính tiếp theo trong thời gian tối đa 5 năm (kể từ khi kết thúc giai đoạn đầu tư) vào chi phí tài chính, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 242 - Chi phí trả trước dài hạn\u003c/p\u003e\n\u003cp\u003eCó TK 413 - Chênh lệch tỷ giá hối đoái (4132).\u003c/p\u003e\n\u003cp\u003e+ Kết chuyển số dư Có TK 413 - Chênh lệch tỷ giá hối đoái (4132) về TK 3387 - Doanh thu chưa thực hiện để phân bổ dần số lãi tỷ giá hối đoái của giai đoạn đầu tư xây dựng trong các năm tài chính tiếp theo trong thời gian tối đa 5 năm (kể từ khi kết thúc giai đoạn đầu tư) vào doanh thu hoạt động tài chính, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 413 - Chênh lệch tỷ giá hối đoái (4132)\u003c/p\u003e\n\u003cp\u003eCó TK 3387 - Doanh thu chưa thực hiện.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e6. Kế toán chênh lệch tỷ giá hối đoái khi chuyển đổi báo cáo tài chính của hoạt động ở nước ngoài\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e6.1. Kế toán chênh lệch tỷ giá hối đoái khi chuyển đổi báo cáo tài chính của hoạt động nước ngoài không thể tách rời với hoạt động của doanh nghiệp báo cáo\u003c/p\u003e\n\u003cp\u003eKế toán chênh lệch tỷ giá hối đoái khi chuyển đổi báo cáo tài chính của hoạt động nước ngoài\u0026nbsp; không thể tách rời với hoạt động của doanh nghiệp báo cáo được hạch toán tương tự như hướng dẫn kế toán của các điểm 1, 2, 3, 4 - Phần II - Thông tư này.\u003c/p\u003e\n\u003cp\u003e6.2. Kế toán chênh lệch tỷ giá hối đoái khi chuyển đổi báo cáo tài chính của cở sở ở nước ngoài hoạt động độc lập\u003c/p\u003e\n\u003cp\u003e- Khi hợp nhất báo cáo tài chính của cở sở ở nước ngoài hoạt động độc lập để tổng hợp vào báo cáo tài chính của doanh nghiệp báo cáo, nếu phát sinh chênh lệch tỷ giá hối đoái khi chuyển đổi báo cáo tài chính, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 413 - Chênh lệch tỷ giá hối đoái\u003c/p\u003e\n\u003cp\u003eCó các TK có liên quan.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eHoặc\u003c/p\u003e\n\u003cp\u003eNợ các TK có liên quan\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eCó TK 413 - Chênh lệch tỷ giá hối đoái.\u003c/p\u003e\n\u003cp\u003e- Khi xử lý chênh lệch tỷ giá hối đoái luỹ kế đã bị hoãn lại do chuyển đổi báo cáo tài chính của cơ sở ở nước ngoài hoạt động độc lập, khi hợp nhất báo cáo tài chính của doanh nghiệp báo cáo tại thời điểm thanh lý khoản đầu tư này, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 413 - Chênh lệch tỷ giá hối đoái (4133)\u003c/p\u003e\n\u003cp\u003eCó TK 515 - Doanh thu hoạt động tài chính.\u003c/p\u003e\n\u003cp\u003eHoặc\u003c/p\u003e\n\u003cp\u003eNợ TK 635 - Chi phí tài chính\u003c/p\u003e\n\u003cp\u003eCó TK 413 - Chênh lệch tỷ giá hối đoái (4133).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eIII . HƯỚNG DẪN KẾ TOÁN CHUẨN MỰC\u003cbr\u003e\n   \"HỢP ĐỒNG XÂY DỰNG\"\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1. Hạch toán hợp đồng xây dựng phải tôn trọng một số quy định sau\u003c/strong\u003e\u003cstrong\u003e:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1.1. Doanh thu của hợp đồng xây dựng bao gồm:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ea) Doanh thu ban đầu được ghi trong hợp đồng;\u003c/p\u003e\n\u003cp\u003eb) Các khoản tăng, giảm khi thực hiện hợp đồng, các khoản tiền thưởng và các khoản thanh toán khác nếu các khoản này có khả năng làm thay đổi doanh thu, và có thể xác định được một cách đáng tin cậy;\u003c/p\u003e\n\u003cp\u003e- Doanh thu của hợp đồng có thể tăng hay giảm ở từng thời kỳ, ví dụ:\u003c/p\u003e\n\u003cp\u003e+ Nhà thầu và khách hàng có thể đồng ý với nhau về các thay đổi và các yêu cầu làm tăng hoặc giảm doanh thu của hợp đồng trong kỳ tiếp theo so với hợp đồng được chấp thuận lần đầu tiên;\u003c/p\u003e\n\u003cp\u003e+ Doanh thu đã được thỏa thuận trong hợp đồng với giá cố định có thể tăng vì lý do giá cả tăng lên;\u003c/p\u003e\n\u003cp\u003e+ Doanh thu theo hợp đồng có thể bị giảm do nhà thầu không thực hiện đúng tiến độ hoặc không đảm bảo chất lượng xây dựng theo thỏa thuận trong hợp đồng;\u003c/p\u003e\n\u003cp\u003e+ Khi hợp đồng với giá cố định quy định mức giá cố định cho một đơn vị sản phẩm hoàn thành thì doanh thu theo hợp đồng sẽ tăng hoặc giảm khi khối lượng sản phẩm tăng hoặc giảm.\u003c/p\u003e\n\u003cp\u003e- Khoản tiền thưởng là các khoản phụ thêm trả cho nhà thầu nếu nhà thầu thực hiện hợp đồng đạt hay vượt mức yêu cầu. Khoản tiền thưởng được tính vào doanh thu của hợp đồng xây dựng khi:\u003c/p\u003e\n\u003cp\u003e+ Chắc chắn đạt hoặc vượt mức một số tiêu chuẩn cụ thể đã được ghi trong hợp đồng; và\u003c/p\u003e\n\u003cp\u003e+ Khoản tiền thưởng được xác định một cách đáng tin cậy.\u003c/p\u003e\n\u003cp\u003e- Một khoản thanh toán khác mà nhà thầu thu được từ khách hàng hay một bên khác để bù đắp cho các chi phí không bao gồm trong giá hợp đồng. Ví dụ: Sự chậm trễ do khách hàng gây nên; sai sót trong các chỉ tiêu kỹ thuật hoặc thiết kế và các tranh chấp về các thay đổi trong việc thực hiện hợp đồng. Việc xác định doanh thu tăng thêm từ các khoản thanh toán trên còn tuỳ thuộc vào rất nhiều yếu tố không chắc chắn và thường phụ thuộc vào kết quả của nhiều cuộc đàm phán. Do đó, các khoản thanh toán khác chỉ được tính vào doanh thu của hợp đồng xây dựng khi:\u003c/p\u003e\n\u003cp\u003e+ Các cuộc thỏa thuận đã đạt được kết quả là khách hàng sẽ chấp thuận bồi thường;\u003c/p\u003e\n\u003cp\u003e+ Khoản thanh toán khác được khách hàng chấp thuận và có thể xác định được một cách đáng tin cậy.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1.2. Chi phí của hợp đồng xây dựng bao gồm:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ea) Chi phí liên quan trực tiếp đến từng hợp đồng:\u003c/p\u003e\n\u003cp\u003eChi phí liên quan trực tiếp đến từng hợp đồng có thể được giảm khi có các khoản thu khác không bao gồm trong doanh thu của hợp đồng. Ví dụ: Các khoản thu từ việc bán nguyên, vật liệu thừa và thanh lý máy móc, thiết bị xây dựng khi kết thúc hợp đồng...\u003c/p\u003e\n\u003cp\u003eb) Chi phí chung liên quan đến hoạt động của các hợp đồng và có thể phân bổ cho từng hợp đồng cụ thể:\u003c/p\u003e\n\u003cp\u003eChi phí chung liên quan đến hoạt động của các hợp đồng xây dựng và có thể phân bổ cho từng hợp đồng bao gồm chi phí bảo hiểm, chi phí thiết kế và trợ giúp kỹ thuật không liên quan trực tiếp đến một hợp đồng cụ thể, chi phí quản lý chung trong xây dựng và các chi phí đi vay nếu thỏa mãn các điều kiện chi phí đi vay được vốn hóa quy định trong chuẩn mực chi phí đi vay.\u003c/p\u003e\n\u003cp\u003ec) Các chi phí khác có thể thu lại từ khách hàng theo các điều khoản của hợp đồng.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1.3. Ghi nhận doanh thu và chi phí của hợp đồng xây dựng theo 1 trong 2 trường hợp sau:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ea) Trường hợp hợp đồng xây dựng quy định nhà thầu được thanh toán theo tiến độ kế hoạch, khi kết quả thực hiện hợp đồng xây dựng được ước tính một cách đáng tin cậy, thì doanh thu và chi phí của hợp đồng xây dựng được ghi nhận tương ứng với phần công việc đã hoàn thành do nhà thầu tự xác định vào ngày lập báo cáo tài chính mà không phụ thuộc vào hóa đơn thanh toán theo tiến độ kế hoạch đã lập hay chưa và số tiền ghi trên hóa đơn là bao nhiêu;\u003c/p\u003e\n\u003cp\u003eb) Trường hợp hợp đồng xây dựng quy định nhà thầu được thanh toán theo giá trị khối lượng thực hiện, khi kết quả thực hiện hợp đồng xây dựng được xác định một cách đáng tin cậy và được khách hàng xác nhận, thì doanh thu và chi phí liên quan đến hợp đồng được ghi nhận tương ứng với phần công việc đã hoàn thành được khách hàng xác nhận trong kỳ phản ánh trên hóa đơn đã lập.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1.4. Phần công việc đã hoàn thành của hợp đồng làm cơ sở xác định doanh thu \u003c/strong\u003ecó thể được xác định bằng nhiều cách khác nhau. Doanh nghiệp cần sử dụng phương pháp tính toán thích hợp để xác định phần công việc đã hoàn thành. Tuỳ thuộc vào bản chất của hợp đồng, các phương pháp đó có thể là:\u003c/p\u003e\n\u003cp\u003ea) Tỷ lệ phần trăm (%) giữa chi phí thực tế đã phát sinh của phần công việc đã hoàn thành tại một thời điểm so với tổng chi phí dự toán của hợp đồng;\u003c/p\u003e\n\u003cp\u003eb) Đánh giá phần công việc đã hoàn thành; hoặc\u003c/p\u003e\n\u003cp\u003ec) Tỷ lệ phần trăm (%) giữa khối lượng xây lắp đã hoàn thành so với tổng khối lượng xây lắp phải hoàn thành của hợp đồng.\u003c/p\u003e\n\u003cp\u003eVí dụ:\u003c/p\u003e\n\u003cp\u003e(1) Doanh thu hợp đồng xây dựng với giá cố định được xác định theo phương pháp tỷ lệ phần trăm (%) công việc hoàn thành, được đo bằng tỷ lệ phần trăm (%) giữa giờ công lao động đã thực hiện đến thời điểm hiện tại so với tổng số giờ công lao động dự tính cho hợp đồng đó.\u003c/p\u003e\n\u003cp\u003e(2) Doanh thu hợp đồng xây dựng được xác định theo phương pháp tỷ lệ phần trăm (%) giữa chi phí thực tế đã phát sinh tính đến thời điểm hiện tại so với tổng chi phí dự toán của hợp đồng (Xem phụ lục số 01).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1.5. Khi kết quả của hợp đồng xây dựng không thể ước tính được một cách đáng tin cậy, thì:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ea) Doanh thu chỉ được ghi nhận tương ứng với chi phí thực tế của hợp đồng xây dựng đã phát sinh mà việc được hoàn trả là tương đối chắc chắn;\u003c/p\u003e\n\u003cp\u003eb) Các chi phí của hợp đồng chỉ được ghi nhận là chi phí trong kỳ khi các khoản chi phí này đã phát sinh.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1.6. Trường hợp hợp đồng xây dựng quy định nhà thầu được thanh toán theo tiến độ kế hoạch thì:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ea. Nhà thầu phải lựa chọn phương pháp xác định phần công việc đã hoàn thành và giao trách nhiệm cho các bộ phận liên quan xác định giá trị phần công việc đã hoàn thành và lập chứng từ phản ánh doanh thu hợp đồng xây dựng trong kỳ:\u003c/p\u003e\n\u003cp\u003e- Nếu áp dụng phương pháp (a) \"Tỷ lệ phần trăm (%) giữa chi phí thực tế đã phát sinh của phần công việc đã hoàn thành tại một thời điểm so với tổng chi phí dự toán của hợp đồng\" thì giao cho bộ phận kế toán phối hợp với các bộ phận khác thực hiện;\u003c/p\u003e\n\u003cp\u003e- Nếu áp dụng phương pháp (b) \"Đánh giá phần công việc đã hoàn thành\" hoặc phương pháp (c) \"Tỷ lệ phần trăm (%) giữa khối lượng xây lắp đã hoàn thành so với tổng khối lượng xây lắp phải hoàn thành của hợp đồng\" thì giao cho bộ phận kỹ thuật thi công phối hợp với các bộ phận khác thực hiện.\u003c/p\u003e\n\u003cp\u003eb. Khi kết quả thực hiện hợp đồng xây dựng được ước tính một cách đáng tin cậy, kế toán căn cứ vào chứng từ xác định doanh thu trên cơ sở phần công việc đã hoàn thành trong kỳ (không phải hóa đơn) làm căn cứ ghi nhận doanh thu trong kỳ kế toán.\u003c/p\u003e\n\u003cp\u003eĐồng thời nhà thầu phải căn cứ vào hợp đồng xây dựng để lập hóa đơn thanh toán theo tiến độ kế hoạch gửi cho khách hàng đòi tiền. Kế toán căn cứ vào hóa đơn để ghi sổ kế toán số tiền khách hàng phải thanh toán theo tiến độ kế hoạch.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1.7. Trường hợp hợp đồng xây dựng quy định nhà thầu được thanh toán theo giá trị khối lượng thực hiện,\u003c/strong\u003e được khách hàng xác nhận thì nhà thầu phải căn cứ vào\u0026nbsp; phương pháp tính toán thích hợp để xác định giá trị khối lượng xây lắp hoàn thành trong kỳ. Khi kết quả thực hiện hợp đồng xây dựng được xác định một cách đáng tin cậy và được khách hàng xác nhận, kế toán phải lập hóa đơn gửi cho khách hàng đòi tiền và phản ánh doanh thu và nợ phải thu trong kỳ tương ứng với phần công việc đã hoàn thành được khách hàng xác nhận.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1.8. Việc trích trước chi phí sửa chữa và bảo hành công trình được thực hiện theo từng lần ghi nhận doanh thu hợp đồng xây dựng hoặc khi kết thúc năm tài chính.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. Phương pháp kế toán doanh thu và chi phí của hợp đồng xây dựng\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.1. Bổ sung\u0026nbsp; Tài khoản 337 – “Thanh toán theo tiến độ kế hoạch hợp đồng xây dựng” để kế toán doanh thu và chi phí hợp đồng xây dựng trong trường hợp thanh toán theo tiến độ kế hoạch:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eTài khoản 337 “Thanh toán theo tiến độ kế hoạch hợp đồng xây dựng” dùng để phản ánh số tiền khách hàng phải trả theo tiến độ kế hoạch và số tiền phải thu theo doanh thu tương ứng với phần công việc đã hoàn thành do nhà thầu tự xác nhận của hợp đồng xây dựng dở dang.\u003c/p\u003e\n\u003cp\u003eHạch toán Tài khoản 337 cần tôn trọng một số quy định sau:\u003c/p\u003e\n\u003cp\u003eTài khoản 337 “Thanh toán theo tiến độ kế hoạch hợp đồng xây dựng” chỉ áp dụng đối với trường hợp hợp đồng xây dựng quy định nhà thầu được thanh toán theo tiến độ kế hoạch. Tài khoản này không áp dụng đối với trường hợp hợp đồng xây dựng quy định nhà thầu được thanh toán theo giá trị khối lượng thực hiện được khách hàng xác nhận.\u003c/p\u003e\n\u003cp\u003e- Căn cứ để ghi vào bên Nợ TK 337 là chứng từ xác định doanh thu tương ứng với phần công việc đã hoàn thành trong kỳ (không phải hóa đơn) do nhà thầu tự lập, không phải chờ khách hàng xác nhận.\u003c/p\u003e\n\u003cp\u003e- Căn cứ để ghi vào bên Có TK 337 là hóa đơn được lập trên cơ sở tiến độ thanh toán theo kế hoạch đã được quy định trong hợp đồng. Số tiền ghi trên hóa đơn là căn cứ để ghi nhận số tiền nhà thầu phải thu của khách hàng, không là căn cứ để ghi nhận doanh thu trong kỳ kế toán.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eKết cấu và nội dung phản ánh của TK 337 “Thanh toán theo tiến độ kế hoạch hợp đồng xây dựng”\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBên Nợ: \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ePhản ánh số tiền phải thu theo doanh thu đã ghi nhận tương ứng với phần công việc đã hoàn thành của hợp đồng xây dựng dở dang.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBên Có: \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ePhản ánh số tiền khách hàng phải trả theo tiến độ kế hoạch của hợp đồng xây dựng dở dang.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSố dư bên Nợ: \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ePhản ánh số tiền chênh lệch giữa doanh thu đã ghi nhận của hợp đồng lớn hơn số tiền khách hàng phải trả theo tiến độ kế hoạch của hợp đồng xây dựng dở dang.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSố dư bên Có: \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ePhản ánh số tiền chênh lệch giữa doanh thu đã ghi nhận của hợp đồng nhỏ hơn số tiền khách hàng phải trả theo tiến độ kế hoạch của hợp đồng xây dựng dở dang.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePhương pháp hạch toán kế toán Tài khoản 337\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e- Trường hợp hợp đồng xây dựng quy định nhà thầu được thanh toán theo tiến độ kế hoạch, khi kết quả thực hiện hợp đồng xây dựng được ước tính một cách đáng tin cậy, thì kế toán căn cứ vào chứng từ phản ánh doanh thu tương ứng với phần công việc đã hoàn thành (không phải hoá đơn) do nhà thầu tự xác định, ghi:\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eNợ TK 337 - Thanh toán theo tiến độ kế hoạch hợp đồng xây dựng\u003c/p\u003e\n\u003cp\u003eCó TK 511 - Doanh thu bán hàng và cung cấp dịch vụ.\u003c/p\u003e\n\u003cp\u003e- Căn cứ vào hóa đơn được lập theo tiến độ kế hoạch để phản ánh số tiền phải thu theo tiến độ kế hoạch đã ghi trong hợp đồng, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 131 - Phải thu của khách hàng\u003c/p\u003e\n\u003cp\u003eCó TK 337 - Thanh toán theo tiến độ kế hoạch hợp đồng xây dựng\u003c/p\u003e\n\u003cp\u003eCó TK 3331 - Thuế GTGT phải nộp.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.2. Phương pháp kế toán doanh thu và chi phí hợp đồng xây dựng\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e2.2.1. Trường hợp hợp đồng xây dựng quy định nhà thầu được thanh toán theo tiến độ kế hoạch, khi kết quả thực hiện hợp đồng xây dựng được ước tính một cách đáng tin cậy, thì kế toán căn cứ vào chứng từ phản ánh doanh thu tương ứng với phần công việc đã hoàn thành (không phải hoá đơn) do nhà thầu tự xác định, ghi:\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eNợ TK 337 - Thanh toán theo tiến độ kế hoạch hợp đồng xây dựng\u003c/p\u003e\n\u003cp\u003eCó TK 511 - Doanh thu bán hàng và cung cấp dịch vụ.\u003c/p\u003e\n\u003cp\u003e- Căn cứ vào hóa đơn được lập theo tiến độ kế hoạch để phản ánh số tiền khách hàng phải trả theo tiến độ kế hoạch đã ghi trong hợp đồng, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 131 - Phải thu của khách hàng\u003c/p\u003e\n\u003cp\u003eCó TK 337 - Thanh toán theo tiến độ kế hoạch hợp đồng xây dựng\u003c/p\u003e\n\u003cp\u003eCó TK 3331 - Thuế GTGT phải nộp.\u003c/p\u003e\n\u003cp\u003e- Khi nhận được tiền do khách hàng trả, hoặc nhận tiền khách hàng ứng trước, ghi:\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eNợ các TK 111, 112...\u003c/p\u003e\n\u003cp\u003eCó TK 131 - Phải thu của khách hàng.\u003c/p\u003e\n\u003cp\u003e2.2.2. Trường hợp hợp đồng xây dựng quy định nhà thầu được thanh toán theo giá trị khối lượng thực hiện, khi kết quả thực hiện hợp đồng xây dựng được xác định một cách đáng tin cậy và được khách hàng xác nhận, thì kế toán phải lập hóa đơn trên cơ sở phần công việc đã hoàn thành được khách hàng xác nhận, căn cứ vào hóa đơn, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111, 112, 131\u003c/p\u003e\n\u003cp\u003eCó TK 3331 - Thuế GTGT phải nộp\u003c/p\u003e\n\u003cp\u003eCó TK 511 - Doanh thu bán hàng và cung cấp dịch vụ.\u003c/p\u003e\n\u003cp\u003e2.2.3. Khoản tiền thưởng thu được từ khách hàng trả phụ thêm cho nhà thầu khi thực hiện hợp đồng đạt hoặc vượt một số chỉ tiêu cụ thể đã được ghi trong hợp đồng, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111, 112, 131\u003c/p\u003e\n\u003cp\u003eCó TK 3331 - Thuế GTGT phải nộp\u003c/p\u003e\n\u003cp\u003eCó TK 511 - Doanh thu bán hàng và cung cấp dịch vụ.\u003c/p\u003e\n\u003cp\u003e2.2.4. Khoản bồi thường thu được từ khách hàng hay bên khác để bù đắp cho các chi phí không bao gồm trong giá trị hợp đồng (Ví dụ: Sự chậm trễ do khách hàng gây nên; sai sót trong các chỉ tiêu kỹ thuật hoặc thiết kế và các tranh chấp về các thay đổi trong việc thực hiện hợp đồng), ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111, 112, 131\u003c/p\u003e\n\u003cp\u003eCó TK 3331 - Thuế GTGT phải nộp (nếu có)\u003c/p\u003e\n\u003cp\u003eCó TK 511 - Doanh thu bán hàng và cung cấp dịch vụ.\u003c/p\u003e\n\u003cp\u003e2.2.5. Khi nhận được tiền thanh toán khối lượng công trình hoàn thành hoặc khoản ứng trước từ khách hàng, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111, 112...\u003c/p\u003e\n\u003cp\u003eCó TK 131 - Phải thu của khách hàng.\u003c/p\u003e\n\u003cp\u003e2.2.6. Hạch toán chi phí sửa chữa và bảo hành công trình:\u003c/p\u003e\n\u003cp\u003e- Khi trích trước chi phí sửa chữa và bảo hành công trình, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 627 - Chi phí sản xuất chung\u003c/p\u003e\n\u003cp\u003eCó TK 335 - Chi phí phải trả.\u003c/p\u003e\n\u003cp\u003e- Khi phát sinh chi phí sửa chữa và bảo hành công trình, như chi phí nguyên, vật liệu trực tiếp, chi phí nhân công trực tiếp, chi phí sử dụng máy thi công, chi phí sản xuất chung, kế toán phản ánh vào các Tài khoản chi phí có liên quan, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 621 - Chi phí nguyên liệu, vật liệu trực tiếp\u003c/p\u003e\n\u003cp\u003eNợ TK 622 - Chi phí nhân công trực tiếp\u003c/p\u003e\n\u003cp\u003eNợ TK 623 - Chi phí sử dụng máy thi công\u003c/p\u003e\n\u003cp\u003eNợ TK 627 - Chi phí sản xuất chung\u003c/p\u003e\n\u003cp\u003eNợ TK 133 - Thuế GTGT được khấu trừ\u003c/p\u003e\n\u003cp\u003eCó các TK 112, 152, 153, 214, 331, 334, 338...\u003c/p\u003e\n\u003cp\u003e- Cuối kỳ, kết chuyển chi phí thực tế phát sinh trong kỳ về nguyên, vật liệu trực tiếp, nhân công trực tiếp, chi phí sử dụng máy thi công, chi phí sản xuất chung liên quan đến hoạt động sửa chữa và bảo hành công trình xây lắp để tập hợp chi phí sửa chữa và bảo hành và tính giá thành bảo hành, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 154 - Chi phí sản xuất, kinh doanh dở dang\u003c/p\u003e\n\u003cp\u003eCó TK 621 - Chi phí nguyên liệu, vật liệu trực tiếp\u003c/p\u003e\n\u003cp\u003eCó TK 622 - Chi phí nhân công trực tiếp\u003c/p\u003e\n\u003cp\u003eCó TK 623 - Chi phí sử dụng máy thi công\u003c/p\u003e\n\u003cp\u003eCó TK 627 - Chi phí sản xuất chung.\u003c/p\u003e\n\u003cp\u003e- Khi công việc sửa chữa và bảo hành công trình hoàn thành bàn giao cho khách hàng, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 335 - Chi phí phải trả (Nếu đã trích trước)\u003c/p\u003e\n\u003cp\u003eCó TK 154 - Chi phí sản xuất, kinh doanh dở dang.\u003c/p\u003e\n\u003cp\u003e- Hết thời hạn bảo hành công trình xây, lắp, nếu công trình không phải bảo hành hoặc số trích trước chi phí bảo hành công trình lớn hơn chi phí thực tế phát sinh, phải hoàn nhập số trích trước về chi phí bảo hành còn lại, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 335 - Chi phí phải trả\u003c/p\u003e\n\u003cp\u003eCó TK 711 - Thu nhập khác.\u003c/p\u003e\n\u003cp\u003e2.2.7. Khi tạm ứng tiền cho nhà thầu phụ trước khi hợp đồng phụ hoàn thành, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 331- Phải trả cho người bán\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112,...\u003c/p\u003e\n\u003cp\u003e2.2.8. Trường hợp xuất hiện nghi ngờ về khả năng không thu được một khoản nào đó đã được tính trong doanh thu của hợp đồng và đã ghi trong Báo cáo kết quả hoạt động kinh doanh thì những khoản không có khả năng thu được đó phải được lập dự phòng các khoản phải thu khó đòi. Trường hợp số dự phòng phải thu khó đòi được lập ở cuối kỳ kế toán năm nay lớn hơn số dự phòng phải thu khó đòi đã lập ở cuối kỳ kế toán năm trước chưa sử dụng hết, thì số chênh lệch lớn hơn, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 642 - Chi phí quản lý doanh nghiệp\u003c/p\u003e\n\u003cp\u003eCó TK 139 - Dự phòng phải thu khó đòi.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eTrường hợp số dự phòng phải thu khó đòi được lập ở cuối kỳ kế toán năm nay nhỏ hơn số\u0026nbsp; dự phòng phải thu khó đòi đã lập ở cuối kỳ kế toán năm trước chưa sử dụng hết thì số chênh lệch nhỏ hơn phải được hoàn nhập, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 139 - Dự phòng phải thu khó đòi\u003c/p\u003e\n\u003cp\u003eCó TK 642 - Chi phí quản lý doanh nghiệp.\u003c/p\u003e\n\u003cp\u003e2.2.9. Các chi phí của hợp đồng không thể thu hồi (Ví dụ như không đủ tính thực thi về mặt pháp lý như có sự nghi ngờ về hiệu lực của nó, hoặc hợp đồng mà khách hàng không thể thực thi nghĩa vụ của mình...) phải được ghi nhận ngay là chi phí trong kỳ, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 632 - Giá vốn hàng bán\u003c/p\u003e\n\u003cp\u003eCó TK 154 - Chi phí sản xuất, kinh doanh dở dang.\u003c/p\u003e\n\u003cp\u003e2.2.10. Chi phí liên quan trực tiếp đến từng hợp đồng có thể được giảm nếu có các khoản thu khác không bao gồm trong doanh thu của hợp đồng. Ví dụ: các khoản thu từ việc bán nguyên, vật liệu thừa và thanh lý máy móc, thiết bị thi công khi kết thúc hợp đồng xây dựng:\u003c/p\u003e\n\u003cp\u003ea) Nhập kho nguyên, vật liệu thừa khi kết thúc hợp đồng xây dựng, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 152 - Nguyên liệu, vật liệu (Theo giá gốc)\u003c/p\u003e\n\u003cp\u003eCó TK 154 - Chi phí sản xuất, kinh doanh dở dang.\u003c/p\u003e\n\u003cp\u003eb) Phế liệu thu hồi nhập kho, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 152 - Nguyên liệu, vật liệu (Theo giá có thể thu hồi)\u003c/p\u003e\n\u003cp\u003eCó TK 154 - Chi phí sản xuất, kinh doanh dở dang.\u003c/p\u003e\n\u003cp\u003ec) Trường hợp vật liệu thừa và phế liệu thu hồi không qua nhập kho mà tiêu thụ ngay, kế toán phản ánh các khoản thu bán vật liệu thừa và phế liệu, ghi giảm chi phí:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111, 112, 131 (Tổng giá thanh toán)\u003c/p\u003e\n\u003cp\u003eCó TK 3331 - Thuế GTGT phải nộp\u003c/p\u003e\n\u003cp\u003eCó TK 154 - Chi phí sản xuất, kinh doanh dở dang (Giá bán chưa có thuế GTGT).\u003c/p\u003e\n\u003cp\u003ed) Kế toán thanh lý máy móc, thiết bị thi công chuyên dùng cho một hợp đồng xây dựng và đã trích khấu hao hết vào giá trị hợp đồng khi kết thúc hợp đồng xây dựng, ghi:\u003c/p\u003e\n\u003cp\u003e+ Phản ánh số thu về thanh lý máy móc, thiết bị thi công, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111, 112, 131\u003c/p\u003e\n\u003cp\u003eCó TK 3331 - Thuế GTGT phải nộp\u003c/p\u003e\n\u003cp\u003eCó TK 154 - Chi phí sản xuất, kinh doanh dở dang\u003c/p\u003e\n\u003cp\u003e(Giá bán chưa có thuế GTGT).\u003c/p\u003e\n\u003cp\u003e+ Phản ánh chi phí thanh lý máy móc, thiết bị (nếu có), ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 154 - Chi phí sản xuất, kinh doanh dở dang\u003c/p\u003e\n\u003cp\u003eNợ TK 133 Thuế GTGT được khấu trừ\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112…\u003c/p\u003e\n\u003cp\u003e+ Ghi giảm TSCĐ là máy móc, thiết bị thi công chuyên dùng đã thanh lý, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 214 - Hao mòn TSCĐ\u003c/p\u003e\n\u003cp\u003eCó TK 211 - TSCĐ hữu hình.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eIV. HƯỚNG DẪN KẾ TOÁN CHUẨN MỰC \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\"CHI PHÍ ĐI VAY\"\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eA. HẠCH TOÁN CHI PHÍ ĐI VAY PHẢI TÔN TRỌNG\u003cbr\u003e\n   MỘT SỐ QUY ĐỊNH SAU\u003c/strong\u003e\u003cstrong\u003e:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e1. Chi phí đi vay phải ghi nhận vào chi phí sản xuất, kinh doanh trong kỳ khi phát sinh, trừ khi được vốn hoá theo quy định.\u003c/p\u003e\n\u003cp\u003e2. Chi phí đi vay liên quan đến tài sản dở dang khi có đủ các điều kiện vốn hoá thì đơn vị phải thực hiện theo đúng quy định tại chuẩn mực kế toán \"Chi phí đi vay\" về định nghĩa tài sản dở dang, xác định chi phí đi vay được vốn hoá, thời điểm bắt đầu vốn hoá, tạm ngừng vốn hoá và chấm dứt việc vốn hoá.\u003c/p\u003e\n\u003cp\u003e3. Chi phí đi vay liên quan trực tiếp đến việc đầu tư xây dựng hoặc sản xuất tài sản dở dang được tính vào giá trị của tài sản đó (được vốn hoá), bao gồm các khoản lãi tiền vay, phân bổ các khoản chiết khấu hoặc phụ trội khi phát hành trái phiếu, các khoản chi phí phụ phát sinh liên quan tới quá trình làm thủ tục vay.\u003c/p\u003e\n\u003cp\u003e4. Đơn vị phải xác định chi phí đi vay được vốn hoá theo đúng quy định hiện hành của chuẩn mực kế toán cho hai trường hợp: (1) Khoản vay vốn riêng biệt sử dụng cho mục đích đầu tư xây dựng hoặc sản xuất một tài sản dở dang và (2) Các khoản vốn vay chung trong đó có sử dụng cho mục đích đầu tư xây dựng hoặc sản xuất một tài sản dở dang.\u003c/p\u003e\n\u003cp\u003eCác khoản thu nhập phát sinh do đầu tư tạm thời các khoản vay riêng biệt trong khi chờ sử dụng vào mục đích có được tài sản dở dang thì phải ghi giảm trừ (-) vào chi phí đi vay phát sinh khi vốn hoá.\u003c/p\u003e\n\u003cp\u003e- Vốn hoá chi phí đi vay đối với khoản vốn vay riêng biệt:\u003c/p\u003e\n\u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\"\u003e\n \u003ctbody\u003e\n  \u003ctr\u003e\n   \u003ctd style=\"width:151px;\"\u003e\n    \u003cp\u003eChi phí đi vay được vốn hoá cho mỗi kỳ kế toán\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:28px;\"\u003e\n    \u003cp\u003e\u003cbr\u003e\n      =\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:170px;\"\u003e\n    \u003cp\u003eChi phí đi vay thực tế phát sinh của khoản vay riêng biệt\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:28px;\"\u003e\n    \u003cp\u003e\u003cbr\u003e\n      -\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:180px;\"\u003e\n    \u003cp\u003eThu nhập phát sinh từ hoạt động đầu tư tạm thời của các khoản vay đó\u003c/p\u003e\u003c/td\u003e\n  \u003c/tr\u003e\n \u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e- Vốn hoá chi phí đi vay đối với các khoản vốn vay chung:\u003c/p\u003e\n\u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\"\u003e\n \u003ctbody\u003e\n  \u003ctr\u003e\n   \u003ctd colspan=\"5\" style=\"width:142px;\"\u003e\n    \u003cp\u003eSố chi phí đi vay được vốn hoá cho mỗi kỳ kế toán (1)\u003c/p\u003e\u003c/td\u003e\n   \u003ctd colspan=\"2\" style=\"width:28px;\"\u003e\n    \u003cp\u003e\u003cbr\u003e\n      =\u003c/p\u003e\u003c/td\u003e\n   \u003ctd colspan=\"4\" style=\"width:255px;\"\u003e\n    \u003cp\u003eChi phí luỹ kế bình quân gia quyền phát sinh cho đầu tư xây dựng hoặc sản xuất tài sản dở dang cho đến\u003cbr\u003e\n      cuối kỳ kế toán (2)\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:38px;\"\u003e\n    \u003cp\u003e\u003cbr\u003e\n      x\u003c/p\u003e\u003c/td\u003e\n   \u003ctd colspan=\"2\" style=\"width:95px;\"\u003e\n    \u003cp\u003eTỷ lệ vốn hoá (%)\u003cbr\u003e\n      (3)\u003c/p\u003e\u003c/td\u003e\n  \u003c/tr\u003e\n  \u003ctr\u003e\n   \u003ctd colspan=\"2\" style=\"width:113px;\"\u003e\n    \u003cp\u003eChi phí luỹ kế bình quân gia quyền (2)\u003c/p\u003e\u003c/td\u003e\n   \u003ctd colspan=\"5\" style=\"width:57px;\"\u003e\n    \u003cp\u003e\u003cbr\u003e\n      = S\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:94px;\"\u003e\n    \u003cp\u003eChi phí cho\u0026nbsp; từng tài sản (4)\u003c/p\u003e\u003c/td\u003e\n   \u003ctd colspan=\"2\" style=\"width:38px;\"\u003e\n    \u003cp\u003eX\u003c/p\u003e\u003c/td\u003e\n   \u003ctd colspan=\"4\" style=\"width:255px;\"\u003e\n    \u003cp\u003eSố tháng chi phí thực tế phát sinh trong kỳ kế toán (5)\u003c/p\u003e\n    \u003cp\u003eSố tháng phát sinh của kỳ kế toán (6)\u003c/p\u003e\u003c/td\u003e\n  \u003c/tr\u003e\n  \u003ctr\u003e\n   \u003ctd style=\"width:95px;\"\u003e\n    \u003cp\u003eTỷ lệ vốn hoá (%) (3)\u003c/p\u003e\n    \u003cp\u003e\u003cimg height=\"2\" src=\"file:///C:/Users/User/AppData/Local/Temp/msohtml1/01/clip_image001.gif\" width=\"2\"\u003e\u003c/p\u003e\u003c/td\u003e\n   \u003ctd colspan=\"2\" style=\"width:28px;\"\u003e\n    \u003cp\u003e=\u003c/p\u003e\u003c/td\u003e\n   \u003ctd colspan=\"9\" style=\"width:340px;\"\u003e\n    \u003cp\u003eTổng số tiền lãi vay thực tế của các khoản vay phát sinh trong kỳ (7)\u003c/p\u003e\n    \u003cp\u003eSố dư bình quân gia quyền các khoản vay gốc (8)\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:28px;\"\u003e\n    \u003cp\u003ex\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:66px;\"\u003e\n    \u003cp\u003e100%\u003c/p\u003e\u003c/td\u003e\n  \u003c/tr\u003e\n  \u003ctr\u003e\n   \u003ctd colspan=\"4\" style=\"width:132px;\"\u003e\n    \u003cp\u003eSố dư bình quân gia quyền các khoản vay gốc (8)\u003c/p\u003e\u003c/td\u003e\n   \u003ctd colspan=\"2\" style=\"width:28px;\"\u003e\n    \u003cp\u003e=\u003c/p\u003e\u003c/td\u003e\n   \u003ctd colspan=\"3\" style=\"width:113px;\"\u003e\n    \u003cp\u003eSố dư của từng khoản vay gốc (9)\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:28px;\"\u003e\n    \u003cp\u003eX\u003c/p\u003e\u003c/td\u003e\n   \u003ctd colspan=\"4\" style=\"width:255px;\"\u003e\n    \u003cp\u003eSố tháng mà từng khoản vay phát sinh trong kỳ kế toán (5)\u003c/p\u003e\n    \u003cp\u003eSố tháng phát sinh của kỳ kế toán (6)\u003c/p\u003e\u003c/td\u003e\n  \u003c/tr\u003e\n  \u003ctr height=\"0\"\u003e\n   \u003ctd\u003e\u0026nbsp;\u003c/td\u003e\n   \u003ctd\u003e\u0026nbsp;\u003c/td\u003e\n   \u003ctd\u003e\u0026nbsp;\u003c/td\u003e\n   \u003ctd\u003e\u0026nbsp;\u003c/td\u003e\n   \u003ctd\u003e\u0026nbsp;\u003c/td\u003e\n   \u003ctd\u003e\u0026nbsp;\u003c/td\u003e\n   \u003ctd\u003e\u0026nbsp;\u003c/td\u003e\n   \u003ctd\u003e\u0026nbsp;\u003c/td\u003e\n   \u003ctd\u003e\u0026nbsp;\u003c/td\u003e\n   \u003ctd\u003e\u0026nbsp;\u003c/td\u003e\n   \u003ctd\u003e\u0026nbsp;\u003c/td\u003e\n   \u003ctd\u003e\u0026nbsp;\u003c/td\u003e\n   \u003ctd\u003e\u0026nbsp;\u003c/td\u003e\n   \u003ctd\u003e\u0026nbsp;\u003c/td\u003e\n  \u003c/tr\u003e\n \u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e5. Nếu có phát sinh các khoản chiết khấu hoặc phụ trội của những khoản vay bằng phát hành trái phiếu thì phải điều chỉnh lại chi phí đi vay bằng cách phân bổ giá trị các khoản chiết khấu hoặc phụ trội theo một trong hai phương pháp cho phù hợp (phương pháp lãi suất thực tế hoặc phương pháp đường thẳng). Tuy nhiên doanh nghiệp phải áp dụng nhất quán phương pháp đã lựa chọn trong một kỳ kế toán năm.\u003c/p\u003e\n\u003cp\u003e6. Việc vốn hoá chi phí đi vay sẽ được tạm ngừng lại trong các giai đoạn mà quá trình đầu tư xây dựng hoặc sản xuất tài sản dở dang bị gián đoạn, trừ khi sự gián đoạn đó là cần thiết.\u003c/p\u003e\n\u003cp\u003e7. Việc vốn hoá chi phí đi vay sẽ chấm dứt khi các hoạt động chủ yếu cần thiết cho việc chuẩn bị đưa tài sản dở dang vào sử dụng hoặc bán đã hoàn thành. Chi phí đi vay phát sinh sau đó sẽ được ghi nhận là chi phí sản xuất, kinh doanh trong kỳ khi phát sinh.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eB. PHƯƠNG PHÁP KẾ TOÁN\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1. Kế toán chi phí đi vay\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1.1.\u0026nbsp; Trường hợp chi phí đi vay ghi vào chi phí sản xuất, kinh doanh trong kỳ\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ea)\u0026nbsp; Đối với chi phí lãi vay:\u003c/p\u003e\n\u003cp\u003e- Trường hợp đơn vị phải thanh toán định kỳ lãi tiền vay cho bên cho vay, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 635 - Chi phí tài chính\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112,...\u003c/p\u003e\n\u003cp\u003e- Trường hợp đơn vị trả trước lãi tiền vay cho bên cho vay, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 142 - Chi phí trả trước (Nếu trả trước ngắn hạn lãi tiền vay)\u003c/p\u003e\n\u003cp\u003eNợ TK 242 - Chi phí trả trước dài hạn (Nếu trả trước dài hạn lãi tiền vay)\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112,...\u003c/p\u003e\n\u003cp\u003e- Định kỳ, khi phân bổ lãi tiền vay theo số phải trả từng kỳ vào chi phí tài chính, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 635 - Chi phí tài chính\u003c/p\u003e\n\u003cp\u003eCó TK 142 - Chi phí trả trước\u003c/p\u003e\n\u003cp\u003eCó TK 242 - Chi phí trả trước dài hạn.\u003c/p\u003e\n\u003cp\u003e- Trường hợp lãi tiền vay đơn vị trả sau cho bên cho vay (trả gốc và lãi khi hết thời hạn vay theo khế ước):\u003c/p\u003e\n\u003cp\u003e+ Định kỳ, khi tính lãi tiền vay phải trả từng kỳ để tính vào chi phí tài chính, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 635 - Chi phí tài chính\u003c/p\u003e\n\u003cp\u003eCó TK 335 - Chi phí phải trả.\u003c/p\u003e\n\u003cp\u003e+ Hết thời hạn vay, khi đơn vị trả gốc vay và lãi tiền vay dài hạn, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 315 - Nợ dài hạn đến hạn trả (Nếu trả dần gốc vay dài hạn đến hạn trả)\u003c/p\u003e\n\u003cp\u003eNợ TK 341 - Vay dài hạn (Gốc vay dài hạn còn phải trả)\u003c/p\u003e\n\u003cp\u003eNợ TK 335 - Chi phí phải trả (Lãi tiền vay)\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112,...\u003c/p\u003e\n\u003cp\u003eb) Trường hợp đơn vị thanh toán định kỳ tiền thuê tài chính cho bên cho thuê, kế toán chi phí tiền lãi thuê tài chính được thực hiện theo quy định tại điểm 2.2\u0026nbsp; mục B phần I của Thông tư này.\u003c/p\u003e\n\u003cp\u003ec) Trường hợp đơn vị thanh toán định kỳ lãi trả chậm của tài sản mua theo phương thức trả chậm, trả góp cho bên bán:\u003c/p\u003e\n\u003cp\u003e- Khi mua TSCĐ theo phương thức trả chậm, trả góp về sử dụng ngay cho hoạt động SXKD, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 211, 213 (Nguyên giá - ghi theo giá mua trả tiền ngay)\u003c/p\u003e\n\u003cp\u003eNợ TK 133 - Thuế GTGT được khấu trừ (nếu có)\u003c/p\u003e\n\u003cp\u003eNợ TK 242 - Chi phí trả trước dài hạn (Phần lãi trả chậm là số chênh lệch giữa tổng số tiền phải thanh toán trừ (-) giá mua trả tiền ngay trừ (-) thuế GTGT (nếu được khấu trừ))\u003c/p\u003e\n\u003cp\u003eCó TK 331 - Phải trả cho người bán (Tổng giá thanh toán).\u003c/p\u003e\n\u003cp\u003e- Định kỳ, tính vào chi phí tài chính theo số lãi trả chậm, trả góp phải trả của từng kỳ, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 635 - Chi phí tài chính\u003c/p\u003e\n\u003cp\u003eCó TK 242 - Chi phí trả trước dài hạn.\u003c/p\u003e\n\u003cp\u003ed) Trong kỳ, nếu đơn vị nhận được các khoản hỗ trợ lãi suất đi vay của Nhà nước cho hoạt động kinh doanh, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111, 112,...\u003c/p\u003e\n\u003cp\u003eCó TK 515 - Doanh thu hoạt động tài chính.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1.2. Trường hợp chi phí đi vay đủ điều kiện vốn hoá\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChi phí đi vay liên quan trực tiếp đến việc đầu tư xây dựng hoặc sản xuất tài sản dở dang khi có đủ các điều kiện được vốn hoá theo quy định thì xử lý như sau:\u003c/p\u003e\n\u003cp\u003ea) Đối với khoản vốn vay riêng biệt, chi phí đi vay được vốn hoá cho tài sản dở dang được xác định là chi phí đi vay thực tế phát sinh từ các khoản vay trừ (-) đi các khoản thu nhập phát sinh từ hoạt động đầu tư tạm thời của các khoản vay này, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111, 112 (Các khoản thu nhập phát sinh do đầu tư tạm thời)\u003c/p\u003e\n\u003cp\u003eNợ TK 241 - Xây dựng cơ bản dở dang (Tài sản đầu tư xây dựng dở dang)\u003c/p\u003e\n\u003cp\u003eNợ TK 627 - Chi phí sản xuất chung (Tài sản đang sản xuất dở dang)\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112 (Nếu trả lãi vay định kỳ)\u003c/p\u003e\n\u003cp\u003eCó TK 142 - Chi phí trả trước (Chi phí đi vay phải trả trong kỳ - nếu trả trước ngắn hạn chi phí đi vay)\u003c/p\u003e\n\u003cp\u003eCó TK 242 - Chi phí trả trước dài hạn (Phân bổ chi phí đi vay phải trả trong kỳ - nếu trả trước dài hạn chi phí đi vay)\u003c/p\u003e\n\u003cp\u003eCó TK 335 - Chi phí phải trả (Trích trước chi phí đi vay phải trả trong kỳ - nếu chi phí đi vay trả sau).\u003c/p\u003e\n\u003cp\u003eb) Đối với các khoản vốn vay chung, chi phí đi vay được vốn hoá là toàn bộ chi phí đi vay liên quan trực tiếp đến đầu tư, xây dựng hoặc sản xuất tài sản dở dang được tính vào chi phí đầu tư XDCB hoặc chi phí sản xuất sản phẩm mà không phải điều chỉnh các khoản thu nhập phát sinh do đầu tư tạm thời, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 241 - Xây dựng cơ bản dở dang\u003c/p\u003e\n\u003cp\u003eNợ TK 627 - Chi phí sản xuất chung\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112 (Nếu trả lãi vay định kỳ)\u003c/p\u003e\n\u003cp\u003eCó TK 142 - Chi phí trả trước (Chi phí đi vay phải trả trong kỳ - nếu trả trước ngắn hạn chi phí đi vay)\u003c/p\u003e\n\u003cp\u003eCó TK 242 - Chi phí trả trước dài hạn (Phân bổ chi phí đi vay phải trả trong kỳ - nếu trả trước dài hạn chi phí đi vay)\u003c/p\u003e\n\u003cp\u003eCó TK 335 - Chi phí phải trả (Trích trước chi phí đi vay phải trả trong kỳ - nếu chi phí đi vay trả sau).\u003c/p\u003e\n\u003cp\u003e- Các khoản thu nhập phát sinh từ hoạt động đầu tư tạm thời của các khoản vốn vay chung, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111, 112\u003c/p\u003e\n\u003cp\u003eCó TK 515 - Doanh thu hoạt động tài chính.\u003c/p\u003e\n\u003cp\u003e1.3. Chi phí đi vay liên quan trực tiếp đến tài sản dở dang trong các giai đoạn mà quá trình đầu tư xây dựng hoặc sản xuất tài sản dở dang bị gián đoạn một cách bất thường hoặc kể từ khi chấm dứt vốn hoá phải tính vào chi phí tài chính, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 635 - Chi phí tài chính\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112, 142, 242, 335,…\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. Kế toán chi phí đi vay trong trường hợp phát hành trái phiếu công ty\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.1. Các trường hợp phát hành trái phiếu công ty \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eKhi doanh nghiệp vay vốn bằng phát hành trái phiếu có thể xảy ra 3 trường hợp:\u003c/p\u003e\n\u003cp\u003e- Phát hành trái phiếu ngang giá (giá phát hành bằng mệnh giá): Là phát hành trái phiếu với giá đúng bằng mệnh giá của trái phiếu. Trường hợp này thường xảy ra khi lãi suất thị trường bằng lãi suất danh nghĩa của trái phiếu phát hành;\u003c/p\u003e\n\u003cp\u003e- Phát hành trái phiếu có chiết khấu (giá phát hành nhỏ hơn mệnh giá): Là phát hành trái phiếu với giá nhỏ hơn mệnh giá của trái phiếu. Phần chênh lệch giữa giá phát hành trái phiếu nhỏ hơn mệnh giá của trái phiếu gọi là chiết khấu trái phiếu. Trường hợp này thường xảy ra khi lãi suất thị trường lớn hơn lãi suất danh nghĩa;\u003c/p\u003e\n\u003cp\u003e- Phát hành trái phiếu có phụ trội (giá phát hành lớn hơn mệnh giá): Là phát hành trái phiếu với giá lớn hơn mệnh giá của trái phiếu. Phần chênh lệch giữa giá phát hành trái phiếu lớn hơn mệnh giá của trái phiếu gọi là phụ trội trái phiếu. Trường hợp này thường xảy ra khi lãi suất thị trường nhỏ hơn lãi suất danh nghĩa.\u003c/p\u003e\n\u003cp\u003eChiết khấu và phụ trội trái phiếu chỉ phát sinh khi doanh nghiệp đi vay bằng hình thức phát hành trái phiếu và tại thời điểm phát hành có sự chênh lệch giữa lãi suất thị trường và lãi suất danh nghĩa được các nhà đầu tư mua trái phiếu chấp nhận.\u003c/p\u003e\n\u003cp\u003eChiết khấu và phụ trội trái phiếu được xác định và ghi nhận ngay tại thời điểm phát hành trái phiếu. Sự chênh lệch giữa lãi suất thị trường và lãi suất danh nghĩa sau thời điểm phát hành trái phiếu không ảnh hưởng đến giá trị khoản phụ trội hay chiết khấu đã xác định.\u003c/p\u003e\n\u003cp\u003e- Chiết khấu trái phiếu được phân bổ dần để tính vào chi phí đi vay từng kỳ trong suốt thời hạn của trái phiếu.\u003c/p\u003e\n\u003cp\u003e- Phụ trội trái phiếu được phân bổ dần để giảm trừ chi phí đi vay từng kỳ trong suốt thời hạn của trái phiếu.\u003c/p\u003e\n\u003cp\u003e- Trường hợp chi phí lãi vay của trái phiếu đủ điều kiện vốn hoá, các khoản lãi tiền vay và khoản phân bổ chiết khấu hoặc phụ trội được vốn hoá trong từng kỳ không được vượt quá số lãi vay thực tế phát sinh và số phân bổ chiết khấu hoặc phụ trội trong kỳ đó.\u003c/p\u003e\n\u003cp\u003e- Việc phân bổ khoản chiết khấu hoặc phụ trội có thể sử dụng phương pháp lãi suất thực tế hoặc phương pháp đường thẳng.\u003c/p\u003e\n\u003cp\u003e+ Theo phương pháp lãi suất thực tế: Khoản chiết khấu hoặc phụ trội phân bổ vào mỗi kỳ được tính bằng chênh lệch giữa chi phí lãi vay phải trả cho mỗi kỳ trả lãi (được tính bằng giá trị ghi sổ đầu kỳ của trái phiếu nhân (x) với tỷ lệ lãi thực tế trên thị trường) với số tiền phải trả từng kỳ.\u003c/p\u003e\n\u003cp\u003e+ Theo phương pháp đường thẳng: Khoản chiết khấu hoặc phụ trội phân bổ đều trong suốt kỳ hạn của trái phiếu.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.2. Bổ sung thêm Tài khoản 343 - Trái phiếu phát hành\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eTài khoản này dùng để phản ánh tình hình phát hành trái phiếu và thanh toán trái phiếu của doanh nghiệp. Tài khoản này cũng dùng để phản ánh các khoản chiết khấu, phụ trội trái phiếu phát sinh khi phát hành trái phiếu và tình hình phân bổ các khoản chiết khấu, phụ trội khi xác định chi phí đi vay tính vào chi phí sản xuất, kinh doanh hoặc vốn hoá theo từng kỳ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eHạch toán Tài khoản 343 – Trái phiếu phát hành cần tôn trọng một số quy định sau:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eTK 343 chỉ áp dụng ở doanh nghiệp có vay vốn bằng phương thức phát hành trái phiếu.\u003c/p\u003e\n\u003cp\u003eTK 343 phải phản ánh chi tiết các nội dung có liên quan đến trái phiếu phát hành, gồm:\u003c/p\u003e\n\u003cp\u003e- Mệnh giá trái phiếu;\u003c/p\u003e\n\u003cp\u003e- Chiết khấu trái phiếu;\u003c/p\u003e\n\u003cp\u003e- Phụ trội trái phiếu.\u003c/p\u003e\n\u003cp\u003eĐồng thời theo dõi chi tiết theo thời hạn phát hành trái phiếu.\u003c/p\u003e\n\u003cp\u003eDoanh nghiệp phải theo dõi chiết khấu và phụ trội cho từng loại trái phiếu phát hành và tình hình phân bổ từng khoản chiết khấu, phụ trội khi xác định chi phí đi vay tính vào chi phí SXKD hoặc vốn hoá theo từng kỳ.\u003c/p\u003e\n\u003cp\u003eTrường hợp trả lãi khi đáo hạn trái phiếu thì định kỳ doanh nghiệp phải tính lãi trái phiếu phải trả từng kỳ để ghi nhận vào chi phí sản xuất, kinh doanh hoặc vốn hoá vào giá trị của tài sản dở dang.\u003c/p\u003e\n\u003cp\u003e5. Khi lập báo cáo tài chính, trên Bảng cân đối kế toán trong phần nợ phải trả thì chỉ tiêu trái phiếu phát hành được phản ánh trên cơ sở thuần (xác định bằng trị giá trái phiếu theo\u0026nbsp; mệnh giá trừ (-) chiết khấu trái phiếu cộng (+) phụ trội trái phiếu).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eKết cấu và nội dung phản ánh của Tài khoản 343 - Trái phiếu phát hành\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBên Nợ:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThanh toán trái phiếu khi đáo hạn;\u003c/p\u003e\n\u003cp\u003eChiết khấu trái phiếu phát sinh trong kỳ;\u003c/p\u003e\n\u003cp\u003ePhân bổ phụ trội trái phiếu trong kỳ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBên Có: \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eTrị giá trái phiếu phát hành theo mệnh giá trong kỳ;\u003c/p\u003e\n\u003cp\u003ePhân bổ chiết khấu trái phiếu trong kỳ;\u003c/p\u003e\n\u003cp\u003ePhụ trội trái phiếu phát sinh trong kỳ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSố dư bên Có: \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eTrị giá khoản nợ vay do phát hành trái phiếu đến thời điểm cuối kỳ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTài khoản này có 3 Tài khoản cấp 2:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eTK 3431 - Mệnh giá trái phiếu\u003c/p\u003e\n\u003cp\u003eTK 3432 - Chiết khấu trái phiếu\u003c/p\u003e\n\u003cp\u003eTK 3433 - Phụ trội trái phiếu\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTài khoản 3431 - Mệnh giá trái phiếu:\u003c/strong\u003e Tài khoản này dùng để phản ánh trị giá trái phiếu phát hành theo mệnh giá khi doanh nghiệp đi vay bằng hình thức phát hành trái phiếu và việc thanh toán trái phiếu đáo hạn trong kỳ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eKết cấu và nội dung phản ánh của Tài khoản 3431 - Mệnh giá trái phiếu\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBên Nợ:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThanh toán trái phiếu khi đáo hạn.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBên Có: \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eTrị giá trái phiếu phát hành theo mệnh giá trong kỳ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSố dư bên Có: \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eTrị giá trái phiếu đã phát hành theo mệnh giá cuối kỳ.\u003c/p\u003e\n\u003cp\u003eTài khoản 3432 - Chiết khấu trái phiếu: Tài khoản này dùng để phản ánh chiết khấu trái phiếu phát sinh khi doanh nghiệp đi vay bằng hình thức phát hành trái phiếu có chiết khấu và việc phân bổ chiết khấu trái phiếu trong kỳ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eKết cấu và nội dung phản ánh của TK 3432 - Chiết khấu trái phiếu\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBên Nợ:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChiết khấu trái phiếu phát sinh trong kỳ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBên Có: \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ePhân bổ chiết khấu trái phiếu trong kỳ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSố dư bên Nợ: \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChiết khấu trái phiếu chưa phân bổ cuối kỳ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTài khoản 3433 - Phụ trội trái phiếu:\u003c/strong\u003e Tài khoản này dùng để phản ánh phụ trội trái phiếu phát sinh khi doanh nghiệp đi vay bằng hình thức phát hành trái phiếu có chiết khấu và việc phân bổ phụ trội trái phiếu trong kỳ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eKết cấu và nội dung phản ánh của TK 3433 - Phụ trội trái phiếu\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBên Nợ: \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ePhân bổ phụ trội trái phiếu trong kỳ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBên Có: \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ePhụ trội trái phiếu phát sinh trong kỳ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSố dư bên Có: \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ePhụ trội trái phiếu chưa phân bổ cuối kỳ.\u003c/p\u003e\n\u003cp\u003e2.3. Kế toán trường hợp phát hành trái phiếu theo mệnh giá\u003c/p\u003e\n\u003cp\u003ea) Phản ánh số tiền thu về phát hành trái phiếu, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111, 112 (Số tiền thu về bán trái phiếu)\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eCó TK 3431 - Mệnh giá trái phiếu.\u003c/p\u003e\n\u003cp\u003eb) Nếu trả lãi trái phiếu định kỳ, khi trả lãi tính vào chi phí SXKD hoặc vốn hoá, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 635 - Chi phí tài chính (Nếu tính vào chi phí tài chính trong kỳ)\u003c/p\u003e\n\u003cp\u003eNợ TK 241 - Xây dựng cơ bản dở dang (Nếu được vốn hoá vào giá trị tài sản\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eđầu tư xây dựng dở dang)\u003c/p\u003e\n\u003cp\u003eNợ TK 627 - Chi phí sản xuất chung (Nếu được vốn hoá vào giá trị tài sản sản xuất dở dang)\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112 (Số tiền trả lãi trái phiếu trong kỳ).\u003c/p\u003e\n\u003cp\u003ec) Nếu trả lãi trái phiếu sau (khi trái phiếu đáo hạn), từng kỳ doanh nghiệp phải tính trước chi phí lãi vay phải trả trong kỳ vào chi phí SXKD hoặc vốn hoá, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 635 – Chi phí tài chính (Nếu tính vào chi phí tài chính trong kỳ)\u003c/p\u003e\n\u003cp\u003eNợ các TK 241, 627 (Nếu được vốn hoá vào giá trị tài sản dở dang)\u003c/p\u003e\n\u003cp\u003eCó TK 335 - Chi phí phải trả (Phần lãi trái phiếu phải trả trong kỳ).\u003c/p\u003e\n\u003cp\u003e- Cuối thời hạn của trái phiếu, doanh nghiệp thanh toán gốc và lãi trái phiếu cho người mua trái phiếu, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 335 - Chi phí phải trả (Tổng số tiền lãi trái phiếu)\u003c/p\u003e\n\u003cp\u003eNợ TK 3431 - Mệnh giá trái phiếu\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112,...\u003c/p\u003e\n\u003cp\u003ed) Trường hợp trả trước lãi trái phiếu ngay khi phát hành, chi phí lãi vay được phản ánh vào bên Nợ TK 242 (Chi tiết lãi trái phiếu trả trước), sau đó phân bổ dần vào các đối tượng chịu chi phí.\u003c/p\u003e\n\u003cp\u003e- Tại thời điểm phát hành trái phiếu, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111, 112 (Tổng số tiền thực thu)\u003c/p\u003e\n\u003cp\u003eNợ TK 242 (Chi tiết lãi trái phiếu trả trước)\u003c/p\u003e\n\u003cp\u003eCó TK 3431 - Mệnh giá trái phiếu.\u003c/p\u003e\n\u003cp\u003e- Định kỳ, phân bổ lãi trái phiếu trả trước vào chi phí đi vay từng kỳ, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 635 - Chi phí tài chính (Nếu tính vào chi phí tài chính trong kỳ)\u003c/p\u003e\n\u003cp\u003eNợ TK 241- Xây dựng cơ bản dở dang (Nếu được vốn hoá vào giá trị tài sản\u003c/p\u003e\n\u003cp\u003eđầu tư xây dựng dở dang) \u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eNợ TK 627 - Chi phí sản xuất chung (Nếu được vốn hoá vào giá trị tài sản sản xuất dở dang)\u003c/p\u003e\n\u003cp\u003eCó TK 242 - Chi phí trả trước dài hạn (Chi tiết lãi trái phiếu trả trước) (Số lãi trái phiếu phân bổ trong kỳ).\u003c/p\u003e\n\u003cp\u003eđ) Chi phí phát hành trái phiếu:\u003c/p\u003e\n\u003cp\u003e- Nếu chi phí phát hành trái phiếu có giá trị nhỏ, tính ngay vào chi phí trong kỳ, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 635 - Chi phí tài chính\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112,...\u003c/p\u003e\n\u003cp\u003e- Nếu chi phí phát hành trái phiếu có giá trị lớn, phải phân bổ dần, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 242 - Chi phí trả trước dài hạn (Chi tiết chi phí phát hành trái phiếu)\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112, ...\u003c/p\u003e\n\u003cp\u003eĐịnh kỳ, phân bổ chi phí phát hành trái phiếu, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 635, 241,627 (Phần phân bổ chi phí phát hành trái phiếu trong kỳ)\u003c/p\u003e\n\u003cp\u003eCó TK 242 - Chi phí trả trước dài hạn (Chi tiết chi phí phát hành trái phiếu).\u003c/p\u003e\n\u003cp\u003ee) Thanh toán trái phiếu khi đáo hạn, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 3431 - Mệnh giá trái phiếu\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112,...\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.4. Kế toán phát hành trái phiếu có chiết khấu\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ea) Phản ánh số tiền thực thu về phát hành trái phiếu, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111, 112\u0026nbsp; (Số tiền thu về bán trái phiếu)\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eNợ TK 3432 - Chiết khấu trái phiếu (Chênh lệch giữa số tiền thu về bán trái phiếu nhỏ hơn mệnh giá trái phiếu)\u003c/p\u003e\n\u003cp\u003eCó TK 3431 - Mệnh giá trái phiếu.\u003c/p\u003e\n\u003cp\u003eb) Trường hợp trả lãi định kỳ, khi trả lãi vay tính vào chi phí SXKD hoặc vốn hoá, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 635 - Chi phí tài chính (Nếu tính vào chi phí tài chính trong kỳ)\u003c/p\u003e\n\u003cp\u003eNợ TK 241 - Xây dựng cơ bản dở dang (Nếu được vốn hoá vào giá trị tài sản đầu tư xây dựng dở dang) \u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eNợ TK 627 - Chi phí sản xuất chung (Nếu được vốn hoá vào giá trị tài sản sản xuất dở dang)\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112 (Số tiền trả lãi trái phiếu trong kỳ)\u003c/p\u003e\n\u003cp\u003eCó TK 3432 - Chiết khấu trái phiếu (Số phân bổ chiết khấu trái phiếu từng kỳ).\u003c/p\u003e\n\u003cp\u003ec) Trường hợp trả lãi sau (khi trái phiếu đáo hạn):\u003c/p\u003e\n\u003cp\u003e- Từng kỳ doanh nghiệp phải tính trước chi phí lãi vay phải trả trong kỳ, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 635 - Chi phí tài chính (Nếu tính vào chi phí tài chính\u0026nbsp; trong kỳ)\u003c/p\u003e\n\u003cp\u003eNợ các TK 241, 627 (Nếu được vốn hoá vào giá trị tài sản dở dang)\u003c/p\u003e\n\u003cp\u003eCó TK 335 - Chi phí phải trả (Phần lãi trái phiếu phải trả trong kỳ)\u003c/p\u003e\n\u003cp\u003eCó TK 3432- Chiết khấu trái phiếu (Số phân bổ chiết khấu trái phiếu trong\u0026nbsp; kỳ).\u003c/p\u003e\n\u003cp\u003e- Cuối thời hạn của trái phiếu, doanh nghiệp phải thanh toán gốc và lãi trái phiếu cho người mua trái phiếu, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 335 - Chi phí phải trả (Tổng số tiền lãi trái phiếu)\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;Nợ TK 3431 - Mệnh giá trái phiếu\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112,...\u003c/p\u003e\n\u003cp\u003ed) Trường hợp trả trước lãi trái phiếu ngay khi phát hành, chi phí lãi vay được phản ánh vào bên Nợ TK 242 (Chi tiết lãi trái phiếu trả trước), sau đó phân bổ dần vào các đối tượng ghi nhận chi phí.\u003c/p\u003e\n\u003cp\u003e- Khi phát hành trái phiếu, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111, 112 (Tổng số tiền thực thu)\u003c/p\u003e\n\u003cp\u003eNợ TK 3432 - Chiết khấu trái phiếu\u003c/p\u003e\n\u003cp\u003eNợ TK 242 (Chi tiết lãi trái phiếu trả trước) (Số tiền lãi trái phiếu trả trước)\u003c/p\u003e\n\u003cp\u003eCó TK 3431 - Mệnh giá trái phiếu.\u003c/p\u003e\n\u003cp\u003e- Định kỳ tính chi phí lãi vay vào chi phí SXKD trong kỳ, hoặc vốn hoá, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 635- Chi phí tài chính (Nếu tính vào chi phí tài chính trong kỳ)\u003c/p\u003e\n\u003cp\u003eNợ TK 241- Xây dựng cơ bản dở dang (Nếu được vốn hoá vào giá trị tài sản đầu tư, xây dựng dở dang)\u003c/p\u003e\n\u003cp\u003eNợ TK 627 - Chi phí sản xuất chung (Nếu được vốn hoá tính vào giá trị tài sản sản xuất dở dang)\u003c/p\u003e\n\u003cp\u003eCó TK 242 (Chi tiết lãi trái phiếu trả trước) (Số lãi trái phiếu phân bổ trong kỳ)\u003c/p\u003e\n\u003cp\u003eCó TK 3432- Chiết khấu trái phiếu (Số phân bổ chiết khấu trái phiếu từng kỳ).\u003c/p\u003e\n\u003cp\u003eđ) Thanh toán trái phiếu khi đáo hạn, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 3431 - Mệnh giá trái phiếu\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112,...\u003c/p\u003e\n\u003cp\u003ee) Kế toán chi phí phát hành trái phiếu được thực hiện theo điểm 2.3(đ) mục B phần IV Thông tư này.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.5. Kế toán phát hành trái phiếu có phụ trội\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ea) Phản ánh số tiền thực thu về phát hành trái phiếu:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111, 112 (Số tiền thu về bán trái phiếu)\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eCó TK 3433 - Phụ trội trái phiếu\u0026nbsp; (Chênh lệch giữa số tiền thực thu về bán trái phiếu lớn hơn mệnh giá trái phiếu)\u003c/p\u003e\n\u003cp\u003eCó TK 3431 - Mệnh giá trái phiếu.\u003c/p\u003e\n\u003cp\u003eb) Trường hợp trả lãi định kỳ:\u003c/p\u003e\n\u003cp\u003e- \u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; Khi trả lãi tính vào chi phí SXKD hoặc vốn hoá, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 635- Chi phí tài chính (Nếu được tính vào chi phí tài chính trong kỳ)\u003c/p\u003e\n\u003cp\u003eNợ TK 241- Xây dựng cơ bản dở dang (Nếu được vốn hoá vào giá trị tài sản đầu tư, xây dựng dở dang)\u003c/p\u003e\n\u003cp\u003eNợ TK 627- Chi phí sản xuất chung (Nếu được vốn hoá vào giá trị tài sản sản xuất dở dang)\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112 (Số tiền trả lãi trái phiếu trong kỳ).\u003c/p\u003e\n\u003cp\u003e- Đồng thời phân bổ dần phụ trội trái phiếu để ghi giảm chi phí đi vay từng kỳ, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 3433 - Phụ trội trái phiếu (số phân bổ dần phụ trội trái phiếu từng kỳ)\u003c/p\u003e\n\u003cp\u003eCó các TK 635, 241, 627.\u003c/p\u003e\n\u003cp\u003ec) Trường hợp trả lãi sau (khi trái phiếu đáo hạn), từng kỳ doanh nghiệp phải\u0026nbsp; ghi nhận trước chi phí lãi vay phải trả trong kỳ.\u003c/p\u003e\n\u003cp\u003e- Khi tính chi phí lãi vay cho các đối tượng ghi nhận chi phí đi vay trong kỳ, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 635, 241, 627\u003c/p\u003e\n\u003cp\u003eCó TK 335 - Chi phí phải trả (Phần lãi trái phiếu phải trả trong kỳ).\u003c/p\u003e\n\u003cp\u003e- Đồng thời phân bổ dần phụ trội trái phiếu để ghi giảm chi phí đi vay từng kỳ, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 3433 - Phụ trội trái phiếu\u003c/p\u003e\n\u003cp\u003eCó các TK 635, 241, 627.\u003c/p\u003e\n\u003cp\u003e- Cuối thời hạn của trái phiếu, doanh nghiệp phải thanh toán gốc và lãi trái phiếu cho người có trái phiếu, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 335 - Chi phí phải trả (Tổng số tiền lãi trái phiếu)\u003c/p\u003e\n\u003cp\u003eNợ TK 3431 - Mệnh giá trái phiếu\u003c/p\u003e\n\u003cp\u003eCó các TK 111, 112,...\u003c/p\u003e\n\u003cp\u003ed) Trường hợp trả trước lãi trái phiếu ngay khi phát hành, chi phí lãi vay được phản ánh vào bên Nợ TK 242 (Chi tiết lãi trái phiếu trả trước), sau đó phân bổ dần vào các đối tượng chịu chi phí.\u003c/p\u003e\n\u003cp\u003e- Khi phát hành trái phiếu, ghi:\u003c/p\u003e\n\u003cp\u003eNợ các TK 111, 112 (Tổng số tiền thực thu)\u003c/p\u003e\n\u003cp\u003eNợ TK 242 (Chi tiết lãi trái phiếu trả trước) (Số tiền lãi trái phiếu trả trước)\u003c/p\u003e\n\u003cp\u003eCó TK 3433 - Phụ trội trái phiếu\u003c/p\u003e\n\u003cp\u003eCó TK 3431 - Mệnh giá trái phiếu.\u003c/p\u003e\n\u003cp\u003e- Định kỳ, tính chi phí lãi vay cho các đối tượng ghi nhận chi phí đi vay trong kỳ, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 635- Chi phí tài chính (Nếu được tính vào chi phí tài chính trong kỳ)\u003c/p\u003e\n\u003cp\u003eNợ TK 241- Xây dựng cơ bản dở dang (Nếu được vốn hoá vào giá trị tài sản đầu tư, xây dựng dở dang) \u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eNợ TK 627 - Chi phí sản xuất chung (Nếu được vốn hoá vào giá trị tài sản sản xuất dở dang)\u003c/p\u003e\n\u003cp\u003eCó TK 242 (Chi tiết lãi trái phiếu trả trước) (Số lãi trái phiếu phân bổ trong kỳ).\u003c/p\u003e\n\u003cp\u003e- Đồng thời phân bổ dần phụ trội trái phiếu ghi giảm chi phí đi vay từng kỳ, ghi:\u003c/p\u003e\n\u003cp\u003eNợ TK 3433 - Phụ trội trái phiếu (Số phân bổ phụ trội trái phiếu từng kỳ)\u003c/p\u003e\n\u003cp\u003eCó các TK 635, 241, 627.\u003c/p\u003e\n\u003cp\u003eđ) Kế toán chi phí phát hành trái phiếu được thực hiện theo điểm 2.3(đ) Mục B – Phần IV Thông tư này..\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eV. HƯỚNG DẪN KẾ TOÁN CHUẨN MỰC\u003cbr\u003e\n   \"BÁO CÁO LƯU CHUYỂN TIỀN TỆ\"\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1. Trách nhiệm lập Báo cáo lưu chuyển tiền tệ \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e- Tất cả các doanh nghiệp thuộc các ngành, các thành phần kinh tế đều phải lập Báo cáo lưu chuyển tiền tệ theo quy định của Chuẩn mực kế toán số 24 \"Báo cáo lưu chuyển tiền tệ\" và hướng dẫn tại Thông tư này.\u003c/p\u003e\n\u003cp\u003e- Riêng đối với các doanh nghiệp là ngân hàng, tổ chức tín dụng và tổ chức tài chính khác, việc lập Báo cáo lưu chuyển tiền tệ được hướng dẫn trong một văn bản riêng.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. Thời hạn lập và gửi Báo cáo lưu chuyển tiền tệ \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThời hạn lập và gửi Báo cáo lưu chuyển tiền tệ được thực hiện theo quy định hiện hành của Chế độ Báo cáo tài chính ban hành theo Quyết định số 167/2000/QĐ-BTC ngày 25/10/2000 của Bộ trưởng Bộ Tài chính.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3. Nguyên tắc lập và trình bày Báo cáo lưu chuyển tiền tệ \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e3.1. Các khoản đầu tư ngắn hạn được coi là tương đương tiền trình bày trên báo cáo lưu chuyển tiền tệ chỉ bao gồm các khoản đầu tư ngắn hạn có thời hạn thu hồi hoặc đáo hạn không quá 3 tháng kể từ ngày mua khoản đầu tư đó. Ví dụ, kỳ phiếu ngân hàng, tín phiếu kho bạc, chứng chỉ tiền gửi… có thời hạn thu hồi hoặc đáo hạn không quá 3 tháng kể từ ngày mua.\u003c/p\u003e\n\u003cp\u003e3.2. Doanh nghiệp phải trình bày các luồng tiền trên Báo cáo lưu chuyển tiền tệ theo ba loại hoạt động: Hoạt động kinh doanh, hoạt động đầu tư và hoạt động tài chính theo quy định của chuẩn mực \"Báo cáo lưu chuyển tiền tệ\":\u003c/p\u003e\n\u003cp\u003e+ Luồng tiền từ hoạt động kinh doanh là luồng tiền phát sinh từ các hoạt động tạo ra doanh thu chủ yếu của doanh nghiệp và các hoạt động khác không phải là các hoạt động đầu tư hay hoạt động tài chính;\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;+ Luồng tiền từ hoạt động đầu tư là luồng tiền phát sinh từ các hoạt động mua sắm, xây dựng, thanh lý, nhượng bán các tài sản dài hạn và các khoản đầu tư khác không thuộc các khoản tương đương tiền;\u003c/p\u003e\n\u003cp\u003e+ Luồng tiền từ hoạt động tài chính là luồng tiền phát sinh từ các hoạt động tạo ra các thay đổi về quy mô và kết cấu của vốn chủ sở hữu và vốn vay của doanh nghiệp.\u003c/p\u003e\n\u003cp\u003e3.3. Doanh nghiệp được trình bày luồng tiền từ các hoạt động kinh doanh, hoạt động đầu tư và hoạt động tài chính theo cách thức phù hợp nhất với đặc điểm kinh doanh của doanh nghiệp.\u003c/p\u003e\n\u003cp\u003e3.4. Các luồng tiền phát sinh từ các hoạt động kinh doanh, hoạt động đầu tư và hoạt động tài chính sau đây được báo cáo trên cơ sở thuần:\u003c/p\u003e\n\u003cp\u003e+ Thu tiền và chi trả tiền hộ khách hàng như tiền thuê thu hộ, chi hộ và trả lại cho chủ sở hữu tài sản; Các quỹ đầu tư giữ cho khách hàng...;\u003c/p\u003e\n\u003cp\u003e+ Thu tiền và chi tiền đối với các khoản có vòng quay nhanh, thời gian đáo hạn ngắn như: Mua, bán ngoại tệ; Mua, bán các khoản đầu tư; Các khoản đi vay hoặc cho vay ngắn hạn khác có thời hạn thanh toán không quá 3 tháng.\u003c/p\u003e\n\u003cp\u003e3.5. Các luồng tiền phát sinh từ các giao dịch bằng ngoại tệ phải được quy đổi ra đồng tiền chính thức trong ghi sổ kế toán và lập báo cáo tài chính theo tỷ giá hối đoái tại thời điểm phát sinh giao dịch. Báo cáo lưu chuyển tiền tệ của các tổ chức hoạt động ở nước ngoài phải được quy đổi ra đồng tiền ghi sổ kế toán và lập báo cáo tài chính của công ty mẹ theo tỷ giá thực tế tại ngày lập Báo cáo lưu chuyển tiền tệ.\u003c/p\u003e\n\u003cp\u003e3.6. Các giao dịch về đầu tư và tài chính không trực tiếp sử dụng tiền hay các khoản tương đương tiền không được trình bày trong Báo cáo lưu chuyển tiền tệ, Ví dụ:\u003c/p\u003e\n\u003cp\u003e(a) Việc mua tài sản bằng cách nhận các khoản nợ liên quan trực tiếp hoặc thông qua nghiệp vụ cho thuê tài chính;\u003c/p\u003e\n\u003cp\u003e(b) Việc mua một doanh nghiệp thông qua phát hành cổ phiếu;\u003c/p\u003e\n\u003cp\u003e(c) Việc chuyển nợ thành vốn chủ sở hữu.\u003c/p\u003e\n\u003cp\u003e3.7. Các khoản mục tiền và tương đương tiền đầu kỳ và cuối kỳ, ảnh hưởng của thay đổi tỷ giá hối đoái quy đổi tiền và các khoản tương đương tiền bằng ngoại tệ hiện có cuối kỳ phải được trình bày thành các chỉ tiêu riêng biệt trên Báo cáo lưu chuyển tiền tệ để đối chiếu số liệu với các khoản mục tương ứng trên Bảng Cân đối kế toán.\u003c/p\u003e\n\u003cp\u003e3.8. Doanh nghiệp phải trình bày giá trị và lý do của các khoản tiền và tương đương tiền có số dư cuối kỳ lớn do doanh nghiệp nắm giữ nhưng không được sử dụng do có sự hạn chế của pháp luật hoặc các ràng buộc khác mà doanh nghiệp phải thực hiện.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4. Căn cứ lập Báo cáo lưu chuyển tiền tệ \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eViệc lập Báo cáo lưu chuyển tiền tệ được căn cứ vào:\u003c/p\u003e\n\u003cp\u003e- Bảng Cân đối kế toán;\u003c/p\u003e\n\u003cp\u003e- Báo cáo kết quả hoạt động kinh doanh;\u003c/p\u003e\n\u003cp\u003e- Thuyết minh báo cáo tài chính;\u003c/p\u003e\n\u003cp\u003e- Báo cáo lưu chuyển tiền tệ kỳ trước;\u003c/p\u003e\n\u003cp\u003e- Các tài liệu kế toán khác, như: Sổ kế toán tổng hợp, sổ kế toán chi tiết các Tài khoản “Tiền mặt”, “Tiền gửi Ngân hàng”, “Tiền đang chuyển”; Sổ kế toán tổng hợp và sổ kế toán chi tiết của các Tài khoản liên quan khác, bảng tính và phân bổ khấu hao TSCĐ và các tài liệu kế toán chi tiết khác...\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5. Yêu cầu về mở và ghi sổ kế toán phục vụ lập Báo cáo lưu chuyển tiền tệ \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e- Sổ kế toán chi tiết các Tài khoản phải thu, phải trả phải được mở chi tiết theo 3 loại hoạt động: Hoạt động kinh doanh, hoạt động đầu tư và hoạt động tài chính.\u003c/p\u003e\n\u003cp\u003e- Đối với sổ kế toán chi tiết các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\", \"Tiền đang chuyển\" phải mở chi tiết theo 3 loại hoạt động: Hoạt động kinh doanh, hoạt động đầu tư và hoạt động tài chính để làm căn cứ đối chiếu. Ví dụ, đối với khoản tiền trả ngân hàng về gốc và lãi vay, kế toán phải phản ánh riêng số tiền trả lãi vay và số tiền trả gốc vay trên sổ kế toán chi tiết.\u003c/p\u003e\n\u003cp\u003e- Tại thời điểm cuối niên độ kế toán, khi lập Báo cáo lưu chuyển tiền tệ, doanh nghiệp phải xác định các khoản đầu tư ngắn hạn có thời hạn thu hồi hoặc đáo hạn không quá 3 tháng kể từ ngày mua thoả mãn định nghĩa được coi là tương đương tiền phù hợp với quy định của Chuẩn mực \"Báo cáo lưu chuyển tiền tệ\" để loại trừ ra khỏi các khoản mục liên quan đến hoạt động đầu tư ngắn hạn. Giá trị của các khoản tương đương tiền được cộng (+) vào chỉ tiêu “Tiền và các khoản tương đương tiền cuối kỳ” trên Báo cáo lưu chuyển tiền tệ.\u003c/p\u003e\n\u003cp\u003e- Đối với các khoản đầu tư chứng khoán và công cụ nợ không được coi là tương đương tiền, kế toán phải căn cứ vào mục đích đầu tư để lập bảng kê chi tiết xác định các khoản đầu tư chứng khoán và công cụ nợ phục vụ cho mục đích thương mại (mua vào để bán) và phục vụ cho mục đích nắm giữ đầu tư để thu lãi.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e6. Phương pháp lập Báo cáo lưu chuyển tiền tệ \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e6.1. Lập báo cáo các chỉ tiêu luồng tiền từ hoạt động kinh doanh\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eLuồng tiền từ hoạt động kinh doanh được lập và trình bày trong Báo cáo lưu chuyển tiền tệ theo một trong hai phương pháp sau: Phương pháp trực tiếp và phương pháp gián tiếp.\u003c/p\u003e\n\u003cp\u003e6.1.1. Lập báo cáo các chỉ tiêu luồng tiền từ hoạt động kinh doanh theo phương pháp trực tiếp\u003c/p\u003e\n\u003cp\u003e- Nguyên tắc lập: Theo phương pháp trực tiếp, các luồng tiền vào và luồng tiền ra từ hoạt động kinh doanh được xác định và trình bày trong Báo cáo lưu chuyển tiền tệ bằng cách phân tích và tổng hợp trực tiếp các khoản tiền thu vào và chi ra theo từng nội dung thu, chi từ các sổ kế toán tổng hợp và chi tiết của doanh nghiệp.\u003c/p\u003e\n\u003cp\u003e- Cơ sở lập:\u003c/p\u003e\n\u003cp\u003e+ Bảng Cân đối kế toán;\u003c/p\u003e\n\u003cp\u003e+ Thuyết minh báo cáo tài chính;\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e+ Sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\", \"Tiền đang chuyển\";\u003c/p\u003e\n\u003cp\u003e+ Sổ kế toán Tài khoản \"Đầu tư chứng khoán ngắn hạn\";\u003c/p\u003e\n\u003cp\u003e+ Sổ kế toán các Tài khoản phải thu, các Tài khoản phải trả;\u003c/p\u003e\n\u003cp\u003e+ Sổ kế toán các Tài khoản có liên quan khác;\u003c/p\u003e\n\u003cp\u003e+ Báo cáo lưu chuyển tiền tệ kỳ trước.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e- Phương pháp lập các chỉ tiêu cụ thể (Xem Phụ lục số 03)\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(1) Tiền thu từ\u0026nbsp; bán hàng, cung cấp dịch vụ và doanh thu khác - Mã số 01\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào tổng số tiền đã thu (tổng giá thanh toán) trong kỳ do bán hàng hóa, thành phẩm, cung cấp dịch vụ, tiền bản quyền, phí, hoa hồng và các khoản doanh thu khác (như bán chứng khoán vì mục đích thương mại) (nếu có), trừ các khoản doanh thu được xác định là luồng tiền từ hoạt động đầu tư, kể cả các khoản tiền đã thu từ các khoản nợ phải thu liên quan đến các giao dịch bán hàng hoá, cung cấp dịch vụ và doanh thu khác phát sinh từ các kỳ trước nhưng kỳ này mới thu được tiền và số tiền ứng trước của người mua hàng hoá, dịch vụ.\u003c/p\u003e\n\u003cp\u003eSố liệu để ghi vào chỉ tiêu này được lấy từ sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\" (phần thu tiền), sổ kế toán các tài khoản phải trả (Tiền thu từ bán hàng, cung cấp dịch vụ chuyển trả ngay các khoản công nợ) trong kỳ báo cáo sau khi đối chiếu với sổ kế toán các Tài khoản \"Doanh thu bán hàng và cung cấp dịch vụ\" (Bán hàng, cung cấp dịch vụ thu tiền ngay) và sổ kế toán Tài khoản \"Phải thu của khách hàng\" (Bán hàng, cung cấp dịch vụ và doanh thu khác phát sinh từ các kỳ trước, đã thu được tiền trong kỳ này) hoặc số tiền ứng trước trong kỳ của người mua sản phẩm, hàng hoá, dịch vụ, sổ kế toán Tài khoản \"Đầu tư chứng khoán ngắn hạn\" và Tài khoản “Doanh thu hoạt động tài chính” (Bán chứng khoán vì mục đích thương mại thu tiền ngay).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(2) Tiền trả cho người cung cấp hàng hoá, dịch vụ - Mã số 02\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào tổng số tiền đã trả (tổng giá thanh toán) trong kỳ cho người cung cấp hàng hoá, dịch vụ, chi mua chứng khoán vì mục đích thương mại (nếu có), kể cả số tiền đã trả cho các khoản nợ phải trả liên quan đến giao dịch mua hàng hoá, dịch vụ phát sinh từ các kỳ trước nhưng kỳ này mới trả tiền và số tiền chi ứng trước cho người cung cấp hàng hoá, dịch vụ.\u003c/p\u003e\n\u003cp\u003eSố liệu để ghi vào chỉ tiêu này được lấy từ sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\" và \"Tiền đang chuyển\" (phần chi tiền), sổ kế toán Tài khoản “Phải thu của khách hàng” (phần chi tiền từ thu các khoản phải thu của khách hàng), sổ kế toán Tài khoản “Vay ngắn hạn” (Phần chi tiền từ tiền vay ngắn hạn nhận được chuyển trả ngay cho người bán) trong kỳ báo cáo, sau khi đối chiếu với sổ kế toán Tài khoản \"Phải trả cho người bán\", sổ kế toán các Tài khoản hàng tồn kho và các Tài khoản có liên quan khác, chi tiết phần đã trả bằng tiền trong kỳ báo cáo, sổ kế toán các Tài khoản \"Đầu tư chứng khoán ngắn hạn\" (Chi mua chứng khoán vì mục đích thương mại). Chỉ tiêu này được ghi bằng số âm dưới hình thức ghi trong ngoặc đơn ( ***).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(3) Tiền trả cho người lao động - Mã số 03\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào tổng số tiền đã trả cho người lao động trong kỳ báo cáo về tiền lương, tiền công, phụ cấp, tiền thưởng... do doanh nghiệp đã thanh toán hoặc tạm ứng.\u003c/p\u003e\n\u003cp\u003eSố liệu để ghi vào chỉ tiêu này được lấy từ sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\" (phần chi tiền) trong kỳ báo cáo, sau khi đối chiếu với sổ kế toán Tài khoản \"Phải trả công nhân viên\" - phần đã trả bằng tiền trong kỳ báo cáo. Chỉ tiêu này được ghi bằng số âm dưới hình thức ghi trong ngoặc đơn ( ***).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(4) Tiền lãi vay đã trả - Mã số 04\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào tổng số tiền lãi vay đã trả trong kỳ báo cáo, bao gồm tiền lãi vay phát sinh trong kỳ và trả ngay kỳ này, tiền lãi vay phải trả phát sinh từ các kỳ trước và đã trả trong kỳ này, lãi tiền vay trả trước trong kỳ này.\u003c/p\u003e\n\u003cp\u003eSố liệu để ghi vào chỉ tiêu này được lấy từ sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\" và \"Tiền đang chuyển\", sổ kế toán Tài khoản “Phải thu của khách hàng” (phần tiền trả lãi vay từ tiền thu các khoản phải thu của khách hàng)\u0026nbsp; trong kỳ báo cáo, sau khi đối chiếu với sổ kế toán Tài khoản \"Chi phí phải trả\" (theo dõi số tiền lãi vay phải trả) và các Tài khoản liên quan khác. Chỉ tiêu này được ghi bằng số âm dưới hình thức ghi trong ngoặc đơn (***).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(5) Tiền đã nộp thuế TNDN - Mã số 05\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào tổng số tiền đã nộp thuế TNDN cho Nhà nước trong kỳ báo cáo, bao gồm số tiền thuế TNDN đã nộp của kỳ này, số thuế TNDN còn nợ từ các kỳ trước đã nộp trong kỳ này và số thuế TNDN nộp trước (nếu có).\u003c/p\u003e\n\u003cp\u003eSố liệu để ghi vào chỉ tiêu này được lấy từ sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\" và \"Tiền đang chuyển\" (phần chi tiền), sổ kế toán Tài khoản “Phải thu của khách hàng” (phần tiền nộp thuế TNDN từ tiền thu các khoản phải thu của khách hàng) trong kỳ báo cáo, sau khi đối chiếu với sổ kế toán Tài khoản \"Thuế và các khoản phải nộp Nhà nước\" (phần thuế TNDN đã nộp trong kỳ báo cáo). Chỉ tiêu này được ghi bằng số âm dưới hình thức ghi trong ngoặc đơn ( ***).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(6) Tiền thu khác từ hoạt động kinh doanh - Mã số 06\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào tổng số tiền đã thu từ các khoản khác từ hoạt động kinh doanh, ngoài khoản tiền thu được phản ánh ở Mã số 01, như: Tiền thu từ khoản thu nhập khác (tiền thu về được bồi thường, được phạt, tiền thưởng, và các khoản tiền thu khác...); Tiền đã thu do được hoàn thuế; Tiền thu được do nhận ký quỹ, ký cược; Tiền thu hồi các khoản đưa đi ký cược, ký quỹ;\u0026nbsp; Tiền thu từ nguồn kinh phí sự nghiệp, dự án (nếu có); Tiền được các tổ chức, cá nhân bên ngoài thưởng, hỗ trợ ghi tăng các quỹ của doanh nghiệp; Tiền nhận được ghi tăng các quỹ do cấp trên cấp hoặc cấp dưới nộp...\u003c/p\u003e\n\u003cp\u003eSố liệu để ghi vào chỉ tiêu này lấy từ sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\" sau khi đối chiếu với sổ kế toán các Tài khoản \"Thu nhập khác\", Tài khoản \"Thuế GTGT được khấu trừ\" và sổ kế toán các Tài khoản khác có liên quan trong kỳ báo cáo.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(7) Tiền chi khác từ hoạt động kinh doanh - Mã số 07\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu này được lập căn cứ vào tổng số tiền đã chi về các khoản khác, ngoài các khoản tiền chi liên quan đến hoạt động sản xuất, kinh doanh trong kỳ báo cáo được phản ánh ở Mã số 02, 03, 04, 05, như: Tiền chi bồi thường, bị phạt và các khoản chi phí khác; Tiền nộp các loại thuế (không bao gồm thuế TNDN); Tiền nộp các loại phí, lệ phí, tiền thuê đất; Tiền chi đưa đi ký cược, ký quỹ; Tiền trả lại các khoản nhận ký cược, ký quỹ; Tiền chi từ quỹ khen thưởng, phúc lợi; Tiền chi từ nguồn kinh phí sự nghiệp, kinh phí dự án; Tiền chi nộp các quỹ lên cấp trên hoặc cấp cho cấp dưới,...\u003c/p\u003e\n\u003cp\u003eSố liệu để ghi vào chỉ tiêu này lấy từ sổ kế toán các Tài khoản \"Tiền mặt\", \"Tiền gửi Ngân hàng\" và \"Tiền đang chuyển\" trong kỳ báo cáo, sau khi đối chiếu với sổ kế toán các Tài khoản \"Chi phí khác\", \"Thuế và các khoản phải nộp Nhà nước\", \"Chi sự nghiệp\" và các Tài khoản liên quan khác. Chỉ tiêu này được ghi bằng số âm dưới hình thức ghi trong ngoặc đơn ( ***).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e(8) Lưu chuyển tiền thuần từ hoạt động kinh doanh - Mã số 20\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChỉ tiêu “Lưu chuyển tiền thuần từ hoạt động kinh doanh” phản ánh chênh lệch giữa tổng số tiền thu vào với tổng số tiền chi ra từ hoạt động kinh doanh trong kỳ báo cáo.\u003c/p\u003e\n\u003cp\u003eSố liệu để ghi vào chỉ tiêu này được tính bằng tổng cộng số liệu các chỉ tiêu từ Mã số 01 đến Mã số 07. Nếu số liệu chỉ tiêu này là số âm thì ghi trong ngoặc đơn (***).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eMã số 20 = Mã số 01 + Mã số 02 + Mã số 03 + Mã số 04 + Mã số 05 + Mã số\u003cbr\u003e\n   \u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; 06 + Mã số 07\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e6.1.2. Lập báo cáo các chỉ tiêu luồng tiền từ hoạt động kinh doanh theo phương pháp gián tiếp\u003c/p\u003e\n\u003cp\u003e- Nguyên tắc lập: Theo phương pháp gián tiếp, các luồng tiền vào và các luồng tiền ra từ hoạt động kinh doanh được tính và xác định trước hết bằng cách điều chỉnh lợi nhuận trước thuế TNDN của hoạt động kinh doanh khỏi ảnh hưởng của các khoản mục không phải bằng tiền, các thay đổi trong kỳ của hàng tồn kho, các khoản phải thu, phải trả từ hoạt động kinh doanh và các khoản mà ảnh hưởng về tiền của chúng là luồng tiền từ hoạt động đầu tư, gồm:\u003c/p\u003e\n\u003cp\u003e+ Các khoản chi phí không bằng tiền, như: Khấu hao TSCĐ, dự phòng...;\u003c/p\u003e\n\u003cp\u003e+ Các khoản lãi, lỗ không phải bằng tiền, như: Lãi, lỗ chênh lệch tỷ giá hối đoái chưa thực hiện...;\u003c/p\u003e\n\u003cp\u003e+ Các khoản lãi, lỗ được phân loại là luồng tiền từ hoạt động đầu tư, như: Lãi, lỗ về thanh lý, nhượng bán TSCĐ và bất động sản đầu tư, tiền lãi cho vay,

03c/p\u003e\n\u003cp\u003ea) Các khoản thu nhập khác quy định tại Điều 7 Thông tư này.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eb) Thu nhập từ hoạt động tìm kiếm, thăm dò, khai thác dầu khí và tài nguyên quí hiếm khác.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003ec) Thu nhập từ kinh doanh trò chơi có thưởng, cá cược theo quy định của pháp luật.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003ed) Thu nhập từ hoạt động khai thác khoáng sản.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003ee) Thu nhập từ kinh doanh dịch vụ thuộc đối tượng chịu thuế tiêu thụ đặc biệt theo quy định của Luật thuế tiêu thụ đặc biệt.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e9.\u003c/strong\u003e Doanh nghiệp thành lập từ chuyển đổi loại hình doanh nghiệp, chuyển đổi sở hữu, chia, tách, sáp nhập, hợp nhất chịu trách nhiệm trả các khoản nợ tiền thuế, tiền phạt về thuế thu nhập doanh nghiệp của doanh nghiệp bị chuyển đổi, chia, tách, sáp nhập, hợp nhất và được kế thừa các ưu đãi về thuế thu nhập doanh nghiệp cho thời gian còn lại nếu tiếp tục đáp ứng các điều kiện ưu đãi thuế thu nhập doanh nghiệp.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e10. \u003c/strong\u003eDoanh nghiệp trong thời gian đang được hưởng ưu đãi thuế thu nhập doanh nghiệp theo quy định, cơ quan có thẩm quyền kiểm tra, thanh tra kiểm tra phát hiện:\u003c/p\u003e\n\u003cp\u003e- Tăng số thuế thu nhập doanh nghiệp được hưởng ưu đãi thuế so với đơn vị tự kê khai (kể cả trường hợp doanh nghiệp chưa kê khai để được hưởng ưu đãi thuế) thì doanh nghiệp được hưởng ưu đãi thuế thu nhập doanh nghiệp theo quy định đối với số thuế thu nhập doanh nghiệp do kiểm tra, thanh tra phát hiện (bao gồm số thuế thu nhập doanh nghiệp tăng thêm và số thuế thu nhập doanh nghiệp thuộc đối tượng được ưu đãi thuế theo quy định đã kê khai nhưng chưa xác định số thuế được ưu đãi).\u003c/p\u003e\n\u003cp\u003e- Giảm số thuế thu nhập doanh nghiệp được hưởng ưu đãi thuế so với đơn vị tự kê khai thì doanh nghiệp chỉ được hưởng ưu đãi thuế thu nhập doanh nghiệp theo theo quy định đối với số thuế thu nhập doanh nghiệp do kiểm tra, thanh tra phát hiện.\u003c/p\u003e\n\u003cp\u003e- Tuỳ theo mức độ vi phạm của doanh nghiệp, cơ quan có thẩm quyền kiểm tra, thanh tra áp dụng các mức xử phạt vi phạm pháp luật về thuế theo quy định.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐiều 19. Thuế suất ưu đãi\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1.\u003c/strong\u003e Thuế suất ưu đãi 10% trong thời hạn mười lăm năm (15 năm) áp dụng đối với:\u003c/p\u003e\n\u003cp\u003ea) Doanh nghiệp thành lập mới từ dự án đầu tư tại địa bàn có điều kiện kinh tế - xã hội đặc biệt khó khăn quy định tại Phụ lục ban hành kèm theo Nghị định số 124/2008/NĐ-CP ngày 11/12/2008 của Chính phủ.\u003c/p\u003e\n\u003cp\u003eb) Doanh nghiệp thành lập mới từ dự án đầu tư tại khu kinh tế, khu công nghệ cao được thành lập theo Quyết định của Thủ tướng Chính phủ;\u003c/p\u003e\n\u003cp\u003ec) Doanh nghiệp thành lập mới từ dự án đầu tư thuộc các lĩnh vực:\u003c/p\u003e\n\u003cp\u003e- Công nghệ cao theo quy định của pháp luật; nghiên cứu khoa học và phát triển công nghệ;\u003c/p\u003e\n\u003cp\u003e- Đầu tư phát triển nhà máy nước, nhà máy điện, hệ thống cấp thoát nước; cầu, đường bộ, đường sắt; cảng hàng không, cảng biển, cảng sông; sân bay, nhà ga và công trình cơ sở hạ tầng đặc biệt quan trọng khác do Thủ tướng Chính phủ quyết định;\u003c/p\u003e\n\u003cp\u003e- Sản xuất sản phẩm phần mềm.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.\u003c/strong\u003e Doanh nghiệp thành lập mới từ dự án đầu tư thuộc lĩnh vực quy định tại điểm c Khoản 1 Điều này thuộc loại dự án có quy mô lớn, công nghệ cao hoặc mới cần đặc biệt thu hút đầu tư thì thời gian áp dụng thuế suất ưu đãi 10% có thể kéo dài thêm nhưng tổng thời gian áp dụng thuế suất 10% không quá 30 năm theo Quyết định của Thủ tướng Chính phủ căn cứ theo đề nghị của Bộ trưởng Bộ Tài chính.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3.\u003c/strong\u003e Thuế suất ưu đãi 10% trong suốt thời gian hoạt động áp dụng đối với:\u003c/p\u003e\n\u003cp\u003ea) Phần thu nhập của doanh nghiệp có được từ hoạt động trong lĩnh vực giáo dục - đào tạo, dạy nghề, y tế, văn hoá, thể thao và môi trường (sau đây gọi chung là lĩnh vực xã hội hoá).\u003c/p\u003e\n\u003cp\u003eDanh mục chi tiết các hoạt động trong lĩnh vực xã hội hoá được thực hiện theo danh mục do Thủ tướng Chính phủ quy định.\u003c/p\u003e\n\u003cp\u003eb) Phần thu nhập của doanh nghiệp có được từ hoạt động xuất bản theo quy định của Luật Xuất bản.\u003c/p\u003e\n\u003cp\u003eHoạt động xuất bản bao gồm các lĩnh vực xuất bản, in và phát hành xuất bản phẩm theo quy định tại Luật Xuất bản.\u003c/p\u003e\n\u003cp\u003eXuất bản phẩm thực hiện theo quy định tại Điều 4 của Luật Xuất bản và Điều 2 Nghị định số 111/2005/NĐ-CP ngày 26/8/2005 của Chính phủ. Trường hợp các quy định của Luật Xuất bản, Nghị định số 111/2005/NĐ-CP và các văn bản quy phạm pháp luật có liên quan đến lĩnh vực xuất bản có sự thay đổi thì áp dụng theo các quy định mới tương ứng, phù hợp với các văn bản này.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4.\u003c/strong\u003e Thuế suất ưu đãi 20% trong thời gian mười năm (10 năm) áp dụng đối với doanh nghiệp thành lập mới từ dự án đầu tư tại địa bàn có điều kiện kinh tế - xã hội khó khăn quy định tại Phụ lục ban hành kèm theo Nghị định số 124/2008/NĐ-CP ngày 11/12/2008 của Chính phủ.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e\u003cstrong\u003e5.\u003c/strong\u003e Thuế suất ưu đãi 20% trong suốt thời gian hoạt động được áp dụng đối với Hợp tác xã dịch vụ nông nghiệp, Quỹ tín dụng nhân dân và Tổ chức tài chính vi mô.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eĐối với Hợp tác xã dịch vụ nông nghiệp, quỹ tín dụng nhân dân và tổ chức tài chính vi mô thành lập mới tại địa bàn có điều kiện kinh tế - xã hội đặc biệt khó khăn quy định tại Phụ lục ban hành kèm theo Nghị định số 124/2008/NĐ-CP ngày 11/12/2008 của Chính phủ sau khi hết thời hạn áp dụng thuế suất 10% quy định tại điểm a Khoản 1 Điều này thì chuyển sang áp dụng mức thuế suất 20%.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eTổ chức tài chính vi mô quy định tại Khoản này là tổ chức được thành lập và hoạt động theo quy định của Luật các tổ chức tín dụng.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e6.\u003c/strong\u003e Thời gian áp dụng thuế suất ưu đãi quy định tại Điều này được tính liên tục từ năm đầu tiên doanh nghiệp có doanh thu từ hoạt động được hưởng ưu đãi thuế.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e7. \u003c/strong\u003eHết thời gian áp dụng mức thuế suất ưu đãi tại Khoản 1, Khoản 2, Khoản 4 Điều này, doanh nghiệp chuyển sang áp dụng mức thuế suất 25%.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐiều 20. Ưu đãi về thời gian miễn thuế, giảm thuế\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1.\u003c/strong\u003e Miễn thuế 4 năm, giảm 50% số thuế phải nộp trong 9 năm tiếp theo đối với:\u003c/p\u003e\n\u003cp\u003ea) Doanh nghiệp thành lập mới từ dự án đầu tư tại địa bàn có điều kiện kinh tế - xã hội đặc biệt khó khăn quy định tại Phụ lục ban hành kèm theo Nghị định số 124/2008/NĐ-CP ngày 11/12/2008 của Chính phủ.\u003c/p\u003e\n\u003cp\u003eb) Doanh nghiệp thành lập mới từ dự án đầu tư tại khu kinh tế, khu công nghệ cao được thành lập theo Quyết định của Thủ tướng Chính phủ;\u003c/p\u003e\n\u003cp\u003ec) Doanh nghiệp thành lập mới từ dự án đầu tư thuộc các lĩnh vực:\u003c/p\u003e\n\u003cp\u003e- Công nghệ cao theo quy định của pháp luật; nghiên cứu khoa học và phát triển công nghệ;\u003c/p\u003e\n\u003cp\u003e- Đầu tư phát triển nhà máy nước, nhà máy điện, hệ thống cấp thoát nước; cầu, đường bộ, đường sắt; cảng hàng không, cảng biển, cảng sông; sân bay, nhà ga và công trình cơ sở hạ tầng đặc biệt quan trọng khác do Thủ tướng Chính phủ quyết định;\u003c/p\u003e\n\u003cp\u003eĐể được hưởng ưu đãi thuế thu nhập doanh nghiệp theo trường hợp doanh nghiệp thành lập mới từ dự án đầu tư vào các ngành nghề đầu tư phát triển nhà máy nước, nhà máy điện, hệ thống cấp thoát nước; cầu, đường bộ, đường sắt; cảng hàng không, cảng biển, cảng sông; sân bay, nhà ga và công trình cơ sở hạ tầng đặc biệt quan trọng khác do Thủ tướng Chính phủ quyết định thì doanh nghiệp phải phát sinh doanh thu, thu nhập từ quá trình hoạt động của các dự án đầu tư nêu trên. Trường hợp các doanh nghiệp thực hiện thi công, xây dựng các công trình này thì phần thu nhập từ hoạt động thi công, xây dựng các công trình này không được hưởng ưu đãi thuế thu nhập doanh nghiệp.\u003c/p\u003e\n\u003cp\u003e- Sản xuất sản phẩm phần mềm.\u003c/p\u003e\n\u003cp\u003ed) Doanh nghiệp thành lập mới trong lĩnh vực xã hội hoá thực hiện tại địa bàn có điều kiện kinh tế - xã hội khó khăn hoặc đặc biệt khó khăn quy định tại Phụ lục ban hành kèm theo Nghị định số 124/2008/NĐ-CP ngày 11/12/2008 của Chính phủ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.\u003c/strong\u003e Miễn thuế 4 năm, giảm 50% số thuế phải nộp trong 5 năm tiếp theo đối với doanh nghiệp thành lập mới trong lĩnh vực xã hội hoá thực hiện tại địa bàn không thuộc danh mục địa bàn có điều kiện kinh tế - xã hội khó khăn hoặc đặc biệt khó khăn quy định tại Phụ lục ban hành kèm theo Nghị định số 124/2008/NĐ-CP ngày 11/12/2008 của Chính phủ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3.\u003c/strong\u003e Miễn thuế 2 năm và giảm 50% số thuế phải nộp trong 4 năm tiếp theo đối với doanh nghiệp thành lập mới từ dự án đầu tư tại địa bàn có điều kiện kinh tế - xã hội khó khăn quy định tại Phụ lục ban hành kèm theo Nghị định số 124/2008/NĐ-CP ngày 11/12/2008 của Chính phủ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4. \u003c/strong\u003eThời gian miễn thuế, giảm thuế quy định tại Điều này được tính liên tục từ năm đầu tiên doanh nghiệp có thu nhập chịu thuế từ dự án đầu tư được hưởng ưu đãi thuế; Trường hợp doanh nghiệp không có thu nhập chịu thuế trong ba năm đầu, kể từ năm đầu tiên có doanh thu từ dự án đầu tư thì thời gian miễn thuế, giảm thuế được tính từ năm thứ tư.\u003c/p\u003e\n\u003cp\u003eVí dụ 16: Năm 2009, doanh nghiệp A thành lập mới từ dự án đầu tư sản xuất sản phẩm phần mềm, nếu năm 2009 doanh nghiệp A đã có thu nhập chịu thuế từ dự án sản xuất sản phẩm phầm mềm thì thời gian miễn giảm thuế được tính liên tục kể từ năm 2009. Trường hợp dự án sản xuất sản phẩm phầm mềm của doanh nghiệp A phát sinh doanh thu từ năm 2009, đến năm 2012 doanh nghiệp A vẫn chưa có thu nhập chịu thuế thì thời gian miễn giảm thuế được tính liên tục kể từ năm 2012.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5.\u003c/strong\u003e Năm miễn thuế, giảm thuế xác định phù hợp với kỳ tính thuế. Thời điểm bắt đầu tính thời gian miễn thuế, giảm thuế tính liên tục kể từ kỳ tính thuế đầu tiên doanh nghiệp bắt đầu có thu nhập chịu thuế (chưa trừ số lỗ các kỳ tính thuế trước chuyển sang). Trường hợp, kỳ tính thuế đầu tiên doanh nghiệp có thu nhập chịu thuế, nhưng thời gian hoạt động sản xuất, kinh doanh hàng hoá, dịch vụ dưới 12 tháng thì doanh nghiệp có quyền đăng ký với cơ quan thuế tính thời gian miễn thuế, giảm thuế ngay kỳ tính thuế đầu tiên đó hoặc tính từ kỳ tính thuế tiếp theo. Trường hợp doanh nghiệp đăng ký thời gian miễn giảm thuế vào kỳ tính thuế tiếp theo thì phải xác định số thuế phải nộp của kỳ tính thuế đầu tiên để nộp vào Ngân sách Nhà nước theo quy định. Kỳ tính thuế hướng dẫn tại Khoản 3 Điều 3 không áp dụng để xác định ưu đãi miễn thuế, giảm thuế theo quy định tại Khoản này.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐiều 21. Các trường hợp giảm thuế khác\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1. \u003c/strong\u003eDoanh nghiệp hoạt động trong lĩnh vực sản xuất, xây dựng, vận tải được giảm số thuế thu nhập doanh nghiệp phải nộp tương ứng với số tiền thực chi thêm cho lao động nữ hướng dẫn tại tiết a điểm 2.9 Khoản 2 Điều 6 Thông tư này nếu hạch toán riêng được.\u003c/p\u003e\n\u003cp\u003eCác đơn vị sự nghiệp, cơ quan văn phòng thuộc các Tổng công ty không trực tiếp sản xuất kinh doanh thì không giảm thuế theo điểm này.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.\u003c/strong\u003e Doanh nghiệp sử dụng lao động là người dân tộc thiểu số được giảm thuế thu nhập doanh nghiệp phải nộp tương ứng với số tiền thực chi thêm cho lao động là người dân tộc thiểu số hướng dẫn tại tiết b điểm 2.9 Khoản 2 Điều 6 Thông tư này nếu hạch toán riêng được.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐiều 22. Thủ tục thực hiện ưu đãi thuế thu nhập doanh nghiệp\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eDoanh nghiệp tự xác định các điều kiện ưu đãi thuế, mức thuế suất ưu đãi, thời gian miễn thuế, giảm thuế, số lỗ được trừ (-) vào thu nhập tính thuế để tự kê khai và tự quyết toán thuế với cơ quan thuế.\u003c/p\u003e\n\u003cp\u003eCơ quan thuế khi kiểm tra, thanh tra đối với doanh nghiệp phải kiểm tra các điều kiện được hưởng ưu đãi thuế, số thuế thu nhập doanh nghiệp được miễn thuế, giảm thuế, số lỗ được trừ vào thu nhập chịu thuế theo đúng điều kiện thực tế mà doanh nghiệp đáp ứng được. Trường hợp doanh nghiệp không đảm bảo các điều kiện để áp dụng thuế suất ưu đãi và thời gian miễn thuế, giảm thuế thì cơ quan thuế xử lý truy thu thuế và xử phạt vi phạm hành chính về thuế theo quy định.\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cstrong\u003eChương VII\u003c/strong\u003e\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cstrong\u003eTỔ CHỨC THỰC HIỆN\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐiều 23. Hiệu lực thi hành\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1. \u003c/strong\u003eThông tư này có hiệu lực từ ngày 10 tháng 9 năm 2012 và áp dụng cho kỳ tính thuế thu nhập doanh nghiệp từ năm 2012 trở đi.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. \u003c/strong\u003eDoanh nghiệp đang được hưởng ưu đãi thuế thu nhập doanh nghiệp (bao gồm mức thuế suất ưu đãi, thời gian miễn thuế, giảm thuế) theo quy định tại các văn bản quy phạm pháp luật trước đây về thuế thu nhập doanh nghiệp hoặc theo Giấy phép đầu tư hoặc Giấy chứng nhận ưu đãi đầu tư đã cấp thì tiếp tục được hưởng các mức ưu đãi này cho thời gian còn lại. Trường hợp mức ưu đãi về thuế thu nhập doanh nghiệp bao gồm cả thuế suất ưu đãi và thời gian miễn thuế, giảm thuế thấp hơn mức ưu đãi theo quy định của Thông tư này thì được áp dụng ưu đãi thuế theo quy định của Thông tư này cho thời gian còn lại tính từ kỳ tính thuế năm 2009.\u003c/p\u003e\n\u003cp\u003eViệc xác định thời gian còn lại để được hưởng ưu đãi thuế được tính liên tục kể từ khi thực hiện quy định ưu đãi tại các văn bản quy phạm pháp luật trước đây về thuế thu nhập doanh nghiệp hoặc theo Giấy phép đầu tư hoặc Giấy chứng nhận ưu đãi đầu tư đã cấp.\u003c/p\u003e\n\u003cp\u003eKhoảng thời gian ưu đãi còn lại bằng số năm doanh nghiệp còn được hưởng ưu đãi thuế (thuế suất ưu đãi, thời gian miễn thuế, giảm thuế) theo hướng dẫn tại Thông tư này trừ (-) đi số năm doanh nghiệp đã hưởng ưu đãi thuế (thuế suất ưu đãi, thời gian miễn thuế, giảm thuế) theo các văn bản quy phạm pháp luật trước đây về thuế thu nhập doanh nghiệp hoặc theo Giấy phép đầu tư hoặc Giấy chứng nhận ưu đãi đầu tư đã cấp đến hết năm 2008. Việc xác định khoảng thời gian ưu đãi còn lại nêu trên phải đảm bảo nguyên tắc:\u003c/p\u003e\n\u003cp\u003e- Đến hết kỳ tính thuế năm 2008, doanh nghiệp đã hết thời gian được hưởng ưu đãi về thuế suất theo các văn bản quy phạm pháp luật trước đây về thuế thu nhập doanh nghiệp hoặc theo Giấy phép đầu tư hoặc Giấy chứng nhận ưu đãi đầu tư đã cấp thì không được chuyển sang áp dụng ưu đãi về thuế (thuế suất ưu đãi, thời gian miễn thuế, giảm thuế) cho thời gian còn lại theo hướng dẫn tại Thông tư này.\u003c/p\u003e\n\u003cp\u003e- Đến hết kỳ tính thuế năm 2008, doanh nghiệp đang trong thời gian được hưởng ưu đãi thuế (thuế suất ưu đãi, thời gian miễn thuế, giảm thuế) theo các văn bản quy phạm pháp luật trước đây về thuế thu nhập doanh nghiệp hoặc theo Giấy phép đầu tư hoặc Giấy chứng nhận ưu đãi đầu tư đã cấp thì tiếp tục hưởng số năm được áp dụng thuế suất và mức thuế suất ưu đãi, thời gian miễn thuế, giảm thuế cho thời gian còn lại theo hướng dẫn tại Thông tư này.\u003c/p\u003e\n\u003cp\u003e- Đến hết kỳ tính thuế năm 2008, doanh nghiệp đang được hưởng thuế suất ưu đãi, nhưng vừa hết thời gian được miễn thuế theo các văn bản quy phạm pháp luật trước đây về thuế thu nhập doanh nghiệp hoặc theo Giấy phép đầu tư hoặc Giấy chứng nhận ưu đãi đầu tư đã cấp thì không hưởng thời gian miễn thuế mà chỉ hưởng toàn bộ số năm giảm thuế theo hướng dẫn tại Thông tư này, tiếp tục hưởng số năm áp dụng thuế suất và mức thuế suất ưu đãi cho thời gian còn lại theo hướng dẫn tại Thông tư này.\u003c/p\u003e\n\u003cp\u003e- Đến hết kỳ tính thuế năm 2008, doanh nghiệp đang được hưởng thuế suất ưu đãi, đang trong thời gian giảm thuế theo các văn bản quy phạm pháp luật trước đây về thuế thu nhập doanh nghiệp hoặc theo Giấy phép đầu tư hoặc Giấy chứng nhận ưu đãi đầu tư đã cấp thì số năm giảm thuế còn lại bằng số năm giảm thuế theo hướng dẫn tại Thông tư này trừ (-) số năm doanh nghiệp đã giảm thuế đến hết kỳ tính thuế năm 2008, tiếp tục hưởng số năm áp dụng thuế suất và mức thuế suất ưu đãi cho thời gian còn lại theo hướng dẫn tại Thông tư này.\u003c/p\u003e\n\u003cp\u003e- Đến hết kỳ tính thuế năm 2008, doanh nghiệp đã hết thời gian miễn thuế, giảm thuế theo các văn bản quy phạm pháp luật trước đây về thuế thu nhập doanh nghiệp hoặc theo Giấy phép đầu tư hoặc Giấy chứng nhận ưu đãi đầu tư đã cấp thì không thuộc diện hưởng ưu đãi thuế (thuế suất ưu đãi, thời gian miễn thuế, giảm thuế) theo hướng dẫn tại Thông tư này.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3. \u003c/strong\u003eDoanh nghiệp thuộc diện hưởng thời gian miễn thuế, giảm thuế theo quy định tại các văn bản quy phạm pháp luật trước đây về thuế thu nhập doanh nghiệp hoặc theo Giấy phép đầu tư hoặc Giấy chứng nhận ưu đãi đầu tư đã cấp mà đến hết kỳ tính thuế năm 2008 nếu:\u003c/p\u003e\n\u003cp\u003ea) Chưa có doanh thu thì thời gian miễn thuế, giảm thuế được tính từ năm đầu tiên doanh nghiệp có thu nhập chịu thuế; trường hợp không có thu nhập chịu thuế trong 3 năm đầu kể từ năm đầu tiên có doanh thu thì thời gian miễn thuế, giảm thuế được tính từ năm thứ tư.\u003c/p\u003e\n\u003cp\u003eb) Đã có doanh thu nhưng chưa đủ 3 năm, kể từ khi có doanh thu thì thời gian miễn thuế, giảm thuế được tính từ năm đầu tiên có thu nhập chịu thuế; trường hợp không có thu nhập chịu thuế trong 3 năm đầu kể từ năm đầu tiên có doanh thu thì thời gian miễn thuế, giảm thuế được tính từ năm thứ tư, cụ thể như sau:\u003c/p\u003e\n\u003cp\u003eDoanh nghiệp có kỳ tính thuế đầu tiên từ năm 2007 trở đi và đã có doanh thu thì thời gian miễn giảm thuế được tính liên tục kể từ năm đầu tiên có thu nhập chịu thuế. Trường hợp đến hết năm 2009 mà chưa có thu nhập chịu thuế thì thời gian miễn giảm thuế được tính từ năm 2010.\u003c/p\u003e\n\u003cp\u003ec) Đã có doanh thu từ 3 năm trở lên thì thời gian miễn thuế, giảm thuế được tính từ năm tính thuế 2009, cụ thể như sau:\u003c/p\u003e\n\u003cp\u003eDoanh nghiệp có kỳ tính thuế đầu tiên trước năm 2007 đã có doanh thu nhưng chưa có thu nhập chịu thuế và chưa tính thời gian miễn giảm thuế thì thời gian miễn giảm thuế được tính từ kỳ tính thuế năm 2009.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4.\u003c/strong\u003e Doanh nghiệp hoạt động trong các lĩnh vực khác nhưng có phát sinh thu nhập từ hoạt động trong lĩnh vực giáo dục - đào tạo, dạy nghề, y tế, văn hoá, thể thao và môi trường (sau đây gọi chung là lĩnh vực xã hội hoá) nếu đủ điều kiện thuộc Danh mục loại hình, tiêu chí quy mô, tiêu chuẩn về lĩnh vực xã hội hoá do Thủ tướng Chính phủ quy định thì áp dụng thuế suất thuế thu nhập doanh nghiệp 10% trong suốt thời gian hoạt động đối với phần thu nhập có được từ hoạt động trong lĩnh vực giáo dục - đào tạo, dạy nghề, y tế, văn hoá, thể thao và môi trường kể từ ngày 01/01/2009.\u003c/p\u003e\n\u003cp\u003eDoanh nghiệp có hoạt động trong lĩnh vực xã hội hoá trước ngày 01/01/2009 và đủ điều kiện thuộc Danh mục loại hình, tiêu chí quy mô, tiêu chuẩn về lĩnh vực xã hội do Thủ tướng Chính phủ quy định mà đang áp dụng mức thuế suất cao hơn mức 10% đối với phần thu nhập từ hoạt động xã hội hoá thì được chuyển sang áp dụng mức thuế suất 10% đối với phần thu nhập từ hoạt động xã hội hoá kể từ ngày 01/01/2009.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5. \u003c/strong\u003eDoanh nghiệp đang hoạt động từ năm 2009 có dự án đầu tư xây dựng dây chuyền sản xuất mới, mở rộng quy mô, đổi mới công nghệ, cải thiện môi trường sinh thái, nâng cao năng lực sản xuất thì phần thu nhập từ dự án đầu tư này sẽ không được hưởng ưu đãi thuế thu nhập doanh nghiệp. Các dự án đầu tư trước năm 2009 đang được hưởng ưu đãi thuế thu nhập doanh nghiệp (theo diện ưu đãi đầu tư mở rộng) thì tiếp tục được hưởng ưu đãi cho thời gian còn lại và phần thu nhập tăng thêm của các dự án đầu tư mở rộng đang áp dụng thuế suất 28% được chuyển sang áp dụng thuế suất 25% .\u003c/p\u003e\n\u003cp\u003eDoanh nghiệp có dự án đầu tư mở rộng sản xuất đến ngày 31 tháng 12 năm 2008 đang đầu tư xây dựng dở dang và trong năm 2009 hoàn thành đi vào sản xuất, kinh doanh thì tiếp tục được hưởng thời gian miễn giảm thuế thu nhập doanh nghiệp đối với phần thu nhập tăng thêm từ dự án đầu tư mở rộng mang lại theo Thông tư số 134/2007/TT-BTC ngày 23/11/2007 của Bộ Tài chính; Phần thu nhập tăng thêm của dự án này áp dụng thuế suất 25% và thời gian miễn giảm thuế thu nhập doanh nghiệp đối với phần thu nhập tăng thêm tính từ năm 2009 dự án đi vào sản xuất, kinh doanh. Doanh nghiệp phải có thông báo với cơ quan thuế các dự án đầu tư mở rộng sản xuất đang đầu tư xây dựng dở dang khi nộp tờ khai quyết toán thuế thu nhập doanh nghiệp của kỳ tính thuế năm 2008.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eDoanh nghiệp có dự án đầu tư mở rộng sản xuất đến ngày 31/12/2008 đang đầu tư xây dựng dở dang, trong năm 2009 dự án vẫn tiếp tục quá trình đầu tư xây dựng dở dang và từ năm 2010 trở đi mới hoàn thành đi vào sản xuất, kinh doanh thì doanh nghiệp không được ưu đãi thuế TNDN đối với phần thu nhập tăng thêm từ dự án đầu tư mở rộng mang lại.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e\u003cstrong\u003e6\u003cem\u003e.\u003c/em\u003e\u003c/strong\u003e Từ ngày 01/01/2009, hợp tác xã dịch vụ nông nghiệp có thu nhập từ hoạt động dịch vụ nông nghiệp và quỹ tín dụng nhân dân được áp dụng thuế suất 20% kể cả trường hợp hợp tác xã dịch vụ nông nghiệp và quỹ tín dụng nhân dân được thành lập trước ngày 01/01/2009 nhưng chưa được hưởng ưu đãi thuế suất thuế thu nhập doanh nghiệp hoặc đã hết thời gian hưởng ưu đãi thuế suất thuế thu nhập doanh nghiệp (không bao gồm trường hợp hợp tác xã dịch vụ nông nghiệp và quỹ tín dụng nhân dân đang được áp dụng thuế suất 10%).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e7.\u003c/strong\u003e Không áp dụng ưu đãi thuế thu nhập doanh nghiệp đối với thu nhập từ hoạt động khai thác khoáng sản của các doanh nghiệp được thành lập và cấp giấy phép đầu tư về hoạt động khai thác khoáng sản từ ngày 01/01/2009. Trường hợp doanh nghiệp khai thác khoáng sản hoạt động trước ngày 01/01/2009 đang hưởng ưu đãi thuế thu nhập doanh nghiệp theo quy định tại các văn bản quy phạm pháp luật trước đây về thuế thu nhập doanh nghiệp hoặc theo Giấy phép đầu tư hoặc Giấy chứng nhận ưu đãi đầu tư đã cấp thì tiếp tục được hưởng các mức ưu đãi này cho thời gian còn lại.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e8. \u003c/strong\u003eDoanh nghiệp có phát sinh thu nhập từ hoạt động xuất bản theo quy định của Luật Xuất bản được áp dụng thuế suất thuế thu nhập doanh nghiệp 10% trong suốt thời gian hoạt động kể từ kỳ tính thuế năm 2012. Doanh nghiệp đang hoạt động có áp dụng mức thuế suất cao hơn mức thuế suất 10% đối với phần thu nhập từ hoạt động xuất bản theo quy định của Luật Xuất bản thì được chuyển sang áp dụng mức thuế suất 10% đối với phần thu nhập từ hoạt động xuất bản kể từ kỳ tính thuế năm 2012.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e9.\u003c/strong\u003e Thông tư này thay thế Thông tư số 130/2008/TT-BTC ngày 26/12/2008, Thông tư số 177/2009/TT-BTC ngày 10/9/2009, Thông tư số 40/2010/TT-BTC ngày 23/3/2010, Thông tư số 18/2011/TT-BTC ngày 10/2/2011 của Bộ Tài chính.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e10. \u003c/strong\u003eBãi bỏ các nội dung hướng dẫn về thuế thu nhập doanh nghiệp do Bộ Tài chính và các ngành ban hành không phù hợp với hướng dẫn tại Thông tư này.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e11.\u003c/strong\u003e Việc giải quyết những tồn tại về thuế, quyết toán thuế, miễn thuế, giảm thuế và xử lý vi phạm pháp luật về thuế thu nhập doanh nghiệp trước kỳ tính thuế năm 2012 thực hiện theo các quy định tương ứng hướng dẫn về thuế thu nhập doanh nghiệp ban hành trước kỳ tính thuế năm 2012.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e12.\u003c/strong\u003e Trường hợp nước Cộng hoà Xã hội Chủ nghĩa Việt Nam có tham gia ký kết một Hiệp định hoặc Điều ước quốc tế mà Hiệp định hoặc Điều ước quốc tế đó có quy định về việc nộp thuế thu nhập doanh nghiệp khác với nội dung hướng dẫn tại Thông tư này thì thực hiện theo quy định của Điều ước quốc tế đó.\u003c/p\u003e\n\u003cp style=\"margin-right:-11.1pt;\"\u003e\u003cstrong\u003eĐiều 24. Trách nhiệm thi hành\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\"margin-right:-11.1pt;\"\u003e\u003cstrong\u003e1.\u003c/strong\u003e Cơ quan thuế các cấp có trách nhiệm phổ biến, hướng dẫn các doanh nghiệp thực hiện theo nội dung Thông tư này.\u003c/p\u003e\n\u003cp style=\"margin-right:-11.1pt;\"\u003e\u003cstrong\u003e2. \u003c/strong\u003eDoanh nghiệp thuộc đối tượng điều chỉnh của Thông tư này thực hiện theo các hướng dẫn tại Thông tư này.\u003c/p\u003e\n\u003cp style=\"margin-right:-11.1pt;\"\u003eTrong quá trình thực hiện nếu có vướng mắc, đề nghị các tổ chức, cá nhân phản ánh kịp thời về Bộ Tài chính để nghiên cứu giải quyết./.\u003c/p\u003e\n\u003c/body\u003e\n\u003c/html\u003e"])</script><script>self.__next_f.push([1,"d:[[[\"$\",\"s

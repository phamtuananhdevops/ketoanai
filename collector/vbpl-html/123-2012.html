ính thức của Bộ Tư pháp Việt Nam\"},\"nationalLaw\":{\"title\":\"Cổng Pháp luật\u003cbr/\u003eQuốc gia\",\"description\":\"Hệ thống pháp luật quốc gia đầy đủ và cập nhật\"},\"publicService\":{\"title\":\"Cổng Dịch vụ công \u003cbr/\u003e Quốc gia\",\"description\":\"Dịch vụ công trực tuyến một cửa của Chính phủ\"},\"legalCode\":{\"title\":\"Bộ Pháp điển\u003cbr/\u003eđiện tử\",\"description\":\"Bộ luật điện tử đầy đủ và chính thức\"},\"supremeCourt\":{\"title\":\"Cổng Thông tin điện tử\u003cbr/\u003eTòa án Nhân dân Tối cao\",\"description\":\"Cổng thông tin chính thức của Tòa án Nhân dân Tối cao Việt Nam\"},\"foreign\":{\"title\":\"Cổng Thông tin điện tử\u003cbr/\u003eBộ Ngoại giao\",\"description\":\"Cổng thông tin chính thức của Bộ Ngoại giao Việt Nam\"},\"officialGazette\":{\"title\":\"Cổng Thông tin điện tử\u003cbr/\u003eCông báo\",\"description\":\"Cổng thông tin chính thức của Cơ quan Công báo Việt Nam\"},\"feedbackSuggestions\":{\"title\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\",\"description\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\"}}},\"footer\":{\"unit\":\"Đơn vị chủ quản\",\"unitContent\":\"Bộ Tư pháp\",\"address\":\"Địa chỉ\",\"addressContent\":\"Số 60 Trần Phú - Ba Đình - Thành phố Hà Nội\",\"phoneNumber\":\"Điện thoại\",\"phoneNumberContent\":\"024.6273.9468\",\"fax\":\"Fax\",\"faxContent\":\"024.6273.9359\"},\"underConstruction\":{\"title\":\"Đang cập nhật\",\"message\":\"Chức năng này đang được phát triển.\"},\"gioiThieu\":{\"timeline\":{\"2005\":{\"description\":\"Năm 2005 đánh dấu sự khởi đầu của dự án xây dựng Cơ sở dữ liệu quốc gia về pháp luật, với mục tiêu số hóa và tập trung hóa các văn bản pháp luật của Việt Nam.\"},\"2012-2013\":{\"description\":\"Giai đoạn 2012-2013 là thời kỳ phát triển và mở rộng hệ thống, với việc tích hợp thêm nhiều tính năng và cải thiện giao diện người dùng.\"},\"2023-2025\":{\"description\":\"Giai đoạn 2023-2025 tập trung vào việc nâng cấp và hiện đại hóa hệ thống, áp dụng các công nghệ mới và mở rộng phạm vi phục vụ.\"}},\"overview\":{\"title\":\"SƠ LƯỢC MÔ HÌNH CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"CSDLQG về pháp luật tập hợp các văn bản quy phạm pháp luật và văn bản hợp nhất văn bản quy phạm pháp luật (sau đây gọi chung là văn bản) dưới dạng văn bản điện tử do Chính phủ thống nhất quản lý, có địa chỉ truy cập vbpl.vn, bao gồm các Cơ sở dữ liệu thành phần: Cơ sở dữ liệu văn bản pháp luật Trung ương và Cơ sở dữ liệu văn bản pháp luật địa phương.\",\"central\":{\"title\":\"Cơ sở dữ liệu Văn bản pháp luật Trung ương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của các Bộ, cơ quan ngang Bộ, cơ quan nhà nước khác ở Trung ương ban hành hoặc phối hợp ban hành. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật; Văn bản hợp nhất; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"local\":{\"title\":\"Cơ sở dữ liệu văn bản pháp luật địa phương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của từng tỉnh, thành phố trực thuộc Trung ương trên toàn quốc. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật của Hội đồng nhân dân và Ủy ban nhân dân; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"other\":{\"title\":\"Các chuyên mục khác\",\"content\":\"Ngoài các Cơ sở dữ liệu thành phần kể trên, CSDLQG về pháp luật còn có các chuyên mục khác như: Giới thiệu văn bản mới, Tin tức, Tình huống pháp luật. Ngoài ra, CSDLQG về thủ tục hành chính, bộ pháp điển điện tử, cổng thông tin điện tử Bộ Tư pháp cũng trích xuất về CSDLQG về pháp luật.\"}},\"vision\":{\"title\":\"Tầm nhìn\",\"content\":\"Trở thành nguồn tra cứu văn bản pháp luật chính thống, đầy đủ và đáng tin cậy, phục vụ hiệu quả cho người dân, doanh nghiệp và cơ quan nhà nước.\"},\"mission\":{\"title\":\"Sứ mệnh\",\"content\":\"Cung cấp hệ thống văn bản pháp luật được cập nhật kịp thời, tra cứu thuận tiện, góp phần nâng cao nhận thức pháp luật và bảo đảm việc tuân thủ pháp luật trong xã hội.\"},\"features\":{\"title\":\"MỘT SỐ TÍNH NĂNG, TIỆN ÍCH CỦA CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"Hiện nay, CSDLQG về PL có giao diện tương đối thân thiện, dễ tìm kiếm, dễ khai thác các thông tin và tải về sử dụng. Cơ sở dữ liệu cung cấp các chức năng, tiện ích cơ bản và thuận tiện\",\"list\":[{\"key\":\"fullText\",\"label\":\"Tra cứu toàn văn\",\"icon\":\"SearchOutlined\"},{\"key\":\"tableOfContents\",\"label\":\"Tự động tạo mục lục\",\"icon\":\"BookOutlined\"},{\"key\":\"relatedDocuments\",\"label\":\"Liên kết văn bản liên quan\",\"icon\":\"LinkOutlined\"},{\"key\":\"validity\",\"label\":\"Xác định hiệu lực tự động\",\"icon\":\"BarChartOutlined\"},{\"key\":\"validityHistory\",\"label\":\"Lịch sử hiệu lực\",\"icon\":\"ClockCircleOutlined\"},{\"key\":\"download\",\"label\":\"Tải văn bản\",\"icon\":\"DownloadOutlined\"},{\"key\":\"english\",\"label\":\"Xem văn bản tiếng Anh\",\"icon\":\"GlobalOutlined\"},{\"key\":\"centralLocal\",\"label\":\"Liên kết văn bản Trung ương – địa phương\",\"icon\":\"ShareAltOutlined\"},{\"key\":\"diagram\",\"label\":\"Lược đồ văn bản\",\"icon\":\"FileTextOutlined\"}]}},\"mostViewed\":{\"title\":\"Văn bản được xem nhiều\",\"viewCount\":\"Lượt xem\",\"error\":\"Không thể tải văn bản được xem nhiều\",\"retry\":\"Thử lại\",\"loading\":\"Đang tải...\",\"empty\":\"Chưa có dữ liệu\"},\"pageNotFound\":\"Trang không tồn tại\",\"backToHome\":\"Về trang chủ\",\"docNotFound\":\"Văn bản không tồn tại\",\"recaptcha\":{\"error\":{\"not_ready\":\"Xác minh bảo mật chưa sẵn sàng. Vui lòng thử lại sau.\",\"verification_failed\":\"Xác minh thất bại. Vui lòng thử lại sau.\",\"score_too_low\":\"Xác minh thất bại. Vui lòng thử lại sau.\",\"action_mismatch\":\"Lỗi xác minh. Vui lòng tải lại trang.\",\"timeout\":\"Hết thời gian xác minh. Vui lòng thử lại.\",\"recaptcha_token_missing\":\"Thiếu mã xác minh bảo mật\",\"recaptcha_not_configured\":\"Xác minh bảo mật chưa được cấu hình\",\"invalid_token\":\"Mã xác minh không hợp lệ\",\"verification_error\":\"Lỗi xác minh. Vui lòng thử lại.\",\"verification_api_error\":\"Lỗi dịch vụ xác minh. Vui lòng thử lại.\"} 003cp\u003e\u003cem\u003eCăn cứ Luật Quản lý thuế số 78/2006/QH11 ngày 29/11/2006;\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eCăn cứ Nghị định số 124/2008/NĐ-CP ngày 11/12/2008 của Chính phủ quy định chi tiết thi hành một số điều của Luật Thuế thu nhập doanh nghiệp;\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eCăn cứ Nghị định số 122/2011/NĐ-CP ngày 27/12/2011 của Chính phủ sửa đổi, bổ sung một số điều của Nghị định số 124/2008/NĐ-CP của Chính phủ quy định chi tiết và hướng dẫn thi hành một số điều của Luật Thuế thu nhập doanh nghiệp;\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eCăn cứ Nghị định số 118/2008/NĐ-CP ngày 27/11/2008 của Chính phủ quy định chức năng, nhiệm vụ, quyền hạn và cơ cấu tổ chức của Bộ Tài chính;\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eXét đề nghị của Tổng cục trưởng Tổng cục Thuế, Bộ trưởng Bộ Tài chính hướng dẫn thi hành về thuế thu nhập doanh nghiệp như sau:\u003c/em\u003e\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cstrong\u003eChương I\u003c/strong\u003e\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cstrong\u003eQUY ĐỊNH CHUNG\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐiều 1. Phạm vi điều chỉnh\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThông tư này quy định chi tiết và hướng dẫn thi hành một số điều của Luật Thuế thu nhập doanh nghiệp số 14/2008/QH12 ngày 3/6/2008, Nghị định số 124/2008/NĐ-CP ngày 11/12/2008 của Chính phủ quy định chi tiết thi hành một số điều của Luật Thuế thu nhập doanh nghiệp; Nghị định số 122/2011/NĐ-CP ngày 27/12/2011 sửa đổi, bổ sung một số điều của Nghị định số 124/2008/NĐ-CP của Chính phủ quy định chi tiết và hướng dẫn thi hành một số điều của Luật Thuế thu nhập doanh nghiệp.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐiều 2. Người nộp thuế\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1.\u003c/strong\u003e Người nộp thuế thu nhập doanh nghiệp là tổ chức hoạt động sản xuất, kinh doanh hàng hoá, dịch vụ có thu nhập chịu thuế (sau đây gọi là doanh nghiệp), bao gồm:\u003c/p\u003e\n\u003cp\u003ea) Doanh nghiệp được thành lập và hoạt động theo quy định của Luật Doanh nghiệp, Luật Đầu tư, Luật Tổ chức tín dụng, Luật Kinh doanh bảo hiểm, Luật Chứng khoán, Luật Dầu khí, Luật Thương mại và các văn bản quy phạm pháp luật khác dưới các hình thức: Công ty cổ phần; Công ty trách nhiệm hữu hạn; Công ty hợp danh; Doanh nghiệp tư nhân; Doanh nghiệp Nhà nước; Văn phòng Luật sư, Văn phòng công chứng tư; Các bên trong hợp đồng hợp tác kinh doanh; Các bên trong hợp đồng phân chia sản phẩm dầu khí, Xí nghiệp liên doanh dầu khí, Công ty điều hành chung.\u003c/p\u003e\n\u003cp\u003eb) Đơn vị sự nghiệp công lập, ngoài công lập có sản xuất kinh doanh hàng hoá, dịch vụ có thu nhập trong tất cả các lĩnh vực.\u003c/p\u003e\n\u003cp\u003ec) Tổ chức được thành lập và hoạt động theo Luật Hợp tác xã.\u003c/p\u003e\n\u003cp\u003ed) Doanh nghiệp được thành lập theo quy định của pháp luật nước ngoài (sau đây gọi là doanh nghiệp nước ngoài) có cơ sở thường trú tại Việt Nam.\u003c/p\u003e\n\u003cp\u003eCơ sở thường trú của doanh nghiệp nước ngoài là cơ sở sản xuất, kinh doanh mà thông qua cơ sở này, doanh nghiệp nước ngoài tiến hành một phần hoặc toàn bộ hoạt động sản xuất, kinh doanh tại Việt Nam mang lại thu nhập, chủ yếu bao gồm:\u003c/p\u003e\n\u003cp\u003e- Chi nhánh, văn phòng điều hành, nhà máy, công xưởng, phương tiện vận tải, hầm mỏ, mỏ dầu, khí hoặc địa điểm khai thác tài nguyên thiên nhiên khác tại Việt Nam;\u003c/p\u003e\n\u003cp\u003e- Địa điểm xây dựng, công trình xây dựng, lắp đặt, lắp ráp;\u003c/p\u003e\n\u003cp\u003e- Cơ sở cung cấp dịch vụ, bao gồm cả dịch vụ tư vấn thông qua người làm công hay một tổ chức, cá nhân khác;\u003c/p\u003e\n\u003cp\u003e- Đại lý cho doanh nghiệp nước ngoài;\u003c/p\u003e\n\u003cp\u003e- Đại diện tại Việt Nam trong trường hợp là đại diện có thẩm quyền ký kết hợp đồng đứng tên doanh nghiệp nước ngoài hoặc đại diện không có thẩm quyền ký kết hợp đồng đứng tên doanh nghiệp nước ngoài nhưng thường xuyên thực hiện việc giao hàng hoá hoặc cung ứng dịch vụ tại Việt Nam.\u003c/p\u003e\n\u003cp\u003eTrường hợp Hiệp định tránh đánh thuế hai lần mà Cộng hòa xã hội chủ nghĩa Việt Nam ký kết có quy định khác về cơ sở thường trú thì thực hiện theo quy định của Hiệp định đó.\u003c/p\u003e\n\u003cp\u003ee) Tổ chức khác ngoài các tổ chức nêu tại các điểm a, b, c và d Khoản 1 Điều này có hoạt động sản xuất kinh doanh hàng hoá hoặc dịch vụ và có thu nhập chịu thuế.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.\u003c/strong\u003e Tổ chức nước ngoài sản xuất kinh doanh tại Việt Nam không theo Luật Đầu tư, Luật Doanh nghiệp hoặc có thu nhập phát sinh tại Việt Nam nộp thuế thu nhập doanh nghiệp theo hướng dẫn riêng của Bộ Tài chính. Các tổ chức này nếu có hoạt động chuyển nhượng vốn thì thực hiện nộp thuế thu nhập doanh nghiệp theo hướng dẫn tại Điều 14 Chương IV Thông tư này.\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cstrong\u003eChương II\u003c/strong\u003e\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cstrong\u003ePHƯƠNG PHÁP VÀ CĂN CỨ TÍNH THUẾ\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐiều 3. Phương pháp tính thuế\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1.\u003c/strong\u003e Số thuế thu nhập doanh nghiệp phải nộp trong kỳ tính thuế bằng thu nhập tính thuế nhân với thuế suất.\u003c/p\u003e\n\u003cp\u003eThuế thu nhập doanh nghiệp phải nộp được xác định theo công thức sau:\u003c/p\u003e\n\u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"width:100.0%;\" width=\"100%\"\u003e\n \u003ctbody\u003e\n  \u003ctr\u003e\n   \u003ctd style=\"width:32.96%;\"\u003e\n    \u003cp align=\"center\"\u003eThuế TNDN phải nộp\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:4.4%;\"\u003e\n    \u003cp align=\"center\"\u003e=\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:27.48%;\"\u003e\n    \u003cp align=\"center\"\u003eThu nhập tính thuế\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:6.6%;\"\u003e\n    \u003cp align=\"center\"\u003ex\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:28.58%;\"\u003e\n    \u003cp align=\"center\"\u003eThuế suất thuế TNDN\u003c/p\u003e\u003c/td\u003e\n  \u003c/tr\u003e\n \u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eTrường hợp doanh nghiệp nếu có trích quỹ phát triển khoa học và công nghệ thì thuế thu nhập doanh nghiệp phải nộp được xác định như sau:\u003c/p\u003e\n\u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"width:100.0%;\" width=\"100%\"\u003e\n \u003ctbody\u003e\n  \u003ctr\u003e\n   \u003ctd style=\"width:15.7%;\"\u003e\n    \u003cp align=\"center\"\u003eThuế TNDN phải nộp\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:4.7%;\"\u003e\n    \u003cp align=\"center\"\u003e=\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:3.52%;\"\u003e\n    \u003cp align=\"center\"\u003e(\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:16.54%;\"\u003e\n    \u003cp align=\"center\"\u003eThu nhập tính thuế\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:4.14%;\"\u003e\n    \u003cp align=\"center\"\u003e-\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:24.8%;\"\u003e\n    \u003cp align=\"center\"\u003ePhần trích lập quỹ KH\u0026amp;CN\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:4.14%;\"\u003e\n    \u003cp align=\"center\"\u003e)\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:4.78%;\"\u003e\n    \u003cp align=\"center\"\u003ex\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:21.66%;\"\u003e\n    \u003cp align=\"center\"\u003eThuế suất thuế TNDN\u003c/p\u003e\u003c/td\u003e\n  \u003c/tr\u003e\n \u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eTrường hợp doanh nghiệp đã nộp thuế thu nhập doanh nghiệp hoặc loại thuế tương tự thuế thu nhập doanh nghiệp ở ngoài Việt Nam thì doanh nghiệp được trừ số thuế thu nhập doanh nghiệp đã nộp nhưng tối đa không quá số thuế thu nhập doanh nghiệp phải nộp theo quy định của Luật Thuế thu nhập doanh nghiệp.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.\u003c/strong\u003e Kỳ tính thuế được xác định theo năm dương lịch. Trường hợp doanh nghiệp áp dụng năm tài chính khác với năm dương lịch thì kỳ tính thuế xác định theo năm tài chính áp dụng. Kỳ tính thuế đầu tiên đối với doanh nghiệp mới thành lập và kỳ tính thuế cuối cùng đối với doanh nghiệp chuyển đổi loại hình doanh nghiệp, chuyển đổi hình thức sở hữu, sáp nhập, chia tách, giải thể, phá sản được xác định phù hợp với kỳ kế toán theo quy định của pháp luật về kế toán.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3. \u003c/strong\u003eTrường hợp kỳ tính thuế năm đầu tiên của doanh nghiệp mới thành lập kể từ khi được cấp Giấy chứng nhận đăng ký doanh nghiệp hoặc Giấy chứng nhận đăng ký kinh doanh hoặc Giấy phép thành lập hoặc Giấy chứng nhận đầu tư và kỳ tính thuế năm cuối cùng đối với doanh nghiệp chuyển đổi loại hình doanh nghiệp, chuyển đổi hình thức sở hữu, hợp nhất, sáp nhập, chia, tách, giải thể, phá sản có thời gian ngắn hơn 03 tháng thì được cộng với kỳ tính thuế năm tiếp theo (đối với doanh nghiệp mới thành lập) hoặc kỳ tính thuế năm trước đó (đối với doanh nghiệp chuyển đổi loại hình doanh nghiệp, chuyển đổi hình thức sở hữu, hợp nhất, sáp nhập, chia tách, giải thể, phá sản) để hình thành một kỳ tính thuế thu nhập doanh nghiệp. Kỳ tính thuế thu nhập doanh nghiệp năm đầu tiên hoặc kỳ tính thuế thu nhập doanh nghiệp năm cuối cùng không vượt quá 15 tháng.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e\u003cstrong\u003e4. \u003c/strong\u003eTrường hợp doanh nghiệp thực hiện chuyển đổi kỳ tính thuế thu nhập doanh nghiệp (bao gồm cả chuyển đổi kỳ tính thuế từ năm dương lịch sang năm tài chính hoặc ngược lại) thì kỳ tính thuế thu nhập doanh nghiệp của năm chuyển đổi không vượt quá 12 tháng. Doanh nghiệp đang trong thời gian được hưởng ưu đãi thuế thu nhập doanh nghiệp mà có thực hiện chuyển đổi kỳ tính thuế thì doanh nghiệp được lựa chọn: Ưu đãi trong năm chuyển đổi kỳ tính thuế hoặc nộp thuế theo mức thuế suất phổ thông của năm chuyển đổi kỳ tính thuế và hưởng ưu đãi thuế sang năm tiếp theo.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eVí dụ 1: Doanh nghiệp A (DN A) kỳ tính thuế thu nhập doanh nghiệp năm 2011 áp dụng theo năm dương lịch, đầu năm 2012 lựa chọn chuyển đổi sang năm tài chính từ ngày 01/4 năm này sang ngày 31/03 năm sau, thì kỳ tính thuế thu nhập doanh nghiệp năm chuyển đổi (năm chuyển đổi 2012) được tính từ ngày 01/01/2012 đến hết ngày 31/03/2012 (3 tháng), kỳ tính thuế TNDN năm tiếp theo được tính từ ngày 01/04/2012 đến hết ngày 31/03/2013.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eVí dụ 2: Cũng trường hợp nêu trên nhưng DN A được hưởng ưu đãi thuế thu nhập doanh nghiệp (miễn thuế 2 năm, giảm 50% thuế TNDN trong 3 năm tiếp theo), năm 2009 bắt đầu được miễn thuế thì DN A sẽ hưởng ưu đãi thuế như sau (miễn thuế năm 2009, 2010; giảm 50% thuế năm 2011, 2012, 2013).\u003c/p\u003e\n\u003cp\u003eTrường hợp doanh nghiệp lựa chọn giảm 50% thuế theo kỳ tính thuế năm chuyển đổi 2012 thì doanh nghiệp tiếp tục thực hiện giảm 50% thuế TNDN năm chuyển đổi và năm tính thuế tiếp theo (năm tài chính 2012 từ 1/4/2012 đến 31/3/2013).\u003c/p\u003e\n\u003cp\u003eTrường hợp doanh nghiệp lựa chọn không hưởng ưu đãi giảm 50% thuế TNDN đối với kỳ tính thuế TNDN năm chuyển đổi 2012 (kỳ tính thuế năm chuyển đổi 2012 kê khai nộp thuế theo mức thuế suất phổ thông) thì doanh nghiệp được giảm 50% thuế TNDN năm tài chính 2012 (từ 1/4/2012 đến 31/3/2013) và năm tài chính 2013 (từ 1/4/2013 đến 31/3/2014).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5\u003c/strong\u003e\u003cstrong\u003e.\u003c/strong\u003e Đơn vị sự nghiệp có phát sinh hoạt động kinh doanh hàng hoá, dịch vụ thuộc đối tượng chịu thuế thu nhập doanh nghiệp mà các đơn vị này hạch toán được doanh thu nhưng không hạch toán và xác định được chi phí, thu nhập của hoạt động kinh doanh thì kê khai nộp thuế thu nhập doanh nghiệp tính theo tỷ lệ % trên doanh thu bán hàng hoá, dịch vụ, cụ thể như sau:\u003c/p\u003e\n\u003cp\u003e+ Đối với dịch vụ: 5%;\u003c/p\u003e\n\u003cp\u003e+ Đối với kinh doanh hàng hoá: 1%;\u003c/p\u003e\n\u003cp\u003e+ Đối với hoạt động khác (bao gồm cả hoạt động giáo dục, y tế, biểu diễn nghệ thuật): 2%.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eVí dụ 3: Đơn vị sự nghiệp A có phát sinh hoạt động cho thuê nhà, doanh thu cho thuê nhà một (01) năm là 100 triệu đồng, đơn vị không hạch toán và xác định được chi phí, thu nhập của hoạt động cho thuê nhà nêu trên do vậy đơn vị lựa chọn kê khai nộp thuế thu nhập doanh nghiệp tính theo tỷ lệ % trên doanh thu bán hàng hoá, dịch vụ như sau:\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eSố thuế TNDN phải nộp = 100.000.000 đồng x 5% = 5.000.000 đồng.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e6\u003c/strong\u003e\u003cstrong\u003e. \u003c/strong\u003eDoanh nghiệp có doanh thu, chi phí, thu nhập chịu thuế và thu nhập tính thuế bằng ngoại tệ thì phải quy đổi ngoại tệ ra đồng Việt Nam theo tỷ giá giao dịch bình quân trên thị trường ngoại tệ liên ngân hàng do Ngân hàng Nhà nước Việt Nam công bố tại thời điểm phát sinh doanh thu, chi phí, thu nhập chịu thuế và thu nhập tính thuế bằng ngoại tệ, trừ trường hợp pháp luật có quy định khác. Đối với loại ngoại tệ không có tỷ giá hối đoái với đồng Việt Nam thì phải quy đổi thông qua một loại ngoại tệ có tỷ giá hối đoái với đồng Việt Nam.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐiều 4. Xác định thu nhập tính thuế\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1. \u003c/strong\u003eThu nhập tính thuế trong kỳ tính thuế được xác định bằng thu nhập chịu thuế trừ thu nhập được miễn thuế và các khoản lỗ được kết chuyển từ các năm trước theo quy định.\u003c/p\u003e\n\u003cp\u003eThu nhập tính thuế được xác định theo công thức sau:\u003c/p\u003e\n\u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"width:607px;\" width=\"607\"\u003e\n \u003ctbody\u003e\n  \u003ctr\u003e\n   \u003ctd style=\"width:139px;\"\u003e\n    \u003cp align=\"center\"\u003eThu nhập tính thuế\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:28px;\"\u003e\n    \u003cp align=\"center\"\u003e=\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:91px;\"\u003e\n    \u003cp align=\"center\"\u003eThu nhập chịu thuế\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:21px;\"\u003e\n    \u003cp align=\"center\"\u003e-\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:131px;\"\u003e\n    \u003cp align=\"center\"\u003eThu nhập được miễn thuế\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:37px;\"\u003e\n    \u003cp align=\"center\"\u003e+\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:160px;\"\u003e\n    \u003cp align=\"center\"\u003eCác khoản lỗ được kết chuyển theo quy định\u003c/p\u003e\u003c/td\u003e\n  \u003c/tr\u003e\n \u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003e2. \u003c/strong\u003eThu nhập chịu thuế\u003c/p\u003e\n\u003cp\u003eThu nhập chịu thuế trong kỳ tính thuế bao gồm thu nhập từ hoạt động sản xuất, kinh doanh hàng hoá, dịch vụ và thu nhập khác.\u003c/p\u003e\n\u003cp\u003eThu nhập chịu thuế trong kỳ tính thuế xác định như sau:\u003c/p\u003e\n\u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"width:100.0%;\" width=\"100%\"\u003e\n \u003ctbody\u003e\n  \u003ctr\u003e\n   \u003ctd style=\"width:16.76%;\"\u003e\n    \u003cp align=\"center\"\u003eThu nhập chịu thuế\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:10.76%;\"\u003e\n    \u003cp align=\"center\"\u003e=\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:17.48%;\"\u003e\n    \u003cp align=\"center\"\u003eDoanh thu\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:10.02%;\"\u003e\n    \u003cp align=\"center\"\u003e-\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:16.52%;\"\u003e\n    \u003cp align=\"center\"\u003eChi phí được trừ\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:10.76%;\"\u003e\n    \u003cp align=\"center\"\u003e+\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:17.68%;\"\u003e\n    \u003cp align=\"center\"\u003eCác khoản thu nhập khác\u003c/p\u003e\u003c/td\u003e\n  \u003c/tr\u003e\n \u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThu nhập từ hoạt động sản xuất kinh doanh hàng hóa, dịch vụ bằng doanh thu của hoạt động sản xuất kinh doanh hàng hóa, dịch vụ trừ chi phí được trừ của hoạt động sản xuất kinh doanh hàng hóa, dịch vụ đó. Doanh nghiệp có nhiều hoạt động sản xuất kinh doanh áp dụng nhiều mức thuế suất khác nhau thì doanh nghiệp phải tính riêng thu nhập của từng hoạt động nhân với thuế suất tương ứng.\u003c/p\u003e\n\u003cp\u003eThu nhập từ hoạt động chuyển nhượng bất động sản; chuyển nhượng dự án (không gắn liền với chuyển quyền sử dụng đất, chuyển quyền thuê đất); chuyển nhượng quyền thực hiện dự án, chuyển nhượng quyền thăm dò, khai thác, chế biến khoáng sản theo quy định của pháp luật phải hạch toán riêng để kê khai nộp thuế thu nhập doanh nghiệp với mức thuế suất 25%, không được hưởng ưu đãi thuế thu nhập doanh nghiệp, không được bù trừ với thu nhập hoặc lỗ của các hoạt động sản xuất kinh doanh khác. Trường hợp doanh nghiệp có các hoạt động chuyển nhượng bất động sản; chuyển nhượng dự án (không gắn liền với chuyển quyền sử dụng đất, chuyển quyền thuê đất); chuyển nhượng quyền thực hiện dự án, chuyển nhượng quyền thăm dò, khai thác, chế biến khoáng sản theo quy định của pháp luật thì được bù trừ lãi, lỗ của các hoạt động này với nhau để kê khai nộp thuế thu nhập doanh nghiệp.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐiều 5. Doanh thu\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1.\u003c/strong\u003e Doanh thu để tính thu nhập chịu thuế được xác định như sau:\u003c/p\u003e\n\u003cp\u003eDoanh thu để tính thu nhập chịu thuế là toàn bộ tiền bán hàng hoá, tiền gia công, tiền cung cấp dịch vụ bao gồm cả khoản trợ giá, phụ thu, phụ trội mà doanh nghiệp được hưởng không phân biệt đã thu được tiền hay chưa thu được tiền.\u003c/p\u003e\n\u003cp\u003ea) Đối với doanh nghiệp nộp thuế giá trị gia tăng theo phương pháp khấu trừ thuế là doanh thu chưa bao gồm thuế giá trị gia tăng.\u003c/p\u003e\n\u003cp\u003eVí dụ 4: Doanh nghiệp A là đối tượng nộp thuế giá trị gia tăng theo phương pháp khấu trừ thuế. Hoá đơn giá trị gia tăng gồm các chỉ tiêu như sau:\u003c/p\u003e\n\u003cp\u003eGiá bán: 100.000 đồng.\u003c/p\u003e\n\u003cp\u003eThuế GTGT (10%): 10.000 đồng.\u003c/p\u003e\n\u003cp\u003eGiá thanh toán : 110.000 đồng.\u003c/p\u003e\n\u003cp\u003eDoanh thu để tính thu nhập chịu thuế là 100.000 đồng.\u003c/p\u003e\n\u003cp\u003eb) Đối với doanh nghiệp nộp thuế giá trị gia tăng theo phương pháp trực tiếp trên giá trị gia tăng là doanh thu bao gồm cả thuế giá trị gia tăng.\u003c/p\u003e\n\u003cp\u003eVí dụ 5: Doanh nghiệp B là đối tượng nộp thuế giá trị gia tăng theo phương pháp trực tiếp trên giá trị gia tăng. Hoá đơn bán hàng chỉ ghi giá bán là 110.000 đồng (giá đã có thuế GTGT).\u003c/p\u003e\n\u003cp\u003eDoanh thu để tính thu nhập chịu thuế là 110.000 đồng.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.\u003c/strong\u003e Thời điểm xác định doanh thu để tính thu nhập chịu thuế được xác định như sau:\u003c/p\u003e\n\u003cp\u003ea) Đối với hoạt động bán hàng hoá là thời điểm chuyển giao quyền sở hữu, quyền sử dụng hàng hoá cho người mua.\u003c/p\u003e\n\u003cp\u003eb) Đối với hoạt động cung ứng dịch vụ là thời điểm hoàn thành việc cung ứng dịch vụ cho người mua hoặc thời điểm lập hoá đơn cung ứng dịch vụ.\u003c/p\u003e\n\u003cp\u003eTrường hợp thời điểm lập hoá đơn cung ứng dịch vụ xảy ra trước thời điểm dịch vụ hoàn thành thì thời điểm xác định doanh thu tính thuế được tính theo thời điểm lập hoá đơn cung ứng dịch vụ.\u003c/p\u003e\n\u003cp\u003ec) Trường hợp khác theo quy định của pháp luật.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3.\u003c/strong\u003e Doanh thu để tính thu nhập chịu thuế trong một số trường hợp xác định như sau:\u003c/p\u003e\n\u003cp\u003ea) Đối với hàng hoá, dịch vụ bán theo phương thức trả góp, trả chậm là tiền bán hàng hoá, dịch vụ trả tiền một lần, không bao gồm tiền lãi trả góp, tiền lãi trả chậm.\u003c/p\u003e\n\u003cp\u003eb) Đối với hàng hoá, dịch vụ dùng để trao đổi; biếu, tặng, cho; tiêu dùng nội bộ (không bao gồm hàng hoá, dịch vụ sử dụng để tiếp tục quá trình sản xuất, kinh doanh của doanh nghiệp) được xác định theo giá bán của sản phẩm, hàng hoá, dịch vụ cùng loại hoặc tương đương trên thị trường tại thời điểm trao đổi; biếu, tặng, cho; tiêu dùng nội bộ.\u003c/p\u003e\n\u003cp\u003ec) Đối với hoạt động gia công hàng hoá là tiền thu về hoạt động gia công bao gồm cả tiền công, chi phí về nhiên liệu, động lực, vật liệu phụ và chi phí khác phục vụ cho việc gia công hàng hoá.\u003c/p\u003e\n\u003cp\u003ed) Đối với hàng hoá của các đơn vị giao đại lý, ký gửi và nhận đại lý, ký gửi theo hợp đồng đại lý, ký gửi bán đúng giá hưởng hoa hồng được xác định như sau:\u003c/p\u003e\n\u003cp\u003e- Doanh nghiệp giao hàng hoá cho các đại lý (kể cả đại lý bán hàng đa cấp), ký gửi là tổng số tiền bán hàng hoá.\u003c/p\u003e\n\u003cp\u003e- Doanh nghiệp nhận làm đại lý, ký gửi bán hàng đúng giá quy định của doanh nghiệp giao đại lý, ký gửi là tiền hoa hồng được hưởng theo hợp đồng đại lý, ký gửi hàng hoá.\u003c/p\u003e\n\u003cp\u003ee) Đối với hoạt động cho thuê tài sản là số tiền bên thuê trả từng kỳ theo hợp đồng thuê. Trường hợp bên thuê trả tiền trước cho nhiều năm thì doanh thu để tính thu nhập chịu thuế được phân bổ cho số năm trả tiền trước hoặc được xác định theo doanh thu trả tiền một lần.\u003c/p\u003e\n\u003cp\u003eDoanh nghiệp căn cứ điều kiện thực hiện chế độ kế toán, hoá đơn chứng từ thực tế và việc xác định chi phí, có thể lựa chọn một trong hai phương pháp xác định doanh thu để tính thu nhập chịu thuế như sau:\u003c/p\u003e\n\u003cp\u003e- Là số tiền cho thuê tài sản của từng năm được xác định bằng (=) số tiền trả trước chia (:) số năm trả tiền trước.\u003c/p\u003e\n\u003cp\u003e- Là toàn bộ số tiền cho thuê tài sản của số năm trả tiền trước.\u003c/p\u003e\n\u003cp\u003eTrường hợp doanh nghiệp đang trong thời gian hưởng ưu đãi thuế thu nhập doanh nghiệp lựa chọn phương pháp xác định doanh thu để tính thu nhập chịu thuế là toàn bộ số tiền thuê bên thuê trả trước cho nhiều năm thì việc xác định số thuế thu nhập doanh nghiệp từng năm miễn thuế, giảm thuế căn cứ vào tổng số thuế thu nhập doanh nghiệp của số năm trả tiền trước chia (:) số năm bên thuê trả tiền trước.\u003c/p\u003e\n\u003cp\u003eg) Đối với hoạt động tín dụng, hoạt động cho thuê tài chính là tiền lãi cho vay, doanh thu về cho thuê tài chính phải thu phát sinh trong kỳ tính thuế.\u003c/p\u003e\n\u003cp\u003eh) Đối với hoạt động vận tải là toàn bộ doanh thu vận chuyển hành khách, hàng hoá, hành lý phát sinh trong kỳ tính thuế.\u003c/p\u003e\n\u003cp\u003ei) Đối với hoạt động cung cấp điện, nước sạch là số tiền cung cấp điện, nước sạch ghi trên hoá đơn giá trị gia tăng. Thời điểm xác định doanh thu để tính thu nhập chịu thuế là ngày xác nhận chỉ số công tơ điện và được ghi trên hoá đơn tính tiền điện, tiền nước sạch.\u003c/p\u003e\n\u003cp\u003eVí dụ 6: Hoá đơn tiền điện ghi chỉ số công tơ từ ngày 5/12 đến ngày 5/1. Doanh thu của hoá đơn này được tính vào tháng 1.\u003c/p\u003e\n\u003cp\u003ek) Đối với hoạt động kinh doanh sân gôn là tiền bán thẻ hội viên, bán vé chơi gôn và các khoản thu khác trong kỳ tính thuế được xác định như sau:\u003c/p\u003e\n\u003cp\u003e- Đối với hình thức bán vé, bán thẻ chơi gôn theo ngày, doanh thu kinh doanh sân gôn làm căn cứ xác định thu nhập tính thuế thu nhập doanh nghiệp là số tiền thu được từ bán vé, bán thẻ phát sinh trong kỳ tính thuế.\u003c/p\u003e\n\u003cp\u003e- Đối với hình thức bán vé, bán thẻ hội viên loại thẻ trả trước cho nhiều năm, doanh thu làm căn cứ xác định thu nhập tính thuế thu nhập doanh nghiệp của từng năm là số tiền bán thẻ thực thu được chia cho số năm sử dụng thẻ.\u003c/p\u003e\n\u003cp\u003el) Đối với lĩnh vực kinh doanh bảo hiểm, doanh thu để tính thu nhập chịu thuế là toàn bộ số tiền thu được do cung ứng dịch vụ bảo hiểm và hàng hoá, dịch vụ khác, kể cả phụ thu và phí thu thêm mà doanh nghiệp bảo hiểm được hưởng chưa có thuế giá trị gia tăng, bao gồm:\u003c/p\u003e\n\u003cp\u003e- Doanh thu từ hoạt động kinh doanh bảo hiểm:\u003c/p\u003e\n\u003cp\u003eĐối với hoạt động kinh doanh bảo hiểm và tái bảo hiểm là số tiền phải thu về thu phí bảo hiểm gốc; thu phí nhận tái bảo hiểm; thu hoa hồng nhượng tái bảo hiểm; thu phí quản lý đơn bảo hiểm; thu phí về dịch vụ đại lý bao gồm giám định tổn thất, xét giải quyết bồi thường, yêu cầu người thứ ba bồi hoàn, xử lý hàng bồi thường 100% (không kể giám định hộ giữa các doanh nghiệp thành viên hạch toán nội bộ trong cùng một doanh nghiệp bảo hiểm hạch toán độc lập) sau khi đã trừ đi các khoản phải chi để giảm thu như: hoàn phí bảo hiểm; giảm phí bảo hiểm; hoàn phí nhận tái bảo hiểm; giảm phí nhận tái bảo hiểm; hoàn hoa hồng nhượng tái bảo hiểm; giảm hoa hồng nhượng tái bảo hiểm.\u003c/p\u003e\n\u003cp\u003eTrường hợp các doanh nghiệp bảo hiểm tham gia đồng bảo hiểm, doanh thu để tính thu nhập chịu thuế của từng bên là tiền thu phí bảo hiểm gốc được phân bổ theo tỷ lệ đồng bảo hiểm cho mỗi bên chưa bao gồm thuế giá trị gia tăng.\u003c/p\u003e\n\u003cp\u003eĐối với hợp đồng bảo hiểm thoả thuận trả tiền theo từng kỳ thì doanh thu để tính thu nhập chịu thuế là số tiền phải thu phát sinh trong từng kỳ.\u003c/p\u003e\n\u003cp\u003eTrường hợp có thực hiện các nghiệp vụ thu hộ giữa các doanh nghiệp trực thuộc hoặc giữa doanh nghiệp hạch toán phụ thuộc với trụ sở chính của doanh nghiệp bảo hiểm thì doanh thu để tính thu nhập chịu thuế không bao gồm phần doanh thu thu hộ.\u003c/p\u003e\n\u003cp\u003e- Doanh thu hoạt động môi giới bảo hiểm: Các khoản thu hoa hồng môi giới bảo hiểm sau khi trừ các khoản hoa hồng môi giới bảo hiểm, giảm và hoàn hoa hồng môi giới bảo hiểm.\u003c/p\u003e\n\u003cp\u003em) Đối với hoạt động xây dựng, lắp đặt là giá trị công trình, giá trị hạng mục công trình hoặc giá trị khối lượng công trình xây dựng, lắp đặt nghiệm thu.\u003c/p\u003e\n\u003cp\u003e- Trường hợp xây dựng, lắp đặt có bao thầu nguyên vật liệu, máy móc, thiết bị là số tiền từ hoạt động xây dựng, lắp đặt bao gồm cả giá trị nguyên vật liệu, máy móc, thiết bị.\u003c/p\u003e\n\u003cp\u003e- Trường hợp xây dựng, lắp đặt không bao thầu nguyên vật liệu, máy móc, thiết bị là số tiền từ hoạt động xây dựng, lắp đặt không bao gồm giá trị nguyên vật liệu, máy móc, thiết bị.\u003c/p\u003e\n\u003cp\u003en) Đối với hoạt động kinh doanh dưới hình thức hợp đồng hợp tác kinh doanh:\u003c/p\u003e\n\u003cp\u003e- Trường hợp các bên tham gia hợp đồng hợp tác kinh doanh phân chia kết quả kinh doanh bằng doanh thu bán hàng hoá, dịch vụ thì doanh thu tính thuế là doanh thu của từng bên được chia theo hợp đồng.\u003c/p\u003e\n\u003cp\u003e- Trường hợp các bên tham gia hợp đồng hợp tác kinh doanh phân chia kết quả kinh doanh bằng sản phẩm thì doanh thu tính thuế là doanh thu của sản phẩm được chia cho từng bên theo hợp đồng.\u003c/p\u003e\n\u003cp\u003e- Trường hợp các bên tham gia hợp đồng hợp tác kinh doanh phân chia kết quả kinh doanh bằng lợi nhuận trước thuế thu nhập doanh nghiệp thì doanh thu để xác định thu nhập trước thuế là số tiền bán hàng hoá, dịch vụ theo hợp đồng. Các bên tham gia hợp đồng hợp tác kinh doanh phải cử ra một bên làm đại diện có trách nhiệm xuất hoá đơn, ghi nhận doanh thu, chi phí, xác định lợi nhuận trước thuế thu nhập doanh nghiệp chia cho từng bên tham gia hợp đồng hợp tác kinh doanh. Mỗi bên tham gia hợp đồng hợp tác kinh doanh tự thực hiện nghĩa vụ thuế thu nhập doanh nghiệp của mình theo quy định hiện hành.\u003c/p\u003e\n\u003cp\u003e- Trường hợp các bên tham gia hợp đồng hợp tác kinh doanh phân chia kết quả kinh doanh bằng lợi nhuận sau thuế thu nhập doanh nghiệp thì doanh thu để xác định thu nhập chịu thuế là số tiền bán hàng hoá, dịch vụ theo hợp đồng. Các bên tham gia hợp đồng hợp tác kinh doanh phải cử ra một bên làm đại diện có trách nhiệm xuất hoá đơn, ghi nhận doanh thu, chi phí và kê khai nộp thuế thu nhập doanh nghiệp thay cho các bên còn lại tham gia hợp đồng hợp tác kinh doanh.\u003c/p\u003e\n\u003cp\u003eo) Đối với hoạt động kinh doanh trò chơi có thưởng (casino, trò chơi điện tử có thưởng, kinh doanh giải trí có đặt cược) là số tiền thu từ hoạt động này bao gồm cả thuế tiêu thụ đặc biệt trừ số tiền đã trả thưởng cho khách.\u003c/p\u003e\n\u003cp\u003ep) Đối với hoạt động kinh doanh chứng khoán là các khoản thu từ dịch vụ môi giới, tự doanh chứng khoán, bảo lãnh phát hành chứng khoán, quản lý danh mục đầu tư, tư vấn tài chính và đầu tư chứng khoán, quản lý quỹ đầu tư, phát hành chứng chỉ quỹ, dịch vụ tổ chức thị trường và các dịch vụ chứng khoán khác theo quy định của pháp luật.\u003c/p\u003e\n\u003cp\u003eq) Đối với dịch vụ tài chính phái sinh là số tiền thu từ việc cung ứng các dịch vụ tài chính phái sinh thực hiện trong kỳ tính thuế.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐiều 6. Các khoản chi được trừ và \u003c/strong\u003e\u003cstrong\u003ekhông được trừ \u003c/strong\u003e\u003cstrong\u003ekhi xác định thu nhập chịu thuế\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1.\u003c/strong\u003e Trừ các khoản chi nêu tại Khoản 2 Điều này, doanh nghiệp được trừ mọi khoản chi nếu đáp ứng đủ các điều kiện sau:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ea)\u003c/strong\u003e Khoản chi thực tế phát sinh liên quan đến hoạt động sản xuất, kinh doanh của doanh nghiệp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eb) \u003c/strong\u003eKhoản chi có đủ hoá đơn, chứng từ hợp pháp theo quy định của pháp luật.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.\u003c/strong\u003e Các khoản chi không được trừ khi xác định thu nhập chịu thuế bao gồm:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.1.\u003c/strong\u003e Khoản chi không đáp ứng đủ các điều kiện quy định tại Khoản 1 Điều này.\u003c/p\u003e\n\u003cp\u003eTrường hợp doanh nghiệp có chi phí liên quan đến phần giá trị tổn thất do thiên tai, dịch bệnh, hoả hoạn và trường hợp bất khả kháng khác không được bồi thường thì khoản chi này được tính vào chi phí được trừ khi xác định thu nhập chịu thuế, cụ thể như sau:\u003c/p\u003e\n\u003cp\u003eDoanh nghiệp phải tự xác định rõ tổng giá trị tổn thất do thiên tai, dịch bệnh, hoả hoạn và trường hợp bất khả kháng khác theo quy định của pháp luật.\u003c/p\u003e\n\u003cp\u003ePhần giá trị tổn thất do thiên tai, dịch bệnh, hoả hoạn và trường hợp bất khả kháng khác không được bồi thường được xác định bằng tổng giá trị tổn thất trừ phần bồi thường do tổ chức, cá nhân chịu trách nhiệm thanh toán theo quy định của pháp luật.\u003c/p\u003e\n\u003cp\u003ea) Hồ sơ đối với tài sản, hàng hoá bị tổn thất do thiên tai, dịch bệnh, hoả hoạn được tính vào chi phí được trừ như sau:\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Văn bản của doanh nghiệp gửi cơ quan thuế trực tiếp quản lý giải trình về tài sản, hàng hoá bị tổn thất do thiên tai, dịch bệnh, hoả hoạn.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Biên bản kiểm kê giá trị tài sản, hàng hoá bị tổn thất do doanh nghiệp lập.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eBiên bản kiểm kê giá trị tài sản, hàng hoá tổn thất phải xác định rõ giá trị tài sản, hàng hoá bị tổn thất, nguyên nhân tổn thất, trách nhiệm của tổ chức, cá nhân về những tổn thất; chủng loại, số lượng, giá trị tài sản, hàng hoá có thể thu hồi được (nếu có); bảng kê xuất nhập tồn hàng hoá bị tổn thất có xác nhận do đại diện hợp pháp của doanh nghiệp ký và chịu trách nhiệm trước pháp luật.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Văn bản xác nhận của Uỷ ban nhân dân cấp xã, phường, Ban quản lý Khu công nghiệp, Khu chế xuất, Khu kinh tế nơi xảy ra sự việc thiên tai, dịch bệnh, hoả hoạn là trong thời gian đó có xảy ra thiên tai, dịch bệnh, hoả hoạn.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Hồ sơ bồi thường thiệt hại được cơ quan bảo hiểm chấp nhận bồi thường (nếu có).\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Hồ sơ quy định trách nhiệm của tổ chức, cá nhân phải bồi thường (nếu có).\u003c/p\u003e\n\u003cp\u003eb) Hàng hoá bị hư hỏng do hết hạn sử dụng, bị hư hỏng do thay đổi quá trình sinh hoá tự nhiên không được bồi thường thì được tính vào chi phí được trừ khi xác định thu nhập chịu thuế.\u003c/p\u003e\n\u003cp\u003eHồ sơ đối với hàng hoá bị hư hỏng do hết hạn sử dụng, bị hư hỏng do thay đổi quá trình sinh hoá tự nhiên được tính vào chi phí được trừ như sau:\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Văn bản của doanh nghiệp gửi cơ quan thuế trực tiếp quản lý giải trình về hàng hoá bị bị hư hỏng do hết hạn sử dụng, bị hư hỏng do thay đổi quá trình sinh hoá tự nhiên.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Biên bản kiểm kê giá trị hàng hoá bị hư hỏng do doanh nghiệp lập.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eBiên bản kiểm kê giá trị hàng hoá hư hỏng phải xác định rõ giá trị hàng hoá bị hư hỏng, nguyên nhân hư hỏng; chủng loại, số lượng, giá trị hàng hoá có thể thu hồi được (nếu có) kèm theo bảng kê xuất nhập tồn hàng hoá bị hư hỏng có xác nhận do đại diện hợp pháp của doanh nghiệp ký và chịu trách nhiệm trước pháp luật.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Hồ sơ bồi thường thiệt hại được cơ quan bảo hiểm chấp nhận bồi thường (nếu có).\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Hồ sơ quy định trách nhiệm của tổ chức, cá nhân phải bồi thường (nếu có).\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003ec) Doanh nghiệp gửi cơ quan thuế trực tiếp quản lý văn bản giải trình về tài sản, hàng hoá bị tổn thất do thiên tai, dịch bệnh, hoả hoạn; hàng hoá bị hư hỏng do hết hạn sử dụng, bị hư hỏng do thay đổi quá trình sinh hoá tự nhiên không được bồi thường chậm nhất khi nộp hồ sơ kê khai quyết toán thuế thu nhập doanh nghiệp theo quy định của năm xảy ra tài sản, hàng hóa bị tổn thất, bị hư hỏng. Các hồ sơ khác (bao gồm Biên bản kiểm kê giá trị tài sản, hàng hoá bị tổn thất, bị hư hỏng; Văn bản xác nhận của Uỷ ban nhân dân cấp xã, phường, Ban quản lý Khu công nghiệp, Khu chế xuất, Khu kinh tế; Hồ sơ bồi thường thiệt hại được cơ quan bảo hiểm chấp nhận bồi thường (nếu có); Hồ sơ quy định trách nhiệm của tổ chức, cá nhân phải bồi thường (nếu có) và các tài liệu khác) được lưu tại doanh nghiệp và xuất trình với cơ quan thuế khi cơ quan thuế yêu cầu.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.2. \u003c/strong\u003eChi khấu hao tài sản cố định thuộc một trong các trường hợp sau:\u003c/p\u003e\n\u003cp\u003ea) Chi khấu hao đối với tài sản cố định không sử dụng cho hoạt động sản xuất, kinh doanh hàng hoá, dịch vụ.\u003c/p\u003e\n\u003cp\u003eRiêng tài sản cố định phục vụ cho người lao động làm việc tại doanh nghiệp như: nhà nghỉ giữa ca, nhà ăn giữa ca, nhà thay quần áo, nhà vệ sinh, phòng hoặc trạm y tế để khám chữa bệnh, cơ sở đào tạo, dạy nghề và các thiết bị, nội thất đủ điều kiện là tài sản cố định lắp đặt trong nhà nghỉ giữa ca, nhà ăn giữa ca, nhà thay quần áo, nhà vệ sinh, phòng hoặc trạm y tế để khám chữa bệnh, cơ sở đào tạo, dạy nghề; bể chứa nước sạch, nhà để xe, xe đưa đón người lao động, nhà ở trực tiếp cho người lao động do doanh nghiệp đầu tư, xây dựng được trích khấu hao tính vào chi phí được trừ khi xác định thu nhập chịu thuế.\u003c/p\u003e\n\u003cp\u003eb) Chi khấu hao đối với tài sản cố định không có giấy tờ chứng minh được thuộc quyền sở hữu của doanh nghiệp (trừ tài sản cố định thuê mua tài chính).\u003c/p\u003e\n\u003cp\u003ec) Chi khấu hao đối với tài sản cố định không được quản lý, theo dõi, hạch toán trong sổ sách kế toán của doanh nghiệp theo chế độ quản lý tài sản cố định và hạch toán kế toán hiện hành.\u003c/p\u003e\n\u003cp\u003ed) Phần trích khấu hao vượt mức quy định hiện hành của Bộ Tài chính về chế độ quản lý, sử dụng và trích khấu hao tài sản cố định.\u003c/p\u003e\n\u003cp\u003eDoanh nghiệp thực hiện thông báo phương pháp trích khấu hao tài sản cố định mà doanh nghiệp lựa chọn áp dụng với cơ quan thuế trực tiếp quản lý trước khi thực hiện trích khấu hao (ví dụ: thông báo lựa chọn thực hiện phương pháp khấu hao đường thẳng...). Hàng năm doanh nghiệp tự quyết định mức trích khấu hao tài sản cố định theo quy định hiện hành của Bộ Tài chính về chế độ quản lý, sử dụng và trích khấu hao tài sản cố định kể cả trường hợp khấu hao nhanh (nếu đáp ứng điều kiện).\u003c/p\u003e\n\u003cp\u003eDoanh nghiệp hoạt động có hiệu quả kinh tế cao được trích khấu hao nhanh nhưng tối đa không quá 2 lần mức khấu hao xác định theo phương pháp đường thẳng để nhanh chóng đổi mới công nghệ. Khi thực hiện trích khấu hao nhanh, doanh nghiệp phải đảm bảo kinh doanh có lãi.\u003c/p\u003e\n\u003cp\u003eTài sản cố định góp vốn, tài sản cố định điều chuyển khi chia, tách, hợp nhất, sáp nhập, chuyển đổi loại hình có đánh giá lại theo quy định thì doanh nghiệp nhận tài sản cố định này được tính khấu hao vào chi phí được trừ theo nguyên giá đánh giá lại. Đối với loại tài sản khác không đủ tiêu chuẩn là tài sản cố định có góp vốn, điều chuyển khi chia, tách, hợp nhất, sáp nhập, chuyển đổi loại hình và tài sản này có đánh giá lại theo quy định thì doanh nghiệp nhận tài sản này được tính vào chi phí được trừ theo giá đánh giá lại.\u003c/p\u003e\n\u003cp\u003eĐối với tài sản cố định tự làm nguyên giá tài sản cố định được trích khấu hao tính vào chi phí được trừ là tổng các chi phí sản xuất để hình thành nên tài sản đó.\u003c/p\u003e\n\u003cp\u003eĐối với tài sản là công cụ, dụng cụ, bao bì luân chuyển, … không đáp ứng đủ điều kiện xác định là tài sản cố định theo quy định thì chi phí mua tài sản nêu trên được phân bổ dần vào chi phí hoạt động sản xuất kinh doanh trong kỳ nhưng tối đa không quá 2 năm.\u003c/p\u003e\n\u003cp\u003ee) Phần trích khấu hao tương ứng với phần nguyên giá vượt trên 1,6 tỷ đồng/xe đối với ô tô chở người từ 9 chỗ ngồi trở xuống mới đăng ký sử dụng và hạch toán trích khấu hao tài sản cố định từ ngày 01/01/2009 trở đi (trừ ô tô chuyên kinh doanh vận tải hành khách, du lịch và khách sạn); phần trích khấu hao đối với tài sản cố định là tàu bay dân dụng và du thuyền không sử dụng cho mục đích kinh doanh vận chuyển hàng hoá, hành khách, khách du lịch.\u003c/p\u003e\n\u003cp\u003eÔ tô chở người từ 9 chỗ ngồi trở xuống chuyên kinh doanh vận tải hành khách, du lịch và khách sạn là các ô tô được đăng ký tên doanh nghiệp mà doanh nghiệp này trong Giấy chứng nhận đăng ký doanh nghiệp hoặc Giấy chứng nhận đăng ký kinh doanh có đăng ký một trong các ngành nghề: vận tải hành khách, du lịch, kinh doanh khách sạn và được cấp phép kinh doanh quy định tại các văn bản pháp luật về kinh doanh vận tải, hành khách, du lịch, khách sạn.\u003c/p\u003e\n\u003cp\u003eTàu bay dân dụng và du thuyền không sử dụng cho mục đích kinh doanh vận chuyển hàng hoá, hành khách, khách du lịch là tàu bay dân dụng, du thuyền của các doanh nghiệp đăng ký và hạch toán trích khấu hao tài sản cố định nhưng trong Giấy chứng nhận đăng ký kinh doanh hoặc Giấy chứng nhận đăng ký doanh nghiệp của doanh nghiệp không đăng ký ngành nghề vận tải hàng hoá, vận tải hành khách, du lịch.\u003c/p\u003e\n\u003cp\u003eg) Khấu hao đối với tài sản cố định đã khấu hao hết giá trị.\u003c/p\u003e\n\u003cp\u003eh) Khấu hao đối với công trình trên đất vừa sử dụng cho sản xuất kinh doanh vừa sử dụng cho mục đích khác thì không được tính khấu hao vào chi phí được trừ đối với giá trị công trình trên đất tương ứng phần diện tích không sử dụng vào hoạt động sản xuất kinh doanh.\u003c/p\u003e\n\u003cp\u003eTrường hợp công trình trên đất như trụ sở văn phòng, nhà xưởng, cửa hàng kinh doanh phục vụ cho hoạt động sản xuất kinh doanh được xây dựng trên đất thuê, đất mượn của các tổ chức, cá nhân, hộ gia đình (không trực tiếp thuê đất của nhà nước hoặc thuê đất trong khu công nghiệp) doanh nghiệp chỉ được trích khấu hao tính vào chi phí được trừ theo đúng mức trích khấu hao tài sản cố định quy định hiện hành của Bộ Tài chính đối với các công trình này nếu đáp ứng các điều kiện sau:\u003c/p\u003e\n\u003cp\u003e- Có hợp đồng thuê đất, mượn đất giữa doanh nghiệp với đơn vị có đất và đại diện doanh nghiệp phải chịu trách nhiệm trước pháp luật về tính chính xác của hợp đồng.\u003c/p\u003e\n\u003cp\u003e- Hóa đơn thanh toán khối lượng công trình xây dựng bàn giao kèm theo hợp đồng xây dựng công trình, thanh lý hợp đồng, quyết toán giá trị công trình xây dựng mang tên, địa chỉ và mã số thuế của doanh nghiệp .\u003c/p\u003e\n\u003cp\u003e- Công trình trên đất được quản lý, theo dõi hạch toán theo quy định hiện hành về quản lý tài sản cố định.\u003c/p\u003e\n\u003cp\u003ei) Trường hợp tài sản cố định thuộc quyền sở hữu của doanh nghiệp đang dùng cho sản xuất kinh doanh nhưng phải tạm thời dừng do sản xuất theo mùa vụ với thời gian dưới 09 tháng; tạm thời dừng để sửa chữa, để di dời di chuyển địa điểm, để bảo trì, bảo dưỡng theo định kỳ, với thời gian dưới 12 tháng, sau đó tài sản cố định tiếp tục đưa vào phục vụ cho hoạt động sản xuất kinh doanh thì trong khoảng thời gian tạm dừng đó, doanh nghiệp được trích khấu hao và khoản chi phí khấu hao tài sản cố định trong thời gian tạm dừng được tính vào chi phí được trừ khi xác định thu nhập chịu thuế.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eDoanh nghiệp phải lưu giữ và cung cấp đầy đủ hồ sơ, lý do của việc tạm dừng tài sản cố định khi cơ quan thuế yêu cầu.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003ek) Quyền sử dụng đất lâu dài không được trích khấu hao và phân bổ vào chi phí được trừ khi xác định thu nhập chịu thuế; quyền sử dụng đất có thời hạn nếu có đầy đủ hoá đơn chứng từ và thực hiện đúng các thủ tục theo quy định của pháp luật, có tham gia vào hoạt động sản xuất kinh doanh thì được phân bổ dần vào chi phí được trừ theo thời hạn được phép sử dụng đất ghi trong giấy chứng nhận quyền sử dụng đất.\u003c/p\u003e\n\u003cp\u003eTrường hợp doanh nghiệp mua tài sản cố định hữu hình là nhà cửa, vật kiến trúc gắn liền với quyền sử dụng đất lâu dài thì giá trị quyền sử dụng đất phải xác định riêng và ghi nhận là tài sản cố định vô hình; Tài sản cố định hữu hình là nhà cửa, vật kiến trúc thì nguyên giá là giá mua thực tế phải trả cộng (+) các khoản chi phí liên quan trực tiếp đến việc đưa tài sản cố định hữu hình vào sử dụng. Giá trị quyền sử dụng đất được xác định theo giá ghi trên hợp đồng mua bất động sản (tài sản) phù hợp với giá thị trường nhưng không được thấp hơn giá đất do Uỷ ban nhân dân tỉnh, thành phố trực thuộc trung ương quy định tại thời điểm mua tài sản. Trường hợp doanh nghiệp mua tài sản cố định hữu hình là nhà cửa, vật kiến trúc gắn liền với quyền sử dụng đất lâu dài không tách riêng được giá trị quyền sử dụng đất thì giá trị quyền sử dụng được xác định theo giá do Uỷ ban nhân dân tỉnh, thành phố trực thuộc trung ương quy định tại thời điểm mua tài sản.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.3.\u003c/strong\u003e Chi nguyên liệu, vật liệu, nhiên liệu, năng lượng, hàng hoá phần vượt mức tiêu hao hợp lý.\u003c/p\u003e\n\u003cp style=\"margin-right:-2.25pt;\"\u003eDoanh nghiệp tự xây dựng, quản lý định mức tiêu hao nguyên liệu, vật liệu, nhiên liệu, năng lượng, hàng hoá sử dụng vào sản xuất, kinh doanh. Định mức này được xây dựng từ đầu năm hoặc đầu kỳ sản xuất sản phẩm và lưu tại doanh nghiệp đồng thời xuất trình đầy đủ với cơ quan thuế khi cơ quan thuế yêu cầu.\u003c/p\u003e\n\u003cp style=\"margin-right:-2.25pt;\"\u003eRiêng định mức chính của những sản phẩm chủ yếu của doanh nghiệp thì doanh nghiệp có trách nhiệm thông báo cho cơ quan thuế quản lý trực tiếp trong thời hạn 03 tháng đầu năm hoặc 03 tháng kể từ khi bắt đầu đi vào sản xuất, kinh doanh (đối với doanh nghiệp mới thành lập hoặc trường hợp doanh nghiệp có bổ sung sản xuất những sản phẩm mới mà sản phẩm này thuộc diện phải thông báo định mức nhưng chưa được thông báo). Danh mục định mức chính của những sản phẩm chủ yếu của doanh nghiệp do doanh nghiệp quyết định.\u003c/p\u003e\n\u003cp style=\"margin-right:-2.25pt;\"\u003eTrường hợp doanh nghiệp trong thời gian sản xuất kinh doanh có điều chỉnh, bổ sung định mức tiêu hao nguyên vật liệu đã thông báo với cơ quan thuế thì phải thông báo lại cho cơ quan thuế quản lý trực tiếp biết. Thời hạn cuối cùng của việc thông báo cho cơ quan thuế việc điều chỉnh, bổ sung định mức tiêu hao là thời hạn nộp tờ khai quyết toán thuế thu nhập doanh nghiệp theo quy định của năm quyết toán. Trường hợp một số nguyên liệu, vật liệu, nhiên liệu, hàng hoá Nhà nước đã ban hành định mức tiêu hao thì thực hiện theo định mức của Nhà nước đã ban hành. Trường hợp doanh nghiệp không thông báo định mức cho cơ quan thuế đúng thời hạn quy định thì cơ quan thuế khi thanh tra, kiểm tra có quyền ấn định chi phí nguyên liệu, vật liệu, hàng hoá. Việc ấn định chi phí nguyên liệu, vật liệu, hàng hoá được căn cứ theo pháp luật về quản lý thuế.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.4.\u003c/strong\u003e Chi phí của doanh nghiệp mua hàng hoá, dịch vụ không có hoá đơn, được phép lập Bảng kê thu mua hàng hoá, dịch vụ mua vào (theo mẫu số 01/TNDN kèm theo Thông tư này) nhưng không lập Bảng kê kèm theo chứng từ thanh toán cho người bán hàng, cung cấp dịch vụ trong các trường hợp: mua hàng hoá là nông sản, lâm sản, thủy sản của người sản xuất, đánh bắt trực tiếp bán ra; mua sản phẩm thủ công làm bằng đay, cói, tre, nứa, lá, song, mây, rơm, vỏ dừa, sọ dừa hoặc nguyên liệu tận dụng từ sản phẩm nông nghiệp của người sản xuất thủ công không kinh doanh trực tiếp bán ra; mua đất, đá, cát, sỏi của người dân tự khai thác trực tiếp bán ra; mua phế liệu của người trực tiếp thu nhặt; mua đồ dùng, tài sản của hộ gia đình, cá nhân đã qua sử dụng trực tiếp bán ra và một số dịch vụ mua của cá nhân không kinh doanh.\u003c/p\u003e\n\u003cp\u003eBảng kê thu mua hàng hoá, dịch vụ do người đại diện theo pháp luật hoặc người được uỷ quyền của doanh nghiệp ký và chịu trách nhiệm trước pháp luật về tính chính xác, trung thực. Trường hợp giá mua hàng hoá, dịch vụ trên bảng kê cao hơn giá thị trường tại thời điểm mua hàng thì cơ quan thuế căn cứ vào giá thị trường tại thời điểm mua hàng, dịch vụ cùng loại hoặc tương tự trên thị trường xác định lại mức giá để tính lại chi phí được trừ khi xác định thu nhập chịu thuế.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.5.\u003c/strong\u003e Chi tiền lương, tiền công, tiền thưởng cho người lao động thuộc một trong các trường hợp sau:\u003c/p\u003e\n\u003cp\u003ea) Chi tiền lương, tiền công và các khoản phải trả khác cho người lao động doanh nghiệp đã hạch toán vào chi phí sản xuất kinh doanh trong kỳ nhưng thực tế không chi trả hoặc không có chứng từ thanh toán theo quy định của pháp luật.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eb) Các khoản tiền thưởng, tiền mua bảo hiểm nhân thọ cho người lao động không được ghi cụ thể điều kiện được hưởng và mức được hưởng tại một trong các hồ sơ sau: Hợp đồng lao động; Thoả ước lao động tập thể; Quy chế tài chính của Công ty, Tổng công ty, Tập đoàn; Quy chế thưởng do Chủ tịch Hội đồng quản trị, Tổng giám đốc, Giám đốc quy định theo quy chế tài chính của Công ty, Tổng công ty.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Trường hợp hợp đồng lao động của doanh nghiệp ký với lao động là người nước ngoài có ghi khoản chi về tiền học cho con của người nước ngoài học tại Việt Nam theo bậc học phổ thông được doanh nghiệp trả có tính chất tiền lương, tiền công, khoản chi này không trái với các quy định của pháp luật về tiền lương, tiền công và có đầy đủ hoá đơn, chứng từ theo quy định thì được tính vào chi phí được trừ khi xác định thu nhập chịu thuế thu nhập doanh nghiệp.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Trường hợp hợp đồng lao động của doanh nghiệp ký với người lao động có ghi khoản chi về tiền nhà do doanh nghiệp trả cho người lao động, khoản chi trả này có tính chất tiền lương, tiền công, không trái với các quy định của pháp luật về tiền lương, tiền công và có đầy đủ hoá đơn, chứng từ theo quy định thì được tính vào chi phí được trừ khi xác định thu nhập chịu thuế thu nhập doanh nghiệp.\u003c/p\u003e\n\u003cp\u003ec) Chi tiền lương, tiền công và các khoản phụ cấp phải trả cho người lao động nhưng hết thời hạn nộp hồ sơ quyết toán thuế năm thực tế chưa chi trừ trường hợp doanh nghiệp có trích lập quỹ dự phòng để bổ sung vào quỹ tiền lương của năm sau liền kề nhằm bảo đảm việc trả lương không bị gián đoạn và không được sử dụng vào mục đích khác. Mức dự phòng hàng năm do doanh nghiệp quyết định nhưng không quá 17% quỹ tiền lương thực hiện.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eQuỹ tiền lương thực hiện là tổng số tiền lương thực tế đã chi trả của năm quyết toán đó đến thời hạn cuối cùng nộp hồ sơ quyết toán theo quy định (không bao gồm số tiền trích lập quỹ dự phòng tiền lương của năm trước chi trong năm quyết toán thuế).\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eViệc trích lập dự phòng tiền lương phải đảm bảo sau khi trích lập, doanh nghiệp không bị lỗ, nếu doanh nghiệp bị lỗ thì không được trích đủ 17%.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eTrường hợp năm trước doanh nghiệp có trích lập quỹ dự phòng tiền lương nhưng đến ngày 31/12 của năm sau doanh nghiệp chưa sử dụng hoặc sử dụng không hết quỹ dự phòng tiền lương thì doanh nghiệp phải ghi giảm chi phí của năm sau.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eVí dụ 7: Khi nộp hồ sơ quyết toán thuế năm 2011 DN A có trích quỹ dự phòng tiền lương là 10 tỷ đồng, đến ngày 31/12/2012, DN A mới chi số tiền từ quỹ dự phòng tiền lương năm 2011 là 7 tỷ đồng thì DN A phải ghi giảm chi phí tiền lương năm sau (năm 2012) là 3 tỷ đồng (10 tỷ – 7 tỷ). Khi lập hồ sơ quyết toán năm 2012 nếu DN A có nhu cầu trích lập thì tiếp tục trích lập quỹ dự phòng tiền lương theo quy định.\u003c/p\u003e\n\u003cp\u003ed) Tiền lương, tiền công của chủ doanh nghiệp tư nhân, chủ công ty trách nhiệm hữu hạn một thành viên (do một cá nhân làm chủ); thù lao trả cho các sáng lập viên, thành viên của hội đồng thành viên, hội đồng quản trị không trực tiếp tham gia điều hành sản xuất, kinh doanh.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.6.\u003c/strong\u003e Phần chi trang phục bằng hiện vật cho người lao động không có hoá đơn, chứng từ; phần chi trang phục bằng tiền, bằng hiện vật cho người lao động vượt quá 05 (năm) triệu đồng/người/năm.\u003c/p\u003e\n\u003cp\u003eTrường hợp doanh nghiệp có chi trang phục cả bằng tiền và hiện vật cho người lao động thì mức chi tối đa để tính vào chi phí được trừ khi xác định thu nhập chịu thuế không vượt quá 05 (năm) triệu đồng/người/năm.\u003c/p\u003e\n\u003cp\u003eĐối với những ngành kinh doanh có tính chất đặc thù thì chi phí này được thực hiện theo quy định cụ thể của Bộ Tài chính.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.7.\u003c/strong\u003e Chi thưởng sáng kiến, cải tiến mà doanh nghiệp không có quy chế quy định cụ thể về việc chi thưởng sáng kiến, cải tiến, không có hội đồng nghiệm thu sáng kiến, cải tiến.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.8.\u003c/strong\u003e Chi phụ cấp tàu xe đi nghỉ phép không đúng theo quy định của Bộ Luật Lao động; Phần chi phụ cấp cho người lao động đi công tác trong nước và nước ngoài vượt quá 02 lần mức quy định theo hướng dẫn của Bộ Tài chính đối với cán bộ công chức, viên chức Nhà nước.\u003c/p\u003e\n\u003cp\u003eChi phí đi lại và tiền thuê chỗ ở cho người lao động đi công tác nếu có đầy đủ hóa đơn chứng từ hợp pháp theo quy định được tính vào chi phí được trừ khi xác định thu nhập chịu thuế. Trường hợp doanh nghiệp có khoán tiền đi lại và tiền ở cho người lao động thì được tính vào chi phí được trừ khoản chi khoán tiền đi lại và tiền ở theo quy định của Bộ Tài chính đối với cán bộ công chức, viên chức Nhà nước.\u003c/p\u003e\n\u003cp\u003eTrường hợp doanh nghiệp có mua vé máy bay qua website thương mại điện tử cho người lao động đi công tác để phục hoạt động sản xuất kinh doanh của doanh nghiệp thì chứng từ làm căn cứ để tính vào chi phí được trừ là vé máy bay điện tử, thẻ lên máy bay (boarding pass) và chứng từ thanh toán của doanh nghiệp có cá nhân tham gia hành trình vận chuyển.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.9.\u003c/strong\u003e Các khoản chi sau không đúng đối tượng, không đúng mục đích hoặc mức chi vượt quá quy định.\u003c/p\u003e\n\u003cp\u003ea) Các khoản chi thêm cho lao động nữ được tính vào chi phí được trừ bao gồm:\u003c/p\u003e\n\u003cp\u003e- Chi cho công tác đào tạo lại nghề cho lao động nữ trong trường hợp nghề cũ không còn phù hợp phải chuyển đổi sang nghề khác theo quy hoạch phát triển của doanh nghiệp.\u003c/p\u003e\n\u003cp\u003eKhoản chi này bao gồm: học phí (nếu có) + chênh lệch tiền lương ngạch bậc (đảm bảo 100% lương cho người đi học).\u003c/p\u003e\n\u003cp\u003e- Chi phí tiền lương và phụ cấp (nếu có) cho giáo viên dạy ở nhà trẻ, mẫu giáo do doanh nghiệp tổ chức và quản lý.\u003c/p\u003e\n\u003cp\u003e- Chi phí tổ chức khám sức khoẻ thêm trong năm như khám bệnh nghề nghiệp, mãn tính hoặc phụ khoa cho nữ công nhân viên.\u003c/p\u003e\n\u003cp\u003e- Chi bồi dưỡng cho lao động nữ sau khi sinh con lần thứ nhất hoặc lần thứ hai.\u003c/p\u003e\n\u003cp\u003e- Phụ cấp làm thêm giờ cho lao động nữ trong trường hợp vì lý do khách quan người lao động nữ không nghỉ sau khi sinh con, nghỉ cho con bú mà ở lại làm việc cho doanh nghiệp được trả theo chế độ hiện hành; kể cả trường hợp trả lương theo sản phẩm mà lao động nữ vẫn làm việc trong thời gian không nghỉ theo chế độ.\u003c/p\u003e\n\u003cp\u003eb) Các khoản chi thêm cho người dân tộc thiểu số được tính vào chi phí được trừ bao gồm: học phí đi học (nếu có) cộng chênh lệch tiền lương ngạch bậc (đảm bảo 100% lương cho người đi học); tiền hỗ trợ về nhà ở, bảo hiểm xã hội, bảo hiểm y tế cho người dân tộc thiểu số trong trường hợp chưa được Nhà nước hỗ trợ theo chế độ quy định.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.10.\u003c/strong\u003e Phần trích nộp các quỹ bảo hiểm bắt buộc cho người lao động vượt mức quy định; phần trích nộp kinh phí công đoàn cho người lao động vượt mức quy định.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.11.\u003c/strong\u003e Khoản trích lập Quỹ dự phòng trợ cấp mất việc làm (trừ trường hợp doanh nghiệp không thuộc diện bắt buộc tham gia bảo hiểm thất nghiệp theo quy định của pháp luật được phép trích lập quỹ dự phòng trợ cấp mất việc làm); khoản chi trả trợ cấp mất việc làm cho người lao động không theo đúng chế độ hiện hành.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e\u003cstrong\u003e2.12.\u003c/strong\u003e Chi đóng góp hình thành nguồn chi phí quản lý cho cấp trên.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003ePhần chi đóng góp vào các quỹ của Hiệp hội (các Hiệp hội này được thành lập theo quy định của pháp luật) vượt quá mức quy định của Hiệp hội.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.13.\u003c/strong\u003e Chi trả tiền điện, tiền nước đối với những hợp đồng điện nước do chủ sở hữu cho thuê địa điểm sản xuất, kinh doanh ký trực tiếp với đơn vị cung cấp điện, nước không có đủ chứng từ thuộc một trong các trường hợp sau:\u003c/p\u003e\n\u003cp\u003ea) Trường hợp doanh nghiệp thuê địa điểm sản xuất kinh doanh trực tiếp thanh toán tiền điện, nước cho nhà cung cấp điện, nước không có bảng kê (theo mẫu số 02/TNDN ban hành kèm theo Thông tư này) kèm theo các hoá đơn thanh toán tiền điện, nước và hợp đồng thuê địa điểm sản xuất kinh doanh.\u003c/p\u003e\n\u003cp\u003eb) Trường hợp doanh nghiệp thuê địa điểm sản xuất kinh doanh thanh toán tiền điện, nước với chủ sở hữu cho thuê địa điểm kinh doanh không có bảng kê (theo mẫu số 02/TNDN ban hành kèm theo Thông tư này) kèm theo chứng từ thanh toán tiền điện, nước đối với người cho thuê địa điểm sản xuất kinh doanh phù hợp với số lượng điện, nước thực tế tiêu thụ và hợp đồng thuê địa điểm sản xuất kinh doanh.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.14.\u003c/strong\u003e Phần chi phí thuê tài sản cố định vượt quá mức phân bổ theo số năm mà bên đi thuê trả tiền trước.\u003c/p\u003e\n\u003cp\u003eVí dụ 8: Doanh nghiệp A thuê tài sản cố định trong 4 năm với số tiền thuê là: 400 triệu đồng và thanh toán một lần. Chi phí thuê tài sản cố định được hạch toán vào chi phí hàng năm là 100 triệu đồng. Chi phí thuê tài sản cố định hàng năm vượt trên 100 triệu đồng thì phần vượt trên 100 triệu đồng không được tính vào chi phí hợp lý khi xác định thu nhập chịu thuế.\u003c/p\u003e\n\u003cp\u003eĐối với chi phí sửa chữa tài sản cố định đi thuê mà trong hợp đồng thuê tài sản quy định bên đi thuê có trách nhiệm sửa chữa tài sản trong thời gian thuê thì chi phí sửa chữa tài sản cố định đi thuê được phép hạch toán vào chi phí hoặc phân bổ dần vào chi phí nhưng thời gian tối đa không quá 03 năm.\u003c/p\u003e\n\u003cp\u003eTrường hợp doanh nghiệp có chi các khoản chi phí để có các tài sản không thuộc tài sản cố định: chi về mua và sử dụng các tài liệu kỹ thuật, bằng sáng chế, giấy phép chuyển giao công nghệ, nhãn hiệu thương mại, lợi thế kinh doanh... thì các khoản chi này được phân bổ dần vào chi phí kinh doanh nhưng tối đa không quá 03 năm.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.15.\u003c/strong\u003e Phần chi phí trả lãi tiền vay vốn sản xuất kinh doanh của đối tượng không phải là tổ chức tín dụng hoặc tổ chức kinh tế vượt quá 150% mức lãi suất cơ bản do Ngân hàng Nhà nước Việt Nam công bố tại thời điểm vay.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.16. \u003c/strong\u003eChi trả lãi tiền vay để góp vốn điều lệ hoặc chi trả lãi tiền vay tương ứng với phần vốn điều lệ đã đăng ký còn thiếu theo tiến độ góp vốn ghi trong điều lệ của doanh nghiệp kể cả trường hợp doanh nghiệp đã đi vào sản xuất kinh doanh.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.17.\u003c/strong\u003e Trích, lập và sử dụng các khoản dự phòng giảm giá hàng tồn kho, dự phòng tổn thất các khoản đầu tư tài chính, dự phòng nợ phải thu khó đòi và dự phòng bảo hành sản phẩm, hàng hoá, công trình xây lắp không theo đúng hướng dẫn của Bộ Tài chính về trích lập dự phòng.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.18.\u003c/strong\u003e Các khoản chi phí trích trước theo kỳ hạn, theo chu kỳ mà đến hết kỳ hạn, hết chu kỳ chưa chi hoặc chi không hết.\u003c/p\u003e\n\u003cp\u003eCác khoản trích trước bao gồm: trích trước về sửa chữa lớn tài sản cố định theo chu kỳ, các khoản trích trước đối với hoạt động đã hạch toán doanh thu nhưng còn tiếp tục phải thực hiện nghĩa vụ theo hợp đồng (kể cả trường hợp doanh nghiệp có hoạt động cho thuê tài sản trong nhiều năm nhưng có thu tiền trước và đã hạch toán toàn bộ vào doanh thu của năm thu tiền) và các khoản trích trước khác.\u003c/p\u003e\n\u003cp\u003eTrường hợp doanh nghiệp có hoạt động sản xuất kinh doanh đã ghi nhận doanh thu tính thuế thu nhập doanh nghiệp nhưng chưa phát sinh đầy đủ chi phí thì được trích trước các khoản chi phí theo quy định vào chi phí được trừ tương ứng với doanh thu đã ghi nhận khi xác định thu nhập chịu thuế thu nhập doanh nghiệp. Khi kết thúc hợp đồng, doanh nghiệp phải tính toán xác định chính xác số chi phí thực tế căn cứ các hoá đơn, chứng từ hợp pháp thực tế đã phát sinh để điều chỉnh tăng chi phí (trường hợp chi phí thực tế phát sinh lớn hơn số đã trích trước) hoặc giảm chi phí (trường hợp chi phí thực tế phát sinh nhỏ hơn số đã trích trước) vào kỳ tính thuế kết thúc hợp đồng.\u003c/p\u003e\n\u003cp\u003eĐối với những tài sản cố định việc sửa chữa có tính chu kỳ thì doanh nghiệp được trích trước chi phí sửa chữa theo dự toán vào chi phí hàng năm. Nếu số thực chi sửa chữa lớn hơn số trích theo dự toán thì doanh nghiệp được tính thêm vào chi phí được trừ số chênh lệch này.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.19.\u003c/strong\u003e Phần chi vượt quá 10% tổng số chi được trừ, bao gồm: chi quảng cáo, tiếp thị, khuyến mại, hoa hồng môi giới; chi tiếp tân, khánh tiết, hội nghị; chi hỗ trợ tiếp thị, chi hỗ trợ chi phí, chiết khấu thanh toán; chi báo biếu, báo tặng của cơ quan báo chí liên quan trực tiếp đến hoạt động sản xuất, kinh doanh. Đối với doanh nghiệp thành lập mới là phần chi vượt quá 15% tổng số chi được trừ trong ba năm đầu, kể từ khi được thành lập. Tổng số chi được trừ không bao gồm các khoản chi khống chế quy định tại điểm này; đối với hoạt động thương mại, tổng số chi được trừ không bao gồm giá mua của hàng hoá bán ra;\u003c/p\u003e\n\u003cp\u003eCác khoản chi quảng cáo, tiếp thị, khuyến mại, hoa hồng môi giới bị khống chế nêu trên không bao gồm:\u003c/p\u003e\n\u003cp\u003e- Khoản hoa hồng môi giới bảo hiểm theo quy định của pháp luật về kinh doanh bảo hiểm; hoa hồng trả cho các đại lý bán hàng hóa, dịch vụ đúng giá.\u003c/p\u003e\n\u003cp\u003e- Khoản hoa hồng trả cho nhà phân phối của các công ty bán hàng đa cấp. Đối với tổ chức nhận được khoản hoa hồng thì phải kê khai tính vào thu nhập chịu thuế, đối với cá nhân nhận được hoa hồng thì phải khấu trừ thuế thu nhập cá nhân trước khi chi trả thu nhập.\u003c/p\u003e\n\u003cp\u003e- Các khoản chi phát sinh trong nước hoặc ngoài nước (nếu có) như: Chi phí nghiên cứu thị trường: thăm dò, khảo sát, phỏng vấn, thu thập, phân tích và đánh giá thông tin; chi phí phát triển và hỗ trợ nghiên cứu thị trường; chi phí thuê tư vấn thực hiện công việc nghiên cứu, phát triển và hỗ trợ nghiên cứu thị trường; Chi phí trưng bày, giới thiệu sản phẩm và tổ chức hội chợ, triển lãm thương mại: chi phí mở phòng hoặc gian hàng trưng bày, giới thiệu sản phẩm; chi phí thuê không gian để trưng bày, giới thiệu sản phẩm; chi phí vật liệu, công cụ hỗ trợ trưng bày, giới thiệu sản phẩm; chi phí vận chuyển sản phẩm trưng bày, giới thiệu.\u003c/p\u003e\n\u003cp\u003e- Chi báo biếu, báo tặng cho các đối tượng là người có công với cách mạng, thương binh, bệnh binh; cán bộ, chiến sĩ ở hải đảo, vùng sâu, vùng xa, vùng đặc biệt khó khăn.\u003c/p\u003e\n\u003cp\u003eMức giới hạn chi phí được trừ không vượt quá 15% trong 3 năm đầu không áp dụng đối với doanh nghiệp được thành lập mới do hợp nhất, chia, tách, sáp nhập, chuyển đổi hình thức doanh nghiệp, chuyển đổi sở hữu.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e\u003cstrong\u003e2.20\u003c/strong\u003e\u003cstrong\u003e.\u003c/strong\u003e Lỗ chênh lệch tỷ giá hối đoái do đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ cuối kỳ tính thuế (trừ lỗ chênh lệch tỷ giá hối đoái do đánh giá lại các khoản nợ phải trả có gốc ngoại tệ cuối kỳ tính thuế).\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eChênh lệch tỷ giá phát sinh trong quá trình đầu tư xây dựng cơ bản để hình thành tài sản cố định thực hiện theo hướng dẫn tại Thông tư của Bộ tài chính về xử lý các khoản chênh lệch tỷ giá trong doanh nghiệp.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.21.\u003c/strong\u003e Chi tài trợ cho giáo dục không đúng đối tượng quy định tại tiết a điểm này hoặc không có hồ sơ xác định khoản tài trợ nêu tại tiết b dưới đây:\u003c/p\u003e\n\u003cp\u003ea) Tài trợ cho giáo dục gồm: tài trợ cho các trường học công lập, dân lập và tư thục thuộc hệ thống giáo dục quốc dân theo quy định của pháp luật về giáo dục mà khoản tài trợ này không phải là để góp vốn, mua cổ phần trong các trường học; Tài trợ cơ sở vật chất phục vụ giảng dạy, học tập và hoạt động của trường học; Tài trợ cho các hoạt động thường xuyên của trường; Tài trợ học bổng cho học sinh, sinh viên thuộc các cơ sở giáo dục phổ thông, cơ sở giáo dục nghề nghiệp và cơ sở sở giáo dục đại học được quy định tại Luật Giáo dục trực tiếp cho học sinh, sinh viên hoặc thông qua cơ quan, tổ chức có chức năng huy động tài trợ theo quy định của pháp luật; Tài trợ cho các cuộc thi về các môn học được giảng dạy trong trường học mà đối tượng tham gia dự thi là người học; tài trợ để thành lập các Quỹ khuyến học giáo dục theo quy định của pháp luật về giáo dục đào tạo.\u003c/p\u003e\n\u003cp\u003eb) Hồ sơ xác định khoản tài trợ cho giáo dục gồm: Biên bản xác nhận khoản tài trợ có chữ ký của người đại diện cơ sở kinh doanh là nhà tài trợ, đại diện của cơ sở giáo dục hợp pháp là đơn vị nhận tài trợ, học sinh, sinh viên (hoặc cơ quan, tổ chức có chức năng huy động tài trợ) nhận tài trợ (theo mẫu số 03/TNDN ban hành kèm theo Thông tư này); kèm theo hoá đơn, chứng từ mua hàng hoá (nếu tài trợ bằng hiện vật) hoặc chứng từ chi tiền (nếu tài trợ bằng tiền).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.22. \u003c/strong\u003eChi tài trợ cho y tế không đúng đối tượng quy định tại tiết a điểm này hoặc không có hồ sơ xác định khoản tài trợ nêu tại tiết b dưới đây:\u003c/p\u003e\n\u003cp\u003ea) Tài trợ cho y tế gồm: tài trợ cho các cơ sở y tế được thành lập theo quy định pháp luật về y tế mà khoản tài trợ này không phải là để góp vốn, mua cổ phần trong các bệnh viện, trung tâm y tế đó; tài trợ thiết bị y tế, dụng cụ y tế, thuốc chữa bệnh; tài trợ cho các hoạt động thường xuyên của bệnh viện, trung tâm y tế; chi tài trợ bằng tiền cho người bị bệnh thông qua một cơ quan, tổ chức có chức năng huy động tài trợ theo quy định của pháp luật.\u003c/p\u003e\n\u003cp\u003eb) Hồ sơ xác định khoản tài trợ cho y tế gồm: Biên bản xác nhận khoản tài trợ có chữ ký của người đại diện doanh nghiệp là nhà tài trợ, đại diện của đơn vị nhận tài trợ (hoặc cơ quan, tổ chức có chức năng huy động tài trợ) theo mẫu số 04/TNDN ban hành kèm theo Thông tư này kèm theo hoá đơn, chứng từ mua hàng hoá (nếu tài trợ bằng hiện vật) hoặc chứng từ chi tiền (nếu tài trợ bằng tiền).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.23.\u003c/strong\u003e Chi tài trợ cho việc khắc phục hậu quả thiên tai không đúng đối tượng quy định tại tiết a điểm này hoặc không có hồ sơ xác định khoản tài trợ nêu tại tiết b dưới đây:\u003c/p\u003e\n\u003cp\u003ea) Tài trợ cho khắc phục hậu quả thiên tai gồm: tài trợ bằng tiền hoặc hiện vật để khắc phục hậu quả thiên tai trực tiếp cho tổ chức được thành lập và hoạt động theo quy định của pháp luật; cá nhân bị thiệt hại do thiên tai thông qua một cơ quan, tổ chức có chức năng huy động tài trợ theo quy định của pháp luật.\u003c/p\u003e\n\u003cp\u003eb) Hồ sơ xác định khoản tài trợ cho việc khắc phục hậu quả thiên tai gồm: Biên bản xác nhận khoản tài trợ có chữ ký của người đại diện doanh nghiệp là nhà tài trợ, đại diện của tổ chức bị thiệt hại do thiên tai (hoặc cơ quan, tổ chức có chức năng huy động tài trợ) là đơn vị nhận tài trợ (theo mẫu số 05/TNDN ban hành kèm theo Thông tư này) kèm theo hoá đơn, chứng từ mua hàng hoá (nếu tài trợ bằng hiện vật) hoặc chứng từ chi tiền (nếu tài trợ bằng tiền).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.24. \u003c/strong\u003eChi tài trợ làm nhà tình nghĩa cho người nghèo không đúng đối tượng quy định tại tiết a điểm này hoặc không có hồ sơ xác định khoản tài trợ nêu tại tiết b dưới đây:\u003c/p\u003e\n\u003cp\u003ea) Đối tượng nhận tài trợ là hộ nghèo theo quy định của Thủ tướng Chính phủ. Hình thức tài trợ: tài trợ bằng tiền hoặc hiện vật để xây nhà tình nghĩa cho hộ nghèo bằng cách trực tiếp hoặc thông qua một cơ quan, tổ chức có chức năng huy động tài trợ theo quy định của pháp luật.\u003c/p\u003e\n\u003cp\u003eb) Hồ sơ xác định khoản tài trợ làm nhà tình nghĩa cho người nghèo gồm: Biên bản xác nhận khoản tài trợ có chữ ký của người đại diện doanh nghiệp là nhà tài trợ, người được hưởng tài trợ (hoặc cơ quan, tổ chức có chức năng huy động tài trợ) là bên nhận tài trợ (theo mẫu số 06/TNDN ban hành kèm theo Thông tư này); văn bản xác nhận hộ nghèo của chính quyền địa phương; kèm theo hoá đơn, chứng từ mua hàng hoá (nếu tài trợ bằng hiện vật) hoặc chứng từ chi tiền (nếu tài trợ bằng tiền).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.25.\u003c/strong\u003e Phần chi phí quản lý kinh doanh do công ty ở nước ngoài phân bổ cho cơ sở thường trú tại Việt Nam vượt mức chi phí tính theo công thức sau:\u003c/p\u003e\n\u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"width:100.0%;\" width=\"100%\"\u003e\n \u003ctbody\u003e\n  \u003ctr\u003e\n   \u003ctd rowspan=\"2\" style=\"width:26.98%;\"\u003e\n    \u003cp align=\"center\"\u003eChi phí quản lý kinh doanh do công ty ở nước ngoài phân bổ cho cơ sở thường trú tại Việt Nam trong kỳ tính thuế\u003c/p\u003e\u003c/td\u003e\n   \u003ctd rowspan=\"2\" style=\"width:4.76%;\"\u003e\n    \u003cp align=\"center\"\u003e=\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:38.1%;\"\u003e\n    \u003cp align=\"center\"\u003eDoanh thu tính thuế của cơ sở thường trú tại Việt Nam trong kỳ tính thuế\u003c/p\u003e\u003c/td\u003e\n   \u003ctd rowspan=\"2\" style=\"width:6.34%;\"\u003e\n    \u003cp align=\"center\"\u003eX\u003c/p\u003e\u003c/td\u003e\n   \u003ctd rowspan=\"2\" style=\"width:23.8%;\"\u003e\n    \u003cp align=\"center\"\u003eTổng số chi phí quản lý kinh doanh của công ty ở nước ngoài trong kỳ tính thuế.\u003c/p\u003e\u003c/td\u003e\n  \u003c/tr\u003e\n  \u003ctr\u003e\n   \u003ctd style=\"width:38.1%;\"\u003e\n    \u003cp align=\"center\"\u003e_________________________________\u003c/p\u003e\n    \u003cp align=\"center\"\u003eTổng doanh thu của công ty ở nước ngoài, bao gồm cả doanh thu của các cơ sở thường trú ở các nước khác trong kỳ tính thuế\u003c/p\u003e\u003c/td\u003e\n  \u003c/tr\u003e\n \u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eCác khoản chi phí quản lý kinh doanh của công ty nước ngoài phân bổ cho cơ sở thường trú tại Việt Nam chỉ được tính từ khi cơ sở thường trú tại Việt Nam được thành lập.\u003c/p\u003e\n\u003cp\u003eCăn cứ để xác định chi phí và doanh thu của công ty ở nước ngoài là báo cáo tài chính của công ty ở nước ngoài đã được kiểm toán bởi một công ty kiểm toán độc lập trong đó thể hiện rõ doanh thu của công ty ở nước ngoài, chi phí quản lý của công ty ở nước ngoài, phần chi phí quản lý công ty ở nước ngoài phân bổ cho cơ sở thường trú tại Việt Nam.\u003c/p\u003e\n\u003cp\u003eCơ sở thường trú của công ty ở nước ngoài tại Việt Nam chưa thực hiện chế độ kế toán, hoá đơn, chứng từ; chưa thực hiện nộp thuế theo phương pháp kê khai thì không được tính vào chi phí hợp lý khoản chi phí quản lý kinh doanh do công ty ở nước ngoài phân bổ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.26.\u003c/strong\u003e Các khoản chi được bù đắp bằng nguồn kinh phí khác; Các khoản chi đã được chi từ quỹ phát triển khoa học và công nghệ của doanh nghiệp.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.27.\u003c/strong\u003e Các khoản chi không tương ứng với doanh thu tính thuế.\u003c/p\u003e\n\u003cp\u003eTrường hợp doanh nghiệp có các khoản thực chi cho hoạt động phòng, chống HIV/AIDS nơi làm việc theo hướng dẫn của Bộ Y tế bao gồm: Chi phí đào tạo cán bộ phòng, chống HIV/AIDS của doanh nghiệp, chi phí tổ chức truyền thông phòng, chống HIV/AIDS cho người lao động của doanh nghiệp, phí thực hiện tư vấn, khám và xét nghiệm HIV, chi phí hỗ trợ người nhiễm HIV là người lao động của doanh nghiệp thì khoản chi này được tính vào chi phí được trừ khi xác định thu nhâp chịu thuế.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.28.\u003c/strong\u003e Các khoản chi của hoạt động kinh doanh bảo hiểm, kinh doanh xổ số, kinh doanh chứng khoán và một số hoạt động kinh doanh đặc thù khác không thực hiện đúng theo văn bản hướng dẫn riêng của Bộ Tài chính.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.29.\u003c/strong\u003e Các khoản tiền phạt về vi phạm hành chính bao gồm: vi phạm luật giao thông, vi phạm chế độ đăng ký kinh doanh, vi phạm chế độ kế toán thống kê, vi phạm pháp luật về thuế và các khoản phạt về vi phạm hành chính khác theo quy định của pháp luật.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.30.\u003c/strong\u003e Chi về đầu tư xây dựng cơ bản trong giai đoạn đầu tư để hình thành tài sản cố định; chi ủng hộ địa phương; chi ủng hộ các đoàn thể, tổ chức xã hội; chi từ thiện trừ khoản chi tài trợ cho giáo dục, y tế, khắc phục hậu quả thiên tai và làm nhà tình nghĩa cho người nghèo nêu tại điểm 2.21, 2.22, 2.23, 2.24 Khoản 2 Điều này; chi phí mua thẻ hội viên sân gôn, chi phí chơi gôn.\u003c/p\u003e\n\u003cp\u003eKhi bắt đầu hoạt động sản xuất kinh doanh, doanh nghiệp chưa phát sinh doanh thu nhưng có phát sinh các khoản chi thường xuyên để duy trì hoạt động sản xuất kinh doanh của doanh nghiệp (không phải là các khoản chi đầu tư xây dựng để hình thành tài sản cố định) mà các khoản chi này đáp ứng các điều kiện theo quy định thì khoản chi này được tính vào chi phí được trừ khi xác định thu nhập chịu thuế.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.3\u003c/strong\u003e\u003cstrong\u003e1\u003c/strong\u003e\u003cstrong\u003e.\u003c/strong\u003e Thuế giá trị gia tăng đầu vào đã được khấu trừ hoặc hoàn thuế; thuế giá trị gia tăng đầu vào của tài sản cố định là ô tô từ 9 chỗ ngồi trở xuống vượt mức quy định được khấu trừ theo quy định tại các văn bản pháp luật về thuế giá trị gia tăng; thuế thu nhập doanh nghiệp; thuế thu nhập cá nhân.\u003c/p\u003e\n\u003cp\u003e- Thuế thu nhập cá nhân không được tính vào chi phí được trừ khi xác định thu nhập chịu thuế là số tiền thuế do doanh nghiệp khấu trừ trên thu nhập của người nộp thuế để nộp vào ngân sách nhà nước. Trường hợp doanh nghiệp ký hợp đồng lao động quy định tiền lương, tiền công trả cho người lao động không bao gồm thuế thu nhập cá nhân thì thuế thu nhập cá nhân doanh nghiệp nộp thay là khoản chi phí tiền lương được tính vào chi phí được trừ khi xác định thu nhập chịu thuế.\u003c/p\u003e\n\u003cp\u003e- Thuế thu nhập doanh nghiệp nộp thay nhà thầu nước ngoài (thuế nhà thầu) được tính vào chi phí được trừ khi xác định thu nhập chịu thuế trong trường hợp thoả thuận tại hợp đồng nhà thầu, nhà thầu phụ nước ngoài, doanh thu nhà thầu, nhà thầu phụ nước ngoài nhận được không bao gồm thuế thu nhập doanh nghiệp (thuế nhà thầu).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐiều 7. Thu nhập khác\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThu nhập khác là các khoản thu nhập chịu thuế trong kỳ tính thuế mà khoản thu nhập này không thuộc các ngành, nghề lĩnh vực kinh doanh ghi trong đăng ký kinh doanh của doanh nghiệp. Thu nhập khác bao gồm các khoản thu nhập sau:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1.\u003c/strong\u003e Thu n

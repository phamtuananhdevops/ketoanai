hập từ chuyển nhượng vốn, chuyển nhượng chứng khoán theo hướng dẫn tại Chương IV Thông tư này.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. \u003c/strong\u003eThu nhập từ chuyển nhượng bất động sản theo hướng dẫn tại Chương V Thông tư này.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3.\u003c/strong\u003e Thu nhập từ chuyển nhượng dự án (không gắn liền với chuyển quyền sử dụng đất, chuyển quyền thuê đất); thu nhập từ chuyển nhượng quyền thực hiện dự án, chuyển nhượng quyền thăm dò, khai thác, chế biến khoáng sản theo quy định của pháp luật.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4. \u003c/strong\u003eThu nhập từ quyền sở hữu, quyền sử dụng tài sản bao gồm cả tiền thu về bản quyền dưới mọi hình thức trả cho quyền sở hữu, quyền sử dụng tài sản; thu về quyền sở hữu trí tuệ; thu nhập từ chuyển giao công nghệ theo quy định của pháp luật. Cho thuê tài sản dưới mọi hình thức.\u003c/p\u003e\n\u003cp\u003eThu nhập từ tiền bản quyền sở hữu trí tuệ, chuyển giao công nghệ được xác định bằng tổng số tiền thu được trừ (-) giá vốn hoặc chi phí tạo ra quyền sở hữu trí tuệ, công nghệ được chuyển giao, trừ (-) chi phí duy trì, nâng cấp, phát triển quyền sở hữu trí tuệ, công nghệ được chuyển giao và các khoản chi được trừ khác.\u003c/p\u003e\n\u003cp\u003eThu nhập về cho thuê tài sản được xác định bằng doanh thu từ hoạt động cho thuê trừ (-) các khoản chi: chi phí khấu hao, duy tu, sửa chữa, bảo dưỡng tài sản, chi phí thuê tài sản để cho thuê lại (nếu có) và các chi được trừ khác có liên quan đến việc cho thuê tài sản.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5.\u003c/strong\u003e Thu nhập từ chuyển nhượng tài sản, thanh lý tài sản (trừ bất động sản), các loại giấy tờ có giá khác. Khoản thu nhập này được xác định bằng (=) doanh thu thu được do chuyển nhượng tài sản, thanh lý tài sản trừ (-) giá trị còn lại của tài sản chuyển nhượng, thanh lý ghi trên sổ sách kế toán tại thời điểm chuyển nhượng, thanh lý và các khoản chi phí được trừ liên quan đến việc chuyển nhượng, thanh lý tài sản.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e6.\u003c/strong\u003e Thu nhập từ lãi tiền gửi, lãi cho vay vốn, phí bảo lãnh tín dụng và các khoản phí khác trong hợp đồng cho vay vốn.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Trường hợp khoản thu từ lãi tiền gửi, lãi cho vay vốn phát sinh cao hơn các khoản chi trả lãi tiền vay theo quy định, sau khi bù trừ phần chênh lệch còn lại tính vào thu nhập khác khi xác định thu nhập chịu thuế.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Trường hợp khoản thu từ lãi tiền gửi, lãi cho vay vốn phát sinh thấp hơn các khoản chi trả lãi tiền vay theo quy định, sau khi bù trừ phần chênh lệch còn lại giảm trừ vào thu nhập sản xuất kinh doanh chính khi xác định thu nhập chịu thuế.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e\u003cstrong\u003e7.\u003c/strong\u003e Thu nhập từ hoạt động bán ngoại tệ: bằng tổng số tiền thu từ bán ngoại tệ trừ (-) tổng giá mua của số lượng ngoại tệ bán ra.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e\u003cstrong\u003e8\u003cem\u003e.\u003c/em\u003e\u003c/strong\u003e Thu nhập từ chênh lệch tỷ giá, được xác định cụ thể như sau:\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eTrong năm tính thuế doanh nghiệp có chênh lệch tỷ giá phát sinh trong kỳ và chênh lệch tỷ giá do đánh giá lại các khoản nợ phải trả có gốc ngoại tệ cuối năm tài chính, thì:\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Khoản chênh lệch tỷ giá phát sinh trong kỳ liên quan trực tiếp đến doanh thu, chi phí của hoạt động sản xuất kinh doanh chính của doanh nghiệp được tính vào chi phí hoặc thu nhập của hoạt động sản xuất kinh doanh chính của doanh nghiệp. Khoản chênh lệch tỷ giá phát sinh trong kỳ không liên quan trực tiếp đến doanh thu, chi phí của hoạt động sản xuất kinh doanh chính của doanh nghiệp, nếu phát sinh lỗ chênh lệch tỷ giá tính vào chi phí sản xuất kinh doanh chính, nếu phát sinh lãi chênh lệch tỷ giá tính vào thu nhập khác.\u003c/p\u003e\n\u003cp style=\"margin-right:-2.15pt;\"\u003e- Lãi chênh lệch tỷ giá do đánh giá lại các khoản nợ phải trả bằng ngoại tệ cuối năm tài chính được bù trừ với lỗ chênh lệch tỷ giá do đánh giá lại các khoản nợ phải trả bằng ngoại tệ cuối năm tài chính. Sau khi bù trừ nếu còn lãi chênh lệch tỷ giá thì tính vào thu nhập khác, nếu lỗ chênh lệch tỷ giá thì tính vào chi phí sản xuất kinh doanh chính khi xác định thu nhập chịu thuế.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eCác khoản chênh lệch tỷ giá nêu trên không bao gồm chênh lệch tỷ giá hối đoái do đánh giá lại số dư cuối năm là: tiền mặt, tiền gửi, tiền đang chuyển, các khoản nợ phải thu có gốc ngoại tệ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e9\u003c/strong\u003e. Hoàn nhập các khoản dự phòng (trừ hoàn nhập dự phòng giảm giá hàng tồn kho, dự phòng tổn thất các khoản đầu tư tài chính, dự phòng nợ khó đòi; Hoàn nhập dự phòng bảo hành sản phẩm, hàng hoá đã trích nhưng hết thời gian trích lập không sử dụng hoặc sử dụng không hết; Hoàn nhập trích lập quỹ dự phòng tiền lương).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e10.\u003c/strong\u003e Khoản nợ khó đòi đã xoá nay đòi được.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e11.\u003c/strong\u003e Khoản nợ phải trả không xác định được chủ nợ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e12.\u003c/strong\u003e Thu nhập từ hoạt động sản xuất kinh doanh của những năm trước bị bỏ sót phát hiện ra.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e13.\u003c/strong\u003e Trường hợp doanh nghiệp có khoản thu về tiền phạt, tiền bồi thường do bên đối tác vi phạm hợp đồng phát sinh cao hơn khoản chi tiền phạt, tiền bồi thường do vi phạm hợp đồng (các khoản phạt này không thuộc các khoản tiền phạt về vi phạm hành chính theo quy định của pháp luật về xử lý vi phạm hành chính), sau khi bù trừ phần chênh lệch còn lại tính vào thu nhập khác.\u003c/p\u003e\n\u003cp\u003eTrường hợp doanh nghiệp có khoản thu về tiền phạt, tiền bồi thường do bên đối tác vi phạm hợp đồng phát sinh thấp hơn khoản chi tiền phạt, tiền bồi thường do vi phạm hợp đồng (các khoản phạt này không thuộc các khoản tiền phạt về vi phạm hành chính theo quy định của pháp luật về xử lý vi phạm hành chính), sau khi bù trừ phần chênh lệch còn lại tính giảm trừ vào thu nhập khác. Trường hợp đơn vị trong năm không phát sinh thu nhập khác thì được giảm trừ vào thu nhập hoạt động sản xuất kinh doanh.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e14. \u003c/strong\u003eChênh lệch tăng do đánh giá lại tài sản theo quy định của pháp luật để góp vốn, để điều chuyển tài sản khi chia, tách, hợp nhất, sáp nhập, chuyển đổi loại hình doanh nghiệp, được xác định cụ thể như sau:\u003c/p\u003e\n\u003cp\u003eChênh lệch tăng do đánh giá lại tài sản (không bao gồm quyền sử dụng đất) là phần chênh lệch giữa giá trị đánh giá lại với giá trị còn lại của tài sản ghi trên sổ sách kế toán và tính một lần vào thu nhập khác trong kỳ tính thuế khi xác định thu nhập chịu thuế thu nhập doanh nghiệp tại doanh nghiệp có tài sản đánh giá lại.\u003c/p\u003e\n\u003cp\u003eChênh lệch tăng do đánh giá lại giá trị quyền sử dụng đất để điều chuyển khi chia, tách, hợp nhất, sáp nhập, chuyển đổi loại hình doanh nghiệp; để góp vốn vào các dự án đầu tư xây dựng nhà, hạ tầng để bán tính một lần vào thu nhập khác trong kỳ tính thuế khi xác định thu nhập chịu thuế thu nhập doanh nghiệp tại doanh nghiệp có quyền sử dụng đất đánh giá lại.\u003c/p\u003e\n\u003cp\u003eRiêng chênh lệch tăng do đánh giá lại giá trị quyền sử dụng đất góp vốn vào doanh nghiệp để thực hiện sản xuất kinh doanh được tính dần vào thu nhập khác của doanh nghiệp có quyền sử dụng đất đánh giá lại trong thời gian tối đa không quá 10 năm bắt đầu từ năm giá trị quyền sử dụng đất được đem góp vốn. Doanh nghiệp phải có thông báo số năm doanh nghiệp phân bổ vào thu nhập khác khi nộp hồ sơ khai quyết toán thuế thu nhập doanh nghiệp của năm bắt đầu kê khai khoản thu nhập này (năm có đánh giá lại giá trị quyền sử dụng đất đem góp vốn). Trường hợp nếu bên góp vốn thực hiện chuyển nhượng vốn góp trước thời hạn 10 năm thì thu nhập từ hoạt động chuyển nhượng vốn góp bằng giá trị quyền sử dụng đất phải tính vào thu nhập kinh doanh bất động sản trong kỳ.\u003c/p\u003e\n\u003cp\u003eChênh lệch do đánh giá lại giá trị quyền sử dụng đất bao gồm: Đối với quyền sử dụng đất lâu dài là chênh lệch giữa giá trị đánh giá lại và giá trị của quyền sử dụng đất ghi trên sổ sách kế toán; Đối với quyền sử dụng đất có thời hạn là chênh lệch giữa giá trị đánh giá lại và giá trị còn lại chưa phân bổ của quyền sử dụng đất.\u003c/p\u003e\n\u003cp style=\"margin-right:-2.1pt;\"\u003eDoanh nghiệp nhận tài sản góp vốn, nhận tài sản điều chuyển khi chia, tách, hợp nhất, sáp nhập, chuyển đổi loại hình doanh nghiệp được trích khấu hao hoặc phân bổ dần vào chi phí theo giá đánh giá lại (trừ trường hợp giá trị quyền sử dụng đất không được trích khấu hao hoặc phân bổ vào chi phí theo quy định).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e15.\u003c/strong\u003e Quà biếu, quà tặng bằng tiền, bằng hiện vật; thu nhập nhận được bằng tiền, bằng hiện vật từ khoản hỗ trợ tiếp thị, hỗ trợ chi phí, chiết khấu thanh toán, thưởng khuyến mại và các khoản hỗ trợ khác.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e16. \u003c/strong\u003eTiền đền bù về tài sản cố định trên đất và tiền hỗ trợ di dời sau khi trừ các khoản chi phí liên quan như chi phí di dời (chi phí vận chuyển, lắp đặt), giá trị còn lại của tài sản cố định và các chi phí khác (nếu có). Riêng tiền đền bù về tài sản cố định trên đất và tiền hỗ trợ di dời của các doanh nghiệp di chuyển địa điểm theo quy hoạch của cơ quan Nhà nước có thẩm quyền mà giá trị của các khoản hỗ trợ, đền bù sau khi trừ các chi phí liên quan (nếu có) thì phần còn lại doanh nghiệp sử dụng theo quy định của pháp luật có liên quan.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e17.\u003c/strong\u003e Các khoản thu nhập liên quan đến việc tiêu thụ hàng hoá, cung cấp dịch vụ không tính trong doanh thu như: thưởng giải phóng tàu nhanh, tiền thưởng phục vụ trong ngành ăn uống, khách sạn sau khi đã trừ các khoản chi phí để tạo ra khoản thu nhập đó.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e18.\u003c/strong\u003e Thu nhập về tiêu thụ phế liệu, phế phẩm sau khi đã trừ chi phí thu hồi và chi phí tiêu thụ, được xác định cụ thể như sau:\u003c/p\u003e\n\u003cp\u003e- Trường hợp doanh nghiệp phát sinh khoản thu nhập từ bán phế liệu, phế phẩm được tạo ra trong quá trình sản xuất của các sản phẩm đang được hưởng ưu đãi thuế thu nhập doanh nghiệp thì khoản thu nhập này được hưởng ưu đãi thuế thu nhập doanh nghiệp.\u003c/p\u003e\n\u003cp\u003e- Trường hợp doanh nghiệp phát sinh khoản thu nhập từ bán phế liệu, phế phẩm được tạo ra trong quá trình sản xuất của các sản phẩm không được hưởng ưu đãi thuế thu nhập doanh nghiệp thì khoản thu nhập nhập này được tính vào thu nhập khác, không được áp dụng ưu đãi thuế thu nhập doanh nghiệp.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e19.\u003c/strong\u003e Khoản tiền hoàn thuế xuất khẩu, nhập khẩu của hàng hoá đã thực xuất khẩu, thực nhập khẩu phát sinh trong năm quyết toán thuế thu nhập doanh nghiệp được tính giảm trừ chi phí trong năm quyết toán. Trường hợp khoản tiền hoàn thuế xuất, nhập khẩu của hàng hoá đã thực xuất khẩu, thực nhập khẩu phát sinh của các năm quyết toán thuế thu nhập doanh nghiệp trước thì tính vào thu nhập khác của năm quyết toán. Khoản thu nhập này liên quan trực tiếp đến lĩnh vực sản xuất kinh doanh đang được hưởng ưu đãi thuế thu nhập doanh nghiệp thì khoản thu nhập này được hưởng ưu đãi thuế thu nhập doanh nghiệp. Khoản thu nhập này không liên quan trực tiếp lĩnh vực sản xuất kinh doanh được hưởng ưu đãi thuế thu nhập doanh nghiệp thì khoản thu nhập này được tính vào thu nhập khác, không được áp dụng ưu đãi thuế thu nhập doanh nghiệp.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e20.\u003c/strong\u003e Các khoản thu nhập từ các hoạt động góp vốn cổ phần, liên doanh, liên kết kinh tế trong nước được chia từ thu nhập trước khi nộp thuế thu nhập doanh nghiệp.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e21.\u003c/strong\u003e Thu nhập nhận được từ hoạt động sản xuất, kinh doanh hàng hoá, dịch vụ ở nước ngoài.\u003c/p\u003e\n\u003cp\u003e- Doanh nghiệp Việt Nam đầu tư ra nước ngoài có thu nhập từ hoạt động sản xuất, kinh doanh tại nước ngoài, thực hiện kê khai và nộp thuế thu nhập doanh nghiệp theo qui định của Luật Thuế thu nhập doanh nghiệp hiện hành của Việt nam, kể cả trường hợp doanh nghiệp đang được hưởng ưu đãi miễn, giảm thuế thu nhập theo qui định của nước doanh nghiệp đầu tư. Mức thuế suất thuế thu nhập doanh nghiệp để tính và kê khai thuế đối với các khoản thu nhập từ nước ngoài là 25%, không áp dụng mức thuế suất ưu đãi (nếu có) mà doanh nghiệp Việt nam đầu tư ra nước ngoài đang được hưởng theo Luật Thuế thu nhập doanh nghiệp hiện hành.\u003c/p\u003e\n\u003cp\u003eCơ quan thuế có quyền ấn định thu nhập chịu thuế từ hoạt động sản xuất kinh doanh tại nước ngoài của doanh nghiệp Việt Nam đầu tư ra nước ngoài đối với các trường hợp vi phạm qui định về kê khai, nộp thuế.\u003c/p\u003e\n\u003cp\u003e- Trường hợp khoản thu nhập từ dự án đầu tư tại nước ngoài đã chịu thuế thu nhập doanh nghiệp (hoặc một loại thuế có bản chất tương tự như thuế thu nhập doanh nghiệp) ở nước ngoài, khi tính thuế thu nhập doanh nghiệp phải nộp tại Việt Nam, doanh nghiệp Việt Nam đầu tư ra nước ngoài được trừ số thuế đã nộp ở nước ngoài hoặc đã được đối tác nước tiếp nhận đầu tư trả thay (kể cả thuế đối với tiền lãi cổ phần), nhưng số thuế được trừ không vượt quá số thuế thu nhập tính theo qui định của Luật thuế thu nhập doanh nghiệp của Việt Nam. Số thuế thu nhập doanh nghiệp Việt nam đầu tư ra nước ngoài được miễn, giảm đối với phần lợi nhuận được hưởng từ dự án đầu tư ở nước ngoài theo luật pháp của nước doanh nghiệp đầu tư cũng được trừ khi xác định số thuế thu nhập doanh nghiệp phải nộp tại Việt nam.\u003c/p\u003e\n\u003cp\u003eHồ sơ đính kèm khi kê khai và nộp thuế của doanh nghiệp Việt Nam đầu tư ra nước ngoài đối với khoản thu nhập từ dự án đầu tư tại nước ngoài bao gồm:\u003c/p\u003e\n\u003cp\u003e+ Văn bản của doanh nghiệp về việc phân chia lợi nhuận của dự án đầu tư tại nước ngoài.\u003c/p\u003e\n\u003cp\u003e+ Báo cáo tài chính của doanh nghiệp đã được tổ chức kiểm toán độc lập xác nhận.\u003c/p\u003e\n\u003cp\u003e+ Tờ khai thuế thu nhập của doanh nghiệp thuộc dự án đầu tư tại nước ngoài (bản sao có xác nhận của đại diện có thẩm quyền của dự án đầu tư tại nước ngoài);\u003c/p\u003e\n\u003cp\u003e+ Biên bản quyết toán thuế đối với doanh nghiệp (nếu có);\u003c/p\u003e\n\u003cp\u003e+ Xác nhận số thuế đã nộp tại nước ngoài hoặc chứng từ chứng minh số thuế đã nộp ở nước ngoài.\u003c/p\u003e\n\u003cp\u003e- Trường hợp dự án đầu tư tại nước ngoài chưa phát sinh thu nhập chịu thuế (hoặc đang phát sinh lỗ), khi kê khai quyết toán thuế thu nhập doanh nghiệp hàng năm, doanh nghiệp Việt Nam đầu tư ra nước ngoài chỉ phải nộp Báo cáo tài chính có xác nhận của cơ quan kiểm toán độc lập hoặc của cơ quan có thẩm quyền của nước doanh nghiệp đầu tư và Tờ khai thuế thu nhập của dự án đầu tư tại nước ngoài (nộp 1 bản sao có xác nhận của đại diện có thẩm quyền của dự án đầu tư tại nước ngoài và có đóng dấu của doanh nghiệp). Số lỗ phát sinh từ dự án đầu tư ở nước ngoài không được trừ vào số thu nhập phát sinh của doanh nghiệp trong nước khi tính thuế thu nhập doanh nghiệp.\u003c/p\u003e\n\u003cp\u003e- Khoản thu nhập từ dự án đầu tư tại nước ngoài được kê khai vào quyết toán thuế thu nhập doanh nghiệp của năm tiếp sau năm tài chính phát sinh khoản thu nhập tại nước ngoài hoặc kê khai vào quyết toán thuế thu nhập doanh nghiệp của năm tài chính cùng với năm phát sinh khoản thu nhập tại nước ngoài nếu doanh nghiệp có đủ cơ sở và chứng từ xác định được số thu nhập và số thuế thu nhập đã nộp của dự án đầu tư tại nước ngoài.\u003c/p\u003e\n\u003cp\u003eĐối với khoản thu nhập từ hoạt động sản xuất, kinh doanh của dự án đầu tư tại nước đã ký Hiệp định tránh đánh thuế hai lần với Việt Nam, doanh nghiệp Việt nam đầu tư ra nước ngoài kê khai và nộp thuế theo qui định tại Hiệp định.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e22.\u003c/strong\u003e Các khoản thu nhập nhận được bằng tiền hoặc hiện vật từ các nguồn tài trợ trừ khoản tài trợ nêu tại Khoản 7 Điều 8.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e23.\u003c/strong\u003e Các khoản thu nhập khác theo quy định của pháp luật.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐiều 8. Thu nhập được miễn thuế\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1.\u003c/strong\u003e Thu nhập từ trồng trọt, chăn nuôi, nuôi trồng thủy sản của tổ chức được thành lập theo Luật Hợp tác xã.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2\u003c/strong\u003e. Thu nhập từ việc thực hiện dịch vụ kỹ thuật trực tiếp phục vụ nông nghiệp gồm: thu nhập từ dịch vụ tưới, tiêu nước; cày, bừa đất; nạo vét kênh, mương nội đồng; dịch vụ phòng trừ sâu, bệnh cho cây trồng, vật nuôi; dịch vụ thu hoạch sản phẩm nông nghiệp.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3.\u003c/strong\u003e Thu nhập từ việc thực hiện hợp đồng nghiên cứu khoa học và phát triển công nghệ; Thu nhập từ doanh thu bán sản phẩm trong thời kỳ sản xuất thử nghiệm và thu nhập từ doanh thu bán sản phẩm làm ra từ công nghệ mới lần đầu tiên áp dụng tại Việt Nam, kể cả thu nhập từ chuyển nhượng chứng chỉ giảm phát thải (CERs). Thời gian miễn thuế tối đa không quá một (01) năm, kể từ ngày bắt đầu thực hiện hợp đồng nghiên cứu khoa học và phát triển công nghệ; ngày bắt đầu sản xuất thử nghiệm sản phẩm; ngày bắt đầu áp dụng công nghệ mới lần đầu tiên áp dụng tại Việt Nam để sản xuất sản phẩm; ngày bắt đầu được cấp chứng chỉ giảm phát thải (CERs).\u003c/p\u003e\n\u003cp\u003ea) Thu nhập từ việc thực hiện hợp đồng nghiên cứu khoa học và phát triển công nghệ được miễn thuế phải đảm bảo các điều kiện sau:\u003c/p\u003e\n\u003cp\u003e- Có chứng nhận đăng ký hoạt động nghiên cứu khoa học;\u003c/p\u003e\n\u003cp\u003e- Được cơ quan quản lý Nhà nước về khoa học có thẩm quyền xác nhận;\u003c/p\u003e\n\u003cp\u003eb) Thu nhập từ doanh thu bán sản phẩm làm ra từ công nghệ mới lần đầu tiên được áp dụng tại Việt Nam được miễn thuế phải đảm bảo công nghệ mới lần đầu tiên áp dụng tại Việt Nam được cơ quan quản lý Nhà nước về khoa học có thẩm quyền xác nhận.\u003c/p\u003e\n\u003cp\u003ec) Thu nhập từ chuyển nhượng chứng chỉ giảm phát thải (CERs) được miễn thuế phải đảm bảo khi bán hoặc chuyển nhượng chứng chỉ giảm phát thải (CERs) phải được cơ quan có thẩm quyền về môi trường xác nhận theo quy định.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4.\u003c/strong\u003e Thu nhập từ hoạt động sản xuất, kinh doanh hàng hoá, dịch vụ của doanh nghiệp có số lao động là người khuyết tật, người sau cai nghiện ma tuý, người nhiễm HIV bình quân trong năm chiếm từ 30% trở lên trong tổng số lao động bình quân trong năm của doanh nghiệp.\u003c/p\u003e\n\u003cp\u003eThu nhập được miễn thuế quy định tại Khoản này không bao gồm thu nhập khác quy định tại Điều \u003cstrong\u003e7 \u003c/strong\u003eThông tư này.\u003c/p\u003e\n\u003cp\u003eDoanh nghiệp thuộc diện được miễn thuế quy định tại Khoản này là doanh nghiệp có số lao động bình quân trong năm ít nhất từ 20 người trở lên và không bao gồm các doanh nghiệp hoạt động trong lĩnh vực tài chính, kinh doanh bất động sản.\u003c/p\u003e\n\u003cp\u003eDoanh nghiệp có thu nhập được miễn thuế theo quy định tại Khoản này phải đáp ứng đủ các điều kiện sau:\u003c/p\u003e\n\u003cp\u003ea) Đối với doanh nghiệp có sử dụng lao động là người khuyết tật (bao gồm cả thương binh, bệnh binh) phải có xác nhận của cơ quan y tế có thẩm quyền về số lao động là người khuyết tật.\u003c/p\u003e\n\u003cp\u003eb) Đối với doanh nghiệp có sử dụng lao động là người sau cai nghiện ma túy phải có giấy chứng nhận hoàn thành cai nghiện của các cơ sở cai nghiện hoặc xác nhận của cơ quan có thẩm quyền liên quan.\u003c/p\u003e\n\u003cp\u003ec) Đối với doanh nghiệp có sử dụng lao động là người nhiễm HIV phải có xác nhận của cơ quan y tế có thẩm quyền về số lao động là người nhiễm HIV.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5\u003c/strong\u003e\u003cstrong\u003e.\u003c/strong\u003e Thu nhập từ hoạt động dạy nghề dành riêng cho người dân tộc thiểu số, người khuyết tật, trẻ em có hoàn cảnh đặc biệt khó khăn, đối tượng tệ nạn xã hội, người đang cai nghiện, người sau cai nghiện, người nhiễm HIV/AIDS. Trường hợp cơ sở dạy nghề có cả đối tượng khác thì phần thu nhập được miễn thuế được xác định tương ứng với tỷ lệ học viên là người dân tộc thiểu số, người khuyết tật, trẻ em có hoàn cảnh đặc biệt khó khăn, đối tượng tệ nạn xã hội, người đang cai nghiện, người sau cai nghiện, người nhiễm HIV/AIDS trong tổng số học viên.\u003c/p\u003e\n\u003cp\u003eThu nhập từ hoạt động dạy nghề được miễn thuế tại Khoản này phải đáp ứng đủ các điều kiện sau:\u003c/p\u003e\n\u003cp\u003e- Cơ sở dạy nghề được thành lập và hoạt động theo quy định của các văn bản hướng dẫn về dạy nghề.\u003c/p\u003e\n\u003cp\u003e- Có danh sách các học viên là người dân tộc thiểu số, người khuyết tật, trẻ em có hoàn cảnh đặc biệt khó khăn, đối tượng tệ nạn xã hội, người đang cai nghiện, người sau cai nghiện, người nhiễm HIV/AIDS.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e6\u003c/strong\u003e\u003cstrong\u003e.\u003c/strong\u003e Thu nhập được chia từ hoạt động góp vốn, mua cổ phần, liên doanh, liên kết kinh tế với doanh nghiệp trong nước, sau khi bên nhận góp vốn, phát hành cổ phiếu, liên doanh, liên kết đã nộp thuế thu nhập doanh nghiệp theo quy định của Luật Thuế thu nhập doanh nghiệp, kể cả trường hợp bên nhận góp vốn, phát hành cổ phiếu, bên liên doanh, liên kết được miễn thuế, giảm thuế.\u003c/p\u003e\n\u003cp\u003eVí dụ 9: Doanh nghiệp B nhận vốn góp của doanh nghiệp A. Thu nhập trước thuế tương ứng với phần vốn góp của doanh nghiệp A trong doanh nghiệp B là 100 triệu đồng.\u003c/p\u003e\n\u003cp\u003e- Trường hợp 1: Doanh nghiệp B không được ưu đãi thuế thu nhập doanh nghiệp và doanh nghiệp B đã nộp đủ thuế thu nhập doanh nghiệp bao gồm cả khoản thu nhập của doanh nghiệp A nhận được thì thu nhập mà doanh nghiệp A nhận được từ hoạt động góp vốn là 75 triệu đồng [(100 triệu – (100 triệu x 25%)], doanh nghiệp A được miễn thuế thu nhập doanh nghiệp đối với 75 triệu đồng này.\u003c/p\u003e\n\u003cp\u003e- Trường hợp 2: Doanh nghiệp B được giảm 50% số thuế thu nhập doanh nghiệp phải nộp và doanh nghiệp B đã nộp đủ thuế thu nhập doanh nghiệp bao gồm cả khoản thu nhập của doanh nghiệp A nhận được theo số thuế thu nhập được giảm thì thu nhập mà doanh nghiệp A nhận được từ hoạt động góp vốn là 87,5 triệu đồng [100 triệu – (100 triệu x 25% x 50%)], doanh nghiệp A được miễn thuế thu nhập doanh nghiệp đối với 87,5 triệu đồng này.\u003c/p\u003e\n\u003cp\u003e- Trường hợp 3: Doanh nghiệp B được miễn thuế thu nhập doanh nghiệp thì thu nhập mà doanh nghiệp A nhận được từ hoạt động góp vốn là 100 triệu đồng, doanh nghiệp A được miễn thuế thu nhập doanh nghiệp đối với 100 triệu đồng này.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e7.\u003c/strong\u003e Khoản tài trợ nhận được để sử dụng cho hoạt động giáo dục, nghiên cứu khoa học, văn hoá, nghệ thuật, từ thiện, nhân đạo và hoạt động xã hội khác tại Việt Nam.\u003c/p\u003e\n\u003cp\u003eTrường hợp tổ chức nhận tài trợ sử dụng không đúng mục đích các khoản tài trợ trên thì tổ chức nhận tài trợ phải tính nộp thuế thu nhập doanh nghiệp theo mức thuế suất 25% trên số tiền nhận tài trợ sử dụng không đúng mục đích.\u003c/p\u003e\n\u003cp\u003eTổ chức nhận tài trợ quy định tại Khoản này phải được thành lập và hoạt động theo quy định của pháp luật, thực hiện đúng quy định của pháp luật về kế toán thống kê.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐiều 9. Xác định lỗ và chuyển lỗ\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1. \u003c/strong\u003eLỗ phát sinh trong kỳ tính thuế là số chênh lệch âm về thu nhập chịu thuế.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e\u003cstrong\u003e2.\u003c/strong\u003e Doanh nghiệp sau khi quyết toán thuế mà bị lỗ thì phải chuyển toàn bộ và liên tục số lỗ vào thu nhập chịu thuế của những năm tiếp theo. Thời gian chuyển lỗ tính liên tục không quá 5 năm, kể từ năm tiếp sau năm phát sinh lỗ.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eDoanh nghiệp tạm thời chuyển lỗ vào thu nhập chịu thuế của các quý của năm sau khi lập tờ khai tạm nộp quý và chuyển chính thức vào năm sau khi lập tờ khai quyết toán thuế năm.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eVí dụ 10: Năm 2011 DN A có phát sinh lỗ là 10 tỷ đồng, năm 2012 DN A có phát sinh thu nhập chịu thuế là 12 tỷ đồng thì toàn bộ số lỗ phát sinh năm 2011 là 10 tỷ đồng, DN A phải chuyển toàn bộ vào thu nhập chịu thuế năm 2012.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eVí dụ 11: Năm 2011 DN B có phát sinh lỗ là 20 tỷ đồng, năm 2012 DN B có phát sinh thu nhập chịu thuế là 15 tỷ đồng thì:\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e+ DN B phải chuyển toàn bộ số lỗ 15 tỷ đồng vào thu nhập chịu thuế năm 2012;\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e+ Số lỗ còn lại 5 tỷ đồng, DN B phải theo dõi và chuyển toàn bộ liên tục theo nguyên tắc chuyển lỗ của năm 2011 nêu trên vào các năm tiếp theo, nhưng tối đa không quá 5 năm, kể từ năm tiếp sau năm phát sinh lỗ.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Doanh nghiệp có số lỗ giữa các quý trong cùng một năm tài chính thì được bù trừ số lỗ của quý trước vào các quý tiếp theo của năm tài chính đó. Khi quyết toán thuế thu nhập doanh nghiệp, doanh nghiệp xác định số lỗ của cả năm và chuyển toàn bộ và liên tục số lỗ vào thu nhập chịu thuế của những năm tiếp sau năm phát sinh lỗ theo quy định nêu trên.\u003c/p\u003e\n\u003cp\u003e- Doanh nghiệp tự xác định số lỗ được trừ vào thu nhập chịu thuế theo nguyên tắc nêu trên. Trường hợp trong thời gian chuyển lỗ có phát sinh tiếp số lỗ thì số lỗ phát sinh này (không bao gồm số lỗ của kỳ trước chuyển sang) sẽ được chuyển lỗ toàn bộ và liên tục không quá 5 năm, kể từ năm tiếp sau năm phát sinh lỗ.\u003c/p\u003e\n\u003cp\u003eTrường hợp cơ quan có thẩm quyền kiểm tra, thanh tra quyết toán thuế thu nhập doanh nghiệp xác định số lỗ doanh nghiệp được chuyển khác với số lỗ do doanh nghiệp tự xác định thì số lỗ được chuyển xác định theo kết luận của cơ quan kiểm tra, thanh tra nhưng đảm bảo chuyển lỗ toàn bộ và liên tục không quá 5 năm, kể từ năm tiếp sau năm phát sinh lỗ theo quy định.\u003c/p\u003e\n\u003cp\u003eQuá thời hạn 5 năm kể từ năm tiếp sau năm phát sinh lỗ, nếu số lỗ phát sinh chưa chuyển hết thì sẽ không được chuyển vào thu nhập của các năm tiếp sau.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3. \u003c/strong\u003eDoanh nghiệp chuyển đổi loại hình doanh nghiệp, chuyển đổi hình thức sở hữu (kể cả giao, bán doanh nghiệp Nhà nước), sáp nhập, hợp nhất, chia, tách, giải thể, phá sản phải thực hiện quyết toán thuế với cơ quan thuế đến thời điểm có quyết định chuyển đổi loại hình doanh nghiệp, chuyển đổi hình thức sở hữu, sáp nhập, hợp nhất, chia, tách, giải thể, phá sản của cơ quan có thẩm quyền. Số lỗ của doanh nghiệp phát sinh trước khi chuyển đổi, sáp nhập, hợp nhất phải được theo dõi chi tiết theo năm phát sinh và bù trừ vào thu nhập chịu thuế cùng năm của doanh nghiệp sau khi chuyển đổi, sáp nhập, hợp nhất hoặc được tiếp tục chuyển vào thu nhập chịu thuế của các năm tiếp theo của doanh nghiệp sau khi chuyển đổi, sáp nhập, hợp nhất để đảm bảo nguyên tắc chuyển lỗ tính liên tục không quá 5 năm, kể từ năm tiếp sau năm phát sinh lỗ.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐiều 10. Trích lập quỹ phát triển khoa học và công nghệ của doanh nghiệp\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1.\u003c/strong\u003e Doanh nghiệp được thành lập, hoạt động theo quy định của pháp luật Việt Nam được trích tối đa 10% thu nhập tính thuế hàng năm trước khi tính thuế thu nhập doanh nghiệp để lập Quỹ phát triển khoa học và công nghệ của doanh nghiệp. Doanh nghiệp tự xác định mức trích lập Quỹ phát triển khoa học công nghệ theo quy định trước khi tính thuế thu nhập doanh nghiệp. Hàng năm nếu doanh nghiệp có trích lập quỹ phát triển khoa học công nghệ thì doanh nghiệp phải lập Báo cáo trích, sử dụng Quỹ phát triển khoa học công nghệ và kê khai mức trích lập, số tiền trích lập vào tờ khai quyết toán thuế thu nhập doanh nghiệp. Báo cáo việc sử dụng Quỹ phát triển khoa học công nghệ được nộp cùng tờ khai quyết toán thuế thu nhập doanh nghiệp.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.\u003c/strong\u003e Trong thời hạn 5 năm, kể từ khi trích lập, nếu Quỹ phát triển khoa học và công nghệ không được sử dụng hoặc sử dụng không hết 70% hoặc sử dụng không đúng mục đích thì doanh nghiệp phải nộp ngân sách nhà nước phần thuế thu nhập doanh nghiệp tính trên khoản thu nhập đã trích lập quỹ mà không sử dụng hoặc sử dụng không đúng mục đích và phần lãi phát sinh từ số thuế thu nhập doanh nghiệp đó.\u003c/p\u003e\n\u003cp\u003eSố tiền sử dụng không đúng mục đích thì sẽ không được tính vào tổng số tiền sử dụng cho mục đích phát triển khoa học và công nghệ.\u003c/p\u003e\n\u003cp\u003e- Thuế suất thuế thu nhập doanh nghiệp dùng để tính số thuế thu hồi là thuế suất áp dụng cho doanh nghiệp trong thời gian trích lập quỹ.\u003c/p\u003e\n\u003cp\u003e- Lãi suất tính lãi đối với số thuế thu hồi tính trên phần quỹ không sử dụng hết là lãi suất trái phiếu kho bạc loại kỳ hạn một năm áp dụng tại thời điểm thu hồi và thời gian tính lãi là hai năm.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3.\u003c/strong\u003e Quỹ phát triển khoa học và công nghệ của doanh nghiệp chỉ được sử dụng cho đầu tư nghiên cứu khoa học và phát triển công nghệ của doanh nghiệp tại Việt Nam. Các khoản chi từ Quỹ phát triển khoa học và công nghệ phải có đầy đủ hóa đơn, chứng từ hợp pháp theo quy định của pháp luật.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4.\u003c/strong\u003e Doanh nghiệp không được tính các khoản đã chi từ Quỹ phát triển khoa học và công nghệ của doanh nghiệp vào chi phí hoạt động sản xuất kinh doanh khi xác định thu nhập chịu thuế trong kỳ tính thuế. Trường hợp doanh nghiệp có chi đầu tư nghiên cứu khoa học và phát triển công nghệ của doanh nghiệp từ quỹ phát triển khoa học công nghệ mà không đủ thì phần chênh lệch còn lại giữa số thực chi và số đã trích quỹ sẽ được tính vào chi phí hoạt động sản xuất kinh doanh khi xác định thu nhập chịu thuế.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5.\u003c/strong\u003e Doanh nghiệp đang hoạt động mà có sự thay đổi về hình thức sở hữu, hợp nhất, sáp nhập thì doanh nghiệp mới thành lập từ việc thay đổi hình thức sở hữu, hợp nhất, sáp nhập được kế thừa và chịu trách nhiệm về việc quản lý, sử dụng Quỹ phát triển khoa học và công nghệ của doanh nghiệp trước khi chuyển đổi, hợp nhất, sáp nhập.\u003c/p\u003e\n\u003cp\u003eDoanh nghiệp nếu có Quỹ phát triển khoa học và công nghệ chưa sử dụng hết khi chia, tách thì doanh nghiệp mới thành lập từ việc chia, tách được kế thừa và chịu trách nhiệm về việc quản lý, sử dụng Quỹ phát triển khoa học và công nghệ của doanh nghiệp trước khi chia, tách. Việc phân chia Quỹ phát triển khoa học và công nghệ do doanh nghiệp quyết định và đăng ký với cơ quan thuế.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐiều 11. Thuế suất thuế thu nhập doanh nghiệp\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1.\u003c/strong\u003e Thuế suất thuế thu nhập doanh nghiệp là 25%, trừ trường hợp quy định tại khoản 2 Điều này và các trường hợp được áp dụng thuế suất ưu đãi.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. \u003c/strong\u003eThuế suất thuế thu nhập doanh nghiệp đối với hoạt động tìm kiếm, thăm dò, khai thác dầu khí tại Việt Nam từ 32% đến 50%. Căn cứ vào vị trí khai thác, điều kiện khai thác và trữ lượng mỏ doanh nghiệp có dự án đầu tư tìm kiếm, thăm dò, khai thác dầu khí gửi hồ sơ dự án đầu tư đến Bộ Tài chính để trình Thủ tướng Chính phủ quyết định mức thuế suất cụ thể cho từng dự án, từng cơ sở kinh doanh.\u003c/p\u003e\n\u003cp\u003eThuế suất thuế thu nhập doanh nghiệp đối với hoạt động tìm kiếm, thăm dò, khai thác các mỏ tài nguyên quý hiếm (trừ dầu khí) áp dụng thuế suất 50%; Trường hợp các mỏ tài nguyên quý hiếm có từ 70% diện tích được giao trở lên ở địa bàn có điều kiện kinh tế xã hội đặc biệt khó khăn thuộc danh mục địa bàn ưu đãi thuế thu nhập doanh nghiệp ban hành kèm theo Nghị định số 124/2008/NĐ-CP ngày 11/12/2008 của Chính phủ áp dụng thuế suất thuế thu nhập doanh nghiệp 40%.\u003c/p\u003e\n\u003cp\u003eTài nguyên quý hiếm tại khoản này bao gồm: bạch kim, vàng, bạc, thiếc, wonfram, antimoan, đá quý, đất hiếm.\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cstrong\u003eChương III\u003c/strong\u003e\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cstrong\u003eNƠI NỘP THUẾ\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐiều 12. Nguyên tắc xác định\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eDoanh nghiệp nộp thuế tại nơi có trụ sở chính. Trường hợp doanh nghiệp có cơ sở sản xuất (bao gồm cả cơ sở gia công, lắp ráp) hạch toán phụ thuộc hoạt động tại địa bàn tỉnh, thành phố trực thuộc trung ương khác với địa bàn nơi doanh nghiệp đóng trụ sở chính thì số thuế được tính nộp ở nơi có trụ sở chính và ở nơi có cơ sở sản xuất.\u003c/p\u003e\n\u003cp\u003eViệc phân bổ số thuế phải nộp quy định tại khoản này không áp dụng đối với trường hợp doanh nghiệp có các công trình, hạng mục công trình hay cơ sở xây dựng xây dựng hạch toán phụ thuộc.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐiều 13. Xác định số thuế phải nộp\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eSố thuế thu nhập doanh nghiệp tính nộp ở tỉnh, thành phố trực thuộc Trung ương nơi có cơ sở sản xuất hạch toán phụ thuộc được xác định bằng số thuế thu nhập doanh nghiệp phải nộp trong kỳ nhân (x) tỷ lệ chi phí của cơ sở sản xuất hạch toán phụ thuộc với tổng chi phí của doanh nghiệp.\u003c/p\u003e\n\u003cp\u003eTỷ lệ chi phí được xác định bằng tỷ lệ chi phí giữa tổng chi phí của cơ sở sản xuất hạch toán phụ thuộc với tổng chi phí của doanh nghiệp. Tỷ lệ chi phí được xác định như sau:\u003c/p\u003e\n\u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"width:100.0%;\" width=\"100%\"\u003e\n \u003ctbody\u003e\n  \u003ctr\u003e\n   \u003ctd rowspan=\"2\" style=\"width:32.94%;\"\u003e\n    \u003cp align=\"center\"\u003e\u0026nbsp;\u003c/p\u003e\n    \u003cp align=\"center\"\u003eTỷ lệ chi phí của cơ sở sản xuất hạch toán phụ thuộc\u003c/p\u003e\u003c/td\u003e\n   \u003ctd rowspan=\"2\" style=\"width:6.1%;\"\u003e\n    \u003cp align=\"center\"\u003e\u0026nbsp;\u003c/p\u003e\n    \u003cp align=\"center\"\u003e=\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:60.96%;\"\u003e\n    \u003cp align=\"center\"\u003eTổng chi phí của cơ sở sản xuất hạch toán phụ thuộc\u003c/p\u003e\u003c/td\u003e\n  \u003c/tr\u003e\n  \u003ctr\u003e\n   \u003ctd style=\"width:60.96%;\"\u003e\n    \u003cp align=\"center\"\u003e_______________________________________________\u003c/p\u003e\n    \u003cp align=\"center\"\u003eTổng chi phí của doanh nghiệp\u003c/p\u003e\u003c/td\u003e\n  \u003c/tr\u003e\n \u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eSố liệu để xác định tỷ lệ chi phí được căn cứ vào số liệu quyết toán thuế thu nhập của doanh nghiệp năm trước liền kề năm tính thuế do doanh nghiệp tự xác định để làm căn cứ xác định số thuế phải nộp và được sử dụng để kê khai, nộp thuế thu nhập doanh nghiệp cho các năm sau.\u003c/p\u003e\n\u003cp\u003eTrường hợp doanh nghiệp đang hoạt động có các cơ sở sản xuất hạch toán phụ thuộc ở các địa phương, số liệu để xác định tỷ lệ chi phí của trụ sở chính và các cơ sở sản xuất hạch toán phụ thuộc do doanh nghiệp tự xác định căn cứ theo số liệu quyết toán thuế thu nhập doanh nghiệp năm 2008 và tỷ lệ này được sử dụng ổn định từ năm 2009 trở đi.\u003c/p\u003e\n\u003cp\u003eTrường hợp doanh nghiệp mới thành lập, doanh nghiệp đang hoạt động có thành lập thêm hoặc thu hẹp các cơ sở sản xuất hạch toán phụ thuộc ở các địa phương thì doanh nghiệp phải tự xác định tỷ lệ chi phí cho kỳ tính thuế đầu tiên đối với các trường hợp này. Từ kỳ tính thuế tiếp theo tỷ lệ chi phí được xác định theo nguyên tắc nêu trên.\u003c/p\u003e\n\u003cp\u003eĐơn vị hạch toán phụ thuộc các doanh nghiệp hạch toán toàn ngành có thu nhập ngoài hoạt động kinh doanh chính thì nộp thuế tại tỉnh, thành phố trực thuộc Trung ương nơi phát sinh hoạt động sản xuất kinh doanh đó.\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cstrong\u003eChương IV\u003c/strong\u003e\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cstrong\u003eTHU NHẬP TỪ CHUYỂN NHƯỢNG VỐN, CHUYỂN NHƯỢNG CHỨNG KHOÁN\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐiều 14. Thu nhập từ chuyển nhượng vốn\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1\u003c/strong\u003e. Phạm vi áp dụng:\u003c/p\u003e\n\u003cp\u003eThu nhập từ chuyển nhượng vốn của doanh nghiệp là thu nhập có được từ chuyển nhượng một phần hoặc toàn bộ số vốn của doanh nghiệp đã đầu tư cho một hoặc nhiều tổ chức, cá nhân khác (bao gồm cả trường hợp bán toàn bộ doanh nghiệp). Thời điểm chuyển nhượng vốn là thời điểm chuyển quyền sở hữu vốn.\u003c/p\u003e\n\u003cp\u003eTrường hợp doanh nghiệp có chuyển nhượng vốn không nhận bằng tiền mà nhận bằng tài sản, lợi ích vật chất khác (cổ phiếu, chứng chỉ quỹ...) có phát sinh thu nhập thì phải chịu thuế thu nhập doanh nghiệp. Giá trị tài sản, cổ phiếu, chứng chỉ quỹ…được xác định theo giá bán của sản phẩm trên thị trường tại thời điểm nhận tài sản.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.\u003c/strong\u003e Căn cứ tính thuế:\u003c/p\u003e\n\u003cp\u003ea) Thu nhập tính thuế từ chuyển nhượng vốn được xác định:\u003c/p\u003e\n\u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"width:100.0%;\" width=\"100%\"\u003e\n \u003ctbody\u003e\n  \u003ctr\u003e\n   \u003ctd style=\"width:15.64%;\"\u003e\n    \u003cp align=\"center\"\u003eThu nhập tính thuế\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:6.18%;\"\u003e\n    \u003cp align=\"center\"\u003e=\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:22.64%;\"\u003e\n    \u003cp align=\"center\"\u003eGiá chuyển nhượng\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:4.12%;\"\u003e\n    \u003cp align=\"center\"\u003e-\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:25.72%;\"\u003e\n    \u003cp align=\"center\"\u003eGiá mua của phần vốn chuyển nhượng\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:5.14%;\"\u003e\n    \u003cp align=\"center\"\u003e-\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:20.58%;\"\u003e\n    \u003cp align=\"center\"\u003eChi phí chuyển nhượng\u003c/p\u003e\u003c/td\u003e\n  \u003c/tr\u003e\n \u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eTrong đó:\u003c/p\u003e\n\u003cp\u003e- Giá chuyển nhượng được xác định là tổng giá trị thực tế mà bên chuyển nhượng thu được theo hợp đồng chuyển nhượng.\u003c/p\u003e\n\u003cp\u003eTrường hợp hợp đồng chuyển nhượng vốn quy định việc thanh toán theo hình thức trả góp, trả chậm thì doanh thu của hợp đồng chuyển nhượng không bao gồm lãi trả góp, lãi trả chậm theo thời hạn quy định trong hợp đồng.\u003c/p\u003e\n\u003cp\u003eTrường hợp hợp đồng chuyển nhượng không quy định giá thanh toán hoặc cơ quan thuế có cơ sở để xác định giá thanh toán không phù hợp theo giá thị trường, cơ quan thuế có quyền kiểm tra và ấn định giá chuyển nhượng. Doanh nghiệp có chuyển nhượng một phần vốn góp trong doanh nghiệp mà giá chuyển nhượng đối với phần vốn góp này không phù hợp theo giá thị trường thì cơ quan thuế được ấn định lại toàn bộ giá trị của doanh nghiệp tại thời điểm chuyển nhượng để xác định lại giá chuyển nhượng tương ứng với tỷ lệ phần vốn góp chuyển nhượng.\u003c/p\u003e\n\u003cp\u003eCăn cứ ấn định giá chuyển nhượng dựa vào tài liệu điều tra của cơ quan thuế hoặc căn cứ giá chuyển nhượng vốn của các trường hợp khác ở cùng thời gian, cùng tổ chức kinh tế hoặc các hợp đồng chuyển nhượng tương tự tại thời điểm chuyển nhượng. Trường hợp việc ấn định giá chuyển nhượng của cơ quan thuế không phù hợp thì được căn cứ theo giá thẩm định của các tổ chức định giá chuyên nghiệp có thẩm quyền xác định giá chuyển nhượng tại thời điểm chuyển nhượng theo đúng quy định.\u003c/p\u003e\n\u003cp\u003e- Giá mua của phần vốn chuyển nhượng được xác định đối với từng trường hợp như sau:\u003c/p\u003e\n\u003cp\u003e+ Nếu là chuyển nhượng vốn góp thành lập doanh nghiệp là giá trị phần vốn góp trên cơ sở sổ sách, hồ sơ, chứng từ kế toán tại thời điểm chuyển nhượng vốn và được các bên tham gia đầu tư vốn hoặc tham gia hợp đồng hợp tác kinh doanh xác nhận, hoặc kết quả kiểm toán của công ty kiểm toán độc lập đối với doanh nghiệp 100% vốn nước ngoài.\u003c/p\u003e\n\u003cp\u003e+ Nếu là phần vốn do mua lại thì giá mua là giá trị vốn tại thời điểm mua, Giá mua được xác định căn cứ vào hợp đồng mua lại phần vốn góp, chứng từ thanh toán.\u003c/p\u003e\n\u003cp\u003eTrường hợp doanh nghiệp hạch toán kế toán bằng đồng ngoại tệ (đã được Bộ Tài chính chấp thuận) có chuyển nhượng vốn góp bằng ngoại tệ thì giá chuyển nhượng và giá mua của phần vốn chuyển nhượng được xác định bằng đồng ngoại tệ; Trường hợp doanh nghiệp hạch toán kế toán bằng đồng Việt Nam có chuyển nhượng vốn góp bằng ngoại tệ thì giá chuyển nhượng phải được xác định bằng đồng Việt Nam theo tỷ giá giao dịch bình quân trên thị trường ngoại tệ liên ngân hàng do Ngân hàng Nhà nước Việt Nam công bố tại thời điểm chuyển nhượng.\u003c/p\u003e\n\u003cp\u003e- Chi phí chuyển nhượng là các khoản chi thực tế liên quan trực tiếp đến việc chuyển nhượng, có chứng từ, hoá đơn hợp pháp. Trường hợp chi phí chuyển nhượng phát sinh ở nước ngoài thì các chứng từ gốc đó phải được một cơ quan công chứng hoặc kiểm toán độc lập của nước có chi phí phát sinh xác nhận và chứng từ phải được dịch ra tiếng Việt (có xác nhận của đại diện có thẩm quyền).\u003c/p\u003e\n\u003cp\u003eChi phí chuyển nhượng bao gồm: chi phí để làm các thủ tục pháp lý cần thiết cho việc chuyển nhượng; các khoản phí và lệ phí phải nộp khi làm thủ tục chuyển nhượng; các chi phí giao dịch, đàm phán, ký kết hợp đồng chuyển nhượng và các chi phí khác có chứng từ chứng minh.\u003c/p\u003e\n\u003cp\u003eVí dụ 12: Doanh nghiệp A góp 400 tỷ đồng gồm 320 tỷ đồng là giá trị nhà xưởng và 80 tỷ đồng tiền mặt để thành lập doanh nghiệp liên doanh sản xuất giấy vệ sinh sau đó doanh nghiệp A chuyển nhượng phần vốn góp nêu trên cho doanh nghiệp B với giá là 550 tỷ đồng. Vốn góp của doanh nghiệp A tại thời điểm chuyển nhượng trên sổ sách kế toán là 400 tỷ đồng, chi phí liên quan đến việc chuyển nhượng vốn là 70 tỷ đồng. Thu nhập để tính thuế thu nhập từ chuyển nhượng vốn trong trường hợp này là 80 tỷ đồng (550 - 400 - 70).\u003c/p\u003e\n\u003cp\u003eb) Doanh nghiệp có thu nhập từ chuyển nhượng vốn thì khoản thu nhập này được xác định là khoản thu nhập khác và kê khai vào thu nhập chịu thuế khi tính thuế thu nhập doanh nghiệp.\u003c/p\u003e\n\u003cp\u003ec) Đối với tổ chức nước ngoài kinh doanh tại Việt Nam hoặc có thu nhập tại Việt Nam mà tổ chức này không hoạt động theo Luật Đầu tư, Luật Doanh nghiệp (gọi chung là nhà thầu nước ngoài) có hoạt động chuyển nhượng vốn thì thực hiện kê khai, nộp thuế như sau:\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eTổ chức, cá nhân nhận chuyển nhượng vốn có trách nhiệm xác định, kê khai, khấu trừ và nộp thay tổ chức nước ngoài số thuế thu nhập doanh nghiệp phải nộp. Trường hợp bên nhận chuyển nhượng vốn cũng là tổ chức nước ngoài không hoạt động theo Luật Đầu tư, Luật Doanh nghiệp thì doanh nghiệp thành lập theo pháp luật Việt Nam nơi các tổ chức nước ngoài đầu tư vốn có trách nhiệm kê khai và nộp thay số thuế thu nhập doanh nghiệp phải nộp từ hoạt động chuyển nhượng vốn của tổ chức nước ngoài.\u003c/p\u003e\n\u003cp\u003eViệc kê khai thuế, nộp thuế được thực hiện theo quy định tại các văn bản quy phạm pháp luật về quản lý thuế .\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐiều 15. Thu nhập từ chuyển nhượng chứng khoán\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1.\u003c/strong\u003e Phạm vi áp dụng:\u003c/p\u003e\n\u003cp\u003eThu nhập từ chuyển nhượng chứng khoán của doanh nghiệp là thu nhập có được từ việc chuyển nhượng cổ phiếu, trái phiếu, chứng chỉ quỹ và các loại chứng khoán khác theo quy định.\u003c/p\u003e\n\u003cp\u003eTrường hợp Công ty cổ phần thực hiện phát hành thêm cổ phiếu để huy động vốn thì phần chênh lệch giữa giá phát hành và mệnh giá không tính vào thu nhập chịu thuế để tính thuế thu nhập doanh nghiệp.\u003c/p\u003e\n\u003cp\u003eTrường hợp Công ty cổ phần tiến hành chia, tách, hợp nhất, sáp nhập mà thực hiện hoán đổi cổ phiếu tại thời điểm chia, tách, hợp nhất, sáp nhập nếu phát sinh thu nhập thì phần thu nhập này phải chịu thuế thu nhập doanh nghiệp.\u003c/p\u003e\n\u003cp\u003eTrường hợp doanh nghiệp có chuyển nhượng chứng khoán không nhận bằng tiền mà nhận bằng tài sản, lợi ích vật chất khác (cổ phiếu, chứng chỉ quỹ...) có phát sinh thu nhập thì phải chịu thuế thu nhập doanh nghiệp. Giá trị tài sản, cổ phiếu, chứng chỉ quỹ…được xác định theo giá bán của sản phẩm trên thị trường tại thời điểm nhận tài sản.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.\u003c/strong\u003e Căn cứ tính thuế:\u003c/p\u003e\n\u003cp\u003eThu nhập tính thuế từ chuyển nhượng chứng khoán trong kỳ được xác định bằng giá bán chứng khoán trừ (-) giá mua của chứng khoán chuyển nhượng, trừ (-) các chi phí liên quan đến việc chuyển nhượng.\u003c/p\u003e\n\u003cp\u003e- Giá bán chứng khoán được xác định như sau:\u003c/p\u003e\n\u003cp\u003e+ Đối với chứng khoán niêm yết và chứng khoán của công ty đại chúng chưa niêm yết nhưng thực hiện đăng ký giao dịch tại trung tâm giao dịch chứng khoán thì giá bán chứng khoán là giá thực tế bán chứng khoán (là giá khớp lệnh hoặc giá thoả thuận) theo thông báo của Sở giao dịch chứng khoán, trung tâm giao dịch chứng khoán.\u003c/p\u003e\n\u003cp\u003e+ Đối với chứng khoán của các công ty không thuộc các trường hợp nêu trên thì giá bán chứng khoán là giá chuyển nhượng ghi trên hợp đồng chuyển nhượng.\u003c/p\u003e\n\u003cp\u003e- Giá mua của chứng khoán được xác định như sau:\u003c/p\u003e\n\u003cp\u003e+ Đối với chứng khoán niêm yết và chứng khoán của công ty đại chúng chưa niêm yết nhưng thực hiện đăng ký giao dịch tại trung tâm giao dịch chứng khoán thì giá mua chứng khoán là giá thực mua chứng khoán (là giá khớp lệnh hoặc giá thoả thuận) theo thông báo của Sở giao dịch chứng khoán, trung tâm giao dịch chứng khoán.\u003c/p\u003e\n\u003cp\u003e+ Đối với chứng khoán mua thông qua đấu giá thì giá mua chứng khoán là mức giá ghi trên thông báo kết quả trúng đấu giá cổ phần của tổ chức thực hiện đấu giá cổ phần và giấy nộp tiền.\u003c/p\u003e\n\u003cp\u003e+ Đối với chứng khoán không thuộc các trường hợp nêu trên: giá mua chứng khoán là giá chuyển nhượng ghi trên hợp đồng chuyển nhượng.\u003c/p\u003e\n\u003cp\u003e- Chi phí chuyển nhượng là các khoản chi thực tế liên quan trực tiếp đến việc chuyển nhượng, có chứng từ, hoá đơn hợp pháp.\u003c/p\u003e\n\u003cp\u003eChi phí chuyển nhượng bao gồm: chi phí để làm các thủ tục pháp lý cần thiết cho việc chuyển nhượng; Các khoản phí và lệ phí phải nộp khi làm thủ tục chuyển nhượng; Phí lưu ký chứng khoán theo quy định của Uỷ ban chứng khoán Nhà nước và chứng từ thu của công ty chứng khoán; Phí ủy thác chứng khoán căn cứ vào chứng từ thu của đơn vị nhận ủy thác; Các chi phí giao dịch, đàm phán, ký kết hợp đồng chuyển nhượng và các chi phí khác có chứng từ chứng minh.\u003c/p\u003e\n\u003cp\u003eDoanh nghiệp có thu nhập từ chuyển nhượng chứng khoán thì khoản thu nhập này được xác định là khoản thu nhập khác và kê khai vào thu nhập chịu thuế khi tính thuế thu nhập doanh nghiệp.\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cstrong\u003eChương V\u003c/strong\u003e\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cstrong\u003eTHU NHẬP TỪ CHUYỂN NHƯỢNG BẤT ĐỘNG SẢN\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐiều 16. Đối tượng chịu thuế\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e\u003cstrong\u003e1. \u003c/strong\u003eDoanh nghiệp thuộc diện chịu thuế thu nhập từ chuyển nhượng bất động sản bao gồm: Doanh nghiệp thuộc mọi thành phần kinh tế, mọi ngành nghề có thu nhập từ hoạt động chuyển nhượng bất động sản; Doanh nghiệp kinh doanh bất động sản có thu nhập từ hoạt động cho thuê lại đất.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2.\u003c/strong\u003e Thu nhập từ hoạt động chuyển nhượng bất động sản bao gồm: thu nhập từ chuyển nhượng quyền sử dụng đất, chuyển nhượng quyền thuê đất (gồm cả chuyển nhượng dự án gắn với chuyển nhượng quyền sử dụng đất, quyền thuê đất theo quy định của pháp luật); Thu nhập từ hoạt động cho thuê lại đất của doanh nghiệp kinh doanh bất động sản theo quy định của pháp luật về đất đai không phân biệt có hay không có kết cấu hạ tầng, công trình kiến trúc gắn liền với đất; Thu nhập từ chuyển nhượng nhà, công trình xây dựng gắn liền với đất, kể cả các tài sản gắn liền với nhà, công trình xây dựng đó nếu không tách riêng giá trị tài sản khi chuyển nhượng không phân biệt có hay không có chuyển nhượng quyền sử dụng đất, chuyển nhượng quyền thuê đất; Thu nhập từ chuyển nhượng các tài sản gắn liền với đất; Thu nhập từ chuyển nhượng quyền sở hữu hoặc quyền sử dụng nhà ở.\u003c/p\u003e\n\u003cp\u003eThu nhập từ cho thuê lại đất của doanh nghiệp kinh doanh bất động sản không bao gồm trường hợp doanh nghiệp chỉ cho thuê nhà, cơ sở hạ tầng, công trình kiến trúc trên đất.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐiều 17. Căn cứ tính thuế\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eCăn cứ tính thuế thu nhập từ chuyển nhượng bất động sản là thu nhập tính thuế và thuế suất.\u003c/p\u003e\n\u003cp\u003eThu nhập tính thuế bằng (=) thu nhập chịu thuế trừ (-) các khoản lỗ của hoạt động chuyển nhượng bất động sản của các năm trước (nếu có).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1.\u003c/strong\u003e Thu nhập chịu thuế.\u003c/p\u003e\n\u003cp\u003eThu nhập chịu thuế từ chuyển nhượng bất động sản được xác định bằng doanh thu thu được từ hoạt động chuyển nhượng bất động sản trừ giá vốn của bất động sản và các khoản chi phí được trừ liên quan đến hoạt động chuyển nhượng bất động sản.\u003c/p\u003e\n\u003cp\u003ea) Doanh thu từ hoạt động chuyển nhượng bất động sản.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003ea.1) Doanh thu từ hoạt động chuyển nhượng bất động sản được xác định theo giá thực tế chuyển nhượng bất động sản theo hợp đồng chuyển nhượng, mua bán bất động sản phù hợp với quy định của pháp luật (bao gồm cả các khoản phụ thu và phí thu thêm nếu có).\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eTrường hợp giá chuyển quyền sử dụng đất theo hợp đồng chuyển nhượng, mua bán bất động sản thấp hơn giá đất do Uỷ ban nhân dân tỉnh, thành phố trực thuộc Trung ương quy định tại thời điểm ký hợp đồng chuyển nhượng bất động sản thì tính theo giá đất do Uỷ ban nhân dân tỉnh, thành phố trực thuộc Trung ương quy định tại thời điểm ký hợp đồng chuyển nhượng bất động sản.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Thời điểm xác định doanh thu tính thuế là thời điểm bên bán bàn giao bất động sản cho bên mua, không phụ thuộc việc bên mua đã đăng ký quyền sở hữu tài sản, quyền sử dụng đất, xác lập quyền sử dụng đất tại cơ quan nhà nước có thẩm quyền.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Trường hợp doanh nghiệp được nhà nước giao đất, cho thuê đất để thực hiện dự án đầu tư cơ sở hạ tầng, nhà để chuyển nhượng hoặc cho thuê, có thu tiền ứng trước của khách hàng theo tiến độ dưới mọi hình thức thì thời điểm xác định doanh thu tính thuế thu nhập doanh nghiệp tạm nộp là thời điểm thu tiền của khách hàng, cụ thể:\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e+ Trường hợp doanh nghiệp có thu tiền của khách hàng mà xác định được chi phí tương ứng với doanh thu đã ghi nhận (bao gồm cả chi phí trích trước của phần dự toán hạng mục công trình chưa hoàn thành tương ứng với doanh thu đã ghi nhận) thì doanh nghiệp kê khai nộp thuế thu nhập doanh nghiệp tạm nộp theo doanh thu trừ chi phí.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e+ Trường hợp doanh nghiệp có thu tiền của khách hàng mà chưa xác định được chi phí tương ứng với doanh thu thì doanh nghiệp kê khai tạm nộp thuế thu nhập doanh nghiệp theo tỷ lệ 1% trên doanh thu thu được tiền và doanh thu này chưa phải tính vào doanh thu tính thuế thu nhập doanh nghiệp trong năm.\u003c/p\u003e\n\u003cp\u003e+ Khi bàn giao bất động sản, doanh nghiệp quyết toán lại số thuế thu nhập doanh nghiệp phải nộp. Trường hợp số thuế thu nhập doanh nghiệp đã tạm nộp thấp hơn số thuế thu nhập doanh nghiệp phải nộp thì doanh nghiệp phải nộp đủ số thuế còn thiếu vào Ngân sách Nhà nước. Trường hợp số thuế thu nhập doanh nghiệp đã tạm nộp lớn hơn số thuế phải nộp thì doanh nghiệp được trừ số thuế nộp thừa vào số thuế thu nhập doanh nghiệp phải nộp của kỳ tiếp theo hoặc được hoàn lại số thuế đã nộp thừa.\u003c/p\u003e\n\u003cp\u003ea.2) Doanh thu để tính thu nhập chịu thuế trong một số trường hợp được xác định như sau:\u003c/p\u003e\n\u003cp\u003e- Trường hợp doanh nghiệp có cho thuê lại đất thì doanh thu để tính thu nhập chịu thuế là số tiền bên thuê trả từng kỳ theo hợp đồng thuê. Trường hợp bên thuê trả tiền thuê trước cho nhiều năm thì doanh thu để tính thu nhập chịu thuế được phân bổ cho số năm trả tiền trước hoặc được xác định theo doanh thu trả tiền một lần. Việc chọn hình thức doanh thu trả tiền một lần chỉ được xác định khi doanh nghiệp đã đảm bảo hoàn thành các trách nhiệm tài chính đối với Nhà nước, đảm bảo các nghĩa vụ đối với các bên thuê lại đất cho hết thời hạn cho thuê lại đất.\u003c/p\u003e\n\u003cp\u003eTrường hợp doanh nghiệp đang trong thời gian hưởng ưu đãi thuế thu nhập doanh nghiệp lựa chọn phương pháp xác định doanh thu để tính thu nhập chịu thuế là toàn bộ số tiền thuê bên thuê trả trước cho nhiều năm thì việc xác định số thuế thu nhập doanh nghiệp từng năm miễn thuế, giảm thuế căn cứ vào tổng số thuế thu nhập doanh nghiệp của số năm trả tiền trước chia (:) số năm bên thuê trả tiền trước.\u003c/p\u003e\n\u003cp\u003eTrường hợp trước năm 2012 doanh nghiệp có cho thuê lại đất thu tiền trả trước cho nhiều năm và đã xác định doanh thu tính thuế theo hình thức phân bổ cho số năm trả tiền trước, nếu đến năm 2012 doanh nghiệp vẫn còn trong thời hạn cho thuê lại đất thì được lựa chọn xác định doanh thu tính thuế phân bổ hàng năm hoặc theo doanh thu trả tiền một lần cho số năm còn lại của thời hạn cho thuê lại đất.\u003c/p\u003e\n\u003cp\u003e- Trường hợp tổ chức tín dụng nhận giá trị quyền sử dụng đất bảo đảm tiền vay để thay thế cho việc thực hiện nghĩa vụ được bảo đảm nếu có chuyển quyền sử dụng đất là tài sản thế chấp bảo đảm tiền vay thì doanh thu để tính thu nhập chịu thuế là giá chuyển nhượng quyền sử dụng đất do các bên thoả thuận.\u003c/p\u003e\n\u003cp\u003e- Trường hợp chuyển quyền sử dụng đất là tài sản kê biên bảo đảm thi hành án thì doanh thu để tính thu nhập chịu thuế là giá chuyển nhượng quyền sử dụng đất do các bên đương sự thoả thuận hoặc giá do Hội đồng định giá xác định.\u003c/p\u003e\n\u003cp\u003eViệc xác định doanh thu đối với các trường hợp nêu tại tiết a2 phải đảm bảo các nguyên tắc nêu tại tiết a1 điểm này.\u003c/p\u003e\n\u003cp\u003eb) Chi phí chuyển nhượng bất động sản:\u003c/p\u003e\n\u003cp\u003eb.1) Nguyên tắc xác định chi phí:\u003c/p\u003e\n\u003cp\u003e- Các khoản chi được trừ để xác định thu nhập chịu thuế của hoạt động chuyển nhượng bất động sản trong kỳ tính thuế phải tương ứng với doanh thu để tính thu nhập chịu thuế.\u003c/p\u003e\n\u003cp\u003e- Trường hợp dự án đầu tư hoàn thành từng phần và chuyển nhượng dần theo tiến độ hoàn thành thì các khoản chi phí chung sử dụng cho dự án, chi phí trực tiếp sử dụng cho phần dự án đã hoàn thành được phân bổ theo m\u003csup\u003e2\u003c/sup\u003e đất chuyển quyền để xác định thu nhập chịu thuế của diện tích đất chuyển quyền; bao gồm: Chi phí đường giao thông nội bộ; khuôn viên cây xanh; chi phí đầu tư xây dựng hệ thống cấp, thoát nước; trạm biến thế điện; chi phí bồi thường về tài sản trên đất; Chi phí bồi thường, hỗ trợ, tái định cư và kinh phí tổ chức thực hiện bồi thường giải phóng mặt bằng được cấp có thẩm quyền phê duyệt còn lại chưa được trừ vào tiền sử dụng đất, tiền thuê đất theo quy định của chính sách thu tiền sử dụng đất, thu tiền thuê đất, tiền sử dụng đất, tiền thuê đất phải nộp Ngân sách Nhà nước, các chi phí khác đầu tư trên đất liên quan đến chuyển quyền sử dụng đất, chuyển quyền thuê đất.\u003c/p\u003e\n\u003cp\u003eViệc phân bổ các chi phí trên được thực hiện theo công thức sau:\u003c/p\u003e\n\u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"width:100.0%;\" width=\"100%\"\u003e\n \u003ctbody\u003e\n  \u003ctr\u003e\n   \u003ctd rowspan=\"2\" style=\"width:19.1%;\"\u003e\n    \u003cp align=\"center\"\u003e\u0026nbsp;\u003c/p\u003e\n    \u003cp align=\"center\"\u003eChi phí phân bổ cho diện tích đất đã chuyển nhượng\u003c/p\u003e\u003c/td\u003e\n   \u003ctd rowspan=\"2\" style=\"width:4.76%;\"\u003e\n    \u003cp align=\"center\"\u003e\u0026nbsp;\u003c/p\u003e\n    \u003cp align=\"center\"\u003e=\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"width:51.9%;\"\u003e\n    \u003cp align=\"center\"\u003e\u0026nbsp;\u003c/p\u003e\n    \u003cp align=\"center\"\u003eTổng chi phí đầu tư kết cấu hạ tầng\u003c/p\u003e\u003c/td\u003e\n   \u003ctd rowspan=\"2\" style=\"width:5.06%;\"\u003e\n    \u003cp align=\"center\"\u003e\u0026nbsp;\u003c/p\u003e\n    \u003cp align=\"center\"\u003ex\u003c/p\u003e\u003c/td\u003e\n   \u003ctd rowspan=\"2\" style=\"width:19.2%;\"\u003e\n    \u003cp align=\"center\"\u003e\u0026nbsp;\u003c/p\u003e\n    \u003cp align=\"center\"\u003eDiện tích đất đã chuyển nhượng\u003c/p\u003e\u003c/td\u003e\n  \u003c/tr\u003e\n  \u003ctr\u003e\n   \u003ctd style=\"width:51.9%;\"\u003e\n    \u003cp align=\"center\"\u003e_____________________________________________\u003c/p\u003e\n    \u003cp align=\"center\"\u003eTổng diện tích đất được giao làm dự án (trừ diện tích đất sử dụng vào mục đích công cộng theo quy định của pháp luật về đất đai).\u003c/p\u003e\u003c/td\u003e\n  \u003c/tr\u003e\n \u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eTrường hợp một phần diện tích của dự án không chuyển nhượng được sử dụng vào hoạt động kinh doanh khác thì các khoản chi phí chung nêu trên cũng phân bổ cho cả phần diện tích này để theo dõi, hạch toán, kê khai nộp thuế thu nhập doanh nghiệp đối với hoạt động kinh doanh khác.\u003c/p\u003e\n\u003cp\u003eTrường hợp doanh nghiệp có hoạt động đầu tư xây dựng cơ sở hạ tầng kéo dài trong nhiều năm và chỉ quyết toán giá trị kết cấu hạ tầng khi toàn bộ công việc hoàn tất thì khi tổng hợp chi phí chuyển nhượng bất động sản cho phần diện tích đất đã chuyển quyền, doanh nghiệp được tạm phân bổ chi phí đầu tư kết cấu hạ tầng thực tế đã phát sinh theo tỷ lệ diện tích đất đã chuyển quyền theo công thức nêu trên và trích trước các khoản chi phí đầu tư xây dựng cơ sở hạ tầng tương ứng với doanh thu đã ghi nhận khi xác định thu nhập chịu thuế. Sau khi hoàn tất quá trình đầu tư xây dựng, doanh nghiệp tính toán, điều chỉnh lại phần chi phí đầu tư kết cấu hạ tầng đã tạm phân bổ và trích trước cho phần diện tích đã chuyển quyền cho phù hợp với tổng giá trị kết cấu hạ tầng. Trường hợp khi điều chỉnh lại phát sinh số thuế nộp thừa so với số thuế thu nhập từ chuyển nhượng bất động sản phải nộp thì doanh nghiệp được trừ số thuế nộp thừa vào số thuế phải nộp của kỳ tính thuế tiếp theo hoặc được hoàn trả theo quy định hiện hành; nếu số thuế đã nộp chưa đủ thì doanh nghiệp có trách nhiệm nộp đủ số thuế còn thiếu theo quy định.\u003c/p\u003e\n\u003cp\u003eb.2) Chi phí chuyển nhượng bất động sản được trừ bao gồm:\u003c/p\u003e\n\u003cp\u003e- Giá vốn của đất chuyển quyền được xác định phù hợp với nguồn gốc quyền sử dụng đất, cụ thể như sau:\u003c/p\u003e\n\u003cp\u003e+ Đối với đất Nhà nước giao có thu tiền sử dụng đất, thu tiền cho thuê đất thì giá vốn là số tiền sử dụng đất, số tiền cho thuê đất thực nộp Ngân sách nhà nước;\u003c/p\u003e\n\u003cp\u003e+ Đối với đất nhận quyền sử dụng của tổ chức, cá nhân khác thì căn cứ vào hợp đồng và chứng từ trả tiền hợp pháp khi nhận quyền sử dụng đất, quyền thuê đất; trường hợp không có hợp đồng và chứng từ trả tiền hợp pháp thì giá vốn được tính theo giá do Uỷ ban nhân dân tỉnh, thành phố trực thuộc Trung ương quy định tại thời điểm doanh nghiệp nhận chuyển nhượng bất động sản.\u003c/p\u003e\n\u003cp\u003e+ Đối với đất có nguồn gốc do góp vốn thì giá vốn là giá trị quyền sử dụng đất, quyền thuê đất theo biên bản định giá tài sản khi góp vốn;\u003c/p\u003e\n\u003cp\u003e+ Trường hợp doanh nghiệp đổi công trình lấy đất của Nhà nước thì giá vốn được xác định theo giá trị công trình đã đổi, trừ trường hợp thực hiện theo quy định riêng của cơ quan nhà nước có thẩm quyền.\u003c/p\u003e\n\u003cp\u003e+ Giá trúng đấu giá trong trường hợp đấu giá quyền sử dụng đất, quyền thuê đất;\u003c/p\u003e\n\u003cp\u003e+ Đối với đất của doanh nghiệp có nguồn gốc do thừa kế theo pháp luật dân sự; do được cho, biếu, tặng mà không xác định được giá vốn thì xác định theo giá các loại đất do Ủy ban nhân dân tỉnh, thành phố trực thuộc Trung ương quyết định căn cứ vào Bảng khung giá các loại đất do Chính phủ quy định tại thời điểm thừa kế, cho, biếu, tặng.\u003c/p\u003e\n\u003cp\u003eTrường hợp đất của doanh nghiệp được thừa kế, cho, biếu, tặng trước năm 1994 thì giá vốn được xác định theo giá các loại đất do Ủy ban nhân dân tỉnh, thành phố trực thuộc Trung ương quyết định năm 1994 căn cứ vào Bảng khung giá các loại đất quy định tại Nghị định số 87/CP ngày 17 tháng 8 năm 1994 của Chính phủ.\u003c/p\u003e\n\u003cp\u003e+ Đối với đất thế chấp bảo đảm tiền vay, đất là tài sản kê biên để bảo đảm thi hành án thì giá vốn đất được xác định tùy theo từng trường hợp cụ thể theo hướng dẫn tại các điểm nêu trên.\u003c/p\u003e\n\u003cp\u003e- Chi phí đền bù thiệt hại về đất.\u003c/p\u003e\n\u003cp\u003e- Chi phí đền bù thiệt hại về hoa màu.\u003c/p\u003e\n\u003cp\u003e- ­Chi phí bồi thường, hỗ trợ, tái định cư và chi phí tổ chức thực hiện bồi thường, hỗ trợ, tái định cư theo quy định của pháp luật.\u003c/p\u003e\n\u003cp\u003eCác khoản chi phí bồi thường, đền bù, hỗ trợ, tái định cư và chi phí tổ chức thực hiện bồi thường, hỗ trợ, tái định cư nêu trên nếu không có hoá đơn thì được lập Bảng kê ghi rõ: tên; địa chỉ của người nhận; số tiền đền bù, hỗ trợ; chữ ký của người nhận tiền và được Chính quyền phường, xã nơi có đất được đền bù, hỗ trợ xác nhận theo đúng quy định của pháp luật về bồi thường, hỗ trợ và tái định cư khi Nhà nước thu hồi đất.\u003c/p\u003e\n\u003cp\u003e- Các loại phí, lệ phí theo quy định của pháp luật liên quan đến cấp quyền sử dụng đất.\u003c/p\u003e\n\u003cp\u003e- Chi phí cải tạo đất, san lấp mặt bằng.\u003c/p\u003e\n\u003cp\u003e- Chi phí đầu t­ư xây dựng kết cấu hạ tầng như đường giao thông, điện, cấp nước, thoát nước, bưu chính viễn thông…\u003c/p\u003e\n\u003cp\u003e- Giá trị kết cấu hạ tầng, công trình kiến trúc có trên đất.\u003c/p\u003e\n\u003cp\u003e- Các khoản chi phí khác liên quan đến bất động sản được chuyển nhượng.\u003c/p\u003e\n\u003cp\u003eTrường hợp doanh nghiệp có hoạt động kinh doanh nhiều ngành nghề khác nhau thì phải hạch toán riêng các khoản chi phí. Trường hợp không hạch toán riêng được chi phí của từng hoạt động thì chi phí chung được phân bổ theo tỷ lệ giữa doanh thu từ chuyển nhượng bất động sản so với tổng doanh thu của doanh nghiệp.\u003c/p\u003e\n\u003cp\u003eKhông được tính vào chi phí chuyển nhượng bất động sản các khoản chi phí đã được Nhà nước thanh toán hoặc thanh toán bằng nguồn vốn khác.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. \u003c/strong\u003eThuế suất thuế thu nhập doanh nghiệp đối với hoạt động chuyển nhượng bất động sản là 25%.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3. \u003c/strong\u003eXác định số thuế thu nhập doanh nghiệp phải nộp:\u003c/p\u003e\n\u003cp\u003eSố thuế thu nhập doanh nghiệp trong kỳ tính thuế đối với hoạt động chuyển nhượng bất động sản bằng thu nhập tính thuế từ hoạt động chuyển nhượng bất động sản nhân (x) với thuế suất 25%.\u003c/p\u003e\n\u003cp\u003eThu nhập từ chuyển nhượng bất động sản phải xác định riêng để kê khai nộp thuế. Không áp dụng mức thuế suất ưu đãi; thời gian miễn thuế, giảm thuế theo hướng dẫn tại Chương VI Thông tư này đối với thu nhập từ hoạt động chuyển nhượng bất động sản.\u003c/p\u003e\n\u003cp\u003eTrường hợp hoạt động chuyển nhượng bất động sản bị lỗ thì khoản lỗ này không được bù trừ với thu nhập từ hoạt động sản xuất kinh doanh và thu nhập khác mà được chuyển lỗ vào thu nhập chịu thuế từ hoạt động chuyển nhượng bất động sản của các năm sau (nếu có). Thời gian chuyển lỗ tối đa không quá 5 năm liên tục, kể từ năm tiếp sau năm phát sinh lỗ.\u003c/p\u003e\n\u003cp\u003eHồ sơ khai thuế, nộp thuế, chứng từ nộp thuế thu nhập từ chuyển nhượng bất động sản phát sinh tại địa phương nơi có bất động sản chuyển nhượng là căn cứ làm thủ tục quyết toán thuế nơi đặt trụ sở chính.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4. \u003c/strong\u003eTrường hợp tổ chức tín dụng nhận giá trị bất động sản là tài sản bảo đảm tiền vay để thay thế cho việc thực hiện nghĩa vụ được bảo đảm thì tổ chức tín dụng khi được phép chuyển nhượng bất động sản theo quy định của pháp luật phải kê khai nộp thuế thu nhập từ hoạt động chuyển nhượng bất động sản vào Ngân sách Nhà nước. Trường hợp bán đấu giá bất động sản là tài sản bảo đảm tiền vay thì số tiền thu được thực hiện thanh toán theo quy định của Chính phủ về bảo đảm tiền vay của các tổ chức tín dụng và kê khai nộp thuế theo quy định. Sau khi thanh toán các khoản trên, số tiền còn lại được trả cho các tổ chức kinh doanh đã thế chấp bất động sản để bảo đảm tiền vay.\u003c/p\u003e\n\u003cp\u003eTrường hợp tổ chức tín dụng được phép chuyển nhượng bất động sản đã được thế chấp theo quy định của pháp luật để thu hồi vốn nếu không xác định được giá vốn của bất động sản thì giá vốn được xác định bằng (=) vốn vay phải trả theo hợp đồng thế chấp bất động sản cộng (+) chi phí lãi vay chưa trả đến thời điểm phát mãi bất động sản thế chấp theo hợp đồng tín dụng cộng (+) các khoản chi phí phát sinh khi chuyển nhượng bất động sản nếu có hóa đơn, chứng từ hợp pháp.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5.\u003c/strong\u003e Trường hợp cơ quan thi hành án bán đấu giá bất động sản là tài sản bảo đảm thi hành án thì số tiền thu được thực hiện theo quy định tại Nghị định của Chính phủ về kê biên, đấu giá quyền sử dụng đất để bảo đảm thi hành án. Tổ chức được uỷ quyền bán đấu giá bất động sản thực hiện kê khai, khấu trừ tiền thuế thu nhập từ chuyển nhượng bất động sản nộp vào Ngân sách Nhà nước. Trên các chứng từ ghi rõ kê khai, nộp thuế thay về bán tài sản đảm bảo thi hành án.\u003c/p\u003e\n\u003cp\u003eTrường hợp cơ quan thi hành án chuyển nhượng bất động sản là tài sản đảm bảo thi hành án nếu không xác định được giá vốn của bất động sản thì giá vốn được xác định bằng (=) số tiền nợ phải trả nợ theo quyết định của Toà án để thi hành án cộng (+) các khoản chi phí phát sinh khi chuyển nhượng bất động sản nếu có hóa đơn chứng từ hợp pháp.\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cstrong\u003eChương VI\u003c/strong\u003e\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cstrong\u003eƯU ĐÃI THUẾ THU NHẬP DOANH NGHIỆP\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eĐiều 18. Điều kiện, nguyên tắc áp dụng ưu đãi thuế thu nhập doanh nghiệp\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e1. \u003c/strong\u003eĐiều kiện áp dụng ưu đãi thuế thu nhập doanh nghiệp: Các ưu đãi về thuế thu nhập doanh nghiệp chỉ áp dụng đối với doanh nghiệp thực hiện chế độ kế toán, hoá đơn, chứng từ theo quy định và đăng ký, nộp thuế thu nhập doanh nghiệp theo kê khai.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e2. \u003c/strong\u003eNguyên tắc áp dụng ưu đãi thuế thu nhập doanh nghiệp\u003c/p\u003e\n\u003cp\u003ea) Trong thời gian đang được hưởng ưu đãi thuế thu nhập doanh nghiệp nếu doanh nghiệp thực hiện nhiều hoạt động sản xuất, kinh doanh thì doanh nghiệp phải hạch toán riêng thu nhập từ hoạt động sản xuất, kinh doanh được hưởng ưu đãi thuế thu nhập doanh nghiệp (bao gồm mức thuế suất ưu đãi, mức miễn thuế, giảm thuế) và thu nhập từ hoạt động kinh doanh không được hưởng ưu đãi thuế để kê khai nộp thuế riêng.\u003c/p\u003e\n\u003cp\u003eTrường hợp trong kỳ tính thuế, doanh nghiệp không hạch toán riêng thu nhập từ hoạt động sản xuất kinh doanh được hưởng ưu đãi thuế và thu nhập từ hoạt động sản xuất kinh doanh không được hưởng ưu đãi thuế thì phần thu nhập của hoạt động sản xuất kinh doanh ưu đãi thuế xác định bằng (=) tổng thu nhập tính thuế (không bao gồm thu nhập khác) nhân (x) với tỷ lệ phần trăm (%) doanh thu hoặc chi phí được trừ của hoạt động sản xuất kinh doanh ưu đãi thuế so với tổng doanh thu hoặc tổng chi phí được trừ của doanh nghiệp trong kỳ tính thuế.\u003c/p\u003e\n\u003cp\u003eb) Doanh nghiệp thành lập mới từ dự án đầu tư được hưởng ưu đãi thuế thu nhập doanh nghiệp là doanh nghiệp đăng ký kinh doanh doanh lần đầu, trừ các trường hợp sau:\u003c/p\u003e\n\u003cp\u003eb.1) Doanh nghiệp thành lập trong các trường hợp chia, tách, sáp nhập, hợp nhất theo quy định của pháp luật.\u003c/p\u003e\n\u003cp\u003eb.2) Doanh nghiệp thành lập do chuyển đổi hình thức doanh nghiệp, chuyển đổi sở hữu (bao gồm cả trường hợp thành lập doanh nghiệp mới nhưng tài sản, địa điểm kinh doanh, ngành nghề kinh doanh ... vẫn kế thừa của doanh nghiệp cũ để tiếp tục hoạt động sản xuất kinh doanh).\u003c/p\u003e\n\u003cp\u003eb.3) Doanh nghiệp tư nhân, Công ty trách nhiệm hữu hạn mới thành lập mà chủ doanh nghiệp là chủ hộ kinh doanh cá thể và không có thay đổi về ngành nghề kinh doanh trước đây.\u003c/p\u003e\n\u003cp\u003eb.4) Doanh nghiệp tư nhân, Công ty hợp danh, Công ty trách nhiệm hữu hạn, Công ty cổ phần hoặc Hợp tác xã mới thành lập mà người đại diện theo pháp luật là người có số vốn góp cao nhất đã tham gia hoạt động kinh doanh với vai trò là người đại diện theo pháp luật, thành viên hợp danh hoặc người có số vốn góp cao nhất trong các doanh nghiệp đang hoạt động hoặc đã giải thể nhưng chưa được 12 tháng tính từ thời điểm giải thể doanh nghiệp cũ đến thời điểm thành lập doanh nghiệp mới.\u003c/p\u003e\n\u003cp\u003ec) Dự án đầu tư là tập hợp các đề xuất bỏ vốn trung và dài hạn để tiến hành các hoạt động đầu tư theo quy định của pháp luật về đầu tư.\u003c/p\u003e\n\u003cp\u003eTrường hợp doanh nghiệp thành lập mới từ dự án đầu tư mà dự án đầu tư trong nước có quy mô vốn đầu tư dưới mười lăm (15) tỷ đồng Việt Nam và không thuộc Danh mục lĩnh vực đầu tư có điều kiện thì hồ sơ để xác định dự án đầu tư là giấy chứng nhận đăng ký doanh nghiệp.\u003c/p\u003e\n\u003cp\u003eTrường hợp doanh nghiệp thành lập mới từ dự án đầu tư mà dự án đầu tư trong nước có quy mô vốn đầu tư từ mười lăm (15) tỷ đồng Việt Nam đến dưới ba trăm (300) tỷ đồng Việt Nam và không thuộc Danh mục lĩnh vực đầu tư có điều kiện thì nhà đầu tư làm thủ tục đăng ký đầu tư theo mẫu tại cơ quan nhà nước quản lý đầu tư cấp tỉnh.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e3. \u003c/strong\u003eViệc ưu đãi thuế thu nhập doanh nghiệp theo diện doanh nghiệp mới thành lập từ dự án đầu tư chỉ áp dụng đối với thu nhập từ hoạt động sản xuất kinh doanh đáp ứng điều kiện ưu đãi đầu tư ghi trong giấy chứng nhận đăng ký kinh doanh lần đầu của doanh nghiệp. Đối với doanh nghiệp đang hoạt động sản xuất kinh doanh nếu có sự thay đổi giấy chứng nhận đăng ký kinh doanh nhưng sự thay đổi đó không làm thay đổi việc đáp ứng các điều kiện ưu đãi thuế theo quy định thì doanh nghiệp tiếp tục được hưởng ưu đãi thuế cho thời gian còn lại. Doanh nghiệp đang hoạt động có thực hiện bổ sung ngành nghề kinh doanh, bổ sung quy mô hoạt động kinh doanh (đầu tư lắp đặt dây chuyền sản xuất mới, mở rộng quy mô...) thì thu nhập từ hoạt động kinh doanh của ngành nghề bổ sung, quy mô hoạt động bổ sung không thuộc diện ưu đãi thuế thu nhập doanh nghiệp.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e4. \u003c/strong\u003eTrường hợp doanh nghiệp thành lập mới từ dự án đầu tư tại địa bàn ưu đãi đầu tư được hưởng ưu đãi thuế thu nhập doanh nghiệp theo địa bàn ưu đãi đầu tư nếu có thu nhập từ hoạt động sản xuất kinh doanh tại địa bàn ưu đãi đầu tư và ngoài địa bàn ưu đãi đầu tư thì doanh nghiệp phải tính riêng thu nhập từ hoạt động sản xuất kinh doanh tại địa bàn ưu đãi đầu tư để được hưởng ưu đãi thuế thu nhập doanh nghiệp.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5.\u003c/strong\u003e Trong cùng một kỳ tính thuế nếu có một khoản thu nhập thuộc diện áp dụng thuế suất thuế thu nhập doanh nghiệp ưu đãi và thời gian miễn thuế, giảm thuế theo nhiều trường hợp khác nhau thì doanh nghiệp tự lựa chọn một trong những trường hợp ưu đãi thuế thu nhập doanh nghiệp có lợi nhất.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e6. \u003c/strong\u003eTrong thời gian được ưu đãi thuế thu nhập doanh nghiệp, nếu trong năm tính thuế mà doanh nghiệp không đáp ứng đủ một trong các điều kiện ưu đãi thuế quy định tại Thông tư này thì doanh nghiệp không được hưởng ưu đãi trong năm tính thuế đó mà phải nộp thuế thu nhập doanh nghiệp theo mức thuế suất 25%.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e7. \u003c/strong\u003eTrường hợp trong cùng kỳ tính thuế, doanh nghiệp có phát sinh hoạt động kinh doanh được hưởng ưu đãi thuế bị lỗ, hoạt động kinh doanh không được hưởng ưu đãi thuế, thu nhập khác của các hoạt động kinh doanh (không bao gồm thu nhập từ hoạt động chuyển nhượng bất động sản, chuyển nhượng dự án (không gắn liền với chuyển quyền sử dụng đất, chuyển quyền thuê đất); thu nhập từ chuyển nhượng quyền thực hiện dự án, chuyển nhượng quyền thăm dò, khai thác, chế biến khoáng sản theo quy định của pháp luật) có thu nhập (hoặc ngược lại) thì doanh nghiệp bù trừ vào thu nhập chịu thuế của các hoạt động có thu nhập do doanh nghiệp lựa chọn.\u003c/p\u003e\n\u003cp\u003eTrường hợp trong các kỳ tính thuế trước, doanh nghiệp đang bị lỗ (nếu còn trong thời hạn chuyển lỗ) thì doanh nghiệp phải chuyển lỗ tương ứng với các hoạt động có thu nhập. Nếu doanh nghiệp không tách riêng được lỗ của từng hoạt động thì doanh nghiệp chuyển lỗ vào thu nhập của hoạt động được hưởng ưu đãi thuế thu nhập doanh nghiệp trước sau đó vẫn còn lỗ thì chuyển vào thu nhập của hoạt động không được hưởng ưu đãi thuế thu nhập doanh nghiệp (không bao gồm thu nhập từ hoạt động chuyển nhượng bất động sản, chuyển nhượng dự án (không gắn liền với chuyển quyền sử dụng đất, chuyển quyền thuê đất); thu nhập từ chuyển nhượng quyền thực hiện dự án, chuyển nhượng quyền thăm dò, khai thác, chế biến khoáng sản theo quy định của pháp luật). Sau khi chuyển lỗ theo nguyên tắc nêu trên nếu doanh nghiệp còn phát sinh lỗ và lãi của các hoạt động kinh doanh khác nhau (không bao gồm thu nhập từ hoạt động chuyển nhượng bất động sản, chuyển nhượng dự án (không gắn liền với chuyển quyền sử dụng đất, chuyển quyền thuê đất); thu nhập từ chuyển nhượng quyền thực hiện dự án, chuyển nhượng quyền thăm dò, khai thác, chế biến khoáng sản theo quy định của pháp luật) thì doanh nghiệp được bù trừ vào thu nhập chịu thuế của các hoạt động có thu nhập. Phần thu nhập còn lại sau khi bù trừ áp dụng mức thuế suất thuế thu nhập doanh nghiệp theo mức thuế suất của hoạt động còn thu nhập.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eVí dụ 13: Trong kỳ tính thuế năm 2012, DN A có phát sinh:\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Lỗ từ hoạt động sản xuất phần mềm được ưu đãi thuế là 1 tỷ đồng.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Lãi từ hoạt động kinh doanh máy tính không thuộc diện ưu đãi thuế là 1 tỷ đồng.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Lãi từ hoạt động chuyển nhượng chứng khoán (thu nhập khác của hoạt động kinh doanh) là 2 tỷ đồng.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eTrường hợp này DN A được lựa chọn bù trừ giữa lỗ từ hoạt động sản xuất phần mềm và lãi từ hoạt động kinh doanh máy tính hoặc lãi từ hoạt động chuyển nhượng chứng khoán; phần thu nhập còn lại sẽ nộp thuế TNDN theo thuế suất của phần có thu nhập.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eCụ thể: Bù trừ lỗ 1 tỷ đồng sản xuất phần mềm với lãi 1 tỷ đồng của hoạt động kinh doanh máy tính hoặc hoạt động chuyển nhượng chứng khoán.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e=\u0026gt; DN còn thu nhập là 2 tỷ đồng và phải nộp thuế TNDN với mức thuế suất 25% (2 tỷ đồng x 25%).\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eVí dụ 14: Trong kỳ tính thuế năm 2012, DN B có phát sinh:\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Lãi từ hoạt động sản xuất phần mềm được ưu đãi thuế là 2 tỷ đồng (hoạt động này đang áp dụng thuế suất thuế TNDN 10%).\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Lãi từ hoạt động kinh doanh máy tính không thuộc diện ưu đãi thuế là 2 tỷ đồng.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Lỗ từ hoạt động kinh doanh chứng khoán (thu nhập khác của hoạt động kinh doanh) là 1 tỷ đồng.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eKỳ tính thuế năm 2011, DN B có lỗ từ hoạt động kinh doanh máy tính là 1 tỷ đồng thì khi xác định thu nhập chịu thuế của năm 2012, DN B phải thực hiện chuyển lỗ như sau:\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eCụ thể:\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Bù trừ giữa lãi và lỗ phát sinh trong năm 2012: doanh nghiệp lựa chọn bù trừ lỗ của hoạt động kinh doanh chứng khoán vào thu nhập của hoạt động kinh doanh máy tính, hoạt động kinh doanh máy tính còn lãi là (2 tỷ - 1 tỷ) = 1 tỷ đồng.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Chuyển lỗ của hoạt động kinh doanh máy tính năm 2011 để bù trừ với lãi của hoạt động kinh doanh máy tính năm 2012: (1 tỷ - 1 tỷ = 0 tỷ)\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Kê khai, tính và nộp thuế TNDN của hoạt động được ưu đãi thuế:\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e2 tỷ đồng x 10% = 200 triệu đồng\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e=\u0026gt; Thuế TNDN phải nộp là: 200 triệu đồng\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eVí dụ 15: Trong kỳ tính thuế năm 2012, DN C có phát sinh:\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Lãi từ hoạt động sản xuất phần mềm được ưu đãi thuế là 2 tỷ đồng (hoạt động này đang áp dụng thuế suất thuế TNDN 10% ).\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Lãi từ hoạt động kinh doanh máy tính không thuộc diện ưu đãi thuế là 2 tỷ đồng.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Lỗ từ hoạt động kinh doanh chứng khoán (thu nhập khác của hoạt động kinh doanh) là 1 tỷ đồng.\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eKỳ tính thuế năm 2011, DN C có lỗ là 2 tỷ đồng tuy nhiên doanh nghiệp không tách riêng được khoản lỗ này là của hoạt động nào do vậy DN C phải thực hiện bù trừ lỗ vào thu nhập của hoạt động đang được ưu đãi trước (hoạt động sản xuất phần mềm).\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eCụ thể: - Bù trừ giữa lãi và lỗ phát sinh năm 2012: doanh nghiệp lựa chọn bù trừ lỗ hoạt động kinh doanh chứng khoán vào hoạt động kinh doanh máy tính, hoạt động kinh doanh máy tính còn lãi là (2 tỷ - 1 tỷ) = 1 tỷ đồng\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003e- Chuyển lỗ của năm 2011 để bù trừ với lãi của hoạt động sản xuất phần mềm năm 2012: 2 tỷ - 2 tỷ = 0 tỷ\u003c/p\u003e\n\u003cp style=\"margin-right:-3.6pt;\"\u003eKê khai nộp thuế TNDN với mức thuế suất 25% của hoạt động kinh doanh không được hưởng ưu đãi thuế, cụ thể: 1 tỷ x 25% = 250 triệu đồng.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e8\u003c/strong\u003e\u003cstrong\u003e.\u003c/strong\u003e Việc ưu đãi thuế thu nhập doanh nghiệp không áp dụng đối với:\u0

ackSuggestions\":{\"title\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\",\"description\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\"}}},\"footer\":{\"unit\":\"Đơn vị chủ quản\",\"unitContent\":\"Bộ Tư pháp\",\"address\":\"Địa chỉ\",\"addressContent\":\"Số 60 Trần Phú - Ba Đình - Thành phố Hà Nội\",\"phoneNumber\":\"Điện thoại\",\"phoneNumberContent\":\"024.6273.9468\",\"fax\":\"Fax\",\"faxContent\":\"024.6273.9359\"},\"underConstruction\":{\"title\":\"Đang cập nhật\",\"message\":\"Chức năng này đang được phát triển.\"},\"gioiThieu\":{\"timeline\":{\"2005\":{\"description\":\"Năm 2005 đánh dấu sự khởi đầu của dự án xây dựng Cơ sở dữ liệu quốc gia về pháp luật, với mục tiêu số hóa và tập trung hóa các văn bản pháp luật của Việt Nam.\"},\"2012-2013\":{\"description\":\"Giai đoạn 2012-2013 là thời kỳ phát triển và mở rộng hệ thống, với việc tích hợp thêm nhiều tính năng và cải thiện giao diện người dùng.\"},\"2023-2025\":{\"description\":\"Giai đoạn 2023-2025 tập trung vào việc nâng cấp và hiện đại hóa hệ thống, áp dụng các công nghệ mới và mở rộng phạm vi phục vụ.\"}},\"overview\":{\"title\":\"SƠ LƯỢC MÔ HÌNH CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"CSDLQG về pháp luật tập hợp các văn bản quy phạm pháp luật và văn bản hợp nhất văn bản quy phạm pháp luật (sau đây gọi chung là văn bản) dưới dạng văn bản điện tử do Chính phủ thống nhất quản lý, có địa chỉ truy cập vbpl.vn, bao gồm các Cơ sở dữ liệu thành phần: Cơ sở dữ liệu văn bản pháp luật Trung ương và Cơ sở dữ liệu văn bản pháp luật địa phương.\",\"central\":{\"title\":\"Cơ sở dữ liệu Văn bản pháp luật Trung ương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của các Bộ, cơ quan ngang Bộ, cơ quan nhà nước khác ở Trung ương ban hành hoặc phối hợp ban hành. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật; Văn bản hợp nhất; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"local\":{\"title\":\"Cơ sở dữ liệu văn bản pháp luật địa phương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của từng tỉnh, thành phố trực thuộc Trung ương trên toàn quốc. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật của Hội đồng nhân dân và Ủy ban nhân dân; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"other\":{\"title\":\"Các chuyên mục khác\",\"content\":\"Ngoài các Cơ sở dữ liệu thành phần kể trên, CSDLQG về pháp luật còn có các chuyên mục khác như: Giới thiệu văn bản mới, Tin tức, Tình huống pháp luật. Ngoài ra, CSDLQG về thủ tục hành chính, bộ pháp điển điện tử, cổng thông tin điện tử Bộ Tư pháp cũng trích xuất về CSDLQG về pháp luật.\"}},\"vision\":{\"title\":\"Tầm nhìn\",\"content\":\"Trở thành nguồn tra cứu văn bản pháp luật chính thống, đầy đủ và đáng tin cậy, phục vụ hiệu quả cho người dân, doanh nghiệp và cơ quan nhà nước.\"},\"mission\":{\"title\":\"Sứ mệnh\",\"content\":\"Cung cấp hệ thống văn bản pháp luật được cập nhật kịp thời, tra cứu thuận tiện, góp phần nâng cao nhận thức pháp luật và bảo đảm việc tuân thủ pháp luật trong xã hội.\"},\"features\":{\"title\":\"MỘT SỐ TÍNH NĂNG, TIỆN ÍCH CỦA CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"Hiện nay, CSDLQG về PL có giao diện tương đối thân thiện, dễ tìm kiếm, dễ khai thác các thông tin và tải về sử dụng. Cơ sở dữ liệu cung cấp các chức năng, tiện ích cơ bản và thuận tiện\",\"list\":[{\"key\":\"fullText\",\"label\":\"Tra cứu toàn văn\",\"icon\":\"SearchOutlined\"},{\"key\":\"tableOfContents\",\"label\":\"Tự động tạo mục lục\",\"icon\":\"BookOutlined\"},{\"key\":\"relatedDocuments\",\"label\":\"Liên kết văn bản liên quan\",\"icon\":\"LinkOutlined\"},{\"key\":\"validity\",\"label\":\"Xác định hiệu lực tự động\",\"icon\":\"BarChartOutlined\"},{\"key\":\"validityHistory\",\"label\":\"Lịch sử hiệu lực\",\"icon\":\"ClockCircleOutlined\"},{\"key\":\"download\",\"label\":\"Tải văn bản\",\"icon\":\"DownloadOutlined\"},{\"key\":\"english\",\"label\":\"Xem văn bản tiếng Anh\",\"icon\":\"GlobalOutlined\"},{\"key\":\"centralLocal\",\"label\":\"Liên kết văn bản Trung ương – địa phương\",\"icon\":\"ShareAltOutlined\" ccf0eafc577be.js\",\"5292\",\"static/chunks/5292-beb20880bf4a7330.js\",\"3207\",\"static/chunks/3207-0792bf349fc6782d.js\",\"7287\",\"static/chunks/7287-1e02014aaec038d7.js\",\"2007\",\"static/chunks/2007-dba949ac429f5003.js\",\"4310\",\"static/chunks/app/%5Blocale%5D/van-ban/%5Bcategory%5D/%5Bid%5D/page-75f20aedc57a9c0c.js\"],\"default\"]\n2b:T10a32,"])</script><script>self.__next_f.push([1,"\u003c!DOCTYPE html\u003e\n\u003chtml\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n    \u003ctitle\u003eDocument Content\u003c/title\u003e\n    \u003cstyle\u003e\n        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }\n        p { margin: 10px 0; }\n    \u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eNGHỊ ĐỊNH\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eQuy định về hóa đơn bán hàng hóa, cung ứng dịch vụ\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eCHÍNH PHỦ\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eCăn cứ Luật Tổ chức Chính phủ ngày 25 tháng 12 năm 2001;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eCăn cứ Luật Quản lý thuế ngày 29 tháng 11 năm 2006;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eCăn cứ Luật Kế toán ngày 17 tháng 6 năm 2003;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eCăn cứ Luật Giao dịch điện tử ngày 29 tháng 11 năm 2005;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eCăn cứ Pháp lệnh Xử lý vi phạm hành chính ngày 02 tháng 7 năm 2002 và Pháp lệnh sửa đổi, bổ sung một số điều của Pháp lệnh Xử lý vi phạm hành chính ngày 02 tháng 4 năm 2008;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eXét đề nghị của Bộ trưởng Bộ Tài chính, \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eNGHỊ ĐỊNH:\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eChương I\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eQUY ĐỊNH CHUNG\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 1. Phạm vi điều chỉnh\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eNghị định này quy định về việc in, phát hành, sử dụng hóa đơn bán hàng hóa, cung ứng dịch vụ (sau đây gọi chung là hóa đơn); xử phạt vi phạm hành chính về hóa đơn; nhiệm vụ, quyền hạn của cơ quan quản lý thuế các cấp và các cơ quan, tổ chức có liên quan đến việc in, phát hành, sử dụng hóa đơn; quyền, nghĩa vụ và trách nhiệm của cơ quan, tổ chức, cá nhân trong việc in, phát hành, sử dụng hóa đơn.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 2. Đối tượng áp dụng \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Người bán hàng hóa, cung ứng dịch vụ, gồm:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ea) Tổ chức, cá nhân Việt Nam kinh doanh bán hàng hóa, cung ứng dịch vụ (gọi chung là bán hàng hóa, dịch vụ) tại Việt Nam hoặc bán ra nước ngoài;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eb) Tổ chức, cá nhân nước ngoài kinh doanh bán hàng hóa, dịch vụ tại Việt Nam hoặc sản xuất kinh doanh ở Việt Nam bán hàng ra nước ngoài;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ec) Tổ chức, cá nhân Việt Nam hoặc nước ngoài không kinh doanh nhưng có bán hàng hóa, dịch vụ tại Việt Nam \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Tổ chức nhận in hóa đơn.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Tổ chức, cá nhân mua hàng hóa, dịch vụ \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4. Cơ quan quản lý thuế các cấp và các tổ chức, cá nhân có liên quan đến việc in, phát hành, sử dụng hóa đơn\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 3. Giải thích từ ngữ\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Hóa đơn là chứng từ do người bán lập, ghi nhận thông tin bán hàng hóa, dịch vụ theo quy định của pháp luật.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Tạo hóa đơn là hoạt động làm ra hóa đơn để sử dụng cho mục đích bán hàng hóa, dịch vụ của tổ chức, cá nhân kinh doanh; gồm: tự in từ các máy móc, thiết bị tại doanh nghiệp; đặt các doanh nghiệp đủ điều kiện in hóa đơn; khởi tạo hóa đơn điện tử theo Luật Giao dịch điện tử.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Lập hóa đơn là việc ghi đầy đủ nội dung của hóa đơn theo quy định khi bán hàng hóa, dịch vụ \u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4. Hóa đơn hợp pháp là hóa đơn đảm bảo đúng, đầy đủ về hình thức và nội dung theo quy định tại Nghị định này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e5. Hóa đơn giả là hóa đơn được in hoặc khởi tạo theo mẫu hóa đơn đã được phát hành của tổ chức, cá nhân khác hoặc in, khởi tạo trùng số của cùng một ký hiệu hóa đơn.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e6. Hóa đơn chưa có giá trị sử dụng là hóa đơn đã được in, khởi tạo theo quy định tại Nghị định này, nhưng chưa hoàn thành việc thông báo phát hành.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e7. Hóa đơn hết giá trị sử dụng là hóa đơn đã làm đủ thủ tục phát hành nhưng tổ chức, cá nhân phát hành thông báo không tiếp tục sử dụng nữa; các loại hóa đơn bị mất sau khi đã thông báo phát hành, được tổ chức, cá nhân phát hành báo mất với cơ quan thuế quản lý trực tiếp; hóa đơn của các tổ chức, cá nhân đã ngưng sử dụng mã số thuế (còn gọi là đóng mã số thuế).\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e8. Sử dụng hóa đơn bất hợp pháp là việc sử dụng hóa đơn giả, hóa đơn chưa có giá trị sử dụng, hết giá trị sử dụng; hoặc sử dụng hóa đơn của tổ chức, cá nhân khác (trừ hóa đơn do cơ quan thuế phát hành) để lập khi bán hàng hóa, dịch vụ, để hạch toán kế toán, khai thuế, thanh toán vốn ngân sách.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e9. Sử dụng bất hợp pháp hóa đơn là việc lập khống hóa đơn; cho hoặc bán hóa đơn chưa lập để tổ chức, cá nhân khác lập khi bán hàng hóa, dịch vụ; cho hoặc bán hóa đơn đã lập để tổ chức, cá nhân khác hạch toán, khai thuế hoặc thanh toán vốn ngân sách; lập hóa đơn không ghi đầy đủ các nội dung; lập hóa đơn sai lệch nội dung giữa các liên; dùng hóa đơn của hàng hóa, dịch vụ này để chứng minh cho hàng hóa, dịch vụ khác; dùng hóa đơn quay vòng khi vận chuyển hàng hóa trong khâu lưu thông.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e10. Hóa đơn lập khống là hóa đơn được lập nhưng nội dung được ghi không có thực một phần hoặc toàn bộ\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 4. Loại, hình thức và nội dung hóa đơn \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Hóa đơn quy định tại Nghị định này gồm các loại sau:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ea) Hóa đơn xuất khẩu là hóa đơn dùng trong hoạt động kinh doanh xuất khẩu hàng hóa, dịch vụ ra nước ngoài, xuất khẩu vào khu phi thuế quan;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eb) Hóa đơn giá trị gia tăng là hóa đơn bán hàng hóa, dịch vụ nội địa dành cho các tổ chức, cá nhân khai thuế giá trị gia tăng theo phương pháp khấu trừ;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ec) Hóa đơn bán hàng là hóa đơn bán hàng hóa, dịch vụ nội địa dành cho các tổ chức, cá nhân khai thuế giá trị gia tăng theo phương pháp trực tiếp;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ed) Các loại hóa đơn khác, gồm: vé, thẻ hoặc các chứng từ có tên gọi khác nhưng có hình thức và nội dung quy định tại các khoản 2, 3 Điều này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Hóa đơn được thể hiện bằng các hình thức sau:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ea) Hóa đơn tự in là hóa đơn do các tổ chức, cá nhân kinh doanh tự in ra trên các thiết bị tin học, máy tính tiền hoặc các loại máy khác khi bán hàng hóa, dịch vụ;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eb) Hóa đơn điện tử là tập hợp các thông điệp dữ liệu điện tử về bán hàng hóa, dịch vụ, được khởi tạo, lập, gửi, nhận, lưu trữ và quản lý theo quy định tại Luật Giao dịch điện tử và các văn bản hướng dẫn thi hành;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ec) Hóa đơn đặt in là hóa đơn do các tổ chức, cá nhân kinh doanh đặt in theo mẫu để sử dụng cho hoạt động kinh doanh hàng hóa, dịch vụ, hoặc do cơ quan thuế đặt in theo mẫu để cấp, bán cho các tổ chức, cá nhân.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Hóa đơn phải có các nội dung sau:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ea) Tên hóa đơn, ký hiệu hóa đơn, số hóa đơn, tên liên hóa đơn. Đối với hóa đơn đặt in còn phải ghi tên tổ chức đã nhận in hóa đơn;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eb) Tên, địa chỉ, mã số thuế của người bán;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ec) Tên, địa chỉ, mã số thuế của người mua;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ed) Tên, đơn vị tính, số lượng, đơn giá hàng hóa, dịch vụ; thành tiền chưa có thuế giá trị gia tăng, thuế suất thuế giá trị gia tăng, số tiền thuế giá trị gia tăng trong trường hợp là hóa đơn giá trị gia tăng;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eđ) Tổng số tiền thanh toán, chữ ký người mua, chữ ký người bán, dấu người bán (nếu có) và ngày, tháng, năm lập hóa đơn.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eBộ Tài chính quy định cụ thể đối với hóa đơn không cần thiết phải có đủ những nội dung quy định tại khoản này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4. Hóa đơn được thể hiện bằng chữ Việt. Hóa đơn xuất khẩu hoặc các loại hóa đơn cần kèm chữ nước ngoài thì chữ nước ngoài được đặt bên phải trong ngoặc đơn () hoặc đặt ngay dưới dòng chữ Việt và có kích cỡ nhỏ hơn kích cỡ chữ Việt.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e5. Trường hợp điều ước quốc tế mà Việt Nam là thành viên có quy định về nội dung và hình thức hóa đơn khác với quy định tại các khoản 2, 3 Điều này thì thực hiện theo quy định tại điều ước quốc tế đó.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eChương II\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eTẠO VÀ PHÁT HÀNH HÓA ĐƠN\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 5. Nguyên tắc tạo và phát hành hóa đơn \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Tổ chức, cá nhân kinh doanh đáp ứng đủ các điều kiện quy định tại Điều 6, Điều 7 Nghị định này được tự in hóa đơn hoặc khởi tạo hóa đơn điện tử để sử dụng trong việc bán hàng hóa, dịch vụ.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Tổ chức, cá nhân kinh doanh có mã số thuế nhưng không đủ điều kiện quy định tại khoản 1 Điều này phải đặt in hóa đơn để phục vụ cho hoạt động bán hàng hóa, dịch vụ của bản thân tổ chức, cá nhân.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Cơ quan thuế cấp tỉnh, thành phố (sau đây gọi tắt là Cục Thuế) đặt in, phát hành hóa đơn để cấp, bán cho các tổ chức, cá nhân theo quy định tại Điều 10 Nghị định này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4. Doanh nghiệp đủ điều kiện theo quy định tại Điều 22 Nghị định này được nhận in hóa đơn cho các tổ chức, cá nhân khác.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e5. Tổ chức, cá nhân kinh doanh có thể đồng thời cùng lúc sử dụng nhiều hình thức hóa đơn khác nhau. Nhà nước khuyến khích hình thức hóa đơn điện tử.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e6. Tổ chức, cá nhân khi in hóa đơn không được in trùng số trong những hóa đơn có cùng ký hiệu\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e7. Tổ chức, cá nhân trước khi sử dụng hóa đơn cho việc bán hàng hóa, dịch vụ phải thông báo phát hành theo quy định tại Điều 11, Điều 12 Nghị định này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 6. Hóa đơn tự in \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Doanh nghiệp được thành lập theo quy định của pháp luật trong khu công nghiệp, khu kinh tế, khu chế xuất, khu công nghệ cao; doanh nghiệp có mức vốn điều lệ theo quy định của Bộ Tài chính; các đơn vị sự nghiệp công lập có sản xuất, kinh doanh theo quy định của pháp luật được tự in hóa đơn kể từ khi có mã số thuế.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Tổ chức, cá nhân kinh doanh trừ các trường hợp quy định tại khoản 1 Điều này, được tự in hóa đơn để sử dụng cho việc bán hàng hóa, dịch vụ nếu có đủ các điều kiện sau:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ea) Đã được cấp mã số thuế;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eb) Có doanh thu bán hàng hóa, dịch vụ;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ec) Không bị xử phạt về các hành vi vi phạm pháp luật về thuế theo mức do Bộ Tài chính quy định trong 365 (ba trăm sáu mươi lăm) ngày liên tục tính đến ngày thông báo phát hành hóa đơn tự in;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ed) Có hệ thống thiết bị đảm bảo cho việc in và lập hóa đơn khi bán hàng hóa, dịch vụ;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eđ) Là đơn vị kế toán theo quy định của Luật Kế toán và có phần mềm bán hàng hóa, dịch vụ gắn liền với phần mềm kế toán, đảm bảo việc in và lập hóa đơn chỉ được thực hiện khi nghiệp vụ kế toán phát sinh.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Hóa đơn tự in đảm bảo nguyên tắc mỗi số hóa đơn chỉ được lập một lần. Số lượng liên hóa đơn được in căn cứ vào yêu cầu sử dụng cụ thể của nghiệp vụ bán hàng. Tổ chức, cá nhân có trách nhiệm tự quy định bằng văn bản về số lượng liên hóa đơn.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 7. Hóa đơn điện tử\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Hóa đơn điện tử được khởi tạo, lập, xử lý trên hệ thống máy tính của tổ chức, cá nhân kinh doanh đã được cấp mã số thuế khi bán hàng hóa, dịch vụ và được lưu trữ trên máy tính của các Bên theo quy định của pháp luật về giao dịch điện tử.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Hóa đơn điện tử được sử dụng theo quy định của pháp luật về giao dịch điện tử.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 8. Hóa đơn đặt in \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Hóa đơn đặt in được in ra dưới dạng mẫu in sẵn có nội dung quy định tại khoản 3 Điều 4 Nghị định này. Riêng hóa đơn do các Cục Thuế đặt in phải có tên Cục Thuế ở góc trên bên trái của tờ hóa đơn.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Tổ chức, cá nhân kinh doanh có mã số thuế được đặt in hóa đơn để sử dụng cho các hoạt động bán hàng hóa, dịch vụ.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Cục Thuế đặt in hóa đơn để bán, cấp cho các tổ chức, cá nhân thuộc đối tượng theo quy định tại Điều 10 Nghị định này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eTất cả các đơn vị trực thuộc Cục Thuế bán, cấp cùng một loại hóa đơn do Cục Thuế phát hành.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 9. In hóa đơn đặt in \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Hóa đơn đặt in được in theo hợp đồng giữa tổ chức, cá nhân kinh doanh hàng hóa, dịch vụ hoặc Cục Thuế với doanh nghiệp nhận in hóa đơn có đủ điều kiện theo quy định tại Điều 22 Nghị định này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Hợp đồng in hóa đơn được thể hiện bằng văn bản, trong đó phải ghi rõ số lượng, ký hiệu, số thứ tự hóa đơn đặt in, đồng thời kèm theo mẫu hóa đơn.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Trường hợp doanh nghiệp in tự in hóa đơn đặt in để sử dụng cho mục đích bán hàng hóa, dịch vụ, phải có quyết định in hóa đơn của thủ trưởng đơn vị. Quyết định in phải đảm bảo các nội dung quy định tại khoản 2 Điều này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 10. Bán, cấp hóa đơn do Cục Thuế đặt in\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Hóa đơn do Cục Thuế đặt in được bán theo giá bảo đảm bù đắp chi phí thực tế. Cục trưởng Cục Thuế quyết định và niêm yết giá bán hóa đơn theo nguyên tắc trên. Cơ quan thuế các cấp không được thu thêm bất kỳ khoản thu nào ngoài giá bán đã niêm yết.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Hóa đơn do các Cục Thuế đặt in chỉ được bán cho tổ chức không phải là doanh nghiệp nhưng có hoạt động kinh doanh, hộ gia đình và cá nhân kinh doanh có cơ sở tại địa phương.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Hóa đơn do các Cục Thuế đặt in được cấp cho các tổ chức không phải là doanh nghiệp, hộ gia đình và cá nhân không kinh doanh nhưng có phát sinh hoạt động bán hàng hóa, dịch vụ cần có hóa đơn để giao cho khách hàng.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 11. Phát hành hóa đơn của tổ chức, cá nhân kinh doanh \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Tổ chức, cá nhân kinh doanh trước khi sử dụng hóa đơn cho việc bán hàng hóa, dịch vụ phải lập Tờ thông báo phát hành hóa đơn.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Nội dung Tờ thông báo phát hành hóa đơn gồm: hóa đơn mẫu, ngày bắt đầu sử dụng, ngày lập Tờ thông báo phát hành và chữ ký của người đại diện trước pháp luật.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Hóa đơn mẫu là bản in đúng, đủ các nội dung trên liên hóa đơn giao cho người mua loại sẽ phát hành, có số hóa đơn là một dãy các chữ số 0 và in chữ “Mẫu” trên tờ hóa đơn.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4. Tờ thông báo phát hành hóa đơn được gửi đến cơ quan thuế nơi tổ chức, cá nhân phát hành thông báo đóng trụ sở chính, trong thời hạn mười ngày, kể từ ngày ký thông báo phát hành và niêm yết ngay tại các cơ sở sử dụng hóa đơn để bán hàng hóa, dịch vụ trong suốt thời gian sử dụng hóa đơn.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e5. Trường hợp có sự thay đổi về nội dung đã thông báo phát hành, tổ chức, cá nhân kinh doanh phải thực hiện thủ tục thông báo phát hành mới theo quy định tại các khoản 2, 3 và 4 Điều này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 12. Phát hành hóa đơn của Cục Thuế \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Hóa đơn do Cục Thuế đặt in để bán, cấp trước khi bán, cấp lần đầu phải lập Tờ thông báo phát hành hóa đơn.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Nội dung Tờ thông báo phát hành và hóa đơn mẫu được quy định như khoản 2 và 3 Điều 11.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Tờ thông báo phát hành hóa đơn phải được gửi đến tất cả các Cục Thuế trong cả nước trong thời hạn 10 (mười) ngày, kể từ ngày lập Tờ thông báo phát hành và niêm yết ngay tại các cơ sở trực thuộc Cục Thuế trong suốt thời gian sử dụng hóa đơn. Trường hợp Cục Thuế đã đưa nội dung Tờ thông báo lên trang mạng (Website) của ngành thuế thì không phải gửi Tờ thông báo đến Cục Thuế khác.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4. Trường hợp có sự thay đổi về nội dung đã thông báo phát hành, Cục Thuế phải thực hiện thủ tục thông báo phát hành mới theo quy định tại khoản 2 và 3 Điều này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 13. Nhận dạng hóa đơn \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Tổ chức, cá nhân khi in, phát hành hóa đơn có trách nhiệm ghi các ký hiệu nhận dạng mật trên hóa đơn do mình phát hành để phục vụ việc nhận dạng hóa đơn giả trong quá trình sử dụng.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Khi có yêu cầu của cơ quan nhà nước có thẩm quyền về xác nhận tính hợp pháp của hóa đơn, tổ chức, cá nhân in, phát hành hóa đơn phải có văn bản trả lời trong vòng mười ngày kể từ khi nhận được yêu cầu.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eChương III\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eSỬ DỤNG HÓA ĐƠN\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 14. Nguyên tắc sử dụng hóa đơn \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Tổ chức, cá nhân kinh doanh chỉ được lập và giao cho người mua hàng hóa, dịch vụ các loại hóa đơn theo quy định tại Nghị định này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Tổ chức, cá nhân kinh doanh khi lập hóa đơn phải ghi đầy đủ nội dung và đúng thực tế nghiệp vụ phát sinh.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Hóa đơn được lập thành nhiều liên gồm: liên giao cho người mua, liên người bán giữ và một số liên khác theo yêu cầu của hoạt động kinh doanh. Nội dung lập hóa đơn phải được thống nhất trên các liên hóa đơn có cùng một số.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4. Tổ chức, cá nhân kinh doanh trong quá trình sử dụng nếu phát hiện mất hóa đơn đã lập hoặc chưa lập phải báo cáo cho cơ quan thuế quản lý trực tiếp biết để xử lý kịp thời.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e5. Các cơ sở kinh doanh trong cùng một đơn vị kế toán theo quy định tại Luật Kế toán, sử dụng hóa đơn của cơ sở chính.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 15. Lập hóa đơn \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Khi bán hàng hóa, dịch vụ người bán phải lập hóa đơn. Khi lập hóa đơn phải ghi đầy đủ nội dung theo quy định tại Nghị định này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Hóa đơn phải được lập theo thứ tự từ số nhỏ đến số lớn. Bộ Tài chính quy định thứ tự lập hóa đơn đối với trường hợp nhiều cơ sở của cùng đơn vị kế toán sử dụng chung một loại hóa đơn có cùng tên, cùng ký hiệu.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Ngày lập hóa đơn là ngày người bán và người mua làm thủ tục ghi nhận hàng hóa, dịch vụ đã được chuyển quyền sở hữu, quyền sử dụng. Các trường hợp pháp luật quy định chuyển quyền sở hữu, quyền sử dụng có hiệu lực kể từ thời điểm đăng ký thì ngày lập hóa đơn là ngày bàn giao hàng hóa.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eTrường hợp giao hàng nhiều lần hoặc bàn giao từng hạng mục, công đoạn dịch vụ thì mỗi lần giao hàng hoặc bàn giao đều phải lập hóa đơn cho khối lượng, giá trị hàng hóa, dịch vụ được giao tương ứng.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4. Trường hợp bán hàng qua điện thoại, qua mạng; bán hàng hóa, dịch vụ cùng lúc cho nhiều người tiêu dùng, khi lập hóa đơn người bán hoặc người mua không phải ký tên theo quy định của Bộ Tài chính.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e5. Hóa đơn điện tử được lập xong sau khi người bán và người mua đã ký xác nhận giao dịch đã được thực hiện theo quy định của pháp luật về giao dịch điện tử.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e6. Bộ Tài chính quy định việc lập hóa đơn đối với các trường hợp cụ thể khác.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 16. Bán hàng hóa, dịch vụ không phải lập hóa đơn \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Bán hàng hóa, dịch vụ có tổng giá thanh toán dưới 200.000 đồng mỗi lần thì không phải lập hóa đơn, trừ trường hợp người mua yêu cầu nhận hóa đơn.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Hàng hóa, dịch vụ bán không phải lập hóa đơn quy định tại khoản 1 Điều này được theo dõi trên bảng kê.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Cuối mỗi ngày, cơ sở kinh doanh lập một hóa đơn ghi số tiền bán hàng hóa, dịch vụ trong ngày thể hiện trên dòng cộng của bảng kê, ký tên và giữ liên giao cho người mua tại cuống, các liên khác luân chuyển theo quy định. Tên người mua trong hóa đơn này được ghi là “bán lẻ không giao hóa đơn”.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 17. Xử lý thu hồi hóa đơn đã lập\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Trường hợp lập hóa đơn chưa giao cho người mua, nếu phát hiện hóa đơn lập sai, người bán gạch chéo các liên và lưu giữ số hóa đơn lập sai.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Trường hợp hóa đơn đã lập được giao cho người mua nếu phát hiện lập sai, hoặc theo yêu cầu của một bên, hàng hóa, dịch vụ đã mua bị trả lại hoặc bị đòi lại, hai bên lập biên bản thu hồi các liên của số hóa đơn lập sai, hoặc hóa đơn của hàng hóa, dịch vụ bị trả lại, bị đòi lại và lưu giữ hóa đơn tại người bán.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eBiên bản thu hồi hóa đơn phải thể hiện được nội dung lập sai hoặc lý do đòi lại, trả lại hàng hóa, dịch vụ và các thỏa thuận bồi thường giữa hai bên (nếu có).\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 18. Xử lý hóa đơn trong các trường hợp không tiếp tục sử dụng \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Tổ chức, cá nhân được cơ quan thuế chấp thuận ngưng sử dụng mã số thuế phải dừng việc sử dụng các loại hóa đơn đã thông báo phát hành còn chưa sử dụng.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Tổ chức, cá nhân phát hành loại hóa đơn thay thế phải dừng sử dụng các số hóa đơn bị thay thế còn chưa sử dụng.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Cơ quan thuế quản lý trực tiếp có thông báo việc hết giá trị sử dụng của các hóa đơn chưa lập mà tổ chức, cá nhân kinh doanh bỏ trốn hoặc tự ý ngừng kinh doanh đang sử dụng.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 19. Ủy nhiệm lập hóa đơn \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Tổ chức, cá nhân có ủy nhiệm bán hàng hóa, dịch vụ cho tổ chức, cá nhân khác, được ủy nhiệm việc lập hóa đơn cho tổ chức, cá nhân nhận ủy nhiệm khi bán hàng hóa, dịch vụ.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Việc ủy nhiệm lập hóa đơn cho người mua hoặc bên thứ ba thực hiện theo quy định của Bộ Tài chính.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Việc ủy nhiệm lập hóa đơn phải được thể hiện bằng văn bản giữa người ủy nhiệm và người nhận ủy nhiệm.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4. Tổ chức, cá nhân ủy nhiệm lập hóa đơn chịu trách nhiệm về việc tạo, phát hành và sử dụng hóa đơn theo quy định tại Nghị định này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 20. Việc sử dụng hóa đơn của người mua hàng\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Người mua được sử dụng hóa đơn hợp pháp theo quy định pháp luật để chứng minh quyền sử dụng, quyền sở hữu hàng hóa, dịch vụ; hưởng chế độ khuyến mãi, chế độ hậu mãi, xổ số hoặc được bồi thường thiệt hại theo quy định của pháp luật; được dùng để hạch toán kế toán hoạt động mua hàng hóa, dịch vụ theo quy định của pháp luật về kế toán; kê khai các loại thuế; đăng ký quyền sử dụng, quyền sở hữu và để kê khai thanh toán vốn ngân sách nhà nước theo các quy định của pháp luật. Hóa đơn dùng cho mục đích này phải là hóa đơn có thông tin xác định được người mua, trừ một số trường hợp theo quy định của Bộ Tài chính.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Liên giao cho người mua hàng đã lập sử dụng cho các mục đích nêu tại khoản 1 Điều này được lưu giữ theo quy định tại Điều 26 Nghị định này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eChương IV\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eQUYỀN VÀ NGHĨA VỤ CỦA CÁC TỔ CHỨC, CÁ NHÂN TRONG QUẢN LÝ, SỬ DỤNG HÓA ĐƠN\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 21. Quyền và nghĩa vụ của tổ chức, cá nhân bán hàng hóa, dịch vụ \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Tổ chức, cá nhân bán hàng hóa, dịch vụ có quyền:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ea) Tạo hóa đơn để sử dụng nếu đáp ứng đủ các điều kiện theo quy định tại Nghị định này;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eb) Được mua hóa đơn do Cục Thuế phát hành;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ec) Sử dụng hóa đơn hợp pháp để phục vụ cho các hoạt động kinh doanh;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ed) Từ chối cung cấp các số liệu về in, phát hành, sử dụng hóa đơn cho các tổ chức, cá nhân không có thẩm quyền theo quy định của pháp luật;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eđ) Khiếu kiện các tổ chức, cá nhân có hành vi xâm phạm các quyền tạo, phát hành và sử dụng hóa đơn hợp pháp.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Tổ chức, cá nhân bán hàng hóa, dịch vụ có nghĩa vụ:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ea) Quản lý các hoạt động tạo hóa đơn theo quy định tại Nghị định này;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eb) Ký hợp đồng đặt in hóa đơn với các cơ sở in có đủ điều kiện trong trường hợp đặt in hóa đơn;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ec) Lập và gửi tờ Thông báo phát hành hóa đơn theo quy định;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ed) Lập và giao hóa đơn khi bán hàng hóa, dịch vụ cho khách hàng. Trừ trường hợp không phải lập hóa đơn theo quy định tại Điều 16 Nghị định này;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eđ) Thường xuyên tự kiểm tra việc sử dụng hóa đơn, kịp thời ngăn ngừa các biểu hiện vi phạm;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ee) Báo cáo việc sử dụng hóa đơn cho cơ quan thuế quản lý trực tiếp theo quy định của Bộ Tài chính.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 22. Điều kiện và trách nhiệm của tổ chức nhận in hóa đơn \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Điều kiện:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eTổ chức nhận in hóa đơn phải là doanh nghiệp có Giấy phép hoạt động ngành in.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Trách nhiệm:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ea) In hóa đơn theo đúng hợp đồng đã ký; không được giao lại toàn bộ hoặc bất kỳ khâu nào trong quá trình in hóa đơn cho tổ chức in khác thực hiện;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eb) Quản lý, bảo quản và xử lý khuôn in, phôi in, hóa đơn đã in và các hóa đơn in hỏng theo thỏa thuận giữa hai bên và theo quy định của pháp luật;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ec) Thanh lý hợp đồng in với tổ chức, cá nhân đặt in hóa đơn và tiến hành xử lý khuôn in, phế phẩm theo quy định của Bộ Tài chính;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ed) Định kỳ 6 tháng, báo cáo việc nhận in hóa đơn gửi cơ quan thuế trực tiếp quản lý.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 23. Trách nhiệm của cơ quan thuế trong quản lý hóa đơn \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Tổng cục Thuế có trách nhiệm:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ea) Thanh tra, kiểm tra hoạt động tạo, phát hành và sử dụng hóa đơn trong phạm vi cả nước;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eb) Thông báo rộng rãi các loại hóa đơn đã được phát hành, được báo mất, không còn giá trị sử dụng.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Cục Thuế địa phương có trách nhiệm:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ea) Quản lý hoạt động tạo, phát hành hóa đơn của các tổ chức, cá nhân trên địa bàn;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eb) Quản lý hoạt động in hóa đơn của các doanh nghiệp in trên địa bàn;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ec) Đặt in, phát hành các loại hóa đơn để cấp, bán cho các đối tượng theo quy định tại Nghị định này;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ed) Thanh tra, kiểm tra hoạt động tạo, phát hành và sử dụng hóa đơn trên địa bàn.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Chi cục Thuế địa phương có trách nhiệm:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ea) Kiểm tra việc sử dụng hóa đơn bán hàng hóa, dịch vụ trong phạm vi được phân cấp quản lý thuế;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eb) Theo dõi, kiểm tra hoạt động hủy hóa đơn theo quy định của Bộ Tài chính trong phạm vi được phân cấp quản lý thuế.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 24. Trách nhiệm của người mua hàng hóa, dịch vụ \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Yêu cầu người bán lập và giao hóa đơn khi mua hàng hóa, dịch vụ.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Cung cấp chính xác thông tin cần thiết để người bán lập hóa đơn.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Ký các liên hóa đơn đã ghi đầy đủ nội dung trong trường hợp mua hàng trực tiếp; trừ một số trường hợp theo quy định của Bộ Tài chính.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4. Sử dụng hóa đơn đúng mục đích.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e5. Cung cấp thông tin ghi trên hóa đơn cho các cơ quan có thẩm quyền khi được yêu cầu.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 25. Xử lý mất, cháy, hỏng hóa đơn trong đơn vị kế toán\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Tổ chức, cá nhân kinh doanh có hóa đơn bị mất, cháy, hỏng thì phải lập biên bản về việc mất, cháy, hỏng hóa đơn.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Sau khi lập biên bản tổ chức, cá nhân có hóa đơn bị mất, cháy, hỏng phải có đơn khai báo với cơ quan thuế quản lý trực tiếp. Thời hạn khai báo là ngày sau ngày biên bản được lập xong, nhưng chậm nhất không quá 05 (năm) ngày, kể từ ngày xảy ra việc mất, cháy, hỏng hóa đơn.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eBộ Tài chính quy định cụ thể việc xử lý hóa đơn sau mất, cháy, hỏng và trình tự, thủ tục khai báo mất, cháy, hỏng hóa đơn.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 26. Lưu trữ, bảo quản hóa đơn \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Hóa đơn điện tử, hóa đơn tự in chưa lập được lưu trữ trong hệ thống máy tính theo chế độ bảo mật thông tin.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Hóa đơn đặt in chưa lập được lưu trữ, bảo quản trong kho theo chế độ lưu trữ bảo quản chứng từ có giá.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Hóa đơn đã lập trong các đơn vị kế toán được lưu trữ theo quy định lưu trữ, bảo quản chứng từ kế toán.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4. Hóa đơn đã lập trong các tổ chức, cá nhân không phải là đơn vị kế toán được lưu trữ và bảo quản như tài sản riêng của tổ chức, cá nhân đó.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 27. Hủy hóa đơn \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Hóa đơn đặt in bị in sai, in trùng, in thừa phải được hủy chậm nhất trong thời hạn 30 (ba mươi) ngày, kể từ ngày thanh lý hợp đồng đặt in hóa đơn.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Tổ chức, cá nhân có hóa đơn hết giá trị sử dụng phải thực hiện hủy hóa đơn. Thời hạn hủy hóa đơn chậm nhất là 30 (ba mươi) ngày, kể từ ngày dừng sử dụng hóa đơn, ngày thông báo tìm lại được hóa đơn đã mất hoặc ngày thông báo hết giá trị sử dụng hóa đơn.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Tổ chức, cá nhân có các loại hóa đơn tự in, hóa đơn điện tử đã thông báo phát hành, nhưng không tiếp tục sử dụng nữa thì phải hủy hóa đơn chậm nhất trong thời hạn 30 (ba mươi) ngày, kể từ ngày không còn sử dụng.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4. Tổ chức, cá nhân mua hóa đơn của cơ quan thuế khi chuyển sang sử dụng các loại hóa đơn khác phải quyết toán và hủy số hóa đơn đã mua còn chưa sử dụng chậm nhất trong thời hạn 30 (ba mươi) ngày, kể từ ngày sử dụng hình thức hóa đơn mới.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e5. Các loại hóa đơn chưa lập nhưng là vật chứng của các vụ án thì không hủy mà được xử lý theo quy định của pháp luật.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e6. Các loại hóa đơn đã lập của các đơn vị kế toán được hủy theo quy định của pháp luật về kế toán.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eViệc hủy hóa đơn phải được thông qua Hội đồng hủy hóa đơn. Thành phần Hội đồng và thủ tục hủy hóa đơn do Bộ Tài chính quy định.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eChương V\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eXỬ PHẠT VI PHẠM HÀNH CHÍNH VỀ HÓA ĐƠN\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 28. Xử phạt các hành vi vi phạm quy định về tự in hóa đơn và khởi tạo hóa đơn điện tử\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Phạt tiền từ 1.000.000 đồng đến 5.000.000 đồng đối với hành vi tự in hóa đơn, khởi tạo hóa đơn điện tử không đủ các nội dung quy định tại khoản 3 Điều 4 Nghị định này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Phạt tiền từ 2.000.000 đồng đến 10.000.000 đồng đối với hành vi tự in hóa đơn hoặc khởi tạo hóa đơn điện tử khi không đủ các điều kiện quy định trong Nghị định này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Phạt tiền từ 20.000.000 đồng đến 100.000.000 đồng đối với hành vi tự in hóa đơn giả, hoặc khởi tạo hóa đơn điện tử giả, đồng thời bị phạt đình chỉ quyền tự in hóa đơn và quyền khởi tạo hóa đơn điện tử trong thời hạn 36 tháng (ba mươi sáu) tháng, kể từ khi hành vi bị phát hiện.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eNgoài việc bị phạt tiền, tổ chức, cá nhân vi phạm quy định tại Điều này phải hủy các hóa đơn được in hoặc khởi tạo không đúng quy định.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 29. Xử phạt các hành vi vi phạm quy định về đặt in hóa đơn \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Phạt tiền từ 1.000.000 đồng đến 5.000.000 đồng đối với hành vi đặt in hóa đơn mà không ký hợp đồng in bằng văn bản.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Phạt tiền từ 2.000.000 đồng đến 10.000.000 đồng đối với các hành vi:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ea) Không thanh lý hợp đồng in khi đã lập tờ Thông báo phát hành hóa đơn;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eb) Không hủy hóa đơn đặt in chưa phát hành nhưng không còn sử dụng theo quy định tại Điều 27 Nghị định này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Phạt tiền từ 3.000.000 đồng đến 15.000.000 đồng đối với hành vi ký hợp đồng in với cơ sở không đủ điều kiện được in hóa đơn theo quy định tại Điều 22 Nghị định này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4. Phạt tiền từ 4.000.000 đồng đến 20.000.000 đồng đối với hành vi không khai báo đúng quy định về việc mất hóa đơn trước khi thông báo phát hành.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e5. Phạt tiền từ 10.000.000 đồng đến 50.000.000 đồng đối với hành vi cho, bán hóa đơn đặt in chưa phát hành cho tổ chức, cá nhân khác sử dụng.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e6. Phạt tiền từ 20.000.000 đồng đến 100.000.000 đồng đối với hành vi đặt in hóa đơn giả, đồng thời bị chỉ định nhà in khi đặt in hóa đơn trong thời hạn 36 (ba mươi sáu) tháng, kể từ khi phát hiện hành vi đặt in hóa đơn giả.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eNgoài việc bị phạt tiền, tổ chức, cá nhân vi phạm quy định tại các khoản 3, 5, 6 Điều này phải hủy các hóa đơn đặt in không đúng quy định.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 30. Xử phạt các hành vi vi phạm quy định về in hóa đơn đặt in \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Phạt tiền từ 1.000.000 đồng đến 5.000.000 đồng đối với hành vi vi phạm chế độ báo cáo việc in hóa đơn theo quy định của Bộ Tài chính.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Phạt tiền từ 2.000.000 đồng đến 10.000.000 đồng đối với các hành vi:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ea) Không thanh lý hợp đồng in khi bên đặt in đã hoàn thành thủ tục thông báo phát hành;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eb) Không hủy các sản phẩm in hỏng, in thừa khi tiến hành thanh lý hợp đồng in.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Phạt tiền từ 4.000.000 đồng đến 20.000.000 đồng đối với các hành vi:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ea) In hóa đơn khi không đủ điều kiện quy định tại Điều 22 Nghị định này;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eb) Không khai báo việc làm mất hóa đơn trong khi in, trước khi giao cho khách hàng.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4. Phạt tiền từ 5.000.000 đồng đến 25.000.000 đồng đối với hành vi chuyển nhượng toàn bộ hoặc một khâu bất kỳ trong hợp đồng in hóa đơn cho cơ sở in khác.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e5. Phạt tiền từ 10.000.000 đồng đến 50.000.000 đồng đối với hành vi cho, bán hóa đơn đặt in của khách hàng này cho khách hàng khác.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e6. Phạt tiền từ 20.000.000 đồng đến 100.000.000 đồng đối với hành vi in hóa đơn giả, đồng thời bị đình chỉ in hóa đơn trong thời hạn 36 (ba mươi sáu) tháng, kể từ khi hành vi bị phát hiện.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eNgoài việc bị phạt tiền, tổ chức, cá nhân vi phạm các khoản 5, 6 Điều này phải hủy các hóa đơn cho, bán hoặc hóa đơn giả.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 31. Xử phạt các hành vi vi phạm quy định về mua hóa đơn \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Phạt tiền từ 1.000.000 đồng đến 5.000.000 đồng với hành vi khai không đúng điều kiện để được mua hóa đơn do cơ quan thuế phát hành.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Phạt tiền từ 2.000.000 đồng đến 10.000.000 đồng đối với hành vi không hủy hóa đơn được mua đã hết hạn sử dụng.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Phạt tiền từ 6.000.000 đồng đến 30.000.000 đồng đối với hành vi không khai báo việc làm mất hóa đơn đã mua.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4. Phạt tiền từ 10.000.000 đồng đến 50.000.000 đồng đối với hành vi cho, bán hóa đơn đã mua và chưa lập.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eNgoài việc bị phạt tiền, tổ chức, cá nhân vi phạm các khoản 2, 4 Điều này phải hủy các loại hóa đơn được mua đã hết hạn sử dụng; hóa đơn đã mua và chưa lập.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 32. Xử phạt các hành vi vi phạm quy định về phát hành hóa đơn \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Phạt tiền từ 1.000.000 đồng đến 5.000.000 đồng đối với các hành vi:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ea) Lập Tờ thông báo phát hành không đầy đủ nội dung;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eb) Không gửi, không niêm yết Tờ thông báo phát hành hóa đơn theo đúng quy định.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Phạt tiền từ 4.000.000 đồng đến 20.000.000 đồng đối với hành vi không lập Tờ thông báo phát hành hóa đơn sau khi hóa đơn đã được sử dụng.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eNgoài việc bị phạt tiền, tổ chức, cá nhân vi phạm quy định tại Điều này còn phải thực hiện các thủ tục phát hành hóa đơn theo quy định tại Nghị định này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 33. Xử phạt các hành vi vi phạm quy định về sử dụng hóa đơn khi bán hàng hóa, dịch vụ \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Phạt tiền từ 200.000 đồng đến 1.000.000 đồng đối với hành vi không ghi đủ các nội dung in sẵn khi lập hóa đơn, hoặc ghi không đúng theo quy định tại Điều 15 Nghị định này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Phạt tiền từ 1.000.000 đồng đến 5.000.000 đồng đối với các hành vi:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ea) Lập hóa đơn nhưng không giao cho người mua;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eb) Không lập bảng kê hoặc không lập hóa đơn tổng hợp theo quy định tại khoản 1, khoản 2 Điều 16 Nghị định này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Phạt tiền từ 2.000.000 đồng đến 10.000.000 đồng với các hành vi:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ea) Không hủy các hóa đơn đã phát hành nhưng chưa lập, không còn giá trị sử dụng theo quy định tại Nghị định này;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eb) Không nộp báo cáo hóa đơn đã sử dụng theo quy định.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4. Phạt tiền từ 3.000.000 đồng đến 15.000.000 đồng đối với hành vi lập hóa đơn không theo thứ tự từ số nhỏ đến số lớn theo quy định.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e5. Phạt tiền từ 5.000.000 đồng đến 20.000.000 đồng đối với hành vi không lập hóa đơn khi bán hàng hóa, dịch vụ có giá trị thanh toán trên 200.000 đồng cho người mua theo quy định tại Nghị định này. Cùng với việc bị xử phạt, tổ chức, cá nhân kinh doanh phải lập hóa đơn giao cho người mua.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e6. Phạt tiền từ 5.000.000 đồng đến 25.000.000 đồng đối với các hành vi:\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003ea) Lập hóa đơn có sai lệch nội dung giữa các liên;\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eb) Không báo cáo việc mất hóa đơn đã phát hành nhưng chưa lập, hoặc hóa đơn đã lập nhưng chưa giao cho khách hàng.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e7. Phạt tiền từ 12.000.000 đồng đến 60.000.000 đồng đối với hành vi lập hóa đơn bất hợp pháp.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e8. Phạt tiền từ 15.000.000 đồng đến 75.000.000 đồng đối với hành vi cho, bán hóa đơn đã phát hành nhưng chưa lập.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e9. Phạt tiền từ 20.000.000 đồng đến 100.000.000 đồng đối với hành vi lập hóa đơn khống.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eNgoài việc phạt tiền, tổ chức, cá nhân vi phạm quy định tại điểm a khoản 3 Điều này còn phải hủy hóa đơn đã phát hành nhưng chưa lập, không còn giá trị sử dụng.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 34. Xử phạt các hành vi vi phạm quy định về sử dụng hóa đơn của người mua\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Phạt tiền từ 1.000.000 đồng đến 5.000.000 đồng đối với hành vi làm mất hóa đơn đã lập (liên giao cho người mua) để hạch toán kế toán, kê khai thuế và thanh toán vốn ngân sách.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Phạt tiền từ 10.000.000 đồng đến 50.000.000 đồng đối với hành vi sử dụng hóa đơn bất hợp pháp, trừ trường hợp quy định tại khoản 3 Điều này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Phạt tiền từ 20.000.000 đồng đến 100.000.000 đồng đối với hành vi sử dụng hóa đơn lập khống.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 35. Nguyên tắc, thủ tục xử lý vi phạm, các tình tiết giảm nhẹ, tình tiết tăng nặng, cưỡng chế và thời hạn thi hành quyết định xử phạt \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Nguyên tắc xử lý vi phạm, thủ tục xử phạt, các tình tiết giảm nhẹ, các tình tiết tăng nặng, thời hiệu xử phạt đối với hành vi vi phạm hành chính về hóa đơn quy định tại Nghị định này thực hiện theo quy định tại Pháp lệnh Xử lý vi phạm hành chính.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Khi phạt tiền, mức phạt tiền cụ thể đối với một hành vi vi phạm không có tình tiết tăng nặng hoặc giảm nhẹ là mức trung bình của khung tiền phạt được quy định đối với hành vi đó. Mức trung bình của khung tiền phạt được xác định bằng cách chia đôi tổng số của mức tối thiểu cộng mức tối đa. Trường hợp có một tình tiết tăng nặng hoặc giảm nhẹ sẽ áp dụng mức trung bình tăng thêm hoặc mức trung bình giảm bớt. Mức trung bình tăng thêm hoặc mức trung bình giảm bớt được xác định bằng cách chia đôi tổng số của mức tối thiểu và mức trung bình hoặc chia đôi tổng số giữa mức tối đa và mức trung bình. Có trên một tình tiết tăng nặng hoặc giảm nhẹ sẽ áp dụng mức tối đa hoặc tối thiểu. Trường hợp vừa có tình tiết tăng nặng và tình tiết giảm nhẹ thì được bù trừ để áp dụng khung phạt theo nguyên tắc một tình tiết tăng nặng trừ cho một tình tiết giảm nhẹ.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Tổ chức, cá nhân bị xử phạt vi phạm theo Nghị định này phải thi hành quyết định xử phạt trong thời hạn mười ngày, kể từ ngày cơ quan có thẩm quyền giao quyết định xử phạt. Tổ chức, cá nhân bị xử phạt vi phạm hành chính mà không tự nguyện chấp hành quyết định xử phạt thì bị cưỡng chế thi hành theo quy định tại Pháp lệnh Xử lý vi phạm hành chính.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 36. Thanh tra, kiểm tra \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Cơ quan quản lý thuế các cấp, cơ quan thanh tra chuyên ngành tài chính được quyền thanh tra, kiểm tra các tổ chức, cá nhân trong việc chấp hành các quy định tại Nghị định này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Việc thanh tra, kiểm tra về hóa đơn được thực hiện theo quy định của Bộ Tài chính.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 37. Thẩm quyền xử phạt vi phạm hành chính về hóa đơn \u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e1. Thẩm quyền xử phạt vi phạm hành chính về hóa đơn được thực hiện theo quy định tại các Điều 29, 30, 36 và 38 Pháp lệnh Xử lý vi phạm hành chính.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e2. Trường hợp vi phạm các quy định tại các Điều 28, 29, 30, 31, 32, 33 và 34 mà dẫn đến hành vi khai sai làm thiếu số tiền thuế phải nộp hoặc tăng số tiền thuế được hoàn hoặc dẫn đến hành vi trốn thuế, gian lận thuế thì xử phạt các hành vi đó theo quy định tại Luật Quản lý thuế.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e3. Trường hợp vi phạm có liên quan đến hoạt động in hóa đơn giả đến mức truy cứu trách nhiệm hình sự thì chuyển hồ sơ đến cơ quan có thẩm quyền để khởi tố theo quy định của pháp luật.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e4. Cơ quan tiến hành tố tụng có trách nhiệm thông báo kết quả xử lý các hành vi vi phạm về hóa đơn cho cơ quan đã đề nghị truy cứu trách nhiệm hình sự.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003e5. Đối với trường hợp đã ra quyết định xử phạt, nếu sau đó phát hiện hành vi vi phạm có dấu hiệu tội phạm mà chưa hết thời hiệu truy cứu trách nhiệm hình sự thì người đã ra quyết định xử phạt phải hủy quyết định đó và trong thời hạn ba ngày, kể từ ngày hủy quyết định xử phạt, phải chuyển hồ sơ vụ vi phạm cho cơ quan tiến hành tố tụng hình sự có thẩm quyền.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eChương VI\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv align=\"center\" style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐIỀU KHOẢN THI HÀNH\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 38. Hiệu lực thi hành\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eNghị định này có hiệu lực thi hành kể từ ngày 01 tháng 01 năm 2011 và thay thế Nghị định số 89/2002/NĐ-CP ngày 07 tháng 11 năm 2002 của Chính phủ quy định về việc in, phát hành, sử dụng, quản lý hóa đơn.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 39. Hướng dẫn thi hành\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eBộ Tài chính hướng dẫn thi hành Nghị định này và phối hợp với các cơ quan nhà nước, tổ chức chính trị, tổ chức chính trị - xã hội, tổ chức xã hội, tổ chức xã hội – nghề nghiệp tuyên truyền, giáo dục và vận động nhân dân thực hiện, giám sát việc thực hiện Nghị định này.\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cb\u003e\u003cspan style=\"font-size:10pt;\"\u003eĐiều 40. Trách nhiệm thi hành\u003c/span\u003e\u003c/b\u003e\n\u003c/div\u003e\n\u003cdiv style=\"margin:6pt 0cm;\"\u003e\n \u003cspan style=\"font-size:10pt;\"\u003eCác Bộ trưởng, Thủ trưởng cơ quan ngang Bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân các tỉnh, thành phố trực thuộc Trung ương chịu trách nhiệm thi hành Nghị định này./.\u003c/span\u003e\n\u003c/div\u003e\n\u003c/body\u003e\n\u003c/html\u003e"])</script><script>self.__next_f.push([1,"d:[[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"Legislation\\\",\\\"name\\\":\\\"Nghị định số 51/2010/NĐ-CP Quy định về hóa đơn bán hàng hóa, cung ứng dịch vụ\\\",\\\"legislationIdentifier\\\":\\\"51/2010/NĐ-CP\\\",\\\"legislationType\\\":\\\"Nghị định\\\",\\\"legislationDate\\\":\\\"2010-05-14T00:00:00\\\",\\\"legislationLegalForce\\\":\\\"

\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"text-align:center;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eM\u003c/span\u003e\u003c/b\u003e\u003cb\u003e\u003cspan lang=\"EN-US\" style=\"font-family:Arial;font-size:10pt;\"\u003eục\u003c/span\u003e\u003c/b\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e 2\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"text-align:center;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eTHU NHẬP TỪ CHUYỂN NHƯỢNG VỐN\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 15. Thu nhập tính thuế từ chuyển nhượng phần vốn góp\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Thu nhập tính thuế từ chuyển nhượng phần vốn góp được xác định bằng giá chuyển nhượng trừ (-) giá mua của phần vốn góp và các chi phí hợp lý liên quan đến việc tạo ra thu nhập từ chuyển nhượng vốn.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Giá chuyển nhượng là số tiền mà cá nhân nhận được theo hợp đồng chuyển nhượng vốn.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e3. Giá mua phần vốn góp được xác định là trị giá phần vốn tính tại thời điểm góp vốn hoặc là giá trị phần vốn tại thời điểm mua.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e4. Chi phí hợp lý liên quan đến việc tạo ra thu nhập từ chuyển nhượng vốn là các khoản chi phí thực tế phát sinh có chứng từ, hóa đơn hợp pháp, bao gồm:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Chi phí làm các thủ tục pháp lý cần thiết cho việc chuyển nhượng;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Các khoản phí và lệ phí người chuyển nhượng nộp ngân sách nhà nước theo quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ec. Các khoản chi phí khác.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 16. Thu nhập tính thuế từ chuyển nhượng chứng khoán\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Thu nhập tính thuế từ chuyển nhượng chứng khoán, bao gồm cả chuyển nhượng quyền mua cổ phiếu được xác định bằng giá bán chứng khoán trừ (-) giá mua, các chi phí liên quan đến việc chuyển nhượng.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Giá bán chứng khoán được xác định như sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Giá bán chứng khoán niêm yết là giá chuyển nhượng thực tế tại Sở Giao dịch chứng khoán, Trung tâm Giao dịch chứng khoán;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Giá bán chứng khoán của công ty đại chúng chưa niêm yết, đã thực hiện đăng ký giao dịch tại Trung tâm Giao dịch chứng khoán là giá chuyển nhượng thực tế tại Trung tâm Giao dịch chứng khoán;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ec. Giá bán chứng khoán của các đơn vị không thuộc trường hợp nêu tại điểm a và b khoản này là giá ghi trên hợp đồng chuyển nhượng hoặc giá theo sổ sách kế toán của đơn vị có chứng khoán được chuyển nhượng tại thời điểm bán;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e3. Giá mua được xác định như sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Giá mua của chứng khoán niêm yết là giá thực mua tại Sở Giao dịch chứng khoán, Trung tâm Giao dịch chứng khoán;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Giá mua chứng khoán của Công ty đại chúng chưa niêm yết, đã thực hiện đăng ký giao dịch tại Trung tâm Giao dịch chứng khoán là giá thực tế mua tại Trung tâm Giao dịch chứng khoán;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ec. Giá mua chứng khoán của các đơn vị không thuộc trường hợp quy định tại các điểm a và b khoản này là giá ghi trên hợp đồng chuyển nhượng hoặc giá theo sổ sách kế toán của đơn vị có chứng khoán được chuyển nhượng tại thời điểm mua.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e4. Chi phí liên quan đến việc chuyển nhượng chứng khoán là các khoản chi phí thực tế phát sinh có chứng từ, hóa đơn hợp pháp, bao gồm:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Phí nhận chuyển nhượng và phí chuyển nhượng chứng khoán;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Phí lưu ký chứng khoán;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ec. Chi phí ủy thác chứng khoán;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ed. Các khoản chi phí khác.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 17. Thuế suất\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Thuế suất đối với thu nhập từ chuyển nhượng vốn góp là 20% trên thu nhập tính thuế của mỗi lần chuyển nhượng.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Thuế suất đối với thu nhập từ chuyển nhượng chứng khoán là 20% trên thu nhập tính thuế cả năm chỉ áp dụng đối với trường hợp đối tượng nộp thuế đã thực hiện đúng quy định của pháp luật về kế toán, hóa đơn, chứng từ, xác định được thu nhập tính thuế quy định tại Điều 16 Nghị định này và đăng ký thực hiện ổn định với cơ quan Thuế từ tháng 12 của năm trước.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐối với các trường hợp khác ngoài trường hợp trên, áp dụng thuế suất 0,1% trên giá chuyển nhượng chứng khoán từng lần.\u003c/span\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"text-align:center;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eMục 3\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"text-align:center;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eTHU NHẬP TỪ CHUYỂN NHƯỢNG BẤT ĐỘNG SẢN\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 18. Thu nhập tính thuế từ chuyển nhượng quyền sử dụng đất\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Thu nhập tính thuế được xác định bằng giá chuyển nhượng quyền sử dụng đất trừ (-) giá vốn và các chi phí hợp lý liên quan.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Giá chuyển nhượng quyền sử dụng đất được xác định như sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Giá chuyển nhượng là giá thực tế ghi trên hợp đồng chuyển nhượng tại thời điểm chuyển nhượng;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Trường hợp không xác định được giá thực tế hoặc giá ghi trên hợp đồng chuyển nhượng thấp hợp giá đất do Ủy ban nhân dân cấp tỉnh quy định tại thời điểm chuyển nhượng thì giá chuyển nhượng được xác định căn cứ theo Bảng giá đất do Ủy ban nhân dân cấp tỉnh quy định.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e3. Giá vốn chuyển nhượng quyền sử dụng đất trong một số trường hợp cụ thể được xác định như sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Đối với đất có nguồn gốc nhà nước giao có thu tiền sử dụng đất, thu tiền cho thuê đất thì căn cứ vào chứng từ thu tiền sử dụng đất, thu tiền cho thuê đất của Nhà nước;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Đối với đất nhận quyền sử dụng từ các tổ chức, cá nhân thì căn cứ vào hợp đồng và chứng từ hợp pháp trả tiền khi nhận quyền sử dụng đất, quyền thuê đất (khi mua);\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ec. Đối với trường hợp đấu giá quyền sử dụng đất là giá trúng đấu giá.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e4. Chi phí hợp lý liên quan đến việc chuyển nhượng quyền sử dụng đất là các khoản chi phí thực tế phát sinh và có chứng từ, hóa đơn hợp pháp, bao gồm:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Các loại phí, lệ phí theo quy định của pháp luật liên quan đến cấp quyền sử dụng đất;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Chi phí cải tạo đất, san lấp mặt bằng (nếu có);\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ec. Các chi phí khác liên quan trực tiếp đến việc chuyển nhượng quyền sử dụng đất.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 19. Thu nhập tính thuế từ chuyển nhượng quyền sử dụng đất gắn với công trình xây dựng trên đất\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Thu nhập tính thuế được xác định bằng giá chuyển nhượng trừ (-) giá vốn và các chi phí hợp lý liên quan.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Giá chuyển nhượng được xác định cụ thể như sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Giá chuyển nhượng là giá thực tế ghi trên hợp đồng chuyển nhượng tại thời điểm chuyển nhượng;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Trường hợp không xác định được giá thực tế thì giá chuyển nhượng được xác định như sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e- Phần giá trị đất chuyển nhượng được xác định căn cứ theo Bảng giá đất do Ủy ban nhân dân cấp tỉnh quy định tại thời điểm chuyển nhượng;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e- Phần giá trị nhà, kết cấu hạ tầng và công trình kiến trúc gắn liền với đất được xác định căn cứ vào quy định của Bộ Xây dựng về phân loại nhà; tiêu chuẩn, định mức xây dựng cơ bản; giá trị còn lại thực tế của công trình trên đất.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e3. Giá vốn được xác định căn cứ vào giá ghi trên hợp đồng chuyển nhượng tại thời điểm mua.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e4. Chi phí hợp lý liên quan là các khoản chi phí thực tế phát sinh và có chứng từ, hóa đơn hợp pháp, bao gồm:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Các loại phí, lệ phí theo quy định của pháp luật liên quan đến cấp quyền sử dụng đất;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Chi phí cải tạo đất, san lấp mặt bằng;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ec. Chi phí sửa chữa, cải tạo công trình xây dựng trên đất;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ed. Các chi phí khác liên quan trực tiếp đến việc chuyển nhượng.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 20. Thu nhập tính thuế từ chuyển nhượng quyền sở hữu, sử dụng nhà ở\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Thu nhập tính thuế được xác định bằng giá bán trừ (-) giá mua và các chi phí hợp lý liên quan.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Giá bán là giá thực tế chuyển nhượng, được xác định theo giá thị trường và được ghi trên hợp đồng chuyển nhượng.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e3. Giá mua được xác định căn cứ vào giá ghi trên hợp đồng mua.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e4. Chi phí liên quan là các khoản chi phí thực tế phát sinh và có chứng từ, hóa đơn hợp pháp, bao gồm:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Các loại phí, lệ phí theo quy định của pháp luật liên quan đến cấp quyền sở hữu nhà;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Chi phí sửa chữa, cải tạo, nâng cấp nhà;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ec. Các chi phí khác liên quan trực tiếp đến việc chuyển nhượng nhà ở.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 21. Thu nhập tính thuế từ chuyển nhượng quyền thuê đất, thuê mặt nước\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Thu nhập tính thuế từ chuyển nhượng quyền thuê đất, thuê mặt nước được xác định bằng giá cho thuê lại trừ (-) giá thuê và các chi phí liên quan.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Giá cho thuê lại được xác định căn cứ vào giá thực tế ghi trên hợp đồng\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eTrường hợp đơn giá cho thuê lại trên hợp đồng thấp hơn giá do Ủy ban nhân dân cấp tỉnh quy định tại thời điểm cho thuê lại thì giá cho thuê lại được xác định căn cứ theo bảng giá do Ủy ban nhân dân cấp tỉnh quy định.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e3. Giá thuê được xác định căn cứ vào hợp đồng thuê.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e4. Chi phí liên quan là các khoản chi thực tế phát sinh và có chứng từ, hóa đơn hợp pháp, bao gồm:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Các loại phí, lệ phí theo quy định liên quan đến quyền thuê đất, thuê mặt nước;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Các chi phí cải tạo đất, mặt nước;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ec. Các chi phí khác liên quan trực tiếp đến cho thuê lại.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 22. Thuế suất\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Thuế suất đối với thu nhập từ chuyển nhượng bất động sản là 25% trên thu nhập tính thuế.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Trường hợp không xác định được giá vốn và các chi phí liên quan làm cơ sở xác định thu nhập tính thuế thì áp dụng thuế suất 2% trên giá chuyển nhượng.\u003c/span\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"text-align:center;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eMục 4\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"text-align:center;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eTHU NHẬP TỪ NHẬN THỪA KẾ, QUÀ TẶNG\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 23. Thu nhập tính thuế từ nhận thừa kế, quà tặng\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Thu nhập tính thuế từ thừa kế, quà tặng là phần giá trị tài sản thừa kế, quà tặng, bao gồm: bất động sản, tài sản khác phải đăng ký quyền sở hữu, quyền sử dụng, kể cả chứng khoán, phần vốn trong các tổ chức kinh tế, cơ sở kinh doanh vượt trên 10 triệu đồng mà đối tượng nộp thuế nhận được theo từng lần phát sinh.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Việc xác định thu nhập tính thuế đối với các loại tài sản nhận thừa kế, quà tặng phải bảo đảm phù hợp với giá thị trường tại thời điểm phát sinh thu nhập, cụ thể như sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Đối với chứng khoán:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e- Đối với chứng khoán đã niêm yết: căn cứ theo giá tham chiếu trên Sở Giao dịch chứng khoán, Trung tâm Giao dịch chứng khoán tại ngày nhận thừa kế, nhận quà tặng hoặc ngày gần nhất trước đó;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e- Đối với chứng khoán của các công ty đại chúng chưa niêm yết, đã thực hiện đăng ký giao dịch tại Trung tâm Giao dịch chứng khoán: căn cứ vào giá tham chiếu tại Trung tâm Giao dịch chứng khoán ở thời điểm nhận thừa kế, nhận quà tặng hoặc ngày gần nhất trước đó.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e- Đối với chứng khoán của các công ty không thuộc các trường hợp trên: căn cứ vào giá trị ghi trên sổ sách kế toán của công ty đó tại ngày nhận thừa kế, nhận quà tặng hoặc ngày gần nhất trước đó.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Đối với phần vốn trong các tổ chức kinh tế, cơ sở kinh doanh: căn cứ vào giá trị phần vốn ghi trên sổ sách của tổ chức kinh tế, cơ sở kinh doanh tại thời điểm nhận thừa kế, nhận quà tặng hoặc ngày gần nhất trước đó.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ec. Đối với bất động sản:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e- Phần giá trị đất được xác định căn cứ theo Bảng giá đất do Ủy ban nhân dân cấp tỉnh quy định tại thời điểm nhận thừa kế, nhận quà tặng;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e- Phần giá trị nhà, kết cấu hạ tầng và công trình kiến trúc gắn liền với đất được xác định theo quy định của Bộ Xây dựng về phân loại nhà, tiêu chuẩn, định mức xây dựng cơ bản; giá trị còn lại thực tế của công trình trên đất.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ed. Đối với tài sản khác: căn cứ vào giá tính lệ phí trước bạ của tài sản đó hoặc tài sản cùng loại (nếu có)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 24. Thời điểm xác định thu nhập tính thuế\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Thời điểm xác định thu nhập tính thuế từ thừa kế là thời điểm đối tượng nộp thuế nhận được thừa kế theo quy định của pháp luật\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Thời điểm xác định thu nhập tính thuế từ quà tặng là thời điểm tổ chức, cá nhân tặng cho đối tượng nộp thuế hoặc thời điểm đối tượng nộp thuế nhận được quà tặng.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 25. Thuế suất\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eThuế suất đối với thu nhập từ thừa kế, quà tặng là 10% trên thu nhập tính thuế.\u003c/span\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"text-align:center;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eChương III\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"text-align:center;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eQUY ĐỊNH VỀ QUẢN LÝ THUẾ THU NHẬP CÁ NHÂN\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 26. Đăng ký thuế, cấp mã số thuế\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Cá nhân có thu nhập chịu thuế thực hiện đăng ký thuế để được cơ quan Thuế cấp mã số thuế.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Tổ chức, cá nhân trả thu nhập chịu thuế thực hiện đăng ký thuế để được cơ quan Thuế cấp mã số thuế. Trường hợp tổ chức, cá nhân trả thu nhập đã được cấp mã số thuế trước ngày Nghị định này có hiệu lực thi hành thì được tiếp tục sử dụng mã số đó.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 27. Khấu trừ thuế\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Khấu trừ thuế là việc tổ chức, cá nhân trả thu nhập thực hiện tính trừ số thuế phải nộp vào thu nhập của đối tượng nộp thuế trước khi chi trả thu nhập\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Các loại thu nhập phải khấu trừ thuế:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Thu nhập của cá nhân không cư trú, bao gồm cả trường hợp không hiện diện tại Việt Nam;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Thu nhập từ tiền lương, tiền công.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ec. Thu nhập từ đầu tư vốn;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ed. Thu nhập từ chuyển nhượng vốn, chuyển nhượng chứng khoán\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eđ. Thu nhập từ trúng thưởng\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ee. Thu nhập từ bản quyền;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eg. Thu nhập từ nhượng quyền thương mại.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e3. Bộ Tài chính quy định cụ thể các trường hợp khấu trừ thuế và cách thức khấu trừ thuế thu nhập cá nhân quy định tại Điều này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 28. Các trường hợp không thực hiện khấu trừ thuế\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Không thực hiện khấu trừ thuế đối với:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Thu nhập từ kinh doanh của cá nhân cư trú;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Thu nhập từ chuyển nhượng bất động sản;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ec. Thu nhập từ chuyển nhượng vốn góp của cá nhân;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ed. Thu nhập từ nhận thừa kế, quà tặng của cá nhân;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Các trường hợp quy định tại khoản 1 Điều này, đối tượng nộp thuế trực tiếp khai thuế, nộp thuế với cơ quan Thuế.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 29. Khai thuế thu nhập cá nhân\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Khai thuế đối với tổ chức, cá nhân trả thu nhập thực hiện khấu trừ thuế quy định tại Điều 27 Nghị định này như sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Khai thuế theo tháng áp dụng đối với thu nhập khấu trừ thuế quy định tại khoản 2 Điều 27 Nghị định này; trường hợp tổng số thuế khấu trừ hàng tháng dưới 5 triệu đồng thì tổ chức, cá nhân chi trả thu nhập thực hiện khai tạm nộp thuế theo quý;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Khai thuế năm:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eTổ chức, cá nhân chi trả thu nhập khai quyết toán thuế năm đối với thu nhập chịu thuế, số thuế đã khấu trừ và các khoản giảm trừ khác (nếu có).\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Khai thuế đối với cá nhân người nộp thuế:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Cá nhân kinh doanh, cá nhân hành nghề độc lập khai thuế theo quý;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Cá nhân khai thuế theo từng lần phát sinh đối với thu nhập từ chuyển nhượng vốn (trừ chuyển nhượng chứng khoán); thu nhập từ chuyển nhượng bất động sản, thu nhập từ thừa kế; thu nhập từ quà tặng;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ec. Cá nhân khai quyết toán thuế năm đối với thu nhập từ tiền lương, tiền công, thu nhập từ kinh doanh đối với trường hợp thực hiện đúng quy định của pháp luật về kế toán, hóa đơn, chứng từ, nộp thuế theo kê khai và thu nhập từ chuyển nhượng chứng khoán đăng ký nộp thuế theo mức thuế suất 20%.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e3. Bộ Tài chính hướng dẫn cụ thể việc khai thuế, quyết toán thuế quy định tại Điều này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 30. Trách nhiệm khấu trừ, khai thuế của người sử dụng lao động khi trả thu nhập từ tiền lương, tiền công cho cá nhân\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eNgười sử dụng lao động có trách nhiệm khấu trừ thuế phải nộp vào tiền lương, tiền công phải trả cho người lao động, thực hiện việc khai thuế và nộp số thuế đã khấu trừ vào ngân sách nhà nước, cụ thể như sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Đối với thu nhập từ tiền lương, tiền công theo hợp đồng lao động, hàng tháng người sử dụng lao động có trách nhiệm khấu trừ thuế của từng người lao động căn cứ vào thu nhập tính thuế tháng, mức tạm tính giảm trừ gia cảnh và biểu thuế luỹ tiến từng phần. Người lao động không phải khai thuế theo tháng.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eHàng tháng, người sử dụng lao động tạm tính giảm trừ gia cảnh theo bản khai đầu năm của đối tượng nộp thuế để tính số thuế phải nộp trong tháng, thực hiện khấu trừ, nộp thuế vào ngân sách nhà nước và không phải chịu trách nhiệm trước pháp luật về việc khai tạm tính giảm trừ gia cảnh này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Đối với các khoản tiền công, tiền chi khác cho cá nhân không ký hợp đồng lao động thì tổ chức, cá nhân chi trả thu nhập tạm khấu trừ thuế theo tỷ lệ 10% số thu nhập đối với cá nhân có mã số thuế. Trường hợp cá nhân không có mã số thuế thì khấu trừ theo tỷ lệ 20%. Cá nhân có thu nhập được tạm khấu trừ quy định tại khoản này không phải khai thuế theo tháng.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eBộ Tài chính quy định cụ thể mức thu nhập làm cơ sở tạm khấu trừ theo tỷ lệ quy định tại khoản này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 31. Khai thuế đối với cá nhân có thu nhập từ kinh doanh\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Cá nhân kinh doanh thực hiện đúng quy định của pháp luật về kế toán, hóa đơn, chứng từ:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Hàng quý thực hiện khai thuế, tạm nộp thuế thu nhập cá nhân theo kết quả kinh doanh tạm tính của quý. Số thuế tạm nộp hàng quý được xác định trên cơ sở thu nhập chịu thuế đã tính giảm trừ gia cảnh cho cá nhân người nộp thuế và những người phụ thuộc mà người nộp thuế nhận trách nhiệm nuôi dưỡng và Biểu thuế luỹ tiến từng phần;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Thực hiện khai quyết toán thuế năm và chịu trách nhiệm trước pháp luật về tính trung thực, chính xác của số liệu đã kê khai.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Việc xác định đối tượng nộp thuế là cá nhân kinh doanh trong một số trường hợp được quy định cụ thể như sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Trường hợp chỉ có một người đứng tên trong đăng ký kinh doanh thì đối tượng nộp thuế được xác định là người đứng tên trong đăng ký kinh doanh;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Trường hợp nhiều người đứng tên trong đăng ký kinh doanh và cùng tham gia kinh doanh thì đối tượng nộp thuế được xác định là từng thành viên cùng đứng tên trong đăng ký kinh doanh;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ec. Trường hợp trong một hộ gia đình có nhiều người cùng tham gia kinh doanh thì đối tượng nộp thuế được xác định là người đứng tên trong đăng ký kinh doanh. Các thành viên khác trong gia đình được xác định là người làm công nếu đủ 15 tuổi trở lên hoặc được xác định là người phụ thuộc nếu dưới 15 tuổi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e3. Bộ Tài chính quy định cụ thể việc khai thuế quy định tại Điều này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 32. Hoàn thuế\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Cá nhân được hoàn thuế trong các trường hợp sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Số tiền thuế đã nộp lớn hơn số thuế phải nộp;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Số tiền giảm trừ gia cảnh quy định tại Điều 12 Nghị định này thực tế lớn hơn số tạm tính giảm trừ;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ec. Các khoản đóng góp từ thiện, nhân đạo quy định tại Điều 13 Nghị định này chưa giảm trừ khi tính thuế.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Bộ Tài chính quy định thủ tục, hồ sơ hoàn thuế quy định tại Điều này.\u003c/span\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"text-align:center;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eChương IV\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"text-align:center;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐIỀU KHOẢN THI HÀNH\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 33. Hiệu lực thi hành\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Nghị định này có hiệu lực thi hành kể từ ngày 01 tháng 01 năm 2009.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Các quy định về quản lý thuế thu nhập cá nhân tại Chương III Nghị định này thay thế quy định về quản lý thuế thu nhập đối với người có thu nhập cao tại Nghị định số 85/2007/NĐ-CP ngày 25 tháng 5 năm 2007 của Chính phủ quy định chi tiết thi hành một số điều của Luật Quản lý thuế.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 34. Tổ chức thực hiện\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Bộ Tài chính hướng dẫn thi hành Nghị định này.\u003cspan style=\"\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Các Bộ trưởng, Thủ trưởng cơ quan ngang Bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân tỉnh, thành phố trực thuộc Trung ương chịu trách nhiệm thi hành Nghị định này./.\u003c/span\u003e\u003c/p\u003e\n\u003c/body\u003e\n\u003c/html\u003e"])</script><script>self.__next_f.push([1,"d:[[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"Legislation\\\",\\\"name\\\":\\\"Nghị định số 100/2008/NĐ-CP Quy định chi tiết một số điều của Luật Thuế thu nhập cá nhân\\\",\\\"legislationIdentifier\\\":\\\"100/2008/NĐ-CP\\\",\\\"legislationType\\\":\\\"Nghị định\\\",\\\"legislationDate\\\":\\\"2008-09-08T00:00:00\\\",\\\"legislationLegalForce\\\":\\\"NotInForce\\\",\\\"legislationPassedBy\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Chính phủ\\\"},\\\"legislationJurisdiction\\\":\\\"VN\\\",\\\"url\\\":\\\"https://vbpl.vn/van-ban/chi-tiet/nghi-dinh-so-100-2008-nd-cp-quy-dinh-chi-tiet-mot-so-dieu-cua-luat-thue-thu-nhap-ca

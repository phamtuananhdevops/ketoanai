nh thức của Cơ quan Công báo Việt Nam\"},\"feedbackSuggestions\":{\"title\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\",\"description\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\"}}},\"footer\":{\"unit\":\"Đơn vị chủ quản\",\"unitContent\":\"Bộ Tư pháp\",\"address\":\"Địa chỉ\",\"addressContent\":\"Số 60 Trần Phú - Ba Đình - Thành phố Hà Nội\",\"phoneNumber\":\"Điện thoại\",\"phoneNumberContent\":\"024.6273.9468\",\"fax\":\"Fax\",\"faxContent\":\"024.6273.9359\"},\"underConstruction\":{\"title\":\"Đang cập nhật\",\"message\":\"Chức năng này đang được phát triển.\"},\"gioiThieu\":{\"timeline\":{\"2005\":{\"description\":\"Năm 2005 đánh dấu sự khởi đầu của dự án xây dựng Cơ sở dữ liệu quốc gia về pháp luật, với mục tiêu số hóa và tập trung hóa các văn bản pháp luật của Việt Nam.\"},\"2012-2013\":{\"description\":\"Giai đoạn 2012-2013 là thời kỳ phát triển và mở rộng hệ thống, với việc tích hợp thêm nhiều tính năng và cải thiện giao diện người dùng.\"},\"2023-2025\":{\"description\":\"Giai đoạn 2023-2025 tập trung vào việc nâng cấp và hiện đại hóa hệ thống, áp dụng các công nghệ mới và mở rộng phạm vi phục vụ.\"}},\"overview\":{\"title\":\"SƠ LƯỢC MÔ HÌNH CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"CSDLQG về pháp luật tập hợp các văn bản quy phạm pháp luật và văn bản hợp nhất văn bản quy phạm pháp luật (sau đây gọi chung là văn bản) dưới dạng văn bản điện tử do Chính phủ thống nhất quản lý, có địa chỉ truy cập vbpl.vn, bao gồm các Cơ sở dữ liệu thành phần: Cơ sở dữ liệu văn bản pháp luật Trung ương và Cơ sở dữ liệu văn bản pháp luật địa phương.\",\"central\":{\"title\":\"Cơ sở dữ liệu Văn bản pháp luật Trung ương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của các Bộ, cơ quan ngang Bộ, cơ quan nhà nước khác ở Trung ương ban hành hoặc phối hợp ban hành. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật; Văn bản hợp nhất; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"local\":{\"title\":\"Cơ sở dữ liệu văn bản pháp luật địa phương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của từng tỉnh, thành phố trực thuộc Trung ương trên toàn quốc. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật của Hội đồng nhân dân và Ủy ban nhân dân; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"other\":{\"title\":\"Các chuyên mục khác\",\"content\":\"Ngoài các Cơ sở dữ liệu thành phần kể trên, CSDLQG về pháp luật còn có các chuyên mục khác như: Giới thiệu văn bản mới, Tin tức, Tình huống pháp luật. Ngoài ra, CSDLQG về thủ tục hành chính, bộ pháp điển điện tử, cổng thông tin điện tử Bộ Tư pháp cũng trích xuất về CSDLQG về pháp luật.\"}},\"vision\":{\"title\":\"Tầm nhìn\",\"content\":\"Trở thành nguồn tra cứu văn bản pháp luật chính thống, đầy đủ và đáng tin cậy, phục vụ hiệu quả cho người dân, doanh nghiệp và cơ quan nhà nước.\"},\"mission\":{\"title\":\"Sứ mệnh\",\"content\":\"Cung cấp hệ thống văn bản pháp luật được cập nhật kịp thời, tra cứu thuận tiện, góp phần nâng cao nhận thức pháp luật và bảo đảm việc tuân thủ pháp luật trong xã hội.\"},\"features\":{\"title\":\"MỘT SỐ TÍNH NĂNG, TIỆN ÍCH CỦA CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"Hiện nay, CSDLQG về PL có giao diện tương đối thân thiện, dễ tìm kiếm, dễ khai thác các thông tin và tải về sử dụng. Cơ sở dữ liệu cung cấp các chức năng, tiện ích cơ bản và thuận tiện\",\"list\":[{\"key\":\"fullText\",\"label\":\"Tra cứu toàn văn\",\"icon\":\"SearchOutlined\"},{\"key\":\"tableOfContents\",\"label\":\"Tự động tạo mục lục\",\"icon\":\"BookOutlined\"},{\"key\":\"relatedDocuments\",\"label\":\"Liên kết văn bản liên quan\",\"icon\":\"LinkOutlined\"},{\"key\":\"validity\",\"label\":\"Xác định hiệu lực tự động\",\"icon\":\"BarChartOutlined\"},{\"key\":\"validityHistory\",\"label\":\"Lịch sử hiệu lực\",\"icon\":\"ClockCircleOutlined\"},{\"key\":\"download\",\"label\":\"Tải văn bản\",\"icon\":\"DownloadOutlined\"},{\"key\":\"english\",\"label\":\"Xem văn bản tiếng Anh\",\"icon\":\"GlobalOutlined\"},{\"key\":\"centralLocal\",\"label\":\"Liên kết văn bản Trung ư d5233eb73.js\",\"3954\",\"static/chunks/3954-946ccf0eafc577be.js\",\"5292\",\"static/chunks/5292-beb20880bf4a7330.js\",\"3207\",\"static/chunks/3207-0792bf349fc6782d.js\",\"7287\",\"static/chunks/7287-1e02014aaec038d7.js\",\"2007\",\"static/chunks/2007-dba949ac429f5003.js\",\"4310\",\"static/chunks/app/%5Blocale%5D/van-ban/%5Bcategory%5D/%5Bid%5D/page-75f20aedc57a9c0c.js\"],\"default\"]\n2b:T18c43,"])</script><script>self.__next_f.push([1,"\u003c!DOCTYPE html\u003e\n\u003chtml\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n    \u003ctitle\u003eDocument Content\u003c/title\u003e\n    \u003cstyle\u003e\n        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }\n        p { margin: 10px 0; }\n    \u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"text-align:center;margin:0cm 0cm 0pt;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eNGHỊ ĐỊNH\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"text-align:center;margin:0cm 0cm 0pt;\"\u003e\u003cb style=\"\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eQuy định chi tiết một số điều của Luật Thuế thu nhập cá nhân\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"text-align:center;margin:0cm 0cm 0pt;\"\u003e\u003cb style=\"\"\u003e\u003cspan lang=\"EN-US\" style=\"font-family:Arial;font-size:10pt;\"\u003e________________________________\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"text-align:center;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eCHÍNH PHỦ\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eCăn cứ Luật Tổ chức Chính phủ ngày 30 tháng 9 năm 1992;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eCăn cứ Luật Thuế thu nhập cá nhân ngày 21 tháng 11 năm 2007;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eCăn cứ Luật Quản lý thuế ngày 29 tháng 11 năm 2006;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eXét đề nghị của Bộ trưởng Bộ Tài chính,\u003c/span\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"text-align:center;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eNGHỊ ĐỊNH:\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"text-align:center;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eChương I\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"text-align:center;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eNHỮNG QUY ĐỊNH CHUNG\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 1. Phạm vi điều chỉnh\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eNghị định này quy định chi tiết một số điều của Luật Thuế thu nhập cá nhân và các quy định về đăng ký, khai thuế, quyết toán thuế thu nhập cá nhân theo quy định của Luật Quản lý thuế.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 2. Đối tượng nộp thuế\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Đối tượng nộp thuế thu nhập cá nhân bao gồm cá nhân cư trú và cá nhân không cư trú có thu nhập chịu thuế quy định tại Điều 3 của Luật Thuế thu nhập cá nhân và Điều 3 Nghị định này. Phạm vi xác định thu nhập chịu thuế của đối tượng nộp thuế như sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Đối với cá nhân cư trú, thu nhập chịu thuế là thu nhập phát sinh trong và ngoài lãnh thổ Việt Nam, không phân biệt nơi chi trả thu nhập;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Đối với cá nhân không cư trú, thu nhập chịu thuế là thu nhập phát sinh tại Việt Nam, không phân biệt nơi chi trả thu nhập\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Cá nhân cư trú là người đáp ứng một trong các điều kiện sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Có mặt tại Việt Nam từ 183 ngày trở lên tính trong một năm dương lịch hoặc trong 12 tháng liên tục kể từ ngày đầu tiên có mặt tại Việt Nam;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eCá nhân có mặt tại Việt Nam theo quy định tại điểm này là sự hiện diện của cá nhân đó trên lãnh thổ Việt Nam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Có nơi ở thường xuyên tại Việt Nam theo một trong hai trường hợp sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e- Có nơi ở đăng ký thường trú theo quy định của pháp luật về cư trú;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e- Có nhà thuê để ở tại Việt Nam theo quy định của pháp luật về nhà ở, với thời hạn của hợp đồng thuê từ 90 ngày trở lên trong năm tính thuế\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e3. Cá nhân không cư trú là người không đáp ứng điều kiện quy định tại khoản 2 Điều này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 3. Thu nhập chịu thuế\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eThu nhập chịu thuế của cá nhân gồm các loại thu nhập sau đây:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Thu nhập từ hoạt động sản xuất, kinh doanh, bao gồm:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Thu nhập từ hoạt động sản xuất, kinh doanh hàng hóa, dịch vụ theo quy định của pháp luật. Riêng đối với thu nhập từ hoạt động sản xuất nông nghiệp, lâm nghiệp, làm muối, nuôi trồng, đánh bắt thủy sản chỉ áp dụng đối với trường hợp không đủ điều kiện được miễn thuế quy định tại khoản 5 Điều 4 Nghị định này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Thu nhập từ hoạt động hành nghề độc lập của cá nhân có giấy phép hoặc chứng chỉ hành nghề theo quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Thu nhập từ tiền lương, tiền công mà người lao động nhận được từ người sử dụng lao động, bao gồm:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Tiền lương, tiền công và các khoản có tính chất tiền lương, tiền công nhận được dưới các hình thức bằng tiền hoặc không bằng tiền.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Các khoản phụ cấp, trợ cấp, trừ các khoản phụ cấp, trợ cấp theo quy định của pháp luật về ưu đãi người có công, phụ cấp quốc phòng, an ninh, phụ cấp độc hại, nguy hiểm đối với những ngành, nghề hoặc công việc ở nơi làm việc có yếu tố độc hại, nguy hiểm, phụ cấp thu hút, phụ cấp khu vực theo quy định của pháp luật, trợ cấp khó khăn đột xuất, trợ cấp tai nạn lao động, bệnh nghề nghiệp, trợ cấp một lần khi sinh con hoặc nhận nuôi con nuôi, trợ cấp do suy giảm khả năng lao động, trợ cấp hưu trí một lần, tiền tuất hàng tháng, trợ cấp thôi việc, trợ cấp mất việc làm theo quy định của Bộ luật Lao động, các khoản trợ cấp khác do Bảo hiểm xã hội chi trả, trợ cấp giải quyết tệ nạn xã hội;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eCác khoản phụ cấp, trợ cấp không tính vào thu nhập chịu thuế quy định tại điểm này phải được cơ quan nhà nước có thẩm quyền quy định.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ec. Tiền thù lao nhận được dưới các hình thức như: tiền hoa hồng môi giới, tham gia đề tài, dự án, tiền nhuận bút và các khoản thù lao khác;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ed. Tiền nhận được từ tham gia hiệp hội kinh doanh, hội đồng quản trị, ban kiểm soát, hội đồng quản lý, các hiệp hội, hội nghề nghiệp và các tổ chức khác;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eđ. Các khoản lợi ích bằng tiền hoặc không bằng tiền ngoài tiền lương, tiền công do người sử dụng lao động trả hoặc trả hộ đối tượng nộp thuế dưới mọi hình thức:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e- Tiền nhà ở, điện, nước và các dịch vụ kèm theo (nếu có);\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e- Tiền mua bảo hiểm mà pháp luật không quy định bắt buộc người sử dụng lao động phải mua cho người lao động;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e- Phí hội viên và các khoản chi dịch vụ khác phục vụ cho cá nhân theo yêu cầu, như: chăm sóc sức khoẻ, vui chơi, thể thao, giải trí, thẩm mỹ.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e- Các khoản lợi ích khác theo quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ee. Các khoản thưởng bằng tiền hoặc không bằng tiền dưới mọi hình thức, kể cả thưởng bằng chứng khoán, trừ các khoản tiền thưởng sau đây:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e- Tiền thưởng kèm theo các danh hiệu được Nhà nước phong tặng, bao gồm cả tiền thưởng kèm theo các danh hiệu thi đua, các hình thức khen thưởng theo quy định của pháp luật về thi đua khen thưởng;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e- Tiền thưởng kèm theo giải thưởng quốc gia, giải thưởng quốc tế được nhà nước Việt Nam thừa nhận;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e- Tiền thưởng về cải tiến kỹ thuật, sáng chế, phát minh được cơ quang nhà nước có thẩm quyền công nhận;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e- Tiền thưởng về việc phát hiện, khai báo hành vi vi phạm pháp luật với cơ quan nhà nước có thẩm quyền.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e3. Thu nhập từ đầu tư vốn, bao gồm:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Tiền lãi cho vay;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Lợi tức cổ phần;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ec. Thu nhập từ đầu tư vốn dưới các hình thức khác, kể cả trường hợp góp vốn đầu tư bằng hiện vật, danh tiếng, quyền sử dụng đất, phát minh, sáng chế; trừ thu nhập nhận được từ lãi trái phiếu Chính phủ.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e4. Thu nhập từ chuyển nhượng vốn, bao gồm:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Thu nhập từ chuyển nhượng phần vốn trong các tổ chức kinh tế;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Thu nhập từ chuyển nhượng chứng khoán;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ec. Thu nhập từ chuyển nhượng vốn dưới các hình thức khác;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e5. Thu nhập từ chuyển nhượng bất động sản, bao gồm:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Thu nhập từ chuyển nhượng quyền sử dụng đất và tài sản gắn liền với đất;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Thu nhập từ chuyển nhượng quyền sở hữu hoặc sử dụng nhà ở;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ec. Thu nhập từ chuyển nhượng quyền thuê đất, thuê mặt nước;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ed. Các khoản thu nhập khác nhận được từ chuyển nhượng bất động sản.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e6. Thu nhập từ trúng thưởng bằng tiền hoặc hiện vật, bao gồm:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Trúng thưởng xổ số;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Trúng thưởng khuyến mại dưới các hình thức;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ec. Trúng thưởng trong các hình thức cá cược, casino;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ed. Trúng thưởng trong các trò chơi, cuộc thi có thưởng và các hình thức trúng thưởng khác.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e7. Thu nhập từ bản quyền, bao gồm:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Thu nhập từ chuyển giao, chuyển quyền sử dụng các đối tượng của quyền sở hữu trí tuệ: quyền tác giả và quyền liên quan đến quyền tác giả; quyền sở hữu công nghiệp; quyền đối với giống cây trồng;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Thu nhập từ chuyển giao công nghệ: bí quyết kỹ thuật, kiến thức kỹ thuật, các giải pháp hợp lý hóa sản xuất, đổi mới công nghệ;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e8. Thu nhập từ nhượng quyền thương mại theo quy định của Luật Thương mại.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e9. Thu nhập từ thừa kế là chứng khoán, phần vốn trong các tổ chức kinh tế, cơ sở kinh doanh, bất động sản và tài sản khác phải đăng ký sở hữu hoặc đăng ký sử dụng.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e10. Thu nhập từ nhận quà tặng là chứng khoán, phần vốn trong các tổ chức kinh tế, cơ sở kinh doanh, bất động sản và tài sản khác phải đăng ký sở hữu hoặc đăng ký sử dụng.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 4. Thu nhập được miễn thuế \u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Thu nhập từ chuyển nhượng bất động sản giữa vợ với chồng; cha đẻ, mẹ đẻ với con đẻ; cha nuôi, mẹ nuôi với con nuôi; cha chồng, mẹ chồng với con dâu; cha vợ, mẹ vợ với con rể; ông nội, bà nội với cháu nội; ông ngoại, bà ngoại với cháu ngoại; anh, chị em ruột với nhau.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Thu nhập từ chuyển nhượng nhà ở, quyền sử dụng đất ở và tài sản gắn liền với đất của cá nhân trong trường hợp người chuyển nhượng chỉ có duy nhất một nhà ở, quyền sử dụng đất ở tại Việt Nam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e3. Thu nhập từ giá trị quyền sử dụng đất của cá nhân được Nhà nước giao đất không phải trả tiền hoặc được giảm tiền sử dụng đất theo quy định của pháp luật\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e4. Thu nhập từ nhận thừa kế, quà tặng là bất động sản giữa vợ với chồng; cha đẻ, mẹ đẻ với con đẻ; cha nuôi, mẹ nuôi với con nuôi; cha chồng, mẹ chồng với con dâu; cha vợ, mẹ vợ với con rể; ông nội, bà nội với cháu nội; ông ngoại, bà ngoại với cháu ngoại; anh, chị em ruột với nhau.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e5. Thu nhập của hộ gia đình, cá nhân trực tiếp tham gia vào hoạt động sản xuất nông nghiệp, lâm nghiệp, làm muối, nuôi trồng, đánh bắt thủy sản chưa qua chế biến thành các sản phẩm khác hoặc chỉ qua sơ chế thông thường.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eHộ gia đình, cá nhân trực tiếp tham gia vào hoạt động sản xuất quy định tại khoản này phải thỏa mãn các điều kiện:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Có quyền sử dụng đất, sử dụng mặt nước hợp pháp để sản xuất và trực tiếp tham gia lao động sản xuất nông nghiệp, lâm nghiệp, làm muối, nuôi trồng thuỷ sản. Đối với đánh bắt thủy sản thì phải có quyền sở hữu hoặc quyền sử dụng tàu, thuyền, phương tiện đánh bắt và trực tiếp tham gia đánh bắt thuỷ sản.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Trực tiếp cư trú tại địa phương nơi diễn ra hoạt động sản xuất nông nghiệp, lâm nghiệp, làm muối, nuôi trồng thủy sản theo quy định của pháp luật về cư trú.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e6. Thu nhập từ chuyển đổi nông nghiệp của hộ gia đình, cá nhân được Nhà nước giao để sản xuất.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e7. Thu nhập từ lãi tiền gửi tại ngân hàng, tổ chức tín dụng, thu nhập từ lãi hợp đồng bảo hiểm nhân thọ.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e8. Thu nhập từ kiều hối\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e9. Phần tiền lương, tiền công làm việc ban đêm, làm thêm giờ được trả cao hơn so với tiền lương, tiền công làm việc ban ngày, làm trong giờ theo quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e10. Tiền lương hưu do Bảo hiểm xã hội chi trả theo quy định của Luật Bảo hiểm xã hội. Cá nhân sinh sống tại Việt Nam được miễn thuế đối với tiền lương hưu do nước ngoài trả.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e11. Thu nhập từ học bổng, bao gồm:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Học bổng nhận được từ ngân sách nhà nước;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Học bổng nhận được từ tổ chức trong nước và ngoài nước theo chương trình hỗ trợ khuyến học của tổ chức đó.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e12. Thu nhập từ bồi thường hợp đồng bảo hiểm nhân thọ, phi nhân thọ, tiền bồi thường tai nạn lao động, các khoản bồi thường nhà nước và các khoản bồi thường khác theo quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e13. Thu nhập nhận được từ các quỹ từ thiện được cơ quan nhà nước có thẩm quyền cho phép thành lập hoặc công nhận, hoạt động vì mục đích từ thiện, nhân đạo, không nhằm mục đích thu lợi nhuận.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e14. Thu nhập nhận được từ nguồn viện trợ nước ngoài vì mục đích từ thiện, nhân đạo dưới hình thức Chính phủ và phi Chính phủ được cơ quan nhà nước có thẩm quyền phê duyệt.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eBộ Tài chính quy định thủ tục, hồ sơ xác định các khoản thu nhập được miễn thuế quy định tại Điều này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 5. Giảm thuế \u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Đối tượng nộp thuế gặp khó khăn do thiên tai, hỏa hoạn, tai nạn, bệnh hiểm nghèo ảnh hưởng đến khả năng nộp thuế thì được xét giảm thuế tương ứng với mức độ thiệt hại nhưng không vượt quá số thuế phải nộp.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Bộ Tài chính quy định thủ tục, hồ sơ và việc xét giảm thuế thu nhập cá nhân quy định tại Điều này.\u003c/span\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"text-align:center;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eChương II\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"text-align:center;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eCĂN CỨ TÍNH THUẾ ĐỐI VỚI MỘT SỐ LOẠI THU NHẬP CỦA CÁ NHÂN CƯ TRÚ\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"text-align:center;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eMục 1\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp align=\"center\" class=\"MsoNormal\" style=\"text-align:center;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eTHU NHẬP TỪ KINH DOANH VÀ THU NHẬP TỪ TIỀN LƯƠNG, TIỀN CÔNG\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 6. Thu nhập tính thuế đối với thu nhập từ kinh doanh, thu nhập từ tiền lương, tiền công\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Thu nhập tính thuế đối với thu nhập từ kinh doanh, thu nhập từ tiền lương, tiền công được xác định bằng thu nhập chịu thuế từ kinh doanh, từ tiền lương, tiền công quy định tại Điều 7 và Điều 11 Nghị định này trừ (-) các khoản dưới đây:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Các khoản đóng bảo hiểm bắt buộc theo quy định của pháp luật, gồm: bảo hiểm xã hội, bảo hiểm y tế, bảo hiểm trách nhiệm nghề nghiệp đối với một số ngành, nghề phải tham gia bảo hiểm bắt buộc;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Các khoản giảm trừ gia cảnh quy định tại Điều 12 Nghị định này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ec. Các khoản đóng góp vào quỹ từ thiện, quỹ nhân đạo, quỹ khuyến học quy định tại Điều 13 Nghị định này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Thu nhập tính thuế đối với cá nhân vừa có thu nhập chịu thuế từ kinh doanh, vừa có thu nhập chịu thuế từ tiền lương, tiền công là tổng thu nhập chịu thuế từ kinh doanh cộng (+) thu nhập chịu thuế từ tiền lương, tiền công trừ (-) các khoản quy định tại điểm a, b và c khoản 1 Điều này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 7. Thu nhập chịu thuế từ kinh doanh\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eThu nhập chịu thuế từ kinh doanh được xác định bằng doanh thu tính thu nhập chịu thuế quy định tại Điều 8 Nghị định này trừ (-) các khoản chi phí hợp lý quy định tại Điều 9 Nghị định này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 8. Doanh thu tính thu nhập chịu thuế từ kinh doanh\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Doanh thu tính thu nhập chịu thuế từ kinh doanh là toàn bộ tiền bán hàng, tiền gia công, tiền hoa hồng, tiền cung ứng hàng hóa, dịch vụ phát sinh trong kỳ tính thuế.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eThời điểm xác định doanh thu là thời điểm chuyển giao quyền sở hữu hàng hóa, hoàn thành cung ứng dịch vụ hoặc thời điểm lập hoá đơn bán hàng, cung ứng dịch vụ không phân biệt đã thu được tiền hay chưa thu được tiền.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Doanh thu tính thu nhập chịu thuế trong một số trường hợp được quy định cụ thể như sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Doanh thu đối với hàng hóa bán theo phương thức trả góp được xác định theo giá bán hành hóa trả tiền một lần không bao gồm tiền lãi trả chậm;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Doanh thu đối với hàng hóa, dịch vụ dùng để trao đổi, biếu tặng được xác định theo giá bán của sản phẩm, hàng hóa, dịch vụ cùng loại hoặc tương đương tại thời điểm trao đổi, biếu tặng;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ec. Doanh thu đối với hoạt động gia công hàng hóa là tiền thu từ hoạt động gia công bao gồm cả tiền công, nhiên liệu, động lực, vật liệu phụ và chi phí khác phục vụ cho việc gia công hàng hóa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ed. Doanh thu đối với hoạt động cho thuê tài sản là số tiền bên thuê trả từng kỳ theo hợp đồng thuê. Trường hợp bên thuê trả tiền thuê trước cho nhiều năm thì doanh thu để tính thu nhập chịu thuế được phân bổ cho số năm trả tiền trước hoặc xác định theo doanh thu trả tiền một lần;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eđ. Doanh thu tính thu nhập chịu thuế đối với các trường hợp khác do Bộ Tài chính quy định.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 9. Chi phí hợp lý liên quan đến việc tạo ra thu nhập chịu thuế từ kinh doanh\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Chi phí hợp lý quy định tại Điều này phải là các khoản chi thực tế phát sinh và có đủ hóa đơn, chứng từ theo quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Các khoản chi phí hợp lý được trừ, bao gồm:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Tiền lương, tiền công, phụ cấp, các khoản thù lao và chi phí khác trả cho người lao động;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eKhông tính vào chi phí hợp lý được trừ khoản tiền lương, tiền công của cá nhân là chủ hộ kinh doanh.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Chi phí nguyên liệu, vật liệu, nhiên liệu, năng lượng, hàng hóa thực tế sử dụng vào sản xuất kinh doanh hàng hóa, dịch vụ liên quan đến việc tạo ra doanh thu, thu nhập chịu thuế trong kỳ được tính theo mức tiêu hao hợp lý, giá thực tế xuất kho do hộ gia đình, cá nhân kinh doanh tự xác định và chịu trách nhiệm trước pháp luật;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ec. Chi phí khấu hao, duy tu, bảo dưỡng tài sản cố định sử dụng cho hoạt động sản xuất, kinh doanh hàng hóa, dịch vụ. Mức trích khấu hao tài sản cố định được xác định căn cứ vào giá trị tài sản cố định và thời gian trích khấu hao theo quy định của Bộ Tài chính.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ed. Chi phí trả lãi các khoản tiền vay vốn sản xuất kinh doanh liên quan trực tiếp đến việc tạo ra doanh thu và thu nhập chịu thuế;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eđ. Chi phí quản lý;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ee. Các khoản thuế, phí và lệ phí, tiền thuê đất phải nộp liên quan đến hoạt động sản xuất, kinh doanh, dịch vụ theo quy định của pháp luật;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eg. Các khoản chi phí khác liên quan đến việc tạo ra thu nhập.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eBộ Tài chính quy định cụ thể các chi phí hợp lý khác được trừ khi tính thu nhập chịu thuế.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 10. Thu nhập chịu thuế, thu nhập tính thuế của cá nhân kinh doanh chưa thực hiện đúng pháp luật về kế toán, hóa đơn, chứng từ\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Cá nhân kinh doanh chưa thực hiện đúng quy định của pháp luật về kế toán, hóa đơn, chứng từ, không xác định được doanh thu, chi phí và thu nhập chịu thuế thì cơ quan Thuế có thẩm quyền ấn định doanh thu, tỷ lệ thu nhập chịu thuế để xác định thu nhập chịu thuế phù hợp với từng ngành, nghề sản xuất, kinh doanh.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Căn cứ vào kết quả ấn định thu nhập chịu thuế quy định tại khoản 1 Điều này, cơ quan Thuế xác định mức thuế khoán theo nguyên tắc, trình tự, thủ tục quy định tại Điều 38 của Luật Quản lý thuế.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 11. Thu nhập chịu thuế từ tiền lương, tiền công\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Thu nhập chịu thuế từ tiền lương, tiền công được xác định theo quy định tại khoản 2 Điều 3 Nghị định này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Thời điểm xác định thu nhập chịu thuế từ tiền lương, tiền công là thời điểm người sử dụng lao động trả tiền lương, tiền công cho người nộp thuế hoặc thời điểm đối tượng nộp thuế nhận được thu nhập.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 12. Giảm trừ gia cảnh\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eCá nhân cư trú có thu nhập tiền lương, tiền công, thu nhập từ kinh doanh được giảm trừ gia cảnh vào thu nhập chịu thuế trước khi tính thuế như sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Mức giảm trừ gia cảnh:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Mức giảm trừ gia cảnh đối với người nộp thuế là 48 triệu đồng/năm;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Mức giảm trừ cho mỗi người phụ thuộc mà người nộp thuế có nghĩa vụ nuôi dưỡng là 1,6 triệu đồng/tháng kể từ tháng phát sinh nghĩa vụ nuôi dưỡng.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Mỗi người phụ thuộc chỉ được tính giảm trừ một lần vào một đối tượng nộp thuế trong năm tính thuế. Trường hợp các đối tượng nộp thuế có chung người phụ thuộc phải nuôi dưỡng thì phải tự thỏa thuận để đăng ký giảm trừ gia cảnh vào một đối tượng nộp thuế\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e3. Đối tượng và căn cứ xác định người phụ thuộc như sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Con dưới 18 tuổi;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Con trên 18 tuổi bị tàn tật, không có khả năng lao động;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ec. Con đang theo học tại các trường: đại học, cao đẳng, trung học chuyên nghiệp, dạy nghề, không có thu nhập hoặc có thu nhập không vượt quá mức thu nhập quy định tại khoản 4 Điều này;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ed. Người ngoài độ tuổi lao động hoặc người trong độ tuổi lao động theo quy định của pháp luật nhưng bị tàn tật, không có khả năng lao động, không có thu nhập hoặc có thu nhập nhưng không vượt quá mức thu nhập quy định tại khoản 4 Điều này, bao gồm:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e- Vợ hoặc chồng của người nộp thuế;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e- Cha đẻ, mẹ đẻ, cha vợ, mẹ vợ (hoặc cha chồng, mẹ chồng) của người nộp thuế;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e- Cá nhân khác không nơi nương tựa mà người nộp thuế phải trực tiếp nuôi dưỡng.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e4. Mức thu nhập làm căn cứ xác định người phụ thuộc được áp dụng giảm trừ là mức thu nhập bình quân tháng trong năm từ tất cả các nguồn thu nhập không vượt quá 500.000 đồng.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e5. Người nộp thuế tự kê khai số lượng người phụ thuộc kèm theo giấy tờ hợp pháp và tự chịu trách nhiệm trước pháp luật về tính chính xác của việc kê khai.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e6. Bộ Tài chính quy định thủ tục, hồ sơ kê khai người phụ thuộc được giảm trừ gia cảnh quy định tại Điều này.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 13. Giảm trừ đối với các khoản đóng góp từ thiện, nhân đạo\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Cá nhân cư trú có thu nhập từ kinh doanh, thu nhập từ tiền lương, tiền công được giảm trừ các khoản đóng góp từ thiện, nhân đạo vào thu nhập chịu thuế, bao gồm:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003ea. Khoản đóng góp vào các tổ chức, cơ sở chăm sóc, nuôi dưỡng trẻ em có hoàn cảnh đặc biệt khó khăn, người tàn tật, người già không nơi nương tựa;\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eb. Khoản đóng góp vào các quỹ từ thiện, quỹ nhân đạo, quỹ khuyến học.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Tổ chức, cơ sở và các quỹ quy định tại các điểm a, b khoản 1 Điều này phải được cơ quan nhà nước có thẩm quyền cho phép thành lập hoặc công nhận, hoạt động vì mục đích từ thiện, nhân đạo, khuyến học, không nhằm mục đích kinh doanh.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e3. Khoản đóng góp từ thiện, nhân đạo phát sinh vào năm nào thì được tính giảm trừ vào thu nhập chịu thuế của năm đó, không được chuyển trừ vào thu nhập chịu thuế của năm tính thuế tiếp theo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eĐiều 14. Biểu thuế lũy tiến từng phần\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e1. Biểu thuế luỹ tiến từng phần áp dụng đối với thu nhập tính thuế từ kinh doanh, thu nhập từ tiền lương, tiền công\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"MsoNormal\" style=\"text-align:justify;margin:6pt 0cm;\"\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003e2. Biểu thuế luỹ tiến từng phần được quy định như sau:\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" class=\"MsoNormalTable\" style=\"border-collapse:collapse;\"\u003e\n \u003ctbody\u003e\n  \u003ctr style=\"\"\u003e\n   \u003ctd style=\"border-bottom:windowtext 1pt solid;border-left:windowtext 1pt solid;padding-bottom:0cm;background-color:transparent;padding-left:5.4pt;width:40.4pt;padding-right:5.4pt;border-top:windowtext 1pt solid;border-right:windowtext 1pt solid;padding-top:0cm;\" valign=\"top\" width=\"54\"\u003e\n    \u003cp align=\"center\" class=\"MsoNormal\" style=\"text-align:center;margin:6pt 0cm;\"\u003e\u003cb\u003e\u003cspan style=\"font-family:Arial;font-size:10pt;\"\u003eBậc thuế\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\u003c/td\u003e\n   \u003ctd style=\"border-bottom:windowtext 1pt solid;border-left:#ece9d8;padding-bottom:0cm;backgr

scription\":\"Cổng thông tin chính thức của Cơ quan Công báo Việt Nam\"},\"feedbackSuggestions\":{\"title\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\",\"description\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\"}}},\"footer\":{\"unit\":\"Đơn vị chủ quản\",\"unitContent\":\"Bộ Tư pháp\",\"address\":\"Địa chỉ\",\"addressContent\":\"Số 60 Trần Phú - Ba Đình - Thành phố Hà Nội\",\"phoneNumber\":\"Điện thoại\",\"phoneNumberContent\":\"024.6273.9468\",\"fax\":\"Fax\",\"faxContent\":\"024.6273.9359\"},\"underConstruction\":{\"title\":\"Đang cập nhật\",\"message\":\"Chức năng này đang được phát triển.\"},\"gioiThieu\":{\"timeline\":{\"2005\":{\"description\":\"Năm 2005 đánh dấu sự khởi đầu của dự án xây dựng Cơ sở dữ liệu quốc gia về pháp luật, với mục tiêu số hóa và tập trung hóa các văn bản pháp luật của Việt Nam.\"},\"2012-2013\":{\"description\":\"Giai đoạn 2012-2013 là thời kỳ phát triển và mở rộng hệ thống, với việc tích hợp thêm nhiều tính năng và cải thiện giao diện người dùng.\"},\"2023-2025\":{\"description\":\"Giai đoạn 2023-2025 tập trung vào việc nâng cấp và hiện đại hóa hệ thống, áp dụng các công nghệ mới và mở rộng phạm vi phục vụ.\"}},\"overview\":{\"title\":\"SƠ LƯỢC MÔ HÌNH CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"CSDLQG về pháp luật tập hợp các văn bản quy phạm pháp luật và văn bản hợp nhất văn bản quy phạm pháp luật (sau đây gọi chung là văn bản) dưới dạng văn bản điện tử do Chính phủ thống nhất quản lý, có địa chỉ truy cập vbpl.vn, bao gồm các Cơ sở dữ liệu thành phần: Cơ sở dữ liệu văn bản pháp luật Trung ương và Cơ sở dữ liệu văn bản pháp luật địa phương.\",\"central\":{\"title\":\"Cơ sở dữ liệu Văn bản pháp luật Trung ương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của các Bộ, cơ quan ngang Bộ, cơ quan nhà nước khác ở Trung ương ban hành hoặc phối hợp ban hành. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật; Văn bản hợp nhất; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"local\":{\"title\":\"Cơ sở dữ liệu văn bản pháp luật địa phương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của từng tỉnh, thành phố trực thuộc Trung ương trên toàn quốc. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật của Hội đồng nhân dân và Ủy ban nhân dân; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"other\":{\"title\":\"Các chuyên mục khác\",\"content\":\"Ngoài các Cơ sở dữ liệu thành phần kể trên, CSDLQG về pháp luật còn có các chuyên mục khác như: Giới thiệu văn bản mới, Tin tức, Tình huống pháp luật. Ngoài ra, CSDLQG về thủ tục hành chính, bộ pháp điển điện tử, cổng thông tin điện tử Bộ Tư pháp cũng trích xuất về CSDLQG về pháp luật.\"}},\"vision\":{\"title\":\"Tầm nhìn\",\"content\":\"Trở thành nguồn tra cứu văn bản pháp luật chính thống, đầy đủ và đáng tin cậy, phục vụ hiệu quả cho người dân, doanh nghiệp và cơ quan nhà nước.\"},\"mission\":{\"title\":\"Sứ mệnh\",\"content\":\"Cung cấp hệ thống văn bản pháp luật được cập nhật kịp thời, tra cứu thuận tiện, góp phần nâng cao nhận thức pháp luật và bảo đảm việc tuân thủ pháp luật trong xã hội.\"},\"features\":{\"title\":\"MỘT SỐ TÍNH NĂNG, TIỆN ÍCH CỦA CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"Hiện nay, CSDLQG về PL có giao diện tương đối thân thiện, dễ tìm kiếm, dễ khai thác các thông tin và tải về sử dụng. Cơ sở dữ liệu cung cấp các chức năng, tiện ích cơ bản và thuận tiện\",\"list\":[{\"key\":\"fullText\",\"label\":\"Tra cứu toàn văn\",\"icon\":\"SearchOutlined\"},{\"key\":\"tableOfContents\",\"label\":\"Tự động tạo mục lục\",\"icon\":\"BookOutlined\"},{\"key\":\"relatedDocuments\",\"label\":\"Liên kết văn bản liên quan\",\"icon\":\"LinkOutlined\"},{\"key\":\"validity\",\"label\":\"Xác định hiệu lực tự động\",\"icon\":\"BarChartOutlined\"},{\"key\":\"validityHistory\",\"label\":\"Lịch sử hiệu lực\",\"icon\":\"ClockCircleOutlined\"},{\"key\":\"download\",\"label\":\"Tải văn bản\",\"icon\":\"DownloadOutlined\"},{\"key\":\"english\",\"label\":\"Xem văn bản tiếng Anh\",\"icon\":\"GlobalOutlined\"},{\"key\":\"centralLocal\",\"la 5\",\"static/chunks/6625-1107db2d5233eb73.js\",\"3954\",\"static/chunks/3954-946ccf0eafc577be.js\",\"5292\",\"static/chunks/5292-beb20880bf4a7330.js\",\"3207\",\"static/chunks/3207-0792bf349fc6782d.js\",\"7287\",\"static/chunks/7287-1e02014aaec038d7.js\",\"2007\",\"static/chunks/2007-dba949ac429f5003.js\",\"4310\",\"static/chunks/app/%5Blocale%5D/van-ban/%5Bcategory%5D/%5Bid%5D/page-75f20aedc57a9c0c.js\"],\"default\"]\n2b:T31d3a,"])</script><script>self.__next_f.push([1,"\u003chtml\u003e\n \u003chead\u003e\u003c/head\u003e\n \u003cbody\u003e\n  \u003cdiv style=\"width: 100%; font-family: 'Times New Roman', serif; font-size: 14px; color: #000;\"\u003e\n   \u003cdiv style=\"width: 100%; display: table; table-layout: fixed;\"\u003e\n    \u003cdiv style=\"display: table-cell; width: 50%; text-align: center; vertical-align: top; font-weight: bold; text-transform: uppercase; line-height: 1.8;\"\u003e\n     \u003cdiv\u003e\n      BỘ TÀI CHÍNH\n     \u003c/div\u003e\n     \u003cdiv style=\"width: 150px; margin: 4px auto 0; border-bottom: 1px solid #000;\"\u003e\u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"display: table-cell; width: 50%; text-align: center; vertical-align: top; font-weight: bold; line-height: 1.8;\"\u003e\n     \u003cdiv\u003e\n      CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM\n     \u003c/div\u003e\n     \u003cdiv\u003e\n      Độc lập – Tự do – Hạnh phúc\n     \u003c/div\u003e\n     \u003cdiv style=\"width: 120px; margin: 4px auto 0; border-bottom: 1px solid #000;\"\u003e\u003c/div\u003e\n    \u003c/div\u003e\n   \u003c/div\u003e\n   \u003cdiv style=\"width: 100%; display: table; table-layout: fixed; margin-top: 16px; line-height: 1.2; margin-bottom: 16px;\"\u003e\n    \u003cdiv style=\"display: table-cell; width: 50%; text-align: center; vertical-align: top;\"\u003e\n     Số: 149/2001/QĐ-BTC\n    \u003c/div\u003e\n    \u003cdiv style=\"display: table-cell; width: 50%; text-align: center; vertical-align: top; font-style: italic;\"\u003e\n     Hà Nội, ngày 31 tháng 12 năm 2001\n    \u003c/div\u003e\n   \u003c/div\u003e\n  \u003c/div\u003e\n  \u003cp\u003e\u003c/p\u003e\n  \u003cdiv class=\"Section1\"\u003e\n   \u003cp align=\"center\" style=\"text-align: center;\"\u003e\u003cb\u003e\u003cspan style=\"font-size: 12.0pt; font-family: 'Times New Roman';\"\u003eQUYẾT ĐỊNH CỦA BỘ TRƯỞNG BỘ TÀI CHÍNH\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n   \u003cp align=\"center\" style=\"text-align: center;\"\u003e\u003cb\u003e\u003ci\u003e\u003cspan style=\"font-size: 12.0pt; font-family: 'Times New Roman';\"\u003eVề việc ban hành và công bố bốn (4) chuẩn mực kế toán Việt Nam \u003c/span\u003e\u003c/i\u003e\u003c/b\u003e\u003c/p\u003e\n   \u003cp align=\"center\" style=\"text-align: center; font-family: 'Times New Roman', Times, serif;\"\u003e\u003cb\u003e\u003ci\u003e\u003cspan style=\"font-size: 12.0pt; font-family: 'Times New Roman';\"\u003e(đợt 1).\u003c/span\u003e\u003c/i\u003e\u003c/b\u003e\u003cb\u003e\u003ci\u003e\u003cspan style=\"font-size: 12.0pt; font-family: 'Times New Roman';\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/i\u003e\u003c/b\u003e\u003c/p\u003e\n   \u003cp align=\"center\" style=\"text-align: center;\"\u003e\u003cb\u003e\u003cspan style=\"font-size: 12.0pt; font-family: 'Times New Roman';\"\u003eBỘ TRƯỞNG BỘ TÀI CHÍNH\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003ci\u003e\u003cspan style=\"font-size: 12.0pt; font-family: 'Times New Roman';\"\u003eCăn cứ Pháp lệnh Kế toán và thống kê công bố theo Lệnh số 06/LCT-HĐNN ngày 20/5/1988 của Hội đồng Nhà nước và Điều lệ tổ chức kế toán nhà nước ban hành theo Nghị định số 25/HĐBT ngày 18/3/1989 của Hội đồng Bộ\u003c/span\u003e\u003c/i\u003e\u003ci\u003e \u003c/i\u003e\u003ci\u003etrưởng (nay là Chính phủ);\u003c/i\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003ci\u003e\u003cspan style=\"font-size: 12.0pt; font-family: 'Times New Roman';\"\u003eCăn cứ Nghị định số 15/\u003c/span\u003e\u003c/i\u003e\u003ci\u003e\u003cspan style=\"font-size: 12.0pt; font-family: 'Times New Roman';\"\u003eCP \u003c/span\u003e\u003c/i\u003e\u003ci\u003e\u003cspan style=\"font-size: 12.0pt; font-family: 'Times New Roman';\"\u003engày 02/3/1993 của Chính phủ về nhiệm vụ, quyền hạn và trách nhiệm quản lý nhà nước của Bộ, cơ quan ngang Bộ;\u003c/span\u003e\u003c/i\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003ci\u003e\u003cspan style=\"font-size: 12.0pt; font-family: 'Times New Roman';\"\u003eCăn cứ Nghị định số\u003c/span\u003e\u003c/i\u003e\u003ci\u003e\u003cspan style=\"font-size: 12.0pt; font-family: 'Times New Roman';\"\u003e 1\u003c/span\u003e\u003c/i\u003e\u003ci\u003e\u003cspan style=\"font-size: 12.0pt; font-family: 'Times New Roman';\"\u003e78/\u003c/span\u003e\u003c/i\u003e\u003ci\u003e\u003cspan style=\"font-size: 12.0pt; font-family: 'Times New Roman';\"\u003eCP \u003c/span\u003e\u003c/i\u003e\u003ci\u003e\u003cspan style=\"font-size: 12.0pt; font-family: 'Times New Roman';\"\u003engày 28/10/1994 của Chính phủ về nhiệm vụ, quyền hạn và tổ chức bộ máy Bộ \u003c/span\u003e\u003c/i\u003e\u003ci\u003e\u003cspan style=\"font-size: 12.0pt; font-family: 'Times New Roman';\"\u003eTài chính;\u003c/span\u003e\u003c/i\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003ci\u003e\u003cspan style=\"font-size: 12.0pt; font-family: 'Times New Roman';\"\u003eĐể đáp ứng yêu cầu đổi mới cơ chế quản lý kinh tế, tài chính, nâng cao chất lượng thông tin kế toán cung cấp trong nền kinh tế quốc dân và để kiểm tra, kiểm soát chất lượng công tác kế toán;\u003c/span\u003e\u003c/i\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003ci\u003e\u003cspan style=\"font-size: 12.0pt; font-family: 'Times New Roman';\"\u003eTheo đề nghị của Vụ trưởng Vụ Chế độ kế toán và Chánh Văn phòng Bộ\u003c/span\u003e\u003c/i\u003e\u003ci\u003e \u003c/i\u003e\u003ci\u003eTài chính,\u0026nbsp;\u003c/i\u003e\u003c/p\u003e\n   \u003cp align=\"center\" style=\"text-align: center;\"\u003e\u003cb\u003e\u003cspan style=\"font-size: 12.0pt; font-family: 'Times New Roman';\"\u003eQUYẾT ĐỊNH:\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n   \u003cp id=\"6ced4caa-eb99-11f0-9d86-fba10e67a143\" class=\"prov-article\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e\u003cstrong\u003eĐiều 1. \u003c/strong\u003eBan hành bốn (4) chuẩn mực kế toán Việt Nam (đợt 1) có số hiệu và tên gọi sau đây:\u003c/p\u003e\n   \u003cp id=\"6ced4cb4-eb99-11f0-b0fd-b19576d4dad8\" class=\"prov-clause\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e1. Chuẩn mực số 2 - Hàng tồn kho;\u003c/p\u003e\n   \u003cp id=\"6ced4cbe-eb99-11f0-bb38-b7b8f75993f7\" class=\"prov-clause\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e2. Chuẩn mực số 3 - Tài sản cố định hữu hình;\u003c/p\u003e\n   \u003cp id=\"6ced4cc8-eb99-11f0-9306-e9f49bdc4c8a\" class=\"prov-clause\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e3. Chuẩn mực số 4 - Tài sản cố định vô hình;\u003c/p\u003e\n   \u003cp id=\"6ced4cd2-eb99-11f0-9d6c-c547f6ba26fc\" class=\"prov-clause\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e4. Chuẩn mực số 14 - Doanh thu và thu nhập khác.\u003c/p\u003e\n   \u003cp id=\"6ced4cdc-eb99-11f0-a4de-c536e0fcf9dd\" class=\"prov-article\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e\u003cstrong\u003eĐiều 2. \u003c/strong\u003eBốn (4) chuẩn mực kế toán Việt Nam ban hành kèm theo Quyết định này được áp dụng đối với tất cả các doanh nghiệp thuộc các ngành, các thành phần kinh tế trong cả nước.\u003c/p\u003e\n   \u003cp id=\"6ced4ce6-eb99-11f0-ad70-5b790e5c0784\" class=\"prov-article\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e\u003cstrong\u003eĐiều 3. \u003c/strong\u003eQuyết định này có hiệu lực thi hành từ ngày 01 tháng 1 năm 2002. Các chế độ kế toán cụ thể phải căn cứ vào bốn chuẩn mực kế toán được ban hành kèm theo Quyết định này để sửa đổi, bổ sung cho phù hợp.\u003c/p\u003e\n   \u003cp id=\"6ced4cf0-eb99-11f0-aef1-f5f4447a2fde\" class=\"prov-article\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e\u003cstrong\u003eĐiều 4. \u003c/strong\u003eVụ trưởng Vụ Chế độ kế toán, Chánh Văn phòng Bộ và Thủ trưởng các đơn vị liên quan thuộc và trực thuộc Bộ Tài chính chịu trách nhiệm hướng dẫn, kiểm tra và thi hành Quyết định này.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003cb\u003e\u003cspan style=\"font-size: 12.0pt; font-family: 'Times New Roman';\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n   \u003cp align=\"center\" style=\"text-align: center;\"\u003e\u003cb\u003e\u003cspan style=\"font-size: 12.0pt; font-family: 'Times New Roman';\"\u003eChuẩn mực số \u003ci\u003e2\u003c/i\u003e\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n   \u003cp align=\"center\" style=\"text-align: center;\"\u003e\u003cb\u003e\u003cspan style=\"font-size: 12.0pt; font-family: 'Times New Roman';\"\u003eHÀNG TỔN KHO\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n   \u003cp align=\"center\" style=\"margin-left: 36.0pt; text-align: center;\"\u003e\u003ci\u003e(ban hành và công bố theo Quyết định\u003c/i\u003e\u003c/p\u003e\n   \u003cp align=\"center\" style=\"margin-left: 36.0pt; text-align: center;\"\u003e\u003ci\u003e\u003cspan\u003e\u0026nbsp;\u003c/span\u003esố 149/2001/QĐ-BTC ngày 31/12/2001 của Bộ\u003c/i\u003e\u003ci\u003e \u003c/i\u003e\u003ci\u003etrưởng Bộ\u003c/i\u003e\u003ci\u003e \u003c/i\u003e\u003ci\u003eTài chính).\u003c/i\u003e\u003c/p\u003e\n   \u003cp align=\"center\" style=\"text-align: center;\"\u003e\u003cb\u003e\u003cspan style=\"font-size: 12.0pt; font-family: 'Times New Roman';\"\u003eQUY ĐỊNH CHUNG\u003c/span\u003e\u003c/b\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e01.Mục đích của chuẩn mực này là quy định và hướng dẫn các nguyên tắc và phương pháp kế toán hàng tồn kho, gồm: xác định giá trị và kế toán hàng tồn kho vào chi phí; ghi giảm giá trị hàng tồn kho cho phù hợp với giá trị thuần có thể thực hiện được và phương pháp tính giá trị hàng tồn kho làm cơ sở ghi sổ kế toán và lập báo cáo tài chính.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e02.Chuẩn mực này áp dụng cho kế toán hàng tồn kho theo nguyên tắc giá gốc trừ khi có chuẩn mực kế toán khác quy định cho phép áp dụng phương pháp kế toán khác cho hàng tồn kho.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e03.Các thuật ngữ trong Chuẩn mực này được hiểu như sau:\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eHàng tồn kho: Là những tài sản:\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003ea)Được giữ để bán trong kỳ sản xuất, kinh doanh bình thường;\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eb)Đang trong quá trình sản xuất, kinh doanh dở dang;\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003ec)Nguyên liệu, vật liệu, công cụ, dụng cụ để sử dụng trong quá trình sản xuất, kinh doanh hoặc cung cấp dịch vụ.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eHàng tồn kho bao gồm:\u0026nbsp;\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eHàng hóa mua về để bán: Hàng hóa tồn kho, hàng mua đang đi trên đường, hàng gửi đi bán, hàng hóa gửi đi gia công chế biến;\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eThành phẩm tồn kho và thành phẩm gửi đi bán;\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eSản phẩm dở dang: Sản phẩm chưa hoàn thành và sản phẩm hoàn thành chưa làm thủ tục nhập kho thành phẩm;\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eNguyên liệu, vật liệu, công cụ, dụng cụ tồn kho gửi đi gia công chế biến và đã mua đang đi trên đường;\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eChi phí dịch vụ dở dang.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eGiá trị thuần có thể thực hiện được: là giá bán ước tính của hàng tồn kho trong kỳ sản xuất, kinh doanh bình thường trừ (-) chi phí ước tính để hoàn thành sản phẩm và chi phí ước tính cần thiết cho việc tiêu thụ chúng.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eGiá hiện hành: là khoản tiền phải trả để mua một loại hàng tồn kho tương tự tại ngày lập bảng cân đối kế toán.\u003c/p\u003e\n   \u003cp style=\"text-align: center;\"\u003eNỘI DUNG CHUẨN MỰC\u003c/p\u003e\n   \u003cp style=\"text-align: center;\"\u003eXÁC ĐỊNH GIÁ TRỊ HÀNG TỒN KHO\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e04.Hàng tồn kho được tính theo giá gốc. Tổ hợp giá trị thuần có thể thực hiện được thấp hơn giá gốc thì phải tính theo giá trị thuần có thể thực hiện được.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eGiá gốc hàng tồn kho\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e05.Giá gốc hàng tồn kho bao gồm: Chi phí mua, chi phí chế biến và các chi phí liên quan trực tiếp khác phát sinh để có được hàng tồn kho ở địa điểm và trạng thái hiện tại.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eChi phí mua\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e06.Chi phí mua của hàng tồn kho bao gồm giá mua, các loại thuế không được hoàn lại, chi phí vận chuyển, bốc xếp, bảo quản trong quá trình mua hàng và các chi phí khác có liên quan trực tiếp đến việc mua hàng tồn kho. Các khoản chiết khấu thương mại và giảm giá hàng mua do hàng mua không đúng quy cách, phẩm chất được trừ (-) khỏi chi phí mua.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eChi phí chế biến\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e07.Chi phí chế biến hàng tồn kho bao gồm những chi phí có liên quan trực tiếp đến sản phẩm sản xuất, như chi phí nhân công trực tiếp, chi phí sản xuất chung cố định và chi phí sản xuất chung biến đổi phát sinh trong quá trình chuyển hóa nguyên liệu, vật liệu thành thành phẩm.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eChi phí sản xuất chung cố định là những chi phí sản xuất gián tiếp, thường không thay đổi theo số lượng sản phẩm sản xuất, như chi phí khấu hao, chi phí bảo dưỡng máy móc thiết bị, nhà xưởng,... và chi phí quản lý hành chính ở các phân xưởng sản xuất.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eChi phí sản xuất chung biến đổi là những chi phí sản xuất gián tiếp, thường thay đổi trực tiếp hoặc gần như trực tiếp theo số lượng sản phẩm sản xuất, như chi phí nguyên liệu, vật liệu gián tiếp, chi phí nhân công gián tiếp.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e08.Chi phí sản xuất chung cố định phân bổ vào chi phí chế biến cho mỗi đơn vị sản phẩm được dựa trên công suất bình thường của máy móc sản xuất. Công suất bình thường là số lượng sản phẩm đạt được ở mức trung bình trong các điều kiện sản xuất bình thường.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eTrường hợp mức sản phẩm thực tế sản xuất ra cao hơn công suất bình thường thì chi phí sản xuất chung cố định được phân bổ cho mỗi đơn vị sản phẩm theo chi phí thực tế phát sinh.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eTrường hợp mức sản phẩm thực tế sản xuất ra thấp hơn công suất bình thường thì chi phí sản xuất chung cố định chỉ được phân bổ vào chi phí chế biến cho mỗi đơn vị sản phẩm theo mức công suất bình thường. Khoản chi phí sản xuất chung không phân bổ được ghi nhận là chi phí sản xuất, kinh doanh trong kỳ.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eChi phí sản xuất chung biến đổi được phân bổ hết vào chi phí chế biến cho mỗi đơn vị sản phẩm theo chi phí thực tế phát sinh.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e09.Trường hợp một quy trình sản xuất ra nhiều loại sản phẩm trong cùng một khoảng thời gian mà chi phí chế biến của mỗi loại sản phẩm không được phản ánh một cách tách biệt, thì chi phí chế biến được phân bổ cho các loại sản phẩm theo tiêu thức phù hợp và nhất quán giữa các kỳ kế toán.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eTrường hợp có sản phẩm phụ, thì giá trị sản phẩm phụ được tính theo giá trị thuần có thể thực hiện được và giá trị này được trừ (-) khỏi chi phí chế biến đã tập hợp chung cho sản phẩm chính.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eChi phí liên quan trực tiếp khác:\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e10.Chi phí liên quan trực tiếp khác tính vào giá gốc hàng tồn kho bao gồm các khoản chi phí khác ngoài chi phí mua và chi phí chế biến hàng tồn kho. Ví dụ, trong giá gốc thành phẩm có thể bao gồm chí phí thiết kế sản phẩm cho một đơn đặt hàng cụ thể.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eChi phí không tính vào giá gốc hàng tồn kho\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e11.Chi phí không được tính vào giá gốc hàng tồn kho, gồm:\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003ea)Chi phí nguyên liệu, vật liệu, chi phí nhân công và các chi phí sản xuất, kinh doanh khác phát sinh trên mức bình thường,\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eb)Chi phí bảo quản hàng tồn kho trừ các khoản chi phí bảo quản hàng tồn kho cần thiết cho quá trình sản xuất tiếp theo và chi phí bảo quản quy định ở đoạn 06;\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003ec)Chi phí bán hàng;\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003ed)Chi phí quản lý doanh nghiệp.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eChi phí cung cấp dịch vụ\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e12.Chi phí cung cấp dịch vụ bao gồm chi phí nhân viên và các chi phí khác liên quan trực tiếp đến việc cung cấp dịch vụ, như chi phí giám sát và các chi phí chung có liên quan.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eChi phí nhân viên, chi phí khác liên quan đến bán hàng và quản lý doanh nghiệp không được tính vào chi phí cung cấp dịch vụ.\u003c/p\u003e\n   \u003cp style=\"text-align: center;\"\u003ePHƯƠNG PHÁP TÍNH GIÁ TRỊ HÀNG TỒN KHO\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e13.Việc tính giá trị hàng tồn kho được áp dụng theo một trong các phương pháp sau:\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003ea)Phương pháp tính theo giá đích danh;\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eb)Phương pháp bình quân gia quyền;\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003ec)Phương pháp nhập trước, xuất trước;\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003ed)Phương pháp nhập sau, xuất trước.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e14.Phương pháp tính theo giá đích danh được áp dụng đối với doanh nghiệp có ít loại mặt hàng hoặc mặt hàng ổn định và nhận diện được.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e15.Theo phương pháp bình quân gia quyền, giá trị của từng loại hàng tồn kho được tính theo giá trị trung bình của từng loại hàng tồn kho tương tự đầu kỳ và giá trị từng loại hàng tồn kho được mua hoặc sản xuất trong kỳ. Giá trị trung bình có thể được tính theo thời kỳ hoặc vào mỗi khi nhập một lô hàng về, phụ thuộc vào tình hình của doanh nghiệp.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e16.Phương pháp nhập trước, xuất trước áp dụng dựa trên giả định là hàng tồn kho được mua trước hoặc sản xuất trước thì được xuất trước, và hàng tồn kho còn lại cuối kỳ là hàng tồn kho được mua hoặc sản xuất gần thời điểm cuối kỳ. Theo phương pháp này thì giá trị hàng xuất kho được tính theo giá của lô hàng nhập kho ở thời điểm đầu kỳ hoặc gần đầu kỳ, giá trị của hàng tồn kho được tính theo giá của hàng nhập kho ở thời điểm cuối kỳ hoặc gần cuối kỳ còn tồn kho.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e17.Phương pháp nhập sau, xuất trước áp dụng dựa trên giả định là hàng tồn kho được mua sau hoặc sản xuất sau thì được xuất trước, và hàng tồn kho còn lại cuối kỳ là hàng tồn kho được mua hoặc sản xuất trước đó. Theo phương pháp này thì giá trị hàng xuất kho được tính theo giá của lô hàng nhập sau hoặc gần sau cùng, giá trị của hàng tồn kho được tính theo giá của hàng nhập kho đầu kỳ hoặc gần đầu kỳ còn tồn kho.\u003c/p\u003e\n   \u003cp style=\"text-align: center;\"\u003eGIÁ TRỊ THUẦN CÓ THỂ THỰC HIỆN ĐƯỢC\u003c/p\u003e\n   \u003cp style=\"text-align: center;\"\u003eVÀ LẬP DỰ PHÒNG GIẢM GIÁ HÀNG TỒN KHO\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e18.Giá trị hàng tồn kho không thu hồi đủ khi hàng tồn kho bị hư hỏng, lỗi thời, giá bán bị giảm, hoặc chi phí hoàn thiện, chi phí để bán hàng tăng lên. Việc ghi giảm giá gốc hàng tồn kho cho bằng với giá trị thuần có thể thực hiện được là phù hợp với nguyên tắc tài sản không được phản ánh lớn hơn giá trị thực hiện ước tính từ việc bán hay sử dụng chúng.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e19.Cuối kỳ kế toán năm, khi giá trị thuần có thể thực hiện được của hàng tồn kho nhỏ hơn giá gốc thì phải lập dự phòng giảm giá hàng tồn kho. Số dự phòng giảm giá hàng tồn kho được lập là số chênh lệch giữa giá gốc của hàng tồn kho lớn hơn giá trị thuần có thể thực hiện được của chúng. Việc lập dự phòng giảm giá hàng tồn kho được thực hiện trên cơ sở từng mặt hàng tồn kho. Đối với dịch vụ cung cấp dở dang, việc lập dự phòng giảm giá hàng tồn kho được tính theo từng loại dịch vụ có mức giá riêng biệt.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e20.Việc ước tính giá trị thuần có thể thực hiện được của hàng tồn kho phải dựa trên bằng chứng tin cậy thu thập được tại thời điểm ước tính. Việc ước tính này phải tính đến sự biến động của giá cả hoặc chi phí trực tiếp liên quan đến các sự kiện diễn ra sau ngày kết thúc năm tài chính, mà các sự kiện này được xác nhận với các điều kiện hiện có ở thời điểm ước tính.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e21.Khi ước tính giá trị thuần có thể thực hiện được phải tính đến mục đích của việc dự trữ hàng tồn kho. Ví dụ, giá trị thuần có thể thực hiện được của lượng hàng tồn kho dự trữ để đảm bảo cho các hợp đồng bán hàng hoặc cung cấp dịch vụ không thể hủy bỏ phải dựa vào giá trị trong hợp đồng. Nếu số hàng đang tồn kho lớn hơn số hàng cần cho hợp đồng thì giá trị thuần có thể thực hiện được của số chênh lệch giữa hàng đang tồn kho lớn hơn số hàng cần cho hợp đồng được đánh giá trên cơ sở giá bán ước tính.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e22.Nguyên liệu, vật liệu và công cụ, dụng cụ dự trữ để sử dụng cho mục đích sản xuất sản phẩm không được đánh giá thấp hơn giá gốc nếu sản phẩm do chúng góp phần cấu tạo nên sẽ được bán bằng hoặc cao hơn giá thành sản xuất của sản phẩm. Khi có sự giảm giá của nguyên liệu, vật liệu, công cụ, dụng cụ mà giá thành sản xuất sản phẩm cao hơn giá trị thuần có thể thực hiện được, thì nguyên liệu, vật liệu, công cụ, dụng cụ tồn kho được đánh giá giảm xuống bằng với giá trị thuần có thể thực hiện được của chúng.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e23.Cuối kỳ kế toán năm tiếp theo phải thực hiện đánh giá mới về giá trị thuần có thể thực hiện được của hàng tồn kho cuối năm đó. Trường hợp cuối kỳ kế toán năm nay, nếu khoản dự phòng giảm giá hàng tồn kho phải lập thấp hơn khoản dự phòng giảm giá hàng tồn kho đã lập ở cuối kỳ kế toán năm trước thì số chênh lệch lớnhơn phải được hoàn nhập (theo quy định ở đoạn 24) để đảm bảo cho giá trị của hàng tồn kho phản ánh trên báo cáo tài chính là theo giá gốc (nếu giá gốc nhỏ hơn giá trị thuần có thể thực hiện được) hoặc theo giá trị thuần có thể thực hiện được (nếu giá gốc lớn hơn giá trị thuần có thể thực hiện được).\u003c/p\u003e\n   \u003cp style=\"text-align: center;\"\u003eGHI NHẬN CHI PHÍ\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e24. Khi bán hàng tồn kho, giá gốc của hàng tồn kho đã bán được ghi nhận là chi phí sản xuất, kinh doanh trong kỳ phù hợp với doanh thu liên quan đến chúng được ghi nhận.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eTất cả các khoản chênh lệch giữa khoản dự phòng giảm giá hàng tồn kho phải lập ở cuối niên độ kế toán năm nay lớn hơn khoản dự phòng giảm giá hàng tồn kho đã lập ở cuối niên độ kế toán năm trước, các khoản hao hụt, mất mát của hàng tồn kho (sau khi trừ (-) phần bồi thường do trách nhiệm cá nhân gây ra), và chi phí sản xuất chung không phân bổ được ghi nhận là chi phí sản xuất, kinh doanh trong kỳ.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eTrường hợp khoản dự phòng giảm giá hàng tồn kho được lập ở cuối niên độ kế toán năm nay nhỏ hơn khoản dự phòng giảm giá hàng tồn kho đã lập ở cuối niên độ kế toán năm trước, thì số chênh lệch lớn hơn phải được hoàn nhập, ghi giảm chi phí sản xuất, kinh doanh.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e25. Ghi nhận giá trị hàng tồn kho đã bán vào chi phí trong kỳ phải đảm bảo nguyên tắc phù hợp giữa chi phí và doanh thu.\u003c/p\u003e\n   \u003cp id=\"p-rc_69b9bf901a67bd6a-22\" style=\"font-size: 14px;\"\u003e26. Trường hợp một số loại hàng tồn kho được sử dụng để sản xuất ra tài sản cố định hoặc sử dụng như nhà xưởng, máy móc, thiết bị tự sản xuất thì giá gốc hàng tồn kho này được hạch toán vào giá trị tài sản cố định.\u003c/p\u003e\n   \u003cp style=\"text-align: center;\"\u003eTRÌNH BÀY BÁO CÁO TÀI CHÍNH\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e27. Trong báo cáo tài chính, doanh nghiệp phải trình bày:\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003ea) Các chính sách kế toán áp dụng trong việc đánh giá hàng tồn kho, gồm cả phương pháp tính giá trị hàng tồn kho;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eb) Giá gốc của tổng số hàng tồn kho và giá gốc của từng loại hàng tồn kho được phân loại phù hợp với doanh nghiệp;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003ec) Giá trị dự phòng giảm giá hàng tồn kho;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003ed) Giá trị hoàn nhập dự phòng giảm giá hàng tồn kho;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003ee) Những trường hợp hay sự kiện dẫn đến việc trích lập thêm hoặc hoàn nhập dự phòng giảm giá hàng tồn kho;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003ef) Giá trị ghi sổ của hàng tồn kho (giá gốc trừ (-) dự phòng giảm giá hàng tồn kho) đã dùng để thế chấp, cầm cố đảm bảo cho các khoản nợ phải trả.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px; font-family: 'Times New Roman', Times, serif;\"\u003e28. Trường hợp doanh nghiệp tính giá trị hàng tồn kho theo phương pháp nhập sau, xuất trước thì báo cáo tài chính phải phản ánh số chênh lệch giữa giá trị hàng tồn kho trình bày trong bảng cân đối kế toán với:\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003ea) Giá trị hàng tồn kho cuối kỳ được tính theo phương pháp nhập trước, xuất trước (nếu giá trị hàng tồn kho cuối kỳ tính theo phương pháp nhập trước, xuất trước nhỏ hơn giá trị hàng tồn kho cuối kỳ tính theo phương pháp bình quân gia quyền và giá trị thuần có thể thực hiện được); hoặc\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eVới giá trị hàng tồn kho cuối kỳ được tính theo phương pháp bình quân gia quyền (nếu giá trị hàng tồn kho cuối kỳ tính theo phương pháp bình quân gia quyền nhỏ hơn giá trị hàng tồn kho cuối kỳ tính theo phương pháp nhập trước, xuất trước và giá trị thuần có thể thực hiện được); hoặc\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eVới giá trị hàng tồn kho cuối kỳ được tính theo giá trị thuần có thể thực hiện được (nếu giá trị hàng tồn kho cuối kỳ tính theo giá trị thuần có thể thực hiện được nhỏ hơn giá trị hàng tồn kho tính theo phương pháp nhập trước, xuất trước và phương pháp bình quân gia quyền); hoặc\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eb) Giá trị hiện hành của hàng tồn kho cuối kỳ tại ngày lập bảng cân đối kế toán (nếu giá trị hiện hành của hàng tồn kho tại ngày lập bảng cân đối kế toán nhỏ hơn giá trị thuần có thể thực hiện được); hoặc với giá trị thuần có thể thực hiện được (nếu giá trị hàng tồn kho cuối kỳ tính theo giá trị thuần có thể thực hiện được nhỏ hơn giá trị hàng tồn kho cuối kỳ tính theo giá trị hiện hành tại ngày lập bảng cân đối kế toán).\u003c/p\u003e\n   \u003chr class=\"\" style=\"font-size: 14px;\"\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e29. Trình bày chi phí về hàng tồn kho trên báo cáo kết quả sản xuất, kinh doanh được phân loại chi phí theo chức năng.\u003c/p\u003e\n   \u003chr class=\"\" style=\"font-size: 14px;\"\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e30. Phân loại chi phí theo chức năng là hàng tồn kho được trình bày trong khoản mục “Giá vốn hàng bán” trong báo cáo kết quả kinh doanh, gồm:\u003c/p\u003e\n   \u003cul class=\"\" style=\"font-size: 14px;\"\u003e\n    \u003cli\u003eGiá gốc của hàng tồn kho đã bán;Khoản dự phòng giảm giá hàng tồn kho;Các khoản hao hụt, mất mát của hàng tồn kho sau khi trừ (-) phần bồi thường do trách nhiệm cá nhân gây ra;Chi phí sản xuất chung không được phân bổ.\u003c/li\u003e\n   \u003c/ul\u003e\n   \u003cp style=\"text-align: center;\"\u003eChuẩn mực số 3\u003c/p\u003e\n   \u003cp style=\"text-align: center;\"\u003eTÀI SẢN CỐ ĐỊNH HŨU HÌNH\u003c/p\u003e\n   \u003cp style=\"text-align: center;\"\u003e(ban hành và công bố theo Quyết định\u003c/p\u003e\n   \u003cp style=\"text-align: center;\"\u003esố 149/2001/QĐ-BTC ngày 31/12/2001 của Bộ trưởng Bộ Tài chính).\u003c/p\u003e\n   \u003cp style=\"text-align: center;\"\u003eQUY ĐỊNH CHUNG\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e01.Mục đích của Chuẩn mực này là quy định và hướng dẫn các nguyên tắc và phương pháp kế toán đối với tài sản cố định hữu hình, gồm: Tiêu chuẩn tài sản cố định hữu hình, thời điểm ghi nhận, xác định giá trị ban đầu, chi phí phát sinh sau ghi nhận ban đầu, xác định giá trị sau ghi nhận ban đầu, khấu hao, thanh lý tài sản cố định hữu hình và một số quy định khác làm cơ sở ghi sổ kế toán và lập báo cáo tài chính.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e02.Chuẩn mực này áp dụng cho kế toán tài sản cố định hữu hình, trừ khi có chuẩn mực kế toán khác quy định cho phép áp dụng nguyên tắc và phương pháp kế toán khác cho tài sản cố định hữu hình.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e03.Trường hợp chuẩn mực kế toán khác quy định phương pháp xác định và ghi nhận giá trị ban đầu của tài sản cố định hữu hình khác với phương pháp quy định trong Chuẩn mực này thì các nội dung khác của kế toán tài sản cố định hữu hình vẫn thực hiện theo các quy định của Chuẩn mực này.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e04.Doanh nghiệp phải áp dụng Chuẩn mực này ngay cả khi có ảnh hưởng do thay đổi giá cả, trừ khi có quy định liên quan đến việc đánh giá lại tài sản cố định hữu hình theo quyết định của Nhà nước.\u0026nbsp;\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e05.Các thuật ngữ trong chuẩn mực này được hiểu như sau:\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eTài sản cố định hữu hình: là những tài sản có hình thái vật chất do doanh nghiệp nắm giữ để sử dụng cho hoạt động sản xuất, kinh doanh phù hợp với tiêu chuẩn ghi nhận tài sản cố định hữu hình.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eNguyên giá: là toàn bộ các chi phí mà doanh nghiệp phải bỏ ra để có được tài sản cố định hữu hình tính đến thời điểm đưa tài sản đó vào trạng thái sẵn sàng sử dụng.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eKhấu hao: là sự phân bổ một cách có hệ thống giá trị phải khấu hao của tài sản cố định hữu hình trong suốt thời gian sử dụng hữu ích của tài sản đó.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eGiá trị phải khấu hao: là nguyên giá của tài sản cố định hữu hình ghi trên báo cáo tài chính, trừ (-) giá trị thanh lý ước tính của tài sản đó.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eThời gian sử dụng hữu ích: là thời gian mà tài sản cố định hữu hình phát huy được tác dụng cho sản xuất, kinh doanh, được tính bằng:\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003ea)Thời gian mà doanh nghiệp dự tính sử dụng tài sản cố định hữu hình, hoặc:\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eb)Số lượng sản phẩm, hoặc các đơn vị tính tương tự mà doanh nghiệp dự tính thu được từ việc sử dụng tài sản.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eGiá trị thanh lý: là giá trị ước tính thu được khi hết thời gian sử dụng hữu ích của tài sản, sau khi trừ (-) chi phí thanh lý ước tính.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eGiá trị hợp lý: là giá trị tài sản có thể được trao đổi giữa các bên có đầy đủ hiểu biết trong sự trao đổi ngang giá.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eGiá trị còn lại: là nguyên giá của tài sản cố định hữu hình sau khi trừ (-) số khấu hao lũy kế của tài sản đó.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eGiá trị có thể thu hồi: là giá trị ước tính thu được trong tương lai từ việc sử dụng tài sản, bao gồm cả giá trị thanh lý của chúng.\u003c/p\u003e\n   \u003cp style=\"text-align: center;\"\u003eNỘI DUNG CHUẨN MỰC\u003c/p\u003e\n   \u003cp style=\"text-align: center;\"\u003eGHI NHẬN TÀI SẢN CỐ ĐỊNH HỮU HÌNH\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e06.Tiêu chuẩn ghi nhận tài sản cố định hữu hình:\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eCác tài sản được ghi nhận là tài sản cố định hữu hình phải thỏa mãn đồng thời tất cả bốn (4) tiêu chuẩn ghi nhận sau:\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003ea)Chắc chắn thu được lợi ích kinh tế trong tương lai từ việc sử dụng tài sản đó;\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eb)Nguyên giá tài sản phải được xác định một cách đáng tin cậy;\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003ec)Thời gian sử dụng ước tính trên 1 năm;\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003ed)Có đủ tiêu chuẩn giá trị theo quy định hiện hành.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e07.Kế toán tài sản cố định hữu hình được phân loại theo nhóm tài sản có cùng tínhchất và mục đích sử dụng trong hoạt động sản xuất, kinh doanh của doanh nghiệp, gồm:\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003ea)Nhà cửa, vật kiến trúc;\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eb)Máy móc, thiết bị;\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003ec)Phương tiện vận tải, thiết bị truyền dẫn;\u0026nbsp;\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003ed)Thiết bị, dụng cụ quản lý;\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003ee)Vườn cây lâu năm, súc vật làm việc và cho sản phẩm;\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003ef)Tài sản cố định hữu hình khác.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e08. Tài sản cố định hữu hình thường là bộ phận chủ yếu trong tổng số tài sản\u0026nbsp;và đóng vai trò quan trọng trong việc thể hiện tình hình tài chính của doanh nghiệp, vì vậy, việc xác định một tài sản có được ghi nhận là tài sản cố định hữu hình hay là một khoản chi phí sản xuất, kinh doanh trong kỳ sẽ có ảnh hưởng đáng kể đến báo cáo kết quả hoạt động kinh doanh của doanh nghiệp.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e09.Khi xác định tiêu chuẩn thứ nhất (quy định tại mục a đoạn 06) của mỗi tài sản cố định hữu hình, doanh nghiệp phải xác định mức độ chắc chắn của việc thu được lợi ích kinh tế trong tương lai, dựa trên các bằng chứng hiện có tại thời điểm ghi nhận ban đầu và phải chịu mọi rủi ro liên quan.\u003c/p\u003e\n   \u003cp style=\"text-align: justify; font-family: 'Times New Roman', Times, serif;\"\u003eNhững tài sản sử dụng cho mục đích đảm bảo an toàn sản xuất, kinh doanh hoặc bảo vệ môi trường mặc dù không trực tiếp đem lại lợi ích kinh tế như các tài sản cố định khác nhưng chúng lại cần thiết cho doanh nghiệp trong việc đạt được các lợi ích kinh tế nhiều hơn từ các tài sản khác. Tuy nhiên, các tài sản này chỉ được ghi nhận là tài sản cố định hữu hình nếu nguyên giá của chúng và các tài sản có liên quan không vượt quá tổng giá trị có thể thu hồi từ các tài sản đó và các tài sản khác có liên quan. Ví dụ, một nhà máy hóa chất có thể phải lắp đặt các thiết bị và thực hiện quy trình chứa và bảo quản hóa chất mới để tuân thủ yêu cầu về bảo vệ môi trường đối với việc sản xuất và lưu trữ hóa chất độc. Các tài sản lắp đặt liên quan đi kèm chỉ được hạch toán là tài sản cố định hữu hình, nếu không có chúng, doanh nghiệp sẽ không thể hoạt động và bán sản phẩm hóa chất của mình.\u003c/p\u003e\n   \u003cp style=\"text-align: justify; font-family: 'Times New Roman', Times, serif; font-size: 14px;\"\u003e10. Tiêu chuẩn thứ hai (quy định tại mục b đoạn 06) cho việc ghi nhận tài sản cố định hữu hình thường đã được thỏa mãn vì nguyên giá tài sản được xác định thông qua mua sắm, trao đổi, hoặc tự xây dựng.\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e11. Khi xác định các bộ phận cấu thành tài sản cố định hữu hình, doanh nghiệp phải áp dụng các tiêu chuẩn tài sản cố định hữu hình cho từng trường hợp cụ thể. Doanh nghiệp có thể hợp nhất các bộ phận riêng biệt không chủ yếu, như khuôn đúc, công cụ, khuôn đập và áp dụng các tiêu chuẩn tài sản cố định hữu hình vào tổng giá trị đó. Các phụ tùng và thiết bị phụ trợ thường được coi là tài sản lưu động và được hạch toán vào chi phí khi sử dụng. Các phụ tùng chủ yếu và các thiết bị bảo trì được xác định là tài sản cố định hữu hình khi doanh nghiệp ước tính thời gian sử dụng chúng nhiều hơn một năm. Nếu phụ tùng và thiết bị bảo trì chỉ được dùng gắn liền với tài sản cố định hữu hình và việc sử dụng chúng là không thường xuyên thì chúng được hạch toán là tài sản cố định hữu hình riêng biệt và được khấu hao trong thời gian ít hơn thời gian sử dụng hữu ích của tài sản cố định hữu hình liên quan.\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e12. Trong từng trường hợp cụ thể, có thể phân bổ tổng chi phí của tài sản cho các bộ phận cấu thành của nó và hạch toán riêng biệt cho mỗi bộ phận cấu thành. Trường hợp này được áp dụng khi từng bộ phận cấu thành tài sản có thời gian sử dụng hữu ích khác nhau, hoặc góp phần tạo ra lợi ích kinh tế cho doanh nghiệp theo những tiêu chuẩn quy định khác nhau nên được sử dụng các tỷ lệ và các phương pháp khấu hao khác nhau. Ví dụ, một thân máy bay và động cơ của nó cần được hạch toán thành hai tài sản cố định hữu hình riêng biệt, có tỷ lệ khấu hao khác nhau, nếu chúng có thời gian sử dụng hữu ích khác nhau.\u003c/p\u003e\n   \u003chr class=\"\" style=\"font-size: 14px;\"\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eXÁC ĐỊNH GIÁ TRỊ BAN ĐẦU\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e13.Tài sản cố định hữu hình phải được xác định giá trị ban đầu theo nguyên giá.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eXÁC ĐỊNH NGUYÊN GIÁ TÀI SẢN CỐ ĐỊNH HỮU HÌNH\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eTRONG TỪNG TRƯỜNG HỢP\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eTài sản cố định hữu hình mua sắm\u003c/p\u003e\n   \u003cp id=\"p-rc_67b362086f07fe8e-26\" style=\"font-size: 14px;\"\u003e14. Nguyên giá tài sản cố định hữu hình mua sắm bao gồm giá mua (trừ (-) các khoản được chiết khấu thương mại hoặc giảm giá, các khoản thuế (không bao gồm các khoản thuế được hoàn lại) và các chi phí liên quan trực tiếp đến việc đưa tài sản vào trạng thái sẵn sàng sử dụng, như: chi phí chuẩn bị mặt bằng; chi phí vận chuyển và bốc xếp ban đầu; chi phí lắp đặt, chạy thử (trừ (-) các khoản thu hồi về sản phẩm, phế liệu do chạy thử); chi phí chuyên gia và các chi phí liên quan trực tiếp khác\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003eĐối với tài sản cố định hữu hình hình thành do đầu tư xây dựng theo phương thức giao thầu, nguyên giá là giá quyết toán công trình đầu tư xây dựng, các chi phí liên quan trực tiếp khác và lệ phí trước bạ (nếu có).\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e15. Trường hợp mua tài sản cố định hữu hình là nhà cửa, vật kiến trúc gắn liền với quyền sử dụng đất thì giá trị quyền sử dụng đất phải được xác định riêng biệt và ghi nhận là tài sản cố định vô hình.\u003c/p\u003e\n   \u003cp id=\"p-rc_67b362086f07fe8e-29\" style=\"font-size: 14px;\"\u003e16. Trường hợp tài sản cố định hữu hình mua sắm được thanh toán theo phương thức trả chậm, nguyên giá tài sản cố định đó được phản ánh theo giá mua trả ngay tại thời điểm mua. Khoản chênh lệch giữa tổng số tiền phải thanh toán và giá mua trả ngay được hạch toán vào chi phí theo kỳ hạn thanh toán, trừ khi số chênh lệch đó được tính vào nguyên giá tài sản cố định hữu hình (vốn hóa) theo quy định của chuẩn mực kế toán \"Chi phí đi vay\".\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e17. Các khoản chi phí phát sinh, như: Chi phí quản lý hành chính, chi phí sản xuất chung, chi phí chạy thử và các chi phí khác... nếu không liên quan trực tiếp đến việc mua sắm và đưa tài sản cố định vào trạng thái sẵn sàng sử dụng thì không được tính vào nguyên giá tài sản cố định hữu hình. Các khoản lỗ ban đầu do máy móc không hoạt động đúng như dự tính được hạch toán vào chi phí sản xuất, kinh doanh trong kỳ.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eTài sản cố định hữu hình tự xây dựng hoặc tự chế\u003c/p\u003e\n   \u003cp id=\"p-rc_98af80b0855d862a-39\" style=\"font-size: 14px;\"\u003e18. Nguyên giá tài sản cố định hữu hình tự xây dựng hoặc tự chế là giá thành thực tế của tài sản cố định tự xây dựng, hoặc tự chế cộng (+) chi phí lắp đặt, chạy thử. Trường hợp doanh nghiệp dùng sản phẩm do mình sản xuất ra để chuyển thành tài sản cố định thì nguyên giá là chi phí sản xuất sản phẩm đó cộng (+) các chi phí trực tiếp liên quan đến việc đưa tài sản cố định vào trạng thái sẵn sàng sử dụng. Trong các trường hợp trên, mọi khoản lãi nội bộ không được tính vào nguyên giá của các tài sản đó. Các chi phí không hợp lý, như nguyên liệu, vật liệu lãng phí, lao động hoặc các khoản chi phí khác sử dụng vượt quá mức bình thường trong quá trình tự xây dựng hoặc tự chế không được tính vào nguyên giá tài sản cố định hữu hình.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eTài sản cố định hữu hình thuê tài chính\u003c/p\u003e\n   \u003cp id=\"p-rc_98af80b0855d862a-40\" style=\"font-size: 14px;\"\u003e19. Trường hợp đi thuê tài sản cố định hữu hình theo hình thức thuê tài chính, nguyên giá tài sản cố định được xác định theo quy định của chuẩn mực kế toán \"Thuê tài sản\".\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eTài sản cố định hữu hình mua dưới hình thức trao đổi\u003c/p\u003e\n   \u003cp id=\"p-rc_98af80b0855d862a-41\" style=\"font-size: 14px;\"\u003e20. Nguyên giá tài sản cố định hữu hình mua dưới hình thức trao đổi với một tài sản cố định hữu hình không tương tự hoặc tài sản khác được xác định theo giá trị hợp lý của tài sản cố định hữu hình nhận về, hoặc giá trị hợp lý của tài sản đem trao đổi, sau khi điều chỉnh các khoản tiền hoặc tương đương tiền trả thêm hoặc thu về.\u003c/p\u003e\n   \u003cp id=\"p-rc_98af80b0855d862a-42\" style=\"font-size: 14px;\"\u003e21. Nguyên giá tài sản cố định hữu hình mua dưới hình thức trao đổi với một tài sản cố định hữu hình tương tự, hoặc có thể hình thành do được bán để đổi lấy quyền sở hữu một tài sản tương tự (tài sản tương tự là tài sản có công dụng tương tự, trong cùng lĩnh vực kinh doanh và có giá trị tương đương). Trong cả hai trường hợp không có bất kỳ khoản lãi hay lỗ nào được ghi nhận trong quá trình trao đổi. Nguyên giá tài sản cố định nhận về được tính bằng giá trị còn lại của tài sản cố định đem trao đổi. Ví dụ: Việc trao đổi các tài sản cố định hữu hình tương tự như trao đổi máy móc, thiết bị, phương tiện vận tải, các cơ sở dịch vụ hoặc tài sản cố định hữu hình khác.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eTài sản cố định hữu hình tăng từ các nguồn khác\u003c/p\u003e\n   \u003cp id=\"p-rc_98af80b0855d862a-43\" style=\"font-size: 14px;\"\u003e22. Nguyên giá tài sản cố định hữu hình được tài trợ, được biếu tặng, được ghi nhận ban đầu theo giá trị hợp lý ban đầu. Trường hợp không ghi nhận theo giá trị hợp lý ban đầu thì doanh nghiệp ghi nhận theo giá trị danh nghĩa cộng (+) các chi phí liên quan trực tiếp đến việc đưa tài sản vào trạng thái sẵn sàng sử dụng.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e\u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp;CHI PHÍ PHÁT SINH SAU GHI NHẬN BAN ĐẦU\u003c/p\u003e\n   \u003cp id=\"p-rc_98af80b0855d862a-44\" style=\"font-size: 14px;\"\u003e23. Các chi phí phát sinh sau ghi nhận ban đầu tài sản cố định hữu hình được ghi tăng nguyên giá của tài sản nếu các chi phí này chắc chắn làm tăng lợi ích kinh tế trong tương lai do sử dụng tài sản đó. Các chi phí phát sinh không thỏa mãn điều kiện trên phải được ghi nhận là chi phí sản xuất, kinh doanh trong kỳ.\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e24. Các chi phí phát sinh sau ghi nhận ban đầu tài sản cố định hữu hình được ghi tăng nguyên giá của tài sản nếu chúng thực sự cải thiện trạng thái hiện tại so với trạng thái tiêu chuẩn ban đầu của tài sản đó, như:\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003ea) Thay đổi bộ phận của tài sản cố định hữu hình làm tăng thời gian sử dụng hữu ích, hoặc làm tăng công suất sử dụng của chúng;\u003c/p\u003e\n   \u003cp id=\"p-rc_98af80b0855d862a-46\" style=\"font-size: 14px;\"\u003eb) Cải tiến bộ phận của tài sản cố định hữu hình làm tăng đáng kể chất lượng sản phẩm sản xuất ra;\u003c/p\u003e\n   \u003cp id=\"p-rc_98af80b0855d862a-47\" style=\"font-size: 14px;\"\u003ec) Áp dụng quy trình công nghệ sản xuất mới làm giảm chi phí hoạt động của tài sản so với trước.\u003c/p\u003e\n   \u003cp id=\"p-rc_98af80b0855d862a-48\" style=\"font-size: 14px;\"\u003e25. Chi phí về sửa chữa và bảo dưỡng tài sản cố định hữu hình nhằm mục đích khôi phục hoặc duy trì khả năng đem lại lợi ích kinh tế của tài sản theo trạng thái hoạt động tiêu chuẩn ban đầu được tính vào chi phí sản xuất, kinh doanh trong kỳ.\u003c/p\u003e\n   \u003cp id=\"p-rc_a94de1a72c90fa9a-59\" style=\"font-size: 14px;\"\u003e26. Việc hạch toán các chi phí phát sinh sau ghi nhận ban đầu tài sản cố định hữu hình phải căn cứ vào từng trường hợp cụ thể và khả năng thu hồi các chi phí phát sinh sau. Khi giá trị còn lại của tài sản cố định hữu hình đã bao gồm các khoản giảm về lợi ích kinh tế thì các chi phí phát sinh sau để khôi phục các lợi ích kinh tế từ tài sản đó sẽ được tính vào nguyên giá tài sản cố định nếu giá trị còn lại của tài sản cố định không vượt quá giá trị có thể thu hồi từ tài sản đó. Trường hợp trong giá mua tài sản cố định hữu hình đã bao gồm nghĩa vụ của doanh nghiệp phải bỏ thêm các khoản chi phí để đưa tài sản vào trạng thái sẵn sàng sử dụng thì việc vốn hóa các chi phí phát sinh sau cũng phải căn cứ vào khả năng thu hồi chi phí. Ví dụ khi mua một ngôi nhà đòi hỏi doanh nghiệp phải sửa chữa trước khi sử dụng thì chi phí sửa chữa ngôi nhà được tính vào nguyên giá của tài sản nếu giá trị đó có thể thu hồi được từ việc sử dụng ngôi nhà trong tương lai.\u003c/p\u003e\n   \u003cp id=\"p-rc_a94de1a72c90fa9a-60\" style=\"font-size: 14px;\"\u003e27. Trường hợp một số bộ phận của tài sản cố định hữu hình đòi hỏi phải được thay thế thường xuyên, được hạch toán là các tài sản cố định độc lập nếu các bộ phận đó thỏa mãn đủ bốn (4) tiêu chuẩn quy định cho tài sản cố định hữu hình. Ví dụ máy điều hòa nhiệt độ trong một ngôi nhà có thể phải thay thế nhiều lần trong suốt thời gian sử dụng hữu ích của ngôi nhà đó thì các khoản chi phí phát sinh trong việc thay thế hay khôi phục máy điều hòa được hạch toán thành một tài sản độc lập và giá trị máy điều hòa khi được thay thế sẽ được ghi giảm.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e\u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp;XÁC ĐỊNH GIÁ TRỊ SAU\u0026nbsp;GHI NHẬN BAN ĐẦU\u003c/p\u003e\n   \u003cp id=\"p-rc_a94de1a72c90fa9a-61\" style=\"font-size: 14px;\"\u003e28. Sau khi ghi nhận ban đầu, trong quá trình sử dụng, tài sản cố định hữu hình được xác định theo nguyên giá, khấu hao lũy kế và giá trị còn lại. Trường hợp tài sản cố định hữu hình được đánh giá lại theo quy định của Nhà nước thì nguyên giá, khấu hao lũy kế và giá trị còn lại phải được điều chỉnh theo kết quả đánh giá lại. Chênh lệch do đánh giá lại tài sản cố định hữu hình được xử lý và kế toán theo quy định của Nhà nước.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e\u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; KHẤU HAO\u003c/p\u003e\n   \u003cp id=\"p-rc_a94de1a72c90fa9a-62\" style=\"font-size: 14px;\"\u003e29. Giá trị phải khấu hao của tài sản cố định hữu hình được phân bổ một cách có hệ thống trong thời gian sử dụng hữu ích của chúng. Phương pháp khấu hao phải phù hợp với lợi ích kinh tế mà tài sản đem lại cho doanh nghiệp. Số khấu hao của từng kỳ được hạch toán vào chi phí sản xuất, kinh doanh trong kỳ, trừ khi chúng được tính vào giá trị của các tài sản khác, như: khấu hao tài sản cố định hữu hình dùng cho các hoạt động trong giai đoạn triển khai là một bộ phận chi phí cấu thành nguyên giá tài sản cố định vô hình (theo quy định của chuẩn mực tài sản cố định vô hình), hoặc chi phí khấu hao tài sản cố định hữu hình dùng cho quá trình tự xây dựng hoặc tự chế các tài sản khác.\u003c/p\u003e\n   \u003cp id=\"p-rc_a94de1a72c90fa9a-63\" style=\"font-size: 14px;\"\u003e30. Lợi ích kinh tế do tài sản cố định hữu hình đem lại được doanh nghiệp khai thác dần bằng cách sử dụng các tài sản đó. Tuy nhiên, các nhân tố khác, như: sự lạc hậu về kỹ thuật, sự hao mòn của tài sản do chúng không được sử dụng thường dẫn đến sự suy giảm lợi ích kinh tế mà doanh nghiệp ước tính các tài sản đó sẽ đem lại. Do đó, khi xác định thời gian sử dụng hữu ích của tài sản cố định hữu hình phải xem xét các yếu tố sau:\u003c/p\u003e\n   \u003cp id=\"p-rc_a94de1a72c90fa9a-64\" style=\"font-size: 14px;\"\u003ea) Mức độ sử dụng ước tính của doanh nghiệp đối với tài sản đó. Mức độ sử dụng được đánh giá thông qua công suất hoặc sản lượng dự tính;\u003c/p\u003e\n   \u003cp id=\"p-rc_a94de1a72c90fa9a-65\" style=\"font-size: 14px;\"\u003eb) Mức độ hao mòn phụ thuộc vào các nhân tố liên quan trong quá trình sử dụng tài sản, như: số ca làm việc, việc sửa chữa và bảo dưỡng của doanh nghiệp đối với tài sản, cũng như việc bảo quản chúng trong những thời kỳ không hoạt động;\u003c/p\u003e\n   \u003cp id=\"p-rc_a94de1a72c90fa9a-66\" style=\"font-size: 14px;\"\u003ec) Hao mòn vô hình phát sinh do việc thay đổi hay cải tiến dây chuyền công nghệ hay do sự thay đổi nhu cầu của thị trường về sản phẩm hoặc dịch vụ do tài sản đó sản xuất ra;\u003c/p\u003e\n   \u003cp id=\"p-rc_a94de1a72c90fa9a-67\" style=\"font-size: 14px;\"\u003ed) Giới hạn có tính pháp lý trong việc sử dụng tài sản, như ngày hết hạn hợp đồng của tài sản thuê tài chính.\u003c/p\u003e\n   \u003cp id=\"p-rc_a94de1a72c90fa9a-68\" style=\"font-size: 14px;\"\u003e31. Thời gian sử dụng hữu ích của tài sản cố định hữu hình do doanh nghiệp xác định chủ yếu dựa trên mức độ sử dụng ước tính của tài sản. Tuy nhiên, do chính sách quản lý tài sản của doanh nghiệp mà thời gian sử dụng hữu ích ước tính của tài sản có thể ngắn hơn thời gian sử dụng hữu ích thực tế của nó. Vì vậy, việc ước tính thời gian sử dụng hữu ích của một tài sản cố định hữu hình còn phải dựa trên kinh nghiệm của doanh nghiệp đối với các tài sản cùng loại.\u003c/p\u003e\n   \u003cp id=\"p-rc_a94de1a72c90fa9a-69\" style=\"font-size: 14px;\"\u003e32. Ba phương pháp khấu hao tài sản cố định hữu hình, gồm:\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003ePhương pháp khấu hao đường thẳng;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003ePhương pháp khấu hao theo số dư giảm dần;\u003c/p\u003e\n   \u003cp id=\"p-rc_a94de1a72c90fa9a-70\" style=\"font-size: 14px;\"\u003ePhương pháp khấu hao theo số lượng sản phẩm.\u003c/p\u003e\n   \u003cp id=\"p-rc_a94de1a72c90fa9a-71\" style=\"font-size: 14px;\"\u003eTheo phương pháp khấu hao đường thẳng, số khấu hao hàng năm không thay đổi trong suốt thời gian sử dụng hữu ích của tài sản. Theo phương pháp khấu hao theo số dư giảm dần, số khấu hao hàng năm giảm dần trong suốt thời gian sử dụng hữu ích của tài sản. Phương pháp khấu hao theo số lượng sản phẩm dựa trên tổng số đơn vị sản phẩm ước tính tài sản có thể tạo ra.\u003c/p\u003e\n   \u003cp id=\"p-rc_a94de1a72c90fa9a-72\" style=\"font-size: 14px;\"\u003ePhương pháp khấu hao do doanh nghiệp xác định để áp dụng cho từng tài sản cố định hữu hình phải được thực hiện nhất quán, trừ khi có sự thay đổi trong cách thức sử dụng tài sản đó. Doanh nghiệp không được tiếp tục tính khấu hao đối với những tài sản cố định hữu hình đã khấu hao hết giá trị nhưng vẫn còn sử dụng vào hoạt động sản xuất, kinh doanh.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e\u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp;XEM XÉT LẠI THỜI GIAN SỬ DỤNG HỮU ÍCH\u003c/p\u003e\n   \u003cp id=\"p-rc_a94de1a72c90fa9a-73\" style=\"font-size: 14px;\"\u003e33. Thời gian sử dụng hữu ích của tài sản cố định hữu hình phải được xem xét lại theo định kỳ, thường là cuối năm tài chính. Nếu có sự thay đổi đáng kể trong việc đánh giá thời gian sử dụng hữu ích của tài sản thì phải điều chỉnh mức khấu hao.\u003c/p\u003e\n   \u003cp id=\"p-rc_a94de1a72c90fa9a-74\" style=\"font-size: 14px;\"\u003e34. Trong quá trình sử dụng tài sản cố định, khi đã xác định chắc chắn là thời gian sử dụng hữu ích không còn phù hợp thì phải điều chỉnh thời gian sử dụng hữu ích và tỷ lệ khấu hao cho năm hiện hành và các năm tiếp theo và được thuyết minh trong báo cáo tài chính. Ví dụ: Thời gian sử dụng hữu ích có thể được kéo dài thêm do việc cải thiện trạng thái của tài sản vượt trên trạng thái tiêu chuẩn ban đầu của nó, hoặc các thay đổi về kỹ thuật hay thay đổi nhu cầu về sản phẩm do một máy móc sản xuất ra có thể làm giảm thời gian sử dụng hữu ích của nó.\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e35. Chế độ sửa chữa và bảo dưỡng tài sản cố định hữu hình có thể kéo dài thời gian sử dụng hữu ích thực tế hoặc làm tăng giá trị thanh lý ước tính của tài sản nhưng doanh nghiệp không được thay đổi mức khấu hao của tài sản.\u003c/p\u003e\n   \u003cp style=\"text-align: center;\"\u003eXEM XÉT LẠI PHƯƠNG PHÁP KHẤU HAO\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e36. Phương pháp khấu hao tài sản cố định hữu hình phải được xem xét lại theo định kỳ, thường là cuối năm tài chính. Nếu có sự thay đổi đáng kể trong cách thức sử dụng tài sản để đem lại lợi ích cho doanh nghiệp thì được thay đổi phương pháp khấu hao và mức khấu hao tính cho năm hiện hành và các năm tiếp theo.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e\u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp;NHƯỢNG BÁN VÀ THANH LÝ TÀI SẢN CỐ ĐỊNH HỮU HÌNH\u003c/p\u003e\n   \u003cp id=\"p-rc_112a344e2f86036a-129\" style=\"font-size: 14px;\"\u003e37. Tài sản cố định hữu hình được ghi giảm khi thanh lý, nhượng bán.\u003c/p\u003e\n   \u003cp id=\"p-rc_112a344e2f86036a-130\" style=\"font-size: 14px;\"\u003e38. Lãi hay lỗ phát sinh do thanh lý, nhượng bán tài sản cố định hữu hình được xác định bằng số chênh lệch giữa thu nhập với chi phí thanh lý, nhượng bán cộng (+) giá trị còn lại của tài sản cố định hữu hình. Số lãi, lỗ này được ghi nhận là một khoản thu nhập hay chi phí trên báo cáo kết quả hoạt động kinh doanh trong kỳ.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e\u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp;TRÌNH BÀY BÁO CÁO TÀI CHÍNH\u003c/p\u003e\n   \u003cp id=\"p-rc_112a344e2f86036a-131\" style=\"font-size: 14px;\"\u003e39. Trong báo cáo tài chính, doanh nghiệp phải trình bày theo từng loại tài sản cố định hữu hình về những thông tin sau:\u003c/p\u003e\n   \u003cp id=\"p-rc_112a344e2f86036a-132\" style=\"font-size: 14px;\"\u003ea) Phương pháp xác định nguyên giá tài sản cố định hữu hình;\u003c/p\u003e\n   \u003cp id=\"p-rc_112a344e2f86036a-133\" style=\"font-size: 14px;\"\u003eb) Phương pháp khấu hao; thời gian sử dụng hữu ích hoặc tỷ lệ khấu hao;\u003c/p\u003e\n   \u003cp id=\"p-rc_112a344e2f86036a-134\" style=\"font-size: 14px;\"\u003ec) Nguyên giá, khấu hao lũy kế và giá trị còn lại vào đầu năm và cuối kỳ;\u003c/p\u003e\n   \u003cp id=\"p-rc_112a344e2f86036a-135\" style=\"font-size: 14px;\"\u003ed) Bản Thuyết minh báo cáo tài chính (Phần tài sản cố định hữu hình) phải trình bày các thông tin:\u003c/p\u003e\n   \u003cp id=\"p-rc_112a344e2f86036a-136\" style=\"font-size: 14px;\"\u003eNguyên giá tài sản cố định hữu hình tăng, giảm trong kỳ;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eSố khấu hao trong kỳ, tăng, giảm và lũy kế đến cuối kỳ;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eGiá trị còn lại của tài sản cố định hữu hình đã dùng để thế chấp, cầm cố cho các khoản vay;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eChi phí đầu tư xây dựng cơ bản dở dang;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eCác cam kết về việc mua, bán tài sản cố định hữu hình có giá trị lớn trong tương lai;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eGiá trị còn lại của tài sản cố định hữu hình tạm thời không được sử dụng.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eNguyên giá của tài sản cố định hữu hình đã khấu hao hết nhưng vẫn còn sử dụng;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eGiá trị còn lại của tài sản cố định hữu hình đang chờ thanh lý;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eCác thay đổi khác về tài sản cố định hữu hình.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e40. Việc xác định phương pháp khấu hao và ước tính thời gian sử dụng hữu ích của tài sản cố định hữu hình là vấn đề hoàn toàn mang tính chất xét đoán. Vì vậy, việc trình bày các phương pháp khấu hao áp dụng và thời gian sử dụng hữu ích ước tính của tài sản cố định hữu hình cho phép người sử dụng báo cáo tài chính xem xét mức độ đúng đắn của các chính sách do ban lãnh đạo doanh nghiệp đề ra và có cơ sở để so sánh với các doanh nghiệp khác.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e41. Doanh nghiệp phải trình bày bản chất và ảnh hưởng của sự thay đổi ước tính kế toán có ảnh hưởng trọng yếu tới kỳ kế toán hiện hành hoặc các kỳ tiếp theo. Các thông tin phải được trình bày khi có sự thay đổi trong các ước tính kế toán liên quan tới giá trị tài sản cố định hữu hình đã thanh lý hoặc đang chờ thanh lý, thời gian sử dụng hữu ích và phương pháp khấu hao.\u003c/p\u003e\n   \u003chr class=\"\" style=\"font-size: 14px;\"\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eChuẩn mục số 4\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eTÀI SẢN CỐ ĐỊNH VÔ HÌNH\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e(ban hành và công bố theo Quyết định số 149/2001/QĐ-BTCngày 31/12/2001\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003ecủa Bộ\u0026nbsp;trưởng Bộ Tài chính).\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eQUY ĐỊNH CHUNG\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e01. Mục đích của Chuẩn mực này là quy định và hướng dẫn các nguyên tắc và phương pháp kế toán tài sản cố định vô hình, gồm: tiêu chuẩn tài sản cố định vô hình, thời điểm ghi nhận, xác định giá trị ban đầu, chi phí phát sinh sau ghi nhận ban đầu, xác định giá trị sau ghi nhận ban đầu, khấu hao, thanh lý tài sản cố định vô hình và một số quy định khác làm cơ sở ghi sổ kế toán và nộp báo cáo tài chính.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e02. Chuẩn mực này áp dụng cho kế toán tài sản cố định vô hình, trừ khi có chuẩn mực kế toán khác quy định cho phép áp dụng nguyên tắc và phương pháp kế toán khác cho tài sản cố định vô hình.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e03. Một số tài sản cố định vô hình có thể chứa đựng trong hoặc trên thực thể vật chất. Ví dụ như đĩa compact (trong trường hợp phần mềm máy tính được ghi trong đĩa compact), văn bản pháp lý (trong trường hợp giấy phép hoặc bằng sáng chế). Để quyết định một tài sản bao gồm cả yếu tố vô hình và hữu hình được hạch toán theo quy định của chuẩn mực tài sản cố định hữu hình hay chuẩn mực tài sản cố định vô hình, doanh nghiệp phải căn cứ vào việc xác định yếu tố nào là quan trọng.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eVí dụ: Phần mềm của máy vi tính nếu là một bộ phận không thể tách rời với phần cứng của máy đó để máy có thể hoạt động được, thì phần mềm này là một bộ phận của máy và nó được coi là một bộ phận của tài sản cố định hữu hình. Trường hợp phần mềm là bộ phận có thể tách rời với phần cứng có liên quan thì phần mềm đó là một tài sản cố định vô hình.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e04. Chuẩn mực này quy định về các chi phí liên quan đến hoạt động quảng cáo, đào tạo nhân viên, thành lập doanh nghiệp, nghiên cứu và triển khai. Các hoạt động nghiên cứu và triển khai hướng tới việc phát triển tri thức, có thể tạo thành một tài sản thuộc dạng vật chất (ví dụ vật mẫu), nhưng yếu tố vật chất chỉ có vai trò thứ yếu so với thành phần vô hình là tri thức ẩn chứa trong tài sản đó.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e05. Tài sản cố định vô hình thuê tài chính sau khi được ghi nhận ban đầu, bên thuê phải kế toán tài sản cố định vô hình trong hợp đồng thuê tài chính theo Chuẩn mực này. Các quyền trong hợp đồng cấp phép đối với phim ảnh, chương trình thu băng video, tác phẩm kịch, bản thảo, bằng sáng chế và bản quyền thuộc phạm vi của chuẩn mực này.\u003c/p\u003e\n   \u003chr class=\"\" style=\"font-size: 14px;\"\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e06. Các thuật ngữ trong Chuẩn mực này được hiểu như sau:\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eTài sản: Là một nguồn lực:a) Doanh nghiệp kiểm soát được; vàb) Dự tính đem lại lợi ích kinh tế trong tương lai cho doanh nghiệp.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eTài sản cố định vô hình: Là tài sản không có hình thái vật chất nhưng xác định được giá trị và do doanh nghiệp nắm giữ, sử dụng trong sản xuất, kinh doanh, cung cấp dịch vụ hoặc cho các đối tượng khác thuê phù hợp với tiêu chuẩn ghi nhận tài sản cố định vô hình.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eNghiên cứu: Là hoạt động tìm kiếm ban đầu và có kế hoạch được tiến hành nhằm đạt được sự hiểu biết và tri thức khoa học hoặc kỹ thuật mới.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eTriển khai: Là hoạt động ứng dụng những kết quả nghiên cứu hoặc tri thức khoa học vào một kế hoạch hoặc thiết kế để sản xuất sản phẩm mới hoặc được cải tiến một cách cơ bản trước khi bắt đầu sản xuất hoặc sử dụng mang tính thương mại các vật liệu, dụng cụ, sản phẩm, các quy trình, hệ thống hoặc dịch vụ mới.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eNguyên giá: Là toàn bộ các chi phí mà doanh nghiệp phải bỏ ra để có được tài sản cố định vô hình tính đến thời điểm đưa tài sản đó vào sử dụng theo dự tính.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eKhấu hao: Là việc phân bổ có hệ thống giá trị phải khấu hao của tài sản cố định vô hình trong suốt thời gian sử dụng hữu ích của tài sản đó.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eGiá trị phải khấu hao: Là nguyên giá của tài sản cố định vô hình ghi trên báo cáo tài chính, trừ (-) giá trị thanh lý ước tính của tài sản đó.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eThời gian sử dụng hữu ích: Là thời gian mà tài sản cố định vô hình phát huy được tác dụng cho sản xuất, kinh doanh, được tính bằng:\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003ea) Thời gian mà doanh nghiệp dự tính sử dụng tài sản cố định vô hình; hoặcb) Số lượng sản phẩm, hoặc các đơn vị tính tương tự mà doanh nghiệp dự tính thu được từ việc sử dụng tài sản.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eGiá trị thanh lý: Là giá trị ước tính thu được khi hết thời gian sử dụng hữu ích của tài sản, sau khi trừ (-) chi phí thanh lý ước tính.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eGiá trị còn lại: Là nguyên giá của tài sản cố định vô hình sau khi trừ (-) số khấu hao lũy kế của tài sản đó.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eGiá trị hợp lý: Là giá trị tài sản có thể được trao đổi giữa các bên có đầy đủ hiểu biết trong sự trao đổi ngang giá.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eThị trường hoạt động: Là thị trường thỏa mãn đồng thời ba (3) điều kiện sau:a) Các sản phẩm được bán trên thị trường có tính tương đồng;b) Người mua và người bán có thể tìm thấy nhau vào bất kỳ lúc nào;c) Giá cả được công khai.\u003c/p\u003e\n   \u003chr class=\"\" style=\"font-size: 14px;\"\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eTÀI SẢN CỐ ĐỊNH VÔ HÌNH\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e07. Các doanh nghiệp thường đầu tư để có các nguồn lực vô hình, như: quyền sử dụng đất có thời hạn, phần mềm máy vi tính, bằng sáng chế, bản quyền, giấy phép khai thác thủy sản, hạn ngạch xuất khẩu, hạn ngạch nhập khẩu, giấy phép nhượng quyền, quan hệ kinh doanh với khách hàng hoặc nhà cung cấp, sự trung thành của khách hàng, thị phần và quyền tiếp thị...\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e08. Để xác định nguồn lực vô hình quy định trong đoạn số 07 thỏa mãn định nghĩa tài sản cố định vô hình cần phải xem xét các yếu tố: tính có thể xác định được, khả năng kiểm soát nguồn lực và tính chắc chắn của lợi ích kinh tế trong tương lai. Nếu một nguồn lực vô hình không thỏa mãn định nghĩa tài sản cố định vô hình thì chi phí phát sinh để tạo ra nguồn lực vô hình đó phải ghi nhận là chi phí sản xuất, kinh doanh trong kỳ hoặc chi phí trả trước. Riêng nguồn lực vô hình doanh nghiệp có được thông qua việc sáp nhập doanh nghiệp có tính chất mua lại được ghi nhận là lợi thế thương mại vào ngày phát sinh nghiệp vụ mua (theo quy định tại đoạn 46).\u003c/p\u003e\n   \u003chr class=\"\" style=\"font-size: 14px;\"\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eTính có thể xác định được\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e09. Tài sản cố định vô hình phải là tài sản có thể xác định được để có thể phân biệt một cách rõ ràng tài sản đó với lợi thế thương mại. Lợi thế thương mại phát sinh từ việc sáp nhập doanh nghiệp có tính chất mua lại được thể hiện bằng một khoản thanh toán do bên đi mua tài sản thực hiện để có thể thu được lợi ích kinh tế trong tương lai.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e10. Một tài sản cố định vô hình có thể xác định riêng biệt khi doanh nghiệp có thể đem tài sản cố định vô hình đó cho thuê, bán, trao đổi hoặc thu được lợi ích kinh tế cụ thể từ tài sản đó trong tương lai. Những tài sản chỉ tạo ra lợi ích kinh tế trong tương lai khi kết hợp với các tài sản khác nhưng vẫn được coi là tài sản có thể xác định riêng biệt nếu doanh nghiệp xác định được chắc chắn lợi ích kinh tế trong tương lai do tài sản đó đem lại.\u003c/p\u003e\n   \u003chr class=\"\" style=\"font-size: 14px;\"\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eKhả năng kiểm soát\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e11. Doanh nghiệp nắm quyền kiểm soát một tài sản nếu doanh nghiệp có quyền thu lợi ích kinh tế trong tương lai mà tài sản đó đem lại, đồng thời cũng có khả năng hạn chế sự tiếp cận của các đối tượng khác đối với lợi ích đó. Khả năng kiểm soát của doanh nghiệp đối với lợi ích kinh tế trong tương lai từ tài sản cố định vô hình, thông thường có nguồn gốc từ quyền pháp lý.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e12. Tri thức về thị trường và hiểu biết chuyên môn có thể mang lại lợi ích kinh tế trong tương lai. Doanh nghiệp có thể kiểm soát lợi ích đó khi có ràng buộc bằng quyền pháp lý, ví dụ: bản quyền, giấy phép khai thác thủy sản.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e13. Doanh nghiệp có đội ngũ nhân viên lành nghề và thông qua việc đào tạo, doanh nghiệp có thể xác định được sự nâng cao kiến thức của nhân viên sẽ mang lại lợi ích kinh tế trong tương lai, nhưng doanh nghiệp không đủ khả năng kiểm soát lợi ích kinh tế đó, vì vậy không được ghi nhận là tài sản cố định vô hình. Tài năng lãnh đạo và kỹ thuật chuyên môn cũng không được ghi nhận là tài sản cố định vô hình trừ khi tài sản này được bảo đảm bằng các quyền pháp lý để sử dụng nó và để thu được lợi ích kinh tế trong tương lai đồng thời thỏa mãn các quy định về định nghĩa tài sản cố định vô hình và tiêu chuẩn ghi nhận tài sản cố định vô hình.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e14. Doanh nghiệp có danh sách khách hàng hoặc thị phần nhưng do không có quyền pháp lý hoặc biện pháp khác để bảo vệ hoặc kiểm soát các lợi ích kinh tế từ các mối quan hệ với khách hàng và sự trung thành của họ, vì vậy không được ghi nhận là tài sản cố định vô hình.\u003c/p\u003e\n   \u003chr class=\"\" style=\"font-size: 14px;\"\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eLợi ích kinh tế trong tương lai\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e15. Lợi ích kinh tế trong tương lai mà tài sản cố định vô hình đem lại cho doanh nghiệp có thể bao gồm: tăng doanh thu, tiết kiệm chi phí, hoặc lợi ích khác xuất phát từ việc sử dụng tài sản cố định vô hình.\u003c/p\u003e\n   \u003chr class=\"\" style=\"font-size: 14px;\"\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eNỘI DUNG CỦA CHUẨN MỰC\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eGHI NHẬN VÀ XÁC ĐỊNH GIÁ TRỊ BAN ĐẦU\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e16. Một tài sản vô hình được ghi nhận là tài sản cố định vô hình phải thỏa mãn đồng thời: định nghĩa về tài sản cố định vô hình và bốn (4) tiêu chuẩn ghi nhận sau:\u003c/p\u003e\n   \u003cul class=\"\" style=\"font-size: 14px;\"\u003e\n    \u003cli\u003eChắc chắn thu được lợi ích kinh tế trong tương lai do tài sản đó mang lại;Nguyên giá tài sản phải được xác định một cách đáng tin cậy;Thời gian sử dụng ước tính trên 1 năm;Có đủ tiêu chuẩn giá trị theo quy định hiện hành.\u003c/li\u003e\n   \u003c/ul\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e17. Doanh nghiệp phải xác định được mức độ chắc chắn khả năng thu được lợi ích kinh tế trong tương lai bằng việc sử dụng các giả định hợp lý và có cơ sở về các điều kiện kinh tế tồn tại trong suốt thời gian sử dụng hữu ích của tài sản đó.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e18. Tài sản cố định vô hình phải được xác định giá trị ban đầu theo nguyên giá.\u003c/p\u003e\n   \u003chr class=\"\" style=\"font-size: 14px;\"\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eXÁC ĐỊNH NGUYÊN GIÁ TÀI SẢN CỐ ĐỊNH VÔ HÌNH TRONG TỪNG TRƯỜNG HỢP\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eMua tài sản cố định vô hình riêng biệt\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e19. Nguyên giá tài sản cố định vô hình mua riêng biệt bao gồm giá mua (trừ (-) các khoản được chiết khấu thương mại hoặc giảm giá), các khoản thuế (không bao gồm các khoản thuế được hoàn lại) và các chi phí liên quan trực tiếp đến việc đưa tài sản vào sử dụng theo dự tính.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e20. Trường hợp quyền sử dụng đất được mua cùng với mua nhà cửa, vật kiến trúc trên đất thì giá trị quyền sử dụng đất phải được xác định riêng biệt và ghi nhận là tài sản cố định vô hình.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e21. Trường hợp tài sản cố định vô hình mua sắm được thanh toán theo phương thức trả chậm, nguyên giá của tài sản cố định vô hình được phản ánh theo giá mua trả ngay tại thời điểm mua. Khoản chênh lệch giữa tổng số tiền phải thanh toán và giá mua trả ngay được hạch toán vào chi phí sản xuất, kinh doanh theo kỳ hạn thanh toán, trừ khi số chênh lệch đó được tính vào nguyên giá tài sản cố định vô hình (vốn hóa) theo quy định của chuẩn mực kế toán “Chi phí đi vay”.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e22. Nếu tài sản cố định vô hình hình thành từ việc trao đổi thanh toán bằng chứng từ liên quan đến quyền sở hữu vốn của đơn vị, nguyên giá tài sản cố định vô hình là giá trị hợp lý của các chứng từ được phát hành liên quan đến quyền sở hữu vốn.\u003c/p\u003e\n   \u003chr class=\"\" style=\"font-size: 14px;\"\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eMua tài sản cố định vô hình từ việc sáp nhập doanh nghiệp\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e23. Nguyên giá tài sản cố định vô hình hình thành trong quá trình sáp nhập doanh nghiệp có tính chất mua lại là giá trị hợp lý của tài sản đó vào ngày mua (ngày sáp nhập doanh nghiệp).\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e24. Doanh nghiệp phải xác định nguyên giá tài sản cố định vô hình một cách đáng tin cậy để ghi nhận tài sản đó một cách riêng biệt. Giá trị hợp lý có thể là:\u003c/p\u003e\n   \u003cul class=\"\" style=\"font-size: 14px;\"\u003e\n    \u003cli\u003eGiá niêm yết tại thị trường hoạt động;Giá của nghiệp vụ mua bán tài sản cố định vô hình tương tự.\u003c/li\u003e\n   \u003c/ul\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e25. Nếu không có thị trường hoạt động cho tài sản thì nguyên giá của tài sản cố định vô hình được xác định bằng khoản tiền mà doanh nghiệp lẽ ra phải trả vào ngày mua tài sản trong điều kiện nghiệp vụ đó được thực hiện trên cơ sở khách quan dựa trên các thông tin tin cậy hiện có.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e26. Khi sáp nhập doanh nghiệp, tài sản cố định vô hình được ghi nhận như sau:a) Bên mua tài sản ghi nhận là tài sản cố định vô hình nếu tài sản đó đáp ứng được định nghĩa và tiêu chuẩn ghi nhận, kể cả trường hợp tài sản đó không được ghi nhận trong báo cáo tài chính của bên bán;b) Nếu không thể xác định được nguyên giá một cách đáng tin cậy thì tài sản đó không được ghi nhận riêng biệt mà hạch toán vào lợi thế thương mại.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e27. Khi không có thị trường hoạt động cho tài sản cố định vô hình được mua thông qua sáp nhập, thì nguyên giá là giá trị mà tại đó nó không tạo ra lợi thế thương mại có giá trị âm phát sinh vào ngày sáp nhập.\u003c/p\u003e\n   \u003chr class=\"\" style=\"font-size: 14px;\"\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eTài sản cố định vô hình là quyền sử dụng đất có thời hạn\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e28. Nguyên giá tài sản cố định vô hình là quyền sử dụng đất có thời hạn khi được giao đất hoặc số tiền trả khi nhận chuyển nhượng quyền sử dụng đất hợp pháp từ người khác, hoặc giá trị quyền sử dụng đất nhận góp vốn liên doanh.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e29. Trường hợp quyền sử dụng đất được chuyển nhượng cùng với mua nhà cửa, vật kiến trúc trên đất thì giá trị của nhà cửa, vật kiến trúc phải được xác định riên

g biệt và ghi nhận là tài sản cố định hữu hình.\u003c/p\u003e\n   \u003chr class=\"\" style=\"font-size: 14px;\"\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eTài sản cố định vô hình được Nhà nước cấp hoặc được tặng, biếu\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e30. Nguyên giá tài sản cố định vô hình được Nhà nước cấp hoặc được tặng, biếu được xác định theo giá trị hợp lý ban đầu cộng (+) các chi phí liên quan trực tiếp đến việc đưa tài sản vào sử dụng theo dự tính.\u003c/p\u003e\n   \u003chr class=\"\" style=\"font-size: 14px;\"\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eTài sản cố định vô hình mua dưới hình thức trao đổi\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e31. Nguyên giá tài sản cố định vô hình mua dưới hình thức trao đổi với một tài sản cố định vô hình không tương tự hoặc tài sản khác được xác định theo giá trị hợp lý của tài sản cố định vô hình nhận về hoặc bằng với giá trị hợp lý của tài sản đem trao đổi, sau khi điều chỉnh các khoản tiền hoặc tương đương tiền trả thêm hoặc thu về.\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-303\" style=\"font-size: 14px;\"\u003e32. Nguyên giá tài sản cố định vô hình mua dưới hình thức trao đổi với một tài sản cố định vô hình tương tự, hoặc có thể hình thành do được bán để đổi lấy quyền sở hữu một tài sản tương tự (tài sản tương tự là tài sản có công dụng tương tự, trong cùng lĩnh vực kinh doanh và có giá trị tương đương). Trong cả hai trường hợp không có bất kỳ khoản lãi hay lỗ nào được ghi nhận trong quá trình trao đổi. Nguyên giá tài sản cố định vô hình nhận về được tính bằng giá trị còn lại của tài sản cố định vô hình đem trao đổi.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eLợi thế thương mại được tạo ra từ nội bộ doanh nghiệp\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-304\" style=\"font-size: 14px;\"\u003e33. Lợi thế thương mại được tạo ra từ nội bộ doanh nghiệp không được ghi nhận là tài sản.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-305\" style=\"font-size: 14px;\"\u003e34. Chi phí phát sinh để tạo ra lợi ích kinh tế trong tương lai nhưng không hình thành tài sản cố định vô hình vì không đáp ứng được định nghĩa và tiêu chuẩn ghi nhận trong Chuẩn mực này, mà tạo nên lợi thế thương mại từ nội bộ doanh nghiệp. Lợi thế thương mại được tạo ra từ nội bộ doanh nghiệp không được ghi nhận là tài sản vì nó không phải là nguồn lực có thể xác định, không đánh giá được một cách đáng tin cậy và doanh nghiệp không kiểm soát được.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-306\" style=\"font-size: 14px;\"\u003e35. Khoản chênh lệch giữa giá trị thị trường của doanh nghiệp với giá trị tài sản thuần của doanh nghiệp ghi trên báo cáo tài chính được xác định tại một thời điểm không được ghi nhận là tài sản cố định vô hình do doanh nghiệp kiểm soát.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eTài sản cố định vô hình được tạo ra từ nội bộ doanh nghiệp\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-307\" style=\"font-size: 14px;\"\u003e36. Để đánh giá một tài sản vô hình được tạo ra từ nội bộ doanh nghiệp được ghi nhận vào ngày phát sinh nghiệp vụ đáp ứng được định nghĩa và tiêu chuẩn ghi nhận tài sản cố định vô hình, doanh nghiệp phải phân chia quá trình hình thành tài sản theo:\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-308\" style=\"font-size: 14px;\"\u003ea) Giai đoạn nghiên cứu; và\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003eb) Giai đoạn triển khai.\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-309\" style=\"font-size: 14px;\"\u003e37. Nếu doanh nghiệp không thể phân biệt giai đoạn nghiên cứu với giai đoạn triển khai của một dự án nội bộ để tạo ra tài sản cố định vô hình, doanh nghiệp phải hạch toán vào chi phí để xác định kết quả kinh doanh trong kỳ toàn bộ chi phí phát sinh liên quan đến dự án đó.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eGiai đoạn nghiên cứu\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-310\" style=\"font-size: 14px;\"\u003e38. Toàn bộ chi phí phát sinh trong giai đoạn nghiên cứu không được ghi nhận là tài sản cố định vô hình mà được ghi nhận là chi phí sản xuất, kinh doanh trong kỳ.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-311\" style=\"font-size: 14px;\"\u003e39. Ví dụ về các hoạt động trong giai đoạn nghiên cứu:\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-312\" style=\"font-size: 14px;\"\u003ea) Các hoạt động nghiên cứu, phát triển tri thức mới và hoạt động tìm kiếm, đánh giá và lựa chọn các phương án cuối cùng;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-313\" style=\"font-size: 14px;\"\u003eb) Việc ứng dụng các kết quả nghiên cứu hoặc các tri thức khác;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-314\" style=\"font-size: 14px;\"\u003ec) Việc tìm kiếm các phương pháp thay thế đối với các vật liệu, dụng cụ, sản phẩm, quy trình, dịch vụ;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-315\" style=\"font-size: 14px;\"\u003ed) Công thức, thiết kế, đánh giá và lựa chọn cuối cùng các phương pháp thay thế đối với các vật liệu, dụng cụ, sản phẩm, quy trình, hệ thống, dịch vụ mới hoặc cải tiến hơn.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eGiai đoạn triển khai\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-316\" style=\"font-size: 14px;\"\u003e40. Tài sản vô hình tạo ra trong giai đoạn triển khai được ghi nhận là tài sản cố định vô hình nếu thỏa mãn được bảy (7) điều kiện sau:\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-317\" style=\"font-size: 14px;\"\u003ea) Tính khả thi về mặt kỹ thuật đảm bảo cho việc hoàn thành và đưa tài sản vô hình vào sử dụng theo dự tính hoặc để bán;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-318\" style=\"font-size: 14px;\"\u003eb) Doanh nghiệp dự định hoàn thành tài sản vô hình để sử dụng hoặc để bán;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-319\" style=\"font-size: 14px;\"\u003ec) Doanh nghiệp có khả năng sử dụng hoặc bán tài sản vô hình đó;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-320\" style=\"font-size: 14px;\"\u003ed) Tài sản vô hình đó phải tạo ra được lợi ích kinh tế trong tương lai;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-321\" style=\"font-size: 14px;\"\u003ee) Có đầy đủ các nguồn lực về kỹ thuật, tài chính và các nguồn lực khác để hoàn tất các giai đoạn triển khai, bán hoặc sử dụng tài sản vô hình đó;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-322\" style=\"font-size: 14px;\"\u003eg) Có khả năng xác định một cách chắc chắn toàn bộ chi phí trong giai đoạn triển khai để tạo ra tài sản vô hình đó;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-323\" style=\"font-size: 14px;\"\u003ef) Ước tính có đủ tiêu chuẩn về thời gian sử dụng và giá trị theo quy định cho tài sản cố định vô hình.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-324\" style=\"font-size: 14px;\"\u003e41. Ví dụ về các hoạt động triển khai:\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-325\" style=\"font-size: 14px;\"\u003ea) Thiết kế, xây dựng và thử nghiệm các vật mẫu hoặc kiểu mẫu trước khi đưa vào sản xuất hoặc sử dụng;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-326\" style=\"font-size: 14px;\"\u003eb) Thiết kế các dụng cụ, khuôn mẫu, khuôn dẫn và khuôn dập liên quan đến công nghệ mới;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-327\" style=\"font-size: 14px;\"\u003ec) Thiết kế, xây dựng và vận hành xưởng thử nghiệm không có tính khả thi về mặt kinh tế cho hoạt động sản xuất mang tính thương mại;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-328\" style=\"font-size: 14px;\"\u003ed) Thiết kế xây dựng và sản xuất thử nghiệm một phương pháp thay thế các vật liệu, dụng cụ, sản phẩm, quy trình, hệ thống và dịch vụ mới hoặc được cải tiến.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-329\" style=\"font-size: 14px;\"\u003e42. Các nhãn hiệu hàng hóa, quyền phát hành, danh sách khách hàng và các khoản mục tương tự được hình thành trong nội bộ doanh nghiệp không được ghi nhận là tài sản cố định vô hình.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eNguyên giá tài sản cố định vô hình được tạo ra từ nội bộ doanh nghiệp\u003c/p\u003e\n   \u003cp id=\"p-rc_24a2c1fdf53118e9-330\" style=\"font-size: 14px;\"\u003e43. Tài sản cố định vô hình được tạo ra từ nội bộ doanh nghiệp được đánh giá ban đầu theo nguyên giá là toàn bộ chi phí phát sinh từ thời điểm mà tài sản vô hình đáp ứng được định nghĩa và tiêu chuẩn ghi nhận tài sản cố định vô hình quy định trong các đoạn 16, 17 và 40 đến khi tài sản cố định vô hình được đưa vào sử dụng. Các chi phí phát sinh trước thời điểm này phải tính vào chi phí sản xuất, kinh doanh trong kỳ.\u003c/p\u003e\n   \u003cp id=\"p-rc_82cabac04b72f75f-363\" style=\"font-size: 14px;\"\u003e44. Nguyên giá tài sản cố định vô hình được tạo ra từ nội bộ doanh nghiệp bao gồm tất cả các chi phí liên quan trực tiếp hoặc được phân bổ theo tiêu thức hợp lý và nhất quán từ các khâu thiết kế, xây dựng, sản xuất thử nghiệm đến chuẩn bị đưa tài sản đó vào sử dụng theo dự tính.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_82cabac04b72f75f-364\" style=\"font-size: 14px;\"\u003eNguyên giá\u0026nbsp;tài sản cố định vô hình được tạo ra từ nội bộ doanh nghiệp bao gồm:\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_82cabac04b72f75f-365\" style=\"font-size: 14px;\"\u003ea) Chi phí nguyên liệu, vật liệu hoặc dịch vụ đã sử dụng trong việc tạo ra tài sản cố định vô hình;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_82cabac04b72f75f-366\" style=\"font-size: 14px;\"\u003eb) Tiền lương, tiền công và các chi phí khác liên quan đến việc thuê nhân viên trực tiếp tham gia vào việc tạo ra tài sản đó;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_82cabac04b72f75f-367\" style=\"font-size: 14px;\"\u003ec) Các chi phí khác liên quan trực tiếp đến việc tạo ra tài sản, như chi phí đăng ký quyền pháp lý, khấu hao bằng sáng chế phát minh và giấy phép được sử dụng để tạo ra tài sản đó;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_82cabac04b72f75f-368\" style=\"font-size: 14px;\"\u003ed) Chi phí sản xuất chung được phân bổ theo tiêu thức hợp lý và nhất quán vào tài sản (Ví dụ: phân bổ khấu hao nhà xưởng, máy móc thiết bị, phí bảo hiểm, tiền thuê nhà xưởng, thiết bị).\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_82cabac04b72f75f-369\" style=\"font-size: 14px;\"\u003e45. Các chi phí sau đây không được tính vào nguyên giá tài sản cố định vô hình được tạo ra từ nội bộ doanh nghiệp:\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_82cabac04b72f75f-370\" style=\"font-size: 14px;\"\u003ea) Chi phí bán hàng, chi phí quản lý doanh nghiệp và chi phí sản xuất chung không liên quan trực tiếp đến việc đưa tài sản vào sử dụng;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_82cabac04b72f75f-371\" style=\"font-size: 14px;\"\u003eb) Các chi phí không hợp lý như: nguyên liệu, vật liệu lãng phí, chi phí lao động, các khoản chi phí khác sử dụng vượt quá mức bình thường;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_82cabac04b72f75f-372\" style=\"font-size: 14px;\"\u003ec) Chi phí đào tạo nhân viên để vận hành tài sản.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eGHI NHẬN CHI PHÍ\u003c/p\u003e\n   \u003cp id=\"p-rc_82cabac04b72f75f-373\" style=\"font-size: 14px;\"\u003e46. Chi phí liên quan đến tài sản vô hình phải được ghi nhận là chi phí sản xuất, kinh doanh trong kỳ hoặc chi phí trả trước, trừ trường hợp:\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_82cabac04b72f75f-374\" style=\"font-size: 14px;\"\u003ea) Chi phí hình thành một phần nguyên giá tài sản cố định vô hình và thỏa mãn định nghĩa và tiêu chuẩn ghi nhận (quy định từ đoạn 16 đến đoạn 44).\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003eb) Tài sản vô hình hình thành trong quá trình sáp nhập doanh nghiệp có tính chất mua lại nhưng không đáp ứng được định nghĩa và tiêu chuẩn ghi nhận thì những chi phí đó hình thành một bộ phận của lợi thế thương mại.\u003c/p\u003e\n   \u003cp id=\"p-rc_82cabac04b72f75f-375\" style=\"font-size: 14px;\"\u003e47. Chi phí phát sinh đem lại lợi ích kinh tế trong tương lai cho doanh nghiệp nhưng không được ghi nhận là tài sản cố định vô hình thì được ghi nhận là chi phí sản xuất, kinh doanh trong kỳ, trừ các chi phí được quy định trong đoạn 48.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_82cabac04b72f75f-376\" style=\"font-size: 14px;\"\u003e48. Chi phí phát sinh đem lại lợi ích kinh tế trong tương lai gồm: chi phí thành lập doanh nghiệp, chi phí đào tạo nhân viên và chi phí quảng cáo phát sinh trong giai đoạn trước hoạt động của doanh nghiệp mới thành lập, chi phí cho giai đoạn nghiên cứu, chi phí chuyển dịch địa điểm được ghi nhận là chi phí sản xuất, kinh doanh trong kỳ hoặc được phân bổ dần trong thời gian tối đa không quá 3 năm.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_82cabac04b72f75f-377\" style=\"font-size: 14px;\"\u003e49. Chi phí liên quan đến tài sản vô hình đã được doanh nghiệp ghi nhận là chi phí để xác định kết quả hoạt động kinh doanh trong kỳ trước đó thì không được tái ghi nhận vào nguyên giá tài sản cố định vô hình.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eCHI PHÍ PHÁT SINH SAU GHI NHẬN BAN ĐẦU\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e50. Chi phí liên quan đến tài sản cố định vô hình phát sinh sau khi ghi nhận ban đầu phải được ghi nhận là chi phí sản xuất, kinh doanh trong kỳ, trừ khi thỏa mãn đồng thời 2 điều kiện sau thì được tính vào nguyên giá:\u003c/p\u003e\n   \u003cp id=\"p-rc_82cabac04b72f75f-378\" style=\"font-size: 14px;\"\u003ea) Chi phí này có khả năng làm cho tài sản tạo ra lợi ích kinh tế trong tương lai nhiều hơn mức hoạt động được đánh giá ban đầu;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_82cabac04b72f75f-379\" style=\"font-size: 14px;\"\u003eb) Chi phí được đánh giá một cách chắc chắn và gắn liền với một tài sản cố định vô hình cụ thể.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_82cabac04b72f75f-380\" style=\"font-size: 14px;\"\u003e51. Chi phí liên quan đến tài sản cố định vô hình phát sinh sau khi ghi nhận ban đầu được ghi nhận là chi phí sản xuất, kinh doanh trong kỳ, trừ khi các chi phí này gắn liền với một tài sản cố định vô hình cụ thể và làm tăng lợi ích kinh tế từ các tài sản này.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_82cabac04b72f75f-381\" style=\"font-size: 14px;\"\u003e52. Chi phí phát sinh sau khi ghi nhận ban đầu liên quan đến nhãn hiệu hàng hóa, quyền phát hành, danh sách khách hàng và các khoản mục tương tự về bản chất luôn được ghi nhận là chi phí sản xuất, kinh doanh trong kỳ.\u003c/p\u003e\n   \u003cp style=\"text-align: center;\"\u003eXÁC ĐỊNH GIÁ TRỊ SAU GHI NHẬN BAN ĐẦU\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e53. Sau khi ghi nhận ban đầu, trong quá trình sử dụng, tài sản cố định vô hình được xác định theo nguyên giá, khấu hao lũy kế và giá trị còn lại.\u003c/p\u003e\n   \u003cp style=\"text-align: center;\"\u003eKHẤU HAO\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eThời gian tính khấu hao\u003c/p\u003e\n   \u003cp id=\"p-rc_6f3f0da70c73507d-401\" style=\"font-size: 14px;\"\u003e54. Giá trị phải khấu hao của tài sản cố định vô hình được phân bổ một cách có hệ thống trong suốt thời gian sử dụng hữu ích ước tính hợp lý của nó. Thời gian tính khấu hao của tài sản cố định vô hình tối đa là 20 năm. Việc trích khấu hao được bắt đầu từ khi đưa tài sản cố định vô hình vào sử dụng.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_6f3f0da70c73507d-402\" style=\"font-size: 14px;\"\u003e55. Khi xác định thời gian sử dụng hữu ích của tài sản cố định vô hình làm căn cứ tính khấu hao cần phải xem xét các yếu tố sau:\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_6f3f0da70c73507d-403\" style=\"font-size: 14px;\"\u003ea) Khả năng sử dụng dự tính của tài sản;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_6f3f0da70c73507d-404\" style=\"font-size: 14px;\"\u003eb) Vòng đời của sản phẩm và các thông tin chung về các ước tính liên quan đến thời gian sử dụng hữu ích của các loại tài sản giống nhau được sử dụng trong điều kiện tương tự;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_6f3f0da70c73507d-405\" style=\"font-size: 14px;\"\u003ec) Sự lạc hậu về kỹ thuật, công nghệ;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_6f3f0da70c73507d-406\" style=\"font-size: 14px;\"\u003ed) Tính ổn định của ngành sử dụng tài sản đó và sự thay đổi về nhu cầu thị trường đối với các sản phẩm hoặc việc cung cấp dịch vụ mà tài sản đó đem lại;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_6f3f0da70c73507d-407\" style=\"font-size: 14px;\"\u003ee) Hoạt động dự tính của các đối thủ cạnh tranh hiện tại hoặc tiềm tàng;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_6f3f0da70c73507d-408\" style=\"font-size: 14px;\"\u003ef) Mức chi phí cần thiết để duy trì, bảo dưỡng;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_6f3f0da70c73507d-409\" style=\"font-size: 14px;\"\u003eg) Thời gian kiểm soát tài sản, những hạn chế về mặt pháp lý và những hạn chế khác về quá trình sử dụng tài sản;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_6f3f0da70c73507d-410\" style=\"font-size: 14px;\"\u003eh) Sự phụ thuộc thời gian sử dụng hữu ích của tài sản cố định vô hình với các tài sản khác trong doanh nghiệp.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_6f3f0da70c73507d-411\" style=\"font-size: 14px;\"\u003e56. Phần mềm máy vi tính và các tài sản cố định vô hình khác có thể nhanh chóng bị lạc hậu về kỹ thuật thì thời gian sử dụng hữu ích của các tài sản này thường là ngắn hơn.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_6f3f0da70c73507d-412\" style=\"font-size: 14px;\"\u003e57. Trong một số trường hợp, thời gian sử dụng hữu ích của tài sản cố định vô hình có thể vượt quá 20 năm khi có những bằng chứng tin cậy, nhưng phải xác định được cụ thể. Trong trường hợp này, doanh nghiệp phải:\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_6f3f0da70c73507d-413\" style=\"font-size: 14px;\"\u003ea) Khấu hao tài sản cố định vô hình theo thời gian sử dụng hữu ích ước tính chính xác nhất; và\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_6f3f0da70c73507d-414\" style=\"font-size: 14px;\"\u003eb) Trình bày các lý do ước tính thời gian sử dụng hữu ích của tài sản trên báo cáo tài chính.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_6f3f0da70c73507d-415\" style=\"font-size: 14px;\"\u003e58. Nếu việc kiểm soát đối với các lợi ích kinh tế trong tương lai từ tài sản cố định vô hình đạt được bằng quyền pháp lý được cấp trong một khoảng thời gian xác định thì thời gian sử dụng hữu ích của tài sản cố định vô hình không vượt quá thời gian có hiệu lực của quyền pháp lý, trừ khi quyền pháp lý được gia hạn.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_6f3f0da70c73507d-416\" style=\"font-size: 14px;\"\u003e59. Các nhân tố kinh tế và pháp lý ảnh hưởng đến thời gian sử dụng hữu ích của tài sản cố định vô hình, gồm:\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003col class=\"\" style=\"font-size: 14px;\"\u003e\n    \u003cli\u003eCác nhân tố kinh tế quyết định khoảng thời gian thu được lợi ích kinh tế trong tương lai;Các nhân tố pháp lý giới hạn khoảng thời gian doanh nghiệp kiểm soát được lợi ích kinh tế này. Thời gian sử dụng hữu ích là thời gian ngắn hơn trong số các khoảng thời gian trên.\u003c/li\u003e\n   \u003c/ol\u003e\n   \u003cp style=\"font-size: 14px;\"\u003ePhương pháp khấu hao\u003c/p\u003e\n   \u003cp id=\"p-rc_6f3f0da70c73507d-419\" style=\"font-size: 14px;\"\u003e60. Phương pháp khấu hao tài sản cố định vô hình được sử dụng phải phản ánh cách thức thu hồi lợi ích kinh tế từ tài sản đó của doanh nghiệp. Phương pháp khấu hao được sử dụng cho từng tài sản cố định vô hình được áp dụng thống nhất qua nhiều thời kỳ và có thể được thay đổi khi có sự thay đổi đáng kể cách thức thu hồi lợi ích kinh tế của doanh nghiệp. Chi phí khấu hao cho từng thời kỳ phải được ghi nhận là chi phí hoạt động sản xuất, kinh doanh, trừ khi chi phí đó được tính vào giá trị của tài sản khác.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e61. Có ba (3) phương pháp khấu hao tài sản cố định vô hình, gồm:\u003c/p\u003e\n   \u003col class=\"\" style=\"font-size: 14px;\"\u003e\n    \u003cli\u003ePhương pháp khấu hao đường thẳng;Phương pháp khấu hao theo số dư giảm dần;Phương pháp khấu hao theo số lượng sản phẩm.\u003c/li\u003e\n   \u003c/ol\u003e\n   \u003cul class=\"\" style=\"font-size: 14px;\"\u003e\n    \u003cli\u003eTheo phương pháp khấu hao đường thẳng, số khấu hao hàng năm không đổi trong suốt thời gian sử dụng hữu ích của tài sản cố định vô hình.Theo phương pháp khấu hao theo số dư giảm dần, số khấu hao hàng năm giảm dần trong suốt thời gian sử dụng hữu ích của tài sản.Phương pháp khấu hao theo số lượng sản phẩm dựa trên tổng số đơn vị sản phẩm ước tính tài sản có thể tạo ra.\u003c/li\u003e\n   \u003c/ul\u003e\n   \u003chr class=\"\" style=\"font-size: 14px;\"\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eGiá trị thanh lý\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e62. Tài sản cố định vô hình có giá trị thanh lý khi:\u003c/p\u003e\n   \u003cul class=\"\" style=\"font-size: 14px;\"\u003e\n    \u003cli\u003ea) Có bên thứ ba thỏa thuận mua lại tài sản đó vào cuối thời gian sử dụng hữu ích của tài sản; hoặcb) Có thị trường hoạt động vào cuối thời gian sử dụng hữu ích của tài sản và giá trị thanh lý có thể được xác định thông qua giá thị trường.\u003c/li\u003e\n   \u003c/ul\u003e\n   \u003cp id=\"p-rc_6f3f0da70c73507d-425\" style=\"font-size: 14px;\"\u003eKhi không có một trong hai điều kiện nói trên thì giá trị thanh lý của\u0026nbsp;tài sản cố định vô hình được xác định bằng không (0).\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_6f3f0da70c73507d-426\" style=\"font-size: 14px;\"\u003e63. Giá trị phải khấu hao được xác định bằng nguyên giá trừ (-) giá trị thanh lý ước tính của tài sản.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_6f3f0da70c73507d-427\" style=\"font-size: 14px;\"\u003e64. Giá trị thanh lý được ước tính khi tài sản cố định vô hình được hình thành đưa vào sử dụng bằng cách dựa trên giá bán phổ biến ở cuối thời gian sử dụng hữu ích ước tính của một tài sản tương tự và đã hoạt động trong các điều kiện tương tự. Giá trị thanh lý ước tính không tăng lên khi có thay đổi về giá cả hoặc giá trị.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eXem xét lại thời gian khấu hao và phương pháp khấu hao\u003c/p\u003e\n   \u003cp id=\"p-rc_bf8f5c9d123d0a99-457\" style=\"font-size: 14px;\"\u003e65. Thời gian khấu hao và phương pháp khấu hao tài sản cố định vô hình phải được xem xét lại ít nhất là vào cuối mỗi năm tài chính. Nếu thời gian sử dụng hữu ích ước tính của tài sản khác biệt lớn so với các ước tính trước đó thì thời gian khấu hao phải được thay đổi tương ứng. Phương pháp khấu hao tài sản cố định vô hình được thay đổi khi có thay đổi đáng kể cách thức ước tính thu hồi lợi ích kinh tế cho doanh nghiệp. Trường hợp này, phải điều chỉnh chi phí khấu hao cho năm hiện hành và các năm tiếp theo, và được thuyết minh trong báo cáo tài chính.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_bf8f5c9d123d0a99-458\" style=\"font-size: 14px;\"\u003e66. Trong suốt thời gian sử dụng tài sản cố định vô hình, khi xét thấy việc ước tính thời gian sử dụng hữu ích của tài sản không còn phù hợp thì thời gian khấu hao cần phải thay đổi.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eVí dụ: Thời gian sử dụng hữu ích có thể tăng lên do đầu tư thêm chi phí làm tăng năng lực của tài sản so với năng lực hoạt động được đánh giá ban đầu.\u003c/p\u003e\n   \u003cp id=\"p-rc_bf8f5c9d123d0a99-460\" style=\"font-size: 14px;\"\u003e67. Trong suốt thời gian sử dụng hữu ích của tài sản cố định vô hình, có thể thay đổi cách thức ước tính về lợi ích kinh tế trong tương lai mà doanh nghiệp dự tính thu được, do đó có thể thay đổi phương pháp khấu hao.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eVí dụ: Phương pháp khấu hao theo số dư giảm dần phù hợp hơn phương pháp khấu hao đường thẳng.\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eNHƯỢNG BÁN VÀ THANH LÝ TÀI SẢN CỐ ĐỊNH VÔ HÌNH\u003c/p\u003e\n   \u003cp id=\"p-rc_bf8f5c9d123d0a99-462\" style=\"font-size: 14px;\"\u003e68. Tài sản cố định vô hình được ghi giảm khi thanh lý, nhượng bán hoặc khi xét thấy không thu được lợi ích kinh tế từ việc sử dụng tiếp sau.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_bf8f5c9d123d0a99-463\" style=\"font-size: 14px;\"\u003e69. Lãi hay lỗ phát sinh do thanh lý, nhượng bán tài sản cố định vô hình được xác định bằng số chênh lệch giữa thu nhập với chi phí thanh lý, nhượng bán cộng (+) giá trị còn lại của tài sản cố định vô hình. Số lãi, lỗ này được ghi nhận là một khoản thu nhập hoặc chi phí trên báo cáo kết quả hoạt động kinh doanh trong kỳ.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eTRÌNH BÀY BÁO CÁO TÀI CHÍNH\u003c/p\u003e\n   \u003cp id=\"p-rc_bf8f5c9d123d0a99-464\" style=\"font-size: 14px;\"\u003e70. Trong báo cáo tài chính, doanh nghiệp phải trình bày theo từng loại tài sản cố định vô hình được tạo ra từ nội bộ doanh nghiệp và tài sản cố định vô hình được hình thành từ các nguồn khác, về những thông tin sau:\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_bf8f5c9d123d0a99-465\" style=\"font-size: 14px;\"\u003ea) Phương pháp xác định nguyên giá tài sản cố định vô hình;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_bf8f5c9d123d0a99-466\" style=\"font-size: 14px;\"\u003eb) Phương pháp khấu hao; thời gian sử dụng hữu ích hoặc tỷ lệ khấu hao;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_bf8f5c9d123d0a99-467\" style=\"font-size: 14px;\"\u003ec) Nguyên giá, khấu hao lũy kế và giá trị còn lại vào đầu năm và cuối kỳ;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_bf8f5c9d123d0a99-468\" style=\"font-size: 14px;\"\u003ed) Bản Thuyết minh báo cáo tài chính phải trình bày các thông tin:\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eNguyên giá\u0026nbsp;tài sản cố định vô hình tăng (ghi rõ tăng từ giai đoạn triển khai hoặc do sáp nhập);\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eNguyên giá tài sản cố định vô hình giảm;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eSố khấu hao trong kỳ, tăng, giảm và lũy kế cuối kỳ;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eLý do khi một tài sản cố định vô hình được khấu hao trên 20 năm;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eNguyên giá, khấu hao lũy kế, giá trị còn lại và thời gian còn lại của từng tài sản có vị trí quan trọng;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eGiá trị hợp lý của tài sản do Nhà nước cấp;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eGiá trị còn lại của tài sản đã dùng để thế chấp;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eCác cam kết mua, bán tài sản có giá trị lớn trong tương lai;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eGiá trị còn lại của tài sản tạm thời không sử dụng;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eNguyên giá tài sản đã khấu hao hết nhưng vẫn còn sử dụng;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eGiá trị còn lại của tài sản đang chờ thanh lý;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eGiải trình khoản chi phí trong giai đoạn nghiên cứu và triển khai đã ghi nhận vào chi phí kinh doanh trong kỳ.\u003c/p\u003e\n   \u003cp id=\"p-rc_bf8f5c9d123d0a99-469\" style=\"font-size: 14px;\"\u003e71. Kế toán tài sản cố định vô hình được phân loại theo nhóm tài sản có cùng tính chất và mục đích sử dụng, gồm:\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_bf8f5c9d123d0a99-470\" style=\"font-size: 14px;\"\u003ea) Quyền sử dụng đất có thời hạn;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_bf8f5c9d123d0a99-471\" style=\"font-size: 14px;\"\u003eb) Nhãn hiệu hàng hóa;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_bf8f5c9d123d0a99-472\" style=\"font-size: 14px;\"\u003ec) Quyền phát hành;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_bf8f5c9d123d0a99-473\" style=\"font-size: 14px;\"\u003ed) Phần mềm máy vi tính;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_bf8f5c9d123d0a99-474\" style=\"font-size: 14px;\"\u003ee) Giấy phép và giấy phép nhượng quyền;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_bf8f5c9d123d0a99-475\" style=\"font-size: 14px;\"\u003ef) Bản quyền, bằng sáng chế;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_bf8f5c9d123d0a99-476\" style=\"font-size: 14px;\"\u003eg) Công thức và cách thức pha chế, kiểu mẫu, thiết kế và vật mẫu;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_bf8f5c9d123d0a99-477\" style=\"font-size: 14px;\"\u003eh) Tài sản cố định vô hình đang triển khai.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u0026nbsp;\u003c/p\u003e\n   \u003cp style=\"text-align: center;\"\u003eChuẩn mực số 14\u003c/p\u003e\n   \u003cp style=\"text-align: center;\"\u003eDOANH THU VÀ THU NHẬP KHÁC\u003c/p\u003e\n   \u003cp style=\"text-align: center;\"\u003e(ban hành và công bố theo Quyết định\u003c/p\u003e\n   \u003cp style=\"text-align: center;\"\u003esố 149/2001/QĐ-BTC ngày 31/12/2001 của Bộ trưởng Bộ Tàichính)\u003c/p\u003e\n   \u003cp style=\"text-align: center;\"\u003eQUY ĐỊNH CHUNG\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e01. Mục đích của chuẩn mực này là quy định và hướng dẫn các phương pháp và nguyên tắc kế toán doanh thu và thu nhập khác, gồm: Các loại doanh thu, thời điểm ghi nhận doanh thu, phương pháp kế toán doanh thu và thu nhập khác làm cơ sở ghi nhận sổ kế toán và lập báo cáo tài chính.\u003c/p\u003e\n   \u003cp id=\"p-rc_aabec3468806e2e8-17\" style=\"font-size: 14px;\"\u003e02. Chuẩn mực này áp dụng trong kế toán các khoản doanh thu và thu nhập khác phát sinh từ thu nhập và nghiệp vụ sau:\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_aabec3468806e2e8-18\" style=\"font-size: 14px;\"\u003ea) Bán hàng: Bán sản phẩm do doanh nghiệp sản xuất ra và bán hàng hoá mua vào;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_aabec3468806e2e8-19\" style=\"font-size: 14px;\"\u003eb) Cung cấp dịch vụ: Thực hiện công việc đã thoả thuận theo hợp đồng trong một hoặc nhiều kỳ kế toán;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003ec) Tiền lãi, tiền bản quyền, cổ tức và lợi nhuận được chia.\u003c/p\u003e\n   \u003cp id=\"p-rc_aabec3468806e2e8-20\" style=\"font-size: 14px;\"\u003eTiền lãi: Là số tiền thu được từ việc phát sinh cho người khác sử dụng tiền, các khoản tương đương tiền hoặc các khoản còn nợ doanh nghiệp, như: lãi cho vay, lãi tiền gửi, lãi đầu tư trái phiếu, tín phiếu, chiết khấu thanh toán...;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_aabec3468806e2e8-21\" style=\"font-size: 14px;\"\u003eTiền bản quyền: Là số tiền thu được phát sinh từ việc cho người khác sử dụng tài sản, như: bằng sáng chế, nhãn hiệu thương mại, bản quyền tác giả, phần mềm máy vi tính...;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_aabec3468806e2e8-22\" style=\"font-size: 14px;\"\u003eCổ tức và lợi nhuận được chia: Là số tiền lợi nhuận được chia từ việc nắm giữ các cổ phiếu hoặc góp vốn.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_aabec3468806e2e8-23\" style=\"font-size: 14px;\"\u003ed) Các khoản thu nhập khác ngoài các giao dịch và nghiệp vụ tạo ra doanh thu kể trên (Nội dung các khoản thu nhập khác quy định tại đoạn 30).\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_aabec3468806e2e8-24\" style=\"font-size: 14px;\"\u003eChuẩn mực này không áp dụng cho kế toán các khoản doanh thu và thu nhập khác được quy định ở các chuẩn mực kế toán khác.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justif

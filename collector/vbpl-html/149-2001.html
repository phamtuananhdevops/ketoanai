y;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_aabec3468806e2e8-25\" style=\"font-size: 14px;\"\u003e03. Các thuật ngữ trong chuẩn mực này được hiểu như sau:\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_aabec3468806e2e8-26\" style=\"font-size: 14px;\"\u003eDoanh thu: Là tổng giá trị các lợi ích kinh tế doanh nghiệp thu được trong kỳ kế toán, phát sinh từ các hoạt động sản xuất, kinh doanh thông thường của doanh nghiệp, góp phần làm tăng vốn chủ sở hữu.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_aabec3468806e2e8-27\" style=\"font-size: 14px;\"\u003eChiết khấu thương mại: Là khoản doanh nghiệp bán giảm giá niêm yết cho khách hàng mua hàng với khối lượng lớn.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_aabec3468806e2e8-28\" style=\"font-size: 14px;\"\u003eGiảm giá hàng bán: Là khoản giảm trừ cho người mua do hàng hoá kém phẩm chất, sai quy cách hoặc lạc hậu thị hiếu.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_aabec3468806e2e8-29\" style=\"font-size: 14px;\"\u003eGiá trị hàng bán bị trả lại: Là giá trị khối lượng hàng bán đã xác định là tiêu thụ bị khách hàng trả lại và từ chối thanh toán.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_aabec3468806e2e8-30\" style=\"font-size: 14px;\"\u003eChiết khấu thanh toán: Là khoản tiền người bán giảm trừ cho người mua hàng trước thời hạn theo hợp đồng.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_aabec3468806e2e8-31\" style=\"font-size: 14px;\"\u003eThu nhập khác: Là khoản thu góp phần làm tăng vốn chủ sở hữu từ hoạt động ngoài các hoạt động tạo ra doanh thu.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eGiá trị hợp lý: Là giá trị tài sản có thể trao đổi hoặc giá trị một khoản nợ được thanh toán một cách tự nguyện giữa các bên có đầy đủ hiểu biết trong sự trao đổi ngang giá.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u0026nbsp;\u003c/p\u003e\n   \u003cp style=\"text-align: center;\"\u003eNỘI DUNG CHUẨN MỰC\u003c/p\u003e\n   \u003cp id=\"p-rc_994d58b40efcfcb7-47\" style=\"font-size: 14px;\"\u003e04. Doanh thu chỉ bao gồm tổng giá trị của các lợi ích kinh tế doanh nghiệp đã thu được hoặc sẽ thu được. Các khoản thu hộ bên thứ ba không phải là nguồn lợi ích kinh tế, không làm tăng vốn chủ sở hữu của doanh nghiệp sẽ không được coi là doanh thu (Ví dụ: Khi người nhận đại lý thu hộ tiền bán hàng cho đơn vị chủ hàng thì doanh thu của người nhận đại lý chỉ là tiền hoa hồng được hưởng). Các khoản góp vốn của cổ đông hoặc chủ sở hữu làm tăng vốn chủ sở hữu nhưng không là doanh thu.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eXÁC ĐỊNH DOANH THU\u003c/p\u003e\n   \u003cp id=\"p-rc_994d58b40efcfcb7-48\" style=\"font-size: 14px;\"\u003e05. Doanh thu được xác định theo giá trị hợp lý của các khoản đã thu hoặc sẽ thu được.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_994d58b40efcfcb7-49\" style=\"font-size: 14px;\"\u003e06. Doanh thu phát sinh từ giao dịch được xác định bởi thỏa thuận giữa doanh nghiệp với bên mua hoặc bên sử dụng tài sản. Nó được xác định bằng giá trị hợp lý của các khoản đã thu được hoặc sẽ thu được sau khi trừ (-) các khoản chiết khấu thương mại, chiết khấu thanh toán, giảm giá hàng bán và giá trị hàng bán bị trả lại.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_994d58b40efcfcb7-50\" style=\"font-size: 14px;\"\u003e07. Đối với các khoản tiền hoặc tương đương tiền không được nhận ngay thì doanh thu được xác định bằng cách quy đổi giá trị danh nghĩa của các khoản sẽ thu được trong tương lai về giá trị thực tế tại thời điểm ghi nhận doanh thu theo tỷ lệ lãi suất hiện hành. Giá trị thực tế tại thời điểm ghi nhận doanh thu có thể nhỏ hơn giá trị danh nghĩa sẽ thu được trong tương lai.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_994d58b40efcfcb7-51\" style=\"font-size: 14px;\"\u003e08. Khi hàng hóa hoặc dịch vụ được trao đổi để lấy hàng hóa hoặc dịch vụ tương tự về bản chất và giá trị thì việc trao đổi đó không được coi là một giao dịch tạo ra doanh thu.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_994d58b40efcfcb7-52\" style=\"font-size: 14px;\"\u003eKhi hàng hóa hoặc dịch vụ được trao đổi để lấy hàng hóa hoặc dịch vụ khác không tương tự thì việc trao đổi đó được coi là một giao dịch tạo ra doanh thu. Trường hợp này doanh thu được xác định bằng giá trị hợp lý của hàng hóa hoặc dịch vụ nhận về, sau khi điều chỉnh các khoản tiền hoặc tương đương tiền trả thêm hoặc thu thêm.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_994d58b40efcfcb7-53\" style=\"font-size: 14px;\"\u003eKhi không xác định được giá trị hợp lý của hàng hóa hoặc dịch vụ nhận về thì doanh thu\u0026nbsp;được xác định bằng giá trị hợp lý của hàng hóa hoặc dịch vụ đem trao đổi, sau khi điều chỉnh các khoản tiền hoặc tương đương tiền trả thêm hoặc thu thêm.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eNHẬN BIẾT GIAO DỊCH\u003c/p\u003e\n   \u003cp id=\"p-rc_994d58b40efcfcb7-54\" style=\"font-size: 14px;\"\u003e09. Tiêu chuẩn nhận biết giao dịch trong Chuẩn mực này được áp dụng riêng biệt cho từng giao dịch. Trong một số trường hợp, các tiêu chuẩn nhận biết giao dịch cần áp dụng tách biệt cho từng bộ phận của một giao dịch đơn lẻ để phản ánh bản chất của giao dịch đó.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_994d58b40efcfcb7-55\" style=\"font-size: 14px;\"\u003eVí dụ: Khi trong giá bán một sản phẩm có một khoản đã định trước cho việc cung cấp dịch vụ sau bán hàng thì khoản doanh thu từ việc cung cấp dịch vụ sau bán hàng sẽ được dời lại cho đến khi doanh nghiệp thực hiện dịch vụ đó.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_994d58b40efcfcb7-56\" style=\"font-size: 14px;\"\u003eTiêu chuẩn nhận biết giao dịch còn được\u0026nbsp;áp dụng cho hai hay nhiều giao dịch đồng thời có quan hệ với nhau về mặt thương mại. Trường hợp này phải xem xét chúng trong mối quan hệ tổng thể.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_994d58b40efcfcb7-57\" style=\"font-size: 14px;\"\u003eVí dụ: Doanh nghiệp thực hiện việc bán hàng và đồng thời ký một hợp đồng khác để mua lại chính các hàng hóa đó sau một thời gian thì phải đồng thời xem xét cả hai hợp đồng và doanh thu không được ghi nhận.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eDOANH THU BÁN HÀNG\u003c/p\u003e\n   \u003cp id=\"p-rc_994d58b40efcfcb7-58\" style=\"font-size: 14px;\"\u003e10. Doanh thu bán hàng được ghi nhận khi đồng thời thỏa mãn tất cả năm (5) điều kiện sau:\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_994d58b40efcfcb7-59\" style=\"font-size: 14px;\"\u003ea) Doanh nghiệp đã chuyển giao phần lớn rủi ro và lợi ích gắn liền với quyền sở hữu sản phẩm hoặc hàng hóa cho người mua;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_994d58b40efcfcb7-60\" style=\"font-size: 14px;\"\u003eb) Doanh nghiệp không còn nắm giữ quyền quản lý hàng hóa như người sở hữu hàng hóa hoặc quyền kiểm soát hàng hóa;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003ec) Doanh thu được xác định tương đối chắc chắn;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003ed) Doanh nghiệp đã thu được hoặc sẽ thu được lợi ích kinh tế từ giao dịch bán hàng;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003ee) Xác định được chi phí liên quan đến giao dịch bán hàng.\u003c/p\u003e\n   \u003cp id=\"p-rc_994d58b40efcfcb7-61\" style=\"font-size: 14px;\"\u003e11. Doanh nghiệp phải xác định thời điểm chuyển giao phần lớn rủi ro và lợi ích gắn liền với quyền sở hữu hàng hóa cho người mua trong từng trường hợp cụ thể. Trong hầu hết các trường hợp, thời điểm chuyển giao phần lớn rủi ro trùng với thời điểm chuyển giao lợi ích gắn liền với quyền sở hữu hợp pháp hoặc quyền kiểm soát hàng hóa cho người mua.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_994d58b40efcfcb7-62\" style=\"font-size: 14px;\"\u003e12. Trường hợp doanh nghiệp vẫn còn chịu phần lớn rủi ro gắn liền với quyền sở hữu hàng hóa thì giao dịch không được coi là hoạt động bán hàng và doanh thu không được ghi nhận. Doanh nghiệp còn phải chịu rủi ro gắn liền với quyền sở hữu hàng hóa dưới nhiều hình thức khác nhau, như:\u003c/p\u003e\n   \u003cp id=\"p-rc_276539484309dcc0-91\" style=\"font-size: 14px;\"\u003ea) Doanh nghiệp còn phải chịu trách nhiệm để đảm bảo cho tài sản được hoạt động bình thường mà việc này không nằm trong các điều khoản bảo hành thông thường;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_276539484309dcc0-92\" style=\"font-size: 14px;\"\u003eb) Khi việc thanh toán tiền bán hàng còn chưa chắc chắn vì phụ thuộc vào người mua hàng hóa đó;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_276539484309dcc0-93\" style=\"font-size: 14px;\"\u003ec) Khi hàng hóa được giao còn chờ lắp đặt và việc lắp đặt đó là một phần quan trọng của hợp đồng mà doanh nghiệp chưa hoàn thành;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_276539484309dcc0-94\" style=\"font-size: 14px;\"\u003ed) Khi người mua có quyền hủy bỏ việc mua hàng vì một lý do nào đó được nêu trong hợp đồng mua bán và doanh nghiệp chưa chắc chắn về khả năng hàng bán có bị trả lại hay không.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_276539484309dcc0-95\" style=\"font-size: 14px;\"\u003e13. Nếu doanh nghiệp chỉ còn phải chịu một phần nhỏ rủi ro gắn liền với quyền sở hữu hàng hóa thì việc bán hàng được xác định và doanh thu được ghi nhận.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eVí dụ: Doanh nghiệp còn nắm giữ giấy tờ về quyền sở hữu hàng hóa chỉ để đảm bảo sẽ nhận được đủ các khoản thanh toán.\u003c/p\u003e\n   \u003cp id=\"p-rc_276539484309dcc0-97\" style=\"font-size: 14px;\"\u003e14. Doanh thu bán hàng được ghi nhận chỉ khi đảm bảo là doanh nghiệp nhận được lợi ích kinh tế từ giao dịch.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_276539484309dcc0-98\" style=\"font-size: 14px;\"\u003eTrường hợp lợi ích kinh tế từ giao dịch bán hàng còn phụ thuộc yếu tố không chắc chắn thì chỉ ghi nhận doanh thu khi yếu tố không chắc chắn này đã xử lý xong (ví dụ, khi doanh nghiệp không chắc chắn là Chính phủ nước sở tại có chấp nhận chuyển tiền bán hàng ở nước ngoài về hay không).\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_276539484309dcc0-99\" style=\"font-size: 14px;\"\u003eXử lý nợ khó đòi: Nếu doanh thu đã được ghi nhận nhưng sau đó xác định khoản tiền nợ phải thu này là không thu được thì phải hạch toán vào chi phí sản xuất, kinh doanh trong kỳ mà không được ghi giảm doanh thu.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_276539484309dcc0-100\" style=\"font-size: 14px;\"\u003eKhi xác định khoản phải thu là không chắc chắn thu được (Nợ phải thu khó đòi) thì\u0026nbsp;phải lập dự phòng nợ phải thu khó đòi mà không ghi giảm doanh thu.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e15. Nguyên tắc phù hợp: Doanh thu và chi phí liên quan tới cùng một giao dịch phải được ghi nhận đồng thời.\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003eCác chi phí, bao gồm cả chi phí phát sinh sau ngày giao hàng (như chi phí bảo hành và chi phí khác), thường được xác định chắc chắn khi các điều kiện ghi nhận doanh thu được thỏa mãn.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_276539484309dcc0-102\" style=\"font-size: 14px;\"\u003eTiền ứng trước: Các khoản tiền nhận trước của khách hàng không được ghi nhận là doanh thu mà được ghi nhận là một khoản nợ phải trả tại thời điểm nhận tiền. Khoản nợ này chỉ được ghi nhận là doanh thu khi đồng thời thỏa mãn năm (5) điều kiện quy định ở đoạn 10.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eDoanh thu cung cấp dịch vụ\u003c/p\u003e\n   \u003cp id=\"p-rc_aeec19307427e1bb-115\" style=\"font-size: 14px;\"\u003e16. Doanh thu của giao dịch về cung cấp dịch vụ được ghi nhận khi kết quả của giao dịch đó được xác định một cách đáng tin cậy. Trường hợp giao dịch về cung cấp dịch vụ liên quan đến nhiều kỳ thì doanh thu được ghi nhận trong kỳ theo kết quả phần công việc đã hoàn thành vào ngày lập Bảng cân đối kế toán của kỳ đó. Kết quả của giao dịch cung cấp dịch vụ được xác định khi thỏa mãn tất cả bốn (4) điều kiện sau:\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_aeec19307427e1bb-116\" style=\"font-size: 14px;\"\u003ea) Doanh thu được xác định tương đối chắc chắn;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_aeec19307427e1bb-117\" style=\"font-size: 14px;\"\u003eb) Có khả năng thu được lợi ích kinh tế từ giao dịch cung cấp dịch vụ đó;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_aeec19307427e1bb-118\" style=\"font-size: 14px;\"\u003ec) Xác định được phần công việc đã hoàn thành vào ngày lập Bảng cân đối kế toán;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_aeec19307427e1bb-119\" style=\"font-size: 14px;\"\u003ed) Xác định được chi phí phát sinh cho giao dịch và chi phí để hoàn thành giao dịch cung cấp dịch vụ đó.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_aeec19307427e1bb-120\" style=\"font-size: 14px;\"\u003e17. Trường hợp giao dịch về cung cấp dịch vụ thực hiện trong nhiều kỳ kế toán thì việc xác định doanh thu của dịch vụ trong từng kỳ thường được thực hiện theo phương pháp tỷ lệ hoàn thành. Theo phương pháp này, doanh thu được ghi nhận trong kỳ kế toán được xác định theo tỷ lệ phần công việc đã hoàn thành.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_aeec19307427e1bb-121\" style=\"font-size: 14px;\"\u003e18. Doanh thu cung cấp dịch vụ chỉ được ghi nhận khi đảm bảo là doanh nghiệp nhận được lợi ích kinh tế từ giao dịch.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_aeec19307427e1bb-122\" style=\"font-size: 14px;\"\u003eKhi không thể thu hồi được khoản doanh thu đã ghi nhận thì phải hạch toán vào chi phí mà\u0026nbsp;không được ghi giảm doanh thu.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_aeec19307427e1bb-123\" style=\"font-size: 14px;\"\u003eKhi không chắc chắn thu hồi được một khoản mà trước đó đã ghi vào doanh thu (Nợ phải\u0026nbsp;thu khó đòi) thì phải lập dự phòng nợ phải thu khó đòi mà không ghi giảm doanh thu.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_aeec19307427e1bb-124\" style=\"font-size: 14px;\"\u003eKhoản nợ phải thu khó đòi khi xác định thực sự là không đòi được thì được bù đắp bằng nguồn dự phòng nợ phải thu khó đòi.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e19. Doanh nghiệp có thể ước tính doanh thu cung cấp dịch vụ khi thỏa thuận được với bên đối tác giao dịch những điều kiện sau:\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003ea) Trách nhiệm và quyền của mỗi bên trong việc cung cấp hoặc nhận dịch vụ;\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eb) Giá thanh toán;\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003ec) Thời hạn và phương thức thanh toán.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eĐể ước tính doanh thu cung cấp dịch vụ, doanh nghiệp phải có hệ thống kế hoạch tài chính và kế toán phù hợp. Khi cần thiết, doanh nghiệp có quyền xem xét và sửa đổi cách ước tính doanh thu trong quá trình cung cấp dịch vụ.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e20. Phần công việc đã hoàn thành được xác định theo một trong ba phương pháp sau, tùy thuộc vào bản chất của dịch vụ:\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003ea) Đánh giá phần công việc đã hoàn thành;\u0026nbsp;\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eb) So sánh tỷ lệ (%) giữa khối lượng công việc đã hoàn thành với tổng khối lượng công việc phải hoàn thành;\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003ec) Tỷ lệ (%) chi phí đã phát sinh so với tổng chi phí ước tính để hoàn thành toàn bộ giao dịch cung cấp dịch vụ.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003ePhần công việc đã hoàn thành không phụ thuộc vào các khoản thanh toán định kỳ hay các khoản ứng trước của khách hàng.\u003c/p\u003e\n   \u003cp id=\"p-rc_e7602a285623f23d-135\" style=\"font-size: 14px;\"\u003e21. Trường hợp dịch vụ được thực hiện bằng nhiều hoạt động khác nhau mà không tách biệt được, và được thực hiện trong nhiều kỳ kế toán nhất định thì doanh thu từng kỳ được ghi nhận theo phương pháp bình quân. Khi có một hoạt động cơ bản so với các hoạt động khác thì việc ghi nhận doanh thu được thực hiện theo hoạt động cơ bản đó.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_e7602a285623f23d-136\" style=\"font-size: 14px;\"\u003e22. Khi kết quả của một giao dịch về cung cấp dịch vụ không thể xác định được chắc chắn thì doanh thu được ghi nhận tương ứng với chi phí đã ghi nhận và có thể thu hồi.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_e7602a285623f23d-137\" style=\"font-size: 14px;\"\u003e23. Trong giai đoạn đầu của một giao dịch về cung cấp dịch vụ, khi chưa xác định được kết quả một cách chắc chắn thì doanh thu được ghi nhận bằng chi phí đã ghi nhận và có thể thu hồi được.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_e7602a285623f23d-138\" style=\"font-size: 14px;\"\u003eNếu chi phí liên quan đến dịch vụ đó chắc chắn không thu hồi được thì không ghi nhận doanh thu, và chi phí đã phát sinh được hạch toán vào chi phí để xác định kết quả kinh doanh trong kỳ.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_e7602a285623f23d-139\" style=\"font-size: 14px;\"\u003eKhi có bằng chứng tin cậy về các chi phí đã phát sinh sẽ thu hồi được thì doanh thu được ghi nhận theo quy định tại đoạn 16.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eDOANH THU TỪ TIỀN LÃI, TIỀN BẢN QUYỀN, CỔ TỨC VÀ LỢI NHUẬN ĐƯỢC CHIA\u003c/p\u003e\n   \u003cp id=\"p-rc_e7602a285623f23d-140\" style=\"font-size: 14px;\"\u003e24. Doanh thu phát sinh từ tiền lãi, tiền bản quyền, cổ tức và lợi nhuận được chia của doanh nghiệp được ghi nhận khi thỏa mãn đồng thời hai (2) điều kiện sau:\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_e7602a285623f23d-141\" style=\"font-size: 14px;\"\u003ea) Có khả năng thu được lợi ích kinh tế từ giao dịch đó;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_e7602a285623f23d-142\" style=\"font-size: 14px;\"\u003eb) Doanh thu được xác định tương đối chắc chắn.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e25. Doanh thu từ tiền lãi, tiền bản quyền, cổ tức và lợi nhuận được chia được ghi nhận trên cơ sở:\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003ea) Tiền lãi: Được ghi nhận trên cơ sở thời gian và lãi suất thực tế từng kỳ;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eb) Tiền bản quyền: Được ghi nhận trên cơ sở dồn tích phù hợp với hợp đồng;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003ec) Cổ tức và lợi nhuận được chia: Được ghi nhận khi cổ đông được quyền nhận cổ tức hoặc các bên tham gia góp vốn được quyền nhận lợi nhuận từ việc góp vốn.\u003c/p\u003e\n   \u003cp id=\"p-rc_e7602a285623f23d-143\" style=\"font-size: 14px;\"\u003e26. Lãi suất thực tế là tỷ lệ lãi dùng để quy đổi các khoản tiền nhận được trong tương lai trong suốt thời gian cho bên khác sử dụng tài sản về giá trị ghi nhận ban đầu tại thời điểm chuyển giao tài sản cho bên sử dụng. Doanh thu tiền lãi bao gồm số phân bổ các khoản chiết khấu, phụ trội, các khoản lãi nhận trước hoặc các khoản chênh lệch giữa giá trị ghi sổ ban đầu của công cụ nợ và giá trị của nó khi đáo hạn.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_e7602a285623f23d-144\" style=\"font-size: 14px;\"\u003e27. Khi tiền lãi chưa thu của một khoản đầu tư đã được dồn tích trước khi doanh nghiệp mua lại khoản đầu tư đó, thì khi thu được tiền lãi từ khoản đầu tư, doanh nghiệp phải phân bổ vào cả các kỳ trước khi nó được mua.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_e7602a285623f23d-145\" style=\"font-size: 14px;\"\u003eChỉ có phần tiền lãi của các kỳ sau khi khoản đầu tư được mua mới được ghi nhận là doanh thu của doanh nghiệp.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_e7602a285623f23d-146\" style=\"font-size: 14px;\"\u003ePhần tiền lãi của các kỳ trước khi khoản đầu tư được mua được hạch toán giảm giá trị của chính khoản đầu tư đó.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_e7602a285623f23d-147\" style=\"font-size: 14px;\"\u003e28. Tiền bản quyền được tính dồn tích căn cứ vào các điều khoản của hợp đồng (ví dụ như tiền bản quyền của một cuốn sách được tính dồn tích trên cơ sở số lượng sách xuất bản từng lần và theo từng lần xuất bản) hoặc tính trên cơ sở hợp đồng từng lần.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_e7602a285623f23d-148\" style=\"font-size: 14px;\"\u003e29. Doanh thu được ghi nhận khi đảm bảo là doanh nghiệp nhận được lợi ích kinh tế từ giao dịch. Khi không thể thu hồi một khoản mà trước đó đã ghi vào doanh thu thì khoản có khả năng không thu hồi được hoặc không chắc chắn thu hồi được đó phải hạch toán vào chi phí phát sinh trong kỳ, không ghi giảm doanh thu.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003eThu nhập khác\u003c/p\u003e\n   \u003cp id=\"p-rc_540cd0679c28d263-163\" style=\"font-size: 14px;\"\u003e30. Thu nhập khác quy định trong chuẩn mực này bao gồm các khoản thu từ các hoạt động xảy ra không thường xuyên, ngoài các hoạt động tạo ra doanh thu, gồm:\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_540cd0679c28d263-164\" style=\"font-size: 14px;\"\u003eThu về thanh lý tài sản cố định, nhượng bán tài sản cố định;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_540cd0679c28d263-165\" style=\"font-size: 14px;\"\u003eThu tiền phạt khách hàng do vi phạm hợp đồng;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eThu tiền bảo hiểm được bồi thường;\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eThu được các khoản nợ phải thu đã xóa sổ tính vào chi phí kỳ trước;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_540cd0679c28d263-167\" style=\"font-size: 14px;\"\u003eKhoản nợ phải trả nay mất chủ được ghi tăng thu nhập;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_540cd0679c28d263-168\" style=\"font-size: 14px;\"\u003eThu các khoản thuế được giảm, được hoàn lại;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_540cd0679c28d263-169\" style=\"font-size: 14px;\"\u003eCác\u0026nbsp;khoản thu khác.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_540cd0679c28d263-170\" style=\"font-size: 14px;\"\u003e31. Khoản thu về thanh lý tài sản cố định, nhượng bán tài sản cố định là tổng số tiền đã thu và sẽ thu được của người mua từ hoạt động thanh lý, nhượng bán tài sản cố định. Các chi phí về thanh lý, nhượng bán tài sản cố định được ghi nhận là chi phí để xác định kết quả kinh doanh trong kỳ.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_540cd0679c28d263-171\" style=\"font-size: 14px;\"\u003e32. Thu được các khoản nợ phải thu đã xóa sổ tính vào chi phí của kỳ trước là khoản nợ phải thu khó đòi, xác định là không thu hồi được, đã được xử lý xóa sổ và tính vào chi phí để xác định kết quả kinh doanh trong các kỳ trước nay thu hồi được.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_540cd0679c28d263-172\" style=\"font-size: 14px;\"\u003e33. Khoản nợ phải trả nay mất chủ là khoản nợ phải trả không xác định được chủ nợ hoặc chủ nợ không còn tồn tại.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-size: 14px;\"\u003eTRÌNH BÀY BÁO CÁO TÀI CHÍNH\u003c/p\u003e\n   \u003cp id=\"p-rc_540cd0679c28d263-173\" style=\"font-size: 14px;\"\u003e34. Trong báo cáo tài chính, doanh nghiệp phải trình bày:\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_540cd0679c28d263-174\" style=\"font-size: 14px;\"\u003ea) Chính sách kế toán được áp dụng trong việc ghi nhận doanh thu bao gồm phương pháp xác định phần công việc đã hoàn thành của các giao dịch về cung cấp dịch vụ;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_540cd0679c28d263-175\" style=\"font-size: 14px;\"\u003eb) Doanh thu của từng loại giao dịch và sự kiện:\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_540cd0679c28d263-176\" style=\"font-size: 14px;\"\u003eDoanh thu bán hàng;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_540cd0679c28d263-177\" style=\"font-size: 14px;\"\u003eDoanh thu cung cấp dịch vụ;\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_540cd0679c28d263-178\" style=\"font-size: 14px;\"\u003eTiền lãi, tiền bản quyền, cổ tức và lợi nhuận được chia.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp id=\"p-rc_540cd0679c28d263-179\" style=\"font-size: 14px;\"\u003ec) Doanh thu từ việc trao đổi hàng hóa hoặc dịch vụ theo từng loại hoạt động trên.\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp class=\"source-inline-chip-container ng-star-inserted\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003e\u003c/p\u003e\n   \u003cp style=\"font-family: 'Times New Roman', Times, serif;\"\u003ed) Thu nhập khác, trong đó trình bày cụ thể các khoản thu nhập bất thường./.\u003c/p\u003e\n   \u003cp style=\"text-align: justify;\"\u003e\u003cspan style=\"font-size: 12.0pt; font-family: 'Times New Roman';\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003c/div\u003e\n  \u003cdiv style=\"width: 100%; margin-top: 32px; font-family: 'Times New Roman', serif; font-size: 14px; color: #000; display: flex; justify-content: flex-end;\"\u003e\n   \u003cdiv style=\"display: table-cell; width: 50%; text-align: center; vertical-align: top; font-weight: bold; line-height: 1.8;\"\u003e\n    \u003cdiv style=\"font-weight: bold; text-transform: uppercase; line-height: 1;\"\u003e\n     BỘ TRƯỞNG\n    \u003c/div\u003e\n    \u003cdiv style=\"font-style: italic; font-weight: bold;\"\u003e\n     (Đã ký)\n    \u003c/div\u003e\n    \u003cdiv style=\"font-weight: bold; margin-top: 16px;\"\u003e\n     Nguyễn Sinh Hùng\n    \u003c/div\u003e\n   \u003c/div\u003e\n  \u003c/div\u003e\n \u003c/body\u003e\n\u003c/html\u003e"])</script><script>self.__next_f.push([1,"d:[[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"Legislation\\\",\\\"name\\\":\\\"Quyết định số 149/2001/QĐ-BTC Về việc ban hành và công bố bốn (4) chu

m ghi giảm.\u003c/p\u003e\n  \u003ch5\u003eSự thay đổi trong việc phân loại hoạt động ở nước ngoài\u003c/h5\u003e\n  \u003cp\u003e32. Khi có sự thay đổi trong việc phân loại hoạt động ở nước ngoài, các quy định chuyển đổi báo cáo tài chính của hoạt động ở nước ngoài được áp dụng kể từ ngày thay đổi phân loại đó.\u003c/p\u003e\n  \u003cp\u003e33. Việc phân loại hoạt động ở nước ngoài có thể thay đổi khi có sự thay đổi mức độ phụ thuộc về tài chính và hoạt động với doanh nghiệp báo cáo. Khi hoạt động ở nước ngoài là một bộ phận không thể tách rời với hoạt động của doanh nghiệp báo cáo được phân loại lại như một cơ sở ở nước ngoài thì chênh lệch tỷ giá hối đoái phát sinh từ việc chuyển đổi tài sản phi tiền tệ được phân loại như là vốn chủ sở hữu tại ngày phân loại lại. Khi một cơ sở ở nước ngoài được phân loại lại như một hoạt động ở nước ngoài không thể tách rời với hoạt động của doanh nghiệp báo cáo, giá trị đã được chuyển đổi của những khoản mục tài sản phi tiền tệ tại ngày chuyển đổi được coi như là giá gốc của chúng trong kỳ thay đổi và các kỳ tiếp theo. Chênh lệch tỷ giá hối đoái hoãn lại không được ghi nhận là thu nhập hoặc chi phí cho đến khi thanh lý hoạt động.\u003c/p\u003e\n  \u003cp\u003eTrình bày báo cáo tài chính\u003c/p\u003e\n  \u003cp\u003e34. Doanh nghiệp phải trình bày trong báo cáo tài chính:\u003c/p\u003e\n  \u003cp\u003ea) Khoản chênh lệch tỷ giá hối đoái đã được ghi nhận trong lãi hoặc lỗ thuần trong kỳ;\u003c/p\u003e\n  \u003cp\u003eb) Chênh lệch tỷ giá hối đoái thuần được phân loại như vốn chủ sở hữu (theo đoạn 12a, đoạn 14) và phản ánh là một phần riêng biệt của vốn chủ sở hữu và phải trình bày cả khoản chênh lệch tỷ giá hối đoái đầu kỳ và cuối kỳ;\u003c/p\u003e\n  \u003cp\u003e35. Khi đơn vị tiền tệ báo cáo khác với đồng tiền của nước sở tại mà doanh nghiệp đang hoạt động, doanh nghiệp phải trình bày rõ lý do, kể cả khi thay đổi đơn vị tiền tệ báo cáo.\u003c/p\u003e\n  \u003cp\u003e36. Khi có sự thay đổi trong việc phân loại hoạt động ở nước ngoài có ảnh hưởng lớn đến doanh nghiệp báo cáo thì doanh nghiệp phải trình bày:\u003c/p\u003e\n  \u003cp\u003ea) Bản chất của sự thay đổi trong việc phân loại;\u003c/p\u003e\n  \u003cp\u003eb) Lý do thay đổi;\u003c/p\u003e\n  \u003cp\u003ec) ảnh hưởng của sự thay đổi trong việc phân loại đến vốn chủ sở hữu;\u003c/p\u003e\n  \u003cp\u003ed) Tác động đến lãi, lỗ thuần của kỳ trước có ảnh hưởng trong việc phân loại diễn ra ở đầu kỳ gần nhất.\u003c/p\u003e\n  \u003cp\u003e37. Doanh nghiệp phải trình bày phương pháp được lựa chọn (theo quy định tại đoạn 27) để chuyển đổi các điều chỉnh về giá trị lợi thế thương mại và giá trị hợp lý phát sinh trong việc mua cơ sở ở nước ngoài.\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eHỆ THỐNG CHUẨN MỰC KẾ TOÁN VIỆT \u003c/strong\u003e\u003cstrong\u003eNAM\u003c/strong\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eChuẩn mực số \u0026nbsp;15\u003c/strong\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003eHỢP ĐỒNG XÂY DỰNG\u003cbr\u003e\u003cem\u003e(Ban hành và công bố theo Quyết định số \u003ca\u003e165/2002/QĐ-BTC\u003c/a\u003e ngày 31 tháng 12 năm 2002 của Bộ trưởng Bộ Tài chính)\u003c/em\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eQUY ĐỊNH CHUNG\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e01. Mục đích của chuẩn mực này là quy định và hướng dẫn các nguyên tắc và phương pháp kế toán doanh thu và chi phí liên quan đến hợp đồng xây dựng, gồm: Nội dung doanh thu và chi phí của hợp đồng xây dựng; ghi nhận doanh thu, chi phí của hợp đồng xây dựng làm cơ sở ghi sổ kế toán và lập báo cáo tài chính.\u003c/p\u003e\n  \u003cp\u003e02. Chuẩn mực này áp dụng cho kế toán hợp đồng xây dựng và lập báo cáo tài chính của các nhà thầu.\u003c/p\u003e\n  \u003cp\u003e03. Các thuật ngữ trong chuẩn mực này được hiểu như sau:\u003c/p\u003e\n  \u003cp\u003eHợp đồng xây dựng: Là hợp đồng bằng văn bản về việc xây dựng một tài sản hoặc tổ hợp các tài sản có liên quan chặt chẽ hay phụ thuộc lẫn nhau về mặt thiết kế, công nghệ, chức năng hoặc các mục đích sử dụng cơ bản của chúng.\u003c/p\u003e\n  \u003cp\u003eHợp đồng xây dựng với giá cố định: Là hợp đồng xây dựng trong đó nhà thầu chấp thuận một mức giá cố định cho toàn bộ hợp đồng hoặc một đơn giá cố định trên một đơn vị sản phẩm hoàn thành. Trong một số trường hợp khi giá cả tăng lên, mức giá đó có thể thay đổi phụ thuộc vào các điều khoản ghi trong hợp đồng.\u003c/p\u003e\n  \u003cp\u003eHợp đồng xây dựng với chi phí phụ thêm: Là hợp đồng xây dựng trong đó nhà thầu được hoàn lại các chi phí thực tế được phép thanh toán, cộng (+) thêm một khoản được tính bằng tỷ lệ phần trăm (%) trên những chi phí này hoặc được tính thêm một khoản phí cố định.\u003c/p\u003e\n  \u003cp\u003e04. Hợp đồng xây dựng có thể được thỏa thuận để xây dựng một tài sản đơn lẻ, như: Một chiếc cầu, một tòa nhà, một đường ống dẫn dầu, một con đường hoặc xây dựng tổ hợp các tài sản có liên quan chặt chẽ hay phụ thuộc lẫn nhau về thiết kế, công nghệ, chức năng hay mục đích sử dụng cơ bản của chúng, như: Một nhà máy lọc dầu, tổ hợp nhà máy dệt, may.\u003c/p\u003e\n  \u003cp\u003e05. Trong chuẩn mực này, hợp đồng xây dựng còn bao gồm:\u003c/p\u003e\n  \u003cp\u003e(a) Hợp đồng dịch vụ có liên quan trực tiếp đến việc xây dựng tài sản, như: Hợp đồng tư vấn, thiết kế, khảo sát; Hợp đồng dịch vụ quản lý dự án và kiến trúc;\u003c/p\u003e\n  \u003cp\u003e(b) Hợp đồng phục chế hay phá hủy các tài sản và khôi phục môi trường sau khi phá hủy các tài sản.\u003c/p\u003e\n  \u003cp\u003e06. Hợp đồng xây dựng quy định trong chuẩn mực này được phân loại thành hợp đồng xây dựng với giá cố định và hợp đồng xây dựng với chi phí phụ thêm. Một số hợp đồng xây dựng có đặc điểm của cả hợp đồng với giá cố định và hợp đồng với chi phí phụ thêm. Ví dụ hợp đồng xây dựng với chi phí phụ thêm nhưng có thỏa thuận mức giá tối đa. Trường hợp này, nhà thầu cần phải xem xét tất cả các điều kiện quy định trong đoạn 23 và 24 để ghi nhận doanh thu và chi phí của hợp đồng xây dựng.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eKết hợp và phân chia hợp đồng xây dựng\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e07. Các yêu cầu của chuẩn mực này thường áp dụng riêng rẽ cho từng hợp đồng xây dựng. Trong một số trường hợp, chuẩn mực này được áp dụng cho những phần riêng biệt có thể nhận biết được của một hợp đồng riêng rẽ hoặc một nhóm các hợp đồng để phản ánh bản chất của hợp đồng hay nhóm các hợp đồng xây dựng.\u003c/p\u003e\n  \u003cp\u003e08. Một hợp đồng xây dựng liên quan đến xây dựng một số tài sản thì việc xây dựng mỗi tài sản sẽ được coi như một hợp đồng xây dựng riêng rẽ khi thỏa mãn đồng thời ba (3) điều kiện sau:\u003c/p\u003e\n  \u003cp\u003e(a) Có thiết kế, dự toán được xác định riêng rẽ cho từng tài sản và mỗi tài sản có thể hoạt động độc lập;\u003c/p\u003e\n  \u003cp\u003e(b) Mỗi tài sản có thể được đàm phán riêng với từng nhà thầu và khách hàng có thể chấp thuận hoặc từ chối phần hợp đồng liên quan đến từng tài sản;\u003c/p\u003e\n  \u003cp\u003e(c) Có thể xác định được chi phí và doanh thu của từng tài sản.\u003c/p\u003e\n  \u003cp\u003e09. Một nhóm các hợp đồng ký với một khách hàng hay với một số khách hàng, sẽ được coi là một hợp đồng xây dựng khi thỏa mãn đồng thời ba (3) điều kiện sau:\u003c/p\u003e\n  \u003cp\u003e(a) Các hợp đồng này được đàm phán như là một hợp đồng trọn gói;\u003c/p\u003e\n  \u003cp\u003e(b) Các hợp đồng có mối liên hệ rất mật thiết với nhau đến mức trên thực tế chúng là nhiều bộ phận của một dự án có mức lãi gộp ước tính tương đương;\u003c/p\u003e\n  \u003cp\u003e(c) Các hợp đồng được thực hiện đồng thời hoặc theo một quá trình liên tục.\u003c/p\u003e\n  \u003cp\u003e10. Một hợp đồng có thể bao gồm việc xây dựng thêm một tài sản theo yêu cầu của khách hàng hoặc hợp đồng có thể sửa đổi để bao gồm việc xây dựng thêm một tài sản đó. Việc xây dựng thêm một tài sản chỉ được coi là hợp đồng xây dựng riêng rẽ khi:\u003c/p\u003e\n  \u003cp\u003e(a) Tài sản này có sự khác biệt lớn và độc lập so với các tài sản nêu trong hợp đồng ban đầu về thiết kế, công nghệ và chức năng; hoặc\u003c/p\u003e\n  \u003cp\u003e(b) Giá của hợp đồng xây dựng tài sản này được thỏa thuận không liên quan đến giá cả của hợp đồng ban đầu.\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eNỘI DUNG CHUẨN MỰC\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eDoanh thu của hợp đồng xây dựng\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e11. Doanh thu của hợp đồng xây dựng bao gồm:\u003c/p\u003e\n  \u003cp\u003e(a) Doanh thu ban đầu được ghi trong hợp đồng; và\u003c/p\u003e\n  \u003cp\u003e(b) Các khoản tăng, giảm khi thực hiện hợp đồng, các khoản tiền thưởng và các khoản thanh toán khác nếu các khoản này có khả năng làm thay đổi doanh thu, và có thể xác định được một cách đáng tin cậy.\u003c/p\u003e\n  \u003cp\u003e12. Doanh thu của hợp đồng xây dựng được xác định bằng giá trị hợp lý của các khoản đã thu hoặc sẽ thu được. Việc xác định doanh thu của hợp đồng chịu tác động của nhiều yếu tố không chắc chắn vì chúng tuỳ thuộc vào các sự kiện sẽ xảy ra trong tương lai. Việc ước tính thường phải được sửa đổi khi các sự kiện đó phát sinh và những yếu tố không chắc chắn được giải quyết. Vì vậy, doanh thu của hợp đồng có thể tăng hay giảm ở từng thời kỳ. Ví dụ:\u003c/p\u003e\n  \u003cp\u003e(a) Nhà thầu và khách hàng có thể đồng ý với nhau về các thay đổi và các yêu cầu làm tăng hoặc giảm doanh thu của hợp đồng trong kỳ tiếp theo so với hợp đồng được chấp thuận ban đầu;\u003c/p\u003e\n  \u003cp\u003e(b) Doanh thu đã được thỏa thuận trong hợp đồng với giá cố định có thể tăng vì lý do giá cả tăng lên;\u003c/p\u003e\n  \u003cp\u003e(c) Doanh thu theo hợp đồng có thể bị giảm do nhà thầu không thực hiện đúng tiến độ hoặc không đảm bảo chất lượng xây dựng theo thỏa thuận trong hợp đồng;\u003c/p\u003e\n  \u003cp\u003e(d) Khi hợp đồng với giá cố định quy định mức giá cố định cho một đơn vị sản phẩm hoàn thành thì doanh thu theo hợp đồng sẽ tăng hoặc giảm khi khối lượng sản phẩm tăng hoặc giảm.\u003c/p\u003e\n  \u003cp\u003e13. Sự thay đổi theo yêu cầu của khách hàng về phạm vi công việc được thực hiện theo hợp đồng. Ví dụ: Sự thay đổi yêu cầu kỹ thuật hay thiết kế của tài sản và thay đổi khác trong quá trình thực hiện hợp đồng. Sự thay đổi này chỉ được tính vào doanh thu của hợp đồng khi:\u003c/p\u003e\n  \u003cp\u003e(a) Có khả năng chắc chắn khách hàng sẽ chấp thuận các thay đổi và doanh thu phát sinh từ các thay đổi đó; và\u003c/p\u003e\n  \u003cp\u003e(b) Doanh thu có thể xác định được một cách tin cậy.\u003c/p\u003e\n  \u003cp\u003e14. Khoản tiền thưởng là các khoản phụ thêm trả cho nhà thầu nếu họ thực hiện hợp đồng đạt hay vượt mức yêu cầu. Ví dụ, trong hợp đồng có dự kiến trả cho nhà thầu khoản tiền thưởng vì hoàn thành sớm hợp đồng. Khoản tiền thưởng được tính vào doanh thu của hợp đồng khi:\u003c/p\u003e\n  \u003cp\u003e(a) Chắc chắn đạt hoặc vượt mức một số tiêu chuẩn cụ thể đã ghi trong hợp đồng; và\u003c/p\u003e\n  \u003cp\u003e(b) Khoản tiền thưởng có thể xác định được một cách đáng tin cậy.\u003c/p\u003e\n  \u003cp\u003e15. Một khoản thanh toán khác mà nhà thầu thu được từ khách hàng hay một bên khác để bù đắp cho các chi phí không bao gồm trong giá hợp đồng. Ví dụ: Sự chậm trễ do khách hàng gây nên; sai sót trong các chỉ tiêu kỹ thuật hoặc thiết kế và các tranh chấp về các thay đổi trong việc thực hiện hợp đồng. Việc xác định doanh thu tăng thêm từ các khoản thanh toán trên còn tuỳ thuộc vào rất nhiều yếu tố không chắc chắn và thường phụ thuộc vào kết quả của nhiều cuộc đàm phán. Do đó, các khoản thanh toán khác chỉ được tính vào doanh thu của hợp đồng khi:\u003c/p\u003e\n  \u003cp\u003e(a) Các thoả thuận đã đạt được kết quả là khách hàng sẽ chấp thuận bồi thường;\u003c/p\u003e\n  \u003cp\u003e(b) Khoản thanh toán khác được khách hàng chấp thuận và được xác định một cách đáng tin cậy.\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eCHI PHÍ CỦA HỢP ĐỒNG XÂY DỰNG\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e16. Chi phí của hợp đồng xây dựng bao gồm:\u003c/p\u003e\n  \u003cp\u003e(a) Chi phí liên quan trực tiếp đến từng hợp đồng;\u003c/p\u003e\n  \u003cp\u003e(b) Chi phí chung liên quan đến hoạt động của các hợp đồng và có thể phân bổ cho từng hợp đồng cụ thể;\u003c/p\u003e\n  \u003cp\u003e(c) Các chi phí khác có thể thu lại từ khách hàng theo các điều khoản của hợp đồng.\u003c/p\u003e\n  \u003cp\u003e17. Chi phí liên quan trực tiếp đến từng hợp đồng bao gồm:\u003c/p\u003e\n  \u003cp\u003e(a) Chi phí nhân công tại công trường, bao gồm cả chi phí giám sát công trình;\u003c/p\u003e\n  \u003cp\u003e(b) Chi phí nguyên liệu, vật liệu, bao gồm cả thiết bị cho công trình;\u003c/p\u003e\n  \u003cp\u003e(c) Khấu hao máy móc, thiết bị và các TSCĐ khác sử dụng để thực hiện hợp đồng;\u003c/p\u003e\n  \u003cp\u003e(d) Chi phí vận chuyển, lắp đặt, tháo dỡ máy móc, thiết bị và nguyên liệu, vật liệu đến và đi khỏi công trình;\u003c/p\u003e\n  \u003cp\u003e(đ) Chi phí thuê nhà xưởng, máy móc, thiết bị để thực hiện hợp đồng;\u003c/p\u003e\n  \u003cp\u003e(e) Chi phí thiết kế và trợ giúp kỹ thuật liên quan trực tiếp đến hợp đồng;\u003c/p\u003e\n  \u003cp\u003e(g) Chi phí dự tính để sửa chữa và bảo hành công trình;\u003c/p\u003e\n  \u003cp\u003e(h) Các chi phí liên quan trực tiếp khác.\u003c/p\u003e\n  \u003cp\u003eChi phí liên quan trực tiếp của từng hợp đồng sẽ được giảm khi có các khoản thu nhập khác không bao gồm trong doanh thu của hợp đồng. Ví dụ: Các khoản thu từ việc bán nguyên liệu, vật liệu thừa, thu thanh lý máy móc, thiết bị thi công khi kết thúc hợp đồng.\u003c/p\u003e\n  \u003cp\u003e18. Chi phí chung liên quan đến hoạt động của các hợp đồng xây dựng và có thể phân bổ cho từng hợp đồng, bao gồm:\u003c/p\u003e\n  \u003cp\u003e(a) Chi phí bảo hiểm;\u003c/p\u003e\n  \u003cp\u003e(b) Chi phí thiết kế và trợ giúp kỹ thuật không liên quan trực tiếp đến một hợp đồng cụ thể;\u003c/p\u003e\n  \u003cp\u003e(c) Chi phí quản lý chung trong xây dựng.\u003c/p\u003e\n  \u003cp\u003eCác chi phí trên được phân bổ theo các phương pháp thích hợp một cách có hệ thống theo tỷ lệ hợp lý và được áp dụng thống nhất cho tất cả các chi phí có các đặc điểm tương tự. Việc phân bổ cần dựa trên mức thông thường của hoạt động xây dựng. (Chi phí chung liên quan đến hoạt động của các hợp đồng và có thể phân bổ cho từng hợp đồng cũng bao gồm chi phí đi vay nếu thỏa mãn các điều kiện chi phí đi vay được vốn hóa theo quy định trong Chuẩn mực \"Chi phí đi vay\").\u003c/p\u003e\n  \u003cp\u003e19. Các chi phí khác có thể thu lại từ khách hàng theo các điều khoản của hợp đồng như chi phí giải phóng mặt bằng, chi phí triển khai mà khách hàng phải trả lại cho nhà thầu đã được quy định trong hợp đồng.\u003c/p\u003e\n  \u003cp\u003e20. Chi phí không liên quan đến hoạt động của hợp đồng hoặc không thể phân bổ cho hợp đồng xây dựng thì không được tính trong chi phí của hợp đồng xây dựng. Các chi phí này bao gồm:\u003c/p\u003e\n  \u003cp\u003e(a) Chi phí quản lý hành chính chung, hoặc chi phí nghiên cứu, triển khai mà hợp đồng không quy định khách hàng phải trả cho nhà thầu.\u003c/p\u003e\n  \u003cp\u003e(b) Chi phí bán hàng;\u003c/p\u003e\n  \u003cp\u003e(c) Khấu hao máy móc, thiết bị và TSCĐ khác không sử dụng cho hợp đồng xây dựng.\u003c/p\u003e\n  \u003cp\u003e21. Chi phí của hợp đồng bao gồm chi phí liên quan đến hợp đồng trong suốt giai đoạn kể từ khi ký hợp đồng cho đến khi kết thúc hợp đồng. Các chi phí liên quan trực tiếp đến hợp đồng phát sinh trong quá trình đàm phán hợp đồng cũng được coi là một phần chi phí của hợp đồng nếu chúng có thể xác định riêng rẽ, có thể ước tính một cách đáng tin cậy và có nhiều khả năng là hợp đồng sẽ được ký kết. Nếu chi phí phát sinh trong quá trình đàm phán hợp đồng đã được ghi nhận là chi phí sản xuất, kinh doanh trong kỳ khi chúng phát sinh thì chúng không còn được coi là chi phí của hợp đồng xây dựng khi hợp đồng được ký kết vào thời kỳ tiếp sau.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eGhi nhận doanh thu và chi phí của hợp đồng\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e22. Doanh thu và chi phí của hợp đồng xây dựng được ghi nhận theo 2 trường hợp sau:\u003c/p\u003e\n  \u003cp\u003e(a) Trường hợp hợp đồng xây dựng quy định nhà thầu được thanh toán theo tiến độ kế hoạch, khi kết quả thực hiện hợp đồng xây dựng được ước tính một cách đáng tin cậy, thì doanh thu và chi phí liên quan đến hợp đồng được ghi nhận tương ứng với phần công việc đã hoàn thành do nhà thầu tự xác định vào ngày lập báo cáo tài chính mà không phụ thuộc vào hóa đơn thanh toán theo tiến độ kế hoạch đã lập hay chưa và số tiền ghi trên hóa đơn là bao nhiêu.\u003c/p\u003e\n  \u003cp\u003e(b) Trường hợp hợp đồng xây dựng quy định nhà thầu được thanh toán theo giá trị khối lượng thực hiện, khi kết quả thực hiện hợp đồng xây dựng được xác định một cách đáng tin cậy và được khách hàng xác nhận, thì doanh thu và chi phí liên quan đến hợp đồng được ghi nhận tương ứng với phần công việc đã hoàn thành được khách hàng xác nhận trong kỳ được phản ánh trên hóa đơn đã lập.\u003c/p\u003e\n  \u003cp\u003e23. Đối với hợp đồng xây dựng với giá cố định, kết quả của hợp đồng được ước tính một cách đáng tin cậy khi đồng thời thỏa mãn bốn (4) điều kiện sau:\u003c/p\u003e\n  \u003cp\u003e(a) Tổng doanh thu của hợp đồng tính toán được một cách đáng tin cậy;\u003c/p\u003e\n  \u003cp\u003e(b) Doanh nghiệp thu được lợi ích kinh tế từ hợp đồng;\u003c/p\u003e\n  \u003cp\u003e(c) Chi phí để hoàn thành hợp đồng và phần công việc đã hoàn thành tại thời điểm lập báo cáo tài chính được tính toán một cách đáng tin cậy;\u003c/p\u003e\n  \u003cp\u003e(d) Các khoản chi phí liên quan đến hợp đồng có thể xác định được rõ ràng và tính toán được một cách đáng tin cậy để tổng chi phí thực tế của hợp đồng có thể so sánh được với tổng dự toán.\u003c/p\u003e\n  \u003cp\u003e24. Đối với hợp đồng xây dựng với chi phí phụ thêm, kết quả của hợp đồng được ước tính một cách tin cậy khi đồng thời thỏa mãn hai điều kiện sau:\u003c/p\u003e\n  \u003cp\u003e(a) Doanh nghiệp thu được lợi ích kinh tế từ hợp đồng;\u003c/p\u003e\n  \u003cp\u003e(b) Các khoản chi phí liên quan đến hợp đồng có thể xác định được rõ ràng và tính toán được một cách đáng tin cậy không kể có được hoàn trả hay không.\u003c/p\u003e\n  \u003cp\u003e25. Doanh thu và chi phí được ghi nhận theo phần công việc đã hoàn thành của hợp đồng được gọi là phương pháp tỷ lệ phần trăm (%) hoàn thành. Theo phương pháp này, doanh thu được xác định phù hợp với chi phí đã phát sinh của khối lượng công việc đã hoàn thành thể hiện trong báo cáo kết quả hoạt động kinh doanh.\u003c/p\u003e\n  \u003cp\u003e26. Theo phương pháp tỷ lệ phần trăm (%) hoàn thành, doanh thu và chi phí của hợp đồng được ghi nhận trong báo cáo kết quả hoạt động kinh doanh là doanh thu và chi phí của phần công việc đã hoàn thành trong kỳ báo cáo.\u003c/p\u003e\n  \u003cp\u003e27. Một nhà thầu có thể phải bỏ ra những chi phí liên quan tới việc hình thành hợp đồng. Những chi phí này được ghi nhận là các khoản ứng trước nếu chúng có thể được hoàn trả. Những chi phí này thể hiện một lượng tiền mà khách hàng phải trả và được phân loại như là công trình xây dựng dở dang.\u003c/p\u003e\n  \u003cp\u003e28. Kết quả thực hiện hợp đồng xây dựng chỉ có thể xác định được một cách đáng tin cậy khi doanh nghiệp có thể thu được lợi ích kinh tế từ hợp đồng. Trường hợp có sự nghi ngờ về khả năng không thu được một khoản nào đó đã được tính trong doanh thu của hợp đồng và đã được ghi trong báo cáo kết quả kinh doanh thì những khoản không có khả năng thu được đó phải được ghi nhận vào chi phí.\u003c/p\u003e\n  \u003cp\u003e29. Doanh nghiệp chỉ có thể lập các ước tính về doanh thu hợp đồng xây dựng một cách đáng tin cậy khi đã thỏa thuận trong hợp đồng các điều khoản sau:\u003c/p\u003e\n  \u003cp\u003e(a) Trách nhiệm pháp lý của mỗi bên đối với tài sản được xây dựng;\u003c/p\u003e\n  \u003cp\u003e(b) Các điều kiện để thay đổi giá trị hợp đồng;\u003c/p\u003e\n  \u003cp\u003e(c) Phương thức và thời hạn thanh toán.\u003c/p\u003e\n  \u003cp\u003eDoanh nghiệp phải thường xuyên xem xét và khi cần thiết phải điều chỉnh lại các dự toán về doanh thu và chi phí của hợp đồng trong quá trình thực hiện hợp đồng.\u003c/p\u003e\n  \u003cp\u003e30. Phần công việc đã hoàn thành của hợp đồng làm cơ sở xác định doanh thu có thể được xác định bằng nhiều cách khác nhau. Doanh nghiệp cần sử dụng phương pháp tính toán thích hợp để xác định phần công việc đã hoàn thành. Tuỳ thuộc vào bản chất của hợp đồng xây dựng, doanh nghiệp lựa chọn áp dụng một trong ba (3) phương pháp sau để xác định phần công việc hoàn thành:\u003c/p\u003e\n  \u003cp\u003e(a) Tỷ lệ phần trăm (%) giữa chi phí đã phát sinh của phần công việc đã hoàn thành tại một thời điểm so với tổng chi phí dự toán của hợp đồng;\u003c/p\u003e\n  \u003cp\u003e(b) Đánh giá phần công việc đã hoàn thành; hoặc\u003c/p\u003e\n  \u003cp\u003e(c) Tỷ lệ phần trăm (%) giữa khối lượng xây lắp đã hoàn thành so với tổng khối lượng xây lắp phải hoàn thành của hợp đồng.\u003c/p\u003e\n  \u003cp\u003eViệc thanh toán theo tiến độ và những khoản ứng trước nhận được từ khách hàng thường không phản ánh phần công việc đã hoàn thành.\u003c/p\u003e\n  \u003cp\u003e31. Khi phần công việc đã hoàn thành được xác định bằng phương pháp tỷ lệ phần trăm (%) giữa chi phí đã phát sinh của phần công việc đã hoàn thành tại một thời điểm so với tổng chi phí dự toán của hợp đồng, thì những chi phí liên quan tới phần công việc đã hoàn thành sẽ được tính vào chi phí cho tới thời điểm đó. Những chi phí không được tính vào phần công việc đã hoàn thành của hợp đồng có thể là:\u003c/p\u003e\n  \u003cp\u003e(a) Chi phí của hợp đồng xây dựng liên quan tới các hoạt động trong tương lai của hợp đồng như: Chi phí nguyên vật liệu đã được chuyển tới địa điểm xây dựng hoặc được dành ra cho việc sử dụng trong hợp đồng nhưng chưa được lắp đặt, chưa sử dụng trong quá trình thực hiện hợp đồng, trừ trường hợp những nguyên vật liệu đó được chế tạo đặc biệt cho hợp đồng;\u003c/p\u003e\n  \u003cp\u003e(b) Các khoản tạm ứng cho nhà thầu phụ trước khi công việc của hợp đồng phụ được hoàn thành.\u003c/p\u003e\n  \u003cp\u003e32. Khi kết quả thực hiện hợp đồng xây dựng không thể ước tính được một cách đáng tin cậy, thì:\u003c/p\u003e\n  \u003cp\u003e(a) Doanh thu chỉ được ghi nhận tương đương với chi phí của hợp đồng đã phát sinh mà việc được hoàn trả là tương đối chắc chắn;\u003c/p\u003e\n  \u003cp\u003e(b) Chi phí của hợp đồng chỉ được ghi nhận là chi phí trong kỳ khi các chi phí này đã phát sinh.\u003c/p\u003e\n  \u003cp\u003e33. Trong giai đoạn đầu của một hợp đồng xây dựng thường xảy ra trường hợp kết quả thực hiện hợp đồng không thể ước tính được một cách đáng tin cậy. Trường hợp doanh nghiệp có thể thu hồi được những khoản chi phí của hợp đồng đã bỏ ra thì doanh thu của hợp đồng được ghi nhận chỉ tới mức các chi phí đã bỏ ra có khả năng thu hồi. Khi kết quả thực hiện hợp đồng không thể ước tính được một cách đáng tin cậy thì không một khoản lợi nhuận nào được ghi nhận, kể cả khi tổng chi phí thực hiện hợp đồng có thể vượt quá tổng doanh thu của hợp đồng.\u003c/p\u003e\n  \u003cp\u003e34. Các chi phí liên quan đến hợp đồng không thể thu hồi được phải được ghi nhận ngay là chi phí trong kỳ đối với các trường hợp:\u003c/p\u003e\n  \u003cp\u003e(a) Không đủ điều kiện về mặt pháp lý để tiếp tục thực hiện hợp đồng;\u003c/p\u003e\n  \u003cp\u003e(b) Việc tiếp tục thực hiện hợp đồng còn tuỳ thuộc vào kết quả xử lý các đơn kiện hoặc ý kiến của cơ quan có thẩm quyền;\u003c/p\u003e\n  \u003cp\u003e(c) Hợp đồng có liên quan tới tài sản có khả năng bị trưng thu hoặc tịch thu;\u003c/p\u003e\n  \u003cp\u003e(d) Hợp đồng mà khách hàng không thể thực thi nghĩa vụ của mình;\u003c/p\u003e\n  \u003cp\u003e(đ) Hợp đồng mà nhà thầu không thể hoàn thành hoặc không thể thực thi theo nghĩa vụ quy định trong hợp đồng.\u003c/p\u003e\n  \u003cp\u003e35. Khi loại bỏ được các yếu tố không chắc chắn liên quan đến việc ước tính một cách đáng tin cậy kết quả thực hiện hợp đồng thì doanh thu và chi phí có liên quan tới hợp đồng xây dựng sẽ được ghi nhận tương ứng với phần công việc đã hoàn thành.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eNhững thay đổi trong các ước tính\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e36. Phương pháp tỷ lệ phần trăm (%) hoàn thành được tính trên cơ sở luỹ kế từ khi khởi công đến cuối mỗi kỳ kế toán đối với các ước tính về doanh thu và chi phí của hợp đồng xây dựng. ảnh hưởng của mỗi thay đổi trong việc ước tính doanh thu hoặc chi phí của hợp đồng, hoặc ảnh hưởng của mỗi thay đổi trong ước tính kết quả thực hiện hợp đồng được hạch toán như một thay đổi ước tính kế toán. Những ước tính đã thay đổi được sử dụng trong việc xác định doanh thu và chi phí được ghi nhận trong báo cáo kết quả kinh doanh trong kỳ xảy ra sự thay đổi đó hoặc trong các kỳ tiếp theo.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eTrình bày báo cáo tài chính\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e37. Doanh nghiệp phải trình bày trong báo cáo tài chính:\u003c/p\u003e\n  \u003cp\u003e(a) Phương pháp xác định doanh thu ghi nhận trong kỳ và phương pháp xác định phần công việc đã hoàn thành của hợp đồng xây dựng;\u003c/p\u003e\n  \u003cp\u003e(b) Doanh thu của hợp đồng xây dựng được ghi nhận trong kỳ báo cáo;\u003c/p\u003e\n  \u003cp\u003e(c) Tổng doanh thu luỹ kế của hợp đồng xây dựng được ghi nhận cho tới thời điểm báo cáo;\u003c/p\u003e\n  \u003cp\u003e(d) Số tiền còn phải trả cho khách hàng;\u003c/p\u003e\n  \u003cp\u003e(đ) Số tiền còn phải thu của khách hàng;\u003c/p\u003e\n  \u003cp\u003eĐối với nhà thầu được thanh toán theo tiến độ kế hoạch quy định trong hợp đồng xây dựng (trường hợp quy định tại đoạn 22a) phải báo cáo thêm các chỉ tiêu:\u003c/p\u003e\n  \u003cp\u003e(e) Phải thu theo tiến độ kế hoạch;\u003c/p\u003e\n  \u003cp\u003e(g) Phải trả theo tiến độ kế hoạch.\u003c/p\u003e\n  \u003cp\u003e38. Số tiền còn phải trả cho khách hàng là khoản tiền nhà thầu nhận được trước khi công việc tương ứng của hợp đồng được thực hiện.\u003c/p\u003e\n  \u003cp\u003e39. Số tiền còn phải thu của khách hàng là khoản tiền đã ghi trong hóa đơn thanh toán theo tiến độ kế hoạch hoặc hóa đơn thanh toán theo giá trị khối lượng thực hiện nhưng chưa được trả cho đến khi đáp ứng đầy đủ các điều kiện chi trả theo quy định trong hợp đồng, hoặc cho đến khi những sai sót đã được sửa chữa.\u003c/p\u003e\n  \u003cp\u003e40. Phải thu theo tiến độ kế hoạch là số tiền chênh lệch giữa tổng doanh thu luỹ kế của hợp đồng xây dựng đã được ghi nhận cho tới thời điểm báo cáo, lớn hơn khoản tiền luỹ kế ghi trên hóa đơn thanh toán theo tiến độ kế hoạch của hợp đồng.\u003c/p\u003e\n  \u003cp\u003eChỉ tiêu này áp dụng đối với các hợp đồng xây dựng đang thực hiện mà các khoản doanh thu luỹ kế đã được ghi nhận lớn hơn các khoản tiền luỹ kế ghi trên hóa đơn thanh toán theo tiến độ tới thời điểm báo cáo.\u003c/p\u003e\n  \u003cp\u003e41. Phải trả theo tiến độ kế hoạch là số tiền chênh lệch giữa tổng doanh thu luỹ kế của hợp đồng xây dựng đã được ghi nhận cho tới thời điểm báo cáo, nhỏ hơn khoản tiền luỹ kế ghi trên hóa đơn thanh toán theo tiến độ kế hoạch của hợp đồng.\u003c/p\u003e\n  \u003cp\u003eChỉ tiêu này áp dụng đối với các hợp đồng xây dựng đang thực hiện mà các khoản tiền luỹ kế ghi trên các hóa đơn thanh toán theo tiến độ kế hoạch vượt quá các khoản doanh thu luỹ kế đã được ghi nhận tới thời điểm báo cáo.\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eHỆ THỐNG CHUẨN MỰC KẾ TOÁN VIỆT \u003c/strong\u003e\u003cstrong\u003eNAM \u003c/strong\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eChuẩn mực số 16\u003c/strong\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003eCHI PHÍ ĐI VAY\u003cbr\u003e\u003cem\u003e(Ban hành và công bố theo Quyết định số \u003ca\u003e165/2002/QĐ-BTC\u003c/a\u003e ngày 31 tháng 12 năm 2002 của Bộ trưởng Bộ Tài chính)\u003c/em\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eQUY ĐỊNH CHUNG\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e01. Mục đích của chuẩn mực này là quy định và hướng dẫn các nguyên tắc và phương pháp kế toán đối với chi phí đi vay, gồm: ghi nhận chi phí đi vay vào chi phí sản xuất, kinh doanh trong kỳ; vốn hoá chi phí đi vay khi các chi phí này liên quan trực tiếp đến việc đầu tư xây dựng hoặc sản xuất tài sản dở dang làm cơ sở ghi sổ kế toán và lập báo cáo tài chính.\u003c/p\u003e\n  \u003cp\u003e02. Chuẩn mực này áp dụng cho kế toán chi phí đi vay.\u003c/p\u003e\n  \u003cp\u003e03. Các thuật ngữ trong chuẩn mực này được hiểu như sau:\u003c/p\u003e\n  \u003cp\u003eChi phí đi vay: Là lãi tiền vay và các chi phí khác phát sinh liên quan trực tiếp đến các khoản vay của doanh nghiệp.\u003c/p\u003e\n  \u003cp\u003eTài sản dở dang: Là tài sản đang trong quá trình đầu tư xây dựng và tài sản đang trong quá trình sản xuất cần có một thời gian đủ dài (trên 12 tháng) để có thể đưa vào sử dụng theo mục đích định trước hoặc để bán.\u003c/p\u003e\n  \u003cp\u003e04. Chi phí đi vay bao gồm:\u003c/p\u003e\n  \u003cp\u003e(a) Lãi tiền vay ngắn hạn, lãi tiền vay dài hạn, kể cả lãi tiền vay trên các khoản thấu chi;\u003c/p\u003e\n  \u003cp\u003e(b) Phần phân bổ các khoản chiết khấu hoặc phụ trội phát sinh liên quan đến những khoản vay do phát hành trái phiếu;\u003c/p\u003e\n  \u003cp\u003e(c) Phần phân bổ các khoản chi phí phụ phát sinh liên quan tới quá trình làm thủ tục vay;\u003c/p\u003e\n  \u003cp\u003e(d) Chi phí tài chính của tài sản thuê tài chính.\u003c/p\u003e\n  \u003cp\u003e05. Ví dụ: Tài sản dở dang là tài sản đang trong quá trình đầu tư xây dựng chưa hoàn thành hoặc đã hoàn thành nhưng chưa bàn giao đưa vào sản xuất, sử dụng; sản phẩm dở dang đang trong quá trình sản xuất của những ngành nghề có chu kỳ sản xuất dài trên 12 tháng.\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eNỘI DUNG CHUẨN MỰC\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eGhi nhận chi phí đi vay\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e06. Chi phí đi vay phải ghi nhận vào chi phí sản xuất, kinh doanh trong kỳ khi phát sinh, trừ khi được vốn hoá theo quy định tại đoạn 07.\u003c/p\u003e\n  \u003cp\u003e07. Chi phí đi vay liên quan trực tiếp đến việc đầu tư xây dựng hoặc sản xuất tài sản dở dang được tính vào giá trị của tài sản đó (được vốn hoá) khi có đủ các điều kiện quy định trong chuẩn mực này.\u003c/p\u003e\n  \u003cp\u003e08. Chi phí đi vay liên quan trực tiếp đến việc đầu tư xây dựng hoặc sản xuất tài sản dở dang được tính vào giá trị của tài sản đó. Các chi phí đi vay được vốn hoá khi doanh nghiệp chắc chắn thu được lợi ích kinh tế trong tương lai do sử dụng tài sản đó và chi phí đi vay có thể xác định được một cách đáng tin cậy.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eXác định chi phí đi vay được vốn hoá\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e09. Trường hợp khoản vốn vay riêng biệt chỉ sử dụng cho mục đích đầu tư xây dựng hoặc sản xuất một tài sản dở dang thì chi phí đi vay có đủ điều kiện vốn hoá cho tài sản dở dang đó sẽ được xác định là chi phí đi vay thực tế phát sinh từ các khoản vay trừ (-) đi các khoản thu nhập phát sinh từ hoạt động đầu tư tạm thời của các khoản vay này.\u003c/p\u003e\n  \u003cp\u003e10. Các khoản thu nhập phát sinh từ hoạt động đầu tư tạm thời của các khoản vốn vay riêng biệt trong khi chờ được sử dụng vào mục đích có được tài sản dở dang thì phải ghi giảm trừ vào chi phí đi vay phát sinh khi vốn hoá.\u003c/p\u003e\n  \u003cp\u003e11. Trường hợp phát sinh các khoản vốn vay chung, trong đó có sử dụng cho mục đích đầu tư xây dựng hoặc sản xuất một tài sản dở dang thì số chi phí đi vay có đủ điều kiện vốn hoá trong mỗi kỳ kế toán được xác định theo tỷ lệ vốn hoá đối với chi phí luỹ kế bình quân gia quyền phát sinh cho việc đầu tư xây dựng hoặc sản xuất tài sản đó. Tỷ lệ vốn hoá được tính theo tỷ lệ lãi suất bình quân gia quyền của các khoản vay chưa trả trong kỳ của doanh nghiệp, ngoại trừ các khoản vay riêng biệt phục vụ cho mục đích có một tài sản dở dang. Chi phí đi vay được vốn hoá trong kỳ không được vượt quá tổng số chi phí đi vay phát sinh trong kỳ đó.\u003c/p\u003e\n  \u003cp\u003e12. Nếu có phát sinh chiết khấu hoặc phụ trội khi phát hành trái phiếu thì phải điều chỉnh lại lãi tiền vay bằng cách phân bổ giá trị khoản chiết khấu hoặc phụ trội và điều chỉnh tỷ lệ vốn hoá một cách phù hợp. Việc phân bổ khoản chiết khấu hoặc phụ trội có thể sử dụng phương pháp lãi suất thực tế hoặc phương pháp đường thẳng. Các khoản lãi tiền vay và khoản phân bổ chiết khấu hoặc phụ trội được vốn hoá trong từng kỳ không được vượt quá số lãi vay thực tế phát sinh và số phân bổ chiết khấu hoặc phụ trội trong kỳ đó.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eThời điểm bắt đầu vốn hoá\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e13. Vốn hoá chi phí đi vay vào giá trị tài sản dở dang được bắt đầu khi thoả mãn đồng thời các điều kiện sau:\u003c/p\u003e\n  \u003cp\u003e(a) Các chi phí cho việc đầu tư xây dựng hoặc sản xuất tài sản dở dang bắt đầu phát sinh;\u003c/p\u003e\n  \u003cp\u003e(b) Các chi phí đi vay phát sinh;\u003c/p\u003e\n  \u003cp\u003e(c) Các hoạt động cần thiết trong việc chuẩn bị đưa tài sản dở dang vào sử dụng hoặc bán đang được tiến hành.\u003c/p\u003e\n  \u003cp\u003e14. Chi phí cho việc đầu tư xây dựng hoặc sản xuất một tài sản dở dang bao gồm các chi phí phải thanh toán bằng tiền, chuyển giao các tài sản khác hoặc chấp nhận các khoản nợ phải trả lãi, không tính đến các khoản trợ cấp hoặc hỗ trợ liên quan đến tài sản.\u003c/p\u003e\n  \u003cp\u003e15. Các hoạt động cần thiết cho việc chuẩn bị đưa tài sản vào sử dụng hoặc bán bao gồm hoạt động xây dựng, sản xuất, hoạt động kỹ thuật và quản lý chung trước khi bắt đầu xây dựng, sản xuất như hoạt động liên quan đến việc xin giấy phép trước khi khởi công xây dựng hoặc sản xuất. Tuy nhiên những hoạt động này không bao gồm việc giữ một tài sản khi không tiến hành các hoạt động xây dựng hoặc sản xuất để thay đổi trạng thái của tài sản này. Ví dụ chi phí đi vay liên quan đến việc mua một mảnh đất cần có các hoạt động chuẩn bị mặt bằng sẽ được vốn hoá trong kỳ khi các hoạt động liên quan đến việc chuẩn bị mặt bằng đó. Tuy nhiên, chi phí đi vay phát sinh khi mua mảnh đất đó để giữ mà không có hoạt động triển khai xây dựng liên quan đến mảnh đất đó thì chi phí đi vay không được vốn hoá.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eTạm ngừng vốn hoá\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e16. Việc vốn hoá chi phí đi vay sẽ được tạm ngừng lại trong các giai đoạn mà quá trình đầu tư xây dựng hoặc sản xuất tài sản dở dang bị gián đoạn, trừ khi sự gián đoạn đó là cần thiết.\u003c/p\u003e\n  \u003cp\u003e17. Việc vốn hoá chi phí đi vay được tạm ngừng lại khi quá trình đầu tư xây dựng hoặc sản xuất tài sản dở dang bị gián đoạn một cách bất thường. Khi đó chi phí đi vay phát sinh được ghi nhận là chi phí sản xuất, kinh doanh trong kỳ cho đến khi việc đầu tư xây dựng hoặc sản xuất tài sản dở dang được tiếp tục.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eChấm dứt việc vốn hoá\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e18. Việc vốn hoá chi phí đi vay sẽ chấm dứt khi các hoạt động chủ yếu cần thiết cho việc chuẩn bị đưa tài sản dở dang vào sử dụng hoặc bán đã hoàn thành. Chi phí đi vay phát sinh sau đó sẽ được ghi nhận là chi phí sản xuất, kinh doanh trong kỳ khi phát sinh.\u003c/p\u003e\n  \u003cp\u003e19. Một tài sản sẵn sàng đưa vào sử dụng hoặc bán khi quá trình đầu tư xây dựng hoặc sản xuất tài sản đã hoàn thành cho dù các công việc quản lý chung vẫn có thể còn tiếp tục. Trường hợp có sự thay đổi nhỏ (như trang trí tài sản theo yêu cầu của người mua hoặc người sử dụng) mà các hoạt động này chưa hoàn tất thì hoạt động chủ yếu vẫn coi là đã hoàn thành.\u003c/p\u003e\n  \u003cp\u003e20. Khi quá trình đầu tư xây dựng tài sản dở dang hoàn thành theo từng bộ phận và mỗi bộ phận có thể sử dụng được trong khi vẫn tiếp tục quá trình đầu tư xây dựng các bộ phận khác, thì việc vốn hoá các chi phí đi vay sẽ chấm dứt khi tất cả các hoạt động chủ yếu cần thiết cho việc chuẩn bị đưa từng bộ phận vào sử dụng hoặc bán đã hoàn thành.\u003c/p\u003e\n  \u003cp\u003e21. Một khu thương mại bao gồm nhiều công trình xây dựng, mỗi công trình có thể sử dụng riêng biệt thì việc vốn hoá sẽ được chấm dứt đối với vốn vay dùng cho từng công trình riêng biệt hoàn thành. Tuy nhiên, đối với xây dựng một nhà máy công nghiệp gồm nhiều hạng mục công trình trên một dây chuyền thì việc vốn hoá chỉ chấm dứt khi tất cả các hạng mục công trình cùng được hoàn thành.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eTrình bày báo cáo tài chính\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e22. Báo cáo tài chính của doanh nghiệp phải trình bày:\u003c/p\u003e\n  \u003cp\u003e(a) Chính sách kế toán được áp dụng cho các chi phí đi vay;\u003c/p\u003e\n  \u003cp\u003e(b) Tổng số chi phí đi vay được vốn hoá trong kỳ; và\u003c/p\u003e\n  \u003cp\u003e(c) Tỷ lệ vốn hoá được sử dụng để xác định chi phí đi vay được vốn hoá trong kỳ.\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eHỆ THỐNG CHUẨN MỰC KẾ TOÁN VIỆT \u003c/strong\u003e\u003cstrong\u003eNAM \u003c/strong\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eChuẩn mực số \u0026nbsp;24\u003c/strong\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003eBÁO CÁO LƯU CHUYỂN TIỀN TỆ\u003cbr\u003e\u003cem\u003e(Ban hành và công bố theo Quyết định số \u003ca\u003e165/2002/QĐ-BTC\u003c/a\u003e ngày 31 tháng 12 năm 2002 của Bộ trưởng Bộ Tài chính)\u003c/em\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eQUY ĐỊNH CHUNG\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e01. Mục đích của Chuẩn mực này là quy định và hướng dẫn các nguyên tắc, phương pháp lập và trình bày Báo cáo lưu chuyển tiền tệ.\u003c/p\u003e\n  \u003cp\u003e02. Chuẩn mực này áp dụng cho việc lập và trình bày Báo cáo lưu chuyển tiền tệ.\u003c/p\u003e\n  \u003cp\u003e03. Báo cáo lưu chuyển tiền tệ là một bộ phận hợp thành của Báo cáo tài chính, nó cung cấp thông tin giúp người sử dụng đánh giá các thay đổi trong tài sản thuần, cơ cấu tài chính, khả năng chuyển đổi của tài sản thành tiền, khả năng thanh toán và khả năng của doanh nghiệp trong việc tạo ra các luồng tiền trong quá trình hoạt động. Báo cáo lưu chuyển tiền tệ làm tăng khả năng đánh giá khách quan tình hình hoạt động kinh doanh của doanh nghiệp và khả năng so sánh giữa các doanh nghiệp vì nó loại trừ được các ảnh hưởng của việc sử dụng các phương pháp kế toán khác nhau cho cùng giao dịch và hiện tượng.\u003c/p\u003e\n  \u003cp\u003eBáo cáo lưu chuyển tiền tệ dùng để xem xét và dự đoán khả năng về số lượng, thời gian và độ tin cậy của các luồng tiền trong tương lai; dùng để kiểm tra lại các đánh giá, dự đoán trước đây về các luồng tiền; kiểm tra mối quan hệ giữa khả năng sinh lời với lượng lưu chuyển tiền thuần và những tác động của thay đổi giá cả.\u003c/p\u003e\n  \u003cp\u003e04. Các thuật ngữ trong Chuẩn mực này được hiểu như sau:\u003c/p\u003e\n  \u003cp\u003eTiền bao gồm tiền tại quỹ, tiền đang chuyển và các khoản tiền gửi không kỳ hạn.\u003c/p\u003e\n  \u003cp\u003eTương đương tiền: Là các khoản đầu tư ngắn hạn (không quá 3 tháng), có khả năng chuyển đổi dễ dàng thành một lượng tiền xác định và không có nhiều rủi ro trong chuyển đổi thành tiền.\u003c/p\u003e\n  \u003cp\u003eLuồng tiền: Là luồng vào và luồng ra của tiền và tương đương tiền, không bao gồm chuyển dịch nội bộ giữa các khoản tiền và tương đương tiền trong doanh nghiệp.\u003c/p\u003e\n  \u003cp\u003eHoạt động kinh doanh: Là các hoạt động tạo ra doanh thu chủ yếu của doanh nghiệp và các hoạt động khác không phải là các hoạt động đầu tư hay hoạt động tài chính.\u003c/p\u003e\n  \u003cp\u003eHoạt động đầu tư: Là các hoạt động mua sắm, xây dựng, thanh lý, nhượng bán các tài sản dài hạn và các khoản đầu tư khác không thuộc các khoản tương đương tiền.\u003c/p\u003e\n  \u003cp\u003eHoạt động tài chính: Là các hoạt động tạo ra các thay đổi về quy mô và kết cấu của vốn chủ sở hữu và vốn vay của doanh nghiệp.\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eNỘI DUNG CHUẨN MỰC\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eTrình bày Báo cáo lưu chuyển tiền tệ\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e05. Doanh nghiệp phải trình bày các luồng tiền trong kỳ trên Báo cáo lưu chuyển tiền tệ theo 3 loại hoạt động: hoạt động kinh doanh, hoạt động đầu tư và hoạt động tài chính.\u003c/p\u003e\n  \u003cp\u003e06. Doanh nghiệp được trình bày các luồng tiền từ các hoạt động kinh doanh, hoạt động đầu tư và hoạt động tài chính theo cách thức phù hợp nhất với đặc điểm kinh doanh của doanh nghiệp. Việc phân loại và báo cáo luồng tiền theo các hoạt động sẽ cung cấp thông tin cho người sử dụng đánh giá được ảnh hưởng của các hoạt động đó đối với tình hình tài chính và đối với lượng tiền và các khoản tương đương tiền tạo ra trong kỳ của doanh nghiệp. Thông tin này cũng được dùng để đánh giá các mối quan hệ giữa các hoạt động nêu trên.\u003c/p\u003e\n  \u003cp\u003e07. Một giao dịch đơn lẻ có thể liên quan đến các luồng tiền ở nhiều loại hoạt động khác nhau. Ví dụ, thanh toán một khoản nợ vay bao gồm cả nợ gốc và lãi, trong đó lãi thuộc hoạt động kinh doanh và nợ gốc thuộc hoạt động tài chính.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eLuồng tiền từ hoạt động kinh doanh\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e08. Luồng tiền phát sinh từ hoạt động kinh doanh là luồng tiền có liên quan đến các hoạt động tạo ra doanh thu chủ yếu của doanh nghiệp, nó cung cấp thông tin cơ bản để đánh giá khả năng tạo tiền của doanh nghiệp từ các hoạt động kinh doanh để trang trải các khoản nợ, duy trì các hoạt động, trả cổ tức và tiến hành các hoạt động đầu tư mới mà không cần đến các nguồn tài chính bên ngoài. Thông tin về các luồng tiền từ hoạt động kinh doanh, khi được sử dụng kết hợp với các thông tin khác, sẽ giúp người sử dụng dự đoán được luồng tiền từ hoạt động kinh doanh trong tương lai. Các luồng tiền chủ yếu từ hoạt động kinh doanh, gồm:\u003c/p\u003e\n  \u003cp\u003e(a) Tiền thu được từ việc bán hàng, cung cấp dịch vụ;\u003c/p\u003e\n  \u003cp\u003e(b) Tiền thu được từ doanh thu khác (tiền thu bản quyền, phí, hoa hồng và các khoản khác trừ các khoản tiền thu được được xác định là luồng tiền từ hoạt động đầu tư và hoạt động tài chính);\u003c/p\u003e\n  \u003cp\u003e(c) Tiền chi trả cho người cung cấp hàng hóa và dịch vụ;\u003c/p\u003e\n  \u003cp\u003e(d) Tiền chi trả cho người lao động về tiền lương, tiền thưởng, trả hộ người lao động về bảo hiểm, trợ cấp...;\u003c/p\u003e\n  \u003cp\u003e(đ) Tiền chi trả lãi vay;\u003c/p\u003e\n  \u003cp\u003e(e) Tiền chi nộp thuế thu nhập doanh nghiệp;\u003c/p\u003e\n  \u003cp\u003e(g) Tiền thu do được hoàn thuế;\u003c/p\u003e\n  \u003cp\u003e(h) Tiền thu do được bồi thường, được phạt do khách hàng vi phạm hợp đồng kinh tế;\u003c/p\u003e\n  \u003cp\u003e(i) Tiền chi trả công ty bảo hiểm về phí bảo hiểm, tiền bồi thường và các khoản tiền khác theo hợp đồng bảo hiểm;\u003c/p\u003e\n  \u003cp\u003e(k) Tiền chi trả do bị phạt, bị bồi thường do doanh nghiệp vi phạm hợp đồng kinh tế.\u003c/p\u003e\n  \u003cp\u003e09. Các luồng tiền liên quan đến mua, bán chứng khoán vì mục đích thương mại được phân loại là các luồng tiền từ hoạt động kinh doanh.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eLuồng tiền từ hoạt động đầu tư\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e10. Luồng tiền phát sinh từ hoạt động đầu tư là luồng tiền có liên quan đến việc mua sắm, xây dựng, nhượng bán, thanh lý tài sản dài hạn và các khoản đầu tư khác không thuộc các khoản tương đương tiền. Các luồng tiền chủ yếu từ hoạt động đầu tư, gồm:\u003c/p\u003e\n  \u003cp\u003e(a) Tiền chi để mua sắm, xây dựng TSCĐ và các tài sản dài hạn khác, bao gồm cả những khoản tiền chi liên quan đến chi phí triển khai đã được vốn hóa là TSCĐ vô hình;\u003c/p\u003e\n  \u003cp\u003e(b) Tiền thu từ việc thanh lý, nhượng bán TSCĐ và các tài sản dài hạn khác;\u003c/p\u003e\n  \u003cp\u003e(c) Tiền chi cho vay đối với bên khác, trừ tiền chi cho vay của ngân hàng, tổ chức tín dụng và các tổ chức tài chính; tiền chi mua các công cụ nợ của các đơn vị khác, trừ trường hợp tiền chi mua các công cụ nợ được coi là các khoản tương đương tiền và mua các công cụ nợ dùng cho mục đích thương mại;\u003c/p\u003e\n  \u003cp\u003e(d) Tiền thu hồi cho vay đối với bên khác, trừ trường hợp tiền thu hồi cho vay của ngân hàng, tổ chức tín dụng và các tổ chức tài chính; tiền thu do bán lại các công cụ nợ của đơn vị khác, trừ trường hợp thu tiền từ bán các công cụ nợ được coi là các khoản tương đương tiền và bán các công cụ nợ dùng cho mục đích thương mại;\u003c/p\u003e\n  \u003cp\u003e(đ) Tiền chi đầu tư góp vốn vào đơn vị khác, trừ trường hợp tiền chi mua cổ phiếu vì mục đích thương mại;\u003c/p\u003e\n  \u003cp\u003e(e) Tiền thu hồi đầu tư góp vốn vào đơn vị khác, trừ trường hợp tiền thu từ bán lại cổ phiếu đã mua vì mục đích thương mại;\u003c/p\u003e\n  \u003cp\u003e(g) Tiền thu lãi cho vay, cổ tức và lợi nhuận nhận được.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eLuồng tiền từ hoạt động tài chính\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e11. Luồng tiền phát sinh từ hoạt động tài chính là luồng tiền có liên quan đến việc thay đổi về quy mô và kết cấu của vốn chủ sở hữu và vốn vay của doanh nghiệp. Các luồng tiền chủ yếu từ hoạt động tài chính, gồm:\u003c/p\u003e\n  \u003cp\u003e(a) Tiền thu từ phát hành cổ phiếu, nhận vốn góp của chủ sở hữu;\u003c/p\u003e\n  \u003cp\u003e(b) Tiền chi trả vốn góp cho các chủ sở hữu, mua lại cổ phiếu của chính doanh nghiệp đã phát hành;\u003c/p\u003e\n  \u003cp\u003e(c) Tiền thu từ các khoản đi vay ngắn hạn, dài hạn;\u003c/p\u003e\n  \u003cp\u003e(d) Tiền chi trả các khoản nợ gốc đã vay;\u003c/p\u003e\n  \u003cp\u003e(đ) Tiền chi trả nợ thuê tài chính;\u003c/p\u003e\n  \u003cp\u003e(e) Cổ tức, lợi nhuận đã trả cho chủ sở hữu.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eLuồng tiền từ hoạt động kinh doanh của ngân hàng, tổ chức tín dụng, tổ chức tài chính và doanh nghiệp bảo hiểm\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e12. Đối với ngân hàng, tổ chức tín dụng, tổ chức tài chính và doanh nghiệp bảo hiểm, các luồng tiền phát sinh có đặc điểm riêng. Khi lập Báo cáo lưu chuyển tiền tệ, các tổ chức này phải căn cứ vào tính chất, đặc điểm hoạt động để phân loại các luồng tiền một cách thích hợp.\u003c/p\u003e\n  \u003cp\u003e13. Đối với ngân hàng, tổ chức tín dụng, tổ chức tài chính, các luồng tiền sau đây được phân loại là luồng tiền từ hoạt động kinh doanh:\u003c/p\u003e\n  \u003cp\u003e(a) Tiền chi cho vay;\u003c/p\u003e\n  \u003cp\u003e(b) Tiền thu hồi cho vay;\u003c/p\u003e\n  \u003cp\u003e(c) Tiền thu từ hoạt động huy động vốn (kể cả khoản nhận tiền gửi, tiền tiết kiệm của các tổ chức, cá nhân khác);\u003c/p\u003e\n  \u003cp\u003e(d) Trả lại tiền huy động vốn (kể cả khoản trả tiền gửi, tiền tiết kiệm của các tổ chức, cá nhân khác);\u003c/p\u003e\n  \u003cp\u003e(đ) Nhận tiền gửi và trả lại tiền gửi cho các tổ chức tài chính, tín dụng khác;\u003c/p\u003e\n  \u003cp\u003e(e) Gửi tiền và nhận lại tiền gửi vào các tổ chức tài chính, tín dụng khác;\u003c/p\u003e\n  \u003cp\u003e(g) Thu và chi các loại phí, hoa hồng dịch vụ;\u003c/p\u003e\n  \u003cp\u003e(h) Tiền lãi cho vay, lãi tiền gửi đã thu;\u003c/p\u003e\n  \u003cp\u003e(i) Tiền lãi đi vay, nhận gửi tiền đã trả;\u003c/p\u003e\n  \u003cp\u003e(k) Lãi, lỗ mua bán ngoại tệ;\u003c/p\u003e\n  \u003cp\u003e(l) Tiền thu vào hoặc chi ra về mua, bán chứng khoán ở doanh nghiệp kinh doanh chứng khoán;\u003c/p\u003e\n  \u003cp\u003e(m) Tiền chi mua chứng khoán vì mục đích thương mại;\u003c/p\u003e\n  \u003cp\u003e(n) Tiền thu từ bán chứng khoán vì mục đích thương mại;\u003c/p\u003e\n  \u003cp\u003e(o) Thu nợ khó đòi đã xóa sổ;\u003c/p\u003e\n  \u003cp\u003e(p) Tiền thu khác từ hoạt động kinh doanh;\u003c/p\u003e\n  \u003cp\u003e(q) Tiền chi khác từ hoạt động kinh doanh.\u003c/p\u003e\n  \u003cp\u003e14. Đối với các doanh nghiệp bảo hiểm, tiền thu bảo hiểm, tiền chi bồi thường bảo hiểm và các khoản tiền thu vào, chi ra có liên quan đến điều khoản hợp đồng bảo hiểm đều được phân loại là luồng tiền từ hoạt động kinh doanh.\u003c/p\u003e\n  \u003cp\u003e15. Đối với ngân hàng, tổ chức tín dụng, tổ chức tài chính và doanh nghiệp bảo hiểm, các luồng tiền từ hoạt động đầu tư và hoạt động tài chính tương tự như đối với các doanh nghiệp khác, trừ các khoản tiền cho vay của ngân hàng, tổ chức tín dụng và tổ chức tài chính được phân loại là luồng tiền từ hoạt động kinh doanh vì chúng liên quan đến hoạt động tạo ra doanh thu chủ yếu của doanh nghiệp.\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003ePHƯƠNG PHÁP LẬP BÁO CÁO LƯU CHUYỂN TIỀN TỆ\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eLuồng tiền từ hoạt động kinh doanh\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e16. Doanh nghiệp phải báo cáo các luồng tiền từ hoạt động kinh doanh theo một trong hai phương pháp sau:\u003c/p\u003e\n  \u003cp\u003e(a) Phương pháp trực tiếp: Theo phương pháp này các chỉ tiêu phản ánh các luồng tiền vào và các luồng tiền ra được trình bày trên báo cáo và được xác định theo một trong 2 cách sau đây:\u003c/p\u003e\n  \u003cp\u003e- Phân tích và tổng hợp trực tiếp các khoản tiền thu và chi theo từng nội dung thu, chi từ các ghi chép kế toán của doanh nghiệp.\u003c/p\u003e\n  \u003cp\u003e- Điều chỉnh doanh thu, giá vốn hàng bán và các khoản mục khác trong báo cáo kết quả hoạt động kinh doanh cho:\u003c/p\u003e\n  \u003cp\u003e+ Các thay đổi trong kỳ của hàng tồn kho, các khoản phải thu và các khoản phải trả từ hoạt động kinh doanh;\u003c/p\u003e\n  \u003cp\u003e+ Các khoản mục không phải bằng tiền khác;\u003c/p\u003e\n  \u003cp\u003e+ Các luồng tiền liên quan đến hoạt động đầu tư và hoạt động tài chính.\u003c/p\u003e\n  \u003cp\u003e(b) Phương pháp gián tiếp: Các chỉ tiêu về luồng tiền được xác định trên cơ sở lấy tổng lợi nhuận trước thuế và điều chỉnh cho các khoản:\u003c/p\u003e\n  \u003cp\u003e- Các khoản doanh thu, chi phí không phải bằng tiền như khấu hao TSCĐ, dự phòng...\u003c/p\u003e\n  \u003cp\u003e- Lãi, lỗ chênh lệch tỷ giá hối đoái chưa thực hiện;\u003c/p\u003e\n  \u003cp\u003e- Tiền đã nộp thuế thu nhập doanh nghiệp;\u003c/p\u003e\n  \u003cp\u003e- Các thay đổi trong kỳ của hàng tồn kho, các khoản phải thu và các khoản phải trả từ hoạt động kinh doanh (trừ thuế thu nhập và các khoản phải nộp khác sau thuế thu nhập doanh nghiệp);\u003c/p\u003e\n  \u003cp\u003e- Lãi lỗ từ hoạt động đầu tư.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eLuồng tiền từ hoạt động đầu tư và hoạt động tài chính\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e17. Doanh nghiệp phải báo cáo riêng biệt các luồng tiền vào, các luồng tiền ra từ hoạt động đầu tư và hoạt động tài chính, trừ trường hợp các luồng tiền được báo cáo trên cơ sở thuần được đề cập trong các đoạn 18 và 19 của Chuẩn mực này.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eBáo cáo các luồng tiền trên cơ sở thuần\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e18. Các luồng tiền phát sinh từ các hoạt động kinh doanh, hoạt động đầu tư hay hoạt động tài chính sau đây được báo cáo trên cơ sở thuần:\u003c/p\u003e\n  \u003cp\u003e(a) Thu tiền và chi trả tiền hộ khách hàng:\u003c/p\u003e\n  \u003cp\u003e- Tiền thuê thu hộ, chi hộ và trả lại cho chủ sở hữu tài sản;\u003c/p\u003e\n  \u003cp\u003e- Các quỹ đầu tư giữ cho khách hàng;\u003c/p\u003e\n  \u003cp\u003e- Ngân hàng nhận và thanh toán các khoản tiền gửi không kỳ hạn, các khoản tiền chuyển hoặc thanh toán qua ngân hàng.\u003c/p\u003e\n  \u003cp\u003e(b) Thu tiền và chi tiền đối với các khoản có vòng quay nhanh, thời gian đáo hạn ngắn:\u003c/p\u003e\n  \u003cp\u003e- Mua, bán ngoại tệ;\u003c/p\u003e\n  \u003cp\u003e- Mua, bán các khoản đầu tư;\u003c/p\u003e\n  \u003cp\u003e- Các khoản đi vay hoặc cho vay ngắn hạn khác có thời hạn không quá 3 tháng.\u003c/p\u003e\n  \u003cp\u003e19. Các luồng tiền phát sinh từ các hoạt động sau đây của ngân hàng, tổ chức tín dụng và tổ chức tài chính được báo cáo trên cơ sở thuần:\u003c/p\u003e\n  \u003cp\u003e(a) Nhận và trả các khoản tiền gửi có kỳ hạn với ngày đáo hạn cố định;\u003c/p\u003e\n  \u003cp\u003e(b) Gửi tiền và rút tiền gửi từ các tổ chức tín dụng và tổ chức tài chính khác;\u003c/p\u003e\n  \u003cp\u003e(c) Cho vay và thanh toán các khoản cho vay đó với khách hàng.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eCác luồng tiền liên quan đến ngoại tệ\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e20. Các luồng tiền phát sinh từ các giao dịch bằng ngoại tệ phải được quy đổi ra đồng tiền ghi sổ kế toán theo tỷ giá hối đoái tại thời điểm phát sinh giao dịch đó. Báo cáo lưu chuyển tiền tệ của các tổ chức hoạt động ở nước ngoài phải được quy đổi ra đồng tiền ghi sổ kế toán của công ty mẹ theo tỷ giá thực tế tại ngày lập Báo cáo lưu chuyển tiền tệ.\u003c/p\u003e\n  \u003cp\u003e21. Chênh lệch tỷ giá hối đoái chưa thực hiện phát sinh từ thay đổi tỷ giá quy đổi ngoại tệ ra đơn vị tiền tệ kế toán không phải là các luồng tiền. Tuy nhiên, số chênh lệch tỷ giá hối đoái do quy đổi tiền và các khoản tương đương tiền bằng ngoại tệ hiện gửi phải được trình bày riêng biệt trên Báo cáo lưu chuyển tiền tệ nhằm mục đích đối chiếu tiền và các khoản tương đương tiền tại thời điểm đầu kỳ và cuối kỳ báo cáo.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eCác luồng tiền liên quan đến tiền lãi, cổ tức và lợi nhuận thu được\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e22. Đối với các doanh nghiệp (trừ ngân hàng, tổ chức tín dụng và tổ chức tài chính), các luồng tiền liên quan đến tiền lãi vay đã trả được phân loại là luồng tiền từ hoạt động kinh doanh. Các luồng tiền liên quan đến tiền lãi cho vay, cổ tức và lợi nhuận thu được được phân loại là luồng tiền từ hoạt động đầu tư. Các luồng tiền liên quan đến cổ tức và lợi nhuận đã trả được phân loại là luồng tiền từ hoạt động tài chính. Các luồng tiền này phải được trình bày thành chỉ tiêu riêng biệt phù hợp theo từng loại hoạt động trên Báo cáo lưu chuyển tiền tệ.\u003c/p\u003e\n  \u003cp\u003e23. Đối với ngân hàng, tổ chức tín dụng và tổ chức tài chính, tiền lãi đã trả, tiền lãi đã thu được phân loại là luồng tiền từ hoạt động kinh doanh, trừ tiền lãi đã thu được xác định rõ ràng là luồng tiền từ hoạt động đầu tư. Cổ tức và lợi nhuận đã thu được phân loại là luồng tiền từ hoạt động đầu tư. Cổ tức và lợi nhuận đã trả được phân loại là luồng tiền từ hoạt động tài chính.\u003c/p\u003e\n  \u003cp\u003e24. Tổng số tiền lãi vay đã trả trong kỳ phải được trình bày trong báo cáo lưu chuyển tiền tệ cho dù nó đã được ghi nhận là chi phí trong kỳ hay đã được vốn hóa theo quy định của Chuẩn mực kế toán số 16 \"Chi phí đi vay\".\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eCác luồng tiền liên quan đến thuế thu nhập doanh nghiệp\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e25. Các luồng tiền liên quan đến thuế thu nhập doanh nghiệp được phân loại là luồng tiền từ hoạt động kinh doanh (trừ trường hợp được xác định là luồng tiền từ hoạt động đầu tư) và được trình bày thành chỉ tiêu riêng biệt trên Báo cáo lưu chuyển tiền tệ.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eCác luồng tiền liên quan đến mua và thanh lý các công ty con hoặc các đơn vị kinh doanh khác\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e26. Luồng tiền phát sinh từ việc mua và thanh lý các công ty con hoặc các đơn vị kinh doanh khác được phân loại là luồng tiền từ hoạt động đầu tư và phải trình bày thành những chỉ tiêu riêng biệt trên Báo cáo lưu chuyển tiền tệ.\u003c/p\u003e\n  \u003cp\u003e27. Tổng số tiền chi trả hoặc thu được từ việc mua và thanh lý công ty con hoặc đơn vị kinh doanh khác được trình bày trong Báo cáo lưu chuyển tiền tệ theo số thuần của tiền và tương đương tiền chi trả hoặc thu được từ việc mua và thanh lý.\u003c/p\u003e\n  \u003cp\u003e28. Doanh nghiệp phải trình bày trong thuyết minh báo cáo tài chính một cách tổng hợp về cả việc mua và thanh lý các công ty con hoặc các đơn vị kinh doanh khác trong kỳ những thông tin sau:\u003c/p\u003e\n  \u003cp\u003e(a) Tổng giá trị mua hoặc thanh lý;\u003c/p\u003e\n  \u003cp\u003e(b) Phần giá trị mua hoặc thanh lý được thanh toán bằng tiền và các khoản tương đương tiền;\u003c/p\u003e\n  \u003cp\u003e(c) Số tiền và các khoản tương đương tiền thực có trong công ty con hoặc đơn vị kinh doanh khác được mua hoặc thanh lý;\u003c/p\u003e\n  \u003cp\u003e(d) Phần giá trị tài sản và công nợ không phải là tiền và các khoản tương đương tiền trong công ty con hoặc đơn vị kinh doanh khác được mua hoặc thanh lý trong kỳ. Giá trị tài sản này phải được tổng hợp theo từng loại tài sản.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eCác giao dịch không bằng tiền\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e29. Các giao dịch về đầu tư và tài chính không trực tiếp sử dụng tiền hay các khoản tương đương tiền không được trình bày trong Báo cáo lưu chuyển tiền tệ.\u003c/p\u003e\n  \u003cp\u003e30. Nhiều hoạt động đầu tư và hoạt động tài chính tuy có ảnh hưởng tới kết cấu tài sản và nguồn vốn của doanh nghiệp nhưng không ảnh hưởng trực tiếp tới luồng tiền hiện tại, do vậy chúng không được trình bày trong Báo cáo lưu chuyển tiền tệ mà được trình bày ở Thuyết minh báo cáo tài chính. Ví dụ:\u003c/p\u003e\n  \u003cp\u003e(a) Việc mua tài sản bằng cách nhận các khoản nợ liên quan trực tiếp hoặc thông qua nghiệp vụ cho thuê tài chính;\u003c/p\u003e\n  \u003cp\u003e(b) Việc mua một doanh nghiệp thông qua phát hành cổ phiếu;\u003c/p\u003e\n  \u003cp\u003e(c) Việc chuyển nợ thành vốn chủ sở hữu.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eCác khoản mục của tiền và tương đương tiền\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e31. Doanh nghiệp phải trình bày trên Báo cáo lưu chuyển tiền tệ các chỉ tiêu tiền và các khoản tương đương tiền đầu kỳ và cuối kỳ, ảnh hưởng của thay đổi tỷ giá hối đoái quy đổi tiền và các khoản tương đương tiền bằng ngoại tệ hiện giữ để đối chiếu số liệu với các khoản mục tương ứng trên Bảng cân đối kế toán.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eCác thuyết minh khác\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e32. Doanh nghiệp phải trình bày giá trị và lý do của các khoản tiền và tương đương tiền lớn do doanh nghiệp nắm giữ nhưng không được sử dụng do có sự hạn chế của pháp luật hoặc các ràng buộc khác mà doanh nghiệp phải thực hiện.\u003c/p\u003e\n  \u003cp\u003e33. Có nhiều trường hợp trong số dư tiền và các khoản tương đương tiền do doanh nghiệp nắm giữ nhưng không thể sử dụng cho hoạt động kinh doanh được. Ví dụ: Các khoản tiền nhận ký quỹ, ký cược; các quỹ chuyên dùng; kinh phí dự án...\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003ePHỤ LỤC 1\u003c/strong\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cem\u003e(Mẫu Báo cáo lưu chuyển tiền tệ áp dụng cho doanh nghiệp không phải là ngân hàng, tổ chức tín dụng và tổ chức tài chính)\u003c/em\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eBÁO CÁO LƯU CHUYỂN TIỀN TỆ (MẪU 1)\u003c/strong\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e(Theo phương pháp trực tiếp)\u003c/p\u003e\n  \u003cp align=\"center\"\u003eĐơn vị tính: ...........\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp align=\"center\"\u003eChỉ tiêu\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003eMã số\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp align=\"center\"\u003eKỳ trước\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp align=\"center\"\u003eKỳ này\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp align=\"center\"\u003e1\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e2\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp align=\"center\"\u003e3\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp align=\"center\"\u003e4\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e\u003cstrong\u003eI. Lưu chuyển tiền từ hoạt động kinh doanh\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e1. Tiền thu từ bán hàng, cung cấp dịch vụ và doanh thu khác\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e01\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e2. Tiền chi trả cho người cung cấp hàng hóa và dịch vụ\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e02\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e3. Tiền chi trả cho người lao động\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e03\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e4. Tiền chi trả lãi vay\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e04\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e5. Tiền chi nộp thuế thu nhập doanh nghiệp\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e05\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e6. Tiền thu khác từ hoạt động kinh doanh\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e06\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e7. Tiền chi khác cho hoạt động kinh doanh\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e07\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003eLưu chuyển tiền thuần từ hoạt động kinh doanh\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e20\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e\u003cstrong\u003eII. Lưu chuyển tiền từ hoạt động đầu t\u003c/strong\u003eư\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e1. Tiền chi để mua sắm, xây dựng TSCĐ và các tài sản dài hạn khác\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e21\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e2. Tiền thu từ thanh lý, nhượng bán TSCĐ và các tài sản dài hạn khác\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e22\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e3. Tiền chi cho vay, mua các công cụ nợ của đơn vị khác\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e23\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e4. Tiền thu hồi cho vay, bán lại các công cụ nợ của đơn vị khác\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e24\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e5. Tiền chi đầu tư góp vốn vào đơn vị khác\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e25\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e6. Tiền thu hồi đầu tư góp vốn vào đơn vị khác\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e26\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e7. Tiền thu lãi cho vay, cổ tức và lợi nhuận được chia\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e27\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003eLưu chuyển tiền thuần từ hoạt động đầu tư\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e30\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e\u003cstrong\u003eIII. Lưu chuyển tiền từ hoạt động tài chính\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e1. Tiền thu từ phát hành cổ phiếu, nhận vốn góp của chủ sở hữu\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e31\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e2. Tiền chi trả vốn góp cho các chủ sở hữu, mua lại cổ phiếu của doanh nghiệp đã phát hành\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e32\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e3. Tiền vay ngắn hạn, dài hạn nhận được\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e33\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e4. Tiền chi trả nợ gốc vay\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e34\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e5. Tiền chi trả nợ thuê tài chính\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e35\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e6. Cổ tức, lợi nhuận đã trả cho chủ sở hữu\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e36\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003eLưu chuyển tiền thuần từ hoạt động tài chính\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e40\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003eLưu chuyển tiền thuần trong kỳ (20 + 30 + 40)\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e50\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003eTiền và tương đương tiền đầu kỳ\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e60\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003eẢnh hưởng của thay đổi tỷ giá hối đoái quy đổi ngoại tệ\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e61\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003eTiền và tương đương tiền cuối kỳ (50 + 60 + 61)\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e70\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 49px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 55px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp align=\"center\"\u003eBÁO CÁO LƯU CHUYỂN TIỀN TỆ (MẪU 2)\u003cbr\u003e\u003cem\u003e(Theo phương pháp gián tiếp)\u003c/em\u003e\u003c/p\u003e\n  \u003cp\u003eĐơn vị tính: ...........\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp align=\"center\"\u003eChỉ tiêu\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003eMã số\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003eKỳ trước\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003eKỳ này\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp align=\"center\"\u003e1\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e2\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e3\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e4\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e\u003cstrong\u003eI. Lưu chuyển tiền từ hoạt động kinh doanh\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e1. Lợi nhuận trước thuế\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e01\u0

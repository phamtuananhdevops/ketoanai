\"description\":\"Cổng thông tin chính thức của Cơ quan Công báo Việt Nam\"},\"feedbackSuggestions\":{\"title\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\",\"description\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\"}}},\"footer\":{\"unit\":\"Đơn vị chủ quản\",\"unitContent\":\"Bộ Tư pháp\",\"address\":\"Địa chỉ\",\"addressContent\":\"Số 60 Trần Phú - Ba Đình - Thành phố Hà Nội\",\"phoneNumber\":\"Điện thoại\",\"phoneNumberContent\":\"024.6273.9468\",\"fax\":\"Fax\",\"faxContent\":\"024.6273.9359\"},\"underConstruction\":{\"title\":\"Đang cập nhật\",\"message\":\"Chức năng này đang được phát triển.\"},\"gioiThieu\":{\"timeline\":{\"2005\":{\"description\":\"Năm 2005 đánh dấu sự khởi đầu của dự án xây dựng Cơ sở dữ liệu quốc gia về pháp luật, với mục tiêu số hóa và tập trung hóa các văn bản pháp luật của Việt Nam.\"},\"2012-2013\":{\"description\":\"Giai đoạn 2012-2013 là thời kỳ phát triển và mở rộng hệ thống, với việc tích hợp thêm nhiều tính năng và cải thiện giao diện người dùng.\"},\"2023-2025\":{\"description\":\"Giai đoạn 2023-2025 tập trung vào việc nâng cấp và hiện đại hóa hệ thống, áp dụng các công nghệ mới và mở rộng phạm vi phục vụ.\"}},\"overview\":{\"title\":\"SƠ LƯỢC MÔ HÌNH CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"CSDLQG về pháp luật tập hợp các văn bản quy phạm pháp luật và văn bản hợp nhất văn bản quy phạm pháp luật (sau đây gọi chung là văn bản) dưới dạng văn bản điện tử do Chính phủ thống nhất quản lý, có địa chỉ truy cập vbpl.vn, bao gồm các Cơ sở dữ liệu thành phần: Cơ sở dữ liệu văn bản pháp luật Trung ương và Cơ sở dữ liệu văn bản pháp luật địa phương.\",\"central\":{\"title\":\"Cơ sở dữ liệu Văn bản pháp luật Trung ương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của các Bộ, cơ quan ngang Bộ, cơ quan nhà nước khác ở Trung ương ban hành hoặc phối hợp ban hành. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật; Văn bản hợp nhất; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"local\":{\"title\":\"Cơ sở dữ liệu văn bản pháp luật địa phương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của từng tỉnh, thành phố trực thuộc Trung ương trên toàn quốc. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật của Hội đồng nhân dân và Ủy ban nhân dân; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"other\":{\"title\":\"Các chuyên mục khác\",\"content\":\"Ngoài các Cơ sở dữ liệu thành phần kể trên, CSDLQG về pháp luật còn có các chuyên mục khác như: Giới thiệu văn bản mới, Tin tức, Tình huống pháp luật. Ngoài ra, CSDLQG về thủ tục hành chính, bộ pháp điển điện tử, cổng thông tin điện tử Bộ Tư pháp cũng trích xuất về CSDLQG về pháp luật.\"}},\"vision\":{\"title\":\"Tầm nhìn\",\"content\":\"Trở thành nguồn tra cứu văn bản pháp luật chính thống, đầy đủ và đáng tin cậy, phục vụ hiệu quả cho người dân, doanh nghiệp và cơ quan nhà nước.\"},\"mission\":{\"title\":\"Sứ mệnh\",\"content\":\"Cung cấp hệ thống văn bản pháp luật được cập nhật kịp thời, tra cứu thuận tiện, góp phần nâng cao nhận thức pháp luật và bảo đảm việc tuân thủ pháp luật trong xã hội.\"},\"features\":{\"title\":\"MỘT SỐ TÍNH NĂNG, TIỆN ÍCH CỦA CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"Hiện nay, CSDLQG về PL có giao diện tương đối thân thiện, dễ tìm kiếm, dễ khai thác các thông tin và tải về sử dụng. Cơ sở dữ liệu cung cấp các chức năng, tiện ích cơ bản và thuận tiện\",\"list\":[{\"key\":\"fullText\",\"label\":\"Tra cứu toàn văn\",\"icon\":\"SearchOutlined\"},{\"key\":\"tableOfContents\",\"label\":\"Tự động tạo mục lục\",\"icon\":\"BookOutlined\"},{\"key\":\"relatedDocuments\",\"label\":\"Liên kết văn bản liên quan\",\"icon\":\"LinkOutlined\"},{\"key\":\"validity\",\"label\":\"Xác định hiệu lực tự động\",\"icon\":\"BarChartOutlined\"},{\"key\":\"validityHistory\",\"label\":\"Lịch sử hiệu lực\",\"icon\":\"ClockCircleOutlined\"},{\"key\":\"download\",\"label\":\"Tải văn bản\",\"icon\":\"DownloadOutlined\"},{\"key\":\"english\",\"label\":\"Xem văn bản tiếng Anh\",\"icon\":\"GlobalOutlined\"},{\"key\":\"centralLocal\", 2; margin-bottom: 16px;\"\u003e\n    \u003cdiv style=\"display: table-cell; width: 50%; text-align: center; vertical-align: top;\"\u003e\n     \u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố: 165/2002/QĐ-BTC\u003c/span\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"display: table-cell; width: 50%; vertical-align: top; font-style: italic; text-align: right;\"\u003e\n     \u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eHà Nội, ngày 31 tháng 12 năm 2002\u003cstrong\u003e\u003c/strong\u003e\u003c/span\u003e\n    \u003c/div\u003e\n   \u003c/div\u003e\n  \u003c/div\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eQUYẾT ĐỊNH\u0026nbsp;\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eVề việc ban hành và công bố sáu (06) chuẩn mực \u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003ekế toán Việt Nam (đợt 2)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e_________________\u003c/strong\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eBỘ TRƯỞNG BỘ TÀI CHÍNH\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cem\u003eCăn cứ Pháp lệnh Kế toán và Thống kê công bố theo Lệnh số 06-LCT/HĐNN ngày 20/5/1988 của Hội đồng Nhà nước và Điều lệ tổ chức kế toán Nhà nước ban hành theo Nghị định số\u0026nbsp;\u003ca\u003e\u003c/a\u003e\u003ca\u003e25-HĐBT\u003c/a\u003e ngày 18/3/1989 của Hội đồng Bộ trưởng (nay là Chính phủ);\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cem\u003eCăn cứ Nghị định số\u0026nbsp;\u003ca\u003e86/2002/NĐ-CP\u003c/a\u003e ngày 05/11/2002 của Chính phủ quy định chức năng, nhiệm vụ, quyền hạn và cơ cấu tổ chức của bộ, cơ quan ngang bộ;\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cem\u003eCăn cứ Nghị định số 178/CP ngày 28/10/1994 của Chính phủ về nhiệm vụ, quyền hạn và tổ chức bộ máy Bộ Tài chính;\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cem\u003eĐể đáp ứng yêu cầu đổi mới cơ chế quản lý kinh tế, tài chính, nâng cao chất lượng thông tin kế toán cung cấp trong nền kinh tế quốc dân và để kiểm tra, kiểm soát chất lượng công tác kế toán;\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cem\u003eTheo đề nghị của Vụ trưởng Vụ Chế độ kế toán và Chánh Văn phòng Bộ Tài chính,\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eQUYẾT ĐỊNH\u003c/strong\u003e\u003cstrong\u003e:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"1e1c076a-df4b-11f0-bbd4-f5d4dc27d323\" class=\"prov-article\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 1: \u003c/strong\u003eBan hành sáu (06) chuẩn mực kế toán Việt Nam (đợt 2) có số hiệu và tên gọi sau đây:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"1e1c076a-df4b-11f0-bbd4-f5d4dc27d323\" class=\"prov-content\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Chuẩn mực số 01 - Chuẩn mực chung;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Chuẩn mực số 06 - Thuê tài sản;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Chuẩn mực số 10 - ảnh hưởng của việc thay đổi tỷ giá hối đoái;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Chuẩn mực số 15 - Hợp đồng xây dựng;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Chuẩn mực số 16 - Chi phí đi vay;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Chuẩn mực số 24 - Báo cáo lưu chuyển tiền tệ;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"1e1c0774-df4b-11f0-9dee-c343f574dc6a\" class=\"prov-article\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 2: \u003c/strong\u003eSáu (06) Chuẩn mực kế toán Việt Nam ban hành kèm theo Quyết định này được áp dụng đối với tất cả các doanh nghiệp thuộc các ngành, các thành phần kinh tế trong cả nước.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"1e1c077e-df4b-11f0-baa4-9fefaa2d3612\" class=\"prov-article\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 3: \u003c/strong\u003eQuyết định này có hiệu lực thi hành từ ngày 01/01/2003. Các chế độ kế toán cụ thể phải căn cứ vào sáu chuẩn mực kế toán được ban hành kèm theo Quyết định này để sửa đổi, bổ sung cho phù hợp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"1e1c0788-df4b-11f0-8346-dd30e5785e1a\" class=\"prov-article\" style=\"font-family: 'Times New Roman' , Times, serif;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eĐiều 4: \u003c/strong\u003eVụ trưởng Vụ Chế độ kế toán, Chánh Văn phòng Bộ và Thủ trưởng các đơn vị liên quan thuộc và trực thuộc Bộ Tài chính chịu trách nhiệm hướng dẫn, kiểm tra và thi hành Quyết định này./.\u003c/span\u003e\u003c/p\u003e\n  \u003cdiv style=\"width: 100%; margin-top: 32px; font-family: 'Times New Roman', serif; font-size: 14px; color: #000; display: flex; justify-content: flex-end;\"\u003e\n   \u003cdiv style=\"display: table-cell; width: 50%; text-align: center; vertical-align: top; font-weight: bold; line-height: 1.8;\"\u003e\n    \u003cdiv style=\"font-weight: bold; text-transform: uppercase; line-height: 1;\"\u003e\n     \u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eKT. BỘ TRƯỞNG \u003c/span\u003e\n     \u003cbr\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTHỨ TRƯỞNG\u003c/span\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"font-style: italic; font-weight: bold;\"\u003e\n     \u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(Đã ký)\u003c/span\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"font-weight: bold; margin-top: 16px;\"\u003e\n     \u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTrần Văn Tá\u003c/span\u003e\n    \u003c/div\u003e\n   \u003c/div\u003e\n  \u003c/div\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eHỆ THỐNG CHUẨN MỰC KẾ TOÁN VIỆT \u003c/strong\u003e\u003cstrong\u003eNAM\u003c/strong\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eChuẩn mực số 01\u003c/strong\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003eCHUẨN MỰC CHUNG\u003cbr\u003e\u003cem\u003e(Ban hành và công bố theo Quyết định số \u003ca\u003e165/2002/QĐ-BTC\u003c/a\u003e ngày 31 tháng 12 năm 2002 của Bộ trưởng Bộ Tài chính)\u003c/em\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eQUY ĐỊNH CHUNG\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e01. Mục đích của chuẩn mực này là quy định và hướng dẫn các nguyên tắc và yêu cầu kế toán cơ bản, các yếu tố và ghi nhận các yếu tố của báo cáo tài chính của doanh nghiệp, nhằm:\u003c/p\u003e\n  \u003cp\u003ea/ Làm cơ sở xây dựng và hoàn thiện các chuẩn mực kế toán và chế độ kế toán cụ thể theo khuôn mẫu thống nhất;\u003c/p\u003e\n  \u003cp\u003eb/ Giúp cho doanh nghiệp ghi chép kế toán và lập báo cáo tài chính theo các chuẩn mực kế toán và chế độ kế toán đã ban hành một cách thống nhất và xử lý các vấn đề chưa được quy định cụ thể nhằm đảm bảo cho các thông tin trên báo cáo tài chính phản ánh trung thực và hợp lý;\u003c/p\u003e\n  \u003cp\u003ec/ Giúp cho kiểm toán viên và người kiểm tra kế toán đưa ra ý kiến về sự phù hợp của báo cáo tài chính với chuẩn mực kế toán và chế độ kế toán;\u003c/p\u003e\n  \u003cp\u003ed/ Giúp cho người sử dụng báo cáo tài chính hiểu và đánh giá thông tin tài chính được lập phù hợp với các chuẩn mực kế toán và chế độ kế toán.\u003c/p\u003e\n  \u003cp\u003e02. Các nguyên tắc, yêu cầu kế toán cơ bản và các yếu tố của báo cáo tài chính quy định trong chuẩn mực này được quy định cụ thể trong từng chuẩn mực kế toán, phải được áp dụng đối với mọi doanh nghiệp thuộc mọi thành phần kinh tế trong phạm vi cả nước.\u003c/p\u003e\n  \u003cp\u003eChuẩn mực này không thay thế các chuẩn mực kế toán cụ thể. Khi thực hiện thì căn cứ vào chuẩn mực kế toán cụ thể. Trường hợp chuẩn mực kế toán cụ thể chưa quy định thì thực hiện theo Chuẩn mực chung.\u003c/p\u003e\n  \u003cp style=\"text-align: center;\"\u003e\u003cstrong\u003eNỘI DUNG CHUẨN MỰC\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003eCác nguyên tắc kế toán cơ bản\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eCơ sở dồn tích\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e03. Mọi nghiệp vụ kinh tế, tài chính của doanh nghiệp liên quan đến tài sản, nợ phải trả, nguồn vốn chủ sở hữu, doanh thu, chi phí phải được ghi sổ kế toán vào thời điểm phát sinh, không căn cứ vào thời điểm thực tế thu hoặc thực tế chi tiền hoặc tương đương tiền. Báo cáo tài chính lập trên cơ sở dồn tích phản ảnh tình hình tài chính của doanh nghiệp trong quá khứ, hiện tại và tương lai.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eHoạt động Liên tục\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e04. Báo cáo tài chính phải được lập trên cơ sở giả định là doanh nghiệp đang hoạt động liên tục và sẽ tiếp tục hoạt động kinh doanh bình thường trong tương lai gần, nghĩa là doanh nghiệp không có ý định cũng như không buộc phải ngừng hoạt động hoặc phải thu hẹp đáng kể quy mô hoạt động của mình. Trường hợp thực tế khác với giả định hoạt động liên tục thì báo cáo tài chính phải lập trên một cơ sở khác và phải giải thích cơ sở đã sử dụng để lập báo cáo tài chính.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eGiá gốc\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e05. Tài sản phải được ghi nhận theo giá gốc. Giá gốc của tài sản được tính theo số tiền hoặc khoản tương đương tiền đã trả, phải trả hoặc tính theo giá trị hợp lý của tài sản đó vào thời điểm tài sản được ghi nhận. Giá gốc của tài sản không được thay đổi trừ khi có quy định khác trong chuẩn mực kế toán cụ thể.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003ePhù hợp\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e06. Việc ghi nhận doanh thu và chi phí phải phù hợp với nhau. Khi ghi nhận một khoản doanh thu thì phải ghi nhận một khoản chi phí tương ứng có liên quan đến việc tạo ra doanh thu đó. Chi phí tương ứng với doanh thu gồm chi phí của kỳ tạo ra doanh thu và chi phí của các kỳ trước hoặc chi phí phải trả nhưng liên quan đến doanh thu của kỳ đó.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eNhất quán\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e07. Các chính sách và phương pháp kế toán doanh nghiệp đã chọn phải được áp dụng thống nhất ít nhất trong một kỳ kế toán năm. Trường hợp có thay đổi chính sách và phương pháp kế toán đã chọn thì phải giải trình lý do và ảnh hưởng của sự thay đổi đó trong phần thuyết minh báo cáo tài chính.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eThận trọng\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e08. Thận trọng là việc xem xét, cân nhắc, phán đoán cần thiết để lập các ước tính kế toán trong các điều kiện không chắc chắn. Nguyên tắc thận trọng đòi hỏi:\u003c/p\u003e\n  \u003cp\u003ea/ Phải lập các khoản dự phòng nhưng không lập quá lớn;\u003c/p\u003e\n  \u003cp\u003eb/ Không đánh giá cao hơn giá trị của các tài sản và các khoản thu nhập;\u003c/p\u003e\n  \u003cp\u003ec/ Không đánh giá thấp hơn giá trị của các khoản nợ phải trả và chi phí;\u003c/p\u003e\n  \u003cp\u003ed/ Doanh thu và thu nhập chỉ được ghi nhận khi có bằng chứng chắc chắn về khả năng thu được lợi ích kinh tế, còn chi phí phải được ghi nhận khi có bằng chứng về khả năng phát sinh chi phí.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eTrọng yếu\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e09. Thông tin được coi là trọng yếu trong trường hợp nếu thiếu thông tin hoặc thiếu chính xác của thông tin đó có thể làm sai lệch đáng kể báo cáo tài chính, làm ảnh hưởng đến quyết định kinh tế của người sử dụng báo cáo tài chính. Tính trọng yếu phụ thuộc vào độ lớn và tính chất của thông tin hoặc các sai sót được đánh giá trong hoàn cảnh cụ thể. Tính trọng yếu của thông tin phải được xem xét trên cả phương diện định lượng và định tính.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eCÁC YÊU CẦU CƠ BẢN ĐỐI VỚI KẾ TOÁN\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eTrung thực\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e10. Các thông tin và số liệu kế toán phải được ghi chép và báo cáo trên cơ sở các bằng chứng đầy đủ, khách quan và đúng với thực tế về hiện trạng, bản chất nội dung và giá trị của nghiệp vụ kinh tế phát sinh.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eKhách quan\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e11. Các thông tin và số liệu kế toán phải được ghi chép và báo cáo đúng với thực tế, không bị xuyên tạc, không bị bóp méo.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eĐầy đủ \u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e12. Mọi nghiệp vụ kinh tế, tài chính phát sinh liên quan đến kỳ kế toán phải được ghi chép và báo cáo đầy đủ, không bị bỏ sót.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eKịp thời\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e13. Các thông tin và số liệu kế toán phải được ghi chép và báo cáo kịp thời, đúng hoặc trước thời hạn quy định, không được chậm trễ.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eDễ hiểu\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e14. Các thông tin và số liệu kế toán trình bày trong báo cáo tài chính phải rõ ràng, dễ hiểu đối với người sử dụng. Người sử dụng ở đây được hiểu là người có hiểu biết về kinh doanh, về kinh tế, tài chính, kế toán ở mức trung bình. Thông tin về những vấn đề phức tạp trong báo cáo tài chính phải được giải trình trong phần thuyết minh.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eCó thể so sánh\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e15. Các thông tin và số liệu kế toán giữa các kỳ kế toán trong một doanh nghiệp và giữa các doanh nghiệp chỉ có thể so sánh được khi tính toán và trình bày nhất quán. Trường hợp không nhất quán thì phải giải trình trong phần thuyết minh để người sử dụng báo cáo tài chính có thể so sánh thông tin giữa các kỳ kế toán, giữa các doanh nghiệp hoặc giữa thông tin thực hiện với thông tin dự toán, kế hoạch.\u003c/p\u003e\n  \u003cp\u003e16. Yêu cầu kế toán quy định tại các Đoạn 10, 11, 12, 13, 14, 15 nói trên phải được thực hiện đồng thời. Ví dụ: Yêu cầu trung thực đã bao hàm yêu cầu khách quan; yêu cầu kịp thời nhưng phải đầy đủ, dễ hiểu và có thể so sánh được.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eCÁC YẾU TỐ CỦA BÁO CÁO TÀI CHÍNH\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e17. Báo cáo tài chính phản ảnh tình hình tài chính của doanh nghiệp bằng cách tổng hợp các nghiệp vụ kinh tế, tài chính có cùng tính chất kinh tế thành các yếu tố của báo cáo tài chính. Các yếu tố liên quan trực tiếp đến việc xác định tình hình tài chính trong Bảng cân đối kế toán là Tài sản, Nợ phải trả và Vốn chủ sở hữu. Các yếu tố liên quan trực tiếp đến đánh giá tình hình và kết quả kinh doanh trong Báo cáo kết quả hoạt động kinh doanh là Doanh thu, thu nhập khác, Chi phí và Kết quả kinh doanh.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eTình hình tài chính\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e18. Các yếu tố có liên quan trực tiếp tới việc xác định và đánh giá tình hình tài chính là Tài sản, Nợ phải trả và Vốn chủ sở hữu. Những yếu tố này được định nghĩa như sau:\u003c/p\u003e\n  \u003cp\u003ea/ Tài sản: Là nguồn lực do doanh nghiệp kiểm soát và có thể thu được lợi ích kinh tế trong tương lai.\u003c/p\u003e\n  \u003cp\u003eb/ Nợ phải trả: Là nghĩa vụ hiện tại của doanh nghiệp phát sinh từ các giao dịch và sự kiện đã qua mà doanh nghiệp phải thanh toán từ các nguồn lực của mình.\u003c/p\u003e\n  \u003cp\u003ec/ Vốn chủ sở hữu: Là giá trị vốn của doanh nghiệp, được tính bằng số chênh lệch giữa giá trị Tài sản của doanh nghiệp trừ (-) Nợ phải trả.\u003c/p\u003e\n  \u003cp\u003e19. Khi xác định các khoản mục trong các yếu tố của báo cáo tài chính phải chú ý đến hình thức sở hữu và nội dung kinh tế của chúng. Trong một số trường hợp, tài sản không thuộc quyền sở hữu của doanh nghiệp nhưng căn cứ vào nội dung kinh tế của tài sản thì được phản ảnh trong các yếu tố của báo cáo tài chính. Ví dụ, trường hợp thuê tài chính, hình thức và nội dung kinh tế là việc doanh nghiệp đi thuê thu được lợi ích kinh tế từ việc sử dụng tài sản thuê đối với phần lớn thời gian sử dụng hữu ích của tài sản, đổi lại doanh nghiệp đi thuê có nghĩa vụ phải trả một khoản tiền xấp xỉ với giá trị hợp lý của tài sản và các chi phí tài chính có liên quan. Nghiệp vụ thuê tài chính làm phát sinh khoản mục \"Tài sản\" và khoản mục \"Nợ phải trả\" trong Bảng cân đối kế toán của doanh nghiệp đi thuê.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eTài sản\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e20. Lợi ích kinh tế trong tương lai của một tài sản là tiềm năng làm tăng nguồn tiền và các khoản tương đương tiền của doanh nghiệp hoặc làm giảm bớt các khoản tiền mà doanh nghiệp phải chi ra.\u003c/p\u003e\n  \u003cp\u003e21. Lợi ích kinh tế trong tương lai của một tài sản được thể hiện trong các trường hợp, như:\u003c/p\u003e\n  \u003cp\u003ea/ Được sử dụng một cách đơn lẻ hoặc kết hợp với các tài sản khác trong sản xuất sản phẩm để bán hay cung cấp dịch vụ cho khách hàng;\u003c/p\u003e\n  \u003cp\u003eb/ Để bán hoặc trao đổi lấy tài sản khác;\u003c/p\u003e\n  \u003cp\u003ec/ Để thanh toán các khoản nợ phải trả;\u003c/p\u003e\n  \u003cp\u003ed/ Để phân phối cho các chủ sở hữu doanh nghiệp.\u003c/p\u003e\n  \u003cp\u003e22. Tài sản được biểu hiện dưới hình thái vật chất như nhà xưởng, máy móc, thiết bị, vật tư, hàng hoá hoặc không thể hiện dưới hình thái vật chất như bản quyền, bằng sáng chế nhưng phải thu được lợi ích kinh tế trong tương lai và thuộc quyền kiểm soát của doanh nghiệp.\u003c/p\u003e\n  \u003cp\u003e23. Tài sản của doanh nghiệp còn bao gồm các tài sản không thuộc quyền sở hữu của doanh nghiệp nhưng doanh nghiệp kiểm soát được và thu được lợi ích kinh tế trong tương lai, như tài sản thuê tài chính; hoặc có những tài sản thuộc quyền sở hữu của doanh nghiệp và thu được lợi ích kinh tế trong tương lai nhưng có thể không kiểm soát được về mặt pháp lý, như bí quyết kỹ thuật thu được từ hoạt động triển khai có thể thỏa mãn các điều kiện trong định nghĩa về tài sản khi các bí quyết đó còn giữ được bí mật và doanh nghiệp còn thu được lợi ích kinh tế.\u003c/p\u003e\n  \u003cp\u003e24. Tài sản của doanh nghiệp được hình thành từ các giao dịch hoặc các sự kiện đã qua, như góp vốn, mua sắm, tự sản xuất, được cấp, được biếu tặng. Các giao dịch hoặc các sự kiện dự kiến sẽ phát sinh trong tương lai không làm tăng tài sản.\u003c/p\u003e\n  \u003cp\u003e25. Thông thường khi các khoản chi phí phát sinh sẽ tạo ra tài sản. Đối với các khoản chi phí không tạo ra lợi ích kinh tế trong tương lai thì không tạo ra tài sản; Hoặc có trường hợp không phát sinh chi phí nhưng vẫn tạo ra tài sản, như vốn góp, tài sản được cấp, được biếu tặng.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eNợ phải trả\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e26. Nợ phải trả xác định nghĩa vụ hiện tại của doanh nghiệp khi doanh nghiệp nhận về một tài sản, tham gia một cam kết hoặc phát sinh các nghĩa vụ pháp lý.\u003c/p\u003e\n  \u003cp\u003e27. Việc thanh toán các nghĩa vụ hiện tại có thể được thực hiện bằng nhiều cách, như:\u003c/p\u003e\n  \u003cp\u003ea/ Trả bằng tiền;\u003c/p\u003e\n  \u003cp\u003eb/ Trả bằng tài sản khác;\u003c/p\u003e\n  \u003cp\u003ec/ Cung cấp dịch vụ;\u003c/p\u003e\n  \u003cp\u003ed/ Thay thế nghĩa vụ này bằng nghĩa vụ khác;\u003c/p\u003e\n  \u003cp\u003eđ/ Chuyển đổi nghĩa vụ nợ phải trả thành vốn chủ sở hữu.\u003c/p\u003e\n  \u003cp\u003e28. Nợ phải trả phát sinh từ các giao dịch và sự kiện đã qua, như mua hàng hoá chưa trả tiền, sử dụng dịch vụ chưa thanh toán, vay nợ, cam kết bảo hành hàng hoá, cam kết nghĩa vụ hợp đồng, phải trả nhân viên, thuế phải nộp, phải trả khác.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eVốn chủ sở hữu\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e29. Vốn chủ sở hữu được phản ảnh trong Bảng cân đối kế toán, gồm: vốn của các nhà đầu tư, thặng dư vốn cổ phần, lợi nhuận giữ lại, các quỹ, lợi nhuận chưa phân phối, chênh lệch tỷ giá và chênh lệch đánh giá lại tài sản.\u003c/p\u003e\n  \u003cp\u003ea/ Vốn của các nhà đầu tư có thể là vốn của chủ doanh nghiệp, vốn góp, vốn cổ phần, vốn Nhà nước;\u003c/p\u003e\n  \u003cp\u003eb/ Thặng dư vốn cổ phần là chênh lệch giữa mệnh giá cổ phiếu với giá thực tế phát hành;\u003c/p\u003e\n  \u003cp\u003ec/ Lợi nhuận giữ lại là lợi nhuận sau thuế giữ lại để tích luỹ bổ sung vốn;\u003c/p\u003e\n  \u003cp\u003ed/ Các quỹ như quỹ dự trữ, quỹ dự phòng, quỹ đầu tư phát triển;\u003c/p\u003e\n  \u003cp\u003eđ/ Lợi nhuận chưa phân phối là lợi nhuận sau thuế chưa chia cho chủ sở hữu hoặc chưa trích lập các quỹ;\u003c/p\u003e\n  \u003cp\u003ee/ Chênh lệch tỷ giá, gồm:\u003c/p\u003e\n  \u003cp\u003e+ Chênh lệch tỷ giá phát sinh trong quá trình đầu tư xây dựng;\u003c/p\u003e\n  \u003cp\u003e+ Chênh lệch tỷ giá phát sinh khi doanh nghiệp ở trong nước hợp nhất báo cáo tài chính của các hoạt động ở nước ngoài sử dụng đơn vị tiền tệ kế toán khác với đơn vị tiền tệ kế toán của doanh nghiệp báo cáo.\u003c/p\u003e\n  \u003cp\u003eg/ Chênh lệch đánh giá lại tài sản là chênh lệch giữa giá trị ghi sổ của tài sản với giá trị đánh giá lại tài sản khi có quyết định của Nhà nước, hoặc khi đưa tài sản đi góp vốn liên doanh, cổ phần.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eTình hình kinh doanh\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e30. Lợi nhuận là thước đo kết quả hoạt động kinh doanh của doanh nghiệp. Các yếu tố liên quan trực tiếp đến việc xác định lợi nhuận là Doanh thu, thu nhập khác và Chi phí. Doanh thu, thu nhập khác, Chi phí và Lợi nhuận là các chỉ tiêu phản ánh tình hình kinh doanh của doanh nghiệp.\u003c/p\u003e\n  \u003cp\u003e31. Các yếu tố Doanh thu, thu nhập khác và Chi phí được định nghĩa như sau:\u003c/p\u003e\n  \u003cp\u003ea/ Doanh thu và thu nhập khác: Là tổng giá trị các lợi ích kinh tế doanh nghiệp thu được trong kỳ kế toán, phát sinh từ các hoạt động sản xuất, kinh doanh thông thường và các hoạt động khác của doanh nghiệp, góp phần làm tăng vốn chủ sở hữu, không bao gồm khoản góp vốn của cổ đông hoặc chủ sở hữu.\u003c/p\u003e\n  \u003cp\u003eb/ Chi phí: Là tổng giá trị các khoản làm giảm lợi ích kinh tế trong kỳ kế toán dưới hình thức các khoản tiền chi ra, các khoản khấu trừ tài sản hoặc phát sinh các khoản nợ dẫn đến làm giảm vốn chủ sở hữu, không bao gồm khoản phân phối cho cổ đông hoặc chủ sở hữu.\u003c/p\u003e\n  \u003cp\u003e32. Doanh thu, thu nhập khác và chi phí được trình bày trong Báo cáo kết quả hoạt động kinh doanh để cung cấp thông tin cho việc đánh giá năng lực của doanh nghiệp trong việc tạo ra các nguồn tiền và các khoản tương đương tiền trong tương lai.\u003c/p\u003e\n  \u003cp\u003e33. Các yếu tố doanh thu, thu nhập khác và chi phí có thể trình bày theo nhiều cách trong báo cáo kết quả hoạt động kinh doanh để trình bày tình hình kinh doanh của doanh nghiệp, như: Doanh thu, chi phí và lợi nhuận của hoạt động kinh doanh thông thường và hoạt động khác.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eDoanh thu và Thu nhập khác\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e34. Doanh thu phát sinh trong quá trình hoạt động kinh doanh thông thường của doanh nghiệp và thường bao gồm: Doanh thu bán hàng, doanh thu cung cấp dịch vụ, tiền lãi, tiền bản quyền, cổ tức và lợi nhuận được chia...\u003c/p\u003e\n  \u003cp\u003e35. Thu nhập khác bao gồm các khoản thu nhập phát sinh từ các hoạt động ngoài các hoạt động tạo ra doanh thu, như: thu từ thanh lý, nhượng bán tài sản cố định, thu tiền phạt khách hàng do vi phạm hợp đồng,...\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eChi phí\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e36. Chi phí bao gồm các chi phí sản xuất, kinh doanh phát sinh trong quá trình hoạt động kinh doanh thông thường của doanh nghiệp và các chi phí khác.\u003c/p\u003e\n  \u003cp\u003e37. Chi phí sản xuất, kinh doanh phát sinh trong quá trình hoạt động kinh doanh thông thường của doanh nghiệp, như: giá vốn hàng bán, chi phí bán hàng, chi phí quản lý doanh nghiệp, chi phí lãi tiền vay, và những chi phí liên quan đến hoạt động cho các bên khác sử dụng tài sản sinh ra lợi tức, tiền bản quyền,... Những chi phí này phát sinh dưới dạng tiền và các khoản tương đương tiền, hàng tồn kho, khấu hao máy móc, thiết bị.\u003c/p\u003e\n  \u003cp\u003e38. Chi phí khác bao gồm các chi phí ngoài các chi phí sản xuất, kinh doanh phát sinh trong quá trình hoạt động kinh doanh thông thường của doanh nghiệp, như: chi phí về thanh lý, nhượng bán tài sản cố định, các khoản tiền bị khách hàng phạt do vi phạm hợp đồng,...\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eGhi nhận các yếu tố của báo cáo tài chính\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e39. Báo cáo tài chính phải ghi nhận các yếu tố về tình hình tài chính và tình hình kinh doanh của doanh nghiệp; trong các yếu tố đó phải được ghi nhận theo từng khoản mục. Một khoản mục được ghi nhận trong báo cáo tài chính khi thoả mãn cả hai tiêu chuẩn:\u003c/p\u003e\n  \u003cp\u003ea/ Chắc chắn thu được lợi ích kinh tế hoặc làm giảm lợi ích kinh tế trong tương lai;\u003c/p\u003e\n  \u003cp\u003eb/ Khoản mục đó có giá trị và xác định được giá trị một cách đáng tin cậy.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eGhi nhận tài sản\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e40. Tài sản được ghi nhận trong Bảng cân đối kế toán khi doanh nghiệp có khả năng chắc chắn thu được lợi ích kinh tế trong tương lai và giá trị của tài sản đó được xác định một cách đáng tin cậy.\u003c/p\u003e\n  \u003cp\u003e41. Tài sản không được ghi nhận trong Bảng cân đối kế toán khi các chi phí bỏ ra không chắc chắn sẽ mang lại lợi ích kinh tế trong tương lai cho doanh nghiệp thì các chi phí đó được ghi nhận ngay vào Báo cáo kết quả hoạt động kinh doanh khi phát sinh.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eGhi nhận nợ phải trả \u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e42. Nợ phải trả được ghi nhận trong Bảng cân đối kế toán khi có đủ điều kiện chắc chắn là doanh nghiệp sẽ phải dùng một lượng tiền chi ra để trang trải cho những nghĩa vụ hiện tại mà doanh nghiệp phải thanh toán, và khoản nợ phải trả đó phải xác định được một cách đáng tin cậy.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eGhi nhận doanh thu và thu nhập khác\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e43. Doanh thu và thu nhập khác được ghi nhận trong Báo cáo kết quả hoạt động kinh doanh khi thu được lợi ích kinh tế trong tương lai có liên quan tới sự gia tăng về tài sản hoặc giảm bớt nợ phải trả và giá trị gia tăng đó phải xác định được một cách đáng tin cậy.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eGhi nhận chi phí\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e44. Chi phí sản xuất, kinh doanh và chi phí khác được ghi nhận trong Báo cáo kết quả hoạt động kinh doanh khi các khoản chi phí này làm giảm bớt lợi ích kinh tế trong tương lai có liên quan đến việc giảm bớt tài sản hoặc tăng nợ phải trả và chi phí này phải xác định được một cách đáng tin cậy.\u003c/p\u003e\n  \u003cp\u003e45. Các chi phí được ghi nhận trong Báo cáo kết quả hoạt động kinh doanh phải tuân thủ nguyên tắc phù hợp giữa doanh thu và chi phí.\u003c/p\u003e\n  \u003cp\u003e46. Khi lợi ích kinh tế dự kiến thu được trong nhiều kỳ kế toán có liên quan đến doanh thu và thu nhập khác được xác định một cách gián tiếp thì các chi phí liên quan được ghi nhận trong Báo cáo kết quả hoạt động kinh doanh trên cơ sở phân bổ theo hệ thống hoặc theo tỷ lệ.\u003c/p\u003e\n  \u003cp\u003e47. Một khoản chi phí được ghi nhận ngay vào Báo cáo kết quả hoạt động kinh doanh trong kỳ khi chi phí đó không đem lại lợi ích kinh tế trong các kỳ sau.\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eHỆ THỐNG CHUẨN MỰC KẾ TOÁN VIỆT \u003c/strong\u003e\u003cstrong\u003eNAM\u003c/strong\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eChuẩn mực số 06\u003c/strong\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003eTHUÊ TÀI SẢN\u003cbr\u003e\u003cem\u003e(Ban hành và công bố theo Quyết định số \u003ca\u003e165/2002/QĐ-BTC\u003c/a\u003e ngày 31 tháng 12 năm 2002 của Bộ trưởng Bộ Tài chính)\u003c/em\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eQUY ĐỊNH CHUNG\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e01. Mục đích của chuẩn mực này là quy định và hướng dẫn các nguyên tắc và phương pháp kế toán đối với bên thuê và bên cho thuê tài sản, bao gồm thuê tài chính và thuê hoạt động, làm cơ sở ghi sổ kế toán và lập báo cáo tài chính.\u003c/p\u003e\n  \u003cp\u003e02. Chuẩn mực này áp dụng cho kế toán thuê tài sản, ngoại trừ:\u003c/p\u003e\n  \u003cp\u003ea) Hợp đồng thuê để khai thác, sử dụng tài nguyên thiên nhiên như dầu, khí, gỗ, kim loại và các khoáng sản khác;\u003c/p\u003e\n  \u003cp\u003eb) Hợp đồng sử dụng bản quyền như phim, băng vidéo, nhạc kịch, bản quyền tác giả, bằng sáng chế.\u003c/p\u003e\n  \u003cp\u003e03. Chuẩn mực này áp dụng cho cả trường hợp chuyển quyền sử dụng tài sản ngay cả khi bên cho thuê được yêu cầu thực hiện các dịch vụ chủ yếu liên quan đến điều hành, sửa chữa, bảo dưỡng tài sản cho thuê. Chuẩn mực này không áp dụng cho các hợp đồng dịch vụ không chuyển quyền sử dụng tài sản.\u003c/p\u003e\n  \u003cp\u003e04. Các thuật ngữ trong chuẩn mực này được hiểu như sau:\u003c/p\u003e\n  \u003cp\u003eThuê tài sản: Là sự thoả thuận giữa bên cho thuê và bên thuê về việc bên cho thuê chuyển quyền sử dụng tài sản cho bên thuê trong một khoảng thời gian nhất định để được nhận tiền cho thuê một lần hoặc nhiều lần.\u003c/p\u003e\n  \u003cp\u003eThuê tài chính: Là thuê tài sản mà bên cho thuê có sự chuyển giao phần lớn rủi ro và lợi ích gắn liền với quyền sở hữu tài sản cho bên thuê. Quyền sở hữu tài sản có thể chuyển giao vào cuối thời hạn thuê.\u003c/p\u003e\n  \u003cp\u003eThuê hoạt động: Là thuê tài sản không phải là thuê tài chính.\u003c/p\u003e\n  \u003cp\u003eHợp đồng thuê tài sản không huỷ ngang: Là hợp đồng thuê tài sản mà hai bên không thể đơn phương chấm dứt hợp đồng, trừ các trường hợp:\u003c/p\u003e\n  \u003cp\u003ea) Có sự kiện bất thường xảy ra, như:\u003c/p\u003e\n  \u003cp\u003e- Bên cho thuê không giao đúng hạn tài sản cho thuê;\u003c/p\u003e\n  \u003cp\u003e- Bên thuê không trả tiền thuê theo quy định trong hợp đồng thuê tài sản;\u003c/p\u003e\n  \u003cp\u003e- Bên thuê hoặc bên cho thuê vi phạm hợp đồng;\u003c/p\u003e\n  \u003cp\u003e- Bên thuê bị phá sản, hoặc giải thể;\u003c/p\u003e\n  \u003cp\u003e- Người bảo lãnh bị phá sản, hoặc giải thể và bên cho thuê không chấp thuận đề nghị chấm dứt bảo lãnh hoặc đề nghị người bảo lãnh khác thay thế của bên thuê;\u003c/p\u003e\n  \u003cp\u003e- Tài sản cho thuê bị mất, hoặc hư hỏng không thể sửa chữa phục hồi được.\u003c/p\u003e\n  \u003cp\u003eb) Được sự đồng ý của bên cho thuê;\u003c/p\u003e\n  \u003cp\u003ec) Nếu 2 bên thỏa thuận một hợp đồng mới về thuê chính tài sản đó hoặc tài sản tương tự;\u003c/p\u003e\n  \u003cp\u003ed) Bên thuê thanh toán thêm một khoản tiền ngay tại thời điểm khởi đầu thuê tài sản.\u003c/p\u003e\n  \u003cp\u003eThời điểm khởi đầu thuê tài sản: Là ngày xảy ra trước của một trong hai (2) ngày: Ngày quyền sử dụng tài sản được chuyển giao cho bên thuê và ngày tiền thuê bắt đầu được tính theo các điều khoản quy định trong hợp đồng.\u003c/p\u003e\n  \u003cp\u003eThời hạn thuê tài sản: Là khoảng thời gian của hợp đồng thuê tài sản không huỷ ngang cộng (+) với khoảng thời gian bên thuê được gia hạn thuê tài sản đã ghi trong hợp đồng, phải trả thêm hoặc không phải trả thêm chi phí nếu quyền gia hạn này xác định được tương đối chắc chắn ngay tại thời điểm khởi đầu thuê tài sản.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eKhoản thanh toán tiền thuê tối thiểu:\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003ea) Đối với bên thuê: Là khoản thanh toán mà bên thuê phải trả cho bên cho thuê về việc thuê tài sản theo thời hạn trong hợp đồng (Không bao gồm các khoản chi phí dịch vụ và thuế do bên cho thuê đã trả mà bên thuê phải hoàn lại và tiền thuê phát sinh thêm), kèm theo bất cứ giá trị nào được bên thuê hoặc một bên liên quan đến bên thuê đảm bảo thanh toán.\u003c/p\u003e\n  \u003cp\u003eb) Đối với bên cho thuê: Là khoản thanh toán mà bên thuê phải trả cho bên cho thuê theo thời hạn thuê trong hợp đồng (Không bao gồm các khoản chi phí dịch vụ và thuế do bên cho thuê đã trả mà bên thuê phải hoàn lại và tiền thuê phát sinh thêm) cộng (+) với giá trị còn lại của tài sản cho thuê được đảm bảo thanh toán bởi:\u003c/p\u003e\n  \u003cp\u003e- Bên thuê;\u003c/p\u003e\n  \u003cp\u003e- Một bên liên quan đến bên thuê; hoặc\u003c/p\u003e\n  \u003cp\u003e- Một bên thứ ba độc lập có khả năng tài chính.\u003c/p\u003e\n  \u003cp\u003ec) Trường hợp trong hợp đồng thuê bao gồm điều khoản bên thuê được quyền mua lại tài sản thuê với giá thấp hơn giá trị hợp lý vào ngày mua thì khoản thanh toán tiền thuê tối thiểu (Đối với cả bên cho thuê và bên đi thuê) bao gồm tiền thuê tối thiểu ghi trong hợp đồng theo thời hạn thuê và khoản thanh toán cần thiết cho việc mua tài sản đó.\u003c/p\u003e\n  \u003cp\u003e\u003cem\u003eGiá trị hợp lý:\u003c/em\u003e Là giá trị tài sản có thể được trao đổi hoặc giá trị một khoản nợ được thanh toán một cách tự nguyện giữa các bên có đầy đủ hiểu biết trong sự trao đổi ngang giá.\u003c/p\u003e\n  \u003cp\u003e\u003cem\u003eGiá trị còn lại của tài sản cho thuê:\u003c/em\u003e Là giá trị ước tính ở thời điểm khởi đầu thuê tài sản mà bên cho thuê dự tính sẽ thu được từ tài sản cho thuê vào lúc kết thúc hợp đồng cho thuê.\u003c/p\u003e\n  \u003cp\u003e\u003cem\u003eGiá trị còn lại của tài sản thuê được đảm bảo:\u003c/em\u003e\u003c/p\u003e\n  \u003cp\u003ea) Đối với bên thuê: Là phần giá trị còn lại của tài sản thuê được bên thuê hoặc bên liên quan với bên thuê đảm bảo thanh toán cho bên cho thuê (Giá trị đảm bảo là số tiền bên thuê phải trả cao nhất trong bất cứ trường hợp nào).\u003c/p\u003e\n  \u003cp\u003eb) Đối với bên cho thuê: Là phần giá trị còn lại của tài sản thuê được bên thuê hoặc bên thứ ba có khả năng tài chính không liên quan với bên cho thuê, đảm bảo thanh toán.\u003c/p\u003e\n  \u003cp\u003eGiá trị còn lại của tài sản thuê không được đảm bảo: Là phần giá trị còn lại của tài sản thuê được xác định bởi bên cho thuê không được bên thuê hoặc bên liên quan đến bên thuê đảm bảo thanh toán hoặc chỉ được một bên liên quan với bên cho thuê, đảm bảo thanh toán.\u003c/p\u003e\n  \u003cp\u003eThời gian sử dụng kinh tế: Là khoảng thời gian mà tài sản được ước tính sử dụng một cách hữu ích hoặc số lượng sản phẩm hay đơn vị tương đương có thể thu được từ tài sản cho thuê do một hoặc nhiều người sử dụng tài sản.\u003c/p\u003e\n  \u003cp\u003eThời gian sử dụng hữu ích: Là khoảng thời gian sử dụng kinh tế còn lại của tài sản thuê kể từ thời điểm bắt đầu thuê, không giới hạn theo thời hạn hợp đồng thuê.\u003c/p\u003e\n  \u003cp\u003eĐầu tư gộp trong hợp đồng thuê tài chính: Là tổng khoản thanh toán tiền thuê tối thiểu theo hợp đồng thuê tài chính (đối với bên cho thuê) cộng (+) giá trị còn lại của tài sản thuê không được đảm bảo.\u003c/p\u003e\n  \u003cp\u003eDoanh thu tài chính chưa thực hiện: Là số chênh lệch giữa tổng khoản thanh toán tiền thuê tối thiểu cộng (+) giá trị còn lại không được đảm bảo trừ (-) giá trị hiện tại của các khoản trên tính theo tỷ lệ lãi suất ngầm định trong hợp đồng thuê tài chính.\u003c/p\u003e\n  \u003cp\u003eĐầu tư thuần trong hợp đồng thuê tài chính: Là số chênh lệch giữa đầu tư gộp trong hợp đồng thuê tài chính và doanh thu tài chính chưa thực hiện.\u003c/p\u003e\n  \u003cp\u003eLãi suất ngầm định trong hợp đồng thuê tài chính: Là tỷ lệ chiết khấu tại thời điểm khởi đầu thuê tài sản, để tính giá trị hiện tại của khoản thanh toán tiền thuê tối thiểu và giá trị hiện tại của giá trị còn lại không được đảm bảo để cho tổng của chúng đúng bằng giá trị hợp lý của tài sản thuê.\u003c/p\u003e\n  \u003cp\u003eLãi suất biên đi vay: Là lãi suất mà bên thuê sẽ phải trả cho một hợp đồng thuê tài chính tương tự hoặc là lãi suất tại thời điểm khởi đầu thuê tài sản mà bên thuê sẽ phải trả để vay một khoản cần thiết cho việc mua tài sản với một thời hạn và với một đảm bảo tương tự.\u003c/p\u003e\n  \u003cp\u003eTiền thuê có thể phát sinh thêm: Là một phần của khoản thanh toán tiền thuê, nhưng không cố định và được xác định dựa trên một yếu tố nào đó ngoài yếu tố thời gian, ví dụ: phần trăm (%) trên doanh thu, số lượng sử dụng, chỉ số giá, lãi suất thị trường.\u003c/p\u003e\n  \u003cp\u003e05. Hợp đồng thuê tài sản bao gồm các quy định cho phép bên thuê được mua tài sản khi đã thực hiện đầy đủ các điều kiện thỏa thuận trong hợp đồng đó gọi là hợp đồng thuê mua.\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eNỘI DUNG CHUẨN MỰC\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003ePhân loại thuê tài sản\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e06. Phân loại thuê tài sản áp dụng trong chuẩn mực này được căn cứ vào mức độ chuyển giao các rủi ro và lợi ích gắn liền với quyền sở hữu tài sản thuê từ bên cho thuê cho bên thuê. Rủi ro bao gồm khả năng thiệt hại từ việc không tận dụng hết năng lực sản xuất hoặc lạc hậu về kỹ thuật và sự biến động bất lợi về tình hình kinh tế ảnh hưởng đến khả năng thu hồi vốn. Lợi ích là khoản lợi nhuận ước tính từ hoạt động của tài sản thuê trong khoảng thời gian sử dụng kinh tế của tài sản và thu nhập ước tính từ sự gia tăng giá trị tài sản hoặc giá trị thanh lý có thể thu hồi được.\u003c/p\u003e\n  \u003cp\u003e07. Thuê tài sản được phân loại là thuê tài chính nếu nội dung hợp đồng thuê tài sản thể hiện việc chuyển giao phần lớn rủi ro và lợi ích gắn liền quyền sở hữu tài sản. Thuê tài sản được phân loại là thuê hoạt động nếu nội dung của hợp đồng thuê tài sản không có sự chuyển giao phần lớn rủi ro và lợi ích gắn liền với quyền sở hữu tài sản.\u003c/p\u003e\n  \u003cp\u003e08. Bên cho thuê và bên thuê phải xác định thuê tài sản là thuê tài chính hay thuê hoạt động ngay tại thời điểm khởi đầu thuê tài sản.\u003c/p\u003e\n  \u003cp\u003e09. Việc phân loại thuê tài sản là thuê tài chính hay thuê hoạt động phải căn cứ vào bản chất các điều khoản ghi trong hợp đồng. Ví dụ các trường hợp thường dẫn đến hợp đồng thuê tài chính là:\u003c/p\u003e\n  \u003cp\u003ea) Bên cho thuê chuyển giao quyền sở hữu tài sản cho bên thuê khi hết thời hạn thuê;\u003c/p\u003e\n  \u003cp\u003eb) Tại thời điểm khởi đầu thuê tài sản, bên thuê có quyền lựa chọn mua lại tài sản thuê với mức giá ước tính thấp hơn giá trị hợp lý vào cuối thời hạn thuê.\u003c/p\u003e\n  \u003cp\u003ec) Thời hạn thuê tài sản chiếm phần lớn thời gian sử dụng kinh tế của tài sản cho dù không có sự chuyển giao quyền sở hữu;\u003c/p\u003e\n  \u003cp\u003ed) Tại thời điểm khởi đầu thuê tài sản, giá trị hiện tại của khoản thanh toán tiền thuê tối thiểu chiếm phần lớn giá trị hợp lý của tài sản thuê;\u003c/p\u003e\n  \u003cp\u003eđ) Tài sản thuê thuộc loại chuyên dùng mà chỉ có bên thuê có khả năng sử dụng không cần có sự thay đổi, sửa chữa lớn nào.\u003c/p\u003e\n  \u003cp\u003e10. Hợp đồng thuê tài sản cũng được coi là hợp đồng thuê tài chính nếu hợp đồng thoả mãn ít nhất một trong ba (3) trường hợp sau:\u003c/p\u003e\n  \u003cp\u003ea) Nếu bên thuê huỷ hợp đồng và đền bù tổn thất phát sinh liên quan đến việc huỷ hợp đồng cho bên cho thuê;\u003c/p\u003e\n  \u003cp\u003eb) Thu nhập hoặc tổn thất do sự thay đổi giá trị hợp lý của giá trị còn lại của tài sản thuê gắn với bên thuê;\u003c/p\u003e\n  \u003cp\u003ec) Bên thuê có khả năng tiếp tục thuê lại tài sản sau khi hết hạn hợp đồng thuê với tiền thuê thấp hơn giá thuê thị trường.\u003c/p\u003e\n  \u003cp\u003e11. Phân loại thuê tài sản được thực hiện tại thời điểm khởi đầu thuê. Bất cứ tại thời điểm nào hai bên thoả thuận thay đổi các điều khoản của hợp đồng (trừ gia hạn hợp đồng) dẫn đến sự thay đổi cách phân loại thuê tài sản theo các tiêu chuẩn từ đoạn 06 đến đoạn 10 tại thời điểm khởi đầu thuê tài sản, thì các điều khoản mới thay đổi này được áp dụng cho suốt thời gian hợp đồng. Tuy nhiên, thay đổi về ước tính (ví dụ, thay đổi ước tính thời gian sử dụng kinh tế hoặc giá trị còn lại của tài sản thuê) hoặc thay đổi khả năng thanh toán của bên thuê, không dẫn đến sự phân loại mới về thuê tài sản.\u003c/p\u003e\n  \u003cp\u003e12. Thuê tài sản là quyền sử dụng đất và nhà được phân loại là thuê hoạt động hoặc thuê tài chính. Tuy nhiên đất thường có thời gian sử dụng kinh tế vô hạn và quyền sở hữu sẽ không chuyển giao cho bên thuê khi hết thời hạn thuê, bên thuê không nhận phần lớn rủi ro và lợi ích gắn liền với quyền sở hữu đất do đó thuê tài sản là quyền sử dụng đất thường được phân loại là thuê hoạt động. Số tiền thuê tài sản là quyền sử dụng đất được phân bổ dần cho suốt thời gian thuê.\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eGHI NHẬN THUÊ TÀI SẢN TRONG BÁO CÁO TÀI CHÍNH CỦA BÊN THUÊ\u003c/strong\u003e\u003c/p\u003e\n  \u003ch5\u003eThuê tài chính\u003c/h5\u003e\n  \u003cp\u003e13. Bên thuê ghi nhận tài sản thuê tài chính là tài sản và nợ phải trả trên Bảng cân đối kế toán với cùng một giá trị bằng với giá trị hợp lý của tài sản thuê tại thời điểm khởi đầu thuê tài sản. Nếu giá trị hợp lý của tài sản thuê cao hơn giá trị hiện tại của khoản thanh toán tiền thuê tối thiểu cho việc thuê tài sản thì ghi theo giá trị hiện tại của khoản thanh toán tiền thuê tối thiểu. Tỷ lệ chiết khấu để tính giá trị hiện tại của khoản thanh toán tiền thuê tối thiểu cho việc thuê tài sản là lãi suất ngầm định trong hợp đồng thuê tài sản hoặc lãi suất ghi trong hợp đồng. Trường hợp không thể xác định được lãi suất ngầm định trong hợp đồng thuê thì sử dụng lãi suất biên đi vay của bên thuê tài sản để tính giá trị hiện tại của khoản thanh toán tiền thuê tối thiểu.\u003c/p\u003e\n  \u003cp\u003e14. Khi trình bày các khoản nợ phải trả về thuê tài chính trong báo cáo tài chính, phải phân biệt nợ ngắn hạn và nợ dài hạn.\u003c/p\u003e\n  \u003cp\u003e15. Chi phí trực tiếp phát sinh ban đầu liên quan đến hoạt động thuê tài chính, như chi phí đàm phán ký hợp đồng được ghi nhận vào nguyên giá tài sản đi thuê.\u003c/p\u003e\n  \u003cp\u003e16. Khoản thanh toán tiền thuê tài sản thuê tài chính phải được chia ra thành chi phí tài chính và khoản phải trả nợ gốc. Chi phí tài chính phải được tính theo từng kỳ kế toán trong suốt thời hạn thuê theo tỷ lệ lãi suất định kỳ cố định trên số dư nợ còn lại cho mỗi kỳ kế toán.\u003c/p\u003e\n  \u003cp\u003e17. Thuê tài chính sẽ phát sinh chi phí khấu hao tài sản và chi phí tài chính cho mỗi kỳ kế toán. Chính sách khấu hao tài sản thuê phải nhất quán với chính sách khấu hao tài sản cùng loại thuộc sở hữu của doanh nghiệp đi thuê. Nếu không chắc chắn là bên thuê sẽ có quyền sở hữu tài sản khi hết hạn hợp đồng thuê thì tài sản thuê sẽ được khấu hao theo thời gian ngắn hơn giữa thời hạn thuê hoặc thời gian sử dụng hữu ích của nó.\u003c/p\u003e\n  \u003cp\u003e18. Khi trình bày tài sản thuê trong báo cáo tài chính phải tuân thủ các quy định của Chuẩn mực kế toán \"TSCĐ hữu hình\".\u003c/p\u003e\n  \u003ch5\u003eThuê hoạt động\u003c/h5\u003e\n  \u003cp\u003e19. Các khoản thanh toán tiền thuê hoạt động (Không bao gồm chi phí dịch vụ, bảo hiểm và bảo dưỡng) phải được ghi nhận là chi phí sản xuất, kinh doanh theo phương pháp đường thẳng cho suốt thời hạn thuê tài sản, không phụ thuộc vào phương thức thanh toán, trừ khi áp dụng phương pháp tính khác hợp lý hơn.\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eGHI NHẬN THUÊ TÀI SẢN TRONG BÁO CÁO TÀI CHÍNH CỦA BÊN CHO THUÊ\u003c/strong\u003e\u003c/p\u003e\n  \u003ch5\u003eThuê tài chính\u003c/h5\u003e\n  \u003cp\u003e20. Bên cho thuê phải ghi nhận giá trị tài sản cho thuê tài chính là khoản phải thu trên Bảng cân đối kế toán bằng giá trị đầu tư thuần trong hợp đồng cho thuê tài chính.\u003c/p\u003e\n  \u003cp\u003e21. Đối với thuê tài chính phần lớn rủi ro và lợi ích kinh tế gắn liền với quyền sở hữu tài sản được chuyển giao cho bên thuê, vì vậy các khoản phải thu về cho thuê tài chính phải được ghi nhận là khoản phải thu vốn gốc và doanh thu tài chính từ khoản đầu tư và dịch vụ của bên cho thuê.\u003c/p\u003e\n  \u003cp\u003e22. Việc ghi nhận doanh thu tài chính phải dựa trên cơ sở lãi suất định kỳ cố định trên tổng số dư đầu tư thuần cho thuê tài chính.\u003c/p\u003e\n  \u003cp\u003e23. Bên cho thuê phân bổ doanh thu tài chính trong suốt thời gian cho thuê dựa trên lãi suất thuê định kỳ cố định trên số dư đầu tư thuần cho thuê tài chính. Các khoản thanh toán tiền thuê tài chính cho từng kỳ kế toán (Không bao gồm chi phí cung cấp dịch vụ) được trừ vào đầu tư gộp để làm giảm đi số vốn gốc và doanh thu tài chính chưa thực hiện.\u003c/p\u003e\n  \u003cp\u003e24. Các chi phí trực tiếp ban đầu để tạo ra doanh thu tài chính như tiền hoa hồng và chi phí pháp lý phát sinh khi đàm phán ký kết hợp đồng thường do bên cho thuê chi trả và được ghi nhận ngay vào chi phí trong kỳ khi phát sinh hoặc được phân bổ dần vào chi phí theo thời hạn cho thuê tài sản phù hợp với việc ghi nhận doanh thu.\u003c/p\u003e\n  \u003ch5\u003eThuê hoạt động\u003c/h5\u003e\n  \u003cp\u003e25. Bên cho thuê phải ghi nhận tài sản cho thuê hoạt động trên Bảng cân đối kế toán theo cách phân loại tài sản của doanh nghiệp.\u003c/p\u003e\n  \u003cp\u003e26. Doanh thu cho thuê hoạt động phải được ghi nhận theo phương pháp đường thẳng trong suốt thời hạn cho thuê, không phụ thuộc vào phương thức thanh toán, trừ khi áp dụng phương pháp tính khác hợp lý hơn.\u003c/p\u003e\n  \u003cp\u003e27. Chi phí cho thuê hoạt động, bao gồm cả khấu hao tài sản cho thuê, được ghi nhận là chi phí trong kỳ khi phát sinh.\u003c/p\u003e\n  \u003cp\u003e28. Chi phí trực tiếp ban đầu để tạo ra doanh thu từ nghiệp vụ cho thuê hoạt động được ghi nhận ngay vào chi phí trong kỳ khi phát sinh hoặc phân bổ dần vào chi phí trong suốt thời hạn cho thuê phù hợp với việc ghi nhận doanh thu cho thuê hoạt động.\u003c/p\u003e\n  \u003cp\u003e29. Khấu hao tài sản cho thuê phải dựa trên một cơ sở nhất quán với chính sách khấu hao của bên cho thuê áp dụng đối với những tài sản tương tự, và chi phí khấu hao phải được tính theo quy định của Chuẩn mực kế toán \"Tài sản cố định hữu hình\" và Chuẩn mực kế toán \"Tài sản cố định vô hình\".\u003c/p\u003e\n  \u003cp\u003e30. Bên cho thuê là doanh nghiệp sản xuất hay doanh nghiệp thương mại ghi nhận doanh thu từ nghiệp vụ cho thuê hoạt động theo từng thời hạn cho thuê.\u003c/p\u003e\n  \u003ch5\u003eGiao dịch bán và thuê lại tài sản\u003c/h5\u003e\n  \u003cp\u003e31. Giao dịch bán và thuê lại tài sản được thực hiện khi tài sản được bán và được chính người bán thuê lại. Phương pháp kế toán áp dụng cho các giao dịch bán và thuê lại tài sản tuỳ thuộc theo loại thuê tài sản.\u003c/p\u003e\n  \u003cp\u003e32. Nếu bán và thuê lại tài sản là thuê tài chính, khoản chênh lệch giữa thu nhập bán với giá trị còn lại của tài sản phải phân bổ cho suốt thời gian thuê tài sản.\u003c/p\u003e\n  \u003cp\u003e33. Nếu thuê lại tài sản là thuê tài chính có nghĩa bên cho thuê cung cấp tài chính cho bên thuê, được đảm bảo bằng tài sản. Khoản chênh lệch giữa thu nhập bán tài sản với giá trị còn lại trên sổ kế toán không được ghi nhận ngay là một khoản lãi từ việc bán tài sản mà phải ghi nhận là thu nhập chưa thực hiện và phân bổ cho suốt thời gian thuê tài sản.\u003c/p\u003e\n  \u003cp\u003e34. Giao dịch bán và thuê lại tài sản là thuê hoạt động được ghi nhận khi:\u003c/p\u003e\n  \u003cp\u003e- Nếu giá bán được thỏa thuận ở mức giá trị hợp lý thì các khoản lỗ hoặc lãi phải được ghi nhận ngay trong kỳ phát sinh;\u003c/p\u003e\n  \u003cp\u003e- Nếu giá bán thấp hơn giá trị hợp lý thì các khoản lãi hoặc lỗ cũng phải được ghi nhận ngay trong kỳ phát sinh, trừ trường hợp khoản lỗ được bù đắp bằng khoản thuê trong tương lai ở một mức giá thuê thấp hơn giá thuê thị trường. Trường hợp này khoản lỗ không được ghi nhận ngay mà phải phân bổ dần vào chi phí phù hợp với khoản thanh toán tiền thuê trong suốt thời gian mà tài sản đó được dự kiến sử dụng;\u003c/p\u003e\n  \u003cp\u003e- Nếu giá bán cao hơn giá trị hợp lý thì khoản chênh lệch cao hơn giá trị hợp lý phải được phân bổ dần vào thu nhập phù hợp với khoản thanh toán tiền thuê trong suốt thời gian mà tài sản đó được dự kiến sử dụng.\u003c/p\u003e\n  \u003cp\u003e35. Nếu thuê lại tài sản là thuê hoạt động, tiền thuê và giá bán được thỏa thuận ở mức giá trị hợp lý, tức là đã thực hiện một nghiệp vụ bán hàng thông thường thì các khoản lãi hay lỗ được hạch toán ngay trong kỳ phát sinh.\u003c/p\u003e\n  \u003cp\u003e36. Đối với thuê hoạt động, nếu giá trị hợp lý tại thời điểm bán và thuê lại tài sản thấp hơn giá trị còn lại của tài sản, khoản lỗ bằng số chênh lệch giữa giá trị còn lại và giá trị hợp lý phải được ghi nhận ngay trong kỳ phát sinh.\u003c/p\u003e\n  \u003cp\u003e37. Các yêu cầu trình bày báo cáo tài chính của bên thuê và bên cho thuê các nghiệp vụ bán và thuê lại tài sản phải giống nhau. Trường hợp trong thoả thuận thuê tài sản có quy định đặc biệt thì cũng phải trình bày trên báo cáo tài chính.\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eTRÌNH BÀY BÁO CÁO TÀI CHÍNH\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eĐối với bên thuê\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e38. Bên thuê tài sản phải trình bày các thông tin về thuê tài chính, sau:\u003c/p\u003e\n  \u003cp\u003ea) Giá trị còn lại của tài sản thuê tại ngày lập báo cáo tài chính;\u003c/p\u003e\n  \u003cp\u003eb) Tiền thuê phát sinh thêm được ghi nhận là chi phí trong kỳ;\u003c/p\u003e\n  \u003cp\u003ec) Căn cứ để xác định tiền thuê phát sinh thêm;\u003c/p\u003e\n  \u003cp\u003ed) Điều khoản gia hạn thuê hoặc quyền được mua tài sản.\u003c/p\u003e\n  \u003cp\u003e39. Bên thuê tài sản phải trình bày các thông tin về thuê hoạt động, sau:\u003c/p\u003e\n  \u003cp\u003ea) Tổng số tiền thuê tối thiểu trong tương lai cho hợp đồng thuê hoạt động không huỷ ngang theo các thời hạn:\u003c/p\u003e\n  \u003cp\u003e- Từ một (1) năm trở xuống;\u003c/p\u003e\n  \u003cp\u003e- Trên một (1) năm đến năm (5) năm;\u003c/p\u003e\n  \u003cp\u003e- Trên năm (5) năm.\u003c/p\u003e\n  \u003cp\u003eb) Căn cứ xác định chi phí thuê tài sản phát sinh thêm;\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eĐối với bên cho thuê\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e40. Bên cho thuê tài sản phải trình bày các thông tin về cho thuê tài chính, sau:\u003c/p\u003e\n  \u003cp\u003ea) Bảng đối chiếu giữa tổng đầu tư gộp cho thuê tài sản và giá trị hiện tại của khoản thanh toán tiền thuê tối thiểu cho việc thuê tài sản phải thu vào ngày lập Báo cáo tài chính của kỳ báo cáo theo các thời hạn:\u003c/p\u003e\n  \u003cp\u003e- Từ một (1) năm trở xuống;\u003c/p\u003e\n  \u003cp\u003e- Trên một (1) năm đến năm (5) năm;\u003c/p\u003e\n  \u003cp\u003e- Trên năm (5) năm.\u003c/p\u003e\n  \u003cp\u003eb) Doanh thu cho thuê tài chính chưa thực hiện;\u003c/p\u003e\n  \u003cp\u003ec) Giá trị còn lại của tài sản thuê không được đảm bảo theo tính toán của bên cho thuê;\u003c/p\u003e\n  \u003cp\u003ed) Dự phòng luỹ kế cho các khoản phải thu khó đòi về khoản thanh toán tiền thuê tối thiểu;\u003c/p\u003e\n  \u003cp\u003eđ) Tiền thuê phát sinh thêm được ghi nhận là doanh thu trong kỳ.\u003c/p\u003e\n  \u003cp\u003e41. Bên cho thuê tài sản phải trình bày các thông tin về cho thuê hoạt động, sau:\u003c/p\u003e\n  \u003cp\u003ea) Khoản thanh toán tiền thuê tối thiểu trong tương lai của các hợp đồng thuê hoạt động không huỷ ngang theo các thời hạn:\u003c/p\u003e\n  \u003cp\u003e- Từ một (1) năm trở xuống;\u003c/p\u003e\n  \u003cp\u003e- Trên một (1) năm đến năm (5) năm;\u003c/p\u003e\n  \u003cp\u003e- Trên năm (5) năm.\u003c/p\u003e\n  \u003cp\u003eb) Tổng số tiền thuê phát sinh thêm được ghi nhận là doanh thu trong kỳ;\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eHỆ THỐNG CHUẨN MỰC KẾ TOÁN VIỆT \u003c/strong\u003e\u003cstrong\u003eNAM\u003c/strong\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eChuẩn mực số \u0026nbsp;10\u003c/strong\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003eẢNH HƯỞNG CỦA VIỆC THAY ĐỔI TỶ GIÁ HỐI ĐOÁI\u003cbr\u003e\u003cem\u003e(Ban hành và công bố theo Quyết định số \u003ca\u003e165/2002/QĐ-BTC\u003c/a\u003e ngày 31 tháng 12 năm 2002 của Bộ trưởng Bộ Tài chính)\u003c/em\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eQUY ĐỊNH CHUNG\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e01. Mục đích của chuẩn mực này là quy định và hướng dẫn các nguyên tắc và phương pháp kế toán những ảnh hưởng do thay đổi tỷ giá hối đoái trong trường hợp doanh nghiệp có các giao dịch bằng ngoại tệ hoặc có các hoạt động ở nước ngoài. Các giao dịch bằng ngoại tệ và các báo cáo tài chính của các hoạt động ở nước ngoài phải được chuyển sang đơn vị tiền tệ kế toán của doanh nghiệp, bao gồm: Ghi nhận ban đầu và báo cáo tại ngày lập Bảng cân đối kế toán; Ghi nhận chênh lệch tỷ giá hối đoái; Chuyển đổi báo cáo tài chính của các hoạt động ở nước ngoài làm cơ sở ghi sổ kế toán, lập và trình bày báo cáo tài chính.\u003c/p\u003e\n  \u003cp\u003e02. Chuẩn mực này áp dụng cho việc:\u003c/p\u003e\n  \u003cp\u003e(a) Kế toán các giao dịch bằng ngoại tệ;\u003c/p\u003e\n  \u003cp\u003e(b) Chuyển đổi báo cáo tài chính của hoạt động ở nước ngoài khi hợp nhất các báo cáo này vào báo cáo tài chính của doanh nghiệp bằng phương pháp hợp nhất hoặc phương pháp vốn chủ sở hữu.\u003c/p\u003e\n  \u003cp\u003e03. Các doanh nghiệp phải sử dụng Đồng Việt Nam làm đơn vị tiền tệ kế toán, trừ trường hợp được phép sử dụng một đơn vị tiền tệ thông dụng khác.\u003c/p\u003e\n  \u003cp\u003e04. Chuẩn mực này không quy định việc chuyển đổi báo cáo tài chính của một doanh nghiệp từ đơn vị tiền tệ kế toán sang một đơn vị tiền tệ khác để thuận tiện cho người sử dụng đã quen thuộc với đơn vị tiền tệ được chuyển đổi đó hoặc cho các mục đích tương tự.\u003c/p\u003e\n  \u003cp\u003e05. Chuẩn mực này không đề cập đến việc trình bày các luồng tiền phát sinh từ các giao dịch bằng ngoại tệ và từ việc chuyển đổi các luồng tiền của một hoạt động ở nước ngoài trong báo cáo lưu chuyển tiền tệ (Quy định tại Chuẩn mực \"Báo cáo lưu chuyển tiền tệ\").\u003c/p\u003e\n  \u003cp\u003e06. Các thuật ngữ trong chuẩn mực này được hiểu như sau:\u003c/p\u003e\n  \u003cp\u003eHoạt động ở nước ngoài: Là các chi nhánh, công ty con, công ty liên kết, công ty liên doanh, hợp tác kinh doanh, hoạt động liên kết kinh doanh của doanh nghiệp lập báo cáo mà hoạt động của các đơn vị này được thực hiện ở một nước khác ngoài Việt Nam.\u003c/p\u003e\n  \u003cp\u003eCơ sở ở nước ngoài: Là một hoạt động ở nước ngoài, mà các hoạt động của nó là một phần độc lập đối với doanh nghiệp lập báo cáo.\u003c/p\u003e\n  \u003cp\u003eĐơn vị tiền tệ kế toán: Là đơn vị tiền tệ được sử dụng chính thức trong việc ghi sổ kế toán và lập báo cáo tài chính.\u003c/p\u003e\n  \u003cp\u003eNgoại tệ: Là đơn vị tiền tệ khác với đơn vị tiền tệ kế toán của một doanh nghiệp.\u003c/p\u003e\n  \u003cp\u003eTỷ giá hối đoái: Là tỷ giá trao đổi giữa hai đơn vị tiền tệ.\u003c/p\u003e\n  \u003cp\u003eChênh lệch tỷ giá hối đoái: Là chênh lệch phát sinh từ việc trao đổi thực tế hoặc quy đổi của cùng một số lượng ngoại tệ sang đơn vị tiền tệ kế toán theo các tỷ giá hối đoái khác nhau.\u003c/p\u003e\n  \u003cp\u003eTỷ giá hối đoái cuối kỳ: Là tỷ giá hối đoái sử dụng tại ngày lập Bảng Cân đối kế toán.\u003c/p\u003e\n  \u003cp\u003eĐầu tư thuần tại một cơ sở ở nước ngoài: Là phần vốn của doanh nghiệp báo cáo trong tổng tài sản thuần của cơ sở nước ngoài đó.\u003c/p\u003e\n  \u003cp\u003eCác khoản mục tiền tệ: Là tiền và các khoản tương đương tiền hiện có, các khoản phải thu, hoặc nợ phải trả bằng một lượng tiền cố định hoặc có thể xác định được.\u003c/p\u003e\n  \u003cp\u003eCác khoản mục phi tiền tệ: Là các khoản mục không phải là các khoản mục tiền tệ.\u003c/p\u003e\n  \u003cp\u003eGiá trị hợp lý: Là giá trị tài sản có thể được trao đổi hoặc giá trị một khoản nợ được thanh toán một cách tự nguyện giữa các bên có đầy đủ hiểu biết trong sự trao đổi ngang giá.\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eNỘI DUNG CHUẨN MỰC\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003eCác giao dịch bằng ngoại tệ\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eGhi nhận ban đầu\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e07. Một giao dịch bằng ngoại tệ là giao dịch được xác định bằng ngoại tệ hoặc yêu cầu thanh toán bằng ngoại tệ, bao gồm các giao dịch phát sinh khi một doanh nghiệp:\u003c/p\u003e\n  \u003cp\u003e(a) Mua hoặc bán sản phẩm, hàng hóa, dịch vụ mà giá cả được xác định bằng ngoại tệ;\u003c/p\u003e\n  \u003cp\u003e(b) Vay hoặc cho vay các khoản tiền mà số phải trả hoặc phải thu được xác định bằng ngoại tệ;\u003c/p\u003e\n  \u003cp\u003e(c) Trở thành một đối tác (một bên) của một hợp đồng ngoại hối chưa được thực hiện;\u003c/p\u003e\n  \u003cp\u003e(d) Mua hoặc thanh lý các tài sản; phát sinh hoặc thanh toán các khoản nợ xác định bằng ngoại tệ;\u003c/p\u003e\n  \u003cp\u003e(e) Dùng một loại tiền tệ này để mua, bán hoặc đổi lấy một loại tiền tệ khác.\u003c/p\u003e\n  \u003cp\u003e08. Một giao dịch bằng ngoại tệ phải được hạch toán và ghi nhận ban đầu theo đơn vị tiền tệ kế toán bằng việc áp dụng tỷ giá hối đoái giữa đơn vị tiền tệ kế toán và ngoại tệ tại ngày giao dịch.\u003c/p\u003e\n  \u003cp\u003e09. Tỷ giá hối đoái tại ngày giao dịch được coi là tỷ giá giao ngay. Doanh nghiệp có thể sử dụng tỷ giá xấp xỉ với tỷ giá hối đoái thực tế tại ngày giao dịch. Ví dụ tỷ giá trung bình tuần hoặc tháng có thể được sử dụng cho tất cả các giao dịch phát sinh của mỗi loại ngoại tệ trong tuần, tháng đó. Nếu tỷ giá hối đoái giao động mạnh thì doanh nghiệp không được sử dụng tỷ giá trung bình cho việc kế toán của tuần hoặc tháng kế toán đó.\u003c/p\u003e\n  \u003ch5\u003eBáo cáo tại ngày lập Bảng cân đối kế toán\u003c/h5\u003e\n  \u003cp\u003e10. Tại ngày lập Bảng cân đối kế toán:\u003c/p\u003e\n  \u003cp\u003e(a) Các khoản mục tiền tệ có gốc ngoại tệ phải được báo cáo theo tỷ giá hối đoái cuối kỳ;\u003c/p\u003e\n  \u003cp\u003e(b) Các khoản mục phi tiền tệ có gốc ngoại tệ phải được báo cáo theo tỷ giá hối đoái tại ngày giao dịch;\u003c/p\u003e\n  \u003cp\u003e(c) Các khoản mục phi tiền tệ được xác định theo giá trị hợp lý bằng ngoại tệ phải được báo cáo theo tỷ giá hối đoái tại ngày xác định giá trị hợp lý.\u003c/p\u003e\n  \u003cp\u003e11. Giá trị ghi sổ của một khoản mục được xác định phù hợp với các chuẩn mực kế toán có liên quan. Ví dụ hàng tồn kho được xác định theo giá gốc, tài sản cố định được xác định theo nguyên giá cho dù giá trị ghi sổ được xác định trên cơ sở giá gốc, nguyên giá hay giá trị hợp lý, giá trị ghi sổ được xác định của các khoản mục có gốc ngoại tệ sau đó sẽ được báo cáo theo đơn vị tiền tệ kế toán phù hợp với quy định của chuẩn mực này.\u003c/p\u003e\n  \u003ch5\u003eGhi nhận chênh lệch tỷ giá hối đoái\u003c/h5\u003e\n  \u003cp\u003e12. Chênh lệch tỷ giá hối đoái phát sinh khi thanh toán các khoản mục tiền tệ có gốc ngoại tệ hoặc trong việc báo cáo các khoản mục tiền tệ có gốc ngoại tệ của một doanh nghiệp theo các tỷ giá hối đoái khác với tỷ giá hối đoái đã được ghi nhận ban đầu, hoặc đã được báo cáo trong báo cáo tài chính trước, được xử lý như sau:\u003c/p\u003e\n  \u003cp\u003e(a) Trong giai đoạn đầu tư xây dựng để hình thành tài sản cố định của doanh nghiệp mới thành lập, chênh lệch tỷ giá hối đoái phát sinh khi thanh toán các khoản mục tiền tệ có gốc ngoại tệ để thực hiện đầu tư xây dựng và chênh lệch tỷ giá hối đoái phát sinh khi đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ cuối năm tài chính được phản ánh luỹ kế, riêng biệt trên Bảng Cân đối kế toán. Khi TSCĐ hoàn thành đầu tư xây dựng đưa vào sử dụng thì chênh lệch tỷ giá hối đoái phát sinh trong giai đoạn đầu tư xây dựng được phân bổ dần vào thu nhập hoặc chi phí sản xuất, kinh doanh trong thời gian tối đa là 5 năm.\u003c/p\u003e\n  \u003cp\u003e(b) Trong giai đoạn sản xuất, kinh doanh, kể cả việc đầu tư xây dựng để hình thành tài sản cố định của doanh nghiệp đang hoạt động, chênh lệch tỷ giá hối đoái phát sinh khi thanh toán các khoản mục tiền tệ có gốc ngoại tệ và đánh giá lại các khoản mục tiền tệ có gốc ngoại tệ cuối năm tài chính sẽ được ghi nhận là thu nhập, hoặc chi phí trong năm tài chính, ngoại trừ chênh lệch tỷ giá hối đoái quy định trong đoạn 12c, 14, 16.\u003c/p\u003e\n  \u003cp\u003e(c) Đối với doanh nghiệp sử dụng công cụ tài chính để dự phòng rủi ro hối đoái thì các khoản vay, nợ phải trả có gốc ngoại tệ được hạch toán theo tỷ giá thực tế tại thời điểm phát sinh. Doanh nghiệp không được đánh giá lại các khoản vay, nợ phải trả có gốc ngoại tệ đã sử dụng công cụ tài chính để dự phòng rủi ro hối đoái.\u003c/p\u003e\n  \u003cp\u003e13. Chênh lệch tỷ giá hối đoái phát sinh được ghi nhận khi có sự thay đổi tỷ giá hối đoái giữa ngày giao dịch và ngày thanh toán của mọi khoản mục tiền tệ có gốc ngoại tệ. Khi giao dịch phát sinh và được thanh toán trong cùng kỳ kế toán, các khoản chênh lệch tỷ giá hối đoái được hạch toán trong kỳ đó. Nếu giao dịch được thanh toán ở các kỳ kế toán sau, chênh lệch tỷ giá hối đoái được tính theo sự thay đổi của tỷ giá hối đoái trong từng kỳ cho đến kỳ giao dịch đó được thanh toán.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eĐầu tư thuần vào cơ sở ở nước ngoài\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e14. Chênh lệch tỷ giá hối đoái phát sinh từ các khoản mục tiền tệ có gốc ngoại tệ về bản chất thuộc phần vốn đầu tư thuần của doanh nghiệp báo cáo tại một cơ sở ở nước ngoài thì được phân loại như là vốn chủ sở hữu trong báo cáo tài chính của doanh nghiệp cho đến khi thanh lý khoản đầu tư này. Tại thời điểm đó các khoản chênh lệch tỷ giá hối đoái này sẽ được hạch toán là thu nhập hoặc chi phí phù hợp với đoạn 30.\u003c/p\u003e\n  \u003cp\u003e15. Một doanh nghiệp có thể có các khoản mục tiền tệ phải thu hoặc phải trả đối với cơ sở ở nước ngoài. Một khoản mục mà việc thanh toán không được xác định hoặc có thể không xảy ra trong một khoảng thời gian có thể đoán trước trong tương lai, về bản chất, làm tăng lên hoặc giảm đi khoản đầu tư thuần của doanh nghiệp ở cơ sở nước ngoài đó. Các khoản mục tiền tệ này có thể bao gồm các khoản phải thu dài hạn hoặc các khoản vay nhưng không bao gồm các khoản phải thu thương mại và các khoản phải trả thương mại.\u003c/p\u003e\n  \u003cp\u003e16. Các khoản chênh lệch tỷ giá hối đoái phát sinh từ các khoản nợ phải trả có gốc ngoại tệ được hạch toán như một khoản hạn chế rủi ro cho khoản đầu tư thuần của doanh nghiệp tại một cơ sở ở nước ngoài sẽ được phân loại như là vốn chủ sở hữu trên báo cáo tài chính của doanh nghiệp cho đến khi thanh lý khoản đầu tư thuần. Tại thời điểm đó các khoản chênh lệch tỷ giá hối đoái này sẽ được hạch toán là thu nhập hoặc chi phí phù hợp với đoạn 30.\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003eBÁO CÁO TÀI CHÍNH CỦA CÁC HOẠT ĐỘNG Ở NƯỚC NGOÀI\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003ePhân loại hoạt động ở nước ngoài\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003e17. Phương pháp chuyển đổi các báo cáo tài chính của hoạt động ở nước ngoài tùy theo mức độ phụ thuộc về tài chính và hoạt động với doanh nghiệp báo cáo. Với mục đích này, các hoạt động ở nước ngoài được chia thành hai loại: \"hoạt động ở nước ngoài không thể tách rời với hoạt động của doanh nghiệp báo cáo\" và \"cơ sở ở nước ngoài\".\u003c/p\u003e\n  \u003cp\u003e18. Hoạt động ở nước ngoài không thể tách rời với hoạt động của doanh nghiệp báo cáo thực hiện hoạt động kinh doanh của mình như một bộ phận của doanh nghiệp báo cáo. Ví dụ, hoạt động bán hàng nhập khẩu từ doanh nghiệp ở nước ngoài và chuyển số tiền thu được về doanh nghiệp báo cáo. Trong trường hợp này, sự thay đổi tỷ giá hối đoái giữa đồng tiền báo cáo và đồng tiền của nước có hoạt động ở nước ngoài, sẽ ảnh hưởng trực tiếp đến lưu chuyển tiền tệ từ hoạt động của doanh nghiệp báo cáo. Do đó, sự thay đổi tỷ giá hối đoái ảnh hưởng đến từng khoản mục tiền tệ của hoạt động ở nước ngoài hơn là khoản đầu tư thuần của doanh nghiệp báo cáo trong hoạt động đó.\u003c/p\u003e\n  \u003cp\u003e19. Cơ sở ở nước ngoài là đơn vị hoạt động kinh doanh độc lập, có tư cách pháp nhân ở nước sở tại, sử dụng đồng tiền của nước sở tại làm đơn vị tiền tệ kế toán. Cơ sở này có thể cũng tham gia vào các giao dịch bằng ngoại tệ, bao gồm cả giao dịch bằng đồng tiền báo cáo. Khi có một sự thay đổi tỷ giá hối đoái giữa đồng tiền báo cáo và đồng tiền của nước sở tại, chỉ có ảnh hưởng nhỏ hoặc không ảnh hưởng trực tiếp đến hiện tại và tương lai của các luồng tiền từ các hoạt động của cơ sở ở nước ngoài cũng như doanh nghiệp báo cáo. Thay đổi tỷ giá hối đoái ảnh hưởng đến khoản đầu tư ròng của doanh nghiệp báo cáo hơn là đối với các khoản mục tiền tệ và phi tiền tệ riêng lẻ của cơ sở ở nước ngoài.\u003c/p\u003e\n  \u003cp\u003e20. Những đặc điểm nhận biết một cơ sở ở nước ngoài:\u003c/p\u003e\n  \u003cp\u003e(a) Các hoạt động ở nước ngoài được tiến hành với mức độ độc lập cao với doanh nghiệp báo cáo.\u003c/p\u003e\n  \u003cp\u003e(b) Các giao dịch với doanh nghiệp báo cáo chiếm tỷ trọng không lớn trong các hoạt động ở nước ngoài.\u003c/p\u003e\n  \u003cp\u003e(c) Các hoạt động ở nước ngoài tự tài trợ là chính hoặc từ các khoản vay tại nước ngoài hơn là từ doanh nghiệp báo cáo.\u003c/p\u003e\n  \u003cp\u003e(d) Các chi phí về lao động, nguyên vật liệu và các bộ phận cấu thành khác của sản phẩm hoặc dịch vụ của hoạt động ở nước ngoài được chi trả và thanh toán chủ yếu bằng đồng tiền của nước sở tại hơn là đơn vị tiền tệ của doanh nghiệp báo cáo.\u003c/p\u003e\n  \u003cp\u003e(đ) Doanh thu của hoạt động ở nước ngoài chủ yếu bằng các đơn vị tiền tệ khác với đơn vị tiền tệ của doanh nghiệp báo cáo;\u003c/p\u003e\n  \u003cp\u003e(e) Lưu chuyển tiền tệ của doanh nghiệp báo cáo là biệt lập với các hoạt động hàng ngày của hoạt động ở nước ngoài, không bị ảnh hưởng trực tiếp bởi các hoạt động của hoạt động ở nước ngoài.\u003c/p\u003e\n  \u003cp\u003ePhân loại hợp lý từng hoạt động ở nước ngoài có thể dựa trên các đặc điểm phân biệt nêu trên. Trong một số trường hợp, phân loại một hoạt động ở nước ngoài là một cơ sở nước ngoài hay là một hoạt động ở nước ngoài không thể tách rời với doanh nghiệp báo cáo có thể không rõ ràng, do đó cần phải đánh giá để phân loại hợp lý.\u003c/p\u003e\n  \u003cp\u003eHoạt động ở nước ngoài không thể tách rời với hoạt động của doanh nghiệp báo cáo\u003c/p\u003e\n  \u003cp\u003e21. Các báo cáo tài chính của hoạt động ở nước ngoài không thể tách rời với hoạt động của doanh nghiệp báo cáo sẽ được chuyển đổi theo các quy định từ đoạn 7 đến đoạn 16 như là hoạt động của chính doanh nghiệp báo cáo.\u003c/p\u003e\n  \u003cp\u003e22. Từng khoản mục trong báo cáo tài chính của hoạt động ở nước ngoài được chuyển đổi như giao dịch của hoạt động ở nước ngoài được thực hiện bởi doanh nghiệp báo cáo. Nguyên giá và khấu hao tài sản cố định được quy đổi theo tỷ giá tại ngày mua tài sản. Nếu tài sản tính theo giá trị hợp lý thì sử dụng tỷ giá tại ngày xác định giá trị hợp lý. Trị giá hàng tồn kho được quy đổi theo tỷ giá tại thời điểm xác định trị giá hàng tồn kho. Khoản có thể thu hồi hoặc giá trị có thể thực hiện của một tài sản được chuyển đổi theo tỷ giá thực tế tại thời điểm các khoản này được xác định.\u003c/p\u003e\n  \u003cp\u003e23. Trên thực tế, một tỷ giá xấp xỉ với tỷ giá thực tế tại ngày diễn ra hoạt động giao dịch thường được sử dụng. Ví dụ tỷ giá trung bình trong tuần hoặc tháng có thể được sử dụng cho tất cả các giao dịch bằng ngoại tệ diễn ra trong thời kỳ đó. Tuy nhiên, nếu tỷ giá hối đoái dao động mạnh, việc sử dụng tỷ giá trung bình cho một giai đoạn là không thể áp dụng được.\u003c/p\u003e\n  \u003ch5\u003eCơ sở ở nước ngoài\u003c/h5\u003e\n  \u003cp\u003e24. Khi chuyển đổi báo cáo tài chính của cơ sở ở nước ngoài để tổng hợp vào báo cáo tài chính của doanh nghiệp báo cáo phải tuân theo những quy định sau:\u003c/p\u003e\n  \u003cp\u003ea) Tài sản và nợ phải trả (cả khoản mục tiền tệ và phi tiền tệ) của cơ sở ở nước ngoài được quy đổi theo tỷ giá cuối kỳ;\u003c/p\u003e\n  \u003cp\u003eb) Các khoản mục về doanh thu, thu nhập khác và chi phí của cơ sở ở nước ngoài được quy đổi theo tỷ giá tại ngày giao dịch. Trường hợp báo cáo của cơ sở ở nước ngoài được báo cáo bằng đồng tiền của một nền kinh tế siêu lạm phát thì doanh thu, thu nhập khác và chi phí được quy đổi theo tỷ giá cuối kỳ;\u003c/p\u003e\n  \u003cp\u003ec) Tất cả các khoản chênh lệch hối đoái khi chuyển đổi báo cáo tài chính của cơ sở ở nước ngoài để tổng hợp vào báo cáo tài chính của doanh nghiệp báo cáo phải được phân loại như là vốn chủ sở hữu của doanh nghiệp báo cáo cho đến khi thanh lý khoản đầu tư thuần đó.\u003c/p\u003e\n  \u003cp\u003e25. Trường hợp tỷ giá trung bình xấp xỉ tỷ giá thực tế thì tỷ giá trung bình được sử dụng để chuyển đổi các khoản mục doanh thu, thu nhập khác và chi phí của cơ sở ở nước ngoài.\u003c/p\u003e\n  \u003cp\u003e26. Các trường hợp phát sinh chênh lệch tỷ giá hối đoái khi chuyển đổi báo cáo tài chính của cơ sở ở nước ngoài:\u003c/p\u003e\n  \u003cp\u003ea) Chuyển đổi các khoản mục doanh thu, thu nhập khác và chi phí theo tỷ giá hối đoái tại ngày giao dịch, các tài sản và các khoản nợ phải trả theo tỷ giá hối đoái cuối kỳ;\u003c/p\u003e\n  \u003cp\u003eb) Chuyển đổi khoản đầu tư thuần đầu kỳ tại cơ sở ở nước ngoài theo một tỷ giá hối đoái khác với tỷ giá hối đoái đã được phản ánh kỳ trước;\u003c/p\u003e\n  \u003cp\u003ec) Các khoản thay đổi khác liên quan đến vốn chủ sở hữu tại cơ sở nước ngoài.\u003c/p\u003e\n  \u003cp\u003eNhững khoản chênh lệch tỷ giá hối đoái này không được ghi nhận là thu nhập hoặc chi phí trong kỳ. Những khoản thay đổi tỷ giá này thường có ít ảnh hưởng hoặc ảnh hưởng không trực tiếp đến các luồng tiền từ hoạt động hiện tại và trong tương lai của cơ sở ở nước ngoài cũng như của doanh nghiệp báo cáo. Khi một cơ sở ở nước ngoài được hợp nhất nhưng không phải là sở hữu toàn bộ thì khoản chênh lệch tỷ giá hối đoái lũy kế phát sinh từ việc chuyển đổi và gắn liền với phần đầu tư vào cơ sở ở nước ngoài của cổ đông thiểu số phải được phân bổ và được báo cáo như là một phần sở hữu của cổ đông thiểu số tại cơ sở ở nước ngoài trong Bảng cân đối kế toán hợp nhất.\u003c/p\u003e\n  \u003cp\u003e27. Mọi giá trị lợi thế thương mại phát sinh khi mua cơ sở ở nước ngoài và mọi sự điều chỉnh giá trị hợp lý về giá trị ghi sổ của tài sản và nợ phải trả phát sinh trong quá trình mua cơ sở ở nước ngoài đều được xử lý như là:\u003c/p\u003e\n  \u003cp\u003ea) Tài sản và nợ phải trả của cơ sở ở nước ngoài được chuyển đổi theo tỷ giá cuối kỳ như quy định tại đoạn 23.\u003c/p\u003e\n  \u003cp\u003eb) Tài sản và nợ phải trả của doanh nghiệp báo cáo đã được thể hiện bằng ngoại tệ báo cáo, hoặc là khoản mục phi tiền tệ, được báo cáo theo tỷ giá tại ngày giao dịch như quy định tại đoạn 10(b).\u003c/p\u003e\n  \u003cp\u003e28. Việc hợp nhất báo cáo tài chính của cơ sở ở nước ngoài vào báo cáo tài chính của doanh nghiệp báo cáo phải tuân theo các thủ tục hợp nhất thông thường, như loại bỏ các số dư trong tập đoàn và các nghiệp vụ với các công ty trong tập đoàn của một công ty con (Xem Chuẩn mực kế toán \"Báo cáo tài chính hợp nhất và kế toán khoản vốn góp vào các công ty con\" và Chuẩn mực kế toán \"Thông tin tài chính về các khoản vốn góp liên doanh\"). Tuy nhiên, một khoản chênh lệch tỷ giá hối đoái phát sinh trong một khoản mục tiền tệ trong tập đoàn dù là ngắn hạn hay dài hạn cũng không thể loại trừ vào khoản tương ứng trong số dư khác trong tập đoàn bởi vì khoản mục tiền tệ này thể hiện một sự cam kết để chuyển đổi một ngoại tệ thành một ngoại tệ khác và đưa đến lãi hoặc lỗ cho doanh nghiệp báo cáo do thay đổi tỷ giá hối đoái. Vì vậy, trong báo cáo tài chính hợp nhất của doanh nghiệp báo cáo, chênh lệch tỷ giá hối đoái được hạch toán là thu nhập hoặc chi phí, hoặc nếu nó phát sinh từ các trường hợp như trình bày ở đoạn 14 và 16 thì sẽ được phân loại như là vốn chủ sở hữu cho đến khi thanh lý khoản đầu tư thuần.\u003c/p\u003e\n  \u003cp\u003e29. Ngày lập báo cáo tài chính của cơ sở ở nước ngoài phải phù hợp với ngày lập báo cáo tài chính của doanh nghiệp báo cáo. Trường hợp không thể lập được báo cáo tài chính cùng ngày thì cho phép tổng hợp báo cáo tài chính có ngày khác biệt không quá 3 tháng. Trường hợp này, tài sản và nợ phải trả của cơ sở ở nước ngoài được chuyển đổi theo tỷ giá tại ngày lập Bảng cân đối kế toán của cơ sở ở nước ngoài. Khi có sự thay đổi lớn về tỷ giá hối đoái giữa ngày lập báo cáo tài chính của cơ sở ở nước ngoài so với ngày lập báo cáo tài chính của doanh nghiệp báo cáo thì phải có sự điều chỉnh thích hợp từ ngày đó cho đến ngày lập Bảng cân đối kế toán của doanh nghiệp báo cáo theo Chuẩn mực kế toán \"Báo cáo tài chính hợp nhất và kế toán khoản vốn góp vào các công ty con\" và Chuẩn mực kế toán \"Thông tin tài chính về các khoản vốn góp liên doanh\".\u003c/p\u003e\n  \u003ch5\u003eThanh lý cơ sở ở nước ngoài\u003c/h5\u003e\n  \u003cp\u003e30. Khi thanh lý cơ sở ở nước ngoài, khoản chênh lệch tỷ giá hối đoái lũy kế đã bị hoãn lại (theo quy định tại đoạn 24.c) và liên quan đến cơ sở ở nước ngoài đó sẽ được ghi nhận là thu nhập hoặc chi phí cùng với kỳ mà lãi hoặc lỗ về việc thanh lý được ghi nhận.\u003c/p\u003e\n  \u003cp\u003e31. Một doanh nghiệp có thể thanh lý khoản đầu tư tại một cơ sở ở nước ngoài thông qua bán, phát mại, thanh toán lại vốn cổ phần hoặc từ bỏ tất cả hoặc một phần vốn ở cơ sở đó. Thanh toán cổ tức là một hình thức thanh lý chỉ khi nó là một sự thu hồi khoản đầu tư. Trường hợp thanh lý từng phần, chỉ có chênh lệch tỷ giá hối đoái lũy kế liên quan đến phần vốn sở hữu được tính vào lãi hoặc lỗ. Một sự ghi giảm giá trị kế toán của cơ sở nước ngoài không tạo nên thanh lý từng phần. Trường hợp này, không có phần lãi hoặc lỗ nào về chênh lệch tỷ giá hối đoái hoãn lại được ghi nhận vào thời điể

03c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e2. Điều chỉnh cho các khoản\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e- Khấu hao TSCĐ\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e02\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e- Các khoản dự phòng\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e03\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e- Lãi, lỗ chênh lệch tỷ giá hối đoái chưa thực hiện\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e04\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e- Lãi, lỗ từ hoạt động đầu tư\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e05\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e- Chi phí lãi vay\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e06\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e3. Lợi nhuận từ hoạt động kinh doanh trước thay đổi vốn lưu\u003c/p\u003e\n      \u003cp\u003eđộng\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e08\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e- Tăng, giảm các khoản phải thu\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e09\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e- Tăng, giảm hàng tồn kho\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e10\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e- Tăng, giảm các khoản phải trả (không kể lãi vay phải trả,\u003c/p\u003e\n      \u003cp\u003ethuế thu nhập phải nộp)\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e11\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e- Tăng, giảm chi phí trả trước\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e12\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e- Tiền lãi vay đã trả\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e13\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e- Thuế thu nhập đã nộp\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e14\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e- Tiền thu khác từ hoạt động kinh doanh\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e15\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e- Tiền chi khác từ hoạt động kinh doanh\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e16\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003eLưu chuyển tiền thuần từ hoạt động kinh doanh\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e20\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e\u003cstrong\u003eII. Lưu chuyển tiền từ hoạt động đầu tư\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e1. Tiền chi để mua sắm, xây dựng TSCĐ và các tài sản dài hạn khác\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e21\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e2. Tiền thu từ thanh lý, nhượng bán TSCĐ và các tài sản dài hạn khác\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e22\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e3. Tiền chi cho vay, mua các công cụ nợ của đơn vị khác\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e23\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e4. Tiền thu hồi cho vay, bán lại các công cụ nợ của đơn vị khác\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e24\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e5. Tiền chi đầu tư góp vốn vào đơn vị khác\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e25\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e6. Tiền thu hồi đầu tư góp vốn vào đơn vị khác\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e26\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e7. Tiền thu lãi cho vay, cổ tức và lợi nhuận được chia\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e27\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003eLưu chuyển tiền thuần từ hoạt động đầu tư\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e30\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e\u003cstrong\u003eIII. Lưu chuyển tiền từ hoạt động tài chính\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e1. Tiền thu từ phát hành cổ phiếu, nhận vốn góp của chủ sở hữu\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e31\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e2. Tiền chi trả vốn góp cho các chủ sở hữu, mua lại cổ phiếu của doanh nghiệp đã phát hành\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e32\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e3. Tiền vay ngắn hạn, dài hạn nhận được\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e33\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e4. Tiền chi trả nợ gốc vay\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e34\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e5. Tiền chi trả nợ thuê tài chính\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e35\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e6. Cổ tức, lợi nhuận đã trả cho chủ sở hữu\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e36\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003eLưu chuyển tiền thuần từ hoạt động tài chính\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e40\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003eLưu chuyển tiền thuần trong kỳ (20 + 30 + 40)\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e50\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003eTiền và tương đương tiền đầu kỳ\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e60\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003eẢnh hưởng của thay đổi tỷ giá hối đoái quy đổi ngoại tệ\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e61\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 369px;\"\u003e\n      \u003cp\u003eTiền và tương đương tiền cuối kỳ (50 + 60 + 61)\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp align=\"center\"\u003e70\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 66px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cstrong\u003ePHỤ LỤC 2\u003c/strong\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cem\u003e(Mẫu Báo cáo lưu chuyển tiền tệ áp dụng cho ngân hàng, tổ chức tín dụng và các tổ chức tài chính)\u003c/em\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003eBÁO CÁO LƯU CHUYỂN TIỀN TỆ\u003cbr\u003e\u003cem\u003e(Theo phương pháp trực tiếp)\u003c/em\u003e\u003c/p\u003e\n  \u003cp\u003eĐơn vị tính: ...........\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"width: 100.0%;\" width=\"100%\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp align=\"center\"\u003eChỉ tiêu\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003eMã số\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003eKỳ trước\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003eKỳ này\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp align=\"center\"\u003e1\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e2\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e3\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp align=\"center\"\u003e4\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e\u003cstrong\u003eI. Lưu chuyển tiền từ hoạt động kinh doanh\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e1. Tiền chi cho vay\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e01\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e2. Tiền thu hồi cho vay\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e02\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e3. Tiền thu từ hoạt động huy động vốn\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e03\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e4. Trả lại tiền huy động vốn\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e04\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e5. Nhận tiền gửi và trả lại tiền gửi cho ngân hàng, tổ chức tín\u003c/p\u003e\n      \u003cp\u003edụng và tổ chức tài chính khác\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e05\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e6. Gửi tiền và nhận lại tiền gửi cho ngân hàng, tổ chức tín dụng và các tổ chức tài chính khác\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e06\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e7. Thu và chi các loại phí, hoa hồng dịch vụ\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e07\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e8. Tiền lãi cho vay, lãi tiền gửi đã thu\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e08\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e9. Tiền lãi đi vay, nhận tiền gửi đã trả\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e09\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e10. Lãi, lỗ mua, bán ngoại tệ\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e10\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e11. Tiền thu vào hoặc chi ra về mua, bán chứng khoán ở doanh nghiệp kinh doanh chứng khoán\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e11\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e12. Tiền chi mua chứng khoán vì mục đích thương mại\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e12\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e13. Tiền thu từ bán chứng khoán vì mục đích thương mại\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e13\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e14. Thu nợ khó đòi đã xóa sổ\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e14\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e15. Tiền thu khác từ hoạt động kinh doanh\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e15\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e16. Tiền chi khác từ hoạt động kinh doanh\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e16\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003eLưu chuyển tiền thuần từ hoạt động kinh doanh\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e20\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e\u003cstrong\u003eII. Lưu chuyển tiền từ hoạt động đầu tư\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e1. Tiền chi để mua sắm, xây dựng TSCĐ và các tài sản dài hạn khác\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e21\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e2. Tiền thu từ thanh lý, nhượng bán TSCĐ và các tài sản dài hạn khác\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e22\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e3. Tiền chi mua các công cụ nợ của đơn vị khác vì mục đích\u003c/p\u003e\n      \u003cp\u003eđầu tư\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e23\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e4. Tiền thu từ bán lại các công cụ nợ của đơn vị khác vì mục đích đầu tư\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e24\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e5. Tiền chi đầu tư góp vốn vào đơn vị khác\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e25\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e6. Tiền thu hồi đầu tư góp vốn vào đơn vị khác\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e26\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e7. Tiền thu cổ tức và lợi nhuận được chia\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e27\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e8. Tiền thu lãi của hoạt động đầu tư\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e28\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003eLưu chuyển tiền thuần từ hoạt động đầu tư\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e30\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e\u003cstrong\u003eIII. Lưu chuyển tiền từ hoạt động tài chính\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e1. Tiền thu từ phát hành cổ phiếu, nhận vốn góp của chủ sở hữu\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e31\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e2. Tiền chi trả vốn góp cho các chủ sở hữu, mua lại cổ phiếu của doanh nghiệp đã phát hành\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e32\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e3. Tiền vay ngắn hạn, dài hạn nhận được\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e33\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e4. Tiền chi trả nợ gốc vay\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e34\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e5. Tiền chi trả nợ thuê tài chính\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e35\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e6. Cổ tức, lợi nhuận đã trả cho chủ sở hữu\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e36\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003eLưu chuyển tiền thuần từ hoạt động tài chính\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e40\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 47px;\"\u003e\n      \u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 406px;\"\u003e\n      \u003cp\u003eLưu chuyển tiền thuần trong kỳ (20 + 30 + 40)\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003cp align=\"center\"\u003e50\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 57px;\"\u003e\n      \u003c

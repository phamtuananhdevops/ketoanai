ủa Tòa án Nhân dân Tối cao Việt Nam\"},\"foreign\":{\"title\":\"Cổng Thông tin điện tử\u003cbr/\u003eBộ Ngoại giao\",\"description\":\"Cổng thông tin chính thức của Bộ Ngoại giao Việt Nam\"},\"officialGazette\":{\"title\":\"Cổng Thông tin điện tử\u003cbr/\u003eCông báo\",\"description\":\"Cổng thông tin chính thức của Cơ quan Công báo Việt Nam\"},\"feedbackSuggestions\":{\"title\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\",\"description\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\"}}},\"footer\":{\"unit\":\"Đơn vị chủ quản\",\"unitContent\":\"Bộ Tư pháp\",\"address\":\"Địa chỉ\",\"addressContent\":\"Số 60 Trần Phú - Ba Đình - Thành phố Hà Nội\",\"phoneNumber\":\"Điện thoại\",\"phoneNumberContent\":\"024.6273.9468\",\"fax\":\"Fax\",\"faxContent\":\"024.6273.9359\"},\"underConstruction\":{\"title\":\"Đang cập nhật\",\"message\":\"Chức năng này đang được phát triển.\"},\"gioiThieu\":{\"timeline\":{\"2005\":{\"description\":\"Năm 2005 đánh dấu sự khởi đầu của dự án xây dựng Cơ sở dữ liệu quốc gia về pháp luật, với mục tiêu số hóa và tập trung hóa các văn bản pháp luật của Việt Nam.\"},\"2012-2013\":{\"description\":\"Giai đoạn 2012-2013 là thời kỳ phát triển và mở rộng hệ thống, với việc tích hợp thêm nhiều tính năng và cải thiện giao diện người dùng.\"},\"2023-2025\":{\"description\":\"Giai đoạn 2023-2025 tập trung vào việc nâng cấp và hiện đại hóa hệ thống, áp dụng các công nghệ mới và mở rộng phạm vi phục vụ.\"}},\"overview\":{\"title\":\"SƠ LƯỢC MÔ HÌNH CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"CSDLQG về pháp luật tập hợp các văn bản quy phạm pháp luật và văn bản hợp nhất văn bản quy phạm pháp luật (sau đây gọi chung là văn bản) dưới dạng văn bản điện tử do Chính phủ thống nhất quản lý, có địa chỉ truy cập vbpl.vn, bao gồm các Cơ sở dữ liệu thành phần: Cơ sở dữ liệu văn bản pháp luật Trung ương và Cơ sở dữ liệu văn bản pháp luật địa phương.\",\"central\":{\"title\":\"Cơ sở dữ liệu Văn bản pháp luật Trung ương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của các Bộ, cơ quan ngang Bộ, cơ quan nhà nước khác ở Trung ương ban hành hoặc phối hợp ban hành. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật; Văn bản hợp nhất; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"local\":{\"title\":\"Cơ sở dữ liệu văn bản pháp luật địa phương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của từng tỉnh, thành phố trực thuộc Trung ương trên toàn quốc. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật của Hội đồng nhân dân và Ủy ban nhân dân; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"other\":{\"title\":\"Các chuyên mục khác\",\"content\":\"Ngoài các Cơ sở dữ liệu thành phần kể trên, CSDLQG về pháp luật còn có các chuyên mục khác như: Giới thiệu văn bản mới, Tin tức, Tình huống pháp luật. Ngoài ra, CSDLQG về thủ tục hành chính, bộ pháp điển điện tử, cổng thông tin điện tử Bộ Tư pháp cũng trích xuất về CSDLQG về pháp luật.\"}},\"vision\":{\"title\":\"Tầm nhìn\",\"content\":\"Trở thành nguồn tra cứu văn bản pháp luật chính thống, đầy đủ và đáng tin cậy, phục vụ hiệu quả cho người dân, doanh nghiệp và cơ quan nhà nước.\"},\"mission\":{\"title\":\"Sứ mệnh\",\"content\":\"Cung cấp hệ thống văn bản pháp luật được cập nhật kịp thời, tra cứu thuận tiện, góp phần nâng cao nhận thức pháp luật và bảo đảm việc tuân thủ pháp luật trong xã hội.\"},\"features\":{\"title\":\"MỘT SỐ TÍNH NĂNG, TIỆN ÍCH CỦA CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"Hiện nay, CSDLQG về PL có giao diện tương đối thân thiện, dễ tìm kiếm, dễ khai thác các thông tin và tải về sử dụng. Cơ sở dữ liệu cung cấp các chức năng, tiện ích cơ bản và thuận tiện\",\"list\":[{\"key\":\"fullText\",\"label\":\"Tra cứu toàn văn\",\"icon\":\"SearchOutlined\"},{\"key\":\"tableOfContents\",\"label\":\"Tự động tạo mục lục\",\"icon\":\"BookOutlined\"},{\"key\":\"relatedDocuments\",\"label\":\"Liên kết văn bản liên quan\",\"icon\":\"LinkOutlined\"},{\"key\":\"validity\",\"label\":\"Xác định hiệu lực tự động\",\"icon\":\"BarChartOutlined\"},{\"key\":\"va  center;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cem\u003eHà Nội, ngày 20 tháng 03 năm 2006\u003c/em\u003e\u003c/span\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eTHÔNG TƯ\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eHướng dẫn kế toán thực hiện sáu (06) chuẩn mực kế toán ban hành theo\u003cbr\u003e\u003c/strong\u003e\u003c/span\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003equyết định số 12/2005/QĐ-BTC ngày 15/02/2005\u003cbr\u003e\u003c/strong\u003e\u003c/span\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003ecủa Bộ trưởng Bộ Tài chính\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e_________________\u003c/strong\u003e\u003c/span\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cem\u003eCăn cứ Quyết định số 12/2005/QĐ-BTC ngày 15/02/2005 của Bộ trưởng Bộ Tài chính về việc ban hành và công bố sáu (06) chuẩn mực kế toán Việt Nam (đợt 4);\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cem\u003eBộ Tài chính hướng dẫn kế toán thực hiện sáu (06) chuẩn mực kế toán (đợt 4) áp dụng cho các doanh nghiệp thuộc các ngành, các thành phần kinh tế trong cả nước.\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afa700a0-5d8f-11f1-b66a-d135d308f962\" class=\"prov-part\" style=\"font-size: 14px; text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eI - HƯỚNG DẪN KẾ TOÁN CHUẨN MỰC “THUẾ THU NHẬP DOANH NGHIỆP”\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afa7eb00-5d8f-11f1-b0bd-4dc53c201c3f\" class=\"prov-chapter\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eA - Quy định chung\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afa92380-5d8f-11f1-ac36-b9798dc62ce5\" class=\"prov-section\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1 – Ghi nhận “Thuế thu nhập doanh nghiệp”\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afaa0de0-5d8f-11f1-84e5-b3966f5f0a1d\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(1) Hàng quý, kế toán xác định và ghi nhận số thuế thu nhập doanh nghiệp tạm phải nộp trong quý. Thuế thu nhập tạm phải nộp từng quý được tính vào chi phí thuế thu nhập doanh nghiệp hiện hành của quý đó.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afab1f50-5d8f-11f1-a66e-118bdd026875\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(2) Cuối năm tài chính, kế toán phải xác định số và ghi nhận thuế thu nhập doanh nghiệp thực tế phải nộp trong năm trên cơ sở tổng thu nhập chịu thuế cả năm và thuế suất thuế thu nhập doanh nghiệp hiện hành. Thuế thu nhập doanh nghiệp thực phải nộp trong năm được ghi nhận là chi phí thuế thu nhập doanh nghiệp hiện hành trong Báo cáo kết quả hoạt động kinh doanh của năm đó.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afac57d0-5d8f-11f1-ae5d-2f3e7e761b0a\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(3) Trường hợp số thuế thu nhập doanh nghiệp tạm phải nộp trong năm lớn hơn số thuế phải nộp cho năm đó, thì số chênh lệch giữa số thuế tạm phải nộp lớn hơn số thuế phải nộp được ghi giảm chi phí thuế TNDN hiện hành và ghi giảm trừ vào số thuế thu nhập doanh nghiệp phải nộp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afacf410-5d8f-11f1-b000-8558d4bb4a3f\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(4) Trường hợp phát hiện sai sót không trọng yếu của các năm trước liên quan đến khoản thuế thu nhập doanh nghiệp phải nộp của các năm trước, doanh nghiệp được hạch toán tăng (hoặc giảm) số thuế thu nhập doanh nghiệp phải nộp của các năm trước vào chi phí thuế thu nhập hiện hành của năm phát hiện sai sót.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afadb760-5d8f-11f1-80cc-f9fb18639dad\" class=\"prov-section\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2 – Ghi nhận “Thuế thu nhập hoãn lại phải trả”\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afaeefe0-5d8f-11f1-a126-4d7d9dfebf18\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(1) Cuối năm tài chính, doanh nghiệp phải xác định và ghi nhận “Thuế thu nhập hoãn lại phải trả” (nếu có) theo quy định của Chuẩn mực kế toán số 17 “Thuế thu nhập doanh nghiệp”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afafda40-5d8f-11f1-a7ee-51131af598fa\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(2) Thuế thu nhập hoãn lại phải trả được xác định trên cơ sở các khoản chênh lệch tạm thời chịu thuế phát sinh trong năm và thuế suất thuế thu nhập hiện hành theo công thức sau:\u003c/span\u003e\u003c/p\u003e\n  \u003ctable align=\"center\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"635\" style=\"text-align: justify;\" id=\"afafda40-5d8f-11f1-a7ee-51131af598fa\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eThuế thu nhập hoãn lại phải trả\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e=\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTổng chênh lệch tạm thời\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;chịu thuế phát sinh trong năm\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ex\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eThuế suất thuế thu nhập\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003edoanh nghiệp hiện hành\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cdiv style=\"text-align: justify;\"\u003e\n   \u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\n  \u003c/div\u003e\n  \u003cp id=\"afb0ebb0-5d8f-11f1-b566-3d2719487c1b\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(3) Việc ghi nhận thuế thu nhập hoãn lại phải trả trong năm được thực hiện theo nguyên tắc bù trừ giữa số thuế thu nhập hoãn lại phải trả phát sinh trong năm với số thuế thu nhập hoãn lại phải trả đã ghi nhận từ các năm trước nhưng năm nay được ghi giảm (hoàn nhập), cụ thể là:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb0ebb0-5d8f-11f1-b566-3d2719487c1b\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Nếu số thuế thu nhập hoãn lại phải trả phát sinh trong năm lớn hơn số thuế thu nhập hoãn lại phải trả được hoàn nhập trong năm, thì số chênh lệch giữa số thuế thu nhập hoãn lại phải trả phát sinh lớn hơn số được hoàn nhập trong năm được ghi nhận bổ sung vào số thuế thu nhập hoãn lại phải trả và ghi tăng chi phí thuế TNDN hoãn lại;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb0ebb0-5d8f-11f1-b566-3d2719487c1b\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Nếu số thuế thu nhập hoãn lại phải trả phát sinh trong năm nhỏ hơn số thuế thu nhập hoãn lại phải trả được hoàn nhập trong năm, thì số chênh lệch giữa số thuế thu nhập hoãn lại phải trả phát sinh nhỏ hơn số được hoàn nhập trong năm được ghi giảm (hoàn nhập) số thuế thu nhập hoãn lại phải trả và ghi giảm chi phí thuế TNDN hoãn lại;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb160e0-5d8f-11f1-a2ce-5dc7d9925ac6\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(4) Thuế thu nhập hoãn lại phải trả phát sinh trong năm hiện tại được ghi nhận vào chi phí thuế thu nhập hoãn lại để xác định kết quả hoạt động kinh doanh trong năm đó trừ trường hợp thuế thu nhập hoãn lại phải trả phát sinh từ các giao dịch được ghi nhận trực tiếp vào vốn chủ sở hữu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb1af00-5d8f-11f1-8986-7bac1bd3c721\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(5) Trường hợp thuế thu nhập hoãn lại phải trả phát sinh từ việc áp dụng hồi tố thay đổi chính sách kế toán và điều chỉnh hồi tố các sai sót trọng yếu của các năm trước làm phát sinh khoản chênh lệch tạm thời chịu thuế, kế toán phải ghi nhận bổ sung khoản thuế thu nhập hoãn lại phải trả cho các năm trước bằng cách điều chỉnh giảm số dư đầu năm của TK 421 - Lợi nhuận chưa phân phối (TK 4211 - Lợi nhuận chưa phân phối năm trước) và số dư đầu năm TK 347 - Thuế thu nhập hoãn lại phải trả.\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb1fd20-5d8f-11f1-ad82-639add41e608\" class=\"prov-section\" style=\"text-align: justify;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3 – Ghi nhận “Tài sản thuế thu nhập hoãn lại”\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"afb22430-5d8f-11f1-ae40-f36a8b765460\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(1) Cuối năm tài chính, doanh nghiệp phải xác định và ghi nhận “Tài sản thuế thu nhập hoãn lại” (nếu có) theo quy định của Chuẩn mực kế toán số 17 “Thuế thu nhập doanh nghiệp” và hướng dẫn tại Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb29960-5d8f-11f1-a5e4-4dd3a2784312\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(2) Tài sản thuế thu nhập hoãn lại được xác định theo công thức sau:\u003c/span\u003e\u003c/p\u003e\n  \u003ctable align=\"center\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"text-align: justify; width: 100%;\" id=\"afb29960-5d8f-11f1-a5e4-4dd3a2784312\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"width: 10.0404%;\"\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTài sản\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ethuế thu nhập hoãn lại\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 1.13474%;\"\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e=\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 0.572323%;\"\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 25.0356%;\"\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTổng chênh lệch tạm thời được khấu trừ phát sinh trong năm\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 1.13474%;\"\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 39.7972%;\"\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiá trị được khấu trừ chuyển sang năm sau của các khoản lỗ tính thuế và ưu đãi thuế chưa sử dụng\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 0.820243%;\"\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 0.769982%;\"\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ex\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 20.6947%;\"\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eThuế suất thuế thu nhập doanh nghiệp hiện hành\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cdiv style=\"text-align: justify;\"\u003e\n   \u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\n  \u003c/div\u003e\n  \u003cp id=\"afb2c070-5d8f-11f1-a777-956ce71c0171\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(3) Doanh nghiệp chỉ được ghi nhận tài sản thuế thu nhập hoãn lại tính trên các khoản chênh lệch tạm thời được khấu trừ, các khoản lỗ tính thuế và ưu đãi thuế chưa sử dụng nếu chắc chắn có đủ lợi nhuận tính thuế trong tương lai theo quy định của Chuẩn mực kế toán số 17 – “Thuế thu nhập doanh nghiệp”, để có thể sử dụng các khoản chênh lệch tạm thời được khấu trừ, các khoản lỗ tính thuế và ưu đãi thuế chưa sử dụng đó.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb2e780-5d8f-11f1-9428-b1e49c94fa23\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(4) Việc ghi nhận tài sản thuế thu nhập hoãn lại trong năm được thực hiện theo nguyên tắc bù trừ giữa tài sản thuế thu nhập hoãn lại phát sinh trong năm với tài sản thuế thu nhập doanh nghiệp đã ghi nhận từ các năm trước nhưng năm nay được hoàn nhập lại, cụ thể là:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb2e780-5d8f-11f1-9428-b1e49c94fa23\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Nếu tài sản thuế thu nhập hoãn lại phát sinh trong năm lớn hơn tài sản thuế thu nhập hoãn lại được hoàn nhập trong năm, kế toán ghi nhận bổ sung giá trị tài sản thuế thu nhập hoãn lại là số chênh lệch giữa số tài sản thuế thu nhập hoãn lại phát sinh lớn hơn số được hoàn nhập trong năm, nếu chắc chắn rằng trong tương lai doanh nghiệp có đủ\u0026nbsp; lợi nhuận tính thuế để thu hồi tài sản thuế thu nhập hoãn lại được ghi nhận trong năm hiện tại. Trường hợp doanh nghiệp không chắc chắn sẽ có được lợi nhuận chịu thuế trong tương lai, kế toán không được ghi nhận tài sản thuế thu nhập hoãn lại tính trên các khoản chênh lệch tạm thời được khấu trừ phát sinh trong năm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb2e780-5d8f-11f1-9428-b1e49c94fa23\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Nếu tài sản thuế thu nhập hoãn lại được ghi nhận trong năm nhỏ hơn tài sản thuế thu nhập hoãn lại được hoàn nhập trong năm, kế toán ghi giảm tài sản thuế thu nhập hoãn lại là số chênh lệch giữa số tài sản thuế thu nhập hoãn lại phát sinh nhỏ hơn số được hoàn nhập trong năm. Việc ghi giảm tài sản thuế thu nhập hoãn lại phải được thực hiện phù hợp với thời gian mà các khoản chênh lệch tạm thời được khấu trừ (phát sinh từ các năm trước) được hoàn nhập kể cả khi doanh nghiệp không có lợi nhuận tính thuế.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb335a0-5d8f-11f1-86c3-6f502ec73530\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(5) Trường hợp doanh nghiệp có các khoản lỗ tính thuế và các khoản ưu đãi thuế chưa sử dụng và nếu doanh nghiệp chắc chắn rằng sẽ có đủ lợi nhuận chịu thuế trong tương lai để bù đắp các khoản lỗ tính thuế và sử dụng các khoản ưu đãi thuế, kế toán phải ghi nhận tài sản thuế thu nhập hoãn lại bằng giá trị được khấu trừ chuyển sang năm sau của các khoản đó nhân (x) với thuế suất thuế thu nhập doanh nghiệp trong năm hiện hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb383c0-5d8f-11f1-96af-49d9804185ef\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(6) Trường hợp tài sản thuế thu nhập hoãn lại phát sinh từ việc áp dụng hồi tố thay đổi chính sách kế toán và điều chỉnh hồi tố các sai sót trọng yếu của các năm trước làm phát sinh khoản chênh lệch tạm thời được khấu trừ, kế toán phải ghi nhận bổ sung tài sản thuế thu nhập hoãn lại của các năm trước bằng cách điều chỉnh số dư đầu năm TK 421 - Lợi nhuận chưa phân phối (TK 4211 - Lợi nhuận chưa phân phối năm nay) và điều chỉnh số dư đầu năm TK 243 – Tài sản thuế thu nhập hoãn lại.\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb3d1e0-5d8f-11f1-bae6-5549a2f8590d\" class=\"prov-section\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e4 – Xác định “Cơ sở tính thuế của tài sản”\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb42000-5d8f-11f1-afe0-97f6367504c3\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4.1 -\u0026nbsp; Căn cứ xác định “Cơ sở tính thuế của tài sản”\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb42000-5d8f-11f1-afe0-97f6367504c3\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eĐể nhận biết cơ sở tính thuế của một tài sản trên Bảng cân đối kế toán của doanh nghiệp cần phải xem xét các yếu tố sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb42000-5d8f-11f1-afe0-97f6367504c3\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giá trị khoản thu nhập chịu thuế khi thu hồi tài sản đó tạo ra;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb42000-5d8f-11f1-afe0-97f6367504c3\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giá trị khoản thu nhập được loại trừ khỏi thu nhập chịu thuế; hoặc\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb42000-5d8f-11f1-afe0-97f6367504c3\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giá trị còn được tính vào chi phí để xác định thu nhập chịu thuế trong các năm tương lai.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb44710-5d8f-11f1-8c6d-650f9c91aa3d\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4.2 - Nhận biết “Cơ sở tính thuế của tài sản”\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb4bc40-5d8f-11f1-8a27-cb120bb46b3f\" class=\"prov-item\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4.2.1- Nhận biết cơ sở tính thuế của tài sản phát sinh từ các giao dịch có ảnh hưởng đến thu nhập hoặc chi phí để xác định kết quả kinh doanh trong năm tại thời điểm phát sinh giao dịch:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb4bc40-5d8f-11f1-8a27-cb120bb46b3f\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(1) Cơ sở tính thuế của tài sản phát sinh từ các giao dịch tạo ra thu nhập chịu thuế trong năm của doanh nghiệp được căn cứ vào giá trị khoản thu nhập chịu thuế khi thu hồi tài sản đó tạo ra. Hầu hết các tài sản thuộc loại này là các khoản phải thu khách hàng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb4bc40-5d8f-11f1-8a27-cb120bb46b3f\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ: Một khoản phải thu khách hàng có giá trị ghi sổ là 200. Doanh thu tương ứng của khoản phải thu này đã được tính vào thu nhập chịu thuế TNDN. Cơ sở tính thuế thu nhập của khoản phải thu khách hàng này là 200 đúng bằng giá trị ghi sổ của nó, nên không có chênh lệch tạm thời.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb4bc40-5d8f-11f1-8a27-cb120bb46b3f\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(2) Cơ sở tính thuế của tài sản phát sinh từ các giao dịch mà thu nhập từ giao dịch này không chịu thuế, về bản chất được căn cứ vào giá trị khoản thu nhập được khấu trừ khỏi thu nhập chịu thuế, được xác định bằng đúng giá trị ghi sổ của tài sản đó. Đa số các tài sản này là các khoản phải thu từ cổ tức, lợi nhuận được chia hoặc các khoản thu nhập đã được nộp thuế khấu trừ tại nguồn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb4bc40-5d8f-11f1-8a27-cb120bb46b3f\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ: Một khoản cổ tức phải thu từ một công ty con ở trong nước có giá trị ghi sổ là 150. Khoản cổ tức này không phải chịu thuế thu nhập doanh nghiệp. Toàn bộ giá trị ghi sổ của tài sản này sẽ được loại trừ khỏi thu nhập chịu thuế. Việc loại trừ một khoản thu nhập khỏi thu nhập chịu thuế có bản chất là khấu trừ một tài sản tương đương với khoản thu nhập đó khỏi thu nhập chịu thuế. Do vậy, khoản cổ tức phải thu này có cơ sở tính thuế thu nhập bằng 150, đúng bằng giá trị ghi sổ của nó và không làm phát sinh các khoản chênh lệch tạm thời.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb50a60-5d8f-11f1-9c08-7b19dabd379b\" class=\"prov-item\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4.2.2 - Nhận biết cơ sở tính thuế của tài sản phát sinh từ các giao dịch không có ảnh hưởng đến thu nhập hoặc chi phí để xác định kết quả kinh doanh trong năm tại thời điểm phát sinh giao dịch:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb50a60-5d8f-11f1-9c08-7b19dabd379b\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(1) Cơ sở tính thuế của tài sản phát sinh từ giao dịch không có ảnh hưởng đến thu nhập hoặc chi phí tại thời điểm phát sinh giao dịch nhưng khi thu hồi tài sản có phát sinh thu nhập chịu thuế, được căn cứ vào giá trị còn được tính vào chi phí (khấu trừ vào thu nhập chịu thuế) trong các năm tương lai khi bán (thanh lý) hoặc khấu hao. Hầu hết các tài sản thuộc loại này là hàng tồn kho, tài sản cố định và các khoản đầu tư tài chính.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb50a60-5d8f-11f1-9c08-7b19dabd379b\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ: Một TSCĐ có nguyên giá là 200, đã khấu hao luỹ kế là 60, giá trị còn lại là 140. Do doanh nghiệp sử dụng phương pháp tính khấu hao phù hợp với quy định của Luật thuế để xác định chi phí hợp lý, hợp lệ nên giá trị còn lại sẽ được khấu trừ toàn bộ trong tương lai dưới hình thức khấu hao hoặc giảm trừ khi thanh lý. Trường hợp này, cơ sở tính thuế của TSCĐ này là 140, đúng bằng giá trị ghi sổ của nó nên không có chênh lệch tạm thời.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb50a60-5d8f-11f1-9c08-7b19dabd379b\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ: Một loại hàng hoá có giá gốc là 100. Khi doanh nghiệp bán hàng hoá này, toàn bộ giá trị hàng hoá được tính vào giá vốn hàng bán và được cơ quan thuế chấp nhận là chi phí hợp lý để khấu trừ vào thu nhập chịu thuế. Trường hợp này, cơ sở tính thuế của hàng hoá này là 100, đúng bằng giá trị ghi sổ của nó nên không có chênh lệch tạm thời.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb50a60-5d8f-11f1-9c08-7b19dabd379b\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(2) Cơ sở tính thuế của tài sản phát sinh từ giao dịch không có ảnh hưởng đến thu nhập hoặc chi phí tại cả thời điểm phát sinh giao dịch và thời điểm thu hồi tài sản, được căn cứ vào giá trị được loại trừ khỏi thu nhập tính thuế khi thu hồi tài sản, được xác định bằng đúng giá trị ghi sổ của tài sản đó. Hầu hết các tài sản này là các khoản đầu tư cho vay. Các tài sản tạo ra từ giao dịch loại này không làm phát sinh chênh lệch tạm thời.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb50a60-5d8f-11f1-9c08-7b19dabd379b\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ: Một khoản cho vay có giá trị ghi sổ là 100. Việc thu hồi khoản cho vay này không có ảnh hưởng đến thuế thu nhập, tức là không được tính đến khi xác định thu nhập chịu thuế. Do đó cơ sở tính thuế của tài sản này đúng bằng giá trị ghi sổ của nó là 100.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb55880-5d8f-11f1-be19-c9596e5192ff\" class=\"prov-section\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e5 – Xác định “Cơ sở tính thuế của nợ phải trả”\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb57f90-5d8f-11f1-9057-4df2f4f212b0\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5.1 - Căn cứ xác định “Cơ sở tính thuế của nợ phải trả”\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb57f90-5d8f-11f1-9057-4df2f4f212b0\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eĐể nhận biết cơ sở tính thuế của nợ phải trả trên Bảng Cân đối kế toán của doanh nghiệp, phải căn cứ vào các yếu tố sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb57f90-5d8f-11f1-9057-4df2f4f212b0\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giá trị khoản chi phí được khấu trừ vào thu nhập chịu thuế trong các năm tương lai do khoản nợ phải trả đó tạo ra; hoặc\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb57f90-5d8f-11f1-9057-4df2f4f212b0\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giá trị ghi sổ của khoản nợ phải trả đó.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb5cdb0-5d8f-11f1-af07-9705ea774316\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5.2 – Xác định “Cơ sở tính thuế của nợ phải trả”\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb5f4c0-5d8f-11f1-beb9-b5727c0db799\" class=\"prov-item\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5.2.1 - Nhận biết cơ sở tính thuế của nợ phải trả phát sinh từ các giao dịch có ảnh hưởng đến thu nhập hoặc chi phí để xác định kết quả kinh doanh trong năm tại thời điểm phát sinh giao dịch.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb5f4c0-5d8f-11f1-beb9-b5727c0db799\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCơ sở tính thuế được xác định là số chênh lệch giữa giá trị ghi sổ của khoản nợ phải trả đó và giá trị khoản chi phí được khấu trừ vào thu nhập chịu thuế trong các năm tương lai do khoản nợ phải trả đó tạo ra.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb5f4c0-5d8f-11f1-beb9-b5727c0db799\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb5f4c0-5d8f-11f1-beb9-b5727c0db799\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(1) Nợ phải trả ngắn hạn có khoản “chi phí phải trả” về chi phí trích trước lương nghỉ phép với giá trị ghi sổ là 300. Chi phí phải trả tương ứng không được khấu trừ ngay trong năm hiện hành mà chỉ được khấu trừ toàn bộ cho mục đích tính thuế thu nhập trong các năm sau trên cơ sở thực chi là 300. Cơ sở tính thuế thu nhập của khoản nợ phải trả đó là không (0) và làm phát sinh một khoản chênh lệch tạm thời có giá trị là 300.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb5f4c0-5d8f-11f1-beb9-b5727c0db799\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(2) Nợ phải trả ngắn hạn có khoản “Tiền phạt phải trả” với giá trị ghi sổ là 100. Tiền phạt không được khấu trừ cho mục đích tính thuế thu nhập trong năm hiện hành và cả các năm trong tương lai. Cơ sở tính thuế thu nhập của khoản tiền phạt phải trả này là 100. Trường hợp này không phát sinh chênh lệch tạm thời.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb642e0-5d8f-11f1-b9ab-77bcff6d9439\" class=\"prov-item\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5.2.2 - Nhận biết cơ sở tính thuế của nợ phải trả phát sinh từ các giao dịch không có ảnh hưởng đến thu nhập hoặc chi phí để xác định kết quả kinh doanh trong năm tại thời điểm phát sinh giao dịch.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb642e0-5d8f-11f1-b9ab-77bcff6d9439\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCơ sở tính thuế được xác định bằng giá trị ghi sổ của khoản nợ phải trả đó. Các khoản nợ phải trả phát sinh từ các giao dịch loại này không làm phát sinh chênh lệch tạm thời.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb642e0-5d8f-11f1-b9ab-77bcff6d9439\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ: Một khoản nợ phải trả phát sinh do mua hàng trả chậm có giá trị ghi sổ là 200. Việc thanh toán khoản nợ phải trả người bán này không ảnh hưởng đến thu nhập chịu thuế tại thời điểm thanh toán nên giá trị được khấu trừ cho mục đích thuế khi thanh toán là bằng không (0). Cơ sở tính thuế thu nhập của khoản nợ này là 200. Trường hợp này không phát sinh chênh lệch tạm thời.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb69100-5d8f-11f1-9b6d-918104e44672\" class=\"prov-section\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e6 – Xác định các khoản “Chênh lệch tạm thời”\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb6df20-5d8f-11f1-b059-f73cf83bd7ec\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e6.1 – Phân biệt “Chênh lệch tạm thời” và “Chênh lệch vĩnh viễn” giữa lợi nhuận kế toán và thu nhập chịu thuế\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb6df20-5d8f-11f1-b059-f73cf83bd7ec\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Các khoản chênh lệch tạm thời: là chênh lệch phát sinh do sự khác biệt về thời điểm doanh nghiệp ghi nhận thu nhập hoặc chi phí và thời điểm pháp luật về thuế quy định tính thu nhập chịu thuế hoặc chi phí được khấu trừ khỏi thu nhập chịu thuế.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb6df20-5d8f-11f1-b059-f73cf83bd7ec\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ ghi nhận thu nhập vào một năm nhưng thuế thu nhập được tính ở một năm khác, hoặc ghi nhận chi phí vào một năm nhưng chi phí đó chỉ được khấu trừ vào thu nhập chịu thuế ở một năm khác.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb6df20-5d8f-11f1-b059-f73cf83bd7ec\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Các khoản chênh lệch vĩnh viễn: là chênh lệch giữa lợi nhuận kế toán và thu nhập chịu thuế phát sinh từ các khoản doanh thu, thu nhập khác, chi phí được ghi nhận vào lợi nhuận kế toán nhưng lại không được tính vào thu nhập, chi phí khi xác định thu nhập chịu thuế thu nhập doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb6df20-5d8f-11f1-b059-f73cf83bd7ec\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ: Thu nhập từ cổ tức được chia là khoản thu nhập không chịu thuế và được loại trừ toàn bộ ra khỏi thu nhập chịu thuế khi xác định thuế thu nhập doanh nghiệp phải nộp. Tiền phạt không được pháp luật về thuế cho phép khấu trừ khi xác định thu nhập chịu thuế.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb72d40-5d8f-11f1-9bd2-d50536f1a01a\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e6.2 - Xác định “Chênh lệch tạm thời\u0026nbsp; chịu thuế”\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb75450-5d8f-11f1-9326-9f7b71f061a2\" class=\"prov-item\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(1) Chênh lệch tạm thời chịu thuế: Là các khoản chênh lệch tạm thời làm phát sinh thu nhập chịu thuế khi xác định thu nhập chịu thuế thu nhập doanh nghiệp trong tương lai khi giá trị ghi sổ của các khoản mục tài sản hoặc nợ phải trả liên quan được thu hồi hay được thanh toán. Chênh lệch tạm thời chịu thuế phát sinh khi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb75450-5d8f-11f1-9326-9f7b71f061a2\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Giá trị ghi sổ của tài sản lớn hơn cơ sở tính thuế của tài sản đó;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb75450-5d8f-11f1-9326-9f7b71f061a2\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Giá trị ghi sổ của nợ phải trả nhỏ hơn cơ sở tính thuế của nó.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb77b60-5d8f-11f1-8eb7-27e6d8173a1a\" class=\"prov-item\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(2)\u0026nbsp; Xác định giá trị các khoản chênh lệch tạm thời chịu thuế:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb77b60-5d8f-11f1-8eb7-27e6d8173a1a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Đối với tài sản: Chênh lệch tạm thời chịu thuế là chênh lệch giữa giá trị ghi sổ của tài sản lớn hơn cơ sở tính thuế của tài sản đó.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb77b60-5d8f-11f1-8eb7-27e6d8173a1a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Đối với nợ phải trả: Chênh lệch tạm thời chịu thuế là chênh lệch giữa giá trị ghi sổ của khoản nợ phải trả\u0026nbsp; nhỏ hơn cơ sở tính thuế của khoản nợ phải trả đó.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb7a270-5d8f-11f1-8aee-333e95db7c1b\" class=\"prov-item\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(3)\u0026nbsp; Một số trường hợp làm phát sinh chênh lệch tạm thời chịu thuế:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb7a270-5d8f-11f1-8aee-333e95db7c1b\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Chênh lệch tạm thời chịu thuế phát sinh từ việc một khoản chi phí chỉ \u0026nbsp;được ghi nhận trong các năm sau nhưng đã được khấu trừ vào thu nhập chịu thuế trong năm hiện tại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb7a270-5d8f-11f1-8aee-333e95db7c1b\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ: Thời gian sử dụng hữu ích của TSCĐ theo kế toán dài hơn thời gian sử dụng hữu ích do cơ quan thuế xác định dẫn đến chi phí khấu hao TSCĐ theo kế toán trong những năm đầu nhỏ hơn chi phí khấu hao được khấu trừ vào thu nhập chịu thuế do cơ quan thuế xác định..\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb7a270-5d8f-11f1-8aee-333e95db7c1b\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Chênh lệch tạm thời chịu thuế phát sinh từ việc điều chỉnh tăng các khoản mục thuộc vốn chủ sở hữu: Khi áp dụng hồi tố thay đổi chính sách kế toán hoặc điều chỉnh hồi tố sai sót trong các năm trước theo quy định của Chuẩn mực kế toán số 29 “Thay đổi chính sách kế toán, ước tính kế toán và các sai sót”, trường hợp các khoản mục thuộc vốn chủ sở hữu được điều chỉnh tăng, làm phát sinh khoản chênh lệch tạm thời chịu thuế, doanh nghiệp phải ghi nhận thuế thu nhập hoãn lại phải trả.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb7f090-5d8f-11f1-ad48-b15782c422fd\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e6.3 – Xác định các khoản “Chênh lệch tạm thời được khấu trừ”:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb83eb0-5d8f-11f1-919e-f711b742557c\" class=\"prov-item\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(1) Chênh lệch tạm thời được khấu trừ: Là các khoản chênh lệch tạm thời làm phát sinh các khoản được khấu trừ khi xác định thu nhập chịu thuế thu nhập doanh nghiệp trong tương lai khi giá trị ghi sổ của các tài sản hoặc nợ phải trả liên quan được thu hồi hay được thanh toán. Chênh lệch tạm thời được khấu trừ phát sinh khi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb83eb0-5d8f-11f1-919e-f711b742557c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Giá trị ghi sổ của tài sản nhỏ hơn cơ sở tính thuế của tài sản đó;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb83eb0-5d8f-11f1-919e-f711b742557c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Giá trị ghi sổ của nợ phải trả lớn hơn cơ sở tính thuế của nó.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb8b3e0-5d8f-11f1-96ae-5fcbafb8f3e3\" class=\"prov-item\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(2) Xác định giá trị các khoản chênh lệch tạm thời\u0026nbsp; được khấu trừ:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb8b3e0-5d8f-11f1-96ae-5fcbafb8f3e3\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Đối với tài sản: Chênh lệch tạm thời được khấu trừ là chênh lệch giữa giá trị ghi sổ của tài sản nhỏ hơn cơ sở tính thuế của tài sản đó.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb8b3e0-5d8f-11f1-96ae-5fcbafb8f3e3\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Đối với nợ phải trả: Chênh lệch tạm thời được khấu trừ là chênh lệch giữa giá trị ghi sổ của khoản nợ phải trả lớn hơn cơ sở tính thuế của khoản nợ phải trả đó.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb90200-5d8f-11f1-b8af-1f66c27e5e49\" class=\"prov-item\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(3) Một số trường hợp làm phát sinh chênh lệch tạm thời được khấu trừ:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb90200-5d8f-11f1-b8af-1f66c27e5e49\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Chênh lệch tạm thời được khấu trừ phát sinh từ việc ghi nhận doanh thu trong các năm sau nhưng thuế thu nhập được tính trong năm hiện tại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb90200-5d8f-11f1-b8af-1f66c27e5e49\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ: Trường hợp doanh nghiệp có khoản doanh thu nhận trước về tiền cho thuê nhà hoặc cơ sở hạ tầng trong nhiều năm. Khoản doanh thu nhận trước này được ghi nhận vào Báo cáo kết quả hoạt động kinh doanh một năm bằng số tiền nhận trước chia cho tổng số thời gian thuê nhưng doanh nghiệp thực hiện nộp thuế thu nhập doanh nghiệp cho toàn bộ số tiền nhận trước ngay trong năm thu được tiền.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb90200-5d8f-11f1-b8af-1f66c27e5e49\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Chênh lệch tạm thời được khấu trừ phát sinh từ việc ghi nhận một khoản chi phí\u0026nbsp; trong năm hiện tại nhưng chỉ được khấu trừ vào thu nhập chịu thuế trong năm sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb90200-5d8f-11f1-b8af-1f66c27e5e49\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ: Chi phí phải trả về sửa chữa lớn TSCĐ được ghi nhận trong năm hiện tại nhưng chỉ được khấu trừ vào thu nhập chịu thuế khi các khoản chi phí này thực tế phát sinh trong các năm sau; hoặc doanh nghiệp áp dụng phương pháp khấu hao nhanh cho TSCĐ nhưng chi phí khấu hao chỉ được chấp nhận khấu trừ cho mục đích tính thuế thu nhập trong năm theo phương pháp khấu hao đường thẳng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb90200-5d8f-11f1-b8af-1f66c27e5e49\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Chênh lệch tạm thời được khấu trừ phát sinh từ việc điều chỉnh giảm các khoản mục thuộc vốn chủ sở hữu: Khi áp dụng hồi tố thay đổi chính sách kế toán hoặc điều chỉnh hồi tố sai sót trong các năm trước theo quy định của Chuẩn mực kế toán số 29 “Thay đổi chính sách kế toán, ước tính kế toán và các sai sót”, trường hợp số dư đầu năm của khoản mục “Lợi nhuận chưa phân phối” được điều chỉnh, làm phát sinh khoản chênh lệch tạm thời được khấu trừ, doanh nghiệp phải điều chỉnh số dư đầu năm của khoản mục “Tài sản thuế thu nhập hoãn lại”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb95020-5d8f-11f1-94f2-6b8487d23abc\" class=\"prov-chapter\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eB – Quy định cụ thể\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb97730-5d8f-11f1-979c-196f28e850c6\" class=\"prov-section\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1 - Kế toán “Thuế thu nhập doanh nghiệp” và “Chi phí thuế thu nhập doanh nghiệp hiện hành”\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afb9ec60-5d8f-11f1-991e-2dff4958660e\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.1 - Sửa đổi, bổ sung phương pháp ghi chép các nghiệp vụ kinh tế phát sinh phản ánh trên Tài khoản 3334 – “Thuế thu nhập doanh nghiệp”\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb9ec60-5d8f-11f1-991e-2dff4958660e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTài khoản 3334 – “Thuế thu nhập doanh nghiệp” phản ánh số thuế thu nhập doanh nghiệp phải nộp, đã nộp và còn phải nộp vào Ngân sách Nhà nước.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb9ec60-5d8f-11f1-991e-2dff4958660e\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eHẠCH TOÁN TÀI KHOẢN NÀY CẦN TÔN TRỌNG CÁC QUY ĐỊNH SAU:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb9ec60-5d8f-11f1-991e-2dff4958660e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1 - Số thuế thu nhập doanh nghiệp phải nộp trong năm được ghi nhận vào chi phí thuế thu nhập doanh nghiệp hiện hành; Số thuế thu nhập doanh nghiệp tạm phải nộp trong năm lớn hơn số thuế thu nhập doanh nghiệp phải nộp xác định khi kết thúc năm tài chính được ghi giảm chi phí thuế thu nhập doanh nghiệp hiện hành và giảm trừ vào số thuế thu nhập doanh nghiệp phải nộp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb9ec60-5d8f-11f1-991e-2dff4958660e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2 - Số thuế thu nhập doanh nghiệp phải nộp của các năm trước do doanh nghiệp tự xác định lớn hơn số thuế thu nhập doanh nghiệp phải nộp do phát hiện sai sót không trọng yếu được ghi giảm chi phí thuế thu nhập doanh nghiệp hiện hành và được giảm trừ vào số thuế thu nhập doanh nghiệp phải nộp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb9ec60-5d8f-11f1-991e-2dff4958660e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3 – Doanh nghiệp được điều chỉnh số dư đầu năm Tài khoản 3334 “Thuế TNDN” và tài khoản 421 “Lợi nhuận chưa phân phối” (TK 4211 - Lợi nhuận chưa phân phối năm trước) đối với số thuế thu nhập doanh nghiệp phải nộp thêm hoặc số thuế thu nhập doanh nghiệp phải nộp giảm của các năm trước do áp dụng hồi tố thay đổi chính sách kế toán hoặc điều chỉnh hồi tố sai sót trọng yếu của các năm trước.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb9ec60-5d8f-11f1-991e-2dff4958660e\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eKẾT CẤU VÀ NỘI DUNG PHẢN ÁNH CỦA TÀI KHOẢN 3334 – “THUẾ THU NHẬP DOANH NGHIỆP”\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb9ec60-5d8f-11f1-991e-2dff4958660e\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBên Nợ:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb9ec60-5d8f-11f1-991e-2dff4958660e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Số thuế thu nhập doanh nghiệp đã nộp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb9ec60-5d8f-11f1-991e-2dff4958660e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Số thuế thu nhập doanh nghiệp phải nộp của các năm trước đã ghi nhận lớn hơn số phải nộp của các năm đó do phát hiện sai sót không trọng yếu của các năm trước được ghi giảm chi phí thuế thu nhập doanh nghiệp hiện hành trong năm hiện tại;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb9ec60-5d8f-11f1-991e-2dff4958660e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Số thuế thu nhập doanh nghiệp tạm phải nộp trong năm lớn hơn số thuế thu nhập doanh nghiệp phải nộp được xác định khi kết thúc năm tài chính.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb9ec60-5d8f-11f1-991e-2dff4958660e\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBên Có\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb9ec60-5d8f-11f1-991e-2dff4958660e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Số thuế thu nhập doanh nghiệp phải nộp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb9ec60-5d8f-11f1-991e-2dff4958660e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eThuế thu nhập doanh nghiệp của các năm trước phải nộp bổ sung do phát hiện sai sót không trọng yếu của các năm trước được ghi tăng chi phí thuế thu nhập doanh nghiệp hiện hành của năm hiện tại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb9ec60-5d8f-11f1-991e-2dff4958660e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTài khoản 3334 – “Thuế thu nhập doanh nghiệp” có thể có số dư bên Có hoặc số dư bên Nợ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb9ec60-5d8f-11f1-991e-2dff4958660e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố dư bên Có:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb9ec60-5d8f-11f1-991e-2dff4958660e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Số thuế thu nhập doanh nghiệp còn phải nộp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb9ec60-5d8f-11f1-991e-2dff4958660e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Điều chỉnh tăng số dư đầu năm đối với số thuế thu nhập doanh nghiệp hiện hành của các năm trước phải nộp bổ sung do áp dụng hồi tố thay đổi chính sách kế toán hoặc điều chỉnh hồi tố sai sót trọng yếu của các năm trước.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb9ec60-5d8f-11f1-991e-2dff4958660e\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố dư bên Nợ:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb9ec60-5d8f-11f1-991e-2dff4958660e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Số thuế thu nhập doanh nghiệp nộp thừa;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afb9ec60-5d8f-11f1-991e-2dff4958660e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Điều chỉnh tăng số dư đầu năm đối với số thuế thu nhập doanh nghiệp phải nộp của các năm trước được giảm trừ vào số thuế thu nhập doanh nghiệp phải nộp năm nay do áp dụng hồi tố thay đổi chính sách kế toán hoặc điều chỉnh hồi tố sai sót trọng yếu của các năm trước.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.2 - Bổ sung Tài khoản 821 – “Chi phí thuế thu nhập doanh nghiệp”\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTài khoản này dùng để phản ánh chi phí thuế thu nhập doanh nghiệp của doanh nghiệp bao gồm chi phí thuế thu nhập doanh nghiệp hiện hành và chi phí thuế thu nhập doanh nghiệp hoãn lại làm căn cứ xác định kết quả hoạt động kinh doanh của doanh nghiệp trong năm tài chính hiện hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eHẠCH TOÁN TÀI KHOẢN NÀY CẦN TÔN TRỌNG MỘT SỐ QUY ĐỊNH SAU:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1- Chi phí thuế thu nhập doanh nghiệp được ghi nhận vào tài khoản này là chi phí thuế thu nhập doanh nghiệp hiện hành, chi phí thuế thu nhập doanh nghiệp hoãn lại khi xác định lợi nhuận (hoặc lỗ) của một năm tài chính.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2- Chi phí thuế thu nhập doanh nghiệp hiện hành là số thuế thu nhập doanh nghiệp phải nộp tính trên thu nhập chịu thuế trong năm và thuế suất thuế thu nhập doanh nghiệp hiện hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3 - Chi phí thuế thu nhập doanh nghiệp hoãn lại phát sinh từ việc :\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Ghi nhận thuế thu nhập hoãn lại phải trả trong năm;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Hoàn nhập tài sản thuế thu nhập hoãn lại đã được ghi nhận từ các năm trước.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4 - Thu nhập thuế thu nhập doanh nghiệp hoãn lại là khoản ghi giảm chi phí thuế thu nhập doanh nghiệp hoãn lại phát sinh từ việc:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Ghi nhận tài sản thuế thu nhập hoãn lại trong năm;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Hoàn nhập thuế thu nhập hoãn lại phải trả đã được ghi nhận từ các năm trước.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eKẾT CẤU VÀ NỘI DUNG PHẢN ÁNH CỦA TÀI KHOẢN 821 – CHI PHÍ THUẾ THU NHẬP DOANH NGHIỆP\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBên Nợ:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Chi phí thuế thu nhập doanh nghiệp hiện hành phát sinh trong năm;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Thuế thu nhập doanh nghiệp của các năm trước phải nộp bổ sung do phát hiện sai sót không trọng yếu của các năm trước được ghi tăng chi phí thuế thu nhập doanh nghiệp hiện hành của năm hiện tại;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Chi phí thuế thu nhập doanh nghiệp hoãn lại phát sinh trong năm từ việc ghi nhận thuế thu nhập hoãn lại phải trả (Là số chênh lệch giữa thuế thu nhập hoãn lại phải trả phát sinh trong năm lớn hơn thuế thu nhập hoãn lại phải trả được hoàn nhập trong năm);\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Ghi nhận chi phí thuế thu nhập doanh nghiệp hoãn lại (Số chênh lệch giữa tài sản thuế thu nhập hoãn lại được hoàn nhập trong năm lớn hơn tài sản thuế thu nhập hoãn lại phát sinh trong năm);\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Kết chuyển chênh lệch giữa số phát sinh bên Có TK 8212 lớn hơn số phát sinh bên Nợ TK 8212 – “Chi phí thuế thu nhập doanh nghiệp hoãn lại” phát sinh trong năm vào bên Có Tài khoản 911 – “Xác định kết quả kinh doanh”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBên Có:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Số thuế thu nhập doanh nghiệp thực tế phải nộp trong năm nhỏ hơn số thuế thu nhập doanh nghiệp tạm phải nộp được giảm trừ vào chi phí thuế thu nhập doanh nghiệp đã ghi nhận trong năm;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Số thuế thu nhập doanh nghiệp phải nộp được ghi giảm do phát hiện sai sót không trọng yếu của các năm trước được ghi giảm chi phí thuế thu nhập doanh nghiệp hiện hành trong năm hiện tại;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Ghi giảm chi phí thuế thu nhập doanh nghiệp hoãn lại và ghi nhận tài sản thuế thu nhập hoãn lại (số chênh lệch giữa tài sản thuế thu nhập hoãn lại phát sinh trong năm lớn hơn tài sản thuế thu nhập hoãn lại được hoàn nhập trong năm);\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Ghi giảm chi phí thuế thu nhập doanh nghiệp hoãn lại (số chênh lệch giữa thuế thu nhập hoãn lại phải trả được hoàn nhập trong năm lớn hơn thuế thu nhập hoãn lại phải trả phát sinh trong năm);\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Kết chuyển số chênh lệch giữa chi phí thuế thu nhập doanh nghiệp hiện hành phát sinh trong năm lớn hơn khoản được ghi giảm chi phí thuế thu nhập doanh nghiệp hiện hành trong năm vào bên Nợ Tài khoản 911 – “Xác định kết quả kinh doanh”;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Kết chuyển số chênh lệch giữa số phát sinh bên Nợ TK 8212 lớn hơn số phát sinh bên Có TK 8212 – “Chi phí thuế thu nhập doanh nghiệp hoãn lại” phát sinh trong năm vào bên Nợ Tài khoản 911 – “Xác định kết quả kinh doanh”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTài khoản 821 – “Chi phí thuế thu nhập doanh nghiệp” không có số dư cuối năm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTài khoản 821 – “Chi phí thuế thu nhập doanh nghiệp” có 2 Tài khoản cấp 2:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tài khoản 8211 – Chi phí thuế thu nhập doanh nghiệp hiện hành;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tài khoản 8212 – Chi phí thuế thu nhập doanh nghiệp hoãn lại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eA - TÀI KHOẢN 8211 - CHI PHÍ THUẾ THU NHẬP DOANH NGHIỆP HIỆN HÀNH\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTài khoản này dùng để phản ánh chi phí thuế thu nhập doanh nghiệp hiện hành của doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eHẠCH TOÁN TÀI KHOẢN NÀY CẦN TÔN TRỌNG MỘT SỐ QUY ĐỊNH SAU:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1 – Hàng quý, kế toán căn cứ vào tờ khai thuế thu nhập doanh nghiệp để ghi nhận số thuế thu nhập doanh nghiệp hiện hành tạm phải nộp vào chi phí thuế thu nhập hiện hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2 - Cuối năm tài chính, căn cứ vào tờ khai quyết toán thuế, nếu số thuế thu nhập doanh nghiệp hiện hành tạm phải nộp trong năm nhỏ hơn số phải nộp cho năm đó, kế toán ghi nhận số thuế thu nhập doanh nghiệp phải nộp thêm vào chi phí thuế thu nhập hiện hành. Trường hợp số thuế thu nhập tạm phải nộp trong năm lớn hơn số phải nộp của năm đó, kế toán phải ghi giảm chi phí thuế thu nhập doanh nghiệp hiện hành là số chênh lệch giữa số thuế thu nhập doanh nghiệp tạm phải nộp trong năm lớn hơn số phải nộp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3 – Trường hợp phát hiện sai sót không trọng yếu của các năm trước liên quan đến khoản thuế thu nhập doanh nghiệp phải nộp của các năm trước, doanh nghiệp được hạch toán tăng (hoặc giảm) số thuế thu nhập doanh nghiệp phải nộp của các năm trước vào chi phí thuế thu nhập hiện hành của năm phát hiện sai sót.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4 - Kết thúc năm, kế toán kết chuyển giữa chi phí thuế thu nhập doanh nghiệp hiện hành phát sinh trong năm vào Tài khoản 911 – “Xác định kết quả kinh doanh” để xác định kết quả hoạt động sản xuất, kinh doanh trong năm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eKẾT CẤU VÀ NỘI DUNG PHẢN ÁNH CỦA TÀI KHOẢN 8211 – CHI PHÍ THUẾ THU NHẬP DOANH NGHIỆP HIỆN HÀNH\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBên Nợ:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Thuế thu nhập doanh nghiệp phải nộp tính vào chi phí thuế thu nhập doanh nghiệp hiện hành phát sinh trong năm;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Thuế thu nhập doanh nghiệp của các năm trước phải nộp bổ sung do phát hiện sai sót không trọng yếu của các năm trước được ghi tăng chi phí thuế thu nhập doanh nghiệp hiện hành của năm hiện tại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBên Có:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Số thuế thu nhập doanh nghiệp thực tế phải nộp trong năm nhỏ hơn số thuế thu nhập tạm phải nộp được giảm trừ vào chi phí thuế thu nhập doanh nghiệp hiện hành đã ghi nhận trong năm;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Số thuế thu nhập doanh nghiệp phải nộp được ghi giảm do phát hiện sai sót không trọng yếu của các năm trước được ghi giảm chi phí thuế thu nhập doanh nghiệp hiện hành trong năm hiện tại;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Kết chuyển chi phí thuế thu nhập doanh nghiệp hiện hành vào bên Nợ Tài khoản 911 – “Xác định kết quả kinh doanh”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTài khoản 8211 – “Chi phí thuế thu nhập doanh nghiệp hiện hành” không có số dư cuối kỳ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eB - TÀI KHOẢN 8212 - CHI PHÍ THUẾ THU NHẬP DOANH NGHIỆP HOÃN LẠI\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTài khoản này dùng để phản ánh chi phí thuế thu nhập doanh nghiệp hoãn lại phát sinh trong năm của doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eHẠCH TOÁN TÀI KHOẢN NÀY CẦN TÔN TRỌNG MỘT SỐ QUY ĐỊNH SAU:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1 - Cuối năm tài chính, kế toán phải xác định số thuế thu nhập hoãn lại phải trả để ghi nhận vào chi phí thuế thu nhập doanh nghiệp hoãn lại. Đồng thời phải xác định tài sản thuế thu nhập hoãn lại để ghi nhận vào thu nhập thuế thu nhập doanh nghiệp (Ghi giảm chi phí thuế thu nhập doanh nghiệp hoãn lại).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2 - Kế toán không được phản ánh vào Tài khoản này tài sản thuế thu nhập hoãn lại hoặc thuế thu nhập hoãn lại phải trả phát sinh từ các giao dịch được ghi nhận trực tiếp vào vốn chủ sở hữu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3 - Cuối năm tài chính, kế toán phải kết chuyển số chênh lệch giữa số phát sinh bên Nợ và số phát sinh bên Có TK 8212 “Chi phí thuế thu nhập doanh nghiệp hoãn lại” vào Tài khoản 911 “Xác định kết quả kinh doanh”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eKẾT CẤU VÀ NỘI DUNG PHẢN ÁNH CỦA TÀI KHOẢN 8212 – CHI PHÍ THUẾ THU NHẬP DOANH NGHIỆP HOÃN LẠI\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBên Nợ:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Chi phí thuế thu nhập doanh nghiệp hoãn lại phát sinh trong năm từ việc ghi nhận thuế thu nhập hoãn lại phải trả (là số chênh lệch giữa thuế thu nhập hoãn lại phải trả phát sinh trong năm lớn hơn thuế thu nhập hoãn lại phải trả được hoàn nhập trong năm);\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Chi phí thuế thu nhập doanh nghiệp hoãn lại được ghi nhận từ số chênh lệch giữa tài sản thuế thu nhập hoãn lại được hoàn nhập trong năm lớn hơn tài sản thuế thu nhập hoãn lại phát sinh trong năm;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u0

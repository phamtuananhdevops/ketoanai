nhập) liên quan đến TSCĐ C là 4.000.000đ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Khoản chênh lệch tạm thời chịu thuế phát sinh giảm (hoàn nhập) liên quan đến TSCĐ E là 2.500.000đ.\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eKết quả, năm 2009, chênh lệch tạm thời chịu thuế liên quan tới TSCĐ C và TSCĐ E giảm (hoàn nhập) 6.500.000đ Công ty Thăng Long phải hoàn nhập thuế thu nhập hoãn lại phải trả và ghi giảm chi phí thuế TNDN hoãn lại là 1.820.000đ (6.500.000 x 28%). Kế toán ghi\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 347 – Thuế thu nhập hoãn lại phải trả : 1.820.000 đ\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 8212 – Chi phí thuế TNDN hoãn lại : 1.820.000 đ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Năm 2010 và 2011, Công ty Thăng Long\u0026nbsp; xác định:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eKhoản chênh lệch tạm thời chịu thuế phát sinh giảm (hoàn nhập) liên quan đến TSCĐ C trong mỗi năm là 4.000.000 đ, tương ứng, công ty Thăng Long phải hoàn nhập thuế thu nhập hoãn lại phải trả và ghi giảm chi phí thuế TNDN hoãn lại là 1.120.000 đ (4.000.000 x 28%). Kế toán ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 347 – Thuế thu nhập hoãn lại phải trả :\u0026nbsp; 1.120.000\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 8212 – Chi phí thuế TNDN hoãn lại : 1.120.000\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06ba8d10-5d97-11f1-8738-8dfe5abed424\" class=\"prov-part\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eII - HƯỚNG DẪN KẾ TOÁN CHUẨN MỰC\u0026nbsp;\u0026nbsp;\u0026nbsp; “CÁC SỰ KIỆN PHÁT SINH SAU NGÀY KẾT THÚC KỲ KẾ TOÁN\u003c/strong\u003e\u0026nbsp;\u003cstrong\u003eNĂM”\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06badb30-5d97-11f1-bc55-1765933aa915\" class=\"prov-section\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1. Quy định chung\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06bb0240-5d97-11f1-8c90-758a78fa2a4a\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.1. Các sự kiện phát sinh sau ngày kết thúc kỳ kế toán năm là những sự kiện có ảnh hưởng tích cực hoặc tiêu cực đến báo cáo tài chính đã xảy ra trong khoảng thời gian từ ngày kết thúc kỳ kế toán năm đến trước ngày phát hành báo cáo tài chính, gồm hai loại:\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06bb2950-5d97-11f1-8afc-a72a4010ab48\" class=\"prov-item\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(a) Các sự kiện phát sinh sau ngày kết thúc kỳ kế toán năm cần điều chỉnh là những sự kiện có các bằng chứng bổ sung về các sự kiện tồn tại vào ngày kết thúc kỳ kế toán năm cần phải điều chỉnh sổ kế toán và báo cáo tài chính;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06bb7770-5d97-11f1-ab25-47f207887f08\" class=\"prov-item\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(b) Các sự kiện phát sinh sau ngày kết thúc kỳ kế toán năm không cần điều chỉnh là những sự kiện có dấu hiệu về các sự kiện phát sinh sau ngày kết thúc kỳ kế toán năm cung cấp bằng chứng về các sự việc đã tồn tại trong năm tài chính không ảnh hưởng đến báo cáo tài chính nên không cần phải điều chỉnh sổ kế toán và báo cáo tài chính.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06bbc590-5d97-11f1-89a3-c710f1acdd96\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.2. Doanh nghiệp phải điều chỉnh các số liệu đã được ghi nhận trong báo cáo tài chính để phản ánh các sự kiện phát sinh sau ngày kết thúc kỳ kế toán năm cần điều chỉnh. Trường hợp này, doanh nghiệp phải:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06bbc590-5d97-11f1-89a3-c710f1acdd96\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Điều chỉnh các số liệu đã ghi nhận trong sổ kế toán và các thông tin đã trình bày trong báo cáo tài chính; hoặc\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06bbc590-5d97-11f1-89a3-c710f1acdd96\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Ghi nhận những khoản mục mà trước đó chưa được ghi nhận.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06bbeca0-5d97-11f1-bd15-29f79f51c2e1\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.3. Các sự kiện phát sinh sau ngày kết thúc kỳ kế toán năm cần điều chỉnh sổ kế toán và báo cáo tài chính phải là các sự kiện cung cấp bằng chứng về các sự việc đã tồn tại trong năm tài chính và phải xác định được (định lượng được).\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06bc3ac0-5d97-11f1-a406-777373ea83c5\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.4. Việc điều chỉnh sổ kế toán và báo cáo tài chính về những sự kiện phát sinh sau ngày kết thúc kỳ kế toán năm, được thực hiện theo một trong ba phương pháp điều chỉnh sổ kế toán quy định trong Luật Kế toán như: Phương pháp cải chính, phương pháp ghi số âm hoặc phương pháp ghi bổ sung.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06bc61d0-5d97-11f1-b58b-779d80cbaacd\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.5. Đối với các sự kiện phát sinh sau ngày kết thúc kỳ kế toán năm không cần điều chỉnh, doanh nghiệp có thể\u0026nbsp; trình bày trong Bản thuyết minh báo cáo tài chính.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06bc88e0-5d97-11f1-8bf4-65fd9be02360\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.6. Các sự kiện phát sinh sau ngày phát hành báo cáo tài chính không thuộc phạm vi áp dụng và hướng dẫn của Chuẩn mực kế toán số 23 “Các sự kiện phát sinh sau ngày kết thúc kỳ kế toán năm” và hướng dẫn tại Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06bcd700-5d97-11f1-95b2-35745a49b1e8\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.7. Đối với các khoản cổ tức của cổ đông công bố sau ngày kết thúc kỳ kế toán năm nhưng trước ngày phát hành báo cáo tài chính, doanh nghiệp không phải ghi nhận là các khoản nợ phải trả trên Bảng cân đối kế toán tại ngày kết thúc kỳ kế toán năm, mà được trình bày trong Bản thuyết minh báo cáo tài chính theo quy định của Chuẩn mực kế toán số 21 “Trình bày báo cáo tài chính”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06bd2520-5d97-11f1-90c5-d56e616974e9\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.8. Trường hợp sau ngày kết thúc kỳ kế toán năm, Ban Giám đốc xác nhận có dự kiến thu hẹp đáng kể quy mô hoạt động, ngừng sản xuất, kinh doanh, phá sản hoặc giải thể thì doanh nghiệp không được lập báo cáo tài chính trên cơ sở nguyên tắc hoạt động liên tục. Trường hợp này báo cáo tài chính phải được lập trên cơ sở hoạt động không liên tục.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06bd2520-5d97-11f1-90c5-d56e616974e9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eKhi nhận thấy sau ngày kết thúc kỳ kế toán năm, kết quả kinh doanh bị giảm sút đáng kể và tình hình tài chính xấu đi nghiêm trọng thì doanh nghiệp phải xem xét nguyên tắc hoạt động liên tục có còn phù hợp để lập báo cáo tài chính hay không. Nếu nguyên tắc hoạt động liên tục không còn phù hợp để lập báo cáo tài chính khi có dự kiến theo một trong các tình trạng trên thì doanh nghiệp phải thay đổi căn bản cơ sở kế toán và lập báo cáo tài chính chứ không chỉ điều chỉnh lại số liệu đã ghi nhận theo cơ sở kế toán ban đầu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06bd4c30-5d97-11f1-abe2-155f02c2c055\" class=\"prov-section\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Quy định cụ thể\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06bd7340-5d97-11f1-a58f-81f1743eb68a\" class=\"prov-clause\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.1. Hướng dẫn kế toán các sự kiện phát sinh sau ngày kết thúc kỳ kế toán năm cần điều chỉnh\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.1.1. Trường hợp sau ngày kết thúc kỳ kế toán năm đến ngày phát hành báo cáo tài chính, doanh nghiệp nhận được thông tin về các sự kiện xác nhận nghĩa vụ hiện tại vào ngày kết thúc kỳ kế toán năm đòi hỏi phải điều chỉnh khoản dự phòng đã được ghi nhận từ trước, ghi nhận những khoản dự phòng mới hoặc ghi nhận những khoản nợ phải thu, nợ phải trả mới.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ: Kết luận của toà án sau ngày kết thúc kỳ kế toán năm xác nhận doanh nghiệp sản xuất ô tô Hoà Bình có nghĩa vụ hiện tại vào ngày kết thúc kỳ kế toán năm dự kiến sẽ phải thanh toán chi phí bảo hành sản phẩm cao hơn số dự phòng chi phí bảo hành đã lập. Trường hợp này doanh nghiệp Hoà Bình phải điều chỉnh tăng dự phòng chi phí bảo hành đã lập để đảm bảo đủ nguồn thực hiện nghĩa vụ chi trả về bảo hành sản phẩm cho khách hàng. Căn cứ vào số dự phòng chi phí bảo hành sản phẩm phải lập và số dự phòng đã lập, kế toán điều chỉnh sổ kế toán khoản dự phòng chi phí bảo hành sản phẩm cho khách hàng như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea. Căn cứ vào khoản dự phòng bảo hành sản phẩm cần phải lập thêm, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 641 – Chi phí bán hàng (Số dự phòng cần phải lập thêm)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e Có TK 352 – Dự phòng phải trả.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb. Kết chuyển tăng chi phí bán hàng để xác định kết quả, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 911 – Xác định kết quả kinh doanh\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 641 – Chi phí bán hàng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec. Điều chỉnh giảm Thuế TNDN phải nộp (nếu có) và điều chỉnh giảm chi phí thuế TNDN hiện hành, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 3334 - Thuế thu nhập doanh nghiệp\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e Có TK 8211 – Chi phí thuế thu nhập doanh nghiệp hiện hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eĐồng thời kết chuyển giảm chi phí thuế TNDN hiện hành (Nếu đã thực hiện bút toán kết chuyển cuối kỳ), ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 8211 – Chi phí thuế thu nhập doanh nghiệp hiện hành\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 911 – Xác định kết quả kinh doanh.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ed. Điều chỉnh giảm lợi nhuận chưa phân phối (Nếu đã thực hiện bút toán kết chuyển cuối kỳ), ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 421 – Lợi nhuận chưa phân phối (4212 - Lợi nhuận chưa phân phối năm nay)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e Có TK 911 – Xác định kết quả kinh doanh.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;* Doanh nghiệp có thể lập các bút toán điều chỉnh theo phương pháp ghi số âm (ghi đỏ) bằng số chênh lệch giữa số đã ghi lớn hơn số đúng, như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNgoài bút toán điều chỉnh sổ kế toán như điểm a, b ở trên, kế toán còn điều chỉnh sổ kế toán bằng các bút toán:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Điều chỉnh giảm (ghi số âm) số thuế TNDN phải nộp và điều chỉnh giảm (ghi số âm) chi phí thuế TNDN hiện hành, được xác định bằng số chênh lệch giữa số thuế TNDN phải nộp đã ghi lớn hơn số thuế TNDN phải nộp sau khi đã điều chỉnh. Số chênh lệch điều chỉnh giảm (ghi số âm) số thuế TNDN phải nộp, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 8211 – Chi phí thuế thu nhập doanh nghiệp hiện hành\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 3334- Thuế thu nhập doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eĐồng thời điều chỉnh bút toán kết chuyển giảm (ghi số âm) chi phí thuế TNDN hiện hành (nếu đã thực hiện bút toán kết chuyển cuối kỳ), ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 911 – Xác định kết quả kinh doanh\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 8211 – Chi phí thuế thu nhập doanh nghiệp hiện hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Điều chỉnh bút toán kết chuyển lãi giảm (ghi số âm) (nếu đã thực hiện bút toán kết chuyển lãi cuối kỳ) được xác định bằng số chênh lệch giữa số lãi đã kết chuyển lớn hơn số lãi sau khi đã điều chỉnh. Số chênh lệch điều chỉnh bút toán kết chuyển lãi giảm (ghi số âm), ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 911 – Xác định kết quả kinh doanh\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bd9a50-5d97-11f1-96ed-9156cc336dfc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 421 – Lợi nhuận chưa phân phối.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.1.2. Trường hợp sau ngày kết thúc kỳ kế toán năm đến ngày phát hành báo cáo tài chính, doanh nghiệp nhận được thông tin cung cấp bằng chứng về một tài sản bị tổn thất trong kỳ kế toán năm, hoặc giá trị của khoản tổn thất được ghi nhận từ trước đối với tài sản này cần phải điều chỉnh thì xử lý như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ: Trường hợp sau ngày kết thúc kỳ kế toán năm đến ngày phát hành báo cáo tài chính, doanh nghiệp bán hàng tồn kho và có bằng chứng về giá trị thuần có thể thực hiện được vào ngày kết thúc kỳ kế toán năm của hàng tồn kho bị giảm giá thì doanh nghiệp phải căn cứ vào giá bán hàng tồn kho để tính toán số dự phòng giảm giá hàng tồn kho phải lập cho lượng hàng tồn kho này. Căn cứ vào số dự phòng phải lập và số dự phòng đã lập, kế toán phải điều chỉnh trên sổ kế toán khoản dự phòng giảm giá hàng tồn kho như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea. Trường hợp số dự phòng giảm giá hàng tồn kho phải lập lớn hơn số dự phòng đã lập:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCăn cứ chênh lệch giữa số dự phòng phải lập lớn hơn số dự phòng đã lập, kế toán điều chỉnh sổ kế toán có thể theo một trong hai cách sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(1) Ghi tăng số dự phòng giảm giá hàng tồn kho và ghi tăng giá vốn hàng bán:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 632 – Giá vốn hàng bán (Chênh lệch số dự phòng phải lập lớn hơn \u003c/span\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003esố dự phòng đã lập)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 159 - Dự phòng giảm giá hàng tồn kho.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(2) Kết chuyển tăng giá vốn hàng bán để xác định kết quả, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 911 – Xác định kết quả kinh doanh\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 632 – Giá vốn hàng bán.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(3) Điều chỉnh giảm Thuế TNDN phải nộp (nếu có), ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 3334 - Thuế thu nhập doanh nghiệp\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e Có TK 8211 – Chi phí thuế TNDN hiện hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eĐồng thời kết chuyển giảm chi phí thuế TNDN hiện hành sang TK 911 (nếu đã thực hiện bút toán kết chuyển cuối kỳ), ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 8211 – Chi phí thuế TNDN hiện hành\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 911 – Xác định kết quả kinh doanh.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(4) Điều chỉnh giảm lợi nhuận chưa phân phối (nếu đã thực hiện bút toán kết chuyển cuối kỳ), ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 421 – Lợi nhuận chưa phân phối (Tk 4212 - Lợi nhuận chưa phân phối năm nay)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e Có TK 911 – Xác định kết quả kinh doanh.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;* Doanh nghiệp có thể lập các bút toán điều chỉnh theo phương pháp ghi số âm (ghi đỏ) bằng số chênh lệch giữa số đã ghi lớn hơn số đúng, như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNgoài bút toán điều chỉnh sổ kế toán như điểm (1), (2) ở trên, kế toán còn điều chỉnh sổ kế toán như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Điều chỉnh giảm (ghi số âm) số thuế TNDN phải nộp và điều chỉnh giảm (ghi số âm) chi phí thuế TNDN hiện hành (nếu có), được xác định bằng số chênh lệch giữa số thuế TNDN phải nộp đã ghi lớn hơn số thuế TNDN phải nộp sau khi đã điều chỉnh. Số chênh lệch điều chỉnh giảm (ghi số âm) số thuế TNDN phải nộp, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 8211 – Chi phí thuế thu nhập doanh nghiệp hiện hành\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 3334- Thuế thu nhập doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eĐồng thời điều chỉnh bút toán kết chuyển giảm (ghi số âm) chi phí thuế TNDN hiện hành (nếu đã thực hiện bút toán kết chuyển cuối kỳ), ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 911 – Xác định kết quả kinh doanh\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 8211 – Chi phí thuế thu nhập doanh nghiệp hiện hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Điều chỉnh bút toán kết chuyển lãi giảm (ghi số âm) (nếu đã thực hiện bút toán kết chuyển lãi cuối kỳ) được xác định bằng số chênh lệch giữa số lãi đã kết chuyển lớn hơn số lãi sau khi đã điều chỉnh. Số chênh lệch điều chỉnh bút toán kết chuyển lãi giảm (ghi số âm), ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 911 – Xác định kết quả kinh doanh\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 421 – Lợi nhuận chưa phân phối.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb. Trường hợp số dự phòng giảm giá hàng tồn kho phải lập nhỏ hơn số dự phòng đã lập:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCăn cứ chênh lệch giữa số dự phòng phải lập nhỏ hơn số dự phòng đã lập, kế toán điều chỉnh sổ kế toán có thể theo cách sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(1) Ghi giảm dự phòng giảm giá hàng tồn kho và ghi giảm giá vốn hàng bán\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 159 - Dự phòng giảm giá hàng tồn kho\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 632 – Giá vốn hàng bán (Chênh lệch số dự phòng phải lập\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;nhỏ hơn số dự phòng đã lập).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(2) Kết chuyển giảm giá vốn hàng bán để xác định kết quả, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 632 – Giá vốn hàng bán\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 911 – Xác định kết quả kinh doanh.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(3) Điều chỉnh tăng thuế TNDN phải nộp (nếu có), ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 8211 – Chi phí thuế thu nhập doanh nghiệp hiện hành\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 3334 - Thuế thu nhập doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eĐồng thời kết chuyển tăng chi phí thu nhập doanh nghiệp hiện hành sang TK 911 (Nếu đã thực hiện bút toán kết chuyển cuối kỳ), ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 911 – Xác định kết quả kinh doanh\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 8211 – Chi phí thuế thu nhập doanh nghiệp hiện hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(4) Điều chỉnh tăng lợi nhuận chưa phân phối (Nếu đã thực hiện bút toán kết chuyển cuối kỳ), ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 911 – Xác định kết quả kinh doanh (TK 4212 - Lợi nhuận chưa phân phối năm nay)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e Có TK 421 – Lợi nhuận chưa phân phối.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e* Doanh nghiệp có thể lập các bút toán điều chỉnh theo phương pháp ghi số âm (ghi đỏ) số chênh lệch giữa số dự phòng giảm giá hàng tồn kho phải lập nhỏ hơn số dự phòng đã lập như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(1) Ghi giảm (ghi đỏ) dự phòng giảm giá hàng tồn kho và ghi giảm giá vốn hàng bán số chênh lệch giữa số dự phòng giảm giá hàng tồn kho phải lập nhỏ hơn số dự phòng đã lập:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 632 – Giá vốn hàng bán\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 159 - Dự phòng giảm giá hàng tồn kho.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(2) Kết chuyển giảm (ghi đỏ) giá vốn hàng bán về số chênh lệch giữa số dự phòng giảm giá hàng tồn kho phải lập nhỏ hơn số dự phòng đã lập, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 911 – Xác định kết quả kinh doanh\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 632 – Giá vốn hàng bán.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bde870-5d97-11f1-89f2-55cd32b3e156\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(3) Điều chỉnh tăng thuế thu nhập doanh nghiệp phải nộp (nếu có) và điều chỉnh tăng lợi nhuận chưa phân phối trên sổ kế toán như điểm (3) (4) ở trên.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06be5da0-5d97-11f1-be52-ff455aa0b5e1\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.1.3. Các trường hợp khác về xác nhận nghĩa vụ hoặc ảnh hưởng đến giá trị tài sản thì doanh nghiệp căn cứ vào các hướng dẫn trên để ghi nhận các bút toán điều chỉnh phù hợp với quy định của Chuẩn mực kế toán số 23 “Các sự kiện phát sinh sau ngày kết thúc kỳ kế toán năm”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06beabc0-5d97-11f1-a813-51da25650b11\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.1.4. Trường hợp sau ngày kết thúc kỳ kế toán năm đến trước ngày phát hành báo cáo tài chính, doanh nghiệp phát hiện những gian lận và sai sót chỉ ra rằng báo cáo tài chính không được chính xác thì tuỳ theo từng trường hợp cụ thể (có kết luận xử lý hoặc chưa), đơn vị lập chứng từ kế toán và thực hiện các bút toán điều chỉnh trên sổ kế toán và báo cáo tài chính phù hợp với quy định của Chuẩn mực kế toán số 23 “Các sự kiện phát sinh sau ngày kết thúc kỳ kế toán năm” và Thông tư hướng dẫn chuẩn mực này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06bed2d0-5d97-11f1-860e-d19c970757be\" class=\"prov-clause\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.2. Trình bày báo cáo tài chính\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06bf20f0-5d97-11f1-9ed6-3bd35e4ef591\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.2.1. Trình bày về sự kiện tồn tại trong kỳ kế toán năm\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bf20f0-5d97-11f1-9ed6-3bd35e4ef591\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNếu doanh nghiệp nhận được thông tin sau ngày kết thúc kỳ kế toán năm về các sự kiện tồn tại trong kỳ kế toán năm, doanh nghiệp phải trình bày về các sự kiện này trên cơ sở xem xét những thông tin mới. Trong một số trường hợp, doanh nghiệp phải trình bày trong báo cáo tài chính để phản ánh thông tin nhận được sau ngày kết thúc kỳ kế toán năm, ngay cả khi thông tin này không ảnh hưởng đến các số liệu đã trình bày trong báo cáo tài chính. Ví dụ: Sau ngày kết thúc kỳ kế toán năm có bằng chứng về việc sẽ xảy ra một khoản nợ tiềm tàng đã tồn tại trong kỳ kế toán năm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06bf4800-5d97-11f1-86b2-f5d568344efd\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.2.2. Trình\u0026nbsp; bày các sự kiện phát sinh sau ngày kết thúc kỳ kế toán năm không cần điều chỉnh\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bf4800-5d97-11f1-86b2-f5d568344efd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNếu các sự kiện không cần điều chỉnh phát sinh sau ngày kết thúc kỳ kế toán năm là trọng yếu, việc không trình bày các sự kiện này có thể ảnh hưởng đến quyết định kinh tế của người sử dụng khi dựa trên các thông tin của báo cáo tài chính. Vì vậy doanh nghiệp phải trình bày đối với các sự kiện trọng yếu không cần điều chỉnh về: Nội dung và số liệu của sự kiện; ước tính ảnh hưởng về tài chính, hoặc lý do không thể ước tính được các ảnh hưởng này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bf4800-5d97-11f1-86b2-f5d568344efd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCác sự kiện phát sinh sau ngày kết thúc kỳ kế toán năm không cần điều chỉnh cần phải trình bày trên báo cáo tài chính, như:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bf4800-5d97-11f1-86b2-f5d568344efd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Việc hợp nhất kinh doanh theo quy định của Chuẩn mực kế toán \"Hợp nhất kinh doanh\" hoặc việc thanh lý công ty con của tập đoàn;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bf4800-5d97-11f1-86b2-f5d568344efd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Việc công bố kế hoạch ngừng hoạt động, việc thanh lý tài sản hoặc thanh toán các khoản nợ liên quan đến ngừng hoạt động; hoặc việc tham gia vào một hợp đồng ràng buộc để bán tài sản hoặc thanh toán các khoản nợ;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bf4800-5d97-11f1-86b2-f5d568344efd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Hàng bán bị trả lại;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bf4800-5d97-11f1-86b2-f5d568344efd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Mua sắm hoặc thanh lý tài sản có giá trị lớn;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bf4800-5d97-11f1-86b2-f5d568344efd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Nhà xưởng sản xuất bị phá hủy vì hỏa hoạn, bão lụt;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bf4800-5d97-11f1-86b2-f5d568344efd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Thực hiện tái cơ cấu chủ yếu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bf4800-5d97-11f1-86b2-f5d568344efd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Các giao dịch chủ yếu và tiềm năng của cổ phiếu phổ thông;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bf4800-5d97-11f1-86b2-f5d568344efd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Thay đổi bất thường, quan trọng về giá bán tài sản hoặc tỷ giá hối đoái;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bf4800-5d97-11f1-86b2-f5d568344efd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Thay đổi về thuế có ảnh hưởng quan trọng đến tài sản, nợ thuế hiện hành hoặc thuế hoãn lại;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bf4800-5d97-11f1-86b2-f5d568344efd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tham gia những cam kết, thỏa thuận quan trọng hoặc những khoản nợ tiềm tàng;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bf4800-5d97-11f1-86b2-f5d568344efd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Xuất hiện những vụ kiện tụng lớn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06bf9620-5d97-11f1-b96b-01e0ae2b120a\" class=\"prov-part\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eIII - HƯỚNG DẪN KẾ TOÁN CHUẨN MỰC\u0026nbsp; “BÁO CÁO TÀI CHÍNH GIỮA NIÊN ĐỘ”\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06bfe440-5d97-11f1-af75-b7fec21b78cd\" class=\"prov-section\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e1/ Qui định chung\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bfe440-5d97-11f1-af75-b7fec21b78cd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ePhần này quy định và hướng dẫn các yêu cầu chung về kết cấu, nội dung và nguyên tắc lập và trình bày\u0026nbsp; báo cáo tài chính giữa niên độ liên quan đến nội dung quy định trong Chuẩn mực kế toán số 27 “Báo cáo tài chính giữa niên độ”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bfe440-5d97-11f1-af75-b7fec21b78cd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBáo cáo tài chính giữa niên độ gồm 2 loại: Báo cáo tài chính giữa niên độ đầy đủ và báo cáo tài chính giữa niên độ tóm lược. Doanh nghiệp lập báo cáo tài chính theo dạng đầy đủ thì áp dụng Chuẩn mực kế toán số 21 “Trình bày báo cáo tài chính”, và một số quy định tại Chuẩn mực kế toán số 27 “Báo cáo tài chính giữa niên độ”. Doanh nghiệp lập báo cáo tài chính theo dạng tóm lược thì áp dụng Chuẩn mực kế toán số 27 “Báo cáo tài chính giữa niên độ” và hướng dẫn tại phần này. Mẫu biểu và các chỉ tiêu trong báo cáo tài chính giữa niên độ thực hiện theo mẫu biểu và các chỉ tiêu trong chế độ báo cáo tài chính năm ban hành theo Chế độ kế toán doanh nghiệp hiện hành (Quyết định số 15/2006/QĐ-BTC ngày 20/3/2006 của Bộ Tài chính).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bfe440-5d97-11f1-af75-b7fec21b78cd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eDoanh nghiệp nhà nước phải lập báo cáo tài chính quý dạng đầy đủ khi nộp BCTC cho các cơ quan quản lý nhà nước. Các doanh nghiệp khác khi tự nguyện lập BCTC quý dạng đầy đủ hoặc dạng tóm lược thì thực hiện theo phần hướng dẫn có liên quan của Thông tư này.\u0026nbsp; Các doanh nghiệp niêm yết trên thị trường chứng khoán khi lập báo cáo tài chính giữa niên độ thực hiện theo phần hướng dẫn có liên quan của Thông tư này và các quy định khác theo pháp luật về thị trường chứng khoán; Công ty mẹ niêm yết trên thị trường chứng khoán thì lập BCTC quý của công ty mẹ và báo cáo tài chính tổng hợp quý của công ty mẹ và các công ty con. Từ báo cáo tài chính năm 2008 công ty mẹ phải lập BCTC quý hợp nhất.\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bfe440-5d97-11f1-af75-b7fec21b78cd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;Hệ thống báo cáo tài chính giữa niên độ bao gồm:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bfe440-5d97-11f1-af75-b7fec21b78cd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Bảng cân đối kế toán (đầy đủ, tóm lược);\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bfe440-5d97-11f1-af75-b7fec21b78cd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Báo cáo kết quả hoạt động kinh doanh (đầy đủ, tóm lược);\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bfe440-5d97-11f1-af75-b7fec21b78cd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Báo cáo lưu chuyển tiền tệ (đầy đủ, tóm lược);\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bfe440-5d97-11f1-af75-b7fec21b78cd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Bản Thuyết minh báo cáo tài chính chọn lọc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bfe440-5d97-11f1-af75-b7fec21b78cd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;Kỳ lập báo cáo tài chính giữa niên độ là hàng quý của năm tài chính (không bao gồm quý IV).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bfe440-5d97-11f1-af75-b7fec21b78cd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;Báo cáo tài chính giữa niên độ phải lập đúng hình thức, nội dung, phương pháp và trình bày phải nhất quán giữa các kỳ kế toán, nếu có nội dung khác thì phải giải thích ở Bản thuyết minh báo cáo tài chính. Các nội dung trình bày trên mỗi báo cáo tài chính giữa niên độ tối thiểu phải bao gồm các đề mục và số cộng chi tiết được trình bày trong mỗi báo cáo tài chính năm gần nhất tương ứng, và Bản thuyết minh báo cáo tài chính chọn lọc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bfe440-5d97-11f1-af75-b7fec21b78cd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;Việc lập và trình bày báo cáo tài chính giữa niên độ cũng phải tuân thủ các yêu cầu và nguyên tắc quy định trong Chuẩn mực kế toán số 21 “Trình bày báo cáo tài chính”.\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bfe440-5d97-11f1-af75-b7fec21b78cd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eKhi điều chỉnh báo cáo tài chính giữa niên độ doanh nghiệp phải áp dụng chính sách kế toán nhất quán cho một loại giao dịch cụ thể. Trường hợp doanh nghiệp tự nguyện thay đổi chính sách kế toán vào giữa năm tài chính thì doanh nghiệp phải áp dụng phương pháp hồi tố, tức là phải điều chỉnh lại báo cáo tài chính các quý trước.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06bfe440-5d97-11f1-af75-b7fec21b78cd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eDoanh nghiệp lập báo cáo tài chính giữa niên độ cũng phải thực hiện công khai báo cáo tài chính theo quy định của pháp luật.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"4274c910-8cc2-11f1-9025-a1d96c82c606\" class=\"prov-section\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e2. Hướng dẫn lập và trình bày Báo cáo tài chính giữa niên độ\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06c03260-5d97-11f1-978b-591d09c120f7\" class=\"prov-clause\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.1. Lập và trình bày Bảng cân đối kế toán giữa niên độ\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06c05970-5d97-11f1-bf42-81aa0fc7ef77\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.1.1- Nguyên tắc lập và trình bày Bảng cân đối kế toán giữa niên độ\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c05970-5d97-11f1-bf42-81aa0fc7ef77\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eViệc lập và trình bày Bảng cân đối kế toán giữa niên độ phải tuân thủ các quy định chung về lập và trình bày báo cáo tài chính, cũng như các nguyên tắc riêng đối với Bảng cân đối kế toán năm, được quy định trong hệ thống báo cáo tài chính doanh nghiệp hiện hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c05970-5d97-11f1-bf42-81aa0fc7ef77\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;Ngoài ra khi lập báo cáo này, doanh nghiệp phải tuân thủ các quy định sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c05970-5d97-11f1-bf42-81aa0fc7ef77\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Áp dụng các chính sách kế toán về ghi nhận và đánh giá tài sản, nợ phải trả tương tự như đối với Bảng cân đối kế toán năm;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c05970-5d97-11f1-bf42-81aa0fc7ef77\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Nội dung tối thiểu cần trình bày trong Bảng cân đối kế toán giữa niên độ (dạng tóm lược) gồm các khoản mục tổng hợp, mà mỗi khoản mục này là tổng của các khoản mục chi tiết của Bảng cân đối kế toán năm gần nhất và các số liệu về các sự kiện, các hoạt động mới phát sinh từ cuối niên độ kế toán năm trước gần nhất đến cuối quý báo cáo này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c05970-5d97-11f1-bf42-81aa0fc7ef77\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Phải trình bày số liệu từ đầu niên độ đến hết ngày kết thúc mỗi quý báo cáo và số liệu so sánh từng chỉ tiêu tương ứng được lập vào cuối kỳ kế toán năm trước gần nhất “Số đầu năm”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06c0a790-5d97-11f1-8d71-71b3d0578cf0\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.1.2- Kết cấu và nội dung\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0a790-5d97-11f1-8d71-71b3d0578cf0\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(1). Bảng cân đối kế toán giữa niên độ (dạng đầy đủ)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0a790-5d97-11f1-8d71-71b3d0578cf0\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eĐối với doanh nghiệp lập và trình bày Bảng cân đối kế toán giữa niên độ dạng đầy đủ, thì hình thức và nội dung của báo cáo này phải phù hợp với quy định tại chế độ báo cáo tài chính hiện hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0a790-5d97-11f1-8d71-71b3d0578cf0\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu phải trình bày trong báo cáo này gồm số liệu vào ngày kết thúc kỳ kế toán giữa niên độ hiện tại và số liệu mang tính so sánh vào ngày kết thúc kỳ kế toán năm trước.\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0a790-5d97-11f1-8d71-71b3d0578cf0\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCăn cứ vào các quy định nêu trên, Bảng cân đối kế toán giữa niên độ dạng đầy đủ gồm tất cả các khoản mục được sắp xếp theo kết cấu qui định tại Mẫu số B 01-DN (Bảng cân đối kế toán) tại Chế độ kế toán doanh nghiệp ban hành theo Quyết định số 15/2006/QĐ-BTC ngày 20/03/2006 của Bộ Tài chính, nhưng cột số 4 “Số cuối năm” của mẫu này được thay thế bằng cột “Số cuối quý”, và có ký hiệu là Mẫu số B 01a-DN.\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0a790-5d97-11f1-8d71-71b3d0578cf0\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(2). Bảng cân đối kế toán giữa niên độ (dạng tóm lược)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0a790-5d97-11f1-8d71-71b3d0578cf0\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;Căn cứ vào các nguyên tắc trình bày nêu trên, Bảng cân đối kế toán tóm lược hàng quý gồm tối thiểu các khoản mục chủ yếu được sắp xếp theo kết cấu qui định tại Chế độ kế toán Doanh nghiệp (Mẫu số B 01b-DN) ban hành kèm theo Quyết định số 15/2006/QĐ-BTC ngày 20/3/2006 của Bộ Tài chính, gồm các chỉ tiêu chủ yếu sau đây:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0a790-5d97-11f1-8d71-71b3d0578cf0\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ePhần Tài sản:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0a790-5d97-11f1-8d71-71b3d0578cf0\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCác chỉ tiêu ở phần “Tài sản” phản ánh toàn bộ giá trị tài sản hiện có của doanh nghiệp tại ngày kết thúc kỳ kế toán quý theo cơ cấu tài sản và hình thức tồn tại trong quá trình hoạt động kinh doanh của doanh nghiệp, gồm:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0a790-5d97-11f1-8d71-71b3d0578cf0\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eA: Tài sản ngắn hạn;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0a790-5d97-11f1-8d71-71b3d0578cf0\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eB: Tài sản dài hạn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0a790-5d97-11f1-8d71-71b3d0578cf0\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ePhần Nguồn vốn:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0a790-5d97-11f1-8d71-71b3d0578cf0\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCác chỉ tiêu ở phần “Nguồn vốn” phản ánh nguồn hình thành tài sản hiện có của doanh nghiệp tại ngày kết thúc quý. Các chỉ tiêu nguồn vốn thể hiện trách nhiệm pháp lý của doanh nghiệp đối với tài sản đang quản lý và sử dụng ở doanh nghiệp. Nguồn vốn chia ra:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0a790-5d97-11f1-8d71-71b3d0578cf0\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eA: Nợ phải trả;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0a790-5d97-11f1-8d71-71b3d0578cf0\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eB: Vốn chủ sở hữu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0a790-5d97-11f1-8d71-71b3d0578cf0\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eMỗi phần của Bảng cân đối kế toán đều phản ánh theo 4 cột: Mã số, Thuyết minh, Số cuối quý, Số đầu năm.\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"627\" style=\"text-align: justify; border-collapse: collapse; width: 100%; border-spacing: 0px;\" id=\"06c0a790-5d97-11f1-8d71-71b3d0578cf0\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eĐơn vị báo cáo:………………....\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003cstrong\u003eMẫu số B 01b– DN\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eĐịa chỉ:………………………….\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003cem\u003e(Ban hành theo QĐ số 15/2006/QĐ-BTC Ngày 20/03/2006 của\u0026nbsp; Bộ trưởng BTC)\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\

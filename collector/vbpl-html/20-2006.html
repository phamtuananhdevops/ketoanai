rong\u003e(Ký, họ tên)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(Ký, họ tên, đóng dấu)\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cdiv style=\"text-align: justify;\"\u003e\n   \u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\n  \u003c/div\u003e\n  \u003cp id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.1.3.Nội dung và phương pháp lập các chỉ tiêu\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(1). Bảng cân đối kế toán giữa niên độ (dạng đầy đủ) (Mẫu số B-01a-DN)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- “Mã số” ghi ở cột 2 dùng để cộng khi lập báo cáo tài chính tổng hợp hoặc báo cáo tài chính hợp nhất.\u0026nbsp;\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Số hiệu ghi ở cột 3 “Thuyết minh” của báo cáo này dùng cho người đọc báo cáo tham chiếu số liệu chi tiết của chỉ tiêu này trong Bản Thuyết minh báo cáo tài chính chọn lọc.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;- Số liệu ghi vào cột 5 “Số đầu năm” của báo cáo này tại ngày kết thúc quý báo cáo được căn cứ vào số liệu của từng chỉ tiêu tương ứng được lập vào cuối kỳ kế toán năm trước.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Số liệu ghi vào cột 4 “Số cuối quý” của báo cáo này tại ngày kết thúc quý được thực hiện theo hướng dẫn như đối với Bảng cân đối kế toán năm (Mẫu số B01-DN).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(2). Bảng cân đối kế toán giữa niên độ (dạng tóm lược) (Mẫu số B01b-DN)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e“Mã số” ghi ở cột 2 và số hiệu ghi ở cột 3 “Thuyết minh” và cột 5 “Số đầu năm” của báo cáo này tại ngày kết thúc quý báo cáo, được thực hiện như đã hướng dẫn đối với Bảng cân đối kế toán quý dạng đầy đủ (Mẫu số B01a-DN).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu ghi vào cột 4 “Số cuối quý” của báo cáo này tại ngày kết thúc quý được căn cứ vào số liệu tại ngày kết thúc quý báo cáo, được hướng dẫn như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp; Phần: TÀI SẢN\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eA-TÀI SẢN NGẮN HẠN (Mã số 100)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChỉ tiêu tài sản ngắn hạn phản ánh tổng giá trị thuần các tài sản ngắn hạn hiện có của doanh nghiệp tại ngày kết thúc quý báo cáo, gồm: Tiền, các khoản tương đương tiền, giá trị thuần của các khoản đầu tư tài chính ngắn hạn, các khoản phải thu ngắn hạn, hàng tồn kho và tài sản ngắn hạn khác.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eMã số 100 = Mã số 110 + Mã số 120 + Mã số 130 + Mã số 140 + Mã số 150.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eI- Tiền và các khoản tương đương tiền (Mã số 110)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChỉ tiêu này phản ánh tổng hợp toàn bộ số tiền hiện có của doanh nghiệp tại ngày kết thúc quý báo cáo, gồm: tiền mặt, tiền gửi ngân hàng (không kỳ hạn), tiền đang chuyển và các khoản tương đương tiền.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu để ghi vào chỉ tiêu này là tổng số dư Nợ của các Tài khoản: TK 111 “Tiền mặt”, TK 112 “Tiền gửi ngân hàng” (chi tiết không kỳ hạn), TK 113 “Tiền đang chuyển”, và chi tiết TK 121 “Đầu tư chứng khoán ngắn hạn” (chi tiết kỳ phiếu ngân hàng, tín phiếu kho bạc...) có thời hạn thu hồi hoặc đáo hạn không quá 3 tháng kể từ ngày mua trên Sổ Cái hoặc Nhật ký - Sổ Cái tại ngày kết thúc quý báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eII- Các khoản đầu tư tài chính ngắn hạn (Mã số 120)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLà chỉ tiêu tổng hợp phản ánh tổng giá trị của các khoản đầu tư tài chính ngắn hạn (sau khi trừ đi dự phòng giảm giá chứng khoán đầu tư ngắn hạn) hiện có tại ngày kết thúc quý báo cáo, bao gồm: tiền gửi có kỳ hạn, đầu tư chứng khoán ngắn hạn, cho vay ngắn hạn và đầu tư ngắn hạn khác tại thời điểm báo cáo giữa niên độ. Các khoản đầu tư ngắn hạn được phản ánh trong mục này là các khoản đầu tư có thời hạn thu hồi vốn dưới 1 năm hoặc trong một chu kỳ kinh doanh, không bao gồm các khoản đầu tư ngắn hạn thoả mãn định nghĩa tương đương tiền tại ngày kết thúc quý báo cáo, đã được tính vào chỉ tiêu “Các khoản tương đương tiền”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu để ghi vào chỉ tiêu này là tổng số dư Nợ của các Tài khoản: TK 121 “Đầu tư chứng khoán ngắn hạn” (sau khi trừ đi các khoản đầu tư ngắn hạn đã được tính vào chỉ tiêu “Các khoản tương đương tiền”) và TK 128 “Đầu tư ngắn hạn khác” trên Sổ Cái hoặc Nhật ký - Sổ Cái tại ngày kết thúc quý báo cáo sau khi trừ đi số dư Có của TK 129 “Dự phòng giảm giá đầu tư ngắn hạn“.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eIII- Các khoản phải thu ngắn hạn (Mã số 130)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLà chỉ tiêu tổng hợp phản ánh toàn bộ giá trị của các khoản phải thu từ khách hàng (sau khi trừ đi dự phòng phải thu khó đòi), khoản trả trước cho người bán, phải thu nội bộ, phải thu theo tiến độ kế hoạch hợp đồng xây dựng, và các khoản phải thu khác tại ngày kết thúc quý báo cáo, có thời hạn thu hồi hoặc thanh toán dưới 1 năm hoặc trong một chu kỳ kinh doanh.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu để ghi vào chỉ tiêu này là tổng số dư Nợ tại ngày kết thúc quý báo cáo của các Tài khoản: TK 131 “Phải thu của khách hàng”, TK 331 “Phải trả cho người bán”, TK 1368 “Phải thu nội bộ khác”, TK 337 “Thanh toán theo tiến độ kế hoạch hợp đồng xây dựng”, và số dư Nợ chi tiết của các Tài khoản 138, 338, 141, 144 theo từng đối tượng phải thu trên sổ kế toán chi tiết, sau khi trừ chi tiết số dư Có của Tài khoản 139 “Dự phòng phải thu khó đòi” (Chi tiết dự phòng phải thu ngắn hạn của khách hàng khó đòi) tại ngày kết thúc quý báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eIV- Hàng tồn kho (Mã số 140)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLà chỉ tiêu tổng hợp phản ánh toàn bộ giá trị thuần hiện có các loại hàng tồn kho dự trữ cho quá trình sản xuất, kinh doanh của doanh nghiệp tại ngày kết thúc quý báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu để ghi vào chỉ tiêu “Hàng tồn kho” là tổng số dư Nợ của các Tài khoản: TK 151 “Hàng mua đang đi đường”, TK 152 “Nguyên liệu, vật liệu”, TK 153 “Công cụ, dụng cụ”, TK 154 “Chi phí sản xuất, kinh doanh dở dang”, TK 155 “Thành phẩm”, TK 156 “Hàng hóa”, TK 157 “Hàng gửi đi bán”, và TK 158 “Hàng hoá kho bảo thuế”, sau khi trừ số dư Có Tài khoản 159 “Dự phòng giảm giá hàng tồn kho” trên Sổ Cái hoặc Nhật ký - Sổ Cái tại ngày kết thúc quý báo cáo .\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eV- Tài sản ngắn hạn khác (Mã số 150)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLà chỉ tiêu tổng hợp phản ánh tổng các khoản chi phí trả trước ngắn hạn, thuế GTGT được khấu trừ, thuế và các khoản khác phải thu Nhà nước và tài sản ngắn hạn khác (số tiền tạm ứng cho người lao động thanh toán, các khoản cầm cố, ký quỹ, ký cược ngắn hạn, tài sản thiếu chờ xử lý) tại ngày kết thúc quý báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu để ghi vào chỉ tiêu này là tổng số dư Nợ của các Tài khoản: TK 133 “Thuế giá trị giá tăng được khấu trừ” và chi tiết số dư Nợ Tài khoản 333 “Thuế và các khoản phải nộp Nhà nước,” TK 1381 “Tài sản thiếu chờ xử lý”, TK 141“Tạm ứng”, TK 142 “Chi phí trả trước ngắn hạn”, và TK 144 “Cầm cố, ký quỹ, ký cược ngắn hạn” trên Sổ Cái hoặc Nhật ký - Sổ Cái tại ngày kết thúc quý báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eB- TÀI SẢN DÀI HẠN (Mã số 200)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;Chỉ tiêu tài sản dài hạn phản ánh tổng giá trị thuần của các loại tài sản không được phản ánh trong chỉ tiêu tài sản ngắn hạn tại ngày kết thúc quý báo cáo gồm giá trị thuần các khoản phải thu dài hạn, tài sản cố định, bất động sản đầu tư, các khoản đầu tư tài chính dài hạn và các tài sản dài hạn khác có đến ngày kết thúc quý báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eI- Các khoản phải thu dài hạn (Mã số 210)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;Là chỉ tiêu tổng hợp phản ánh toàn bộ giá trị thuần của các khoản phải thu dài hạn của khách hàng (sau khi trừ dự phòng phải thu dài hạn khó đòi), phải thu nội bộ dài hạn (số vốn kinh doanh ở đơn vị trực thuộc, các khoản phải thu nội bộ dài hạn khác) và các khoản phải thu dài hạn khác (phải thu khác từ các đối tượng có liên quan được xếp vào loại tài sản dài hạn, và các khoản ký quỹ, ký cược dài hạn) tại ngày kết thúc quý báo cáo, có thời hạn thu hồi hoặc thanh toán trên 1 năm.\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu để ghi vào chỉ tiêu này là tổng số dư Nợ chi tiết phải thu dài hạn của các Tài khoản: Chi tiết TK 131 “Phải thu của khách hàng”, TK 1361 “Vốn kinh doanh ở các đơn vị trực thuộc”, TK 1368 “Phải thu nội bộ khác”, và các Tài khoản 138, 338, 244, sau khi trừ đi chi tiết số dư Có TK 139 “Dự phòng phải thu khó đòi” (chi tiết dự phòng phải thu dài hạn khó đòi của khách hàng) tại ngày kết thúc quý báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eII- Tài sản cố định (Mã số 220)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLà chỉ tiêu tổng hợp phản ánh toàn bộ giá trị còn lại (Nguyên giá trừ giá trị hao mòn lũy kế) của các loại tài sản cố định và chi phí đầu tư xây dựng cơ bản dở dang hiện có, tại ngày kết thúc quý báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu để ghi vào chỉ tiêu này là tổng số dư Nợ của các Tài khoản: TK 211 “Tài sản cố định hữu hình”, TK 212 “Tài sản cố định thuê tài chính”, TK 213 “Tài sản cố định vô hình”, sau khi trừ tổng số dư Có của các tài khoản phản ánh giá trị hao mòn: 2141 “Hao mòn TSCĐ hữu hình”, 2142 “Hao mòn tài sản cố định thuê tài chính”, 2143 “Hao mòn TSCĐ vô hình” và số dư Nợ của TK 241 “Xây dựng cơ bản dở dang” trên Sổ Cái hoặc Nhật ký - Sổ Cái tại ngày kết thúc quý báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eIII- Bất động sản đầu tư ( Mã số 240)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLà chỉ tiêu tổng hợp phản ánh toàn bộ giá trị còn lại của các loại bất động sản đầu tư hiện có tại ngày kết thúc quý báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu để phản ánh vào chỉ tiêu này là số dư Nợ của Tài khoản 217 “Bất động sản đầu tư”, sau khi trừ số dư Có của Tài khoản 2147 “Hao mòn bất động sản đầu tư” trên Sổ Cái hoặc Nhật ký - Sổ Cái tại ngày kết thúc quý báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eIV- Các khoản đầu tư tài chính dài hạn ( Mã số 250)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLà chỉ tiêu tổng hợp phản ánh tổng giá trị thuần các khoản đầu tư tài chính dài hạn hiện có tại ngày kết thúc quý báo cáo, như: đầu tư vào công ty con, đầu tư vào công ty liên kết, liên doanh (dưới hình thức thành lập cơ sở kinh doanh đồng kiểm soát), đầu tư dài hạn khác...\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu để ghi vào chỉ tiêu này là tổng số dư Nợ của các Tài khoản: TK 221 “Đầu tư vào công ty con”, TK 222 “Vốn góp liên doanh”, TK 223 “Đầu tư vào công ty liên kết” và TK 228 “Đầu tư dài hạn khác” trên Sổ Cái hoặc Nhật ký - Sổ Cái tại ngày kết thúc quý báo cáo, sau khi trừ số dư Có TK 229 “Dự phòng giảm giá đầu tư dài hạn”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eV- Tài sản dài hạn khác (Mã số 260)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLà chỉ tiêu tổng hợp phản ánh tổng số chi phí trả trước dài hạn nhưng chưa phân bổ vào chi phí sản xuất, kinh doanh, tài sản thuế thu nhập hoãn lại, các khoản ký quỹ, kỹ cược dài hạn và\u0026nbsp; tài sản dài hạn khác tại ngày kết thúc quý báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu để phản ánh vào chỉ tiêu này được căn cứ vào tổng số dư Nợ của các Tài khoản: TK 242 “Chi phí trả trước dài hạn”, TK 243 “Tài sản thuế thu nhập hoãn lại”, TK 244 “Ký quỹ, ký cược dài hạn” và các tài khoản khác có liên quan trên sổ Cái hoặc Nhật ký - Sổ Cái.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTỔNG CỘNG TÀI SẢN (Mã số 270)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ePhản ánh tổng trị giá tài sản thuần hiện có của doanh nghiệp tại thời điểm báo cáo, bao gồm các loại thuộc tài sản ngắn hạn và tài sản dài hạn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eMã số 270 = Mã số 100 + Mã số 200.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ePhần : NGUỒN VỐN\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNỢ PHẢI TRẢ (Mã số 300 )\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLà chỉ tiêu tổng hợp phản ánh toàn bộ số phải trả tại thời điểm báo cáo, gồm: Nợ ngắn hạn và nợ dài hạn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eMã số 300 = Mã số 310 + Mã số 330.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ ngắn hạn (Mã số 310)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLà chỉ tiêu tổng hợp phản ánh tổng giá trị các khoản nợ còn phải trả có thời hạn thanh toán dưới một năm hoặc dưới một chu kỳ kinh doanh, các khoản vay ngắn hạn, và giá trị các khoản chi phí phải trả, tài sản thừa chờ xử lý, các khoản nhận ký quỹ, ký cược ngắn hạn tại và các khoản phải trả, phải nộp khác tại ngày kết thúc quý báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu để ghi vào chỉ tiêu này là tổng số dư Có chi tiết của các khoản phải trả ngắn hạn của các Tài khoản: TK 311 “Vay ngắn hạn”, TK 315 “Nợ dài hạn đến hạn trả”, TK 331 “Phải trả cho người bán”, TK 131 “Phải thu của khách hàng”, TK 333 “Thuế và các khoản phải nộp Nhà nước”, TK 334 “Phải trả người lao động”, TK 335 “Chi phí phải trả” ,TK 336 “Phải trả nội bộ”, TK 338 “Phải trả, phải nộp khác”, TK 138 “Phải thu khác”, TK 337 “Thanh toán theo tiến độ kế hoạch hợp đồng xây dựng” và TK 351, TK 352 “ Dự phòng phải trả“ (chi tiết dự phòng phải trả ngắn hạn) trên sổ kế toán chi tiết các tài khoản liên quan (TK 331, 131, 333, 334, 336, 335, 338, 351, 352, 138) và Sổ Cái hoặc Nhật ký - Sổ Cái các TK 311, 315, 337 tại ngày kết thúc quý báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eII- Nợ dài hạn (Mã số 330)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLà chỉ tiêu tổng hợp phản ánh tổng giá trị các khoản nợ phải trả dài hạn của doanh nghiệp bao gồm những khoản nợ có thời hạn thanh toán ban đầu trên một năm hoặc trên một chu kỳ kinh doanh: Khoản phải trả cho người bán, phải trả dài hạn nội bộ, vay và nợ dài hạn, thuế thu nhập hoãn lại phải trả và các khoản phải trả dài hạn khác tại ngày kết thúc quý báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu để ghi vào chỉ tiêu này là tổng số dư Có chi tiết các khoản phải trả dài hạn của các tài khoản: TK 331“Phải trả cho người bán”, TK 336 “Phải trả nội bộ”, TK 338 “Phải trả, phải nộp khác”, TK 341 “Vay dài hạn”, TK 342 “Nợ dài hạn”, TK 335 “Chi phí phải trả”, TK 343 “Trái phiếu phát hành”, TK 344 “Nhận ký quỹ, ký cược dài hạn”, TK 347 “Thuế thu nhập hoãn lại phải trả”, TK 351 “Quỹ dự phòng trợ cấp mất việc làm”, và TK 352 “Dự phòng phải trả” trên sổ kế toán chi tiết các TK 331, 336, 338, 351, 352 và Sổ Cái hoặc Nhật ký - Sổ Cái các TK 341, 342, 343, 344, 347 tại ngày kết thúc quý báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eB- VỐN CHỦ SỞ HỮU (Mã số 400)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLà chỉ tiêu tổng hợp phản ánh toàn bộ vốn thuộc sở hữu của chủ doanh nghiệp, các quỹ của doanh nghiệp, nguồn kinh phí sự nghiệp được cấp còn lại chưa chi và nguồn kinh phí đã hình thành TSCĐ tại ngày kết thúc quý báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eI-Vốn chủ sở hữu (Mã số 410)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLà chỉ tiêu tổng hợp phản ánh toàn bộ vốn thuộc sở hữu của chủ doanh nghiệp và các quỹ của doanh nghiệp, bao gồm: Vốn đầu tư của chủ sở hữu, Thặng dư vốn cổ phần, vốn khác, cổ phiếu quỹ, chênh lệch đánh giá lại tài sản và chênh lệch tỷ giá hối đoái, quỹ đầu tư phát triển, quỹ dự phòng tài chính, quỹ khác thuộc vốn chủ sở hữu, lợi nhuận chưa phân phối và nguồn vốn đầu tư XDCB tại ngày kết thúc quý báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu để ghi vào chỉ tiêu này là tổng số dư Có của Tài khoản 411 “Nguồn vốn kinh doanh”, TK 419 “Cổ phiếu quỹ”, TK 412 “Chênh lệch đánh giá lại tài sản”, TK 413 “Chênh lệch tỷ giá hối đoái”, TK 414 “Quỹ đầu tư phát triển”, TK 415 “Quỹ dự phòng tài chính“, TK 418 “Các quỹ khác thuộc vốn chủ sở hữu”, TK 421 “Lợi nhuận chưa phân phối”, TK 441 “Nguồn vốn đầu tư XDCB“,\u0026nbsp; trên Sổ Cái hoặc Nhật ký - Sổ Cái tại ngày kết thúc quý báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTrường hợp các tài khoản: TK 412, TK 413, TK 419, TK 421 có số dư Nợ thì số liệu này được ghi bằng số âm dưới hình thức ghi trong ngoặc đơn (...).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eII- Nguồn kinh phí và quỹ khác (Mã số 420)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLà chỉ tiêu tổng hợp phản ánh tổng giá trị quỹ khen thưởng, phúc lợi, nguồn kinh phí sự nghiệp, kinh phí dự án được cấp để chi tiêu cho các hoạt động sự nghiệp, dự án (sau khi trừ các khoản chi bằng nguồn kinh phí sự nghiệp, dự án) và nguồn kinh phí đã hình thành tài sản cố định tại ngày kết thúc quý báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu để ghi vào chỉ tiêu này là tổng số dư Có của Tài khoản 431 “Quỹ khen thưởng, phúc lợi”, Tài khoản 461 “Nguồn kinh phí sự nghiệp” sau khi trừ số dư Nợ Tài khoản 161 “Chi sự nghiệp”, số dư Có TK 466 “Nguồn kinh phí đã hình thành TSCĐ” trên Sổ Cái hoặc Nhật ký - Sổ Cái tại ngày kết thúc quý báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTổng cộng Nguồn vốn (Mã số 440)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ePhản ánh tổng số các nguồn vốn hình thành tài sản của doanh nghiệp tại ngày kết thúc quý báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eMã số 440 = Mã số 300 + Mã số 400\u003c/span\u003e\u003c/p\u003e\n  \u003ctable align=\"center\" border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"text-align: justify;\" id=\"06c0f5b0-5d97-11f1-ad13-f1646a153919\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChỉ tiêu “Tổng cộng Tài sản- Mã số 270”\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e=\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChỉ tiêu “Tổng cộng Nguồn vốn- Mã số 440”\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cdiv style=\"text-align: justify;\"\u003e\n   \u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\n  \u003c/div\u003e\n  \u003cp id=\"06c143d0-5d97-11f1-b5a5-0d7ebef68ee4\" class=\"prov-clause\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.2. Lập và trình bày Báo cáo kết quả hoạt động kinh doanh giữa niên độ\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06c191f0-5d97-11f1-9548-89d33ac17d1b\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;2.2.1- Kết cấu\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c191f0-5d97-11f1-9548-89d33ac17d1b\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(1) Báo cáo kết quả hoạt động kinh doanh giữa niên độ (dạng đầy đủ) (Mẫu số B02a-DN) ban hành theo Quyết định số 15/2006/QĐ-BTC ngày 20/3/2006 của Bộ Tài chính\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c191f0-5d97-11f1-9548-89d33ac17d1b\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eĐối với doanh nghiệp lập và trình bày Báo cáo kết quả kinh doanh giữa niên độ (dạng đầy đủ), thì hình thức và nội dung của báo cáo này phải phù hợp với mẫu số B02a-DN.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c191f0-5d97-11f1-9548-89d33ac17d1b\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu trình bày trong báo cáo này gồm số liệu luỹ kế từ đầu năm đến ngày kết thúc kỳ kế toán giữa niên độ hiện tại, số liệu phát sinh của kỳ kế toán giữa niên độ hiện tại, số liệu mang tính so sánh luỹ kế từ đầu năm đến ngày kết thúc kỳ kế toán giữa niên độ tương ứng năm trước và số liệu mang tính so sánh phát sinh của kỳ kế toán giữa niên độ tương ứng năm trước.\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c191f0-5d97-11f1-9548-89d33ac17d1b\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCăn cứ vào các quy định nêu trên, Báo cáo kết quả hoạt động kinh doanh giữa niên độ dạng đầy đủ gồm tất cả các khoản mục sắp xếp theo kết cấu qui định tại Mẫu số B 02-DN ban hành theo chế độ kế toán doanh nghiệp hiện hành, nhưng cột số 4 “Năm nay” của mẫu này được chia ra thành hai cột nhỏ là cột 4 “Quý này năm nay” và cột 5 “Quý này năm trước”; và cột 5 “Năm trước” của mẫu này được chia ra thành 2 cột nhỏ là cột 6 “Luỹ kế từ đầu năm đến cuối quý này năm nay” và cột 7 “Luỹ kế từ đầu năm đến cuối quý này năm trước”, và có ký hiệu là Mẫu số B02a-DN.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c191f0-5d97-11f1-9548-89d33ac17d1b\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(2) Báo cáo kết quả hoạt động kinh doanh giữa niên độ (dạng tóm lược) (Mẫu số B02b-DN) ban hành theo Quyết định số 15/2006/QĐ/BTC ngày 20/3/2006 của Bộ Tài chính.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c191f0-5d97-11f1-9548-89d33ac17d1b\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBáo cáo kết quả hoạt động kinh doanh giữa niên độ (dạng tóm lược) gồm tối thiểu các khoản mục chủ yếu và được sắp xếp theo kết cấu qui định tại Mẫu số B 02b-DN.\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" style=\"text-align: justify;\" id=\"06c191f0-5d97-11f1-9548-89d33ac17d1b\"\u003 ass=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e(Ký, họ tên)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(Ký, họ tên, đóng dấu)\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cdiv style=\"text-align: justify;\"\u003e\n   \u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\n  \u003c/div\u003e\n  \u003cp id=\"06c22e30-5d97-11f1-a702-114d92e09a27\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.2.2.Nội dung và phương pháp lập các chỉ tiêu\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c22e30-5d97-11f1-a702-114d92e09a27\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(1). Báo cáo kết quả hoạt động kinh doanh giữa niên độ (dạng đầy đủ) (Mẫu số B02a-DN)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c22e30-5d97-11f1-a702-114d92e09a27\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Số liệu ghi vào cột 6 “Luỹ kế từ đầu năm đến cuối quý này/ Năm nay” của báo cáo quý này được lập căn cứ vào số liệu ghi ở cột 4 “Quý này” của báo cáo quý này cộng\u0026nbsp; với\u0026nbsp; số liệu cột 6 “Luỹ kế từ đầu năm đến cuối quý này/ Năm nay” của báo cáo này quý trước. Kết quả tìm được ghi vào cột 6 của báo cáo này quý này theo từng chỉ tiêu phù hợp. Riêng đối\u0026nbsp; với Quý I số liệu ghi vào cột 6 bằng số liệu ghi vào cột 4.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c22e30-5d97-11f1-a702-114d92e09a27\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Nội dung và phương pháp lập các chỉ tiêu ghi vào cột 4 (“Quý này” Năm nay) của Báo cáo kết quả hoạt động kinh doanh giữa niên độ dạng đầy đủ được thực hiện theo hướng dẫn như đối với Báo cáo kết quả hoạt động kinh doanh năm - Mẫu số B02-DN.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c22e30-5d97-11f1-a702-114d92e09a27\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Số liệu ghi vào cột 7 “Luỹ kế từ đầu năm đến cuối quý này/ Năm trước” của báo cáo quý này được lập căn cứ vào số liệu ghi ở cột 6 “Luỹ kế từ đầu năm đến cuối quý này/ Năm nay” của báo cáo quý này năm trước theo từng chỉ tiêu phù hợp. Khi lập lần đầu báo cáo này, số liệu trên báo cáo năm trước không có thì\u0026nbsp; để trống cột số liệu này.\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c22e30-5d97-11f1-a702-114d92e09a27\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Số liệu ghi vào cột 5 “Quý này/ Năm trước” của báo cáo quý này được căn cứ vào số liệu ghi ở cột 4 “Quý này/ Năm nay” của báo cáo quý này năm trước theo từng chỉ tiêu phù hợp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c22e30-5d97-11f1-a702-114d92e09a27\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(2). Báo cáo kết quả hoạt động kinh doanh giữa niên độ (dạng tóm lược) (Mẫu số B02b-DN)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c22e30-5d97-11f1-a702-114d92e09a27\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu ghi vào cột 6 “Luỹ kế từ đầu năm đến cuối quý này/Năm nay”, cột 7 “Luỹ kế từ đầu năm đến cuối quý này/Năm trước”, và cột 5 “Quý này/Năm trước” của báo cáo này được thực hiện như đã hướng dẫn đối với Báo cáo kết quả hoạt động kinh doanh giữa niên độ (dạng đầy đủ).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c22e30-5d97-11f1-a702-114d92e09a27\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu ghi vào cột 4 “Quý này/ Năm nay” của báo cáo này tại ngày kết thúc quý được căn cứ vào số liệu từ đầu quý đến ngày kết thúc quý báo cáo, được hướng dẫn như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c22e30-5d97-11f1-a702-114d92e09a27\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1- Doanh thu bán hàng và cung cấp dịch vụ (Mã số 01)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c22e30-5d97-11f1-a702-114d92e09a27\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChỉ tiêu này phản ánh tổng doanh thu bán hàng hóa, thành phẩm, BĐS đầu tư và cung cấp dịch vụ trong quý báo cáo của doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c22e30-5d97-11f1-a702-114d92e09a27\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu để ghi vào chỉ tiêu này là luỹ kế số phát sinh bên Có của Tài khoản 511 “Doanh thu bán hàng và cung cấp dịch vụ” và Tài khoản 512 “Doanh thu bán hàng nội bộ” trong quý báo cáo trên sổ Cái hoặc Nhật ký - Sổ Cái.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c22e30-5d97-11f1-a702-114d92e09a27\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2- Doanh thu hoạt động tài chính và thu nhập khác (Mã số 31)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c22e30-5d97-11f1-a702-114d92e09a27\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChỉ tiêu này phản ánh tổng doanh thu hoạt động tài chính và các khoản thu nhập khác trong quý báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c22e30-5d97-11f1-a702-114d92e09a27\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu để ghi vào chỉ tiêu này là luỹ kế số phát sinh bên Nợ của Tài khoản 515 “Doanh thu hoạt động tài chính” và số phát sinh bên Nợ Tài khoản 711 “Thu nhập khác” đối ứng với bên Có TK 911 trong quý báo cáo trên sổ Cái hoặc Nhật ký - Sổ Cái.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c22e30-5d97-11f1-a702-114d92e09a27\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3- Tổng lợi nhuận kế toán trước thuế (Mã số 50)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c22e30-5d97-11f1-a702-114d92e09a27\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChỉ tiêu này phản ánh tổng số lợi nhuận kế toán thực hiện trong quý báo cáo của doanh nghiệp trước khi trừ chi phí thuế thu nhập doanh nghiệp phát sinh trong quý báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c22e30-5d97-11f1-a702-114d92e09a27\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu phản ánh vào chỉ tiêu này là số chênh lệch giữa số phát sinh bên Có của TK 911 “Xác định kết quả kinh doanh” đối ứng với bên Nợ các TK 511, 512, 515, 711 so với số phát sinh bên Nợ TK 911 đối ứng với bên Có của các TK 632, 635, 641, 642, 811 trong quý báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c22e30-5d97-11f1-a702-114d92e09a27\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4- Lợi nhuận sau thuế thu nhập doanh nghiệp (Mã số 60)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c22e30-5d97-11f1-a702-114d92e09a27\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChỉ tiêu này phản ánh tổng số lợi nhuận thuần (hoặc lỗ) sau thuế từ các hoạt động của doanh nghiệp (sau khi trừ chi phí thuế thu nhập doanh nghiệp) phát sinh trong quý báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c22e30-5d97-11f1-a702-114d92e09a27\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu để ghi vào chỉ tiêu này được xác định bằng “Tổng lợi nhuận kế toán trước thuế” trừ (-) “Chi phí thuế thu nhập doanh nghiệp”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06c27c50-5d97-11f1-847b-dd429107a7ee\" class=\"prov-clause\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.3. Hướng dẫn lập và trình bày Báo cáo lưu chuyển tiền tệ giữa niên độ\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06c2ca70-5d97-11f1-8393-953e8af02a17\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.3.1. Nguyên tắc lập và trình bày Báo cáo lưu chuyển tiền tệ giữa niên độ\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c2ca70-5d97-11f1-8393-953e8af02a17\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Các doanh nghiệp thuộc đối tượng phải lập báo cáo tài chính giữa niên độ (dạng đầy đủ) thì Báo cáo lưu chuyển tiền tệ được lập và trình bày theo quy định đối với lập và trình bày Báo cáo lưu chuyển tiền tệ năm quy định trong chế độ báo cáo tài chính hiện hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c2ca70-5d97-11f1-8393-953e8af02a17\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Các doanh nghiệp thuộc đối tượng lập báo cáo tài chính giữa niên độ (dạng tóm lược) thì Báo cáo lưu chuyển tiền tệ giữa niên độ (dạng tóm lược) theo Mẫu số B03b-DN.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c2ca70-5d97-11f1-8393-953e8af02a17\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Thông tin trên Báo cáo lưu chuyển tiền tệ giữa niên độ (dạng tóm lược) là thông tin luỹ kế từ ngày đầu niên độ hiện tại đến ngày lập Báo cáo lưu chuyển tiền tệ giữa niên độ, cùng với số liệu mang tính so sánh của cùng kỳ kế toán giữa niên độ trước liền kề.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c2ca70-5d97-11f1-8393-953e8af02a17\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Báo cáo lưu chuyển tiền tệ giữa niên độ (dạng tóm lược) chỉ yêu cầu trình bày đề mục và số cộng chi tiết của Báo cáo lưu chuyển tiền tệ năm, do vậy, cách tính các chỉ tiêu chi tiết được áp dụng như cách tính các chỉ tiêu trong Báo cáo lưu chuyển tiền tệ năm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06c31890-5d97-11f1-81ed-91ce8e4b00fc\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.3.2. Cơ sở lập\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c31890-5d97-11f1-81ed-91ce8e4b00fc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eViệc lập Báo cáo lưu chuyển tiền tệ giữa niên độ được căn cứ vào:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c31890-5d97-11f1-81ed-91ce8e4b00fc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Bảng cân đối kế toán kỳ lập báo cáo tài chính giữa niên độ;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c31890-5d97-11f1-81ed-91ce8e4b00fc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Báo cáo kết quả hoạt động kinh doanh kỳ lập báo cáo tài chính giữa niên độ;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c31890-5d97-11f1-81ed-91ce8e4b00fc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Bản thuyết minh báo cáo tài chính kỳ lập báo cáo tài chính giữa niên độ;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c31890-5d97-11f1-81ed-91ce8e4b00fc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Báo cáo lưu chuyển tiền tệ tóm lược kỳ này năm trước;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c31890-5d97-11f1-81ed-91ce8e4b00fc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Các sổ kế toán tổng hợp, chi tiết của kỳ báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06c366b0-5d97-11f1-b5ec-293d72791592\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.3.3. Nội dung và kết cấu\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c366b0-5d97-11f1-b5ec-293d72791592\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBáo cáo lưu chuyển tiền tệ giữa niên độ (dạng đầy đủ) được lập theo mẫu biểu quy định trong chế độ báo cáo tài chính doanh nghiệp hiện hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c366b0-5d97-11f1-b5ec-293d72791592\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBáo cáo lưu chuyển tiền tệ giữa niên độ (dạng tóm lược) được lập theo Mẫu số B03b-DN quy định tại Chế độ kế toán doanh nghiệp ban hành theo Quyết định số 15/2006/QĐ-BTC ngày 20/3/2006 của Bộ Tài chính và áp dụng cho cả hai trường hợp lập Báo cáo lưu chuyển tiền tệ theo phương pháp trực tiếp và theo phương pháp gián tiếp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.3.4. Phương pháp lập\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea/ Báo cáo lưu chuyển tiền tệ giữa niên độ (dạng đầy đủ):\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e-Số liệu ghi vào cột 5 “Luỹ kế từ đầu năm đến cuối quý này/ Năm trước” được căn cứ vào số liệu ghi ở cột 4 “Luỹ kế từ đầu năm đến cuối quý này/ Năm nay” của báo cáo này cùng kỳ năm trước ở từng chỉ tiêu phù hợp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Số liệu ghi vào cột 4 “Luỹ kế từ đầu năm đến cuối quý này/ Năm nay” được lập theo qui định đối với Báo cáo lưu chuyển tiền tệ năm, nhưng lấy số liệu lưu chuyển tiền luỹ kế từ đầu năm đến cuối quý báo cáo của niên độ kế toán hiện hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb/ Báo cáo lưu chuyển tiền tệ giữa niên độ (dạng tóm lược):\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Số liệu ghi vào cột 5 “Luỹ kế từ đầu năm đến cuối quý này/ Năm trước” được căn cứ vào số liệu ghi ở cột 4 “Luỹ kế từ đầu năm đến cuối quý này/ Năm nay” của báo cáo này cùng kỳ năm trước ở từng chỉ tiêu phù hợp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Số liệu ghi vào cột 4 “Luỹ kế từ đầu năm đến cuối quý này/ Năm nay” được lập cho từng chỉ tiêu như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(1) Lưu chuyển tiền thuần từ hoạt động kinh doanh (Mã số 20)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChỉ tiêu này phản ánh tổng số chênh lệch giữa tổng số tiền thu vào và tổng số tiền chi ra từ đầu năm đến cuối quý báo cáo của các luồng tiền từ hoạt động kinh doanh.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Nếu doanh nghiệp áp dụng phương pháp trực tiếp thì luồng tiền từ hoạt động kinh doanh được lập bằng cách phân tích và tổng hợp trực tiếp các khoản tiền thu vào và chi ra theo từng nội dung thu, chi từ các sổ kế toán tổng hợp và chi tiết của doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNội dung và cách tính các chỉ tiêu cụ thể của luồng tiền từ hoạt động kinh doanh được lập theo phương pháp trực tiếp thực hiện như quy định đối với việc lập Báo cáo lưu chuyển tiền tệ năm (theo phương pháp trực tiếp), nhưng lấy số liệu lưu chuyển tiền từ hoạt động kinh doanh luỹ kế từ đầu năm đến cuối quý báo cáo của niên độ kế toán hiện hành theo từng chỉ tiêu để tính ra số chênh lệch giữa tổng số tiền thu vào và tổng số tiền chi ra từ hoạt động kinh doanh.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Nếu doanh nghiệp áp dụng phương pháp gián tiếp thì luồng tiền từ hoạt động kinh doanh được xác định trước hết bằng cách điều chỉnh lợi nhuận kế toán trước thuế TNDN của hoạt động kinh doanh khỏi ảnh hưởng của các khoản mục không phải bằng tiền, các thay đổi trong kỳ của hàng tồn kho, các khoản phải thu, phải trả từ hoạt động kinh doanh và các khoản mà ảnh hưởng về tiền của chúng là luồng tiền từ hoạt động đầu tư.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNội dung và cách tính các chỉ tiêu cụ thể của luồng tiền từ hoạt động kinh doanh được lập theo phương pháp gián tiếp được thực hiện như qui định đối với việc lập Báo cáo lưu chuyển tiền tệ năm (theo phương pháp gián tiếp), nhưng lấy số liệu lưu chuyển tiền luỹ kế từ đầu năm đến cuối quý báo cáo của niên độ kế toán hiện hành theo từng chỉ tiêu: lợi nhuận trước thuế; khấu hao TSCĐ; các khoản dự phòng; Lãi, lỗ chênh lệch tỷ giá hối đoái chưa thực hiện; Lãi, lỗ từ hoạt động đầu tư; Chi phí lãi để tính ra lưu chuyển thuần từ hoạt động kinh doanh.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(2) Lưu chuyển tiền thuần từ hoạt động đầu tư (Mã số 30)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCác luồng tiền vào, các luồng ra trong kỳ từ hoạt động đầu tư được xác định bằng cách phân tích và tổng hợp trực tiếp các khoản tiền thu vào và chi ra của hoạt động đầu tư theo từng nội dung thu, chi từ các sổ kế toán tổng hợp và chi tiết của doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Nội dung và cách tính các chỉ tiêu cụ thể của luồng tiền từ hoạt động đầu tư được thực hiện như quy định đối với việc lập Báo cáo lưu chuyển tiền tệ năm, nhưng lấy số liệu lưu chuyển tiền từ hoạt động đầu tư luỹ kế từ đầu năm đến cuối quý báo cáo của niên độ kế toán hiện hành theo từng chỉ tiêu để tính ra số chênh lệch giữa tổng số tiền thu vào và tổng số tiền chi ra từ hoạt động đầu tư.\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(3) Lưu chuyển tiền thuần từ hoạt động tài chính (Mã số 40)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCác luồng tiền vào và luồng tiền ra trong kỳ của hoạt động tài chính được tổng hợp trực tiếp từ các luồng tiền thu vào, chi ra từ hoạt động tài chính theo từng nội dung thu, chi từ các sổ kế toán tổng hợp và chi tiết của doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNội dung và cách tính các chỉ tiêu cụ thể của luồng tiền từ hoạt động tài chính được thực hiện như quy định đối với việc lập Báo cáo lưu chuyển tiền tệ năm, nhưng lấy số liệu lưu chuyển tiền từ hoạt động tài chính luỹ kế từ đầu năm đến cuối quý báo cáo của niên độ kế toán hiện hành theo từng chỉ tiêu để tính ra số chênh lệch giữa tổng số tiền thu vào và tổng số tiền chi ra từ hoạt động tài chính.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(4) Lưu chuyển tiền thuần trong kỳ (Mã số 50)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ePhản ánh số chênh lệch giữa tổng số tiền thu vào với tổng số tiền chi ra từ 3 hoạt động: hoạt động kinh doanh, hoạt động đầu tư, hoạt động tài chính (Mã số 50 = Mã số 20 + Mã số 30 + Mã số 40).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(5) Tiền và tương đương tiền đầu kỳ (Mã số 60)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ePhản ánh số dư của tiền và tương đương tiền đầu năm báo cáo. Số liệu này được lấy từ chỉ tiêu “Tiền và tương đương tiền cuối kỳ” của Báo cáo lưu chuyển tiền tệ năm trước.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(6) Ảnh hưởng của thay đổi tỷ giá hối đoái quy đổi ngoại tệ (Mã số 61)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ePhản ánh tổng số chênh lệch tỷ giá hối đoái do đánh giá lại số dư cuối kỳ của tiền và các khoản tương đương tiền bằng ngoại tệ tại thời điểm cuối kỳ báo cáo giữa niên độ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(7) Tiền và tương đương tiền cuối kỳ (Mã số 70)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ePhản ánh số dư của tiền và tương đương tiền cuối kỳ lập báo cáo tài chính giữa niên độ. Chỉ tiêu này bằng chỉ tiêu tiền và tương đương tiền đầu kỳ cộng (+) chỉ tiêu lưu chuyển thuần trong kỳ và điều chỉnh ảnh hưởng của thay đổi tỷ giá hối đoái quy đổi ngoại tệ.\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"662\" style=\"text-align: justify;\" id=\"06c38dc0-5d97-11f1-938e-836f77f25ecc\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eĐơn vị báo cáo: ………………..\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eMẫu số B 03b – DN\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eĐịa chỉ:…………………………\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n

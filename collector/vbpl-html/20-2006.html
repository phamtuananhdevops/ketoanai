03cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Kết chuyển chênh lệch giữa số phát sinh bên Có TK 8212 lớn hơn số phát sinh bên Nợ TK 8212 – “Chi phí thuế thu nhập doanh nghiệp hoãn lại” phát sinh trong năm vào bên Có tài khoản 911 – “Xác định kết quả kinh doanh”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBên Có:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Ghi giảm chi phí thuế thu nhập doanh nghiệp hoãn lại (số chênh lệch giữa tài sản thuế thu nhập hoãn lại phát sinh trong năm lớn hơn tài sản thuế thu nhập hoãn lại được hoàn nhập trong năm).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Ghi giảm chi phí thuế thu nhập doanh nghiệp hoãn lại (số chênh lệch giữa thuế thu nhập hoãn lại phải trả được hoàn nhập trong năm lớn hơn thuế thu nhập hoãn lại phải trả phát sinh trong năm).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Kết chuyển chênh lệch giữa số phát sinh bên Có TK 8212 nhỏ hơn số phát sinh bên Nợ TK 8212 – “Chi phí thuế thu nhập doanh nghiệp hoãn lại” phát sinh trong năm vào bên Nợ tài khoản 911 – “Xác định kết quả kinh doanh”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTài khoản 8212 – “Chi phí thuế thu nhập doanh nghiệp hoãn lại” không có số dư cuối kỳ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1) Phương pháp ghi chép các nghiệp vụ kinh tế chủ yếu liên quan đến chi phí thuế thu nhập doanh nghiệp hiện hành\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1 - Hàng quý, khi xác định thuế thu nhập doanh nghiệp tạm phải nộp theo quy định của Luật thuế thu nhập doanh nghiệp, kế toán phản ánh số thuế thu nhập doanh nghiệp tạm phải nộp Nhà nước vào chi phí thuế thu nhập doanh nghiệp hiện hành, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 8211– Chi phí thuế thu nhập doanh nghiệp hiện hành\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 3334 - Thuế thu nhập doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eKhi nộp thuế thu nhập doanh nghiệp vào NSNN, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 3334 - Thuế thu nhập doanh nghiệp\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó các TK 111, 112,…\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2 - Cuối năm tài chính, căn cứ vào số thuế thu nhập doanh nghiệp thực tế phải nộp, kế toán ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Nếu số thuế thu nhập doanh nghiệp thực tế phải nộp trong năm lớn hơn số thuế thu nhập doanh nghiệp tạm phải nộp, kế toán phản ánh bổ sung số thuế thu nhập doanh nghiệp còn phải nộp, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 8211– Chi phí thuế thu nhập doanh nghiệp hiện hành\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 3334 - Thuế thu nhập doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eKhi nộp thuế thu nhập doanh nghiệp vào NSNN, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 3334 - Thuế thu nhập doanh nghiệp\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó các TK 111, 112,…\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Nếu số thuế thu nhập doanh nghiệp thực tế phải nộp trong năm nhỏ hơn số thuế thu nhập doanh nghiệp tạm phải nộp, thì số chênh lệch kế toán ghi giảm chi phí số thuế thu nhập doanh nghiệp hiện hành, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 3334 – Thuế thu nhập doanh nghiệp\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 8211– Chi phí thuế thu nhập doanh nghiệp hiện hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3 - Trường hợp phát hiện sai sót không trọng yếu của các năm trước liên quan đến khoản thuế thu nhập doanh nghiệp phải nộp của các năm trước, doanh nghiệp được hạch toán tăng (hoặc giảm) số thuế thu nhập doanh nghiệp phải nộp của các năm trước vào chi phí thuế thu nhập hiện hành của năm phát hiện sai sót.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Trường hợp thuế thu nhập doanh nghiệp hiện hành của các năm trước phải nộp bổ sung do phát hiện sai sót không trọng yếu của các năm trước được ghi tăng chi phí thuế thu nhập doanh nghiệp hiện hành của năm hiện tại, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 8211 – Chi phí thuế thu nhập doanh nghiệp hiện hành\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 3334 - Thuế thu nhập doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eKhi nộp tiền, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 3334 - Thuế thu nhập doanh nghiệp\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó các TK 111, 112…\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Trường hợp số thuế thu nhập doanh nghiệp phải nộp được ghi giảm do phát hiện sai sót không trọng yếu của các năm trước được ghi giảm chi phí thuế thu nhập doanh nghiệp hiện hành trong năm hiện tại, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 3334 - Thuế thu nhập doanh nghiệp\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 8211 – Chi phí thuế thu nhập doanh nghiệp hiện hành\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4 - Cuối năm tài chính, kế toán kết chuyển chi phí thuế thu nhập hiện hành, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Nếu TK 8211 có số phát sinh Nợ lớn hơn số phát sinh Có, thì số chênh lệch ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 911 – Xác định kết quả kinh doanh\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 8211– Chi phí thuế thu nhập doanh nghiệp hiện hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Nếu TK 8211 có số phát sinh Nợ nhỏ hơn số phát sinh Có, thì số chênh lệch ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 8211– Chi phí thuế thu nhập doanh nghiệp hiện hành\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afba3a80-5d8f-11f1-9e17-2f0d0190b33e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 911 – Xác định kết quả kinh doanh.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afbaafb0-5d8f-11f1-8009-add882e9c58e\" class=\"prov-section\" style=\"text-align: justify;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2) Kế toán “Thuế thu nhập hoãn lại phải trả” và “Tài sản thuế thu nhập hoãn lại” trên báo cáo tài chính riêng của doanh nghiệp\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"afbad6c0-5d8f-11f1-b9db-83d2d52da7ee\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.1 – Phương pháp xác định và kế toán “Thuế thu nhập hoãn lại phải trả”\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afbb24e0-5d8f-11f1-94d8-a7e2f9a219b4\" class=\"prov-item\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.1.1 – Xác định các khoản chênh lệch tạm thời chịu thuế:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb24e0-5d8f-11f1-94d8-a7e2f9a219b4\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Cuối năm tài chính, khi lập báo cáo tài chính, kế toán phải xác định cơ sở tính thuế của tài sản và các khoản nợ phải trả làm căn cứ xác định các khoản chênh lệch tạm thời chịu thuế. Việc xác định các khoản chênh lệch tạm thời chịu thuế được thực hiện theo quy định tại Mục I của Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb24e0-5d8f-11f1-94d8-a7e2f9a219b4\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Các khoản chênh lệch tạm thời chịu thuế được sử dụng làm căn cứ xác định thuế thu nhập hoãn lại phải trả trong năm trên báo cáo tài chính riêng của doanh nghiệp phải được phản ánh vào “Bảng xác định chênh lệch tạm thời chịu thuế” phát sinh trong năm (Biểu số 01).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb24e0-5d8f-11f1-94d8-a7e2f9a219b4\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- “Bảng xác định chênh lệch tạm thời chịu thuế” dùng để phản ánh chi tiết từng khoản chênh lệch tạm thời chịu thuế phát sinh trong năm làm cơ sở xác định thuế thu nhập hoãn lại phải trả.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb24e0-5d8f-11f1-94d8-a7e2f9a219b4\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBIỂU SỐ 01\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb24e0-5d8f-11f1-94d8-a7e2f9a219b4\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBẢNG XÁC ĐỊNH CHÊNH LỆCH TẠM THỜI CHỊU THUẾ\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-co if; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb24e0-5d8f-11f1-94d8-a7e2f9a219b4\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e* Căn cứ để lập “Bảng xác định chênh lệch tạm thời chịu thuế” là số chênh lệch tạm thời chịu thuế phát sinh trong năm liên quan đến từng tài sản hoặc khoản nợ phải trả hoặc giao dịch.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb24e0-5d8f-11f1-94d8-a7e2f9a219b4\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e* Dòng tổng cộng chênh lệch tạm thời chịu thuế phát sinh trong năm là căn cứ để ghi vào cột “Chênh lệch tạm thời chịu thuế tăng” hoặc cột “Chênh lệch tạm thời chịu thuế giảm” trong “Bảng xác định thuế thu nhập hoãn lại phải trả” (Biểu số 02).\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afbb7300-5d8f-11f1-91eb-2dde8ee6b6d8\" class=\"prov-item\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.1.2 – Xác định thuế thu nhập hoãn lại phải trả\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb7300-5d8f-11f1-91eb-2dde8ee6b6d8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Cuối năm, căn cứ vào số chênh lệch tạm thời chịu thuế đã xác định được và các khoản điều chỉnh trực tiếp tăng, giảm số dư đầu năm của Tài khoản “Lợi nhuận chưa phân phối” (do áp dụng hồi tố thay đổi chính sách kế toán hoặc điều chỉnh hồi tố các sai sót trọng yếu của các năm trước, kế toán lập “Bảng xác định thuế thu nhập hoãn lại phải trả” (Biểu số 02) làm căn cứ ghi nhận và trình bày thuế thu nhập hoãn lại phải trả trên báo cáo tài chính riêng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb7300-5d8f-11f1-91eb-2dde8ee6b6d8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- “Bảng xác định thuế thu nhập hoãn lại phải trả” là bảng tổng hợp để xác định thuế thu nhập hoãn lại phải trả được ghi nhận trong năm và xác định thuế thu nhập hoãn lại phải trả giảm do hoàn nhập các khoản chênh lệch tạm thời chịu thuế của các năm trước.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb7300-5d8f-11f1-91eb-2dde8ee6b6d8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBIỂU SỐ 02\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb7300-5d8f-11f1-91eb-2dde8ee6b6d8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBẢNG XÁC ĐỊNH THUẾ THU NHẬP HOÃN LẠI PHẢI TRẢ\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb7300-5d8f-11f1-91eb-2dde8ee6b6d8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNăm....\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" width=\"715\" style=\"text-align: justify; border-collapse: collapse; width: 100%; border-width: 1px; border-spacing: 0px;\" id=\"afbb7300-5d8f-11f1-91eb-2 3cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCộng\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb7300-5d8f-11f1-91eb-2dde8ee6b6d8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ePhương pháp lập biểu số 02\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb7300-5d8f-11f1-91eb-2dde8ee6b6d8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e* Căn cứ để lập “Bảng xác định thuế thu nhập hoãn lại phải trả” là “Bảng xác định chênh lệch tạm thời chịu thuế” (Biểu số 01).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb7300-5d8f-11f1-91eb-2dde8ee6b6d8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e* Căn cứ để ghi vào cột 1 – “Chênh lệch tạm thời chịu thuế trong năm/ tăng” là cột 3 và cột 4 trong “Bảng xác định chênh lệch tạm thời chịu thuế” phát sinh trong năm hiện tại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb7300-5d8f-11f1-91eb-2dde8ee6b6d8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e* Căn cứ để ghi vào cột 2 – “Chênh lệch tạm thời chịu thuế trong năm/ giảm” là cột 5 và cột 6 trong “Bảng xác định chênh lệch tạm thời chịu thuế” của năm hiện tại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb7300-5d8f-11f1-91eb-2dde8ee6b6d8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e* Cột 3 và cột 4 “Chênh lệch tăng”, “Chênh lệch giảm” là số chênh lệch giữa cột 1 và 2.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb7300-5d8f-11f1-91eb-2dde8ee6b6d8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e* Cột 6 được lập căn cứ vào cột 3 và cột 5 trên dòng diễn giải số 1: Cột 6 = Cột 3 x cột 5, làm cơ sở ghi vào chi phí thuế thu nhập doanh nghiệp hoãn lại và ghi nhận thuế thu nhập hoãn lại phải trả.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb7300-5d8f-11f1-91eb-2dde8ee6b6d8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e* Cột 7 được lập căn cứ vào cột 3 và cột 5 trên dòng diễn giải số 2: Cột 7 = Cột 3 x cột 5, làm cơ sở ghi giảm vốn chủ sở hữu và ghi nhận thuế thu nhập hoãn lại phải trả.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb7300-5d8f-11f1-91eb-2dde8ee6b6d8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e* Cột 8 được lập căn cứ vào cột 4 và cột 5 trên dòng diễn giải số 1: Cột 8 = Cột 4 x cột 5, làm cơ sở ghi giảm chi phí thuế thu nhập doanh nghiệp hoãn lại và ghi giảm thuế thu nhập hoãn lại phải trả.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb7300-5d8f-11f1-91eb-2dde8ee6b6d8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e* Cột 9 được lập căn cứ vào cột 4 và cột 5 trên dòng diễn giải số 2: Cột 9 = Cột 4 x cột 5, làm cơ sở ghi tăng vốn chủ sở hữu và ghi giảm thuế thu nhập hoãn lại phải trả.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb7300-5d8f-11f1-91eb-2dde8ee6b6d8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ: Xác định thuế thu nhập hoãn lại phải trả phát sinh từ chênh lệch tạm thời chịu thuế\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb7300-5d8f-11f1-91eb-2dde8ee6b6d8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eMột tài sản cố định có nguyên giá là 150, giá trị còn lại là 100; Khấu hao luỹ kế cho\u0026nbsp; mục đích tính thuế thu nhập là 90 và thuế suất thuế thu nhập doanh nghiệp là 28%.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb7300-5d8f-11f1-91eb-2dde8ee6b6d8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCơ sở tính thuế thu nhập của tài sản là 60 (Nguyên giá 150 trừ khấu hao luỹ kế cho mục đích tính thuế 90). Để thu hồi giá trị ghi sổ 100 này, doanh nghiệp phải có thu nhập chịu thuế là 100, nhưng chỉ có thể có khấu hao cho mục đích tính thuế là 60. Chênh lệch giữa giá trị ghi sổ 100 và cơ sở tính thuế 60 là khoản chênh lệch tạm thời chịu thuế 40. Doanh nghiệp sẽ nộp thuế thu nhập doanh nghiệp là 11,2 (40 x 28%) khi doanh nghiệp thu hồi giá trị ghi sổ của tài sản này. Vì vậy, doanh nghiệp ghi nhận một khoản nợ thuế thu nhập hoãn lại phải trả là 11,2 thể hiện phần thuế thu nhập doanh nghiệp mà doanh nghiệp sẽ phải nộp khi doanh nghiệp thu hồi được giá trị ghi sổ của tài sản.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\" class=\"prov-item\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.1.3 - Bổ sung Tài khoản 347 – “Thuế thu nhập hoãn lại phải trả”\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTài khoản này dùng để phản ánh giá trị hiện có và tình hình biến động của thuế thu nhập doanh nghiệp hoãn lại phải trả.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eHẠCH TOÁN TÀI KHOẢN NÀY CẦN TÔN TRỌNG MỘT SỐ QUY ĐỊNH SAU:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1 - Thuế thu nhập hoãn lại phải trả phải được ghi nhận cho tất cả các khoản chênh lệch tạm thời chịu thuế, trừ khi thuế thu nhập hoãn lại phải trả phát sinh từ ghi nhận ban đầu của một tài sản hay nợ phải trả của một giao dịch mà giao dịch này không có ảnh hưởng đến lợi nhuận kế toán hoặc lợi nhuận tính thuế thu nhập (hoặc lỗ tính thuế) tại thời điểm phát sinh giao dịch.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2 - Tại ngày kết thúc năm tài chính, kế toán phải xác định các khoản chênh lệch tạm thời chịu thuế phát sinh trong năm hiện tại làm căn cứ xác định số thuế thu nhập hoãn lại phải trả được ghi nhận trong năm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3 - Việc ghi nhận thuế thu nhập hoãn lại phải trả trong năm được thực hiện theo nguyên tắc bù trừ giữa số thuế thu nhập hoãn lại phải trả phát sinh trong năm nay với số thuế thu nhập hoãn lại phải trả đã ghi nhận từ các năm trước nhưng năm nay được ghi giảm (hoàn nhập), theo nguyên tắc:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Nếu số thuế thu nhập hoãn lại phải trả phát sinh trong năm lớn hơn số thuế thu nhập hoãn lại phải trả được hoàn nhập trong năm, kế toán chỉ ghi nhận bổ sung số thuế thu nhập hoãn lại phải trả là số chênh lệch giữa số thuế thu nhập hoãn lại phải trả phát sinh lớn hơn số được hoàn nhập trong năm;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Nếu số thuế thu nhập hoãn lại phải trả phát sinh trong năm nhỏ hơn số thuế thu nhập hoãn lại phải trả được hoàn nhập trong năm, kế toán chỉ ghi giảm (hoàn nhập) số thuế thu nhập hoãn lại phải trả là số chênh lệch giữa số thuế thu nhập hoãn lại phải trả phát sinh nhỏ hơn số được hoàn nhập trong năm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4- Thuế thu nhập hoãn lại phải trả phát sinh trong năm không liên quan đến các khoản mục được ghi nhận trực tiếp vào vốn chủ sở hữu phải được ghi nhận là chi phí thuế thu nhập doanh nghiệp hoãn lại phát sinh trong năm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5- Kế toán phải ghi giảm thuế thu nhập hoãn lại phải trả khi các khoản chênh lệch tạm thời phải chịu thuế không còn ảnh hưởng tới lợi nhuận tính thuế (Khi tài sản được thu hồi hoặc nợ phải trả được thanh toán).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e6- Trường hợp việc áp dụng hồi tố thay đổi chính sách kế toán hoặc điều chỉnh hồi tố các sai sót trọng yếu phát sinh từ các năm trước làm phát sinh khoản chênh lệch tạm thời chịu thuế, kế toán phải điều chỉnh tăng khoản thuế thu nhập hoãn lại phải trả cho các năm trước bằng cách điều chỉnh giảm số dư Có (hoặc tăng số dư Nợ) đầu năm của TK 421 - Lợi nhuận chưa phân phối (TK 4211 - Lợi nhuận chưa phân phối năm trước) và điều chỉnh số dư Có đầu năm TK 347 - Thuế thu nhập hoãn lại phải trả.\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eKẾT CẤU VÀ NỘI DUNG PHẢN ÁNH CỦA TÀI KHOẢN 347 – THUẾ THU NHẬP HOÃN LẠI PHẢI TRẢ\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBên Nợ:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eThuế thu nhập hoãn lại phải trả giảm (được hoàn nhập) trong kỳ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBên Có:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eThuế thu nhập hoãn lại phải trả được ghi nhận trong kỳ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố dư bên Có:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Thuế thu nhập hoãn lại phải trả còn lại cuối kỳ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Điều chỉnh số dư đầu năm đối với thuế thu nhập hoãn lại phải trả do áp dụng hồi tố chính sách kế toán hoặc sửa chữa hồi tố các sai sót trọng yếu của các năm trước\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ePHƯƠNG PHÁP HẠCH TOÁN KẾ TOÁN MỘT SỐ HOẠT ĐỘNG KINH TẾ CHỦ YẾU\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1 – Trường hợp thuế thu nhập hoãn lại phải trả phát sinh từ các giao dịch trong năm được ghi nhận vào chi phí thuế thu nhập doanh nghiệp hoãn lại: Cuối năm tài chính, kế toán căn cứ “Bảng xác định thuế thu nhập hoãn lại phải trả” để ghi nhận thuế thu nhập hoãn lại phải trả phát sinh từ các giao dịch trong năm vào chi phí thuế thu nhập doanh nghiệp hoãn lại:\u0026nbsp;\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.1 - Nếu số thuế thu nhập hoãn lại phải trả phát sinh trong năm lớn hơn số thuế thu nhập hoãn lại phải trả được hoàn nhập trong năm, kế toán chỉ ghi nhận bổ sung số thuế thu nhập hoãn lại phải trả là số chênh lệch giữa số thuế thu nhập hoãn lại phải trả phát sinh lớn hơn số được hoàn nhập trong năm, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 8212 – Chi phí thuế thu nhập doanh nghiệp hoãn lại\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 347 – Thuế thu nhập hoãn lại phải trả.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.2 - Nếu số thuế thu nhập hoãn lại phải trả phát sinh trong năm nhỏ hơn số thuế thu nhập hoãn lại phải trả được hoàn nhập trong năm, kế toán chỉ ghi giảm (hoàn nhập) số thuế thu nhập hoãn lại phải trả là số chênh lệch giữa số thuế thu nhập hoãn lại phải trả phát sinh nhỏ hơn số được hoàn nhập trong năm, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 347 – Thuế thu nhập doanh nghiệp hoãn lại phải trả\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 8212 – Chi phí thuế thu nhập doanh nghiệp hoãn lại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2 – Trường hợp thuế thu nhập hoãn lại phải trả phát sinh từ việc áp dụng hồi tố thay đổi chính sách kế toán hoặc điều chỉnh hồi tố các sai sót trọng yếu của các năm trước: Cuối năm tài chính, kế toán căn cứ “Bảng xác định thuế thu nhập hoãn lại phải trả” đã được lập làm căn cứ ghi nhận hoặc hoàn nhập thuế thu nhập hoãn lại phải trả phát sinh từ các giao dịch được điều chỉnh vào lợi nhuận chưa phân phối của các năm trước.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Trường hợp phải điều chỉnh tăng thuế thu nhập hoãn lại phải trả, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTăng số dư Nợ đầu năm TK 4211 - Lợi nhuận chưa phân phối năm trước\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(Nếu TK 4211 có số dư Nợ), hoặc\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiảm số dư Có đầu năm TK 4211 - Lợi nhuận chưa phân phối năm trước\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(Nếu TK 4211 có số dư Có)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e Tăng số dư Có đầu năm TK 347 – Thuế thu nhập hoãn lại phải trả.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Trường hợp phải điều chỉnh giảm thuế thu nhập hoãn lại phải trả, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiảm số dư Có đầu năm TK 347 – Thuế thu nhập hoãn lại phải trả\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTăng số dư Có đầu năm TK 4211 - Lợi nhuận chưa phân phối năm trước\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(Nếu TK 4211 có số dư Có), hoặc\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e Giảm số dư Nợ đầu năm TK 4211 - Lợi nhuận chưa phân phối năm trước\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"afbb9a10-5d8f-11f1-b14d-2f3fce509269\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(Nếu TK 4211 có số dư Nợ)\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06b005c0-5d97-11f1-9230-9f134ed432b8\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.2 – Phương pháp xác định và kế toán “Tài sản thuế thu nhập hoãn lại”\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06b0f020-5d97-11f1-8830-5fa41b5b1ac4\" class=\"prov-item\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.2.1 – Xác định các khoản chênh lệch tạm thời được khấu trừ:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b0f020-5d97-11f1-8830-5fa41b5b1ac4\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Cuối năm tài chính, kế toán phải xác định cơ sở tính thuế của tài sản và các khoản nợ phải trả làm căn cứ xác định các khoản chênh lệch tạm thời được khấu trừ. Việc xác định các khoản chênh lệch tạm thời được khấu trừ được thực hiện theo quy định tại Mục I của Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b0f020-5d97-11f1-8830-5fa41b5b1ac4\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Các khoản chênh lệch tạm thời được khấu trừ được sử dụng làm căn cứ xác định tài sản thuế thu nhập hoãn lại phát sinh trong năm trên báo cáo tài chính riêng (không bao gồm các khoản chênh lệch tạm thời được khấu trừ phát sinh từ các khoản đầu tư vào công ty con, công ty liên kết, công ty liên doanh và việc chuyển đổi báo cáo tài chính của cơ sở ở nước ngoài) phải được phản ánh vào “Bảng xác định chênh lệch tạm thời được khấu trừ” phát sinh trong năm (Biểu số 03) làm cơ sở xác định tài sản thuế thu nhập hoãn lại nếu doanh nghiệp dự tính là chắc chắn sẽ có đủ lợi nhuận tính thuế thu nhập trong tương lai để sử dụng các khoản chênh lệch tạm thời được khấu trừ đó.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b0f020-5d97-11f1-8830-5fa41b5b1ac4\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- “Bảng xác định chênh lệch tạm thời được khấu trừ” dùng để phản ánh chi tiết từng khoản chênh lệch tạm thời được khấu trừ phát sinh trong năm làm cơ sở xác định và phản ánh tài sản thuế thu nhập hoãn lại vào “Bảng xác định tài sản thuế thu nhập hoãn lại” (Biểu số 05).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b0f020-5d97-11f1-8830-5fa41b5b1ac4\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBIỂU SỐ 03\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b0f020-5d97-11f1-8830-5fa41b5b1ac4\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBẢNG XÁC ĐỊNH CHÊNH LỆCH TẠM THỜI ĐƯỢC KHẤU TRỪ\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b0f020-5d97-11f1-8830-5fa41b5b1ac4\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cem\u003eNăm............\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" width=\"704\" style=\"text-align: justify; border-collapse: collapse; width: 100%; border-width: 1px; border-spacing: 0px;\" id=\"06b0f020-5d97-11f1-8830-5fa41b5b1ac4\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd colspan=\"4\"\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChênh lệch tạm thời được khấu trừ phát sinh trong năm\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd colspan=\"2\"\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTăng\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd colspan=\"2\"\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiảm\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\   \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b0f020-5d97-11f1-8830-5fa41b5b1ac4\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e* Căn cứ để lập Bảng xác định chênh lệch tạm thời được khấu trừ là số chênh lệch tạm thời được khấu trừ phát sinh trong năm liên quan đến từng tài sản hoặc khoản nợ phải trả hoặc từng giao dịch.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b0f020-5d97-11f1-8830-5fa41b5b1ac4\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e* Dòng tổng cộng chênh lệch tạm thời được khấu trừ phát sinh trong năm là căn cứ để ghi vào Cột “Chênh lệch tạm thời được khấu trừ/ tăng” hoặc Cột “Chênh lệch tạm thời được khấu trừ/ giảm” trong “Bảng xác định tài sản thuế thu nhập hoãn lại” (Biểu số 05).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b0f020-5d97-11f1-8830-5fa41b5b1ac4\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Trường hợp doanh nghiệp không có khả năng chắc chắn sẽ có được lợi nhuận tính thuế trong tương lai, kế toán không được ghi nhận tài sản thuế thu nhập hoãn lại tính trên các khoản chênh lệch tạm thời được khấu trừ phát sinh trong năm. Toàn bộ các khoản chênh lệch tạm thời được khấu trừ này được theo dõi riêng trên “Bảng theo dõi chênh lệch tạm thời được khấu trừ chưa sử dụng” (Biểu số 04) làm căn cứ xác định tài sản thuế thu nhập hoãn lại trong các năm sau, khi doanh nghiệp có đủ lợi nhuận chịu thuế thu nhập để thu hồi tài sản thuế thu nhập hoãn lại này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b0f020-5d97-11f1-8830-5fa41b5b1ac4\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBIỂU SỐ 04\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b0f020-5d97-11f1-8830-5fa41b5b1ac4\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBẢNG THEO DÕI CHÊNH LỆCH TẠM THỜI ĐƯỢC KHẤU TRỪ CHƯA SỬ DỤNG\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b0f020-5d97-11f1-8830-5fa41b5b1ac4\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cem\u003eNăm.......\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"text-align: justify; width: 100%; height: 525px;\" id=\"06b0f020-5d97-11f1-8830-5fa41b5b1ac4\"\u003e\n   \u003ctbody\u003e\n    \u003ctr style=\"height: 50px;\"\u003e\n     \u003ctd style=\"width: 3.35048%;\"\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 9.34732%;\"\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd colspan=\"2\" style=\"width: 86.6693%;\"\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChênh lệch tạm thời được khấu trừ chưa sử dụng\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr style=\"height: 162px;\"\u003e\n     \u003ctd style=\"wid p dự tính là chắc chắn sẽ có đủ lợi nhuận tính thuế thu nhập trong tương lai để sử dụng các khoản lỗ tính thuế từ các năm trước đó. Tài sản thuế thu nhập hoãn lại tính trên các khoản lỗ tính thuế chưa sử dụng trong năm tài chính hiện hành được xác định theo công thức sau:\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"653\" style=\"text-align: justify;\" id=\"06b29dd0-5d97-11f1-888e-1796d87ef3a0\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTài sản thuế thu nhập hoãn lại tính trên các khoản lỗ tính thuế chưa sử dụng\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e=\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u0026nbsp; Giá trị được khấu trừ vào các năm tiếp sau của các khoản lỗ tính thuế chưa sử dụng\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e x\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eThuế suất\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ethuế thu nhập doanh nghiệp hiện hành\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b29dd0-5d97-11f1-888e-1796d87ef3a0\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e– Xác định giá trị tài sản thuế thu nhập hoãn lại phát sinh từ các khoản ưu đãi thuế chưa sử dụng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b29dd0-5d97-11f1-888e-1796d87ef3a0\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCuối năm tài chính, căn cứ các khoản ưu đãi thuế theo luật định (nếu có) chưa sử dụng kế toán xác định và ghi nhận tài sản thuế thu nhập hoãn lại trong năm hiện hành, nếu doanh nghiệp dự tính chắc chắn có đủ lợi nhuận tính thuế thu nhập trong tương lai để sử dụng các khoản ưu đãi thuế chưa sử dụng từ các năm trước đó. Tài sản thuế thu nhập hoãn lại tính trên các khoản ưu đãi thuế chưa sử dụng trong năm tài chính hiện hành được xác định theo công thức:\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"631\" style=\"text-align: justify;\" id=\"06b29dd0-5d97-11f1-888e-1796d87ef3a0\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTài sản thuế thu nhập hoãn lại tính trên các khoản ưu đãi thuế chưa sử dụng\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e =\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e Giá trị được khấu trừ của các khoản ưu đãi thuế chưa sử dụng\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ex\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp; Thuế suất thuế thu nhập doanh nghiệp hiện hành\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp id=\"06b38830-5d97-11f1-bc05-bb24d9620e87\" class=\"prov-item\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.2.3 – Xác định tài sản thuế thu nhập hoãn lại phát sinh trong năm\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b38830-5d97-11f1-bc05-bb24d9620e87\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Cuối năm tài chính, kế toán lập “Bảng xác định tài sản thuế thu nhập hoãn lại” (Biểu số 05) làm căn cứ ghi nhận và trình bày tài sản thuế thu nhập doanh nghiệp hoãn lại trên báo cáo tài chính. Bảng xác định tài sản thuế thu nhập hoãn lại là bảng tổng hợp để xác định tài sản thuế thu nhập hoãn lại được ghi nhận trong năm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b38830-5d97-11f1-bc05-bb24d9620e87\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBIỂU SỐ 05\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b38830-5d97-11f1-bc05-bb24d9620e87\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBẢNG XÁC ĐỊNH TÀI SẢN THUẾ THU NHẬP HOÃN LẠI\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class

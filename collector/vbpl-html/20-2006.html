003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b38830-5d97-11f1-bc05-bb24d9620e87\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ePhương pháp lập biểu số 05\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b38830-5d97-11f1-bc05-bb24d9620e87\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e* Căn cứ để lập “Bảng xác định tài sản thuế thu nhập hoãn lại” là “Bảng xác định chênh lệch tạm thời được khấu trừ” (Biểu số 03), giá trị được khấu trừ của các khoản lỗ tính thuế và ưu đãi thuế chưa sử dụng từ các năm trước chuyển sang năm hiện tại;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b38830-5d97-11f1-bc05-bb24d9620e87\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e* Căn cứ để ghi vào cột 1 – “Chênh lệch tạm thời được khấu trừ trong năm tăng” là cột 3 và cột 4 trong “Bảng xác định chênh lệch tạm thời được khấu trừ” phát sinh trong năm;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b38830-5d97-11f1-bc05-bb24d9620e87\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e* Căn cứ để ghi vào cột 2 – “Chênh lệch tạm thời được khấu trừ trong năm giảm” là cột 5 và cột 6 trong “Bảng xác định chênh lệch tạm thời được khấu trừ” phát sinh trong năm;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b38830-5d97-11f1-bc05-bb24d9620e87\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e* Cột 3 và cột 4 “Chênh lệch tăng”, “Chênh lệch giảm” là số chênh lệch giữa cột 1 và 2.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b38830-5d97-11f1-bc05-bb24d9620e87\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e* Cột 5 được lập căn cứ vào số lỗ phát sinh trong năm nay hoặc các năm trước được khấu trừ vào thu nhập chịu thuế trong năm sau (theo quy định chuyển lỗ tính thuế của Luật thuế thu nhập doanh nghiệp (trường hợp được chuyển lỗ).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b38830-5d97-11f1-bc05-bb24d9620e87\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e* Cột 6 được lập căn cứ vào số lỗ tính thuế của năm trước đã được khấu trừ vào thu nhập chịu thuế năm nay.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b38830-5d97-11f1-bc05-bb24d9620e87\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e* Cột 7 được lập căn cứ vào giá trị ưu đãi thuế chưa sử dụng trong năm nay được khấu trừ vào thu nhập chịu thuế trong năm sau.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b38830-5d97-11f1-bc05-bb24d9620e87\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e* Cột 8 được lập căn cứ vào giá trị ưu đãi thuế của năm trước đã được khấu trừ vào thu nhập chịu thuế năm nay.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b38830-5d97-11f1-bc05-bb24d9620e87\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e* Cột 10 được lập căn cứ vào cột 3, cột 5, cột 7 và cột 9 trên dòng diễn giải số 1: Cột 10 = (Cột 3 + cột 5 + cột 7) x cột 9, làm cơ sở ghi giảm chi phí thuế thu nhập doanh nghiệp hoãn lại trong năm, ghi tăng tài sản thuế thu nhập hoãn lại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b38830-5d97-11f1-bc05-bb24d9620e87\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e* Cột 11: Căn cứ vào cột 3 và cột 9 trên dòng diễn giải số 2: Cột 11 = cột 3 x cột 9, làm cơ sở ghi tăng lợi nhuận chưa phân phối (chi tiết lợi nhuận chưa phân phối năm trước), ghi tăng tài sản thuế thu nhập hoãn lại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b38830-5d97-11f1-bc05-bb24d9620e87\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e* Cột 12 được lập căn cứ vào cột 4, cột 6, cột 8 và cột 9 trên dòng diễn giải số 1: Cột 12 = (Cột 4 + cột 6 + cột 8) x cột 9, làm cơ sở ghi vào chi phí thuế thu nhập doanh nghiệp hoãn lại trong năm và ghi giảm tài sản thuế thu nhập hoãn lại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b38830-5d97-11f1-bc05-bb24d9620e87\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e* Cột 13: Căn cứ vào cột 4 và cột 9 trên dòng diễn giải số 2: Cột 13 = cột 4 x cột 9, làm cơ sở ghi giảm lợi nhuận chưa phân phối (chi tiết lợi nhuận chưa phân phối năm trước) và ghi giảm tài sản thuế thu nhập hoãn lại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b38830-5d97-11f1-bc05-bb24d9620e87\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ về xác định tài sản thuế thu nhập hoãn lại phát sinh từ các khoản chênh lệch tạm thời được khấu trừ\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b38830-5d97-11f1-bc05-bb24d9620e87\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eMột doanh nghiệp ghi nhận một khoản nợ phải trả là chi phí phải trả về bảo hành sản phẩm có giá trị 100. Nhưng cho mục đích tính thuế thu nhập, chi phí bảo hành sản phẩm này chỉ được khấu trừ khi doanh nghiệp phát sinh chi phí bảo hành sản phẩm. Thuế suất thuế thu nhập doanh nghiệp là 28%.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b38830-5d97-11f1-bc05-bb24d9620e87\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCơ sở tính thuế của khoản nợ phải trả này là không (giá trị ghi sổ 100, trừ đi phần giá trị của khoản nợ phải trả 100 sẽ được khấu trừ cho mục đích tính thuế trong tương lai). Chênh lệch giữa giá trị ghi sổ 100 và cơ sở tính thuế 0, là chênh lệch tạm thời được khấu trừ 100. Khi thanh toán nợ phải trả theo giá trị ghi sổ, doanh nghiệp sẽ được giảm lợi nhuận tính thuế trong tương lai với giá trị 100 và do đó thuế thu nhập doanh nghiệp giảm 28 (28% x 100). Vì vậy, doanh nghiệp ghi nhận tài sản thuế thu nhập hoãn lại là 28, với điều kiện doanh nghiệp chắc chắn sẽ có đủ lợi nhuận tính thuế thu nhập trong tương lai để có thể hưởng lợi từ việc giảm thuế thu nhập doanh nghiệp trong tương lai.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\" class=\"prov-item\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.2.4 - Bổ sung Tài khoản 243 – “Tài sản thuế thu nhập hoãn lại”\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTài khoản này dùng để phản ánh giá trị hiện có và tình hình biến động của tài sản thuế thu nhập hoãn lại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eHẠCH TOÁN TÀI KHOẢN NÀY CẦN TÔN TRỌNG MỘT SỐ QUY ĐỊNH SAU:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1 – Doanh nghiệp chỉ được ghi nhận tài sản thuế thu nhập hoãn lại đối với các khoản chênh lệch tạm thời được khấu trừ, giá trị được khấu trừ của khoản lỗ tính thuế và ưu đãi về thuế chưa sử dụng từ các năm trước chuyển sang năm hiện tại trong trường hợp doanh nghiệp dự tính chắc chắn có được lợi nhuận tính thuế thu nhập trong tương lai để sử dụng các khoản chênh lệch tạm thời được khấu trừ, các khoản lỗ tính thuế và ưu đãi thuế chưa sử dụng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2 – Cuối năm tài chính, doanh nghiệp phải lập “Bảng xác định chênh lệch tạm thời được khấu trừ”, “Bảng theo dõi chênh lệch tạm thời được khấu trừ chưa sử dụng”, giá trị được khấu trừ chuyển sang năm sau của các khoản lỗ tính thuế và ưu đãi thuế chưa sử dụng làm căn cứ lập “Bảng xác định tài sản thuế thu nhập hoãn lại” để xác định giá trị tài sản thuế thu nhập hoãn lại được ghi nhận hoặc hoàn nhập trong năm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3 - Việc ghi nhận tài sản thuế thu nhập hoãn lại trong năm được thực hiện theo nguyên tắc bù trừ giữa tài sản thuế thu nhập hoãn lại phát sinh trong năm nay với tài sản thuế thu nhập doanh nghiệp đã ghi nhận từ các năm trước nhưng năm nay được hoàn nhập lại, cụ thể là:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Nếu tài sản thuế thu nhập hoãn lại phát sinh trong năm lớn hơn tài sản thuế thu nhập hoãn lại được hoàn nhập trong năm, kế toán ghi nhận bổ sung giá trị tài sản thuế thu nhập hoãn lại là số chênh lệch giữa số tài sản thuế thu nhập hoãn lại phát sinh lớn hơn số được hoàn nhập trong năm, nếu chắc chắn rằng trong tương lai doanh nghiệp có đủ\u0026nbsp; lợi nhuận tính thuế để thu hồi tài sản thuế thu nhập hoãn lại được ghi nhận trong năm hiện tại. Trường hợp doanh nghiệp không chắc chắn sẽ có được lợi nhuận chịu thuế trong tương lai, kế toán không được ghi nhận tài sản thuế thu nhập hoãn lại tính trên các khoản chênh lệch tạm thời được khấu trừ phát sinh trong năm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Nếu tài sản thuế thu nhập hoãn lại được ghi nhận trong năm nhỏ hơn tài sản thuế thu nhập hoãn lại được hoàn nhập trong năm, kế toán ghi giảm tài sản thuế thu nhập hoãn lại là số chênh lệch giữa số tài sản thuế thu nhập hoãn lại phát sinh nhỏ hơn số được hoàn nhập trong năm. Việc ghi giảm tài sản thuế thu nhập hoãn lại phải được thực hiện phù hợp với thời gian mà các khoản chênh lệch tạm thời được khấu trừ (phát sinh từ các năm trước) được hoàn nhập kể cả khi doanh nghiệp không có lợi nhuận.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4 - Trường hợp việc áp dụng hồi tố thay đổi chính sách kế toán hoặc điều chỉnh hồi tố các sai sót trọng yếu phát sinh từ các năm trước làm phát sinh khoản chênh lệch tạm thời được khấu trừ, kế toán phải ghi nhận bổ sung tài sản thuế thu nhập hoãn lại của các năm trước bằng cách điều chỉnh tăng số dư Có (hoặc giảm số dư Nợ) đầu năm TK 421 - Lợi nhuận chưa phân phối (TK 4211 - Lợi nhuận chưa phân phối năm nay) và điều chỉnh tăng số dư Nợ đầu năm TK 243 – Tài sản thuế thu nhập hoãn lại.\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5 - Kết thúc năm tài chính, doanh nghiệp phải đánh giá các tài sản thuế thu nhập hoãn lại chưa được ghi nhận từ các năm trước khi dự tính chắc chắn có được lợi nhuận tính thuế thu nhập trong tương lai để cho phép tài sản thuế hoãn lại được thu hồi.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eKẾT CẤU VÀ NỘI DUNG PHẢN ÁNH CỦA TÀI KHOẢN 243 – “TÀI SẢN THUẾ THU NHẬP HOÃN LẠI”\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBên Nợ:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiá trị tài sản thuế thu nhập hoãn lại tăng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBên Có:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiá trị tài sản thuế thu nhập hoãn lại giảm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố dư bên Nợ:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giá trị tài sản thuế thu nhập hoãn lại còn lại cuối năm;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Điều chỉnh số dư đầu năm đối với tài sản thuế thu nhập hoãn lại được ghi nhận (hoặc hoàn nhập) trong năm do áp dụng hồi tố chính sách kế toán hoặc sửa chữa hồi tố các sai sót trọng yếu của các năm trước.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ePHƯƠNG PHÁP HẠCH TOÁN KẾ TOÁN MỘT SỐ HOẠT ĐỘNG KINH TẾ CHỦ YẾU\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1 – Trường hợp tài sản thuế thu nhập hoãn lại phát sinh từ các giao dịch được ghi nhận vào chi phí thuế thu nhập hoãn lại: Cuối năm tài chính, kế toán căn cứ “Bảng xác định tài sản thuế thu nhập hoãn lại” đã được lập làm căn cứ ghi nhận hoặc hoàn nhập tài sản thuế thu nhập hoãn lại phát sinh từ các giao dịch được ghi nhận vào chi phí thuế thu nhập hoãn lại:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.1 - Nếu tài sản thuế thu nhập hoãn lại phát sinh trong năm lớn hơn tài sản thuế thu nhập hoãn lại được hoàn nhập trong năm, kế toán ghi nhận bổ sung giá trị tài sản thuế thu nhập hoãn lại là số chênh lệch giữa số tài sản thuế thu nhập hoãn lại phát sinh lớn hơn số được hoàn nhập trong năm, nếu chắc chắn rằng trong tương lai doanh nghiệp có đủ lợi nhuận tính thuế để thu hồi tài sản thuế thu nhập hoãn lại được ghi nhận trong năm hiện tại, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 243 – Tài sản thuế thu nhập hoãn lại\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 8212 – Chi phí thuế thu nhập doanh nghiệp hoãn lại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.2 - Nếu tài sản thuế thu nhập hoãn lại phát sinh trong năm nhỏ hơn tài sản thuế thu nhập hoãn lại được hoàn nhập trong năm, kế toán ghi giảm tài sản thuế thu nhập hoãn lại là số chênh lệch giữa số tài sản thuế thu nhập hoãn lại phát sinh nhỏ hơn số được hoàn nhập trong năm, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNợ TK 8212 – Chi phí thuế thu nhập doanh nghiệp hoãn lại\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCó TK 243 – Tài sản thuế thu nhập hoãn lại\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2 – Trường hợp tài sản thuế thu nhập hoãn lại phát sinh từ việc áp dụng hồi tố chính sách kế toán hoặc điều chỉnh hồi tố sai sót trọng yếu của các năm trước: Cuối năm tài chính, kế toán căn cứ “Bảng xác định tài sản thuế thu nhập hoãn lại” đã được lập làm căn cứ ghi nhận hoặc hoàn nhập tài sản thuế thu nhập hoãn lại phát sinh từ các giao dịch được điều chỉnh vào lợi nhuận chưa phân phối của các năm trước:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.1 - Trường hợp phải điều chỉnh tăng tài sản thuế thu nhập hoãn lại, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTăng số dư Nợ đầu năm TK 243 – Tài sản thuế thu nhập hoãn lại\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTăng số dư Có đầu năm TK 4211 - Lợi nhuận chưa phân phối năm trước\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(Nếu TK 4211 có số dư Có), hoặc\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiảm số dư Nợ đầu năm TK 4211\u0026nbsp; - Lợi nhuận chưa phân phối năm trước\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(Nếu TK 4211 có số dư Nợ)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.2 - Trường hợp phải điều chỉnh giảm tài sản thuế thu nhập hoãn lại, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTăng số dư Nợ đầu năm TK 4211 - Lợi nhuận chưa phân phối năm trước\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(Nếu TK 4211 có số dư Nợ), hoặc\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiảm số dư Có đầu năm TK 4211 - Lợi nhuận chưa phân phối năm trước (Nếu TK 4211 có số dư Có)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b44b80-5d97-11f1-8151-f9bfd90e1708\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiảm số dư Nợ đầu năm TK 243 – Tài sản thuế thu nhập hoãn lại\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06b535e0-5d97-11f1-89f1-c922df12afb5\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3) Kế toán thuế thu nhập hoãn lại phải trả và tài sản thuế thu nhập hoãn lại trên báo cáo tài chính hợp nhất đối với các khoản đầu tư vào công ty con, công ty liên kết và các khoản vốn góp vào cơ sở kinh doanh đồng kiểm soát\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\" class=\"prov-item\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3.1 - Kế toán thuế thu nhập hoãn lại phải trả trên báo cáo tài chính hợp nhất\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3.1.1 – Ghi nhận thuế thu nhập hoãn lại phải trả\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Doanh nghiệp phải ghi nhận thuế thu nhập hoãn lại phải trả phát sinh từ các khoản chênh lệch tạm thời chịu thuế khi lập báo cáo tài chính hợp nhất đối với các khoản đầu tư vào công ty con hoặc áp dụng phương pháp vốn chủ sở hữu đối với khoản đầu tư vào công ty liên kết và khoản vốn góp vào cơ sở kinh doanh đồng kiểm soát ở nước ngoài trên báo cáo tài chính hợp nhất trong trường hợp Việt Nam chưa ký Hiệp định tránh đánh thuế hai lần hoặc có chênh lệch về thuế suất thuế thu nhập doanh nghiệp .\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Chênh lệch tạm thời chịu thuế phát sinh từ các khoản đầu tư vào công ty con, công ty liên kết và khoản vốn góp vào cơ sở kinh doanh đồng kiểm soát có thể phát sinh khi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Cơ quan thuế chỉ đánh thuế đối với khoản thu nhập mà doanh nghiệp được quyền nhận trong năm đã được ghi nhận trên báo cáo tài chính riêng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Doanh nghiệp ghi nhận phần sở hữu trong lợi nhuận (hoặc lỗ) trong công ty con, công ty liên kết, khoản vốn góp vào cơ sở kinh doanh đồng kiểm soát theo phương pháp vốn chủ sở hữu trong Báo cáo kết quả hoạt động kinh doanh hợp nhất.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ xác định thuế thu nhập hoãn lại phải trả phát sinh từ khoản đầu tư vào công ty liên kết ở nước ngoài trên báo cáo tài chính hợp nhất.\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiả sử: Trên báo cáo tài chính hợp nhất năm 2005, doanh nghiệp A là một công ty mẹ ghi nhận thu nhập từ công ty liên kết B ở nước ngoài (Trong trường hợp nước sở tại chưa ký Hiệp định tránh đánh thuế hai lần với Việt Nam) theo phương pháp vốn chủ sở hữu là 50.000.000đ. Tuy nhiên, trên báo cáo tài chính riêng năm 2005, doanh nghiệp đã ghi nhận doanh thu hoạt động tài chính là số cổ tức được quyền nhận 10.000.000đ\u0026nbsp; từ công ty liên kết B. Thuế suất thuế TNDN ở nước ngoài cũng là 28%.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTrường hợp này, khoản chênh lệch tạm thời chịu thuế phát sinh là 40.000.000đ (50.000.000 - 10.000.000). Doanh nghiệp ghi nhận trên báo cáo tài chính hợp nhất thuế thu nhập hoãn lại phải trả và chi phí thuế thu nhập hoãn lại là: 40.000.000 x 28% = 11.200.000đ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Doanh nghiệp phải ghi nhận thuế thu nhập hoãn lại phải trả phát sinh từ các khoản chênh lệch tạm thời chịu thuế khi ghi nhận lợi nhuận theo phương pháp hợp nhất báo cáo tài chính đối với các khoản đầu tư vào công ty con.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ xác định thuế thu nhập hoãn lại phải trả phát sinh từ khoản đầu tư vào công ty con ở nước ngoài\u0026nbsp; trên báo cáo tài chính hợp nhất.\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiả sử: Trên báo cáo tài chính hợp nhất năm 2005, doanh nghiệp A là công ty mẹ\u0026nbsp; ghi nhận thu nhập từ công con C ở nước ngoài (Trong trường hợp nước sở tại chưa ký Hiệp định tránh đánh thuế hai lần với Việt Nam) theo phương pháp hợp nhất là 200.000.000đ. Tuy nhiên, trên báo cáo tài chính riêng năm 2005, doanh nghiệp chỉ ghi nhận doanh thu hoạt động tài chính là số cổ tức được quyền nhận 80.000.000đ từ công ty con C, thuế suất thuế TNDN ở nước ngoài cũng là 28%.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTrường hợp này, khoản chênh lệch tạm thời chịu thuế phát sinh là 120.000.000đ (200.000.000- 80.000.000). Doanh nghiệp ghi nhận trên báo cáo tài chính hợp nhất thuế thu nhập hoãn lại phải trả và chi phí thuế thu nhập hoãn lại là: 120.000.000 x 28% = 33.600.000đ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3.1.2\u0026nbsp; – Phương pháp xác định thuế thu nhập hoãn lại phải trả\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(1) – Xác định các khoản chênh lệch tạm thời chịu thuế:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Cuối năm tài chính, khi lập báo cáo tài chính hợp nhất, kế toán phải xác định các khoản chênh lệch tạm thời chịu thuế phát sinh từ các khoản đầu tư vào công ty con, công ty liên kết, khoản vốn góp vào cơ sở kinh doanh đồng kiểm soát.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Để tổng hợp các khoản chênh lệch tạm thời, doanh nghiệp có thể sử dụng “Bảng xác định chênh lệch tạm thời chịu thuế” với các chỉ tiêu phù hợp (Biểu số 01) quy định tại Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e* Căn cứ để lập “Bảng xác định chênh lệch tạm thời chịu thuế phát sinh khi lập báo cáo tài chính\u0026nbsp; hợp nhất” là số chênh lệch tạm thời chịu thuế phát sinh trong năm liên quan đến từng khoản đầu tư vào công ty con, công ty liên kết, khoản vốn góp vào cơ sở kinh doanh đồng kiểm soát.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(2) – Xác định thuế thu nhập hoãn lại phải trả\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Cuối năm tài chính, căn cứ vào số chênh lệch tạm thời chịu thuế đã xác định được, kế toán xác định thuế thu nhập hoãn lại phải trả làm căn cứ ghi nhận và trình bày thuế thu nhập hoãn lại phải trả trên báo cáo tài chính hợp nhất.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;- Doanh nghiệp có thể sử dụng “Bảng xác định thuế thu nhập hoãn lại phải trả” với các chỉ tiêu phù hợp (Biểu số 02) quy định tại điểm 2.1.2 Mục B Phần I Thông tư này để xác định giá trị thuế thu nhập hoãn lại phải trả được ghi nhận trong năm và xác định giá trị thuế thu nhập hoãn lại phải trả giảm do hoàn nhập các khoản chênh lệch tạm thời chịu thuế của các năm trước.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3.1.3 - Kế toán thuế thu nhập hoãn lại phải trả trên báo cáo tài chính hợp nhất\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Trường hợp phải ghi nhận thuế thu nhập hoãn lại phải trả phát sinh từ các khoản chênh lệch tạm thời chịu thuế gắn liền với các khoản đầu tư vào công ty con, công ty liên kết, khoản vốn góp vào cơ sở kinh doanh đồng kiểm soát, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTăng khoản mục “Chi phí thuế thu nhập doanh nghiệp hoãn lại”\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTăng khoản mục “Thuế thu nhập hoãn lại phải trả”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Trường hợp phải ghi giảm thuế thu nhập hoãn lại phải trả phát sinh từ các khoản chênh lệch tạm thời chịu thuế gắn liền với các khoản đầu tư vào công ty con, công ty liên kết, khoản vốn góp vào cơ sở kinh doanh đồng kiểm soát, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiảm khoản mục “Thuế thu nhập hoãn lại phải trả”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b64750-5d97-11f1-897a-9b8b9a04e541\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiảm khoản mục “Chi phí thuế thu nhập doanh nghiệp hoãn lại”\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06b6e390-5d97-11f1-9478-f10326ca16e8\" class=\"prov-item\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3.2 – Kế toán tài sản thuế thu nhập hoãn lại trên báo cáo tài chính hợp nhất\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b6e390-5d97-11f1-9478-f10326ca16e8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3.2.1 – Ghi nhận tài sản thuế thu nhập hoãn lại trên báo cáo tài chính hợp nhất\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b6e390-5d97-11f1-9478-f10326ca16e8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Doanh nghiệp chỉ ghi nhận tài sản thuế hoãn lại phát sinh từ các khoản chênh lệch tạm thời được khấu trừ khi áp dụng phương pháp hợp nhất hoặc phương pháp vốn chủ sở hữu để kế toán các khoản đầu tư vào công ty con, công ty liên kết, khoản vốn góp vào cơ sở kinh doanh đồng kiểm soát ở nước ngoài trên báo cáo tài chính hợp nhất trong trường hợp Việt Nam chưa ký Hiệp định tránh đánh thuế hai lần hoặc có chênh lệch về thuế suất thuế thu nhập doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b6e390-5d97-11f1-9478-f10326ca16e8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Chênh lệch tạm thời được khấu trừ phát sinh từ các khoản đầu tư vào công ty con, công ty liên kết và khoản vốn góp vào cơ sở kinh doanh đồng kiểm soát khi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b6e390-5d97-11f1-9478-f10326ca16e8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Cơ quan thuế không cho phép khấu trừ khoản lỗ từ công ty con, công ty liên kết, khoản vốn góp vào cơ sở kinh doanh đồng kiểm soát vào thu nhập chịu thuế trong năm của doanh nghiệp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b6e390-5d97-11f1-9478-f10326ca16e8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Doanh nghiệp ghi nhận khoản lỗ là toàn bộ phần sở hữu trong lợi nhuận (hoặc lỗ) trong công ty con, công ty liên kết, khoản vốn góp liên doanh trên báo cáo tài chính hợp nhất.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b6e390-5d97-11f1-9478-f10326ca16e8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ xác định tài sản thuế thu nhập hoãn lại phát sinh từ khoản đầu tư vào công ty liên kết ở nước ngoài trên báo cáo tài chính hợp nhất.\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b6e390-5d97-11f1-9478-f10326ca16e8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTrên báo cáo tài chính hợp nhất năm 2005, doanh nghiệp A ghi nhận khoản lỗ từ công ty liên kết D theo phương pháp vốn chủ sở hữu là 150.000.000đ. Tuy nhiên khoản lỗ này không được khấu trừ vào thu nhập chịu thuế của doanh nghiệp, thuế suất thuế TNDN là 28%.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b6e390-5d97-11f1-9478-f10326ca16e8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTrong trường hợp này, khoản chênh lệch tạm thời được khấu trừ phát sinh là 150.000.000đ. Doanh nghiệp ghi nhận trên Báo cáo kết quả hoạt động kinh doanh hợp nhất tài sản thuế thu nhập hoãn lại và ghi giảm chi phí thuế thu nhập hoãn lại là: 150.000.000 x 28% = 42.000.000đ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b6e390-5d97-11f1-9478-f10326ca16e8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3.2.2 – Phương pháp xác định tài sản thuế thu nhập hoãn lại\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b6e390-5d97-11f1-9478-f10326ca16e8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(1) – Xác định các khoản chênh lệch tạm thời được khấu trừ:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b6e390-5d97-11f1-9478-f10326ca16e8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Cuối mỗi năm tài chính, khi lập báo cáo tài chính hợp nhất, kế toán phải xác định các khoản chênh lệch tạm thời được khấu trừ phát sinh từ các khoản đầu tư vào công ty con, công ty liên kết, khoản vốn góp vào cơ sở kinh doanh đồng kiểm soát.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b6e390-5d97-11f1-9478-f10326ca16e8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Doanh nghiệp có thể sử dụng “Bảng xác định chênh lệch tạm thời được khấu trừ” (Biểu số 03) để phản ánh các khoản chênh lệch tạm thời được khấu trừ khi lập báo cáo tài chính hợp nhất.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b6e390-5d97-11f1-9478-f10326ca16e8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(2) – Xác định giá trị tài sản thuế thu nhập hoãn lại phát sinh trong năm\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b6e390-5d97-11f1-9478-f10326ca16e8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Cuối năm tài chính, căn cứ vào các khoản chênh lệch tạm thời được khấu trừ xác định được khi lập báo cáo tài chính hợp nhất, kế toán xác định tài sản thuế thu nhập hoãn lại để ghi nhận và trình bày tài sản thuế thu nhập hoãn lại trên báo cáo tài chính hợp nhất.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b6e390-5d97-11f1-9478-f10326ca16e8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;- Doanh nghiệp có thể sử dụng “Bảng xác định tài sản thuế thu nhập hoãn lại” (Biểu số 05) để xác định giá trị tài sản thuế thu nhập hoãn lại được ghi nhận trong năm phát sinh từ các khoản chênh lệch\u0026nbsp; tạm thời được khấu trừ và xác định giá trị tài sản thuế thu nhập hoãn lại được ghi giảm do hoàn nhập các khoản chênh lệch tạm thời được khấu trừ của các năm trước khi lập báo cáo tài chính hợp nhất.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b6e390-5d97-11f1-9478-f10326ca16e8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3.2.3 - Kế toán tài sản thuế thu nhập hoãn lại trên báo cáo tài chính hợp nhất\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b6e390-5d97-11f1-9478-f10326ca16e8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Trường hợp phải ghi nhận tài sản thuế thu nhập hoãn lại phát sinh từ các khoản chênh lệch tạm thời được khấu trừ gắn liền với các khoản đầu tư vào công ty con, công ty liên kết, khoản vốn góp vào cơ sở kinh doanh đồng kiểm soát, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b6e390-5d97-11f1-9478-f10326ca16e8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTăng khoản mục “Tài sản thuế thu nhập hoãn lại”\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b6e390-5d97-11f1-9478-f10326ca16e8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiảm khoản mục “Chi phí thuế thu nhập doanh nghiệp hoãn lại”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b6e390-5d97-11f1-9478-f10326ca16e8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Trường hợp phải hoàn nhập tài sản thuế thu nhập hoãn lại phát sinh từ các khoản chênh lệch tạm thời được khấu trừ gắn liền với các khoản đầu tư vào công ty con, công ty liên kết, khoản vốn góp vào cơ sở kinh doanh đồng kiểm soát, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b6e390-5d97-11f1-9478-f10326ca16e8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTăng khoản mục “Chi phí thuế thu nhập doanh nghiệp hoãn lại”\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b6e390-5d97-11f1-9478-f10326ca16e8\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiảm khoản mục “Tài sản thuế thu nhập hoãn lại”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06b7cdf0-5d97-11f1-b1f4-b1f6411fec8c\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4 – Sửa đổi, bổ sung về kế toán lợi nhuận chưa phân phối\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06b86a30-5d97-11f1-b2a7-d7f46b170418\" class=\"prov-item\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4.1 - Lợi nhuận chưa phân phối của doanh nghiệp\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b86a30-5d97-11f1-b2a7-d7f46b170418\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLợi nhuận chưa phân phối của doanh nghiệp là lợi nhuận sau khi trừ (-) chi phí thuế thu nhập doanh nghiệp (theo Chuẩn mực kế toán số 17 “Thuế thu nhập doanh nghiệp” và hướng dẫn tại Thông tư này) sau đó cộng (+) hoặc trừ (-) các khoản điều chỉnh số thuế thu nhập doanh nghiệp hiện hành phải nộp hoặc được hoàn lại và thuế thu nhập hoãn lại phải trả hoặc tài sản thuế thu nhập hoãn lại phát sinh trong năm hiện tại do:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b86a30-5d97-11f1-b2a7-d7f46b170418\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Điều chỉnh số thuế thu nhập hiện hành của các năm trước do áp dụng hồi tố thay đổi chính sách kế toán hoặc điều chỉnh hối tố các sai sót trọng yếu của các năm trước;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b86a30-5d97-11f1-b2a7-d7f46b170418\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Điều chỉnh tài sản thuế thu nhập hoãn lại và thuế thu nhập hoãn lại phải trả phát sinh từ việc áp dụng hồi tố thay đổi chính sách kế toán hoặc điều chỉnh hối tố các sai sót\u0026nbsp; trọng yếu của các năm trước;\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06b92d80-5d97-11f1-97d8-83eeed021c06\" class=\"prov-item\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4.2 - Sửa đổi, bổ sung nội dung phản ánh của Tài khoản 421 “Lợi nhuận chưa phân phối”\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b92d80-5d97-11f1-97d8-83eeed021c06\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1 - Kết quả từ hoạt động kinh doanh của doanh nghiệp phản ánh trên Tài khoản 421 là lợi nhuận hoặc lỗ sau khi trừ (-) chi phí thuế thu nhập doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b92d80-5d97-11f1-97d8-83eeed021c06\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2 - Kế toán không phản ánh vào tài khoản này số thuế thu nhập doanh nghiệp hiện hành phải nộp trong năm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b92d80-5d97-11f1-97d8-83eeed021c06\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3 - Kế toán không phản ánh vào tài khoản này số thuế thu nhập hoãn lại phải trả và tài sản thuế thu nhập hoãn lại phát sinh trong năm hiện hành đã được ghi nhận vào chi phí (hoặc thu nhập) thuế thu nhập hoãn lại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b92d80-5d97-11f1-97d8-83eeed021c06\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4 - Trường hợp doanh nghiệp phải điều chỉnh số dư đầu năm của Tài khoản 421 “Lợi nhuận chưa phân phối” do doanh nghiệp áp dụng hồi tố thay đổi chính sách kế toán hoặc do điều chỉnh hồi tố các sai sót trọng yếu của các năm trước, kế toán phải xác định các ảnh hưởng về thuế thu nhập trong các năm trước làm cơ sở điều chỉnh số dư đầu năm đối với tài sản thuế thu nhập hoãn lại và thuế thu nhập hoãn lại phải trả một cách phù hợp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06b95490-5d97-11f1-9d4e-97a281de64b8\" class=\"prov-clause\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5 -Trình bày báo cáo tài chính\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06b9a2b0-5d97-11f1-aca0-4ff1996e3216\" class=\"prov-item\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5.1 – Trình bày trong Bảng Cân đối kế toán\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b9a2b0-5d97-11f1-aca0-4ff1996e3216\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5.1.1 – Tài sản thuế thu nhập hoãn lại\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b9a2b0-5d97-11f1-aca0-4ff1996e3216\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTài sản thuế thu nhập hoãn lại được trình bày trong chỉ tiêu “Tài sản thuế thu nhập hoãn lại” – Mã số 262 trên Bảng cân đối kế toán.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b9a2b0-5d97-11f1-aca0-4ff1996e3216\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu để ghi vào chỉ tiêu này được căn cứ vào số dư Nợ Tài khoản 243 “Tài sản thuế thu nhập hoãn lại”, trên Sổ Cái.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b9a2b0-5d97-11f1-aca0-4ff1996e3216\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5.1.2 – Thuế thu nhập hoãn lại phải trả\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b9a2b0-5d97-11f1-aca0-4ff1996e3216\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eThuế thu nhập hoãn lại phải trả được trình bày trong chỉ tiêu “Thuế thu nhập hoãn lại phải trả” – Mã số 335 trên Bảng cân đối kế toán.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b9a2b0-5d97-11f1-aca0-4ff1996e3216\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu để ghi vào chỉ tiêu này được căn cứ vào số dư Có Tài khoản 347 – “Thuế thu nhập hoãn lại phải trả”, trên Sổ Cái.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06b9c9c0-5d97-11f1-9d01-6778b675839b\" class=\"prov-item\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5.2 – Trình bày Báo cáo kết quả hoạt động kinh doanh\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b9c9c0-5d97-11f1-9d01-6778b675839b\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSửa đổi chỉ tiêu “Thuế thu nhập doanh nghiệp” (Mã số 51) thành 2 chỉ tiêu: “Chi phí thuế thu nhập doanh nghiệp hiện hành – Mã số 51” và “Chi phí thuế thu nhập doanh nghiệp hoãn lại – Mã số 52” trong Báo cáo kết quả hoạt động kinh doanh.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b9c9c0-5d97-11f1-9d01-6778b675839b\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5.2.1- Chi phí thuế thu nhập doanh nghiệp hiện hành – Mã số 51\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b9c9c0-5d97-11f1-9d01-6778b675839b\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChỉ tiêu này phản ánh chi phí thuế thu nhập doanh nghiệp hiện hành phát sinh trong năm báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b9c9c0-5d97-11f1-9d01-6778b675839b\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu để ghi vào chỉ tiêu này được căn cứ vào tổng số phát sinh bên Có Tài khoản 8211 “Chi phí thuế thu nhập doanh nghiệp hiện hành” đối ứng với bên Nợ TK 911 “Xác định kết quả kinh doanh” trên sổ kế toán chi tiết TK 8211, hoặc căn cứ vào số phát sinh bên Nợ TK 8211 đối ứng với bên Có TK 911 trong kỳ báo cáo trên sổ kế toán chi tiết TK 8211, (trường hợp này số liệu được ghi vào chỉ tiêu này bằng số âm dưới hình thức ghi trong ngoặc đơn (...)).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b9c9c0-5d97-11f1-9d01-6778b675839b\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5.2.2- Chi phí thuế thu nhập doanh nghiệp hoãn lại\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b9c9c0-5d97-11f1-9d01-6778b675839b\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChỉ tiêu này phản ánh chi phí thuế thu nhập doanh nghiệp hoãn lại hoặc thu nhập thuế thu nhập doanh nghiệp hoãn lại phát sinh trong năm báo cáo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06b9c9c0-5d97-11f1-9d01-6778b675839b\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSố liệu để ghi vào chỉ tiêu này được căn cứ vào tổng số phát sinh bên Có Tài khoản 8212 “Chi phí thuế thu nhập doanh nghiệp hoãn lại” đối ứng với bên Nợ TK 911 “Xác định kết quả kinh doanh” trên sổ kế toán chi tiết TK 8211, hoặc căn cứ vào số phát sinh bên Nợ TK 8212 đối ứng với bên Có TK 911 trong kỳ báo cáo, trên sổ kế toán chi tiết TK 8212 (trường hợp này số liệu được ghi vào chỉ tiêu này bằng số âm dưới hình thức ghi trong ngoặc đơn (...)).\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\" class=\"prov-item\" style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5.3 –Trình bày Bản thuyết minh báo cáo tài chính\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5.3.1 - Bổ sung mục 21 Phần V. của Bản thuyết minh báo cáo tài chính:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;a- Tài sản thuế thu nhập hoãn lại:\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" width=\"600\" style=\"text-align: justify; border-collapse: collapse; width: 100%; border-width: 1px; border-spacing: 0px;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCuối năm\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003 \"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Thu nhập thuế thu nhập doanh nghiệp hoãn lại phát sinh từ việc hoàn nhập thuế thu nhập hoãn lại phải trả\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(…)\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(…)\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tổng chi phí thuế thu nhập doanh nghiệp hoãn lại\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e…\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e…\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5.3.4 – Doanh nghiệp phải giải trình riêng rẽ các thông tin sau trong Bản thuyết minh báo cáo tài chính.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTổng số thuế thu nhập doanh nghiệp hiện hành và thuế thu nhập hoãn lại liên quan đến các khoản mục được ghi nhận vào vốn chủ sở hữu;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiải thích mối quan hệ giữa chi phí (hoặc thu nhập) thuế thu nhập doanh nghiệp và lợi nhuận kế toán theo một hoặc cả hai hình thức sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eĐối chiếu bằng số giữa chi phí (hoặc thu nhập) thuế TNDN và tích số của lợi nhuận kế toán nhân (x) với thuế suất áp dụng; hoặc\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eĐối chiếu bằng số giữa thuế suất hiệu quả bình quân với thuế suất áp dụng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiá trị (ngày đáo hạn, nếu có) của các chênh lệch tạm thời được khấu trừ, lỗ tính thuế chưa sử dụng và các ưu đãi thuế chưa sử dụng mà chưa tài sản thuế thu nhập hoãn lại nào được ghi nhận vào Bảng cân đối kế toán;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChênh lệch tạm thời, mỗi loại lỗ tính thuế chưa sử dụng cũng như các ưu đãi thuế chưa sử dụng;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiá trị của tài sản thuế thu nhập hoãn lại và thuế thu nhập hoãn lại phải trả được ghi nhận trên Bảng cân đối kế toán của từng năm sử dụng;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiá trị thu nhập hoặc chi phí thuế TNDN hoãn lại được ghi nhận vào Báo cáo kết quả hoạt động kinh doanh, nếu điều này không được phản ánh rõ từ các thay đổi của các giá trị được ghi nhận trong Bảng cân đối kế toán;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eg) Doanh nghiệp phải trình bày giá trị của tài sản thuế thu nhập hoãn lại và bằng chứng cho việc ghi nhận, khi:\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp; - Việc sử dụng tài sản thuế thu nhập hoãn lại phụ thuộc vào lợi nhuận tính thuế trong tương lai vượt quá mức lợi nhuận phát sinh từ việc hoàn nhập các chênh lệch tạm thời chịu thuế hiện tại; và\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp; - Doanh nghiệp chịu lỗ trong năm hiện hành hoặc năm trước do qui định pháp lý về thuế mà tài sản thuế hoãn lại có liên quan.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ 1: Xác định và ghi nhận tài sản thuế thu nhập hoãn lại liên quan đến khấu hao TSCĐ\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNăm 2005, Công ty Thăng Long mua hai TSCĐ:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- TSCĐ A có giá mua là 12.000.000đ, thời gian sử dụng hữu ích theo kế toán là 3 năm, theo thuế là 6 năm; TSCĐ B có giá mua là 10.000.000đ, thời gian sử dụng hữu ích theo kế toán là 2 năm, theo thuế là 4 năm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Thuế suất thuế thu nhập doanh nghiệp 28%. Giả sử công ty chỉ có tài sản thuế thu nhập hoãn lại liên quan đến TSCĐ A và B.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eViệc xác định tài sản thuế thu nhập hoãn lại được thực hiện như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eXác định chênh lệch tạm thời được khấu trừ liên quan đến từng TSCĐ\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003etừ năm 2005 đến 2010\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003cem\u003eĐơn vị tính:1.000đ\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"647\" style=\"text-align: justify; border-collapse: collapse; width: 100%; border-spacing: 0px;\" id=\"06ba17e0-5d97-11f1-887f-bbee248cd34c\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eChỉ tiêu\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd colspan=\"6\"\u003e\n      \u003cp class=\"prov-content\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eNăm tài chính\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roma

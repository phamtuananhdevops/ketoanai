 new roman', times, serif; font-size: 14px;\"\u003e2.4.1- Mục đích của Bản thuyết minh báo cáo tài chính chọn lọc\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c42a00-5d97-11f1-97de-3979a54c7e08\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBản thuyết minh báo cáo tài chính chọn lọc là một bộ phận hợp thành không thể tách rời của báo cáo tài chính giữa niên độ của doanh nghiệp, được lập để giải thích và bổ sung thông tin về tình hình hoạt động sản xuất, kinh doanh, tình hình tài chính của doanh nghiệp trong kỳ kế toán giữa niên độ mà các báo cáo tài chính tóm lược khác không thể trình bày rõ ràng và chi tiết được.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06c49f30-5d97-11f1-b18d-07bdd0370083\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.4.2 Nguyên tắc lập Bản thuyết minh báo cáo tài chính chọn lọc\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c49f30-5d97-11f1-b18d-07bdd0370083\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Khi lập báo cáo tài chính giữa niên độ (kể cả dạng đầy đủ hoặc dạng tóm lược) doanh nghiệp phải lập Bản thuyết minh báo cáo tài chính chọn lọc theo Mẫu số 09a-DN (dưới đây).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c49f30-5d97-11f1-b18d-07bdd0370083\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Phần trình bày bằng lời văn phải ngắn gọn, rõ ràng, dễ hiểu. Phần trình bày bằng số liệu phải thống nhất với số liệu trên các báo cáo khác.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c49f30-5d97-11f1-b18d-07bdd0370083\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Phần trình bày về chuẩn mực kế toán và chế độ kế toán, các chính sách kế toán áp dụng tại doanh nghiệp phải thống nhất trong cả niên độ kế toán. Nếu có sự thay đổi chính sách kế toán trong các kỳ kế toán giữa niên độ phải trình bày rõ ràng lý do và những ảnh hưởng của sự thay đổi đó.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c49f30-5d97-11f1-b18d-07bdd0370083\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Ngoài các nội dung quy định này, doanh nghiệp có thể trình bày trong Bản thuyết minh báo cáo tài chính chọn lọc các nội dung khác nếu doanh nghiệp cho là trọng yếu và hữu ích cho người sử dụng báo cáo tài chính.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06c58990-5d97-11f1-95aa-33175dbce554\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.4.3 Cơ sở lập\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c58990-5d97-11f1-95aa-33175dbce554\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBản thuyết minh báo cáo tài chính chọn lọc được lập căn cứ vào:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c58990-5d97-11f1-95aa-33175dbce554\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Các sổ kế toán tổng hợp và sổ kế toán chi tiết;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c58990-5d97-11f1-95aa-33175dbce554\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Bảng cân đối kế toán giữa niên độ;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c58990-5d97-11f1-95aa-33175dbce554\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Báo cáo kết quả hoạt động kinh doanh giữa niên độ;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c58990-5d97-11f1-95aa-33175dbce554\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Bản thuyết minh báo cáo tài chính chọn lọc quý trước.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.4.4 Nội dung và phương pháp lập Bản thuyết minh báo cáo tài chính chọn lọc\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(1)- Nội dung Bản thuyết minh báo cáo tài chính chọn lọc:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBản thuyết minh báo cáo tài chính chọn lọc phải phản ánh những thông tin dưới đây:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Các sự kiện và hoạt động mới so với báo cáo tài chính quý trước, năm trước gần nhất.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Việc lập báo cáo tài chính giữa niên độ và việc lập báo cáo tài chính năm trước là cùng áp dụng các chính sách kế toán như nhau. Trường hợp có thay đổi thì phải mô tả sự thay đổi và thuyết minh sự ảnh hưởng của những thay đổi này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Thông tin trình bày trong Bản thuyết minh báo cáo tài chính chọn lọc là các thông tin mang tính trọng yếu và chưa được trình bày trong các kỳ báo cáo tài chính giữa niên độ trước. Các thông tin này phải trình bày trên cơ sở luỹ kế từ đầu niên độ đến ngày lập báo cáo tài chính giữa niên độ hiện tại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Các sự kiện hoặc giao dịch trọng yếu để có thể hiểu được về kỳ kế toán giữa niên độ hiện tại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Doanh nghiệp không cần trình bày trong Bản thuyết minh báo cáo tài chính chọn lọc các sự kiện hoặc giao dịch không trọng yếu, trừ khi cho là cần thiết.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(2)- Phương pháp lập Bản thuyết minh báo cáo tài chính chọn lọc:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Các phần I, II, III của Bản thuyết minh báo cáo tài chính chọn lọc được lập tương tự như Bản thuyết minh báo cáo tài chính năm quy định trong chế độ báo cáo tài chính hiện hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Phần IV – Các chính sách kế toán áp dụng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eDoanh nghiệp phải công bố việc lập báo cáo tài chính giữa niên độ và báo cáo tài chính năm gần nhất là cùng áp dụng các chính sách kế toán như nhau. Trường hợp có thay đổi thì phải mô tả sự thay đổi và nêu rõ ảnh hưởng của những thay đổi đó.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Phần V- Các sự kiện hoặc giao dịch trọng yếu trong kỳ kế toán giữa niên độ\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Doanh nghiệp lựa chọn thông tin trọng yếu cần trình bày bằng lời hoặc bằng số liệu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Nếu có thuyết minh bằng số liệu cho các khoản mục đã được trình bày trong Bảng cân đối kế toán tóm lược, Báo cáo kết quả hoạt động kinh doanh tóm lược, Báo cáo lưu chuyển tiền tệ tóm lược thì cần phải đánh dấu dẫn từ các báo cáo đó tới Bản thuyết minh báo cáo tài chính chọn lọc.\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eĐối với doanh nghiệp lập báo cáo tài chính giữa niên độ dạng đầy đủ có thể lập Bản thuyết minh báo cáo tài chính năm (Mẫu số B09-DN) quy định trong chế độ báo cáo tài chính hiện hành.\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"629\" style=\"text-align: justify;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eĐơn vị: ...............................\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eMẫu số B 09a - DN\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eĐịa chỉ: ..............................\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cem\u003eBan hành theo QĐ số 15/2006/QĐ-BTC Ngày 20/03/2006 của Bộ Tài chính\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBẢN THUYẾT MINH BÁO CÁO TÀI CHÍNH CHỌN LỌC\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eQuý ... năm ...\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eI. Đặc điểm hoạt động của doanh nghiệp\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Hình thức sở hữu vốn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Lĩnh vực kinh doanh.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Ngành nghề kinh doanh.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4. Đặc điểm hoạt động kinh doanh của doanh nghiệp trong kỳ kế toán có ảnh hưởng đến báo cáo tài chính.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eII. Kỳ kế toán, đơn vị tiền tệ sử dụng trong kế toán\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Kỳ kế toán năm (bắt đầu từ ngày .../.../... kết thúc vào ngày .../.../...).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Đơn vị tiền tệ sử dụng trong kế toán.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eIII. Chuẩn mực và chế độ kế toán áp dụng\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Chế độ kế toán áp dụng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Tuyên bố về việc tuân thủ chuẩn mực kế toán và chế độ kế toán\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Hình thức kế toán áp dụng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eIV. Các chính sách kế toán áp dụng\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eDoanh nghiệp phải công bố việc lập báo cáo tài chính giữa niên độ và báo cáo tài chính năm gần nhất là cùng áp dụng các chính sách kế toán như nhau. Trường hợp có thay đổi thì phải mô tả sự thay đổi và nêu rõ ảnh hưởng của những thay đổi đó.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eV. Các sự kiện hoặc giao dịch trọng yếu trong kỳ kế toán giữa niên độ\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Giải thích về tính thời vụ hoặc tính chu kỳ của các hoạt động kinh doanh trong kỳ kế toán giữa niên độ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Trình bày tính chất và giá trị của các khoản mục ảnh hưởng đến tài sản, nợ phải trả, nguồn vốn chủ sở hữu, thu nhập thuần, hoặc các luồng tiền được coi là yếu tố không bình thường do tính chất, quy mô hoặc tác động của chúng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3. Trình bày những biến động trong nguồn vốn chủ sở hữu và giá trị luỹ kế tính đến ngày lập báo cáo tài chính giữa niên độ, cũng như phần thuyết minh tương ứng mang tính so sánh của cùng kỳ kế toán trên của niên độ trước gần nhất.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4. Tính chất và giá trị của những thay đổi trong các ước tính kế toán đã được báo cáo trong báo cáo giữa niên độ trước của niên độ kế toán hiện tại hoặc những thay đổi trong các ước tính kế toán đã được báo cáo trong các niên độ trước, nếu những thay đổi này có ảnh hưởng trọng yếu đến kỳ kế toán giữa niên độ hiện tại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e5. Trình bày việc phát hành, mua lại và hoàn trả các chứng khoán nợ và chứng khoán vốn.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e6. Cổ tức đã trả (tổng số hay trên mỗi cổ phần) của cổ phiếu phổ thông và cổ phiếu ưu đãi (áp dụng cho công ty cổ phần).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e7. Trình bày doanh thu và kết quả kinh doanh bộ phận theo lĩnh vực kinh doanh hoặc khu vực địa lý dựa trên cơ sở phân chia của báo cáo bộ phận (Áp dụng cho công ty niêm yết).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e8. Trình bày những sự kiện trọng yếu phát sinh sau ngày kết thúc kỳ kế toán giữa niên độ chưa được phản ánh trong\u0026nbsp; báo cáo tài chính giữa niên độ đó.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e9. Trình bày những thay đổi trong các khoản nợ tiềm tàng hoặc tài sản tiềm tàng kể từ ngày kết thúc kỳ kế toán năm gần nhất.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e10. Các thông tin khác.\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"642\" style=\"text-align: justify;\" id=\"06c5d7b0-5d97-11f1-89cb-298fd1c2a30a\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd colspan=\"2\"\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLập, ngày ... tháng ... năm ...\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eNgười lập biểu\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd colspan=\"2\"\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eKế toán trưởng\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eGiám đốc\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e(Ký, họ tên)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd colspan=\"2\"\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e(Ký, họ tên)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003e(Ký, họ tên, đóng dấu)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n  \u003cp id=\"06c625d0-5d97-11f1-8ce3-fff65dc2e77f\" class=\"prov-part\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eIV - HƯỚNG DẪN KẾ TOÁN CHUẨN MỰC “BÁO CÁO BỘ PHẬN”\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06c69b00-5d97-11f1-90a1-152c405e6e83\" class=\"prov-section\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1. Quy định chung\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06c6e920-5d97-11f1-9719-3556a41ee1de\" class=\"prov-clause\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.1. Phần này chỉ hướng dẫn cụ thể việc xác định các bộ phận và nội dung phải báo cáo, đồng thời đưa ra các ví dụ minh hoạ theo quy định của Chuẩn mực kế toán số 28 “Báo cáo bộ phận”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06c73740-5d97-11f1-bedf-c96cd8a1b3c1\" class=\"prov-clause\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.2. Những quy định và hướng dẫn này được áp dụng cho việc lập và trình bày báo cáo tài chính bộ phận của các doanh nghiệp có chứng khoán trao đổi công khai và doanh nghiệp đang phát hành chứng khoán trên thị trường chứng khoán, các doanh nghiệp khác theo quy định của pháp luật và các doanh nghiệp tự nguyện lập báo cáo tài chính bộ phận.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06c78560-5d97-11f1-93e4-6d0467fe0939\" class=\"prov-clause\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.3. Các thông tin về báo cáo bộ phận trình bày trên thuyết minh báo cáo tài chính phải được thực hiện theo đúng quy định của Chuẩn mực kế toán số 28 \"Báo cáo bộ phận\" và hướng dẫn tại phần này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06c7ac70-5d97-11f1-bfb7-2122ea4a608e\" class=\"prov-clause\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.4. Đính chính đoạn 03 Chuẩn mực kế toán số 28 “Báo cáo bộ phận”: Bỏ chữ “bộ phận cũng” thay bằng chữ “năm” và đoạn 03 được đọc lại là “03. Báo cáo tài chính năm bao gồm...”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06c7fa90-5d97-11f1-8e1f-fd223037e25c\" class=\"prov-section\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2. Quy định cụ thể\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06c821a0-5d97-11f1-b3f0-a75cd18f35d6\" class=\"prov-clause\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.1. Trách nhiệm lập báo cáo tài chính bộ phận\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c821a0-5d97-11f1-b3f0-a75cd18f35d6\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tất cả các doanh nghiệp có chứng khoán trao đổi công khai và doanh nghiệp đang phát hành chứng khoán trên thị trường chứng khoán như các công ty niêm yết, các doanh nghiệp đã và đang chuẩn bị phát hành chứng khoán (cổ phiếu, trái phiếu doanh nghiệp) trên thị trường chứng khoán.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c821a0-5d97-11f1-b3f0-a75cd18f35d6\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Khuyến khích các doanh nghiệp không phát hành hoặc không có chứng khoán trao đổi công khai trình bày các thông tin về báo cáo bộ phận.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06c86fc0-5d97-11f1-b797-f1d423015ad9\" class=\"prov-clause\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.2. Các bộ phận cần phải lập báo cáo\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c86fc0-5d97-11f1-b797-f1d423015ad9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eMột bộ phận cần báo cáo: Là một bộ phận theo lĩnh vực kinh doanh hoặc một bộ phận theo khu vực địa lý được xác định dựa trên các định nghĩa sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c86fc0-5d97-11f1-b797-f1d423015ad9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBộ phận theo lĩnh vực kinh doanh: Là một bộ phận có thể phân biệt được của một doanh nghiệp tham gia vào quá trình sản xuất hoặc cung cấp sản phẩm, dịch vụ riêng lẻ, một nhóm các sản phẩm hoặc các dịch vụ có liên quan mà bộ phận này chịu rủi ro và lợi ích kinh tế khác với các bộ phận kinh doanh khác. Việc xem xét để xác định sản phẩm và dịch vụ có liên quan hay không phải căn cứ vào các nhân tố sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c86fc0-5d97-11f1-b797-f1d423015ad9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tính chất của hàng hóa và dịch vụ, như: Máy móc thiết bị hay hàng nông lâm thuỷ hải sản hay hàng may mặc,…;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c86fc0-5d97-11f1-b797-f1d423015ad9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tính chất của quy trình sản xuất, như: Khai thác hay chế biến, sản xuất trên dây chuyền tự động hay sản xuất thủ công, sản xuất hàng loạt hay đơn chiếc,…;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c86fc0-5d97-11f1-b797-f1d423015ad9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Kiểu hoặc nhóm khách hàng sử dụng các sản phẩm hoặc dịch vụ, như: Khách hàng cao cấp hay bình dân, thanh thiếu niên hay người lớn tuổi, phụ nữ hay nam giới,….;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c86fc0-5d97-11f1-b797-f1d423015ad9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Phương pháp được sử dụng để phân phối sản phẩm hoặc cung cấp dịch vụ, như: bán buôn hay bán lẻ, bán trực tiếp hay bán thông qua hệ thống đại lý,…;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c86fc0-5d97-11f1-b797-f1d423015ad9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Điều kiện của môi trường pháp lý như hoạt động ngân hàng, bảo hiểm hoặc dịch vụ công cộng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c86fc0-5d97-11f1-b797-f1d423015ad9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u0026nbsp; Bộ phận theo khu vực địa lý: Là một bộ phận có thể phân biệt được của một doanh nghiệp tham gia vào quá trình sản xuất hoặc cung cấp sản phẩm, dịch vụ trong phạm vi một môi trường kinh tế cụ thể mà bộ phận này có chịu rủi ro và lợi ích kinh tế khác với các bộ phận kinh doanh trong các môi trường kinh tế khác. Việc xem xét để xác định bộ phận theo khu vực địa lý phải căn cứ vào các nhân tố sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c86fc0-5d97-11f1-b797-f1d423015ad9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tính tương đồng của các điều kiện kinh tế và chính trị, như: Thành phố hay nông thôn, các tỉnh phía Bắc hay các tỉnh phía Nam, miền xuôi hay miền núi,…;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c86fc0-5d97-11f1-b797-f1d423015ad9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Mối quan hệ của những hoạt động trong các khu vực địa lý khác nhau;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c86fc0-5d97-11f1-b797-f1d423015ad9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tính tương đồng của hoạt động kinh doanh;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c86fc0-5d97-11f1-b797-f1d423015ad9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Rủi ro đặc biệt có liên quan đến hoạt động trong một khu vực địa lý cụ thể, như: khu vực lũ lụt, hạn hán,…;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c86fc0-5d97-11f1-b797-f1d423015ad9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Các quy định về kiểm soát ngoại hối; và\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c86fc0-5d97-11f1-b797-f1d423015ad9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Các rủi ro về tiền tệ, như hoạt động trong khu vực đồng tiền bị mất giá hoặc nền kinh tế siêu lạm phát.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c86fc0-5d97-11f1-b797-f1d423015ad9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eMột lĩnh vực kinh doanh không bao gồm các sản phẩm, dịch vụ có rủi ro và lợi ích kinh tế khác biệt đáng kể. Có những điểm không tương đồng với một hoặc một vài nhân tố trong định nghĩa bộ phận theo lĩnh vực kinh doanh nhưng các sản phẩm, dịch vụ trong một lĩnh vực kinh doanh phải tương đồng với phần lớn các nhân tố.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c86fc0-5d97-11f1-b797-f1d423015ad9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eMột khu vực địa lý không bao gồm các hoạt động trong môi trường kinh tế có rủi ro và lợi ích kinh tế khác biệt đáng kể. Một khu vực địa lý có thể là một quốc gia, hai hay nhiều quốc gia hoặc một vùng, hai hay nhiều tỉnh, thành phố trong cả nước.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06c896d0-5d97-11f1-876a-99b223e833ce\" class=\"prov-clause\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.3. Các loại báo cáo bộ phận\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c896d0-5d97-11f1-876a-99b223e833ce\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBáo cáo bộ phận được chia làm 2 loại: Báo cáo bộ phận chính yếu và báo cáo bộ phận thứ yếu. Nếu báo cáo bộ phận chính yếu được lập theo lĩnh vực kinh doanh, thì báo cáo bộ phận thứ yếu được lập theo khu vực địa lý. Nếu báo cáo bộ phận chính yếu được lập theo khu vực địa lý thì báo cáo bộ phận thứ yếu được lập theo lĩnh vực kinh doanh.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06c8bde0-5d97-11f1-8092-f7ed67e88af0\" class=\"prov-clause\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.4. Điều kiện phải lập báo cáo bộ phận\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06c93310-5d97-11f1-abf4-e9904beb7696\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.4.1. Một lĩnh vực kinh doanh hay khu vực địa lý cần được xác định là một bộ phận phải báo cáo khi thoả mãn một trong các điều kiện sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c93310-5d97-11f1-abf4-e9904beb7696\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Doanh thu của bộ phận từ việc bán hàng ra ngoài và từ giao dịch với các bộ phận khác phải chiếm từ 10% trở lên trên tổng doanh thu của tất cả bộ phận, hoặc:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c93310-5d97-11f1-abf4-e9904beb7696\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Kết quả kinh doanh của bộ phận, bất kể lãi (hay lỗ) chiếm từ 10 % trở lên trên tổng lãi của tất cả các bộ phận có lãi (hoặc trên tổng lỗ của tất cả các bộ phận lỗ) nếu đại lượng nào có giá trị tuyệt đối lớn hơn, hoặc:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c93310-5d97-11f1-abf4-e9904beb7696\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e-Tài sản của bộ phận chiếm từ 10 % trở lên trên tổng tài sản của tất cả các bộ phận.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c93310-5d97-11f1-abf4-e9904beb7696\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ: Giả sử Tổng Công ty Sao đỏ trong năm 2004 có 15 bộ phận kinh doanh, trong đó có 8 bộ phận thoả mãn ngưỡng 10% tổng doanh thu hoặc 10% tổng tài sản hoặc 10% kết quả kinh doanh của tất cả các bộ phận theo quy định thì bắt buộc 8 bộ phận này phải được lập báo cáo bộ phận.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06c98130-5d97-11f1-abee-2d4186cf2d8a\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.4.2. Đối với các bộ phận có mức dưới 10% theo quy định trên thì bộ phận có thể được báo cáo, khi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c98130-5d97-11f1-abee-2d4186cf2d8a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Thông tin của bộ phận nào đó là cần thiết cho người sử dụng báo cáo tài chính;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c98130-5d97-11f1-abee-2d4186cf2d8a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Nếu bộ phận nào có thể được kết hợp với các bộ phận tương đương khác mà thoả mãn ngưỡng 10% thì sẽ được trình bày thành một bộ phận riêng;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c98130-5d97-11f1-abee-2d4186cf2d8a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Các bộ phận còn lại được báo cáo thành một khoản mục riêng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c98130-5d97-11f1-abee-2d4186cf2d8a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ: Tiếp tục ví dụ ở đoạn 2.4.1nói trên, 7 bộ phận không thoả mãn ngưỡng 10% theo quy định trên được xem xét như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c98130-5d97-11f1-abee-2d4186cf2d8a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Có 1 bộ phận mà thông tin của nó là cần thiết cho người sử dụng báo cáo tài chính thì được lập báo cáo bộ phận riêng;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c98130-5d97-11f1-abee-2d4186cf2d8a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Có 2 bộ phận tương đương kết hợp với nhau và thoả mãn ngưỡng 10% thì được trình bày thành một bộ phận riêng;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c98130-5d97-11f1-abee-2d4186cf2d8a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- 4 bộ phận còn lại sẽ được báo cáo thành một khoản mục riêng.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06c9cf50-5d97-11f1-b922-85fce473c119\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.4.3. Trong số các bộ phận của doanh nghiệp đã xác định được các bộ phận phải báo cáo theo đoạn 2.4.1 và 2.4.2, nếu tổng doanh thu bán hàng ra ngoài của tất cả các bộ phận được báo cáo thấp hơn 75% tổng số doanh thu của doanh nghiệp hoặc doanh thu của tập đoàn thì phải xác định thêm bộ phận cần báo cáo, kể cả khi bộ phận đó không đáp ứng được tiêu chuẩn 10% theo quy định tại đoạn 2.4.1 và 2.4.2 cho tới khi đạt được ít nhất 75% tổng số doanh thu của doanh nghiệp hoặc tập đoàn được tính cho các bộ phận báo cáo được.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06c9cf50-5d97-11f1-b922-85fce473c119\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ: Trong số 15 bộ phận nêu trên đã xác định được 11 bộ phận phải báo cáo theo đoạn 2.4.1 và 2.4.2. Kết quả tổng doanh thu bán hàng ra ngoài của 11 bộ phận này mới đạt 70% tổng số doanh thu của doanh nghiệp nên phải xác định thêm một bộ phận nữa cần báo cáo, mặc dù doanh thu của bộ phận đó mới đạt 8% tổng doanh thu của doanh nghiệp, làm cho tổng doanh thu của 12 bộ phận báo cáo đạt 78% (\u0026gt;75%) tổng doanh thu của cả doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06ca1d70-5d97-11f1-957b-2de163aa0911\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.4.4. Đối với các bộ phận có mức dưới 10% nhưng năm tài chính trước đó đã đạt ngưỡng 10% thì trong năm tài chính hiện hành vẫn phải báo cáo nếu Ban Giám đốc đánh giá bộ phận này có tầm quan trọng trong năm tiếp theo.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06ca1d70-5d97-11f1-957b-2de163aa0911\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ: Trong 7 bộ phận trên chưa được báo cáo theo đoạn 2.4.1, nếu năm 2003 có 1 bộ phận đạt ngưỡng 10% và nếu Ban Giám đốc đánh giá bộ phận này vẫn có tầm quan trọng trong năm 2004 thì vẫn là bộ phận phải báo cáo năm 2004.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06ca4480-5d97-11f1-b182-45db8f0e6e36\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.4.5. Nếu các bộ phận cần phải báo cáo do đạt ngưỡng 10% trong năm nay thì thông tin của các bộ phận này năm trước cũng cần phải được trình bày lại để cung cấp số liệu so sánh cho người sử dụng báo cáo dù các bộ phận này có thể không đạt ngưỡng 10% trong năm trước, trừ khi không thể thực hiện được.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06ca4480-5d97-11f1-b182-45db8f0e6e36\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ: 8 bộ phận cần phải báo cáo theo đoạn 2.4.1 do đạt ngưỡng 10% năm 2004 nhưng trong đó có 2 bộ phận không đạt ngưỡng 10% trong năm 2003 thì thông tin năm 2003 của 2 bộ phận này cần phải được trình bày để cung cấp số liệu so sánh cho người sử dụng báo cáo năm 2004.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06ca92a0-5d97-11f1-ac26-db4c79b2977b\" class=\"prov-clause\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.5. Trình bày báo cáo bộ phận\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06cab9b0-5d97-11f1-87f9-9f7b3f046ad9\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.5.1. Nội dung báo cáo đối với bộ phận chính yếu, gồm:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cab9b0-5d97-11f1-87f9-9f7b3f046ad9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Doanh thu bộ phận, trong đó doanh thu bán hàng gồm doanh thu cung cấp dịch vụ cho khách hàng bên ngoài và doanh thu từ các giao dịch với các bộ phận khác phải được báo cáo riêng biệt;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cab9b0-5d97-11f1-87f9-9f7b3f046ad9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Kết quả bộ phận;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cab9b0-5d97-11f1-87f9-9f7b3f046ad9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tổng giá trị còn lại của tài sản bộ phận;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cab9b0-5d97-11f1-87f9-9f7b3f046ad9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Nợ phải trả bộ phận;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cab9b0-5d97-11f1-87f9-9f7b3f046ad9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tổng chi phí đã phát sinh trong niên độ để mua tài sản bộ phận dự kiến sẽ sử dụng nhiều hơn một niên độ (TSCĐ hữu hình, TSCĐ vô hình và các tài sản dài hạn khác);\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cab9b0-5d97-11f1-87f9-9f7b3f046ad9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tổng chi phí khấu hao TSCĐ và phân bổ chi phí trả trước dài hạn của bộ phận;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cab9b0-5d97-11f1-87f9-9f7b3f046ad9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tổng giá trị các khoản chi phí lớn không bằng tiền, ngoại trừ chi phí khấu hao TSCĐ và phân bổ chi phí dài hạn của bộ phận.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cab9b0-5d97-11f1-87f9-9f7b3f046ad9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNếu doanh nghiệp đưa ra các thuyết minh về luồng tiền bộ phận theo quy định của Chuẩn mực kế toán số 24 “Báo cáo lưu chuyển tiền tệ” thì không phải trình bày tổng chi phí khấu hao TSCĐ và phân bổ chi phí trả trước dài hạn và các chi phí lớn không bằng tiền của bộ phận.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cab9b0-5d97-11f1-87f9-9f7b3f046ad9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eDoanh nghiệp phải trình bày Bảng đối chiếu giữa số liệu của các bộ phận và số liệu tổng cộng trong báo cáo tài chính của doanh nghiệp hoặc báo cáo tài chính hợp nhất. Trong bảng đối chiếu này các số liệu không thuộc các bộ phận báo cáo phải được gộp vào một cột. Doanh nghiệp phải đối chiếu doanh thu bộ phận so với tổng doanh thu bán hàng ra bên ngoài trong đó nêu rõ số doanh thu bán hàng ra bên ngoài chưa được báo cáo ở bất kỳ bộ phận nào; kết quả kinh doanh của bộ phận với tổng kết quả kinh doanh\u0026nbsp; của doanh nghiệp và với lợi nhuận thuần của doanh nghiệp; tài sản bộ phận phải được đối chiếu với tổng tài sản của doanh nghiệp; nợ phải trả của bộ phận phải đối chiếu với tổng nợ phải trả của doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06cb07d0-5d97-11f1-9598-efbb1b23874d\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.5.2. Nội dung báo cáo đối với bộ phận thứ yếu\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cb07d0-5d97-11f1-9598-efbb1b23874d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea. Nếu báo cáo bộ phận chính yếu được lập theo lĩnh vực kinh doanh thì báo cáo bộ phận thứ yếu phải lập theo khu vực địa lý và gồm các thông tin sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cb07d0-5d97-11f1-9598-efbb1b23874d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Doanh thu bộ phận bán hàng ra bên ngoài theo khu vực địa lý dựa trên vị trí của khách hàng, nếu doanh thu bán hàng ra bên ngoài của mỗi bộ phận đó chiếm từ 10% trở lên trên tổng doanh thu của doanh nghiệp bán hàng ra bên ngoài;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cb07d0-5d97-11f1-9598-efbb1b23874d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tổng giá trị còn lại của tài sản bộ phận theo vị trí của tài sản, nếu tài sản của mỗi bộ phận đó chiếm từ 10% trở lên trên tổng tài sản của toàn bộ các khu vực địa lý; và\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cb07d0-5d97-11f1-9598-efbb1b23874d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tổng chi phí đã phát sinh trong niên độ để mua tài sản bộ phận dự kiến sẽ sử dụng nhiều hơn một niên độ (TSCĐ hữu hình, TSCĐ vô hình và các tài sản dài hạn khác) theo vị trí của tài sản, nếu tài sản của bộ phận đó chiếm từ 10% trở lên trên tổng tài sản của các bộ phận.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cb07d0-5d97-11f1-9598-efbb1b23874d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb. Nếu báo cáo bộ phận chính yếu được lập theo khu vực địa lý (dựa trên vị trí của tài sản hay vị trí của khách hàng), thì báo cáo bộ phận thứ yếu phải được lập theo lĩnh vực kinh doanh, khi đó doanh nghiệp phải thuyết minh các thông tin sau đối với các lĩnh vực kinh doanh có doanh thu bán hàng ra ngoài chiếm từ 10% trở lên trên tổng doanh thu bán hàng ra bên ngoài của doanh nghiệp, hoặc tài sản bộ phận chiếm từ 10% trở lên trên tổng tài sản của các bộ phận:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cb07d0-5d97-11f1-9598-efbb1b23874d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Doanh thu bộ phận bán hàng ra bên ngoài;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cb07d0-5d97-11f1-9598-efbb1b23874d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tổng giá trị còn lại của tài sản bộ phận;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cb07d0-5d97-11f1-9598-efbb1b23874d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tổng chi phí phát sinh trong niên độ để mua TSCĐ hữu hình, TSCĐ vô hình và các tài sản dài hạn khác;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cb07d0-5d97-11f1-9598-efbb1b23874d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec. Nếu báo cáo bộ phận chính yếu được lập theo khu vực địa lý dựa trên vị trí của tài sản, và vị trí của khách hàng của doanh nghiệp khác với vị trí của tài sản của doanh nghiệp, thì doanh nghiệp cần phải báo cáo doanh thu bán hàng ra bên ngoài cho mỗi bộ phận theo khu vực địa lý dựa trên vị trí của khách hàng mà doanh thu bán hàng ra bên ngoài của nó chiếm từ 10% trở lên trên tổng doanh thu bán hàng ra bên ngoài của doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cb07d0-5d97-11f1-9598-efbb1b23874d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ed. Nếu báo cáo bộ phận chính yếu được lập theo khu vực địa lý dựa trên vị trí của khách hàng, và tài sản của doanh nghiệp được đặt tại các khu vực địa lý khác với khách hàng của doanh nghiệp, thì doanh nghiệp cần phải thuyết minh các thông tin dưới đây đối với mỗi khu vực địa lý dựa trên vị trí của tài sản mà doanh thu bán hàng ra bên ngoài hoặc tài sản của bộ phận đó chiếm từ 10% trở lên trên tổng doanh thu bán hàng ra bên ngoài hoặc tổng tài sản của doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cb07d0-5d97-11f1-9598-efbb1b23874d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tổng giá trị còn lại của tài sản bộ phận theo khu vực địa lý của tài sản;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cb07d0-5d97-11f1-9598-efbb1b23874d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Tổng chi phí phát sinh trong kỳ để mua tài sản bộ phận dự kiến sẽ sử dụng nhiều hơn một niên độ (TSCĐ hữu hình, TSCĐ vô hình, tài sản dài hạn khác) theo vị trí của tài sản.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06cb55f0-5d97-11f1-921b-31bb5677acc9\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.5.3. Các thuyết minh khác\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cb55f0-5d97-11f1-921b-31bb5677acc9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea. Nếu một lĩnh vực kinh doanh hoặc một khu vực địa lý mà thông tin được báo cáo cho Ban Giám đốc không phải là một bộ phận phải báo cáo do bộ phận đó thu được phần lớn doanh thu từ việc bán hàng cho các bộ phận khác, tuy nhiên doanh thu của bộ phận này bán hàng ra bên ngoài chiếm từ 10% trở lên trên tổng doanh thu của doanh nghiệp bán hàng ra bên ngoài, doanh nghiệp này cũng cần phải thuyết minh về doanh thu từ việc bán hàng ra bên ngoài và bán hàng cho các bộ phận nội bộ khác.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cb55f0-5d97-11f1-921b-31bb5677acc9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb. Để xác định và báo cáo doanh thu bộ phận từ các giao dịch với các bộ phận khác, các khoản chuyển giao giữa các bộ phận cần phải được tính toán trên cơ sở là doanh nghiệp này thực sự được sử dụng để định giá các khoản chuyển nhượng đó. Cơ sở cho việc định giá các khoản chuyển giao giữa các bộ phận đó và bất cứ sự thay đổi liên quan cần phải được thuyết minh trong báo cáo tài chính.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cb55f0-5d97-11f1-921b-31bb5677acc9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ec. Những thay đổi về chính sách kế toán được áp dụng cho việc trình bày báo cáo bộ phận có ảnh hưởng trọng yếu lên các thông tin bộ phận cần phải được thuyết minh. Thông tin bộ phận của kỳ trước được trình bày cho mục đích so sánh cần phải được trình bày lại, kể cả tính chất và lý do thay đổi (nếu có). Các tác động về tài chính cũng phải được trình bày nếu có thể xác định được một cách hợp lý. Nếu doanh nghiệp thay đổi việc xác định các bộ phận báo cáo và không công bố thông tin bộ phận kỳ trước theo căn cứ mới thì để đáp ứng mục đích so sánh, doanh nghiệp phải báo cáo thông tin bộ phận dựa trên cả căn cứ mới và căn cứ cũ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cb55f0-5d97-11f1-921b-31bb5677acc9\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ed. Doanh nghiệp cần báo cáo các loại sản phẩm và dịch vụ trong mỗi lĩnh vực kinh doanh được báo cáo và thành phần của mỗi khu vực địa lý được báo cáo, cả chính yếu và thứ yếu, nếu như không được diễn giải ngược lại trong báo cáo tài chính.\u003c/span\u003e\u003c/p\u003e\n  \u003cp id=\"06cb7d00-5d97-11f1-8558-77c1df195e52\" class=\"prov-item\" style=\"text-align: justify; font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.6. Ví dụ về lập và trình bày báo cáo bộ phận\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cb7d00-5d97-11f1-8558-77c1df195e52\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCông ty cổ phần HOÀNG SA là doanh nghiệp đang niêm yết trên thị trường chứng khoán. Công ty này được tổ chức 3 bộ phận theo lĩnh vực kinh doanh, là:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cb7d00-5d97-11f1-8558-77c1df195e52\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1/ Bộ phận sản xuất điện thoại di động: Chuyên khai thác, sản xuất, và tiêu thụ điện thoại di động, các sản phẩm truyền tin không dây;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cb7d00-5d97-11f1-8558-77c1df195e52\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2/ Bộ phận dịch vụ mạng: Chuyên cung cấp đường truyền tin và các dịch vụ liên quan;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cb7d00-5d97-11f1-8558-77c1df195e52\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3/ Bộ phận phát triển dịch vụ mới: Chuyên thiết lập các dịch vụ mới ngoài phát triển theo các hoạt động chính của công ty.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cb7d00-5d97-11f1-8558-77c1df195e52\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eNgoài 3 bộ phận theo lĩnh vực kinh doanh nói trên, Công ty HOÀNG SA còn có bộ phận thực hiện nghiên cứu chung và các chức năng chung khác.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify; font-size: 14px;\" id=\"06cb7d00-5d97-11f1-8558-77c1df195e52\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBan Giám đốc của Công ty HOÀNG SA

roman', times, serif; font-size: 14px;\"\u003e3. Tổng chi phí đã phát sinh để mua TSCĐ (theo vị trí của tài sản)\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 38.2344px;\"\u003e\n      \u003cp class=\"prov-content\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e160\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 50.1875px;\"\u003e\n      \u003cp class=\"prov-content\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e49\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 52.9375px;\"\u003e\n      \u003cp class=\"prov-content\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e9\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 44.9844px;\"\u003e\n      \u003cp class=\"prov-content\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e17\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 43.9844px;\"\u003e\n      \u003cp class=\"prov-content\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e53\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 38.5px;\"\u003e\n      \u003cp class=\"prov-content\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e144\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd style=\"width: 91.4219px;\"\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e432\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp style=\"text-align: justify;\"\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-part\" style=\"text-align: justify;\" id=\"6c780360-5d99-11f1-93bb-f1d0024b7e62\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eV - HƯỚNG DẪN KẾ TOÁN CHUẨN MỰC “THAY ĐỔI CHÍNH SÁCH KẾ TOÁN, ƯỚC TÍNH KẾ TOÁN VÀ CÁC SAI SÓT”\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c780360-5d99-11f1-93bb-f1d0024b7e62\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e - Đính chính vào đoạn 10b Chuẩn mực kế toán số 29- Thay đổi chính sách kế toán, ước tính kế toán và các sai sót (Ban hành theo Quyết định số 12/2005/QĐ-BTC ngày 15/02/2005 của Bộ trưởng Bộ Tài chính), câu: “nhưng không có các hướng dẫn chuyển đổi cụ thể cho sự thay đổi đó, hoặc tự nguyện thay đổi chính sách kế toán thì phải áp dụng hồi tố chính sách chính sách kế toán mới” được thay bằng câu “mà không có quy định về hồi tố thì được áp dụng phi hồi tố chính sách kế toán mới. Trường hợp doanh nghiệp tự nguyện thay đổi chính sách kế toán thì phải áp dụng hồi tố chính sách kế toán mới”.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c780360-5d99-11f1-93bb-f1d0024b7e62\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Trong vòng 3 năm (từ 2006- 2008) các trường hợp doanh nghiệp tự nguyện thay đổi chính sách kế toán thì chỉ giới hạn hồi tố cho 5 năm gần nhất. Từ năm 2009 sẽ phải áp dụng hồi tố đối với thay đổi chính sách kế toán hoặc điều chỉnh hồi tố đối với các sai sót theo quy định của chuẩn mực kế toán số 29 và hướng dẫn dưới đây:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-section\" style=\"text-align: justify;\" id=\"6c7914d0-5d99-11f1-a9eb-19d691e18198\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1- Thay đổi chính sách kế toán và kế toán ảnh hưởng của việc thay đổi chính sách kế toán\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" style=\"text-align: justify;\" id=\"6c793be0-5d99-11f1-862e-35de4317911e\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.1 – Thay đổi chính sách kế toán và áp dụng các thay đổi chính sách kế toán\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" style=\"text-align: justify;\" id=\"6c79b110-5d99-11f1-96a2-59d3ace2eeaa\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e 1.1.1 – Thay đổi chính sách kế toán\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c79b110-5d99-11f1-96a2-59d3ace2eeaa\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(1) Thay đổi chính sách kế toán là việc thay đổi các nguyên tắc, cơ sở và phương pháp kế toán cụ thể mà doanh nghiệp đã áp dụng trong việc lập và trình bày báo cáo tài chính, như: Thay đổi phương pháp tính giá hàng tồn kho; thay đổi phương pháp hạch toán chênh lệch tỷ giá hối đoái; thay đổi phương pháp kế toán chi phí đi vay,...\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c79b110-5d99-11f1-96a2-59d3ace2eeaa\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(2) Doanh nghiệp chỉ được thay đổi chính sách kế toán trong các trường hợp dưới đây:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c79b110-5d99-11f1-96a2-59d3ace2eeaa\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Có sự thay đổi theo quy định của pháp luật hoặc của chuẩn mực kế toán và chế độ kế toán; hoặc\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c79b110-5d99-11f1-96a2-59d3ace2eeaa\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Sự thay đổi sẽ dẫn đến báo cáo tài chính cung cấp thông tin tin cậy và thích hợp hơn về ảnh hưởng của các giao dịch, sự kiện đối với tình hình tài chính, kết quả hoạt động kinh doanh và lưu chuyển tiền tệ của doanh nghiệp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c79b110-5d99-11f1-96a2-59d3ace2eeaa\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(3) Những trường hợp sau đây không phải là thay đổi chính sách kế toán:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c79b110-5d99-11f1-96a2-59d3ace2eeaa\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Việc áp dụng một chính sách kế toán cho các giao dịch, sự kiện có sự khác biệt về cơ bản so với các giao dịch, sự kiện đó đã xảy ra trước đây;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c79b110-5d99-11f1-96a2-59d3ace2eeaa\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Việc áp dụng các chính sách kế toán mới cho các giao dịch, sự kiện chưa phát sinh trước đó hoặc không trọng yếu.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c79b110-5d99-11f1-96a2-59d3ace2eeaa\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Thay đổi phương pháp khấu hao TSCĐ. Thay đổi này được coi là thay đổi ước tính kế toán.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" style=\"text-align: justify;\" id=\"6c79b11a-5d99-11f1-973b-15baac37b6bd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.1.2 - Áp dụng các thay đổi chính sách kế toán\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c79b11a-5d99-11f1-973b-15baac37b6bd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eDoanh nghiệp phải áp dụng các thay đổi trong chính sách kế toán theo quy định tại đoạn 10 của Chuẩn mực kế toán số 29 \"Thay đổi chính sách kế toán, ước tính kế toán và các sai sót\", như sau:\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c79b11a-5d99-11f1-973b-15baac37b6bd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e - Trường hợp doanh nghiệp phải thực hiện việc thay đổi chính sách kế toán do áp dụng lần đầu các quy định của pháp luật hoặc chuẩn mực kế toán, chế độ kế toán mà đã có các hướng dẫn chuyển đổi cụ thể (chuyển đổi cụ thể cho phép hồi tố hoặc không hồi tố) thì phải thực hiện theo hướng dẫn đó.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c79b11a-5d99-11f1-973b-15baac37b6bd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e - Trường hợp doanh nghiệp phải thực hiện việc thay đổi chính sách kế toán do áp dụng lần đầu các quy định của pháp luật hoặc chuẩn mực kế toán, chế độ kế toán mà không có quy định về hồi tố thì được áp dụng phi hồi tố chính sách kế toán đó.\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c79b11a-5d99-11f1-973b-15baac37b6bd\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp; - Trường hợp doanh nghiệp tự nguyện thay đổi chính sách kế toán thì phải áp dụng hồi tố đối với thay đổi chính sách kế toán đó.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" style=\"text-align: justify;\" id=\"6c7a2640-5d99-11f1-854b-113cbaee510a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e 1.2 – Kế toán ảnh hưởng của việc áp dụng hồi tố thay đổi chính sách kế toán\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" style=\"text-align: justify;\" id=\"6c7a4d50-5d99-11f1-8a90-33154fb0d32a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.2.1- Nguyên tắc điều chỉnh khi áp dụng hồi tố thay đổi chính sách kế toán\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a4d50-5d99-11f1-8a90-33154fb0d32a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(1) Khi có sự thay đổi chính sách kế toán mà phải áp dụng hồi tố, về nguyên tắc doanh nghiệp phải xác định ảnh hưởng của sự thay đổi này đến báo cáo tài chính của từng năm, kể từ ngày phát sinh giao dịch lần đầu tiên. Sau khi xác định được ảnh hưởng của thay đổi chính sách kế toán cho từng năm, ảnh hưởng luỹ kế của các năm trước cho đến năm hiện tại, căn cứ vào số liệu xác định được doanh nghiệp phải điều chỉnh lại số dư đầu năm của các Tài khoản bị ảnh hưởng thuộc vốn chủ sở hữu và các tài khoản có liên quan thuộc nợ phải trả hoặc tài sản năm hiện tại, điều chỉnh lại số liệu so sánh của báo cáo tài chính của từng năm trước bị ảnh hưởng và\u0026nbsp; trình bày lại số liệu so sánh sau khi đã điều chỉnh của từng năm trước vào Bản thuyết minh báo cáo tài chính của năm hiện tại. Việc điều chỉnh thực được hiện theo nguyên tắc:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a4d50-5d99-11f1-8a90-33154fb0d32a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Nếu thay đổi chính sách kế toán làm ảnh hưởng đến kết quả kinh doanh của doanh nghiệp trong các năm trước, doanh nghiệp phải xác định ảnh hưởng của sự thay đổi tới từng năm và điều chỉnh vào các khoản mục thuộc cột thông tin so sánh (Cột \"Năm trước\") của \"Báo cáo kết quả hoạt động kinh doanh\" của các năm bị ảnh hưởng; Đồng thời xác định ảnh hưởng lũy kế của sự thay đổi và điều chỉnh vào số dư đầu năm Tài khoản 421- \"Lợi nhuận chưa phân phối\"\u0026nbsp; trên sổ kế toán và Bảng cân đối kế toán của năm hiện tại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a4d50-5d99-11f1-8a90-33154fb0d32a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Nếu thay đổi chính sách kế toán làm ảnh hưởng đến các khoản mục tài sản, nợ phải trả hoặc vốn chủ sở hữu của doanh nghiệp trong các năm trước, doanh nghiệp phải xác định ảnh hưởng của sự thay đổi tới từng năm và điều chỉnh vào các khoản mục tương ứng thuộc cột thông tin so sánh (Cột \"Số đầu năm\") của \"Bảng Cân đối kế toán\" của các năm bị ảnh hưởng; Đồng thời xác định ảnh hưởng lũy kế của sự thay đổi và điều chỉnh vào số dư đầu năm của các Tài khoản tài sản, nợ phải trả hoặc vốn chủ sở hữu tương ứng của năm hiện tại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a4d50-5d99-11f1-8a90-33154fb0d32a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(2) Doanh nghiệp không được điều chỉnh vào cột \"Năm nay\" trên \"Báo cáo kết quả hoạt động kinh doanh\" của năm hiện tại khi điều chỉnh ảnh hưởng do thay đổi chính sách kế toán trong các năm trước mà chỉ được thực hiện bằng cách trình bày lại số liệu trên cột thông tin so sánh (Cột \"Năm trước\") của \"Báo cáo kết quả hoạt động kinh doanh\" của năm hiện tại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a4d50-5d99-11f1-8a90-33154fb0d32a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(3) Khi thực hiện việc điều chỉnh do áp dụng hồi tố thay đổi chính sách kế toán trên các Tài khoản ở Sổ kế toán tổng hợp, Sổ kế toán chi tiết, ngoài việc diễn giải nội dung của nghiệp vụ kinh tế doanh nghiệp còn phải ghi rõ lý do của việc điều chỉnh là do áp dụng hồi tố do thay đổi chính sách kế toán.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.2.2 – Phương pháp áp dụng hồi tố\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea- Trường hợp áp dụng hồi tố thay đổi chính sách kế toán làm ảnh hưởng đến các khoản mục tài sản, nợ phải trả, hoặc vốn chủ sở hữu của\u0026nbsp; Bảng Cân đối kế toán\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea1- Đối với các năm trước:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSau khi xác định được ảnh hưởng của việc áp dụng hồi tố do thay đổi chính sách kế toán đến từng năm kể từ năm sớm nhất có thể xác định được, kế toán tiến hành điều chỉnh số liệu trên cột thông tin so sánh (Cột \"Số đầu năm\") của Bảng Cân đối kế toán từng năm trước có liên quan; Đồng thời kế toán phải trình bày lại số liệu trên cột thông tin so sánh của từng năm bị ảnh hưởng vào Bản thuyết minh báo cáo tài chính của năm hiện tại.Việc điều chỉnh thông tin so sánh được thực hiện theo nguyên tắc:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giá trị ảnh hưởng xác định được cho năm sớm nhất được điều chỉnh vào số dư đầu năm của các khoản mục tài sản, nợ phải trả hoặc vốn chủ sở hữu trên Bảng Cân đối kế toán của năm sau năm sớm nhất;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Giá trị ảnh hưởng xác định được cho các năm sau năm sớm nhất đến năm trước liền kề năm hiện tại được điều chỉnh vào số dư đầu năm của các khoản mục tài sản, nợ phải trả hoặc vốn chủ sở hữu trên Bảng Cân đối kế toán của các năm có liên quan.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea2- Đối với năm hiện tại:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eDoanh nghiệp phải xác định ảnh hưởng luỹ kế do áp dụng hồi tố thay đổi chính sách kế toán của tất cả các năm trước làm căn cứ điều chỉnh vào dòng số dư đầu năm của các Tài khoản có liên quan trên Sổ kế toán tổng hợp, Sổ kế toán chi tiết của năm hiện tại; Đồng thời kế toán phải trình bày lại số liệu trên cột thông tin so sánh của Bảng cân đối kế toán của các năm bị ảnh hưởng vào Bản thuyết minh báo cáo tài chính của năm hiện tại. Việc điều chỉnh số dư đầu năm các tài khoản có liên quan được thực hiện bằng cách ghi một dòng trên Sổ kế toán tổng hợp, Sổ kế toán chi tiết với nội dung: Điều chỉnh số dư do áp dụng hồi tố thay đổi chính sách kế toán \"...................\" từ...........đến...........; Cụ thể cho từng trường hợp sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(1)- Trường hợp ảnh hưởng luỹ kế làm tăng Tài sản, kế toán điều chỉnh tăng tài sản, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e Tăng số dư Nợ đầu năm TK Tài sản có liên quan\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTăng số dư Có đầu năm các TK có liên quan, hoặc\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp; Giảm số dư Nợ đầu năm các TK Tài sản có liên quan\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(2)- Trường hợp ảnh hưởng luỹ kế làm tăng Nợ phải trả, kế toán điều chỉnh tăng nợ phải trả, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTăng số dư Có đầu năm TK Nợ phải trả có liên quan\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e Tăng số dư Nợ đầu năm TK có liên quan, hoặc\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e Giảm số dư Có đầu năm TK Nợ phải trả hoặc Vốn chủ sở hữu có liên quan.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(3)- Trường hợp ảnh hưởng luỹ kế làm tăng Vốn chủ sở hữu, kế toán điều chỉnh tăng\u0026nbsp; vốn chủ sở hữu, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTăng số dư Có đầu năm TK Vốn chủ sở hữu có liên quan\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTăng số dư Nợ đầu năm TK có liên quan, hoặc\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiảm số dư Có đầu năm TK Nợ phải trả hoặc Vốn chủ sở hữu có liên quan\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u0026nbsp;(4)- Trường hợp ảnh hưởng luỹ kế làm giảm Tài sản, kế toán điều chỉnh giảm tài sản bằng cách ghi ngược lại bút toán (1).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp; (5) - Trường hợp ảnh hưởng luỹ kế làm giảm Nợ phải trả, kế toán điều chỉnh giảm nợ phải trả bằng cách ghi ngược lại bút toán (2).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp; (6)- Trường hợp ảnh hưởng luỹ kế làm giảm vốn chủ sở hữu, kế toán điều chỉnh giảm vốn chủ sở hữu bằng cách ghi ngược lại bút toán (3).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp; b- Trường hợp áp dụng hồi tố thay đổi chính sách kế toán làm ảnh hưởng đến khoản mục doanh thu, chi phí của Báo cáo kết quả hoạt động kinh doanh\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb1- Đối với các năm trước:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSau khi xác định được ảnh hưởng của việc áp dụng hồi tố do thay đổi chính sách kế toán đến doanh thu, hoặc chi phí của từng năm, kế toán không thực hiện bút toán điều chỉnh trên các tài khoản có liên quan của từng năm mà chỉ tiến hành điều chỉnh số liệu trên cột thông tin so sánh (Cột \"Năm trước\") của Báo cáo kết quả hoạt động kinh doanh của từng năm trước có liên quan; Đồng thời trình bày lại số liệu trên cột thông tin so sánh của Báo cáo kết quả hoạt động kinh doanh của từng năm bị ảnh hưởng vào Bản thuyết minh báo cáo tài chính của năm hiện tại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eb2- Đối với năm hiện tại:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eDựa trên ảnh hưởng lũy kế của việc áp dụng hồi tố thay đổi chính sách kế toán dẫn đến làm tăng, giảm các khoản mục doanh thu hoặc chi phí đã xác định được cho tất cả các năm trước, kế toán phải điều chỉnh lại cột số liệu so sánh của Báo cáo kết quả hoạt động kinh doanh năm hiện tại; Đồng thời điều chỉnh vào số dư đầu năm TK 421 – “Lợi nhuận chưa phân phối” (TK 4211- Lợi nhuận chưa phân phối năm trước) của năm hiện tại. Việc điều chỉnh số dư đầu năm TK 421 – “Lợi nhuận chưa phân phối” được thực hiện bằng cách ghi một dòng trên Sổ kế toán tổng hợp, Sổ kế toán chi tiết với nội dung: Điều chỉnh do áp dụng hồi tố các thay đổi chính sách kế toán \"...................\" từ..................đến...................; Cụ thể cho từng trường hợp sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;(1)- Trường hợp ảnh hưởng lũy kế làm tăng doanh thu, thu nhập khác hoặc giảm chi phí trong kỳ, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTăng số dư Có đầu năm TK 421- Lợi nhuận chưa phân phối (TK 4211- Lợi nhuận chưa phân phối\u0026nbsp; năm trước - Nếu TK 4211 có số dư bên Có), hoặc\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;Giảm số dư Nợ đầu năm TK 421 (Nếu TK 4211 có số dư bên Nợ)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTăng hoặc giảm số dư Có đầu năm TK có liên quan, hoặc\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTăng hoặc giảm số dư Nợ đầu năm TK có liên quan.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(2)- Trường hợp ảnh hưởng lũy kế làm giảm doanh thu, thu nhập khác hoặc tăng chi phí trong kỳ, ghi:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiảm số dư Có đầu năm TK 421- Lợi nhuận chưa phân phối (TK 4211- Lợi nhuận chưa phân phối năm trước - Nếu TK 4211 có số dư bên Có), hoặc\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTăng số dư Nợ đầu năm TK 421 (Nếu TK 4211 có số dư bên Nợ)\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTăng hoặc giảm số dư Nợ đầu năm TK có liên quan, hoặc\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a7460-5d99-11f1-8747-537a17c0ae70\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eTăng hoặc giảm số dư Có đầu năm TK có liên quan\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" style=\"text-align: justify;\" id=\"6c7a9b70-5d99-11f1-b527-19bb563eb8e1\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.3 – Trình bày về áp dụng hồi tố thay đổi chính sách kế toán\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a9b70-5d99-11f1-b527-19bb563eb8e1\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eKhi áp dụng hồi tố thay đổi chính sách kế toán có ảnh hưởng đến năm hiện tại hay một năm nào đó trong quá khứ hoặc các năm trong tương lai, doanh nghiệp phải trình bày trong Bản thuyết minh báo cáo tài chính những thông tin sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a9b70-5d99-11f1-b527-19bb563eb8e1\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(a) Tên chính sách kế toán;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a9b70-5d99-11f1-b527-19bb563eb8e1\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(b) Hướng dẫn chuyển đổi chính sách kế toán;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a9b70-5d99-11f1-b527-19bb563eb8e1\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(c) Bản chất của sự thay đổi chính sách kế toán;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a9b70-5d99-11f1-b527-19bb563eb8e1\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(d) Mô tả các qui định của hướng dẫn chuyển đổi (nếu có);\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a9b70-5d99-11f1-b527-19bb563eb8e1\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(đ) Ảnh hưởng của việc thay đổi chính sách kế toán đến các năm trong tương lai (nếu có);\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a9b70-5d99-11f1-b527-19bb563eb8e1\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(e) Các khoản được điều chỉnh vào năm tài chính hiện tại và mỗi năm trước, như:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a9b70-5d99-11f1-b527-19bb563eb8e1\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Từng khoản mục trên báo cáo tài chính bị ảnh hưởng\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a9b70-5d99-11f1-b527-19bb563eb8e1\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Chỉ số lãi cơ bản trên cổ phiếu\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a9b70-5d99-11f1-b527-19bb563eb8e1\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(g) Khoản điều chỉnh cho các năm trước được trình bày trên báo cáo tài chính.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a9b70-5d99-11f1-b527-19bb563eb8e1\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;(h) Trình bày lý do và mô tả chính sách kế toán đó được áp dụng như thế nào và bắt đầu từ khi nào nếu không thể áp dụng hồi tố đối với một năm nào đó trong quá khứ, hoặc đối với năm sớm nhất.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a9b70-5d99-11f1-b527-19bb563eb8e1\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;Báo cáo tài chính của các năm tiếp theo không phải trình bày lại các thông tin này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a9b70-5d99-11f1-b527-19bb563eb8e1\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ về áp dụng hồi tố thay đổi chính sách kế toán\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a9b70-5d99-11f1-b527-19bb563eb8e1\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCông ty BASA có năm tài chính đầu tiên từ ngày 1/1/2004 đến ngày 31/12/2004.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a9b70-5d99-11f1-b527-19bb563eb8e1\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eĐầu năm 2004, công ty BASA đã áp dụng phương pháp tính giá xuất của hàng tồn kho (Tài khoản 156- Hàng hóa) cho mặt hàng A theo phương pháp nhập trước, xuất trước. Đầu năm 2005 Công ty A thay đổi chính sách kế toán và áp dụng phương pháp tính giá xuất kho cho mặt hàng A theo phương pháp bình quân gia quyền. Như vậy Công ty BASA phải áp dụng hồi tố đối với hàng hóa A đã xuất kho trong năm 2004 theo phương pháp bình quân gia quyền. Việc áp dụng hồi tố đối với hàng hóa A đã xuất kho của năm 2004 sẽ ảnh hưởng đến các chỉ tiêu của Bảng cân đối kế toán và Báo cáo kết quả hoạt động kinh doanh của năm 2004. Vì vậy cột thông tin so sánh năm 2004 trong báo cáo tài chính năm 2005 phải được điều chỉnh lại để phù hợp với sự thay đổi chính sách kế toán này. Giả sử việc áp dụng hồi tố làm cho giá vốn hàng bán trong năm 2004 tăng lên 14.000.000đ.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a9b70-5d99-11f1-b527-19bb563eb8e1\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCông ty BASA có số liệu báo cáo chưa điều chỉnh của các năm như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a9b70-5d99-11f1-b527-19bb563eb8e1\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBảng số 01\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a9b70-5d99-11f1-b527-19bb563eb8e1\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cem\u003e(Đơn vị tính: Đồng)\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" width=\"660\" style=\"text-align: justify;\" id=\"6c7a9b70-5d99-11f1-b527-19bb563eb8e1\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eChỉ tiêu\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eNăm 2005\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eNăm 2004\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBáo cáo kết quả hoạt động kinh doanh\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eDoanh thu bán hàng và cung cấp dịch vụ\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eGiá vốn hàng bán\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eLợi nhuận kế toán trước thuế TNDN\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eChi phí thuế TNDN hiện hành\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content n: justify;\" id=\"6c7a9b70-5d99-11f1-b527-19bb563eb8e1\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(3) Thuyết minh kèm theo:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a9b70-5d99-11f1-b527-19bb563eb8e1\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eDo thay đổi phương pháp tính giá xuất của hàng tồn kho từ phương pháp nhập trước, xuất trước sang phương pháp bình quân gia quyền nên năm 2004 giá vốn hàng bán tăng và hàng tồn kho giảm 14.000.000đ, thay đổi này làm báo cáo tài chính của năm 2004 bị ảnh hưởng như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7a9b70-5d99-11f1-b527-19bb563eb8e1\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBảng số 04\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"text-align: justify;\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eKhoản mục báo cáo\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp; Ảnh hưởng của thay đổi chính sách kế toán đến:\u003c/span\u003e\u003c/p\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;Kết quả hoạt động kinh doanh năm 2004\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Giá vốn hàng bán tăng\u003c/span\u003e\u003c/p\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Chi phí thuế TNDN giảm\u003c/span\u003e\u003c/p\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Lợi nhuận sau thuế TNDN giảm\u003c/span\u003e\u003c/p\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e14.000.000\u003c/span\u003e\u003c/p\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3.920.000\u003c/span\u003e\u003c/p\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;10.080.000\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBảng Cân đối kế toán ngày 31/12/2004\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Hàng tồn kho giảm\u003c/span\u003e\u003c/p\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Thuế TNDN phải trả giảm\u003c/span\u003e\u003c/p\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Lợi nhuận chưa phân phối giảm\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e14.000.000\u003c/span\u003e\u003c/p\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3.920.000\u003c/span\u003e\u003c/p\u003e\n      \u003cp\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e10.080.000\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp class=\"prov-section\" style=\"text-align: justify;\" id=\"6c7ae990-5d99-11f1-b7cc-7dd2c6aa0704\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2 - Thay đổi ước tính kế toán và kế toán ảnh hưởng do thay đổi ước tính kế toán\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" style=\"text-align: justify;\" id=\"6c7b5ec0-5d99-11f1-ad45-11878a516aff\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.1- Thay đổi ước tính kế toán\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7b5ec0-5d99-11f1-ad45-11878a516aff\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(1) Thay đổi ước tính kế toán là việc điều chỉnh giá trị ghi sổ của tài sản, nợ phải trả hoặc giá trị tiêu hao định kỳ của tài sản được tạo ra từ việc đánh giá tình trạng hiện thời và lợi ích kinh tế trong tương lai cũng như nghĩa vụ liên quan đến tài sản và nợ phải trả đó.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7b5ec0-5d99-11f1-ad45-11878a516aff\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e (2) Ví dụ về thay đổi ước tính kế toán:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7b5ec0-5d99-11f1-ad45-11878a516aff\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp; + Thay đổi ước tính kế toán đối với các khoản phải thu khó đòi;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7b5ec0-5d99-11f1-ad45-11878a516aff\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp; + Thay đổi ước tính kế toán về giá trị hàng tồn kho lỗi mốt;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7b5ec0-5d99-11f1-ad45-11878a516aff\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp; + Thay đổi ước tính kế toán về thời gian sử dụng hữu ích hoặc cách thức sử dụng TSCĐ;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7b5ec0-5d99-11f1-ad45-11878a516aff\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp; + Thay đổi ước tính kế toán về nghĩa vụ bảo hành sản phẩm.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7b5ec0-5d99-11f1-ad45-11878a516aff\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7b5ec0-5d99-11f1-ad45-11878a516aff\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp; (3) Một số trường hợp đặc biệt cần lưu ý khi xác định thay đổi ước tính kế toán:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7b5ec0-5d99-11f1-ad45-11878a516aff\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;+ Thay đổi cách thức xác định thông tin là thay đổi chính sách kế toán mà không phải là thay đổi ước tính kế toán;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7b5ec0-5d99-11f1-ad45-11878a516aff\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp; + Khi khó xác định một thay đổi là thay đổi chính sách kế toán hay thay đổi ước tính kế toán thì thay đổi này được coi là thay đổi ước tính kế toán.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" style=\"text-align: justify;\" id=\"6c7b85d0-5d99-11f1-baef-4dc66f79522f\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.2- Nguyên tắc ghi nhận ảnh hưởng của việc thay đổi ước tính kế toán\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7b85d0-5d99-11f1-baef-4dc66f79522f\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(1) Các thay đổi ước tính kế toán trừ những thay đổi quy định tại đoạn 20 của Chuẩn mực kế toán số 29 sẽ được áp dụng phi hồi tố và được ghi nhận vào Báo cáo kết quả hoạt động kinh doanh:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7b85d0-5d99-11f1-baef-4dc66f79522f\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Trường hợp thay đổi ước tính kế toán chỉ ảnh hưởng đến năm hiện tại, doanh nghiệp phản ánh những thay đổi đó vào Báo cáo kết quả hoạt động kinh doanh của năm hiện tại;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7b85d0-5d99-11f1-baef-4dc66f79522f\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Trường hợp thay đổi ước tính kế toán ảnh hưởng đến cả năm hiện tại và các năm khác trong tương lai, doanh nghiệp phản ánh những thay đổi đó vào Báo cáo kết quả hoạt động kinh doanh của năm hiện tại và các năm trong tương lai;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7b85d0-5d99-11f1-baef-4dc66f79522f\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ về thay đổi ước tính kế toán ảnh hưởng đến lợi nhuận hoặc lỗ thuần của doanh nghiệp:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7b85d0-5d99-11f1-baef-4dc66f79522f\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eThay đổi ước tính giá trị khoản phải thu khó đòi chỉ ảnh hưởng đến lãi, lỗ của kỳ hiện tại và do đó được ghi nhận vào năm hiện tại. Thay đổi ước tính thời gian sử dụng hữu ích hoặc cách thức sử dụng TSCĐ làm cơ sở tính khấu hao sẽ ảnh hưởng đến chi phí khấu hao của cả năm hiện tại và các năm trong tương lai. Trường hợp này, ảnh hưởng của thay đổi giá trị phải khấu hao đối với năm hiện tại được ghi nhận vào Báo cáo kết quả hoạt động kinh doanh của năm hiện tại, còn những ảnh hưởng đối với các năm trong tương lai được ghi nhận vào Báo cáo kết quả hoạt động kinh doanh của các năm trong tương lai.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7b85d0-5d99-11f1-baef-4dc66f79522f\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(2) Các thay đổi ước tính kế toán dẫn đến thay đổi các khoản mục của Bảng cân đối kế toán được ghi nhận bằng cách điều chỉnh giá trị ghi sổ của tài sản, nợ phải trả hay khoản mục thuộc vốn chủ sở hữu\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7b85d0-5d99-11f1-baef-4dc66f79522f\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ về thay đổi ước tính kế toán ảnh hưởng đến giá trị ghi sổ của tài sản, nợ phải trả: Doanh nghiệp thay đổi ước tính tỷ lệ phần trăm (%) sản phẩm dở dang của năm nay\u0026nbsp; không làm ảnh hưởng đến Báo cáo kết quả hoạt động kinh doanh năm trước mà chỉ ảnh hưởng đến giá trị ghi sổ của tài sản và kết quả kinh doanh của năm nay.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" style=\"text-align: justify;\" id=\"6c7bace0-5d99-11f1-acab-0b839034154b\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.3- Kế toán về ảnh hưởng do thay đổi ước tính kế toán\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7bace0-5d99-11f1-acab-0b839034154b\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eKhi thay đổi các ước tính kế toán trong năm hiện tại thì kế toán như các nghiệp vụ kinh tế phát sinh mới trong năm theo ước tính kế toán mới.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" style=\"text-align: justify;\" id=\"6c7bd3f0-5d99-11f1-8c5c-1399457bfa78\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2.4- Trình bày về thay đổi ước tính kế toán\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7bd3f0-5d99-11f1-8c5c-1399457bfa78\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e Doanh nghiệp phải trình bày tính chất và giá trị của các thay đổi ước tính kế toán có ảnh hưởng đến năm hiện tại, dự kiến ảnh hưởng đến các năm trong tương lai. Khi không thể xác định được các ảnh hưởng này thì phải trình bày rõ lý do.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-section\" style=\"text-align: justify;\" id=\"6c7c2210-5d99-11f1-8b7c-cd1dc856f4c3\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3- Sai sót và kế toán ảnh hưởng do điều chỉnh sai sót\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" style=\"text-align: justify;\" id=\"6c7c7030-5d99-11f1-81e1-27c9d92ec861\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3.1- Sai sót\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(1) Sai sót có thể phát sinh từ việc ghi nhận, xác định giá trị, trình bày hoặc thuyết minh các khoản mục trên báo cáo tài chính.\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(2) Sai sót bao gồm: Sai sót do tính toán, áp dụng sai chính sách kế toán, bỏ quên, hiểu hoặc diễn giải sai các sự việc và gian lận.\u0026nbsp;\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Sai sót do tính toán là sai sót do tính nhầm dẫn đến việc ghi nhận sai, như tính nhầm giá trị tài sản, khoản phải thu, nợ phải trả, khoản chi phí, ...\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Áp dụng sai chính sách kế toán là sai sót do hiểu sai chuẩn mực kế toán nên vận dụng sai chính sách kế toán, hoặc chuẩn mực kế toán mới đã có hiệu lực nhưng doanh nghiệp vẫn áp dụng chuẩn mực cũ;\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Bỏ quên không ghi nhận một hoặc một vài giao dịch kinh tế nào đó như mua TSCĐ nhưng bỏ quên chưa ghi sổ TSCĐ; bán hàng nhưng chưa ghi nhận doanh thu và khoản phải thu,....\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Hiểu hoặc diễn giải sai các sự việc là sai sót do hiểu sai các sự việc, như: Theo quy định thì TSCĐ đã khấu hao hết giá trị nhưng vẫn tiếp tục được sử dụng vào sản xuất, kinh doanh thì không được trích khấu hao nhưng doanh nghiệp hiểu sai lại đánh giá lại và tiếp tục trích khấu hao.\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Gian lận là sai sót do cố ý gây ra, như: Thu tiền của người mua hàng không nộp quỹ mà sử dụng cho cá nhân; lấy tiền công quỹ, hàng tồn kho sử dụng cho cá nhân,...\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(3) Thông tư này chỉ hướng dẫn kế toán đối với các trường hợp sai sót trọng yếu hoặc các sai sót không trọng yếu nhưng do cố ý trình bày tình hình tài chính, kết quả hoạt động kinh doanh hay các luồng tiền theo một hướng khác làm ảnh hưởng đến báo cáo tài chính (Các trường hợp sai sót ngoài 2 trường hợp nêu trên được điều chỉnh vào năm hiện tại).\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" style=\"text-align: justify;\" id=\"6c7c9740-5d99-11f1-b0f1-ff32c602ecdf\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3.2 – Nguyên tắc điều chỉnh sai sót\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7c9740-5d99-11f1-b0f1-ff32c602ecdf\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(1) Những sai sót của năm hiện tại được phát hiện trong năm đó phải được điều chỉnh trước khi công bố báo cáo tài chính.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7c9740-5d99-11f1-b0f1-ff32c602ecdf\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(2) Sai sót trọng yếu của các năm trước phải được điều chỉnh bằng cách điều chỉnh hồi tố kể từ năm có sai sót phát sinh, trừ khi không thể xác định được ảnh hưởng của sai sót của từng năm hay ảnh hưởng lũy kế của sai sót.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7c9740-5d99-11f1-b0f1-ff32c602ecdf\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eKhi phát hiện ra sai sót trọng yếu của các năm trước, doanh nghiệp phải xác định ảnh hưởng của sai sót này đến báo cáo tài chính của từng năm. Sau khi xác định được ảnh hưởng của sai sót cho từng năm, ảnh hưởng luỹ kế của các năm trước cho đến năm hiện tại, căn cứ vào số liệu xác định được doanh nghiệp phải điều chỉnh lại số dư đầu năm các tài khoản tài sản, nợ phải trả hoặc vốn chủ sở hữu bị ảnh hưởng của năm hiện tại, điều chỉnh lại số liệu so sánh của báo cáo tài chính mỗi năm trước bị ảnh hưởng và trình bày lại số liệu so sánh sau khi đã điều chỉnh của mỗi năm trước vào Bản thuyết minh báo cáo tài chính. Việc điều chỉnh được thực hiện theo nguyên tắc:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7c9740-5d99-11f1-b0f1-ff32c602ecdf\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003ea/ Nếu sai sót làm ảnh hưởng đến kết quả kinh doanh của doanh nghiệp trong các năm trước, doanh nghiệp phải xác định ảnh hưởng của sai sót tới từng năm và điều chỉnh vào các khoản mục thuộc cột thông tin so sánh (Cột \"Năm trước\") của \"Báo cáo kết quả hoạt động kinh doanh\" các năm bị ảnh hưởng; Đồng thời xác định ảnh hưởng lũy kế của sai sót và điều chỉnh vào số dư đầu năm của Tài khoản 421- \"Lợi nhuận chưa phân phối\" (TK 4211- Lợi nhuận chưa phân phối năm trước) của năm hiện tại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7c9740-5d99-11f1-b0f1-ff32c602ecdf\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eViệc điều chỉnh chia thành 2 trường hợp sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7c9740-5d99-11f1-b0f1-ff32c602ecdf\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Nếu sai sót làm sai lệch kết quả kinh doanh của doanh nghiệp trong năm lấy số liệu so sánh, doanh nghiệp phải điều chỉnh số liệu trên cột thông tin so sánh trên Báo cáo kết quả hoạt động kinh doanh năm hiện tại và điều chỉnh số dư đầu năm Tài khoản 421- “Lợi nhuận chưa phân phối” (TK 4211- Lợi nhuận chưa phân phối năm trước) trên Bảng cân đối kế toán năm hiện tại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7c9740-5d99-11f1-b0f1-ff32c602ecdf\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Nếu sai sót làm sai lệch kết quả kinh doanh của doanh nghiệp trong các năm trước năm lấy số liệu so sánh, doanh nghiệp phải xác định ảnh hưởng của sai sót tới từng năm và điều chỉnh vào cột thông tin so sánh (Cột \"Năm trước\") của Báo cáo kết quả hoạt động kinh doanh của các năm bị ảnh hưởng; Đồng thời xác định ảnh hưởng luỹ kế của sai sót và điều chỉnh vào số dư đầu năm Tài khoản 421- “Lợi nhuận chưa phân phối” (TK 4211- Lợi nhuận chưa phân phối năm trước) trên Bảng cân đối kế toán năm hiện tại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7c9740-5d99-11f1-b0f1-ff32c602ecdf\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e b/ Nếu sai sót làm ảnh hưởng đến các khoản mục tài sản, nợ phải trả hoặc vốn chủ sở hữu của doanh nghiệp trong các năm trước, doanh nghiệp phải xác định ảnh hưởng của sai sót tới từng năm và điều chỉnh vào các khoản mục thuộc cột thông tin so sánh (Cột \"Số đầu năm\") của Bảng cân đối kế toán các năm bị ảnh hưởng; Đồng thời xác định ảnh hưởng lũy kế của sai sót và điều chỉnh vào số dư đầu năm của các Tài khoản Tài sản, Nợ phải trả hoặc Vốn chủ sở hữu của năm hiện tại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7c9740-5d99-11f1-b0f1-ff32c602ecdf\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e Việc điều chỉnh được chia thành 2 trường hợp sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7c9740-5d99-11f1-b0f1-ff32c602ecdf\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Nếu sai sót làm sai lệch tài sản, nợ phải trả, hoặc vốn chủ sở hữu của doanh nghiệp tại thời điểm lập báo tài chính năm lấy số liệu so sánh, doanh nghiệp phải điều chỉnh số liệu trên cột thông tin so sánh của Bảng cân đối kế toán năm hiện tại và số dư đầu năm của các Tài khoản tài sản, nợ phải trả, hoặc vốn chủ sở hữu trên sổ kế toán của năm hiện tại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7c9740-5d99-11f1-b0f1-ff32c602ecdf\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e+ Nếu sai sót làm sai lệch tài sản, nợ phải trả, hoặc vốn chủ sở hữu của doanh nghiệp trong các năm trước năm lấy số liệu so sánh, doanh nghiệp phải điều chỉnh số liệu trên cột thông tin so sánh (Cột \"Số đầu năm\") của Bảng Cân đối kế toán các năm bị ảnh hưởng, đồng thời điều chỉnh số liệu trên cột thông tin so sánh của Bảng cân đối kế toán năm hiện tại và số dư đầu năm của các Tài khoản tài sản, nợ phải trả, hoặc vốn chủ sở hữu trên sổ kế toán của năm hiện tại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7c9740-5d99-11f1-b0f1-ff32c602ecdf\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(3) Doanh nghiệp không được điều chỉnh vào cột \"Năm nay\" trên \"Báo cáo kết quả hoạt động kinh doanh\" của năm hiện tại khi điều chỉnh ảnh hưởng do sai sót trọng yếu trong các năm trước mà chỉ được thực hiện bằng cách trình bày lại số liệu trên cột thông tin so sánh (Cột \"Năm trước\") của \"Báo cáo kết quả hoạt động kinh doanh\" năm hiện tại.\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7c9740-5d99-11f1-b0f1-ff32c602ecdf\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(4) Khi thực hiện việc điều chỉnh số dư đầu năm do điều chỉnh sai sót trọng yếu trên các Tài khoản ở Sổ kế toán tổng hợp, Sổ kế toán chi tiết, ngoài việc diễn giải nội dung kinh tế của nghiệp vụ kinh tế, doanh nghiệp còn phải ghi rõ lý do việc điều chỉnh là do sai sót phát sinh từ các năm trước.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7c9740-5d99-11f1-b0f1-ff32c602ecdf\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(5) Khi không thể xác định được ảnh hưởng của sai sót đến từng năm hoặc ảnh hưởng luỹ kế của sai sót thì doanh nghiệp phải điều chỉnh hồi tố sai sót kể từ năm sớm nhất mà doanh nghiệp xác định được ảnh hưởng của sai sót.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7c9740-5d99-11f1-b0f1-ff32c602ecdf\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(6) Sai sót không trọng yếu của các năm trước được sửa chữa bằng cách điều chỉnh phi hồi tố vào báo cáo tài chính năm hiện tại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" style=\"text-align: justify;\" id=\"6c7cbe50-5d99-11f1-965e-e34b1075df6c\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e 3.3 - Kế toán ảnh hưởng của việc điều chỉnh sai sót\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-item\" style=\"text-align: justify;\" id=\"6c7ce560-5d99-11f1-96cf-019d4febab8a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3.3.1- Sai sót phát sinh trong năm hiện tại\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7ce560-5d99-11f1-96cf-019d4febab8a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eSai sót trọng yếu hay không trọng yếu phát sinh trong năm hiện tại hoặc phát sinh trong năm trước nhưng báo cáo tài chính của năm trước chưa công bố thì đều phải được điều chỉnh trước khi công bố báo cáo tài chính.\u003c/span\u003e\u003c/p\u003e\n  \u003cp style=\"text-align: justify;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3.3.2- Sai sót phát sinh trong các năm trước\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7ce560-5d99-11f1-96cf-019d4febab8a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Sai sót trọng yếu phát sinh trong các năm trước được phát hiện sau khi báo cáo tài chính của năm trước đã công bố phải được sửa chữa theo phương pháp điều chỉnh hồi tố có ảnh hưởng đến Bảng cân đối kế toán năm trước và năm nay hoặc Báo cáo kết quả hoạt động kinh doanh của các năm trước, được điều chỉnh theo phương pháp hướng dẫn tại mục 1.2.2 \"Phương pháp điều chỉnh hồi tố\" trong Phần V của Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7ce560-5d99-11f1-96cf-019d4febab8a\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e - Sai sót không trọng yếu của các năm trước được phát hiện sau khi báo cáo tài chính của năm trước đã công bố thì được sửa chữa bằng cách điều chỉnh phi hồi tố vào sổ sách kế toán và báo cáo tài chính năm hiện tại.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-clause\" style=\"text-align: justify;\" id=\"6c7d3380-5d99-11f1-bbe6-0986b88d298d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3.4 – Trình bày sai sót của các năm trước\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7d3380-5d99-11f1-bbe6-0986b88d298d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eKhi điều chỉnh hồi tố các sai sót trọng yếu, doanh nghiệp phải trình bày các thông tin sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7d3380-5d99-11f1-bbe6-0986b88d298d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(a) Bản chất của sai sót thuộc các năm trước;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7d3380-5d99-11f1-bbe6-0986b88d298d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(b) Khoản điều chỉnh đối với mỗi năm trước trong báo cáo tài chính:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7d3380-5d99-11f1-bbe6-0986b88d298d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Từng khoản mục trên báo cáo tài chính bị ảnh hưởng\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7d3380-5d99-11f1-bbe6-0986b88d298d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Chỉ số lãi cơ bản trên cổ phiếu\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7d3380-5d99-11f1-bbe6-0986b88d298d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(c) Giá trị điều chỉnh vào đầu năm của năm lấy số liệu so sánh được trình bày trên báo cáo tài chính.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7d3380-5d99-11f1-bbe6-0986b88d298d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e(d) Nếu không thực hiện được điều chỉnh hồi tố đối với một năm cụ thể trong quá khứ, cần trình bày rõ lý do, mô tả cách thức và thời gian điều chỉnh sai sót.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7d3380-5d99-11f1-bbe6-0986b88d298d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBáo cáo tài chính của các năm tiếp theo không phải trình bày lại những thông tin này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7d3380-5d99-11f1-bbe6-0986b88d298d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eVí dụ về điều chỉnh hồi tố các sai sót trọng yếu\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7d3380-5d99-11f1-bbe6-0986b88d298d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eCông ty Hoa Lan có năm tài chính đầu tiên từ ngày 1/1/2003 đến ngày 31/12/2003\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7d3380-5d99-11f1-bbe6-0986b88d298d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e- Trong năm 2005, Công ty Hoa Lan phát hiện thấy một số thành phẩm trị giá 6.500.000đ đã bán trong năm 2004 nhưng vẫn được theo dõi trên sổ kế toán TK 155 (chưa ghi xuất kho để bán) và được trình bày trong Bảng Cân đối kế toán ngày 31/12/2004.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7d3380-5d99-11f1-bbe6-0986b88d298d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e - Lợi nhuận chưa phân phối đầu năm 2004 là 20.000.000đ; Lợi nhuận chưa phân phối cuối năm 2004 là 34.000.000đ (20.000.000đ + 14.000.000đ); Giả sử thuế suất thuế TNDN là 28%; Công ty\u0026nbsp; không có các khoản thu nhập và chi phí nào khác;\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7d3380-5d99-11f1-bbe6-0986b88d298d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp; Công ty Hoa Lan có số liệu báo cáo tài chính chưa điều chỉnh sai sót của các năm như sau:\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"text-align: justify;\" id=\"6c7d3380-5d99-11f1-bbe6-0986b88d298d\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003eBảng số 05\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" cellpadding=\"0\" cellspacing=\"0\" style=\"text-align: justify;\" id=\"6c7d3380-5d99-11f1-bbe6-0986b88d298d\"\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-content\" align=\"center\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eChỉ tiêu\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n     \u003ctd\u003e\n      \u003cp class=\"prov-conte an style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1.820.000\u003c/span\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" style=\"font-size: 14px;\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4.680.000\u003c/span\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp class=\"prov-part\" style=\"text-align: justify;\" id=\"6c7d5a90-5d99-11f1-aed3-eb628f2e07d3\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e\u003cstrong\u003eVI- TỔ CHỨC THỰC HIỆN\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-section\" style=\"text-align: justify;\" id=\"6c7d81a0-5d99-11f1-8fe1-b38792553abc\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e1- Thông tư này có hiệu lực sau 15 ngày, kể từ ngày đăng công báo. Các qui định trước đây trái với Thông tư này đều bãi bỏ. Những phần kế toán khác có liên quan nhưng không hướng dẫn trong Thông tư này thì thực hiện theo chế độ kế toán hiện hành.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-section\" style=\"text-align: justify;\" id=\"6c7dcfc0-5d99-11f1-8857-cb729fc465ef\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e2- Các qui định trong chuẩn mực kế toán có khác biệt với chính sách tài chính do Bộ Tài chính ban hành trước khi ban hành chuẩn mực kế toán thì thực hiện theo qui định trong chuẩn mực kế toán và hướng dẫn trong Thông tư này.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-section\" style=\"text-align: justify;\" id=\"6c7df6d0-5d99-11f1-924a-596a79ded1e3\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e3- Các Tổng công ty, công ty có chế độ kế toán đặc thù đã được Bộ Tài chính chấp thuận, phải căn cứ vào 06 chuẩn mực kế toán (đợt 4) ban hành theo Quyết định số 12/2005/QĐ-BTC ngày 15/02/2005 và Thông tư này để hướng dẫn, bổ sung phù hợp.\u003c/span\u003e\u003c/p\u003e\n  \u003cp class=\"prov-section\" style=\"text-align: justify;\" id=\"6c7e44f0-5d99-11f1-a4c0-0b66af5f9dea\"\u003e\u003cspan style=\"font-family: 'times new roman', times, serif; font-size: 14px;\"\u003e4- Các Bộ, ngành, Uỷ ban nhân dân, Sở Tài chính, Cục thuế các Tỉnh, Thành phố trực thuộc Trung ương có trách nhiệm triển khai hướng dẫn các doanh nghiệp thực hiện Thông tư này. Trong quá trình thực hiện nếu có vướng mắc đề nghị phản ánh về Bộ Tài chính để nghiên cứu giải quyết./.\u003c/span\u003e\u003c/p\u003e\n  \u003ctable border=\"1\" style=\"border-collapse: collapse; width: 100%;\"\u003e\n   \u003ccolgroup\u003e\n    \u003ccol style=\"width: 50%;\"\u003e\n    \u003ccol style=\"width: 50%;\"\u003e\n   \u003c/colgroup\u003e\n   \u003ctbody\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"text-align: center;\"\u003e\u003c/td\u003e\n     \u003ctd style=\"text-align: center;\"\u003e\u003cstrong\u003eKT. BỘ TRƯỞNG\u003c/strong\u003e\u003cbr\u003e\u003cstrong\u003eTHỨ TRƯỞNG\u003c/strong\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n     \u003ctd style=\"text-align: center;\"\u003e\u003c/td\u003e\n     \u003ctd style=\"text-align: center;\"\u003e\u003cem\u003e\u003cstrong\u003e(Đã ký)\u003c/strong\u003e\u003c/em\u003e\u003cbr\u003e\u003cstrong\u003eTrần Văn Tá\u003c/strong\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n \u003c/body\u003e\n\u003c/html\u003e"])</script><script>self.__next_f.push([1,"d:[[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"Legislation\\\",\\\"name\\\":\\\"Thông tư số 20/2006/TT-BTC Hướng dẫn kế toán thực hiện sáu (06) chuẩn mực kế toán ban hành theo Quyết định số 12/2005/QĐ-BTC ngày 15/02/2005 của Bộ trưởng Bộ Tài chính\\\",\\\"legislationIdentifier\\\":\\\"20/2006/TT-BT

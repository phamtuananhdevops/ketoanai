 Tối cao\",\"description\":\"Cổng thông tin chính thức của Tòa án Nhân dân Tối cao Việt Nam\"},\"foreign\":{\"title\":\"Cổng Thông tin điện tử\u003cbr/\u003eBộ Ngoại giao\",\"description\":\"Cổng thông tin chính thức của Bộ Ngoại giao Việt Nam\"},\"officialGazette\":{\"title\":\"Cổng Thông tin điện tử\u003cbr/\u003eCông báo\",\"description\":\"Cổng thông tin chính thức của Cơ quan Công báo Việt Nam\"},\"feedbackSuggestions\":{\"title\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\",\"description\":\"PHẢN ÁNH, KIẾN NGHỊ VĂN BẢN QPPL\"}}},\"footer\":{\"unit\":\"Đơn vị chủ quản\",\"unitContent\":\"Bộ Tư pháp\",\"address\":\"Địa chỉ\",\"addressContent\":\"Số 60 Trần Phú - Ba Đình - Thành phố Hà Nội\",\"phoneNumber\":\"Điện thoại\",\"phoneNumberContent\":\"024.6273.9468\",\"fax\":\"Fax\",\"faxContent\":\"024.6273.9359\"},\"underConstruction\":{\"title\":\"Đang cập nhật\",\"message\":\"Chức năng này đang được phát triển.\"},\"gioiThieu\":{\"timeline\":{\"2005\":{\"description\":\"Năm 2005 đánh dấu sự khởi đầu của dự án xây dựng Cơ sở dữ liệu quốc gia về pháp luật, với mục tiêu số hóa và tập trung hóa các văn bản pháp luật của Việt Nam.\"},\"2012-2013\":{\"description\":\"Giai đoạn 2012-2013 là thời kỳ phát triển và mở rộng hệ thống, với việc tích hợp thêm nhiều tính năng và cải thiện giao diện người dùng.\"},\"2023-2025\":{\"description\":\"Giai đoạn 2023-2025 tập trung vào việc nâng cấp và hiện đại hóa hệ thống, áp dụng các công nghệ mới và mở rộng phạm vi phục vụ.\"}},\"overview\":{\"title\":\"SƠ LƯỢC MÔ HÌNH CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"CSDLQG về pháp luật tập hợp các văn bản quy phạm pháp luật và văn bản hợp nhất văn bản quy phạm pháp luật (sau đây gọi chung là văn bản) dưới dạng văn bản điện tử do Chính phủ thống nhất quản lý, có địa chỉ truy cập vbpl.vn, bao gồm các Cơ sở dữ liệu thành phần: Cơ sở dữ liệu văn bản pháp luật Trung ương và Cơ sở dữ liệu văn bản pháp luật địa phương.\",\"central\":{\"title\":\"Cơ sở dữ liệu Văn bản pháp luật Trung ương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của các Bộ, cơ quan ngang Bộ, cơ quan nhà nước khác ở Trung ương ban hành hoặc phối hợp ban hành. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật; Văn bản hợp nhất; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"local\":{\"title\":\"Cơ sở dữ liệu văn bản pháp luật địa phương\",\"content\":\"Là Cơ sở dữ liệu chứa văn bản quy phạm pháp luật của từng tỉnh, thành phố trực thuộc Trung ương trên toàn quốc. Các loại văn bản được quản lý bao gồm: Văn bản quy phạm pháp luật của Hội đồng nhân dân và Ủy ban nhân dân; Hệ thống hóa văn bản quy phạm pháp luật.\"},\"other\":{\"title\":\"Các chuyên mục khác\",\"content\":\"Ngoài các Cơ sở dữ liệu thành phần kể trên, CSDLQG về pháp luật còn có các chuyên mục khác như: Giới thiệu văn bản mới, Tin tức, Tình huống pháp luật. Ngoài ra, CSDLQG về thủ tục hành chính, bộ pháp điển điện tử, cổng thông tin điện tử Bộ Tư pháp cũng trích xuất về CSDLQG về pháp luật.\"}},\"vision\":{\"title\":\"Tầm nhìn\",\"content\":\"Trở thành nguồn tra cứu văn bản pháp luật chính thống, đầy đủ và đáng tin cậy, phục vụ hiệu quả cho người dân, doanh nghiệp và cơ quan nhà nước.\"},\"mission\":{\"title\":\"Sứ mệnh\",\"content\":\"Cung cấp hệ thống văn bản pháp luật được cập nhật kịp thời, tra cứu thuận tiện, góp phần nâng cao nhận thức pháp luật và bảo đảm việc tuân thủ pháp luật trong xã hội.\"},\"features\":{\"title\":\"MỘT SỐ TÍNH NĂNG, TIỆN ÍCH CỦA CSDLQG VỀ PHÁP LUẬT\",\"intro\":\"Hiện nay, CSDLQG về PL có giao diện tương đối thân thiện, dễ tìm kiếm, dễ khai thác các thông tin và tải về sử dụng. Cơ sở dữ liệu cung cấp các chức năng, tiện ích cơ bản và thuận tiện\",\"list\":[{\"key\":\"fullText\",\"label\":\"Tra cứu toàn văn\",\"icon\":\"SearchOutlined\"},{\"key\":\"tableOfContents\",\"label\":\"Tự động tạo mục lục\",\"icon\":\"BookOutlined\"},{\"key\":\"relatedDocuments\",\"label\":\"Liên kết văn bản liên quan\",\"icon\":\"LinkOutlined\"},{\"key\":\"validity\",\"label\":\"Xác định hiệu lự HÍNH PHỦ\u003c/strong\u003e\u003c/p\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"document-national-header__column\" style=\"width:100%; max-width:100%; min-width:0; box-sizing:border-box; overflow-wrap:anywhere; word-break:break-word; text-align:center !important; margin-left:0 !important; margin-right:0 !important;\"\u003e\n       \u003cp id=\"p1_r1\" style=\"font-weight:bold; margin-bottom:3px; width:100%; margin-left:0 !important; margin-right:0 !important; text-align:center !important;\"\u003e\u003cspan style=\"font-family:'times new roman', times, serif; width:100%; margin-left:0 !important; margin-right:0 !important; text-align:center !important;\"\u003eCỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM\u003c/span\u003e\u003c/p\u003e\n       \u003cp style=\"font-weight:bold; margin-bottom:3px; font-family:'Times New Roman', Times, serif; width:100%; margin-left:0 !important; margin-right:0 !important; text-align:center !important;\"\u003e\u003cspan style=\"font-family:'times new roman', times, serif; width:100%; margin-left:0 !important; margin-right:0 !important; text-align:center !important;\"\u003e\u003cstrong style=\"width:100%; margin-left:0 !important; margin-right:0 !important; text-align:center !important;\"\u003eĐộc lập - Tự do - Hạnh phúc\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n      \u003c/div\u003e\n     \u003c/div\u003e\n     \u003cdiv class=\"document-national-header__row\" style=\"display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); width:100%; max-width:100%; min-width:0; box-sizing:border-box; column-gap:24px; justify-items:center; align-items:start;\"\u003e\n      \u003cdiv class=\"document-national-header__column\" style=\"width:100%; max-width:100%; min-width:0; box-sizing:border-box; overflow-wrap:anywhere; word-break:break-word; text-align:center !important; margin-left:0 !important; margin-right:0 !important;\"\u003e\n       \u003cspan style=\"font-family:'times new roman', times, serif; width:100%; margin-left:0 !important; margin-right:0 !important; text-align:center !important;\"\u003eSố: 91/2022/NĐ-CP\u003c/span\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"document-national-header__column\" style=\"width:100%; max-width:100%; min-width:0; box-sizing:border-box; overflow-wrap:anywhere; word-break:break-word; text-align:center !important; margin-left:0 !important; margin-right:0 !important;\"\u003e\n       \u003cem style=\"font-family:'times new roman', times, serif; width:100%; margin-left:0 !important; margin-right:0 !important; text-align:center !important;\"\u003eHà Nội, ngày 30 tháng 10 năm 2022\u003c/em\u003e\n      \u003c/div\u003e\n     \u003c/div\u003e\n    \u003c/div\u003e\n   \u003c/div\u003e\n  \u003c/div\u003e\n  \u003cp id=\"p1_r5\" style=\"text-align: center;\"\u003e\u003cstrong\u003eNGHỊ ĐỊNH \u003c/strong\u003e\u003c/p\u003e\n  \u003cp style=\"font-family: 'Times New Roman', Times, serif; text-align: center;\"\u003e\u003cstrong\u003eSửa đổi, bổ sung một số điều của Nghị định số 126/2020/NĐ-CP \u003c/strong\u003e\u003c/p\u003e\n  \u003cp style=\"font-family: 'Times New Roman', Times, serif; text-align: center;\"\u003e\u003cstrong\u003engày 19 tháng 10 năm 2020 của Chính phủ quy định \u003c/strong\u003e\u003c/p\u003e\n  \u003cp style=\"font-family: 'Times New Roman', Times, serif; text-align: center;\"\u003e\u003cstrong\u003echi tiết một số điều của Luật Quản lý thuế\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"p1_r6\" style=\"text-align: justify;\"\u003e\u003cem\u003eCăn cứ Luật Tổ chức Chính phủ ngày 19 tháng 6 năm 2015; Luật sửa đổi, bổ sung một số điều của Luật Tổ chức Chính phủ và Luật Tổ chức chính quyền địa phương ngày 22 tháng 11 năm 2019;\u003c/em\u003e\u003c/p\u003e\n  \u003cp id=\"p1_r7\" style=\"text-align: justify;\"\u003e\u003cem\u003eCăn cứ Luật Quản lý thuế ngày 13 tháng 6 năm 2019;\u003c/em\u003e\u003c/p\u003e\n  \u003cp id=\"p1_r8\" style=\"text-align: justify;\"\u003e\u003cem\u003eTheo đề nghị của Bộ trưởng Bộ Tài chính;\u003c/em\u003e\u003c/p\u003e\n  \u003cp id=\"p1_r9\" style=\"text-align: justify;\"\u003e\u003cem\u003eChính phủ ban hành Nghị định sửa đổi, bổ sung một số điều của Nghị định số 126/2020/NĐ-CP ngày 19 tháng 10 năm 2020 của Chính phủ quy định chi tiết một số điều của Luật Quản lý thuế.\u003c/em\u003e\u003c/p\u003e\n  \u003cp id=\"216b52a0-2b6c-11f1-bd7e-61e7cb8357f5\" class=\"prov-article\" style=\"text-align: justify;\"\u003e\u003cstrong\u003eĐiều 1. Sửa đổi, bổ sung một số điều của Nghị định số 126/2020/NĐ-CP ngày 19 tháng 10 năm 2020 của Chính phủ quy định chi tiết một số điều của Luật Quản lý thuế\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"216b79b0-2b6c-11f1-a89f-d70e3a7be34a\" class=\"prov-clause\" style=\"text-align: left;\"\u003e1. Bổ sung Điều 6a như sau:\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-size: 14px; text-align: justify;\"\u003e\"\u003cstrong\u003eĐiều 6a. Kết thúc thời hạn\u003c/strong\u003e\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-size: 14px; text-align: justify;\"\u003eThời hạn nộp hồ sơ khai thuế, thời hạn nộp thuế, thời hạn cơ quan quản lý thuế giải quyết hồ sơ, thời hạn hiệu lực của quyết định cưỡng chế thi hành quyết định hành chính về quản lý thuế được thực hiện theo quy định tại Luật Quản lý thuế và Nghị định này. Trường hợp ngày cuối cùng của thời hạn nộp hồ sơ khai thuế, thời hạn nộp thuế, thời hạn cơ quan quản lý thuế giải quyết hồ sơ, thời hạn hiệu lực của quyết định cưỡng chế trùng với ngày nghỉ theo quy định thì ngày cuối cùng của thời hạn được tính là ngày làm việc liền kề sau ngày nghỉ đó.\"\u003c/p\u003e\n  \u003cp id=\"216bc7d0-2b6c-11f1-88ac-1be7a4761c3f\" class=\"prov-clause\" style=\"text-align: left;\"\u003e2. Bổ sung điểm e khoản 3 Điều 7 như sau:\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-size: 14px; text-align: justify;\"\u003e\"e) Người khai thuế thu nhập cá nhân là tổ chức, cá nhân trả thu nhập thuộc trường hợp khai thuế thu nhập cá nhân theo tháng, quý mà trong tháng, quý đó không phát sinh việc khấu trừ thuế thu nhập cá nhân của đối tượng nhận thu nhập.\"\u003c/p\u003e\n  \u003cp id=\"216beee0-2b6c-11f1-af5d-4719490da2e4\" class=\"prov-clause\" style=\"text-align: left;\"\u003e3. Điểm b khoản 6 Điều 8 được sửa đổi, bổ sung như sau:\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-size: 14px; text-align: justify;\"\u003e\"b) Thuế thu nhập doanh nghiệp (trừ thuế thu nhập doanh nghiệp từ chuyển nhượng vốn của nhà thầu nước ngoài; thuế thu nhập doanh nghiệp kê khai theo phương pháp tỷ lệ trên doanh thu theo từng lần phát sinh hoặc theo tháng theo quy định tại điểm đ khoản 4 Điều này). Người nộp thuế phải tự xác định số thuế thu nhập doanh nghiệp tạm nộp quý (bao gồm cả tạm phân bổ số thuế thu nhập doanh nghiệp cho địa bàn cấp tỉnh nơi có đơn vị phụ thuộc, địa điểm kinh doanh, nơi có bất động sản chuyển nhượng khác với nơi người nộp thuế đóng trụ sở chính) và được trừ số thuế đã tạm nộp với số phải nộp theo quyết toán thuế năm.\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-size: 14px; text-align: justify;\"\u003eNgười nộp thuế thuộc diện lập báo cáo tài chính quý theo quy định của pháp luật về kế toán căn cứ vào báo cáo tài chính quý và các quy định của pháp luật về thuế để xác định số thuế thu nhập doanh nghiệp tạm nộp quý.\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-size: 14px; text-align: justify;\"\u003eNgười nộp thuế không thuộc diện lập báo cáo tài chính quý theo quy định của pháp luật về kế toán căn cứ vào kết quả sản xuất, kinh doanh quý và các quy định của pháp luật về thuế để xác định số thuế thu nhập doanh nghiệp tạm nộp quý.\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-size: 14px; text-align: justify;\"\u003eTổng số thuế thu nhập doanh nghiệp đã tạm nộp của 04 quý không được thấp hơn 80% số thuế thu nhập doanh nghiệp phải nộp theo quyết toán năm. Trường hợp người nộp thuế nộp thiếu so với số thuế phải tạm nộp 04 quý thì phải nộp tiền chậm nộp tính trên số thuế nộp thiếu kể từ ngày tiếp sau ngày cuối cùng của thời hạn tạm nộp thuế thu nhập doanh nghiệp quý 04 đến ngày liền kề trước ngày nộp số thuế còn thiếu vào ngân sách nhà nước.\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-size: 14px; text-align: justify;\"\u003eNgười nộp thuế có thực hiện dự án đầu tư cơ sở hạ tầng, nhà để chuyển nhượng hoặc cho thuê mua, có thu tiền ứng trước của khách hàng theo tiến độ phù hợp với quy định của pháp luật thì thực hiện tạm nộp thuế thu nhập doanh nghiệp theo quý theo tỷ lệ 1% trên số tiền thu được. Trường hợp chưa bàn giao cơ sở hạ tầng, nhà và chưa tính vào doanh thu tính thuế thu nhập doanh nghiệp trong năm thì người nộp thuế không tổng hợp vào hồ sơ khai quyết toán thuế thu nhập doanh nghiệp năm mà tổng hợp vào hồ sơ khai quyết toán thuế thu nhập doanh nghiệp khi bàn giao bất động sản đối với từng phần hoặc toàn bộ dự án\".\u003c/p\u003e\n  \u003cp id=\"216c15f0-2b6c-11f1-81ff-77653e3f5315\" class=\"prov-clause\" style=\"text-align: left;\"\u003e4. Điểm c khoản 6 Điều 8 được sửa đổi, bổ sung như sau:\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-size: 14px; text-align: justify;\"\u003e\"c) Lợi nhuận sau thuế còn lại sau khi trích lập các quỹ của doanh nghiệp do Nhà nước nắm giữ 100% vốn điều lệ. Cụ thể như sau:\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-size: 14px; text-align: justify;\"\u003eNgười nộp thuế phải tự xác định số lợi nhuận sau thuế còn lại sau khi trích lập các quỹ tạm nộp quý chậm nhất vào ngày 30 của quý tiếp theo quý phát sinh nghĩa vụ nộp và được trừ số lợi nhuận sau thuế còn lại sau khi trích lập các quỹ đã tạm nộp với số phải nộp theo quyết toán năm.\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-size: 14px; text-align: justify;\"\u003eTổng số lợi nhuận sau thuế còn lại sau khi trích lập các quỹ đã tạm nộp của 04 quý không được thấp hơn 80% số lợi nhuận sau thuế còn lại sau khi trích lập các quỹ theo quyết toán năm. Trường hợp người nộp thuế nộp thiếu so với số phải tạm nộp 04 quý thì phải nộp tiền chậm nộp tính trên số tiền nộp thiếu kể từ ngày tiếp sau ngày cuối cùng của thời hạn tạm nộp lợi nhuận sau thuế còn lại sau khi trích lập các quỹ quý 04 đến ngày liền kề trước ngày nộp số lợi nhuận sau thuế còn lại sau khi trích lập các quỹ còn thiếu vào ngân sách nhà nước.\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-size: 14px; text-align: justify;\"\u003eĐối với số lợi nhuận sau thuế còn lại sau khi trích lập các quỹ phải nộp tăng thêm khi thực hiện khai bổ sung do điều chỉnh kết quả xếp loại doanh nghiệp theo công bố của chủ sở hữu từ thời điểm ngày tiếp sau ngày cuối cùng của hạn nộp lợi nhuận sau thuế còn lại theo quyết toán năm đến thời hạn công bố kết quả xếp loại doanh nghiệp của chủ sở hữu theo quy định của cơ quan có thẩm quyền thì doanh nghiệp không phải nộp tiền chậm nộp.\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-size: 14px; text-align: justify;\"\u003eNgười đại diện phần vốn của doanh nghiệp do Nhà nước nắm giữ 100% vốn điều lệ có vốn góp tại công ty cổ phần, công ty trách nhiệm hữu hạn hai thành viên trở lên có trách nhiệm biểu quyết chi trả cổ tức, lợi nhuận khi có đủ các điều kiện theo quy định của Luật Doanh nghiệp đồng thời đề nghị, đôn đốc công ty cổ phần, công ty trách nhiệm hữu hạn hai thành viên trở lên nộp phần cổ tức, lợi nhuận được chia cho phần vốn góp của doanh nghiệp do Nhà nước nắm giữ 100% vốn điều lệ.\"\u003c/p\u003e\n  \u003cp id=\"216c15fa-2b6c-11f1-b207-0145cd77ef28\" class=\"prov-clause\" style=\"text-align: left;\"\u003e5. Điểm g khoản 6 Điều 8 được sửa đổi, bổ sung như sau:\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-size: 14px; text-align: justify;\"\u003e\"g) Thuế thu nhập doanh nghiệp của hãng vận tải nước ngoài tạm nộp quý và khai quyết toán năm. Tổng số thuế thu nhập doanh nghiệp đã tạm nộp của 04 quý không được thấp hơn 80% số thuế thu nhập doanh nghiệp phải nộp theo quyết toán năm. Trường hợp người nộp thuế nộp thiếu so với số thuế phải tạm nộp 04 quý thì phải nộp tiền chậm nộp tính trên số thuế nộp thiếu kể từ ngày tiếp sau ngày cuối cùng của thời hạn tạm nộp thuế thu nhập doanh nghiệp quý 04 đến ngày liền kề trước ngày nộp số thuế còn thiếu vào ngân sách nhà nước.\"\u003c/p\u003e\n  \u003cp id=\"216c3d00-2b6c-11f1-9f24-43ad5f2feea3\" class=\"prov-clause\" style=\"text-align: left;\"\u003e6. Điểm b khoản 4 Điều 11 được sửa đổi, bổ sung như sau:\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-size: 14px; text-align: justify;\"\u003e\"b) Đối với than khai thác và tiêu thụ nội địa:\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-size: 14px; text-align: justify;\"\u003eDoanh nghiệp có hoạt động khai thác và tiêu thụ than nội địa thông qua hình thức quản lý và giao cho các công ty con hoặc đơn vị phụ thuộc khai thác, chế biến và tiêu thụ thì đơn vị thực hiện nhiệm vụ tiêu thụ than thực hiện khai thuế cho toàn bộ số thuế bảo vệ môi trường phát sinh đối với than khai thác thuộc diện chịu thuế và nộp hồ sơ khai thuế đến cơ quan thuế quản lý trực tiếp kèm theo Bảng xác định số thuế phải nộp cho từng địa phương nơi có công ty khai thác than đóng trụ sở theo quy định của Bộ trưởng Bộ Tài chính.\"\u003c/p\u003e\n  \u003cp id=\"216c6410-2b6c-11f1-a6a9-f965d63f969f\" class=\"prov-clause\" style=\"text-align: left;\"\u003e7. Bổ sung khoản 8 Điều 27 như sau:\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-size: 14px; text-align: justify;\"\u003e\"8. Tổ chức được thành lập và hoạt động theo pháp luật Việt Nam là chủ sở hữu sàn thương mại điện tử có trách nhiệm cung cấp đầy đủ, chính xác và đúng hạn theo quy định cho cơ quan thuế thông tin của thương nhân, tổ chức, cá nhân có tiến hành một phần hoặc toàn bộ quy trình mua bán hàng hóa, dịch vụ trên sàn giao dịch thương mại điện tử bao gồm: tên người bán hàng, mã số thuế hoặc số định danh cá nhân hoặc chứng minh nhân dân hoặc căn cước công dân hoặc hộ chiếu, địa chỉ, số điện thoại liên lạc; doanh thu bán hàng thông qua chức năng đặt hàng trực tuyến của sàn. Việc cung cấp thông tin được thực hiện định kỳ hằng quý chậm nhất vào ngày cuối cùng của tháng đầu quý sau, bằng phương thức điện tử, qua Cổng thông tin điện tử của Tổng cục Thuế theo định dạng dữ liệu do Tổng cục Thuế công bố.\"\u003c/p\u003e\n  \u003cp id=\"216cb230-2b6c-11f1-9ab3-0555a5c7fc70\" class=\"prov-clause\" style=\"text-align: left;\"\u003e8. Bổ sung khoản 4 Điều 43 như sau:\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-size: 14px; text-align: justify;\"\u003e\"4. Quy định tại điểm d.1 khoản 5 Điều 7 Nghị định số 126/2020/NĐ-CP được thực hiện kể từ ngày 01 tháng 01 năm 2023. Trường hợp cá nhân nhận cổ tức bằng chứng khoán, cá nhân là cổ đông hiện hữu nhận thưởng bằng chứng khoán được ghi nhận vào tài khoản chứng khoán của nhà đầu tư từ ngày 31 tháng 12 năm 2022 trở về trước và chưa được các công ty chứng khoán, ngân hàng thương mại nơi cá nhân mở tài khoản lưu ký, công ty quản lý quỹ nơi cá nhân uỷ thác danh mục đầu tư, tổ chức phát hành chứng khoán khai thuế thay, nộp thuế thay thì cá nhân thực hiện khai, nộp thuế thu nhập cá nhân theo quy định của pháp luật thuế Thu nhập cá nhân và không bị xử phạt vi phạm hành chính về chậm nộp hồ sơ khai thuế, không bị tính tiền chậm nộp (nếu có) theo quy định tại khoản 11 Điều 16 Luật Quản lý thuế từ ngày 05 tháng 12 năm 2020 đến hết ngày 31 tháng 12 năm 2022.\"\u003c/p\u003e\n  \u003cp id=\"216cd940-2b6c-11f1-a991-69764f32f346\" class=\"prov-clause\" style=\"font-size: 14px; text-align: justify;\"\u003e9. Ban hành kèm theo Nghị định này Thông báo về việc ngừng sử dụng hóa đơn theo Mẫu số 04-1/CC thay thế Mẫu số 04-1/CC tại Phụ lục III ban hành kèm theo Nghị định số 126/2020/NĐ-CP ngày 19 tháng 10 năm 2020 của Chính phủ quy định chi tiết một số điều của Luật Quản lý thuế.\u003c/p\u003e\n  \u003cp id=\"216d2760-2b6c-11f1-9450-91b6d573c459\" class=\"prov-article\" style=\"text-align: left;\"\u003e\u003cstrong\u003eĐiều 2. Tổ chức thực hiện và hiệu lực thi hành\u003c/strong\u003e\u003c/p\u003e\n  \u003cp id=\"216d4e70-2b6c-11f1-a494-b939273c073a\" class=\"prov-clause\" style=\"text-align: left;\"\u003e1. Nghị định này có hiệu lực thi hành kể từ ngày ký ban hành. Quy định tại khoản 3, 4, 5 Điều 1 Nghị định này được áp dụng từ kỳ tính thuế năm 2021 như sau:\u003c/p\u003e\n  \u003cp id=\"216d7580-2b6c-11f1-8aae-bdbf53e6e97f\" class=\"prov-item\" style=\"font-size: 14px; text-align: justify;\"\u003ea) Tính đến ngày Nghị định này có hiệu lực thi hành người nộp thuế có số thuế tạm nộp 03 quý đầu kỳ tính thuế năm 2021 không thấp hơn 75% số phải nộp theo quyết toán năm, thì không áp dụng quy định tỷ lệ tạm nộp 04 quý tại khoản 3, 4, 5 Điều 1 Nghị định này.\u003c/p\u003e\n  \u003cp id=\"216d9c90-2b6c-11f1-8a53-77b8213379dc\" class=\"prov-item\" style=\"font-size: 14px; text-align: justify;\"\u003eb) Tính đến ngày Nghị định này có hiệu lực thi hành, người nộp thuế có số thuế tạm nộp 03 quý đầu kỳ tính thuế năm 2021 thấp hơn 75% số phải nộp theo quyết toán năm, thì được áp dụng tỷ lệ tạm nộp 04 quý quy định tại khoản 3, 4, 5 Điều 1 Nghị định này nếu không tăng thêm số tiền chậm nộp.\u003c/p\u003e\n  \u003cp class=\"prov-content\" style=\"font-size: 14px; text-align: justify;\"\u003eTrường hợp cơ quan có thẩm quyền thực hiện thanh tra, kiểm tra đã tính tiền chậm nộp theo quy định tại điểm b, điểm c, điểm g khoản 6 Điều 8 Nghị định số 126/2020/NĐ-CP và khi áp dụng quy định tỷ lệ tạm nộp 04 quý tại khoản 3, 4, 5 Điều 1 Nghị định này được giảm số tiền chậm nộp thì người nộp thuế có văn bản đề nghị điều chỉnh giảm tiền chậm nộp theo Mẫu số 01/GTCN tại Phụ lục ban hành kèm theo Nghị định này gửi cơ quan thuế nơi phát sinh tiền chậm nộp (là cơ quan thuế quản lý trực tiếp hoặc cơ quan thuế có hoạt động được hưởng ưu đãi thuế thu nhập doanh nghiệp). Sau khi điều chỉnh giảm mà có số tiền chậm nộp nộp thừa thì thực hiện theo quy định tại Điều 60 và Chương VIII Luật Quản lý thuế số 38/2019/QH14 và các văn bản hướng dẫn thi hành.\u003c/p\u003e\n  \u003cp id=\"216dc3a0-2b6c-11f1-ac71-214173df5a08\" class=\"prov-clause\" style=\"font-size: 14px; text-align: justify;\"\u003e2. Bộ Tài chính chịu trách nhiệm chỉ đạo, tổ chức triển khai Nghị định này.\u003c/p\u003e\n  \u003cp id=\"216deab0-2b6c-11f1-9fa5-2160778a7e0a\" class=\"prov-clause\" style=\"font-size: 14px; text-align: justify;\"\u003e3. Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân tỉnh, thành phố trực thuộc trung ương và các doanh nghiệp, tổ chức, hộ kinh doanh, cá nhân có liên quan chịu trách nhiệm thi hành Nghị định này.\u003c/p\u003e\n  \u003ctable style=\"border:none !important; border-width:0 !important; border-style:none !important; outline:none !important; box-shadow:none !important; border-collapse:collapse; width:100% !important; table-layout:fixed !important;\" id=\"216deab0-2b6c-11f1-9fa5-2160778a7e0a\" class=\"document-recipient-signature\"\u003e\n   \u003ccolgroup\u003e\n    \u003ccol style=\"width: 50%;\"\u003e\n    \u003ccol style=\"width: 50%;\"\u003e\n   \u003c/colgroup\u003e\n   \u003ctbody\u003e\n    \u003ctr style=\"border:none !important; border-width:0 !important; border-style:none !important; outline:none !important; box-shadow:none !important;\"\u003e\n     \u003ctd style=\"width:50% !important; text-align:left !important; border:none !important; border-width:0 !important; border-style:none !important; outline:none !important; box-shadow:none !important; vertical-align:top !important;\"\u003e\u0026nbsp;\u003c/td\u003e\n     \u003ctd style=\"width:50% !important; text-align:center !important; border:none !important; border-width:0 !important; border-style:none !important; outline:none !important; box-shadow:none !important; vertical-align:top !important;\"\u003e\n      \u003cp class=\"prov-content\" style=\"text-align: center;\"\u003e\u003cstrong\u003eTM. CHÍNH PHỦ\u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" style=\"text-align: center;\"\u003e\u003cstrong\u003eKT. THỦ TƯỚNG\u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" style=\"text-align: center;\"\u003e\u003cstrong\u003e\u003cem\u003e\u0026nbsp; (Đã ký)\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\n      \u003cp class=\"prov-content\" style=\"text-align: center;\"\u003e\u003cstrong\u003eLê Minh Khái\u003c/strong\u003e\u003c/p\u003e\u003c/td\u003e\n    \u003c/tr\u003e\n   \u003c/tbody\u003e\n  \u003c/table\u003e\n  \u003cp class=\"prov-content\" style=\"font-size: 14px; font-family: 'Times New Roman', Times, serif; text-align: right;\"\u003e\u0026nbsp;\u003c/p\u003e\n  \u003cp align=\"center\" style=\"display:block; margin-top:450px !important; padding-top:0 !important;\"\u003e\u003cstrong style=\"margin-top:0 !important;\"\u003ePhụ lục\u003c/strong\u003e\u003c/p\u003e\n  \u003cp align=\"center\"\u003e\u003cem\u003e(Kèm theo Nghị định số 91/2022/NĐ-CP ngày 30 tháng 10 năm 2022 của Chính phủ)\u003c/em\u003e\u003c/p\u003e\n  \u003ctable style=\"border-collapse:collapse; width:100%; height:auto !important; min-height:0 !important;\" border=\"1\"\u003e\n   \u003ccolgroup\u003e\n    \u003ccol style=\"width: 49.9307%;\"\u003e\n    \u003ccol style=\"width: 49.9307%;\"\u003e\n   \u003c/colgroup\u003e\n   \u003ctbody\u003e\n    \u003ctr style=\"height:auto !important; min-height:0 !important;\"\u003e\n     \u003ctd style=\"height:auto !important; min-height:0 !important; vertical-align:top !important; padding-top:0 !important; padding-bottom:0 !important;\"\u003eMẫu số 04-1/CC\u003c/td\u003e\n     \u003ctd style=\"height:auto !important; min-height:0 !important; vertical-align:top !important; padding-top:0 !important; padding-bottom:0 !important;\"\u003eThông báo về việc ngừng sử dụng hóa đơn\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr style=\"height:auto !important; min-height:0 !important;\"\u003e\n     \u003ctd style=\"height:
